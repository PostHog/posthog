version: 1
owners:
    - team-context-mcp
rules:
    - match:
          - '/api/generated.ts'
          - '/**/*.generated.ts'
          - '/generated/'
          - '/tools/generated/'
          - '/ui-apps/generated/'
          - '/ui-apps/apps/generated/'
      status: generated
    - match:
          - '/generated/mcp_analytics/'
          - '/hono/analytics.ts'
          - '/lib/posthog/analytics.ts'
          - '/tools/generated/mcp_analytics.ts'
      owners: mcp-analytics
    - match:
          - '/generated/ai_observability/'
          - '/tools/aiObservability/'
          - '/tools/generated/ai_observability.ts'
          - '/ui-apps/apps/generated/llm-costs.tsx'
      owners: team-ai-observability
