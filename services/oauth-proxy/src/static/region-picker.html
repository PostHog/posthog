<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Authenticate with PostHog</title>
    <link rel="preload" href="/static/fonts/RoundHog.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/RoundHog-Medium.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/RoundHog-SemiBold.woff2" as="font" type="font/woff2" crossorigin>

    <style>
        /* RoundHog is the app's UI font. The faces are served by this worker from
           @posthog/brand, so the page needs no third-party font host. Weight mapping follows
           the app: Regular 400, Medium 500, SemiBold 700. */
        @font-face {
            font-family: RoundHog;
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('/static/fonts/RoundHog.woff2') format('woff2');
        }

        @font-face {
            font-family: RoundHog;
            font-style: normal;
            font-weight: 500;
            font-display: swap;
            src: url('/static/fonts/RoundHog-Medium.woff2') format('woff2');
        }

        @font-face {
            font-family: RoundHog;
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url('/static/fonts/RoundHog-SemiBold.woff2') format('woff2');
        }

        /* Values mirror the login scene (frontend/src/scenes/authentication/shared/authScene).
           This page is served by a Cloudflare Worker, so it cannot import the app's tokens. */
        :root {
            --font-sans:
                RoundHog, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', helvetica, arial,
                sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
            --font-mono: ui-monospace, 'SFMono-Regular', 'SF Mono', 'Menlo', 'Consolas', 'Liberation Mono', monospace;
            --text-primary: #111;
            --text-secondary: #4b5563;
            --text-footer: #404040;
            --card-bg: #f6f5f0;
            --card-border: #e3e0d4;
            --control-bg: #fff;
            --control-border: #ccc;
            --control-border-hover: #aaa;
            --control-frame: #e1dddd;
            --accent: #f7a501;
            --accent-blue: #3280ff;
            --accent-border: #b17816;
            --accent-border-hover: #8e5b03;
            --radius: 6px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            padding: 72px 16px;
            font-family: var(--font-sans);
            color: var(--text-primary);
            background-color: #b5cd8f;
            background-image:
                radial-gradient(80% 70% at 50% 30%, rgb(255 253 240 / 45%), transparent 70%),
                linear-gradient(180deg, #cfe0ae 0%, #b5cd8f 55%, #9dbb78 100%);
            background-repeat: no-repeat;
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }

        /* Mono notes in the corner of the garden, the same decoration the login scene types out. */
        #notes {
            position: absolute;
            top: clamp(20px, 4vh, 40px);
            left: clamp(20px, 4vw, 44px);
            min-height: 2.6em;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 19.5px;
            color: rgb(45 74 22 / 65%);
        }

        #notes div {
            white-space: pre;
        }

        #notes div:first-child {
            font-weight: 600;
        }

        #caret {
            display: inline-block;
            width: 8px;
            height: 1.05em;
            margin-left: 2px;
            vertical-align: -2px;
            background: var(--accent);
            border-radius: 1px;
            animation: blink 1.05s steps(1) infinite;
        }

        @media (max-width: 575px) {
            #notes {
                display: none;
            }
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 27rem;
            max-width: 100%;
            margin: 0 auto;
        }

        #logo {
            display: block;
            width: auto;
            height: 28px;
            margin-bottom: 16px;
        }

        @media (min-width: 576px) {
            #logo {
                height: 40px;
            }
        }

        article {
            width: 100%;
            padding: 32px 36px;
            text-align: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 0 16px 40px rgb(30 50 10 / 25%);
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            line-height: 25px;
            letter-spacing: -0.5px;
        }

        h1+p {
            margin-top: 8px;
            font-size: 14px;
            line-height: 20px;
            color: var(--text-secondary);
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }

        /* The 3D frame the app's LemonButton draws under every button. */
        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 49px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            text-decoration: none;
            cursor: pointer;
            background: var(--control-bg);
            border: 1px solid var(--control-border);
            border-radius: var(--radius);
            box-shadow: 0 3px 0 0 var(--control-frame);
            transition: border-color 200ms ease, box-shadow 200ms ease, translate 200ms ease;
        }

        .btn:hover {
            border-color: var(--control-border-hover);
        }

        .btn:active {
            translate: 0 3px;
            box-shadow: none;
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent-border);
            outline-offset: 2px;
        }

        .flag {
            font-size: 18px;
            line-height: 1;
        }

        /* Corner badge on the region the browser was last signed in to. */
        .last-used {
            position: absolute;
            top: 6px;
            right: 8px;
            padding: 1px 6px;
            font-size: 11px;
            font-weight: 500;
            line-height: 16px;
            color: var(--accent-blue);
            background: rgb(50 128 255 / 10%);
            border-radius: 4px;
        }

        /* Too little width left of the badge for the centered region name to clear it, so the
           badge joins the row instead, and wraps below the name when even that does not fit. */
        @media (max-width: 575px) {
            .btn {
                flex-wrap: wrap;
            }

            .last-used {
                position: static;
            }
        }

        .btn--primary {
            background: var(--accent);
            border-color: var(--accent-border);
            box-shadow: 0 3px 0 0 var(--accent-border);
        }

        .btn--primary:hover {
            border-color: var(--accent-border-hover);
        }

        .btn--small {
            min-height: 36px;
            font-size: 14px;
        }

        noscript p,
        #hint-default {
            margin-top: 24px;
            font-size: 13px;
            line-height: 19px;
            color: var(--text-secondary);
        }

        noscript p a,
        #hint-default a {
            color: var(--text-secondary);
            text-underline-offset: 2px;
        }

        noscript p a:hover,
        #hint-default a:hover {
            color: var(--text-primary);
        }

        footer {
            margin-top: 20px;
            font-size: 14px;
            line-height: 20px;
            color: var(--text-footer);
        }

        footer a {
            color: inherit;
            text-underline-offset: 2px;
        }

        footer a:hover {
            color: var(--text-primary);
        }

        @media (prefers-reduced-motion: no-preference) {
            main {
                animation: rise 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .btn,
            #caret {
                transition: none;
                animation: none;
            }

            .btn:active {
                translate: none;
            }
        }

        @keyframes blink {

            0%,
            50% {
                opacity: 1;
            }

            50.01%,
            100% {
                opacity: 0;
            }
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>

<body>

        <article>
            <h1>Authenticate with PostHog</h1>

            <p>Where is your PostHog project hosted?</p>

            <nav aria-label="Select PostHog region">
                <a class="btn" id="btn-us" href="#">
                    <span aria-hidden="true" class="flag">&#x1F1FA;&#x1F1F8;</span>
                    US Cloud
                    <span class="last-used" hidden>Last used</span>
                </a>
                <a class="btn" id="btn-eu" href="#">
                    <span aria-hidden="true" class="flag">&#x1F1EA;&#x1F1FA;</span>
                    EU Cloud
                    <span class="last-used" hidden>Last used</span>
                </a>
            </nav>

            <noscript>
                <p>Enable JavaScript to continue. Your OAuth login parameters are required from this page.</p>
            </noscript>

            <p id="hint-default">
                Not sure? Check your PostHog URL. <br />
                It should be either
                <a href="https://us.posthog.com" rel="noopener noreferrer" target="_blank">us.posthog.com</a> or
                <a href="https://eu.posthog.com" rel="noopener noreferrer" target="_blank">eu.posthog.com</a>
            </p>

        </article>

        <footer>
            &copy; <span id="year"></span> <a href="https://posthog.com">posthog.com</a>
        </footer>
    </main>
    <script>
        // Write the current year to the footer
        document.getElementById('year').textContent = new Date().getFullYear();

        var params = new URLSearchParams(window.location.search);
        function buildUrl(region) {
            params.set('_region', region);
            return '/oauth/authorize/?' + params.toString();
        }
        document.getElementById('btn-us').href = buildUrl('us');
        document.getElementById('btn-eu').href = buildUrl('eu');

        var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Type the second corner note, matching the login scene's typewriter.
        (function () {
            var line = '// choose your data region';
            var target = document.getElementById('notes').lastElementChild;
            var caret = document.getElementById('caret');
            if (prefersReducedMotion) {
                target.textContent = line;
                target.appendChild(caret);
                return;
            }
            var shown = 0;
            var id = setInterval(function () {
                shown++;
                target.textContent = line.slice(0, shown);
                target.appendChild(caret);
                if (shown >= line.length) {
                    clearInterval(id);
                }
            }, 42);
        })();

        // Mark the region this browser last used. The worker already redirected anyone with a
        // single live session (see soleLiveRegion in handlers/authorize.ts), so reaching this page
        // means the answer is genuinely ambiguous and the choice is the visitor's to make.
        (function () {
            var cookie = document.cookie.split('; ').find(function (c) { return c.startsWith('ph_current_instance='); });
            if (!cookie) return;
            var value = decodeURIComponent(cookie.substring(cookie.indexOf('=') + 1)).replace(/"/g, '');
            try {
                var hostname = new URL(value).hostname;
                var region = hostname === 'us.posthog.com' ? 'us' : hostname === 'eu.posthog.com' ? 'eu' : null;
                if (region) {
                    document.querySelector('#btn-' + region + ' .last-used').hidden = false;
                }
            } catch (e) { /* not a region we know */ }
        })();

    </script>
