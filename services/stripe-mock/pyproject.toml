[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stripe-mock"
version = "0.1.0"
description = "Local Stripe mock API for PostHog data warehouse import testing"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.135.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "structlog==26.1.0",
    "python-multipart==0.0.33",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "pytest-asyncio==1.4.1.post1",
]
