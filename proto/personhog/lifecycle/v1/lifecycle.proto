syntax = "proto3";
package personhog.lifecycle.v1;

import "personhog/types/v1/person.proto";

// DeletePersonsRequest identifies the persons to destroy. Arguments are
// already person ids — there is no identity to resolve first, so the RPC
// goes straight into the saga runner.
message DeletePersonsRequest {
  int64 team_id = 1;
  // posthog_person.id values to delete. Max 250 per request.
  repeated int64 person_ids = 2;
  // Caller-generated operation id (UUID string). Persisted with the
  // operation: a retried call carrying the same op_id attaches to the
  // existing operation and returns its recorded outcome instead of starting
  // a new one, so callers must reuse the op_id across retries.
  string op_id = 3;
}

enum DeletePersonOutcome {
  DELETE_PERSON_OUTCOME_UNSPECIFIED = 0;
  // The person was destroyed (or the recorded outcome of a completed
  // operation says it was).
  DELETE_PERSON_OUTCOME_DELETED = 1;
  // Another live lifecycle operation holds this person's mark; nothing was
  // done for this person. Retry after that operation finishes.
  DELETE_PERSON_OUTCOME_SKIPPED_CONFLICT = 2;
  // No live person row with this id exists in the team.
  DELETE_PERSON_OUTCOME_NOT_FOUND = 3;
}

message DeletePersonResult {
  int64 person_id = 1;
  DeletePersonOutcome outcome = 2;
}

message DeletePersonsResponse {
  // Echo of the request op_id.
  string op_id = 1;
  // One result per requested person id, same order as the request.
  repeated DeletePersonResult results = 2;
}

// One source pair of a MergePersons call.
message MergeSource {
  string source_distinct_id = 1;
  // The $identify event that contributed this pair. Carried for warning
  // correlation on the caller's side; the merge itself never reads it.
  string event_uuid = 2;
}

// MergePersonsRequest merges every source distinct id's person into the
// target distinct id's person. Sources are ordered and deduped by the
// caller; order defines property precedence (earlier pairs beat later
// pairs, the target beats all).
message MergePersonsRequest {
  int64 team_id = 1;
  string target_distinct_id = 2;
  // Max 250 sources per request. Duplicate source distinct ids are
  // rejected; a source equal to the target classifies as a no-op, not an
  // error.
  repeated MergeSource sources = 3;
  // JSON-encoded maps from the merge event: $set overrides on conflict,
  // $set_once fills only still-absent keys. Applied to the survivor.
  bytes event_set = 4;
  bytes event_set_once = 5;
  // Caller-generated operation id (UUID string), typically the executing
  // event's uuid. A retried call carrying the same op_id returns the
  // recorded outcome of the original run instead of merging again, so
  // callers must reuse the op_id across retries.
  string op_id = 6;
  // $merge_dangerously legally merges already-identified sources;
  // $identify does not. Off by default.
  bool allow_identified_sources = 7;
  // Per-source distinct-id count guard: a source person with more distinct
  // ids than this is skipped (SKIPPED_MOVE_LIMIT) for the caller's
  // merge-mode policy to handle. Required, at least 1; unlimited is not a
  // supported mode.
  optional int64 move_limit = 8;
}

enum MergeSourceOutcome {
  MERGE_SOURCE_OUTCOME_UNSPECIFIED = 0;
  // The source person was merged into the survivor and destroyed.
  MERGE_SOURCE_OUTCOME_MERGED = 1;
  // The source distinct id already resolves to the survivor. Nothing to do.
  MERGE_SOURCE_OUTCOME_NOOP_SAME_PERSON = 2;
  // The source distinct id had no person, so it was attached to the
  // survivor with a plain mapping insert. Reserved for the personless-free
  // world; nothing returns it yet (unresolved sources are ERROR for now).
  MERGE_SOURCE_OUTCOME_ATTACHED = 3;
  // The source distinct id is on the illegal-id list ('anonymous',
  // 'undefined', ...). Never merged.
  MERGE_SOURCE_OUTCOME_SKIPPED_ILLEGAL = 4;
  // The source person is already identified and the request did not set
  // allow_identified_sources.
  MERGE_SOURCE_OUTCOME_SKIPPED_ALREADY_IDENTIFIED = 5;
  // Another live lifecycle operation holds this person (or the source
  // resolved differently between classification and claim). Retryable.
  MERGE_SOURCE_OUTCOME_SKIPPED_CONFLICT = 6;
  // The source person has more distinct ids than the request's move_limit.
  MERGE_SOURCE_OUTCOME_SKIPPED_MOVE_LIMIT = 7;
  // The pair could not be handled; details in server logs. Currently also
  // the outcome for sources that resolve to no person (cases 1/4 of the
  // merge contract are not implemented yet).
  MERGE_SOURCE_OUTCOME_ERROR = 8;
}

message MergeSourceResult {
  string source_distinct_id = 1;
  MergeSourceOutcome outcome = 2;
}

message MergePersonsResponse {
  // Echo of the request op_id.
  string op_id = 1;
  // The surviving person's document. Authoritative (the folded document
  // the leader produced) when a merge ran; the resolved person otherwise.
  // Absent when the operation aborted without merging anything.
  optional personhog.types.v1.Person survivor = 2;
  // One result per requested source, same order as the request.
  repeated MergeSourceResult results = 3;
}

// PersonHogLifecycle runs person-destroying operations (delete and merge)
// as durable sagas: all saga state lives in the lifecycle_op tables on
// the persons primary, the service itself stays stateless.
//
// Ack semantics: the RPC drives the saga to Completed before responding —
// an OK response means the operation's sync-plane work is committed and the
// owning leaders have produced the death documents. On a crash or timeout
// the caller retries with the same op_id; the retry attaches to the
// existing operation, finishes any incomplete tail steps, and returns the
// recorded outcome. A background sweeper backstops abandoned operations.
//
// Co-served on the identity server, but a separate service so callers are
// insulated from any future split.
service PersonHogLifecycle {
  rpc DeletePersons(DeletePersonsRequest) returns (DeletePersonsResponse);

  // Merge source persons into the target distinct id's person. The
  // service resolves and classifies every pair: same-person pairs settle
  // inline, distinct-person pairs run the durable merge saga (fence the
  // sources, fold their sealed documents into the target, repoint distinct
  // ids, tombstone the sources, produce death documents). An unresolved
  // TARGET refuses the call FAILED_PRECONDITION; an illegal target
  // distinct id refuses it INVALID_ARGUMENT before any durable work.
  rpc MergePersons(MergePersonsRequest) returns (MergePersonsResponse);
}
