syntax = "proto3";
package personhog.types.v1;

import "personhog/types/v1/common.proto";

// Person represents a user profile with properties
message Person {
  int64 id = 1;
  string uuid = 2;
  int64 team_id = 3;
  bytes properties = 4;
  bytes properties_last_updated_at = 5;
  bytes properties_last_operation = 6;
  // Epoch milliseconds, as are all timestamps in this message.
  int64 created_at = 7;
  int64 version = 8;
  bool is_identified = 9;
  optional bool is_user_id = 10;
  // Epoch milliseconds (matching created_at); the writer decodes it as such.
  optional int64 last_seen_at = 11;
  // True on a death document: the changelog record the leader produces when
  // a lifecycle saga destroys the person (version = sealed_version + 1).
  // Consumers treat the person as gone; the writer projects it as the
  // Postgres tombstone. proto3 default (false) keeps old records live.
  bool is_deleted = 12;
}

// DistinctIdWithVersion pairs a distinct_id with its version for consistency tracking
message DistinctIdWithVersion {
  string distinct_id = 1;
  optional int64 version = 2;
}

// PersonWithDistinctIds pairs a lookup distinct_id with its resolved person
message PersonWithDistinctIds {
  string distinct_id = 1;
  optional Person person = 2;
}

// PersonDistinctIds contains all distinct_ids for a single person
message PersonDistinctIds {
  int64 person_id = 1;
  repeated DistinctIdWithVersion distinct_ids = 2;
}

// PersonWithTeamDistinctId pairs a cross-team lookup key with its resolved person
message PersonWithTeamDistinctId {
  TeamDistinctId key = 1;
  optional Person person = 2;
}

message GetPersonRequest {
  int64 team_id = 1;
  int64 person_id = 2;
  ReadOptions read_options = 3;
}

message GetPersonResponse {
  optional Person person = 1;
}

message GetPersonsRequest {
  int64 team_id = 1;
  // Max 250 per request.
  repeated int64 person_ids = 2;
  ReadOptions read_options = 3;
}

message PersonsResponse {
  repeated Person persons = 1;
  repeated int64 missing_ids = 2;
}

message GetPersonByUuidRequest {
  int64 team_id = 1;
  string uuid = 2;
  ReadOptions read_options = 3;
}

message GetPersonsByUuidsRequest {
  int64 team_id = 1;
  // Max 250 per request.
  repeated string uuids = 2;
  ReadOptions read_options = 3;
}

message GetPersonByDistinctIdRequest {
  int64 team_id = 1;
  string distinct_id = 2;
  ReadOptions read_options = 3;
}

message GetPersonsByDistinctIdsInTeamRequest {
  int64 team_id = 1;
  // Max 250 per request.
  repeated string distinct_ids = 2;
  ReadOptions read_options = 3;
}

message PersonsByDistinctIdsInTeamResponse {
  repeated PersonWithDistinctIds results = 1;
}

message GetPersonsByDistinctIdsRequest {
  // Max 250 per request.
  repeated TeamDistinctId team_distinct_ids = 1;
  ReadOptions read_options = 2;
}

message PersonsByDistinctIdsResponse {
  repeated PersonWithTeamDistinctId results = 1;
}

message GetDistinctIdsForPersonRequest {
  int64 team_id = 1;
  int64 person_id = 2;
  ReadOptions read_options = 3;
  optional int64 limit = 4;  // Max distinct IDs returned. 0 or absent = no limit.
}

message GetDistinctIdsForPersonResponse {
  repeated DistinctIdWithVersion distinct_ids = 1;
}

message GetDistinctIdsForPersonsRequest {
  int64 team_id = 1;
  repeated int64 person_ids = 2;
  ReadOptions read_options = 3;
  optional int64 limit_per_person = 4;  // Max distinct IDs returned per person. 0 or absent = no limit.
}

message GetDistinctIdsForPersonsResponse {
  repeated PersonDistinctIds person_distinct_ids = 1;
}

// UpdatePersonPropertiesRequest describes a property update for a person
// identified by team_id + person_id. The caller resolves distinct_id → person_id
// before sending. The leader merges property diffs ($set, $set_once, $unset)
// into the cached state.
message UpdatePersonPropertiesRequest {
  int64 team_id = 1;
  int64 person_id = 2;
  // The event name that triggered this update (e.g. "$set", "$identify",
  // "$pageview"). The leader checks it against a small denylist of events
  // that must never write person properties and otherwise ignores it.
  // Callers folding many events into one request filter denylisted
  // events' ops at fold time and send a representative name.
  string event_name = 3;
  // JSON-encoded map of properties to set (overwrites existing values).
  bytes set_properties = 4;
  // JSON-encoded map of properties to set only if not already present.
  // Resolved by the leader against authoritative state under the
  // per-person lock — callers must not pre-resolve set_once against a
  // fetched snapshot, or a concurrent writer's earlier value gets
  // clobbered. When the same key appears here and in set_properties,
  // set wins.
  bytes set_once_properties = 5;
  // Property keys to remove from the person.
  repeated string unset_properties = 6;
  // OR-merged: true marks the person identified; false and absent are
  // no-ops (identification never reverts through this RPC). The
  // false→true transition counts as a change and produces a changelog
  // record on its own.
  optional bool is_identified = 7;
  // Epoch milliseconds (matching Person.last_seen_at). The leader floors
  // the value to the hour (ingestion's own granularity) and max-merges,
  // so the stored value only ever advances. An advance is a change that
  // produces a changelog record on its own — matching ingestion's direct
  // write path, which persists a last-seen-only advance — and the
  // flooring bounds record volume at one per person-hour regardless of
  // the caller's precision.
  optional int64 last_seen_at = 8;
}

message UpdatePersonPropertiesResponse {
  // The person after applying the update (if the person was found).
  optional Person person = 1;
  // Whether any properties were actually changed.
  bool updated = 2;
}

// DeletePersonsRequest deletes persons from Postgres by UUID.
// Also deletes associated posthog_persondistinctid rows (FK is NO ACTION).
// posthog_featureflaghashkeyoverride rows cascade automatically at the DB level.
message DeletePersonsRequest {
  int64 team_id = 1;
  // Person UUIDs to delete. Max 1000 per request.
  repeated string person_uuids = 2;
}

message DeletePersonsResponse {
  int64 deleted_count = 1;
}

// DeletePersonsBatchForTeamRequest deletes up to batch_size persons for a team.
// Also deletes associated posthog_persondistinctid rows (FK is NO ACTION).
// posthog_featureflaghashkeyoverride rows cascade automatically at the DB level.
// Callers should loop until deleted_count is 0.
message DeletePersonsBatchForTeamRequest {
  int64 team_id = 1;
  // Max persons to delete per call. Must be > 0 and <= 50000.
  int64 batch_size = 2;
}

message DeletePersonsBatchForTeamResponse {
  // Number of persons deleted. 0 means no more persons to delete.
  int64 deleted_count = 1;
}

// SplitPersonRequest splits specific distinct_ids off of a person onto new persons.
// Each distinct_id gets a new person with a deterministic UUID (UUIDv5 from team_id:distinct_id).
// The operation is atomic per request: all splits succeed or none do.
// Python resolves which distinct IDs to split before calling this RPC.
// Limited to 250 distinct_ids per request (server-enforced) to bound row-lock
// hold time and message size — callers batch larger splits across requests,
// which is safe because the deterministic UUIDs make each request idempotent.
message SplitPersonRequest {
  int64 team_id = 1;
  int64 person_id = 2;
  // Distinct IDs to split off. Must all belong to the specified person; duplicates are rejected.
  repeated string distinct_ids_to_split = 3;
}

// SplitResult describes a single distinct_id that was split onto a new person.
message SplitResult {
  string distinct_id = 1;
  string new_person_uuid = 2;
  int64 new_person_version = 3;
  int64 pdi_version = 4;
  // Epoch millis. For pre-existing persons (idempotent re-split) this is the
  // original created_at, not the time of this request — callers publish it
  // downstream (e.g. to ClickHouse) so it must match the Postgres row.
  int64 new_person_created_at_ms = 5;
}

message SplitPersonResponse {
  // Results are in the same order as distinct_ids_to_split in the request.
  repeated SplitResult splits = 1;
}

// SetPersonDistinctIdVersionFloorRequest bumps a person_distinct_id row's version.
// Used by the undelete repair flow to revive a soft-deleted distinct_id: raising the
// Postgres version keeps the plugin-server from later emitting a lower version that
// ClickHouse would ignore. The update is guarded so it never lowers a version: the row
// is updated only when its stored version is below min_version.
message SetPersonDistinctIdVersionFloorRequest {
  int64 team_id = 1;
  string distinct_id = 2;
  // Minimum version to set; applied only if the stored version is lower.
  int64 min_version = 3;
}

message SetPersonDistinctIdVersionFloorResponse {
  // The person the distinct_id maps to. Absent when the distinct_id does not exist
  // (it has not been re-used yet). Present whenever the distinct_id exists, even if the
  // guard left the version unchanged.
  optional Person person = 1;
}

// SetPersonVersionFloorRequest bumps a person's version. Used by the undelete repair
// flow to revive a soft-deleted person in ClickHouse. The update is guarded so it
// never lowers a version: the row is updated only when its stored version is below
// min_version.
message SetPersonVersionFloorRequest {
  int64 team_id = 1;
  int64 person_id = 2;
  // Minimum version to set; applied only if the stored version is lower.
  int64 min_version = 3;
}

message SetPersonVersionFloorResponse {
  // True if a row was updated (the stored version was below min_version).
  bool updated = 1;
}

// FencePersonRequest freezes a person for a lifecycle operation (see
// PersonHogLeader.FencePerson). op_id is the saga's caller-supplied UUID;
// op_type selects the rejection surfaced to writers while the fence holds.
message FencePersonRequest {
  int64 team_id = 1;
  int64 person_id = 2;
  string op_id = 3;
  LifecycleOpType op_type = 4;
}

// The kind of lifecycle operation — mirrors lifecycle_op.op_type. The
// canonical string mapping lives on this enum's impl in personhog-proto;
// derive from it everywhere instead of repeating the literals.
enum LifecycleOpType {
  LIFECYCLE_OP_TYPE_UNSPECIFIED = 0;
  LIFECYCLE_OP_TYPE_DELETE = 1;
  LIFECYCLE_OP_TYPE_MERGE = 2;
}

message FencePersonResponse {
  // The sealed state: the person's final word — no write can follow it
  // while the fence holds. Delete uses sealed.version only; merge seals
  // the full document (properties included).
  //
  // Failure is reported through the gRPC status, never in-band:
  // FAILED_PRECONDITION with x-person-fenced metadata when another op
  // holds the person, NOT_FOUND when the person is destroyed,
  // FAILED_PRECONDITION when this pod does not serve the partition (the
  // retry re-routes), and RESOURCE_EXHAUSTED when the fence map is at
  // capacity (retry later).
  Person sealed = 1;
}

// ReleaseFenceRequest closes a fence (see PersonHogLeader.ReleaseFence).
// person_uuid, sealed_version, and created_at travel in the request so a
// leader with no cache entry — after a restart — re-derives the death
// document deterministically. All three come from the sealed state the
// fence returned (the saga persists it in the mark row for replay).
message ReleaseFenceRequest {
  int64 team_id = 1;
  int64 person_id = 2;
  string person_uuid = 3;
  string op_id = 4;
  ReleaseOutcome outcome = 5;
  // The version sealed at fence time. The death document is produced at
  // sealed_version + 1. Required when outcome = COMMITTED. Explicitly
  // optional because 0 is a legitimate sealed version — a fresh person
  // stub is created at version 0 — so absence must stay distinguishable
  // from it.
  optional int64 sealed_version = 6;
  // The person's creation time as sealed at fence time, in epoch
  // milliseconds — the unit Person.created_at carries end to end (the
  // leader loads `timestamp_millis()`, the writer binds via
  // `epoch_ms_to_datetime`). The death document carries it verbatim — a
  // cold leader has nothing to re-derive it from, and the writer
  // projects it onto the tombstone row. Required when outcome =
  // COMMITTED.
  int64 created_at = 7;
}

enum ReleaseOutcome {
  RELEASE_OUTCOME_UNSPECIFIED = 0;
  // The person was destroyed: produce the death document, evict, unfence.
  RELEASE_OUTCOME_COMMITTED = 1;
  // The op backed out: unfence, keep the entry, produce nothing.
  RELEASE_OUTCOME_ABORTED = 2;
}

message ReleaseFenceResponse {}

// A sealed source snapshot paired with its precedence ordinal — the
// pair order the saga recorded in lifecycle_op_person. The fold sorts
// by ordinal itself rather than trusting request order, so a re-drive
// that lists sources differently still folds the same document.
message SealedSourceSnapshot {
  Person person = 1;
  int32 ordinal = 2;
}

// FoldPersonDocumentRequest folds sealed source snapshots into the merge
// target's document (see PersonHogLeader.FoldPersonDocument). The
// snapshots are the sources' final word — each was returned by
// FencePerson and no write can follow it while the merge op lives.
message FoldPersonDocumentRequest {
  int64 team_id = 1;
  // The merge target. The fold is computed by its owning leader from its
  // authoritative cache plus the snapshots below.
  int64 person_id = 2;
  // Sealed source snapshots. Property precedence follows the ordinals —
  // a lower ordinal beats a higher one on contested keys, and the
  // target beats all — in whatever order the request lists them;
  // duplicate ordinals are rejected. Must be non-empty — a merge with
  // no sealed sources has nothing to fold.
  repeated SealedSourceSnapshot sealed_snapshots = 3;
  // JSON-encoded maps from the merge event. event_set overrides on
  // conflict (matching ingestion's $identify behavior); event_set_once
  // fills only still-absent keys.
  bytes event_set = 4;
  bytes event_set_once = 5;
  // The merge saga's op id, verified against the lifecycle database:
  // the fold is refused unless this op holds the person as its live
  // ('marked') merge target, closing late re-drives from a settled or
  // superseded op. The check is read-time only — a fold already past it
  // when the op settles can still land — so it narrows the late-fold
  // residual rather than eliminating it. Re-applying a fold on
  // unchanged target state changes no content and only bumps the
  // version; the id is not a dedup key. The accepted at-least-once
  // residual applies while the op lives: the target is never fenced, so
  // a re-driven fold recomputes over writes that landed in between and
  // can clobber them where they overlap the event's $set or a
  // snapshot's keys — the same residual every re-appliable leader merge
  // carries today, closed later by operation identity in the write
  // path.
  string op_id = 6;
}

message FoldPersonDocumentResponse {
  // The folded document exactly as produced to the changelog:
  // target-wins properties, created_at = min(target, sources),
  // is_identified = true, last_seen_at = max(target, sources),
  // version = max(target, max sealed) + 1.
  // One exception: when the target's stored properties violate the size
  // constraint beyond remediation (protected keys alone exceed the
  // ceiling), no applyable document exists — the fold produces nothing
  // and returns the person unchanged, skipping its property and scalar
  // effects for this person.
  Person person = 1;
}
