syntax = "proto3";
package personhog.types.v1;

import "personhog/types/v1/common.proto";

// Person represents a user profile with properties
message Person {
  int64 id = 1;
  string uuid = 2;
  int64 team_id = 3;
  bytes properties = 4;
  bytes properties_last_updated_at = 5;
  bytes properties_last_operation = 6;
  // Epoch milliseconds, as are all timestamps in this message.
  int64 created_at = 7;
  int64 version = 8;
  bool is_identified = 9;
  optional bool is_user_id = 10;
  // Epoch milliseconds (matching created_at); the writer decodes it as such.
  optional int64 last_seen_at = 11;
  // True on a death document: the changelog record the leader produces when
  // a lifecycle saga destroys the person, at sealed_version + 1 or at the
  // saga's tombstone version when that is higher.
  // Consumers treat the person as gone; the writer projects it as the
  // Postgres tombstone. proto3 default (false) keeps old records live.
  bool is_deleted = 12;
}

// DistinctIdWithVersion pairs a distinct_id with its version for consistency tracking
message DistinctIdWithVersion {
  string distinct_id = 1;
  optional int64 version = 2;
  optional int64 id = 3;  // Row ID, usable as a pagination cursor.
}

// PersonWithDistinctIds pairs a lookup distinct_id with its resolved person
message PersonWithDistinctIds {
  string distinct_id = 1;
  optional Person person = 2;
}

// PersonDistinctIds contains all distinct_ids for a single person
message PersonDistinctIds {
  int64 person_id = 1;
  repeated DistinctIdWithVersion distinct_ids = 2;
}

// PersonWithTeamDistinctId pairs a cross-team lookup key with its resolved person
message PersonWithTeamDistinctId {
  TeamDistinctId key = 1;
  optional Person person = 2;
}

message GetPersonRequest {
  int64 team_id = 1;
  int64 person_id = 2;
  ReadOptions read_options = 3;
}

message GetPersonResponse {
  optional Person person = 1;
}

message GetPersonsRequest {
  int64 team_id = 1;
  // Max 250 per request.
  repeated int64 person_ids = 2;
  ReadOptions read_options = 3;
}

message PersonsResponse {
  repeated Person persons = 1;
  repeated int64 missing_ids = 2;
}

message GetPersonByUuidRequest {
  int64 team_id = 1;
  string uuid = 2;
  ReadOptions read_options = 3;
}

message GetPersonsByUuidsRequest {
  int64 team_id = 1;
  // Max 250 per request.
  repeated string uuids = 2;
  ReadOptions read_options = 3;
}

message GetPersonByDistinctIdRequest {
  int64 team_id = 1;
  string distinct_id = 2;
  ReadOptions read_options = 3;
}

message GetPersonsByDistinctIdsInTeamRequest {
  int64 team_id = 1;
  // Max 250 per request.
  repeated string distinct_ids = 2;
  ReadOptions read_options = 3;
}

message PersonsByDistinctIdsInTeamResponse {
  repeated PersonWithDistinctIds results = 1;
}

message GetPersonsByDistinctIdsRequest {
  // Max 250 per request.
  repeated TeamDistinctId team_distinct_ids = 1;
  ReadOptions read_options = 2;
}

message PersonsByDistinctIdsResponse {
  repeated PersonWithTeamDistinctId results = 1;
}

message GetDistinctIdsForPersonRequest {
  int64 team_id = 1;
  int64 person_id = 2;
  ReadOptions read_options = 3;
  optional int64 limit = 4;  // Max distinct IDs returned. 0 or absent = no limit.
  optional int64 cursor_id = 5;  // Keyset cursor: return rows with id > cursor_id.
}

message GetDistinctIdsForPersonResponse {
  repeated DistinctIdWithVersion distinct_ids = 1;
  optional int64 next_cursor_id = 2;  // Absent when no more pages.
}

message GetDistinctIdsForPersonsRequest {
  int64 team_id = 1;
  repeated int64 person_ids = 2;
  ReadOptions read_options = 3;
  optional int64 limit_per_person = 4;  // Max distinct IDs returned per person. 0 or absent = no limit.
}

message GetDistinctIdsForPersonsResponse {
  repeated PersonDistinctIds person_distinct_ids = 1;
}

// UpdatePersonPropertiesRequest describes a property update for a person
// identified by team_id + person_id. The caller resolves distinct_id → person_id
// before sending. The leader merges property diffs ($set, $set_once, $unset)
// into the cached state.
message UpdatePersonPropertiesRequest {
  int64 team_id = 1;
  int64 person_id = 2;
  // The event name that triggered this update (e.g. "$set", "$identify",
  // "$pageview"). The leader checks it against a small denylist of events
  // that must never write person properties and otherwise ignores it.
  // Callers folding many events into one request filter denylisted
  // events' ops at fold time and send a representative name.
  string event_name = 3;
  // JSON-encoded map of properties to set (overwrites existing values).
  bytes set_properties = 4;
  // JSON-encoded map of properties to set only if not already present.
  // Resolved by the leader against authoritative state under the
  // per-person lock — callers must not pre-resolve set_once against a
  // fetched snapshot, or a concurrent writer's earlier value gets
  // clobbered. When the same key appears here and in set_properties,
  // set wins.
  bytes set_once_properties = 5;
  // Property keys to remove from the person.
  repeated string unset_properties = 6;
  // OR-merged: true marks the person identified; false and absent are
  // no-ops (identification never reverts through this RPC). The
  // false→true transition counts as a change and produces a changelog
  // record on its own.
  optional bool is_identified = 7;
  // Epoch milliseconds (matching Person.last_seen_at). The leader floors
  // the value to the hour (ingestion's own granularity) and max-merges,
  // so the stored value only ever advances. An advance is a change that
  // produces a changelog record on its own — matching ingestion's direct
  // write path, which persists a last-seen-only advance — and the
  // flooring bounds record volume at one per person-hour regardless of
  // the caller's precision.
  optional int64 last_seen_at = 8;
  // The event kind warrants a write regardless of which properties changed.
  // Computed by the caller from the event alone; when false, filtered-only
  // changes answer updated=false and write nothing.
  bool force_update = 9;
}

message UpdatePersonPropertiesResponse {
  // The person after applying the update (if the person was found).
  optional Person person = 1;
  // Whether any properties were actually changed.
  bool updated = 2;
}

message RaisePersonVersionRequest {
  int64 team_id = 1;
  int64 person_id = 2;
  int64 min_version = 3;
}

message RaisePersonVersionResponse {
  optional Person person = 1;
  // Whether this call wrote a document.
  bool raised = 2;
}

// How DeletePersons removes the rows.
enum DeletePersonsMode {
  // Same as TOMBSTONE.
  DELETE_PERSONS_MODE_UNSPECIFIED = 0;
  // Rejected with INVALID_ARGUMENT, because a hard delete leaves the live ClickHouse rows above a
  // re-created person's version 0. A deleted team's persons go through DeletePersonsBatchForTeam.
  DELETE_PERSONS_MODE_HARD = 1;
  // Keep the rows as tombstones and report the versions written. The caller
  // owns the prerequisite: ingestion must revive tombstones for the team.
  DELETE_PERSONS_MODE_TOMBSTONE = 2;
}

// DeletePersonsRequest deletes persons from Postgres by UUID, together with
// their posthog_persondistinctid, posthog_cohortpeople and
// posthog_featureflaghashkeyoverride rows (nothing cascades them).
message DeletePersonsRequest {
  int64 team_id = 1;
  // Person UUIDs to delete. Max 1000 per request.
  repeated string person_uuids = 2;
  DeletePersonsMode mode = 3;
}

message TombstonedDistinctId {
  string distinct_id = 1;
  int64 version = 2;
}

message TombstonedPerson {
  string person_uuid = 1;
  int64 version = 2;
  repeated TombstonedDistinctId distinct_ids = 3;
}

message DeletePersonsResponse {
  int64 deleted_count = 1;
  // True when the rows were tombstoned rather than removed, which is every successful call.
  bool tombstoned = 2;
  // One entry per requested person that is tombstoned after the call, with the
  // versions its rows hold, so the caller can publish its ClickHouse tombstones
  // at exactly those versions. Persons tombstoned before the call are included
  // too, so a retry after a lost response gets the same versions again;
  // deleted_count counts only the rows this call tombstoned.
  repeated TombstonedPerson tombstones = 3;
}

message GetPersonTombstonesRequest {
  int64 team_id = 1;
  repeated string person_uuids = 2;
}

message GetPersonTombstonesResponse {
  repeated TombstonedPerson tombstones = 1;
}

message AckedPersonTombstone {
  string person_uuid = 1;
  int64 version = 2;
}

message AckPersonTombstonesRequest {
  int64 team_id = 1;
  repeated AckedPersonTombstone tombstones = 2;
}

message AckPersonTombstonesResponse {
  int64 cleared_count = 1;
}

message ListPersonTombstoneQueueRequest {
  int64 after_team_id = 1;
  string after_person_uuid = 2;
  int64 limit = 3;
  optional int64 team_id = 4;
}

message PersonTombstoneQueueEntry {
  int64 team_id = 1;
  string person_uuid = 2;
  int64 person_version = 3;
  int64 tombstoned_at = 4;
}

message ListPersonTombstoneQueueResponse {
  repeated PersonTombstoneQueueEntry entries = 1;
}

// DeletePersonsBatchForTeamRequest deletes up to batch_size persons for a team.
// Also deletes associated posthog_persondistinctid rows (FK is NO ACTION).
// posthog_featureflaghashkeyoverride rows cascade automatically at the DB level.
// Callers should loop until deleted_count is 0.
message DeletePersonsBatchForTeamRequest {
  int64 team_id = 1;
  // Max persons to delete per call. Must be > 0 and <= 50000.
  int64 batch_size = 2;
}

message DeletePersonsBatchForTeamResponse {
  // Number of persons deleted. 0 means no more persons to delete.
  int64 deleted_count = 1;
}

// DeleteTombstonedPersonsRequest deletes persons only while they are still
// tombstoned, checking under the same row locks as the delete, so a racing
// revival is either skipped or lands afterwards on a fresh row. One call does a
// bounded amount of work: persons whose dependent rows (distinct ids, hash key
// overrides, cohort memberships) fit the row budget are deleted whole; the first
// person that does not fit gives up as many rows as the leftover allows and is
// returned as pending, as is everything after the budget. Send pending uuids again
// until none come back. Idempotent.
message DeleteTombstonedPersonsRequest {
  int64 team_id = 1;
  // Person UUIDs to delete. Max 1000 per request. Leave empty when bounded_persons is set.
  repeated string person_uuids = 2;
  // Dependent rows this call may delete. 0 means the server default; the server
  // clamps the value to its own maximum (replica setting TOMBSTONED_DELETE_MAX_ROWS).
  int64 max_rows = 3;
  // Persons to delete, each with a version bound, in place of person_uuids. Max 1000 per request.
  // A server that predates this field reads an empty person_uuids and deletes nothing, so the
  // caller must check version_guard_applied on the response.
  repeated VersionBoundedPerson bounded_persons = 4;
}

message VersionBoundedPerson {
  string person_uuid = 1;
  // The person is deleted only while its version is at or below this value. A person with a
  // higher version was tombstoned again after the caller took the bound.
  int64 max_version = 2;
}

message DeleteTombstonedPersonsResponse {
  // Persons hard-deleted together with their dependent rows.
  int64 deleted_count = 1;
  // Persons found with is_deleted = false: revived after the caller queued them.
  // Nothing was deleted for them.
  int64 skipped_live_count = 2;
  // Persons still tombstoned but referenced by a live distinct id. Nothing was
  // deleted for them; the caller must not treat them as cleaned.
  repeated string blocked_person_uuids = 3;
  // Persons not finished within max_rows: still tombstoned, some rows possibly
  // gone. Send them again.
  repeated string pending_person_uuids = 4;
  // Dependent rows deleted by this call.
  int64 rows_deleted = 5;
  // True when the request carried bounded_persons and the server checked every bound. Always
  // false from a server that predates bounded_persons.
  bool version_guard_applied = 6;
  // Persons still tombstoned but at a version above their bound. Nothing was deleted for them.
  int64 skipped_version_count = 7;
}

// SplitPersonRequest splits specific distinct_ids off of a person onto new persons.
// Each distinct_id gets a new person with a deterministic UUID (UUIDv5 from team_id:distinct_id).
// The operation is atomic per request: all splits succeed or none do.
// Python resolves which distinct IDs to split before calling this RPC.
// Limited to 250 distinct_ids per request (server-enforced) to bound row-lock
// hold time and message size — callers batch larger splits across requests,
// which is safe because the deterministic UUIDs make each request idempotent.
message SplitPersonRequest {
  int64 team_id = 1;
  int64 person_id = 2;
  // Distinct IDs to split off. Must all belong to the specified person; duplicates are rejected.
  repeated string distinct_ids_to_split = 3;
}

// SplitResult describes a single distinct_id that was split onto a new person.
message SplitResult {
  string distinct_id = 1;
  string new_person_uuid = 2;
  int64 new_person_version = 3;
  int64 pdi_version = 4;
  // Epoch millis. For pre-existing persons (idempotent re-split) this is the
  // original created_at, not the time of this request — callers publish it
  // downstream (e.g. to ClickHouse) so it must match the Postgres row.
  int64 new_person_created_at_ms = 5;
}

message SplitPersonResponse {
  // Results are in the same order as distinct_ids_to_split in the request.
  repeated SplitResult splits = 1;
}

// SetPersonDistinctIdVersionFloorRequest bumps a person_distinct_id row's version.
// Used by the undelete repair flow to revive a soft-deleted distinct_id: raising the
// Postgres version keeps the plugin-server from later emitting a lower version that
// ClickHouse would ignore. The update is guarded so it never lowers a version: the row
// is updated only when its stored version is below min_version.
message SetPersonDistinctIdVersionFloorRequest {
  int64 team_id = 1;
  string distinct_id = 2;
  // Minimum version to set; applied only if the stored version is lower.
  int64 min_version = 3;
}

message SetPersonDistinctIdVersionFloorResponse {
  // The person the distinct_id maps to. Absent when the distinct_id does not exist
  // (it has not been re-used yet). Present whenever the distinct_id exists, even if the
  // guard left the version unchanged.
  optional Person person = 1;
}

// SetPersonVersionFloorRequest bumps a person's version. Used by the undelete repair
// flow to revive a soft-deleted person in ClickHouse. The update is guarded so it
// never lowers a version: the row is updated only when its stored version is below
// min_version.
message SetPersonVersionFloorRequest {
  int64 team_id = 1;
  int64 person_id = 2;
  // Minimum version to set; applied only if the stored version is lower.
  int64 min_version = 3;
}

message SetPersonVersionFloorResponse {
  // True if a row was updated (the stored version was below min_version).
  bool updated = 1;
}

// What EnsurePersonVersionFloors found and did for one person.
enum VersionFloorOutcome {
  VERSION_FLOOR_OUTCOME_UNSPECIFIED = 0;
  // No row existed. The call inserted a tombstone at min_version.
  VERSION_FLOOR_OUTCOME_TOMBSTONE_INSERTED = 1;
  // A tombstone below min_version. The call raised it to min_version.
  VERSION_FLOOR_OUTCOME_TOMBSTONE_RAISED = 2;
  // A tombstone at or above min_version. Nothing changed.
  VERSION_FLOOR_OUTCOME_TOMBSTONE_AT_FLOOR = 3;
  // A live row. Nothing changed: the call never raises a live row.
  VERSION_FLOOR_OUTCOME_LIVE = 4;
}

message PersonVersionFloor {
  string person_uuid = 1;
  int64 min_version = 2;
}

// EnsurePersonVersionFloorsRequest raises each person tombstone to at least min_version in one transaction,
// inserting a tombstone for a missing person and leaving a live person unchanged. Publish a ClickHouse tombstone
// at the returned version for every non-LIVE result, because the Postgres cleanup drain removes only tombstones
// the ClickHouse deletion sweep finds.
message EnsurePersonVersionFloorsRequest {
  int64 team_id = 1;
  // Max 250 per request. Duplicate person_uuids are rejected.
  repeated PersonVersionFloor floors = 2;
}

message PersonVersionFloorResult {
  string person_uuid = 1;
  VersionFloorOutcome outcome = 2;
  // The stored version after the call.
  int64 version = 3;
}

message EnsurePersonVersionFloorsResponse {
  // Same order as the request.
  repeated PersonVersionFloorResult results = 1;
}

// FencePersonRequest freezes a person for a lifecycle operation (see
// PersonHogLeader.FencePerson). op_id is the saga's caller-supplied UUID;
// op_type selects the rejection surfaced to writers while the fence holds.
message FencePersonRequest {
  int64 team_id = 1;
  int64 person_id = 2;
  string op_id = 3;
  LifecycleOpType op_type = 4;
}

// The kind of lifecycle operation — mirrors lifecycle_op.op_type. The
// canonical string mapping lives on this enum's impl in personhog-proto;
// derive from it everywhere instead of repeating the literals.
enum LifecycleOpType {
  LIFECYCLE_OP_TYPE_UNSPECIFIED = 0;
  LIFECYCLE_OP_TYPE_DELETE = 1;
  LIFECYCLE_OP_TYPE_MERGE = 2;
}

message FencePersonResponse {
  // The sealed state: the person's final word — no write can follow it
  // while the fence holds. Delete uses sealed.version only; merge seals
  // the full document (properties included).
  //
  // Failure is reported through the gRPC status, never in-band:
  // FAILED_PRECONDITION with x-person-fenced metadata when another op
  // holds the person, NOT_FOUND when the person is destroyed,
  // FAILED_PRECONDITION when this pod does not serve the partition (the
  // retry re-routes), and RESOURCE_EXHAUSTED when the fence map is at
  // capacity (retry later).
  Person sealed = 1;
}

// FencePersonsRequest freezes many persons of one op in one call (see
// PersonHogLeader.FencePersons). The saga sends one call per partition
// of the op, routed by one of the persons like a single fence.
message FencePersonsRequest {
  int64 team_id = 1;
  string op_id = 2;
  LifecycleOpType op_type = 3;
  repeated int64 person_ids = 4;
}

// Every requested person id lands in exactly one of the two lists; a
// failure any single FencePerson reports through its status, other than
// NOT_FOUND, fails the whole call the same way.
message FencePersonsResponse {
  // The sealed scalars of every person fenced: what the delete saga reads
  // from a seal. Full documents would not fit a batch, and the merge saga,
  // which folds the document, fences one person at a time.
  repeated FencedPersonSeal sealed = 1;
  // The persons a single FencePerson answers NOT_FOUND for: destroyed, so
  // no fence was installed.
  repeated int64 not_found = 2;
}

message FencedPersonSeal {
  int64 person_id = 1;
  // See FencePersonResponse.sealed: the version the fence made final.
  int64 version = 2;
  // The person's creation time in epoch milliseconds, as the death
  // document carries it (see ReleaseFenceRequest.created_at).
  int64 created_at = 3;
}

// ReleaseFenceRequest closes a fence (see PersonHogLeader.ReleaseFence).
// person_uuid, sealed_version, and created_at travel in the request so a
// leader with no cache entry — after a restart — re-derives the death
// document deterministically. All three come from the sealed state the
// fence returned (the saga persists it in the mark row for replay).
message ReleaseFenceRequest {
  int64 team_id = 1;
  int64 person_id = 2;
  string person_uuid = 3;
  string op_id = 4;
  ReleaseOutcome outcome = 5;
  // The version sealed at fence time. The death document is produced at
  // sealed_version + 1, raised to tombstone_version when that is higher.
  // Required when outcome = COMMITTED. Explicitly
  // optional because 0 is a legitimate sealed version — a fresh person
  // stub is created at version 0 — so absence must stay distinguishable
  // from it.
  optional int64 sealed_version = 6;
  // The person's creation time as sealed at fence time, in epoch
  // milliseconds — the unit Person.created_at carries end to end (the
  // leader loads `timestamp_millis()`, the writer binds via
  // `epoch_ms_to_datetime`). The death document carries it verbatim — a
  // cold leader has nothing to re-derive it from, and the writer
  // projects it onto the tombstone row. Required when outcome =
  // COMMITTED.
  int64 created_at = 7;
  // The version the saga's Postgres tombstone committed at: at least
  // sealed_version + 1, higher when a direct Postgres writer bumped the
  // row between the fence and the tombstone. The death document is
  // produced at or above it, so the changelog never carries a live
  // version below the tombstone. A value at or below sealed_version is
  // refused INVALID_ARGUMENT with the fence kept: the saga never
  // tombstones below sealed + 1, so such a value is a caller bug.
  // Optional for ops unmapped before this field existed; absent means
  // sealed_version + 1.
  optional int64 tombstone_version = 8;
}

enum ReleaseOutcome {
  RELEASE_OUTCOME_UNSPECIFIED = 0;
  // The person was destroyed: produce the death document, evict, unfence.
  RELEASE_OUTCOME_COMMITTED = 1;
  // The op backed out: unfence, keep the entry, produce nothing.
  RELEASE_OUTCOME_ABORTED = 2;
}

message ReleaseFenceResponse {}

// ReleaseFencesRequest closes many fences of one op in one call (see
// PersonHogLeader.ReleaseFences), one call per partition of the op.
// Per-person fields carry what ReleaseFenceRequest carries.
message ReleaseFencesRequest {
  int64 team_id = 1;
  string op_id = 2;
  ReleaseOutcome outcome = 3;
  repeated ReleaseFenceItem persons = 4;
}

message ReleaseFenceItem {
  int64 person_id = 1;
  string person_uuid = 2;
  // See ReleaseFenceRequest.sealed_version.
  optional int64 sealed_version = 3;
  // See ReleaseFenceRequest.created_at.
  int64 created_at = 4;
  // See ReleaseFenceRequest.tombstone_version.
  optional int64 tombstone_version = 5;
}

message ReleaseFencesResponse {}

// A sealed source snapshot paired with its precedence ordinal — the
// pair order the saga recorded in lifecycle_op_person. The fold sorts
// by ordinal itself rather than trusting request order, so a re-drive
// that lists sources differently still folds the same document.
message SealedSourceSnapshot {
  Person person = 1;
  int32 ordinal = 2;
}

// FoldPersonDocumentRequest folds sealed source snapshots into the merge
// target's document (see PersonHogLeader.FoldPersonDocument). The
// snapshots are the sources' final word — each was returned by
// FencePerson and no write can follow it while the merge op lives.
message FoldPersonDocumentRequest {
  int64 team_id = 1;
  // The merge target. The fold is computed by its owning leader from its
  // authoritative cache plus the snapshots below.
  int64 person_id = 2;
  // Sealed source snapshots. Property precedence follows the ordinals —
  // a lower ordinal beats a higher one on contested keys, and the
  // target beats all — in whatever order the request lists them;
  // duplicate ordinals are rejected. Must be non-empty — a merge with
  // no sealed sources has nothing to fold.
  repeated SealedSourceSnapshot sealed_snapshots = 3;
  // JSON-encoded maps from the merge event. event_set overrides on
  // conflict (matching ingestion's $identify behavior); event_set_once
  // fills only still-absent keys.
  bytes event_set = 4;
  bytes event_set_once = 5;
  // The merge saga's op id, verified against the lifecycle database:
  // the fold is refused unless this op holds the person as its live
  // ('marked') merge target, closing late re-drives from a settled or
  // superseded op. The check is read-time only — a fold already past it
  // when the op settles can still land — so it narrows the late-fold
  // residual rather than eliminating it. Re-applying a fold on
  // unchanged target state changes no content and only bumps the
  // version; the id is not a dedup key. The accepted at-least-once
  // residual applies while the op lives: the target is never fenced, so
  // a re-driven fold recomputes over writes that landed in between and
  // can clobber them where they overlap the event's $set or a
  // snapshot's keys — the same residual every re-appliable leader merge
  // carries today, closed later by operation identity in the write
  // path.
  string op_id = 6;
}

message FoldPersonDocumentResponse {
  // The folded document exactly as produced to the changelog:
  // target-wins properties, created_at = min(target, sources),
  // is_identified = true, last_seen_at = max(target, sources),
  // version = max(target, max sealed) + 1.
  // One exception: when the target's stored properties violate the size
  // constraint beyond remediation (protected keys alone exceed the
  // ceiling), no applyable document exists — the fold produces nothing
  // and returns the person unchanged, skipping its property and scalar
  // effects for this person.
  Person person = 1;
}

// A persons-database mapping row, live or tombstoned, with the state of the person it points at.
message DistinctIdRow {
  string distinct_id = 1;
  int64 person_id = 2;
  // Absent for an orphan row whose person no longer exists.
  optional string person_uuid = 3;
  int64 version = 4;
  bool is_deleted = 5;
  // Absent for an orphan row whose person no longer exists.
  optional bool person_is_deleted = 6;
}

message GetDistinctIdRowsRequest {
  int64 team_id = 1;
  // At most 1000. Distinct ids with no row are left out of the response.
  repeated string distinct_ids = 2;
  ReadOptions read_options = 3;
}

message GetDistinctIdRowsResponse {
  repeated DistinctIdRow rows = 1;
}

// One persons-database person row, live or tombstoned, without properties.
message PersonListEntry {
  int64 id = 1;
  string uuid = 2;
  int64 version = 3;
  bool is_deleted = 4;
  // Whether any live mapping row points at this person.
  bool has_live_distinct_ids = 5;
  int64 created_at_ms = 6;
}

message ListPersonsForTeamRequest {
  int64 team_id = 1;
  // Keyset cursor: return persons with id > after_person_id, in id order.
  int64 after_person_id = 2;
  // Persons per page. 0 means 1000; at most 10000.
  int64 limit = 3;
  ReadOptions read_options = 4;
  // When set, return only persons with id < before_person_id, so a caller can scan id ranges in parallel.
  optional int64 before_person_id = 5;
}

message ListPersonsForTeamResponse {
  repeated PersonListEntry persons = 1;
  // Absent when this page is the last one.
  optional int64 next_after_person_id = 2;
}

// Raise live persons' versions for the person consistency repair. Tombstoned and
// missing persons are left unchanged; EnsurePersonVersionFloors handles tombstones.
message RaisePersonVersionFloorsRequest {
  int64 team_id = 1;
  // At most 250, no repeated uuid.
  repeated PersonVersionFloor floors = 2;
}

enum RaiseOutcome {
  RAISE_OUTCOME_UNSPECIFIED = 0;
  RAISE_OUTCOME_RAISED = 1;
  RAISE_OUTCOME_AT_OR_ABOVE = 2;
  RAISE_OUTCOME_NOT_LIVE = 3;
  RAISE_OUTCOME_MISSING = 4;
}

message RaisePersonVersionFloorResult {
  string person_uuid = 1;
  RaiseOutcome outcome = 2;
  // The version the row holds after the call; 0 when missing.
  int64 version = 3;
}

message RaisePersonVersionFloorsResponse {
  repeated RaisePersonVersionFloorResult results = 1;
}

// A person to insert from its ClickHouse copy.
message RestoredPerson {
  string person_uuid = 1;
  // JSON object.
  bytes properties = 2;
  int64 created_at_ms = 3;
  bool is_identified = 4;
  int64 version = 5;
  // Distinct ids to insert on the person in the same transaction, where no row exists for them.
  // When the person is inserted but none of these can be, the person is not inserted either
  // (RESTORE_OUTCOME_NO_DISTINCT_ID), so a restore never leaves a person nothing points to.
  repeated RestoredDistinctId distinct_ids = 6;
}

message RestoredDistinctId {
  string distinct_id = 1;
  int64 version = 2;
}

message RestorePersonsRequest {
  int64 team_id = 1;
  // At most 250, no repeated uuid.
  repeated RestoredPerson persons = 2;
}

enum RestoreOutcome {
  RESTORE_OUTCOME_UNSPECIFIED = 0;
  RESTORE_OUTCOME_INSERTED = 1;
  // A row with the uuid exists, live or tombstoned; it is left unchanged.
  RESTORE_OUTCOME_EXISTS_LIVE = 2;
  RESTORE_OUTCOME_EXISTS_TOMBSTONED = 3;
  // The request listed distinct ids, and every one of them already had a row; nothing was inserted.
  RESTORE_OUTCOME_NO_DISTINCT_ID = 4;
}

message RestorePersonResult {
  string person_uuid = 1;
  RestoreOutcome outcome = 2;
  int64 person_id = 3;
  int64 version = 4;
  // For INSERTED: the requested distinct ids inserted on the person, at their requested versions.
  repeated string restored_distinct_ids = 5;
}

message RestorePersonsResponse {
  repeated RestorePersonResult results = 1;
}

enum DistinctIdWriteAction {
  DISTINCT_ID_WRITE_ACTION_UNSPECIFIED = 0;
  // Insert a live row on the person when no row exists for the distinct id.
  DISTINCT_ID_WRITE_ACTION_INSERT = 1;
  // Raise a live row on the person to at least min_version.
  DISTINCT_ID_WRITE_ACTION_RAISE = 2;
}

message DistinctIdWrite {
  string distinct_id = 1;
  DistinctIdWriteAction action = 2;
  // The person the row must point at: the insert target, or the current owner for raise.
  string person_uuid = 3;
  int64 min_version = 4;
  // When set, raise applies only while the row holds exactly this version.
  optional int64 expected_version = 5;
}

message WriteDistinctIdsRequest {
  int64 team_id = 1;
  // At most 250, no repeated distinct id.
  repeated DistinctIdWrite writes = 2;
}

enum DistinctIdWriteOutcome {
  DISTINCT_ID_WRITE_OUTCOME_UNSPECIFIED = 0;
  DISTINCT_ID_WRITE_OUTCOME_APPLIED = 1;
  // The row already satisfies the write (raise at or above min_version).
  DISTINCT_ID_WRITE_OUTCOME_UNCHANGED = 2;
  // The row is not in the state the write expects; it is left unchanged and reported.
  DISTINCT_ID_WRITE_OUTCOME_PRECONDITION_FAILED = 3;
  // The person does not exist or is tombstoned.
  DISTINCT_ID_WRITE_OUTCOME_PERSON_NOT_LIVE = 4;
}

message DistinctIdWriteResult {
  string distinct_id = 1;
  DistinctIdWriteOutcome outcome = 2;
  // The row after the call, when one exists.
  optional DistinctIdRow row = 3;
}

message WriteDistinctIdsResponse {
  repeated DistinctIdWriteResult results = 1;
}
