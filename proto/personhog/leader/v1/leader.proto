syntax = "proto3";
package personhog.leader.v1;

import "personhog/types/v1/person.proto";

// PersonHogLeader is the internal write API exposed by leader pods.
// The router calls this service after hashing (team_id, person_id) to a
// partition and resolving the owning pod via the coordination routing table.
// The partition travels in the `x-partition` request-metadata header, set by
// the router, rather than in the request body — so the router can forward
// client request bytes verbatim without a decode/re-encode.
service PersonHogLeader {
  // Apply property updates to a person. Merges $set, $set_once, and $unset
  // diffs into the cached person state.
  rpc UpdatePersonProperties(personhog.types.v1.UpdatePersonPropertiesRequest) returns (personhog.types.v1.UpdatePersonPropertiesResponse);

  // Strong consistency read: returns the latest person state from the leader's cache.
  rpc GetPerson(personhog.types.v1.GetPersonRequest) returns (personhog.types.v1.GetPersonResponse);

  // Internal, saga-runner only. Freeze a person for a lifecycle operation:
  // under the per-person lock, record the fence in the leader's in-memory
  // fence map and seal the newest cached state, returning it in the same
  // response — no gap for a write to sneak into. The fence's durable
  // record is NOT this map: it is the saga's mark row, committed before
  // this RPC is ever called; a leader taking partition ownership rebuilds
  // its map from the live marks before accepting writes. Fencing produces
  // nothing to the changelog and does not advance the version — the
  // sealed version is the person's current one. While fenced, writes fail
  // FAILED_PRECONDITION with an `x-person-fenced` metadata key carrying
  // the op type; reads are unaffected. Re-fencing with the same op_id
  // re-seals with fresh state (what makes the saga's seal step safe to
  // repeat); a different op_id is rejected — at most one lifecycle op
  // holds a person. The fence never lapses on a timer: only ReleaseFence
  // (or the op being observed finished) clears it.
  rpc FencePerson(personhog.types.v1.FencePersonRequest) returns (personhog.types.v1.FencePersonResponse);

  // The closing half of FencePerson. `committed` (the person was
  // destroyed): verify the op against its live mark row — the request
  // alone is never sufficient to destroy a person; a release whose op
  // holds no live mark is refused FAILED_PRECONDITION (fail closed) —
  // then produce the death document to the changelog — is_deleted =
  // true, version = max(sealed_version, current) + 1 (sealed + 1 per the
  // RFC; the max is defense in depth until broker producer fencing lands)
  // — then evict the cache entry and drop the fence. `aborted`: drop the
  // fence, keep the entry, produce nothing; the person resumes normal
  // life. Idempotent — the request carries everything needed to re-derive
  // the death document, so a restarted leader produces it
  // deterministically; duplicates are absorbed downstream by version, and
  // a mark already settled as deleted absorbs the retry without a second
  // record.
  rpc ReleaseFence(personhog.types.v1.ReleaseFenceRequest) returns (personhog.types.v1.ReleaseFenceResponse);
}
