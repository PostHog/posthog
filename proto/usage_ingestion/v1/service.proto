syntax = "proto3";

package usage_ingestion.v1;

// UsageIngestion accepts product-usage records for durable analytics and billing.
// Producers must reuse record_id when retrying a record. The service preserves
// producer-supplied event time and assigns insertion time when it publishes.
service UsageIngestion {
  rpc Ingest(IngestUsageRecordsRequest) returns (IngestUsageRecordsResponse);
}

enum UsageMode {
  USAGE_MODE_UNSPECIFIED = 0;
  USAGE_MODE_DELTA = 1;
  USAGE_MODE_SNAPSHOT = 2;
}

message UsageRecord {
  // Stable UUID or producer-scoped identifier used for idempotent retries.
  string record_id = 1;
  string producer_id = 2;
  int64 team_id = 3;

  // Optional for producers. The service resolves it from team_id when omitted.
  optional string organization_id = 4;

  string usage_key = 5;
  UsageMode mode = 6;
  string unit = 7;
  int64 quantity = 8;
  uint64 version = 9;
  int64 event_timestamp_ms = 10;
  optional string source_ref = 11;
  optional string user_id = 12;
  optional string variant = 13;
  map<string, string> dimensions = 14;
}

message IngestUsageRecordsRequest {
  repeated UsageRecord records = 1;
}

message IngestUsageRecordsResponse {
  // Records were validated and submitted to Kafka. A retry after an unavailable
  // response is safe because record_id is the deduplication identity.
  repeated string accepted_record_ids = 1;
}
