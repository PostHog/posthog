syntax = "proto3";

package usage_ingestion.v1;

// UsageIngestion accepts usage records for durable analytics. Producers must reuse
// record_id when retrying a record. The service preserves producer-supplied event
// time and assigns insertion time when it publishes.
//
// IngestBillingUsage carries tenant-billable usage: exact, idempotent, retained
// indefinitely. Cost and resource metering is a separate RPC and table.
service UsageIngestion {
  rpc IngestBillingUsage(IngestBillingUsageRequest) returns (IngestBillingUsageResponse);
}

enum BillingUsageMode {
  BILLING_USAGE_MODE_UNSPECIFIED = 0;
  BILLING_USAGE_MODE_DELTA = 1;
  BILLING_USAGE_MODE_SNAPSHOT = 2;
}

message BillingUsageRecord {
  // (team_id, producer_id, usage_key, record_id) is the record's identity, so a retry
  // reuses all four and collapses to one row. Correcting a quantity means re-sending
  // the same identity: the last send wins. event_timestamp is free to move between
  // sends, which is what makes a replay safe.
  string record_id = 1;
  string producer_id = 2;

  // The service owns organization attribution: it resolves the organization from
  // team_id, so producers cannot supply one.
  int64 team_id = 3;

  string usage_key = 4;
  BillingUsageMode mode = 5;
  string unit = 6;
  int64 quantity = 7;
  int64 event_timestamp_ms = 9;
  map<string, string> dimensions = 13;

  reserved 8, 10, 11, 12; // version, source_ref, user_id, variant
}

message IngestBillingUsageRequest {
  repeated BillingUsageRecord records = 1;
}

message IngestBillingUsageResponse {
  // The service validates a whole batch before producing, so validation failures accept no
  // records. The RPC waits for Kafka delivery confirmation, so callers must use it off their
  // request-critical path. A retry after an unavailable response is safe because record_id is
  // the deduplication identity, including when Kafka delivered only part of the batch.
  repeated string accepted_record_ids = 1;
}
