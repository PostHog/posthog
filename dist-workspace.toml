[workspace]
members = ["cargo:./cli"]

# Config for 'dist'
[dist]
# Skip checking whether the specified configuration files are up to date
allow-dirty = ["ci"]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Keep generated release workflows off tag-push publishing; Release CLI owns publishing
dispatch-releases = true
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
# Prefer our own origin for artifact downloads, with GitHub Releases as the
# fallback. {tag} is posthog-cli/vX.Y.Z, which is also the key prefix the
# release workflow uploads to, so the project name is not repeated in the URL.
simple-download-url = "https://releases.posthog.com/{tag}"
# Path that installers should place binaries in
install-path = "~/.posthog"
# No standalone updater. It resolves versions through the GitHub releases
# API, which cannot paginate far enough to reach a CLI release in this
# monorepo unauthenticated, so it has never worked here. `posthog-cli
# update` replaces it and reads the manifest from releases.posthog.com.
install-updater = false
# A namespace to use when publishing this package to the npm registry
npm-scope = "@posthog"
# The tap the generated formula is published to. It has to exist already,
# and it is the same one phrocs and hogland use.
tap = "PostHog/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["npm"]
unix-archive = ".tar.gz"
# Bundle the generated MCP-backed API CLI alongside every posthog-cli artifact.
include = ["cli/lib"]

[dist.github-custom-runners]
# ubuntu-20.04 (the dist default) is now deprecated by github
aarch64-unknown-linux-gnu = "ubuntu-22.04"
aarch64-unknown-linux-musl = "ubuntu-22.04"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
x86_64-unknown-linux-musl = "ubuntu-22.04"
global = "ubuntu-22.04"
x86_64-pc-windows-msvc = "windows-2025"
