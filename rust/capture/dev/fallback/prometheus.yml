global:
    scrape_interval: 1s
    evaluation_interval: 1s

scrape_configs:
    - job_name: capture
      static_configs:
          - targets: [capture:3000]
    - job_name: kafka-primary
      metrics_path: /public_metrics
      static_configs:
          - targets: [kafka-primary:9644]
    - job_name: kafka-secondary
      metrics_path: /public_metrics
      static_configs:
          - targets: [kafka-secondary:9644]
