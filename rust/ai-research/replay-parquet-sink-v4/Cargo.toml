[package]
name = "replay-parquet-sink-v4"
version = "0.1.0"
edition = "2021"
publish = false
description = "Writes the v4 AI research index rows from Kafka to Parquet files in the rrweb-v4 bucket"

[lints]
workspace = true

[dependencies]
common-kafka = { path = "../../common/kafka" }
lifecycle = { path = "../../common/lifecycle" }

async-trait = { workspace = true }
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-smithy-http-client = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
envconfig = { workspace = true }
futures = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
parquet = { version = "58", default-features = false, features = ["zstd"] }
rand = { workspace = true }
rdkafka = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
