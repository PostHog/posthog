[package]
name = "replay-core-v4"
version = "0.1.0"
edition = "2021"
publish = false
description = "Core of the v4 AI research replay dataset: the AISR03 envelope, the v4 keys, the session gate and the byte-level scan"

[lints]
workspace = true

[features]
default = ["store"]
# The key table and KMS clients. A reader that only opens frames turns default features off and skips the AWS SDK.
store = ["dep:aws-sdk-dynamodb", "dep:chrono"]

[dependencies]
aes-gcm = "0.10"
aws-sdk-dynamodb = { workspace = true, optional = true }
base64 = { workspace = true }
chrono = { workspace = true, optional = true }
hkdf = "0.12"
hmac = { workspace = true }
md5 = "0.8"
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
