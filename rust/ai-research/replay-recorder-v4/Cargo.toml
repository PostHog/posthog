[package]
name = "replay-recorder-v4"
version = "0.1.0"
edition = "2021"
publish = false
description = "Records the v4 AI research replay dataset: sampled, unscrubbed, sealed recordings with a sampling index"

[lints]
workspace = true

[dependencies]
# The event ingestion restrictions capture and the replay lanes apply.
capture = { path = "../../capture" }
common-alloc = { path = "../../common/alloc" }
common-database = { path = "../../common/database" }
common-kafka = { path = "../../common/kafka" }
common-metrics = { path = "../../common/metrics" }
common-redis = { path = "../../common/redis" }
lifecycle = { path = "../../common/lifecycle" }
posthog-replay-anonymizer = { path = "../../replay-anonymizer", default-features = false }
replay-core-v4 = { path = "../replay-core-v4" }

arc-swap = { workspace = true }
# The major version deltalite links, so the workspace builds one arrow.
arrow-array = "58"
arrow-schema = "58"
async-trait = { workspace = true }
aws-config = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
aws-sdk-kms = { workspace = true }
aws-sdk-s3 = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
envconfig = { workspace = true }
metrics = { workspace = true }
moka = { workspace = true }
parquet = "58"
rand = { workspace = true }
rdkafka = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
aes-gcm = "0.10"
base64 = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
