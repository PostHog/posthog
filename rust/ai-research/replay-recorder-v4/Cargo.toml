[package]
name = "replay-recorder-v4"
version = "0.1.0"
edition = "2021"
publish = false
description = "Records the v4 AI research replay dataset: sampled, unscrubbed, sealed recordings with a sampling index"

[lints]
workspace = true

[dependencies]
common-alloc = { path = "../../common/alloc" }
common-database = { path = "../../common/database" }
common-kafka = { path = "../../common/kafka" }
common-metrics = { path = "../../common/metrics" }
lifecycle = { path = "../../common/lifecycle" }
posthog-replay-anonymizer = { path = "../../replay-anonymizer", default-features = false }
replay-core-v4 = { path = "../replay-core-v4" }

arc-swap = { workspace = true }
async-trait = { workspace = true }
aws-config = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
aws-sdk-kms = { workspace = true }
aws-sdk-s3 = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
envconfig = { workspace = true }
metrics = { workspace = true }
rand = { workspace = true }
rdkafka = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
