[package]
name = "metrics-ingestion"
version = "0.1.0"
edition = "2021"
description = "Rust port of the Node metrics ingestion consumer (nodejs/src/ingestion/pipelines/metrics), checked against it by the shared parity corpus"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
common-alloc = { path = "../common/alloc" }
common-database = { path = "../common/database" }
futures = { workspace = true }
ingestion-framework = { path = "../ingestion-framework" }
lifecycle = { path = "../common/lifecycle" }
logs-ingestion = { path = "../logs-ingestion" }
metrics = { workspace = true }
rand = { workspace = true }
rdkafka = { workspace = true }
redis = { workspace = true }
rustls = { workspace = true }
serve-metrics = { path = "../common/serve_metrics" }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
