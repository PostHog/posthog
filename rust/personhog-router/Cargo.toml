# no-op: trigger rebuild
[package]
name = "personhog-router"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
personhog-common = { path = "../personhog-common" }
personhog-coordination = { path = "../personhog-coordination" }
personhog-proto = { path = "../personhog-proto" }
assignment-coordination = { path = "../common/assignment-coordination" }
k8s-awareness = { path = "../common/k8s-awareness" }
common-alloc = { path = "../common/alloc" }
keyed-stash = { path = "../common/keyed-stash" }
metrics-exporter-prometheus = { workspace = true }
lifecycle = { path = "../common/lifecycle" }
kube = { version = "0.98", features = ["client", "runtime"] }

async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
envconfig = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http-body = "1"
http-body-util = "0.1"
metrics = { workspace = true }
prost = { workspace = true }
rand = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# Test-only: the store layer emits the etcd payload histogram from both
# this binary and every binary on the shared recorder, so the two bucket
# ladders have to match or the series cannot be aggregated across jobs.
# A dev-dependency binds them without pulling the crate into the build.
common-metrics = { path = "../common/metrics" }
dashmap = { workspace = true }
flate2 = { workspace = true }
prost = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = "0.1"

[lints]
workspace = true
