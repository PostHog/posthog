[package]
name = "personhog-leader"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
personhog-proto = { path = "../personhog-proto" }
personhog-common = { path = "../personhog-common" }
personhog-coordination = { path = "../personhog-coordination" }
assignment-coordination = { path = "../common/assignment-coordination" }
common-kafka = { path = "../common/kafka" }
common-ingestion-warnings = { path = "../common/ingestion_warnings" }
common-metrics = { path = "../common/metrics" }
common-alloc = { path = "../common/alloc" }
k8s-awareness = { path = "../common/k8s-awareness" }
kube = { version = "0.98", features = ["client"] }
# Direct dep only to install a process-wide rustls CryptoProvider at startup (see
# main.rs): kube's HTTPS client uses rustls 0.23, which can't auto-pick a provider
# with both aws-lc-rs and ring in the tree. Matches personhog-router/cymbal.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
lifecycle = { path = "../common/lifecycle" }

async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
common-database = { path = "../common/database" }
dashmap = { workspace = true }
envconfig = { workspace = true }
foyer = "0.22.3"
metrics = { workspace = true }
prost = { workspace = true }
rdkafka = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
health = { path = "../common/health" }
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = "0.1"
tokio-util = { workspace = true }

[lints]
workspace = true
