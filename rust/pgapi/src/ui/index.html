<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pgcollector</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css" integrity="sha384-IfV0B7MIOYuO95kO9G5ySKPz/85zqFNOAs8iy4tkK5zd9izhJAB8b7lHrwYqqmYE" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js" integrity="sha384-Gx3t0zdBAuQOuvvmaLZj7HKEiSgWTAs+VdtNY7wt19QDPTDQjFIwAuXDj0zeN00c" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --panel2: #22262d; --border: #2c313a;
    --text: #e6e8eb; --muted: #8b93a1; --accent: #7aa2f7; --ok: #6cc38b; --warn: #e0af68; --error: #f7768e;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; display: flex; flex-direction: column; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header .brand { font-weight: 700; letter-spacing: .3px; }
  header .brand span { color: var(--muted); font-weight: 400; margin-left: 6px; }
  header .spacer { flex: 1; }
  header .me { color: var(--muted); font-size: 12px; }
  select, input, button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px; font-size: 12px; font-family: inherit; }
  button { cursor: pointer; } button:hover { border-color: var(--accent); }
  .layout { display: flex; flex: 1; min-height: 0; }
  nav { width: 170px; flex: 0 0 170px; border-right: 1px solid var(--border); padding: 10px 0; background: var(--panel); overflow-y: auto; }
  nav a { display: block; padding: 7px 16px; color: var(--muted); } nav a.active { color: var(--text); background: var(--panel2); border-right: 2px solid var(--accent); }
  nav .group { padding: 10px 16px 4px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  main { flex: 1; overflow: auto; padding: 16px 20px; }
  h1 { font-size: 16px; margin: 0 0 12px; } h1 .sub { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin: 0 0 12px; flex-wrap: wrap; }
  .grid { display: grid; gap: 12px; } .grid.two { grid-template-columns: 1fr 1fr; } .grid.tiles { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; min-width: 0; }
  .panel h2 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .tile .v { font-size: 20px; font-weight: 600; font-family: var(--mono); } .tile .l { color: var(--muted); font-size: 11px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; white-space: nowrap; cursor: pointer; user-select: none; } th.sorted { color: var(--text); }
  td.num, th.num { text-align: right; font-family: var(--mono); white-space: nowrap; }
  td.mono { font-family: var(--mono); } .muted { color: var(--muted); } .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--error); }
  .q { font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 520px; display: block; }
  .grid.two .q { max-width: 300px; } .panel.tight { overflow-x: auto; } .panel.tight .q { max-width: 240px; }
  .nowrap { white-space: nowrap; } .small { font-size: 11px; }
  pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-family: var(--mono); font-size: 11.5px; overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 0; max-height: 420px; }
  .error-box { padding: 10px 14px; color: var(--error); font-family: var(--mono); font-size: 12px; white-space: pre-wrap; border: 1px solid var(--error); border-radius: 6px; }
  .empty { color: var(--muted); padding: 8px 0; }
  .bar { display: inline-block; height: 8px; background: var(--accent); border-radius: 2px; vertical-align: middle; }
  .chart { min-height: 160px; }
  .uplot { font: 11px/1.4 inherit; width: 100%; }
  .u-legend { font-size: 11px; color: var(--muted); text-align: left; margin: 2px 0 0; }
  .u-legend .u-series > * { padding: 1px 4px; }
  .u-legend .u-value { font-family: var(--mono); color: var(--text); min-width: 4ch; }
  .u-legend .u-marker { width: 10px; height: 3px; margin-right: 6px; }
  .u-select { background: rgba(122, 162, 247, .18); }
  .u-hz .u-cursor-x { border-right: 1px dashed var(--muted); }
  .u-cursor-pt { border-width: 0 !important; }
  .marker { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed var(--c); pointer-events: none; }
  .marker i { position: absolute; top: -1px; left: -4px; width: 8px; height: 8px; background: var(--c); border-radius: 0 0 4px 4px; pointer-events: auto; cursor: help; }
  .kv td:first-child { color: var(--muted); width: 180px; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; background: var(--panel2); border: 1px solid var(--border); }
  .tag { display: inline-block; font-family: var(--mono); font-size: 11px; color: var(--accent); background: rgba(122, 162, 247, .1); border: 1px solid rgba(122, 162, 247, .3); border-radius: 4px; padding: 0 5px; margin: 0 4px 2px 0; max-width: 260px; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; white-space: nowrap; }
  .tag b { color: var(--muted); font-weight: 400; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border: 1px solid var(--accent); border-radius: 6px; font-family: var(--mono); font-size: 11px; }
  .chip button { padding: 0 4px; border: 0; background: none; color: var(--muted); }
  .clickable { cursor: pointer; } tr.clickable:hover td { background: var(--panel2); }
  details summary { cursor: pointer; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="brand">pgcollector<span>Postgres telemetry</span></div>
  <label>server <select id="server"></select></label>
  <label>range <select id="range">
    <option value="15m">15m</option><option value="1h" selected>1h</option><option value="6h">6h</option><option value="24h">24h</option><option value="7d">7d</option>
  </select></label>
  <button id="zoomout" title="widen the selected range" hidden>zoom out</button>
  <button id="refresh" title="reload">↻</button>
  <div class="spacer"></div>
  <div class="me" id="me"></div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script>
(() => {
  // ---------- state & routing ----------
  const PAGES = [
    ['overview', 'Overview'], ['queries', 'Queries'], ['activity', 'Activity'], ['waits', 'Wait events'], ['locks', 'Locks'],
    ['tables', 'Tables'], ['indexes', 'Indexes'], ['vacuum', 'Vacuum'], ['events', 'Events'], ['logs', 'Logs'],
    ['system', 'System'], ['schema', 'Schema'], ['settings', 'Settings'], ['collector', 'Collector health'],
  ];
  const state = { servers: [], server: null, page: 'overview', params: {}, range: '1h', build: null };
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v != null) e.setAttribute(k, v); }
    for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
    return e;
  };

  function parseHash() {
    const m = location.hash.match(/^#\/([^/]+)\/([^?]+)(?:\?(.*))?$/);
    if (!m) return null;
    return { server: decodeURIComponent(m[1]), page: m[2], params: Object.fromEntries(new URLSearchParams(m[3] || '')) };
  }
  // A custom range (from/to, set by dragging on a chart) follows the user across pages like the preset does; pass from: null to drop it.
  function hashFor(page, params = {}, server = state.server) {
    const { from, to } = state.params;
    const merged = Object.entries({ from, to, ...params }).filter(([, v]) => v != null && v !== '');
    const qs = new URLSearchParams(merged).toString();
    return `#/${encodeURIComponent(server)}/${page}${qs ? '?' + qs : ''}`;
  }
  function go(page, params = {}, server = state.server) { location.hash = hashFor(page, params, server); }
  const customRange = () => state.params.from && state.params.to ? { from: state.params.from, to: state.params.to } : null;
  const rangeQuery = () => customRange() || { since: state.range };
  const PRESET_MS = { '15m': 9e5, '1h': 36e5, '6h': 216e5, '24h': 864e5, '7d': 6048e5 };
  const spanMs = () => { const c = customRange(); return c ? new Date(c.to) - new Date(c.from) : PRESET_MS[state.range]; };
  function zoomTo(fromMs, toMs) { go(state.page, { ...state.params, from: new Date(fromMs).toISOString(), to: new Date(toMs).toISOString() }); }
  // Doubles the custom range around its centre. It returns to the preset only when the preset is at least as
  // wide as the doubled span, so zooming out never narrows the view (the preset is whatever the select shows,
  // which after a reload with a custom range in the URL is just the default).
  function zoomOut() {
    const c = customRange();
    if (!c) return;
    const from = +new Date(c.from), to = +new Date(c.to), span = to - from;
    const to2 = Math.min(Date.now(), to + span / 2), from2 = Math.max(to2 - span * 2, to2 - 31 * 864e5);
    if (PRESET_MS[state.range] >= to2 - from2) go(state.page, { ...state.params, from: null, to: null });
    else zoomTo(from2, to2);
  }

  // ---------- api & formatting ----------
  async function api(path, params = {}) {
    const qs = new URLSearchParams(Object.entries(params).filter(([, v]) => v != null && v !== '')).toString();
    const r = await fetch(`/api/v1${path}${qs ? '?' + qs : ''}`, { headers: { accept: 'application/json' } });
    // The page only ever hash-navigates, so this is the one place it can notice a deploy.
    const build = r.headers.get('x-pgapi-build');
    if (build && state.build && state.build !== build) location.reload();
    state.build = build;
    if (!r.ok) { let msg = `${r.status} ${r.statusText}`; try { msg += ': ' + (await r.json()).error; } catch {} throw new Error(msg); }
    return r.json();
  }
  const fmt = {
    num: v => v == null ? '–' : Number(v).toLocaleString(undefined, { maximumFractionDigits: 0 }),
    dec: (v, d = 2) => v == null ? '–' : Number(v).toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: 0 }),
    ms: v => v == null ? '–' : v === 0 ? '0 ms' : (v >= 1000 ? (v / 1000).toFixed(2) + ' s' : v >= 10 ? v.toFixed(1) + ' ms' : v.toFixed(3) + ' ms'),
    bytes: v => { if (v == null) return '–'; const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; v = Number(v); while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; } return v.toFixed(i ? 1 : 0) + ' ' + u[i]; },
    pct: v => v == null ? '–' : Number(v).toFixed(1) + '%',
    ago: t => { if (!t) return '–'; const s = (Date.now() - new Date(t)) / 1000; if (s < 90) return Math.round(s) + 's ago'; if (s < 5400) return Math.round(s / 60) + 'm ago'; if (s < 172800) return Math.round(s / 3600) + 'h ago'; return Math.round(s / 86400) + 'd ago'; },
    ts: t => t ? new Date(t).toLocaleString(undefined, { hour12: false }) : '–',
    time: t => t ? new Date(t).toLocaleTimeString(undefined, { hour12: false }) : '–',
    ratio: v => v == null ? '–' : el('span', { class: v >= 1 ? 'err' : v >= 0.7 ? 'warn' : '' }, Number(v).toFixed(2)),
  };

  // ---------- generic table ----------
  // cols: [{key, label, fmt?, num?, sort?(row)->number, render?(row)->node, cls?}]
  function table(rows, cols, { sortKey, desc = true, onRow, empty = 'nothing in this range', limit } = {}) {
    if (!rows || !rows.length) return el('div', { class: 'empty' }, empty);
    let sk = sortKey, sd = desc;
    const wrap = el('div');
    const render = () => {
      const sorted = [...rows];
      if (sk) { const c = cols.find(c => c.key === sk); const get = c && c.sort ? c.sort : r => r[sk]; sorted.sort((a, b) => { const x = get(a), y = get(b); if (x == null) return 1; if (y == null) return -1; return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y))) * (sd ? -1 : 1); }); }
      const shown = limit ? sorted.slice(0, limit) : sorted;
      const t = el('table', {},
        el('thead', {}, el('tr', {}, cols.map(c => el('th', { class: (c.num ? 'num ' : '') + (sk === c.key ? 'sorted' : ''), onclick: () => { if (sk === c.key) sd = !sd; else { sk = c.key; sd = true; } render(); } }, c.label, sk === c.key ? (sd ? ' ▾' : ' ▴') : '')))),
        el('tbody', {}, shown.map(r => el('tr', { class: onRow ? 'clickable' : '', onclick: onRow ? () => onRow(r) : null }, cols.map(c => {
          const v = c.render ? c.render(r) : c.fmt ? c.fmt(r[c.key], r) : r[c.key];
          return el('td', { class: (c.num ? 'num ' : '') + (c.cls || '') }, v == null ? el('span', { class: 'muted' }, '–') : v);
        })))));
      wrap.replaceChildren(...[t, limit && rows.length > limit ? el('div', { class: 'muted', style: 'padding:6px 8px' }, `showing ${limit} of ${rows.length}`) : null].filter(Boolean));
    };
    render();
    return wrap;
  }
  const panel = (title, ...kids) => el('div', { class: 'panel' }, title ? el('h2', {}, title) : null, ...kids);
  const tile = (label, value, cls = '') => el('div', { class: 'panel tile' }, el('div', { class: 'v ' + cls }, value ?? '–'), el('div', { class: 'l' }, label));
  const queryCell = q => el('span', { class: 'q', title: q || '' }, q || el('span', { class: 'muted' }, '(text not captured)'));
  // Tags label a query by the code that ran it (/* nodejs:PERSONS_WRITE<updatePersonsBatch> */, /* route='/api/x' */).
  const TAG_ORDER = ['service', 'db_use', 'operation', 'caller', 'route', 'controller', 'task', 'workflow', 'query_type', 'purpose', 'team_id'];
  const tagEntries = tags => tags ? Object.entries(tags).sort(([a], [b]) => (TAG_ORDER.indexOf(a) + 1 || 99) - (TAG_ORDER.indexOf(b) + 1 || 99)) : [];
  const tagPills = (tags, max = 5) => { const e = tagEntries(tags); if (!e.length) return null; return el('span', {}, e.slice(0, max).map(([k, v]) => el('span', { class: 'tag', title: `${k}=${v}` }, el('b', {}, k + '='), v)), e.length > max ? el('span', { class: 'muted' }, `+${e.length - max}`) : null); };
  // The row label: tags first, SQL underneath, so a list reads by code path rather than by statement text.
  const queryLabel = r => el('span', {}, tagPills(r.tags), r.tags && Object.keys(r.tags).length ? el('br') : null, queryCell(r.query));
  const tagFilterChip = (tags, onClear) => tags ? el('span', { class: 'chip' }, tags, el('button', { title: 'clear tag filter', onclick: onClear }, '✕')) : null;

  // ---------- time series chart (uPlot) ----------
  // series: [{name, color, points: [[Date, number | null]]}]; a null y breaks the line.
  // missing: what a bucket that a series has no point for counts as. 0 suits counts and
  // rates (nothing happened); null suits gauges and latency (nothing was measured) and draws a gap.
  // stacked: every series is drawn as an area on top of the ones before it, so missing is always 0.
  // Every chart on a page shares one cursor, and dragging across any of them sets the range.
  const charts = [];
  // Markers for the events in range are fetched once per page and drawn on every chart on it. The
  // routine kinds (pg_stat_statements evictions, cancelled statements, lock waits) would smother the rest, so they are left out.
  let markerEvents = Promise.resolve([]);
  const MARKER_EXCLUDE = 'pgss_dealloc,log_cancel,log_lock%';
  const markerColor = k => k.startsWith('settings') ? '#e0af68' : k.startsWith('schema') || k.startsWith('extensions') ? '#7aa2f7' : k.startsWith('log_') ? '#f7768e' : '#8b93a1';
  function loadMarkers() {
    markerEvents = api(`/servers/${state.server}/events`, { ...rangeQuery(), exclude: MARKER_EXCLUDE, limit: 500 }).catch(() => []);
  }
  function drawMarkers(u, events) {
    for (const m of u.over.querySelectorAll('.marker')) m.remove();
    const { min, max } = u.scales.x;
    for (const e of events) {
      const x = +new Date(e.at) / 1000;
      if (x < min || x > max) continue;
      const title = `${e.kind}: ${e.subject}${e.datname ? ` (${e.datname})` : ''}\n${fmt.ts(e.at)}`;
      u.over.append(el('div', { class: 'marker', style: `left:${u.valToPos(x, 'x')}px; --c:${markerColor(e.kind)}` }, el('i', { title })));
    }
  }
  const AXIS = { stroke: '#8b93a1', font: '11px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif', grid: { stroke: '#2c313a', width: 1 }, ticks: { stroke: '#2c313a', width: 1 } };
  function chart(series, { yfmt = v => fmt.dec(v, 1), stacked = false, missing = 0, height = 170 } = {}) {
    if (stacked) series = [...series.filter(s => !s.line), ...series.filter(s => s.line)];
    if (typeof uPlot === 'undefined') return el('div', { class: 'empty' }, 'Charts need cdn.jsdelivr.net, which this browser could not load. The tables below still work.');
    if (!series.some(s => s.points.some(p => p[1] != null))) return el('div', { class: 'empty' }, 'no data points');
    const sec = t => Math.floor(+t / 1000);
    const xs = padGaps([...new Set(series.flatMap(s => s.points.map(p => sec(p[0]))))].sort((a, b) => a - b));
    const at = new Map(xs.map((x, i) => [x, i]));
    const raw = series.map(s => { const col = Array(xs.length).fill(s.line ? null : stacked ? 0 : missing); for (const [t, v] of s.points) if (v != null) col[at.get(sec(t))] = v; return col; });
    // Band [upper, lower] clips the upper series' fill to its own layer; the lowest visible series fills down to zero on its own.
    // Hidden series are left out of the running total, so toggling one in the legend restacks the rest. Line series
    // stay unstacked and sit after the stacked ones, so the band indexes stay contiguous.
    const stack = show => {
      const acc = Array(xs.length).fill(0);
      const inStack = i => !series[i].line && show(i);
      const data = raw.map((col, i) => inStack(i) ? col.map((v, j) => (acc[j] += v)) : col);
      const vis = raw.map((_, i) => i).filter(inStack);
      return { data, bands: vis.slice(1).map((si, k) => ({ series: [si + 1, vis[k] + 1] })) };
    };
    let { data, bands } = stacked ? stack(() => true) : { data: raw, bands: [] };
    const restack = u => { const { data, bands } = stack(i => u.series[i + 1].show); u.delBand(null); bands.forEach(b => u.addBand(b)); u.setData([xs, ...data]); };
    const opts = {
      width: 600, height, bands,
      cursor: { y: false, sync: { key: 'page', setSeries: false }, drag: { x: true, y: false, setScale: false, dist: 4 }, points: { size: 6 }, bind: { dblclick: () => () => zoomOut() } },
      legend: { live: true },
      scales: { x: { time: true }, y: { range: (u, min, max) => [0, max > 0 ? uPlot.rangeNum(0, max, 0.1, true)[1] : 1] } },
      axes: [{ ...AXIS }, { ...AXIS, size: 60, values: (u, vals) => vals.map(yfmt) }],
      series: [
        { value: (u, v) => v == null ? '' : fmt.ts(new Date(v * 1000)) },
        ...series.map(s => ({ label: s.name, stroke: s.color, width: 1.5, points: { show: false }, dash: s.line ? [4, 4] : null, fill: stacked && !s.line ? s.color + '59' : null, spanGaps: !!s.line, value: (u, v, si, di) => di == null || raw[si - 1][di] == null ? '–' : yfmt(raw[si - 1][di]) })),
      ],
      hooks: { setSeries: stacked ? [restack] : [], draw: [u => markerEvents.then(ev => drawMarkers(u, ev))], setSelect: [u => {
        if (u.select.width < 4) return;
        const from = u.posToVal(u.select.left, 'x'), to = u.posToVal(u.select.left + u.select.width, 'x');
        u.setSelect({ width: 0, height: 0 }, false);
        zoomTo(from * 1000, to * 1000);
      }] },
    };
    const wrap = el('div', { class: 'chart' });
    let u = null;
    // The panel is not in the document yet, so the width is only known once it is laid out.
    const ro = new ResizeObserver(([e]) => {
      const width = Math.floor(e.contentRect.width);
      if (width <= 0) return;
      if (!u) { u = new uPlot({ ...opts, width }, [xs, ...data], wrap); charts.push({ u, ro }); } else u.setSize({ width, height });
    });
    ro.observe(wrap);
    return wrap;
  }
  // A bucket that no series has a point for is absent from the x values, and the line would bridge it as if
  // nothing happened. Gaps wider than 2.5 times the typical spacing get synthetic x values, which take the
  // chart's missing value like any other absent bucket.
  function padGaps(xs) {
    if (xs.length < 3) return xs;
    const steps = xs.slice(1).map((x, i) => x - xs[i]).sort((a, b) => a - b), step = steps[steps.length >> 1];
    const out = [xs[0]];
    for (const x of xs.slice(1)) {
      let prev = out[out.length - 1];
      if (x - prev > step * 2.5) for (prev += step; prev < x - step / 2 && out.length < 5000; prev += step) out.push(prev);
      out.push(x);
    }
    return out;
  }
  function destroyCharts() { for (const c of charts.splice(0)) { c.ro.disconnect(); c.u.destroy(); } }
  const COLORS = ['#7aa2f7', '#6cc38b', '#e0af68', '#f7768e', '#bb9af7', '#7dcfff', '#ff9e64', '#9ece6a'];
  const bucketFor = () => { const s = spanMs(); return s <= 30 * 60e3 ? '10s' : s <= 6 * 3600e3 ? '1m' : s <= 36 * 3600e3 ? '5m' : '1h'; };
  const BUCKET_LABEL = { '10s': '10 seconds', '1m': 'minute', '5m': '5 minutes', '1h': 'hour' };

  // ---------- pages ----------
  const pages = {};

  pages.queries = async () => {

      el('div', { style: 'margin-top:12px' }, panel('auto_explain plans from the log', d.logged_plans.length ? d.logged_plans.map(p => el('details', {}, el('summary', {}, `${fmt.ts(p.log_time)} · ${fmt.ms(p.duration_ms)} · ${p.datname}`), el('pre', {}, JSON.stringify(p.plan, null, 2)))) : el('div', { class: 'empty' }, 'none in range'))),
    ];

  pages.activity = async () => {
    const d = await api(`/servers/${state.server}/activity`);
    return [
      el('h1', {}, 'Activity', el('span', { class: 'sub' }, 'latest 10s sample')),

        panel('Lock waits (blocking graph)', table(d.lock_waits, [{ key: 'waiter_pid', label: 'waiter', num: true }, { key: 'waiting_s', label: 'waiting', num: true, fmt: v => fmt.dec(v, 0) + ' s' }, { key: 'wanted_mode', label: 'mode' }, { key: 'relation', label: 'relation' }, { key: 'blocker_pid', label: 'blocker', num: true }, { key: 'blocker_state', label: 'blocker state' }, { key: 'blocker_query', label: 'blocker query', render: r => queryCell(r.blocker_query) }], { empty: 'nothing blocked' })),
      ),
      el('div', { style: 'margin-top:12px' }, panel('Long-running / waiting / idle-in-transaction sessions', table(d.sessions, [

        { key: 'wait_event_type', label: 'wait', fmt: (v, r) => v ? `${v}:${r.wait_event}` : 'CPU' }, { key: 'query_age_s', label: 'query age', num: true, fmt: v => fmt.dec(v, 0) + ' s' }, { key: 'xact_age_s', label: 'xact age', num: true, fmt: v => fmt.dec(v, 0) + ' s' }, { key: 'blocked_by', label: 'blocked by' },

  const secs = v => v == null ? '–' : v >= 3600 ? (v / 3600).toFixed(1) + ' h' : v >= 90 ? Math.round(v / 60) + ' min' : Math.round(v) + ' s';

  // Consecutive 10 s samples with the same state, statement, wait and blocker collapse into one span, so a
  // blocker's history reads as "ran X for 8 s, then sat idle in transaction for 15 min". A gap over 30 s or a
  // different backend_start (the pid was reused) starts a new span rather than bridging what was not sampled.
  function sessionSpans(rows) {
    const out = [];
    const same = (a, b) => a.state === b.state && a.query === b.query && a.wait_event_type === b.wait_event_type && a.wait_event === b.wait_event && a.blocked_by === b.blocked_by && a.backend_start === b.backend_start && new Date(b.collected_at) - new Date(a.last) <= 30e3;
    for (const r of rows) {
      const last = out[out.length - 1];
      if (last && same(last, r)) { last.last = r.collected_at; last.xact_age_s = r.xact_age_s; last.samples++; last.trace_id = r.trace_id || last.trace_id; }
      else out.push({ ...r, first: r.collected_at, last: r.collected_at, samples: 1 });

  }

  pages.locks = async () => {

    const sel = state.params.session ? state.params.session.split(':').map(decodeURIComponent) : null;

    const history = sel ? await api(`/servers/${state.server}/sessions/${sel[1]}`, { instance: sel[0], from: sel[2], to: sel[3], backend_start: sel[4] || null, at: sel[5] || null }).catch(e => ({ error: String(e.message || e) })) : null;
    const clearSel = () => { const p = { ...state.params }; delete p.session; go('locks', p); };

      el('h1', {}, 'Locks', el('span', { class: 'sub' }, 'who waited for whom, from 10 s samples of blocked sessions')),
      panel(`Sessions waiting on locks per ${per}, by lock type`, chart(series, { stacked: true, yfmt: v => fmt.dec(v, 2) })),
      history ? el('div', { style: 'margin-top:12px' }, panel(null,
        el('div', { class: 'toolbar' }, el('h2', { style: 'margin:0' }, `Blocker pid ${sel[1]} on ${sel[0]}`), el('span', { class: 'muted' }, `${fmt.ts(sel[2])} to ${fmt.ts(sel[3])}`), el('button', { onclick: clearSel }, '✕ close')),
        history.error ? el('div', { class: 'error-box' }, `Couldn't load the session history: ${history.error}. Try again, and if it keeps happening check the API logs.`) : table(sessionSpans(history), [

    destroyCharts();
    loadMarkers();
    main.replaceChildren(el('div', { class: 'muted' }, 'loading…'));
    try { const out = await fn(); main.replaceChildren(...[out].flat(Infinity).filter(Boolean)); }
    catch (e) { main.replaceChildren(el('div', { class: 'error-box' }, String(e.message || e))); }
  }
  async function route() {
    const h = parseHash();
    if (!h && state.servers.length) { go('overview', {}, state.servers[0].server_id); return; }
    if (h) { state.server = h.server; state.page = h.page; state.params = h.params; }
    $('#server').value = state.server;
    syncRangeControl();
    renderNav();
    render();
  }
  function syncRangeControl() {
    const sel = $('#range'), c = customRange();
    sel.querySelector('option[value=custom]')?.remove();
    if (c) sel.append(el('option', { value: 'custom', selected: '' }, `${fmt.time(c.from)} to ${fmt.time(c.to)}`));
    else sel.value = state.range;
    $('#zoomout').hidden = !c;
  }
  async function boot() {
    try { const me = await api('/me'); $('#me').textContent = `${me.email} · ${me.source}`; } catch (e) { $('#me').textContent = 'unauthenticated'; }
    try { state.servers = await api('/servers'); } catch (e) { $('#main').replaceChildren(el('div', { class: 'error-box' }, String(e.message))); return; }
    const sel = $('#server');
    sel.replaceChildren(...state.servers.map(s => el('option', { value: s.server_id }, `${s.server_id}${s.errors_10m ? ' ⚠' : ''}`)));
    sel.onchange = () => go(state.page === 'query' ? 'queries' : state.page, {}, sel.value);
    $('#range').onchange = e => { if (e.target.value === 'custom') return; state.range = e.target.value; if (customRange()) go(state.page, { ...state.params, from: null, to: null }); else render(); };
    $('#zoomout').onclick = zoomOut;
    $('#refresh').onclick = render;
    window.addEventListener('hashchange', route);
    if (!state.servers.length) { $('#main').replaceChildren(el('div', { class: 'empty' }, 'no servers registered yet — is the collector running?')); return; }
    route();
  }
  boot();
})();
</script>
</body>
</html>
