                body: JSON.stringify({ version_id }),
              });
              this.refresh();
            } catch (e) {
              error.replaceChildren(el("div", { class: "error-box" }, String(e)));
            } finally {
              button.disabled = false;
            }
          };
          return el("div", { style: "padding: 0 14px 6px" },
            el("div", { class: "row" }, versions, button),
            error);
        },

        migrationForm(view) {
          const m = view.migration;
          const r = view.request;
          const form = el("div", { class: "row", style: "padding: 6px 14px; border-top: 1px solid var(--border)" });
          if (m) {
            const cancellable = ["Freezing", "Draining"].includes(m.phase);
            const cancel = el("button", { disabled: !cancellable }, "Cancel migration");
            cancel.onclick = () => this.postChangelogAction("api/personhog/migrations/current", {
              method: "DELETE",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ id: m.id }),
            },
              `Cancel the migration to ${m.to.topic}? Held partitions resume on ${m.from.topic}.`);
            form.append(
              el("span", { class: "pill warn" }, `migrating: ${m.phase}`),
              el("span", { class: "mono" }, `${m.from.topic} (${fmtInt(m.from.partitions)}) → ${m.to.topic} (${fmtInt(m.to.partitions)})`),
              cancel);
          } else if (r) {
            const withdraw = el("button", {}, "Stop migration");
            withdraw.onclick = () => this.postChangelogAction("api/personhog/migrations/current", {
              method: "DELETE",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ id: r.id }),
            },
              `Stop the migration to ${r.to.topic}? It has not started, so nothing is held; if it starts in the meantime, it is cancelled before the flip.`);
            form.append(
              el("span", { class: "pill muted" }, "requested: waiting to start"),
              el("span", { class: "mono" }, `${r.from.topic} (${fmtInt(r.from.partitions)}) → ${r.to.topic} (${fmtInt(r.to.partitions)})`),
              withdraw);
          } else {
            const topicInput = el("input", { type: "text", placeholder: "target topic, e.g. personhog_updates_128", style: "width: 360px" });
            const start = el("button", {}, "Migrate changelog");
            start.onclick = () => {
              const topic = topicInput.value.trim();
              if (!topic) return;
              this.postChangelogAction("api/personhog/migrations", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ topic }),
              }, `Migrate the changelog to ${topic}?\n\nThe coordinator starts it once no partition is moving and every owner is ready, then every partition pauses briefly while the fleet restarts onto the new topic. The partition count is read from the topic's metadata.`);
            };
            form.append(topicInput, start);
          }
          return form;
        },

        migrationDetail(view) {
          const m = view.migration;
          const r = view.request;
          const body = el("div", { style: "padding: 0 14px 6px" });
          if (m) {
            body.append(m.blocking.length === 0
              ? el("div", { class: "muted" }, "Nothing blocking.")
              : el("ul", { class: "mono", style: "margin: 4px 0" }, m.blocking.slice(0, 12).map((b) => el("li", {}, b))));
          } else if (r) {
            body.append(r.waiting.length === 0
              ? el("div", { class: "muted" }, "Starting once no partition is moving and every owner is ready.")
              : el("ul", { class: "mono", style: "margin: 4px 0" }, r.waiting.slice(0, 12).map((w) => el("li", {}, w))));
          }
          for (const g of view.draining) {
            const groups = [g.writer, ...g.retire_groups];
            const isDrained = (d) => !d.error && d.partitions > 0 && d.drained_partitions === d.partitions;
            const drained = groups.every(isDrained);
            const retire = el("button", { disabled: !drained }, `Retire ${g.topic}`);
            retire.onclick = () => this.postChangelogAction("api/personhog/changelog/retire", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ topic: g.topic }),
            }, `Retire ${g.topic} now?\n\nEvery gating group has read it to the end. The coordinator retires it on its own once each group reports the drain. Retiring now skips that wait. Delete the topic in Terraform afterwards.`);
            body.append(el("div", { class: "row", style: "margin-top: 6px" },
              el("span", { class: "pill muted mono" }, `${g.topic} (${fmtInt(g.partitions)}, epoch ${fmtInt(g.epoch)}) draining`),
              groups.map((d) => el("span", { class: `pill ${d.error ? "bad" : isDrained(d) ? "good" : "warn"}`, title: d.error || "" },
                `${d.group}: ${fmtInt(d.drained_partitions)}/${fmtInt(d.partitions)}${d.reported ? " · reported" : ""}`)),
              retire));
          }
          if (view.history.length > 0) {
            body.append(el("table", {},
              el("thead", {}, el("tr", {}, el("th", {}, "migration"), el("th", {}, "from"), el("th", {}, "to"), el("th", {}, "outcome"))),
              el("tbody", {}, view.history.slice(0, 5).map((h) =>
                el("tr", {},
                  el("td", { class: "mono" }, h.id),
                  el("td", { class: "mono" }, `${h.from.topic} (${fmtInt(h.from.partitions)})`),
                  el("td", { class: "mono" }, `${h.to.topic} (${fmtInt(h.to.partitions)})`),
                  el("td", {},
                    el("span", { class: `pill ${h.phase === "Complete" ? "good" : "bad"}`, title: h.blocking.join("; ") }, h.phase),
                    h.cancel_reason ? el("span", { class: "muted mono", style: "margin-left: 8px" }, h.cancel_reason)
                      : h.phase !== "Complete" && h.blocking.length > 0 ? el("span", { class: "muted mono", style: "margin-left: 8px" }, h.blocking.join("; ")) : null,
                    h.phase === "Complete" && !view.draining.some((g) => g.topic === h.from.topic) ? el("span", { class: "muted", style: "margin-left: 8px" }, `${h.from.topic} is retired; delete it in Terraform`) : null))))));
          }
          return body;
        },

        render(data) {
          const readyPods = data.pods.filter((p) => p.status === "Ready").length;
          const errors = data.issues.filter((issue) => issue.severity === "error").length;
          const warnings = data.issues.filter((issue) => issue.severity === "warning").length;
          // replaceChildren stringifies nulls instead of skipping them like
          // el() does, so absent pills must be filtered out.
          this.ui.summary.replaceChildren(...[
            data.leader
              ? el("span", { class: "pill good", title: `lease ${data.leader.lease_id}${data.leader.lease_ttl_secs !== null ? ` · ttl ${data.leader.lease_ttl_secs}s` : ""}` }, `coordinator ${data.leader.holder}`)
              : el("span", { class: "pill bad" }, "no coordinator"),
            el("span", { class: "pill muted" },
              data.total_partitions === null ? "changelog not seeded" : `${fmtInt(data.total_partitions)} partitions`),
            el("span", { class: `pill ${readyPods === data.pods.length && readyPods > 0 ? "good" : "warn"}` },
              `${fmtInt(readyPods)}/${fmtInt(data.pods.length)} pods ready`),
            el("span", { class: "pill muted" }, `${fmtInt(data.routers.length)} router${data.routers.length === 1 ? "" : "s"}`),
            errors ? el("span", { class: "pill bad" }, `${fmtInt(errors)} error${errors === 1 ? "" : "s"}`) : null,
            warnings ? el("span", { class: "pill warn" }, `${fmtInt(warnings)} warning${warnings === 1 ? "" : "s"}`) : null,
            el("span", { class: "muted mono", style: "margin-left: auto" },
              `rev ${fmtInt(data.revision)} · as of ${new Date(data.fetched_at).toLocaleTimeString()}`),
          ].filter(Boolean));

          const pillFor = { error: "bad", warning: "warn", info: "muted" };
          this.ui.issuesBody.replaceChildren(
            data.issues.length === 0
              ? el("div", { class: "empty" }, "No issues detected.")
              : el("div", { style: "padding: 6px 0" }, data.issues.map((issue) =>
                  el("div", { class: "row", style: "padding: 4px 14px" },
                    el("span", { class: `pill ${pillFor[issue.severity] || "muted"}` }, issue.severity),
                    el("span", {}, issue.summary))))
          );

          this.partitionsView.setRows(data.partitions);
          this.ui.partitionsBody.replaceChildren(this.partitionsView.body);
          this.ui.podsBody.replaceChildren(this.renderPodsTable(data.pods));
          this.ui.routersBody.replaceChildren(this.renderRoutersTable(data.routers));
        },

        renderPartitionsTable(rows) {
          return el("table", {},
            el("thead", {}, el("tr", {},
              el("th", {}, "partition"), el("th", {}, "owner"), el("th", {}, "address"),
              el("th", {}, "handoff"), el("th", {}, "waiting on"))),
            el("tbody", {}, rows.map((p) => {
              const h = p.handoff;
              const phasePill = h
                ? el("span", {
                    class: `pill ${h.past_deadline ? "bad" : h.phase === "Complete" ? "good" : "accent"}`,
                    title: `${h.old_owner ? `${h.old_owner} → ` : ""}${h.new_owner} · ${h.handoff_id}`,
                  }, `${h.phase}${h.phase_age_secs !== null ? ` ${h.phase_age_secs}s` : ""}${h.past_deadline ? " ⏰" : ""}`)
                : el("span", { class: "muted" }, "–");
              return el("tr", {},
                el("td", { class: "mono" }, String(p.partition)),
                el("td", { class: "mono" }, p.owner
                  ? el("span", {}, p.owner, " ", p.owner_registered === false ? el("span", { class: "pill bad" }, "gone") : null)
                  : el("span", { class: "pill warn" }, "unassigned")),
                el("td", { class: "muted mono" }, p.advertise_address || "–"),
                el("td", {}, phasePill),
                el("td", { class: "muted" }, h && h.waiting_on ? h.waiting_on : "–"));
            }))
          );
        },

        renderPodsTable(pods) {
          if (!pods.length) return el("div", { class: "empty" }, "No pods registered.");
          return el("table", {},
            el("thead", {}, el("tr", {},
              el("th", {}, "pod"), el("th", {}, "status"), el("th", {}, "address"),
              el("th", {}, "lease ttl"), el("th", {}, "heartbeat"), el("th", {}, "partitions"))),
            el("tbody", {}, pods.map((pod) =>
              el("tr", {},
                el("td", { class: "mono" }, pod.pod_name),
                el("td", {}, el("span", { class: `pill ${pod.status === "Ready" ? "good" : "warn"}` }, pod.status)),
                el("td", { class: "muted mono" }, pod.advertise_address || "–"),
                el("td", { class: "mono" }, pod.lease_ttl_secs === null ? "–" : `${pod.lease_ttl_secs}s`),
                el("td", { class: "muted mono" }, pod.last_heartbeat ? fmtAgo(pod.last_heartbeat * 1000) : "–"),
                el("td", { class: "mono", title: pod.partitions.join(", ") },
                  `${fmtInt(pod.partitions.length)}`))
            ))
          );
        },

        renderRoutersTable(routers) {
          if (!routers.length) return el("div", { class: "empty" }, "No routers registered.");
          return el("table", {},
            el("thead", {}, el("tr", {},
              el("th", {}, "router"), el("th", {}, "lease ttl"), el("th", {}, "heartbeat"))),
            el("tbody", {}, routers.map((router) =>
              el("tr", {},
                el("td", { class: "mono" }, router.router_name),
                el("td", { class: "mono" }, router.lease_ttl_secs === null ? "–" : `${router.lease_ttl_secs}s`),
                el("td", { class: "muted mono" }, router.last_heartbeat ? fmtAgo(router.last_heartbeat * 1000) : "–"))
            ))
          );
        },
      };

      // ---------- section: personhog parity ----------
      const paritySection = {
        id: "parity",
        title: "Personhog parity",
        description: "Recent disagreements between the Node and personhog CDC feeds, from the parity monitor's sample. Newest first. Refreshes every 30 seconds.",
        timers: [],
        refreshSeq: 0,
        unmount() {
          this.timers.forEach(clearInterval);
          this.timers = [];
        },
        mount(root) {
          this.loaded = false;
          this.ui = {
            summary: el("div", { class: "row", style: "padding: 0 0 10px" }),
            mappingsBody: el("div", {}, el("div", { class: "empty" }, "Loading…")),
            mergesBody: el("div", {}, el("div", { class: "empty" }, "Loading…")),
            personsBody: el("div", {}, el("div", { class: "empty" }, "Loading…")),
          };
          const matchesAny = (values, q) =>
            values.some((v) => v !== null && v !== undefined && String(v).toLowerCase().includes(q));
          this.mappingsView = listView({
            placeholder: "Filter by team, id, or outcome…",
            pageSize: 100,
            matches: (s, q) => matchesAny(
              [s.team_id, s.distinct_id, s.outcome, s.node && s.node.person_uuid, s.personhog && s.personhog.person_uuid], q),
            renderTable: (rows) => this.renderMappings(rows),
            emptyText: "No distinct id disagreements in the sample.",
          });
          this.mergesView = listView({
            placeholder: "Filter by team, person, or outcome…",
            pageSize: 100,
            matches: (s, q) => matchesAny([s.team_id, s.old_person_uuid, s.outcome, s.node, s.personhog], q),
            renderTable: (rows) => this.renderMerges(rows),
            emptyText: "No merge disagreements in the sample.",
          });
          this.personsView = listView({
            placeholder: "Filter by team, person, or outcome…",
            pageSize: 100,
            matches: (s, q) => matchesAny([s.team_id, s.person_uuid, s.outcome, ...(s.differing_properties || [])], q),
            renderTable: (rows) => this.renderPersons(rows),
            emptyText: "No person disagreements in the sample. The monitor compares persons only when both person topics are set.",
          });
          root.append(
            this.ui.summary,
            el("div", { class: "panel" }, el("h2", {}, "Distinct ids"), this.ui.mappingsBody),
            el("div", { class: "panel" }, el("h2", {}, "Merges"), this.ui.mergesBody),
            el("div", { class: "panel" }, el("h2", {}, "Persons"), this.ui.personsBody)
          );
          this.refresh();
          this.timers.push(setInterval(() => this.refresh(), 30000));
        },

        async refresh() {
          const seq = ++this.refreshSeq;
          let data;
          try {
            data = await fetchJSON("api/personhog/parity/mismatches");
          } catch (e) {
            if (seq !== this.refreshSeq) return;
            this.ui.summary.replaceChildren(el("div", { class: "error-box", style: "flex: 1 1 100%" }, String(e)));
            if (!this.loaded) {
              this.ui.mappingsBody.replaceChildren(el("div", { class: "empty" }, "No data."));
              this.ui.mergesBody.replaceChildren(el("div", { class: "empty" }, "No data."));
              this.ui.personsBody.replaceChildren(el("div", { class: "empty" }, "No data."));
            }
            return;
          }
          if (seq !== this.refreshSeq) return;
          this.loaded = true;
          this.render(data);
        },

        render(data) {
          // One sweep pushes its verdicts in hash map order, so the ring alone is not time ordered.
          const at = (s) => (typeof s.last_update_ms === "number" ? s.last_update_ms : Number.MIN_SAFE_INTEGER);
          const samples = data.samples.slice().reverse().sort((a, b) => at(b) - at(a));
          const counts = new Map();
          for (const s of samples) {
            const label = s.kind === "mapping" ? s.outcome : `${s.kind} ${s.outcome}`;
            counts.set(label, (counts.get(label) || 0) + 1);
          }
          this.ui.summary.replaceChildren(
            el("span", { class: "pill muted" }, `${fmtInt(samples.length)} in sample`),
            ...[...counts.entries()].map(([label, n]) => el("span", { class: "pill warn" }, `${label} ${fmtInt(n)}`)),
            el("span", { class: "muted" }, "The monitor keeps recent disagreements in memory, so older ones drop out and a restart clears them."),
            el("span", { class: "muted mono", style: "margin-left: auto" }, `as of ${new Date(data.fetched_at).toLocaleTimeString()}`),
            el("button", { class: "small", onclick: () => this.refresh() }, "Refresh")
          );
          this.mappingsView.setRows(samples.filter((s) => s.kind === "mapping"));
          this.ui.mappingsBody.replaceChildren(this.mappingsView.body);
          this.mergesView.setRows(samples.filter((s) => s.kind === "merge"));
          this.ui.mergesBody.replaceChildren(this.mergesView.body);
          this.personsView.setRows(samples.filter((s) => s.kind === "person"));
          this.ui.personsBody.replaceChildren(this.personsView.body);
        },

        when(sample) {
          if (sample.last_update_ms === null || sample.last_update_ms === undefined) return "–";
          const at = new Date(sample.last_update_ms);
          return el("span", { title: at.toISOString() }, `${at.toLocaleTimeString()} · ${fmtAgo(sample.last_update_ms)}`);
        },

        shortId(uuid) {
          if (!uuid) return el("span", { class: "pill bad" }, "missing");
          return el("span", { class: "mono", title: `${uuid} (click to copy)`, onclick: (e) => { e.stopPropagation(); copy(uuid); } },
            `${uuid.slice(0, 8)}…`);
        },

        renderMappings(rows) {
          const person = (row) => this.shortId(row ? row.person_uuid : null);
          return el("div", { class: "scroll-x" }, el("table", {},
            el("thead", {}, el("tr", {},
              el("th", {}, "time"), el("th", {}, "team"), el("th", {}, "distinct id"), el("th", {}, "outcome"),
              el("th", {}, "node person"), el("th", {}, "personhog person"), el("th", {}, "deleted"),
              el("th", { title: "Versions order rows within one feed and are not compared across feeds" }, "versions"))),
            el("tbody", {}, rows.map((s) => {
              const node = s.node, personhog = s.personhog;
              const both = node && personhog;
              const personClass = both && node.person_uuid !== personhog.person_uuid ? "mono diff" : "mono";
              const deletedClass = both && node.is_deleted !== personhog.is_deleted ? "mono diff" : "mono";
              const pair = (f) => `${node ? f(node) : "–"} / ${personhog ? f(personhog) : "–"}`;
              return el("tr", {},
                el("td", { class: "muted mono nowrap" }, this.when(s)),
                el("td", { class: "mono" }, String(s.team_id)),
                el("td", { class: "mono" }, copyable(s.distinct_id, "clip")),
                el("td", { class: "nowrap" }, el("span", { class: "pill warn" }, s.outcome)),
                el("td", { class: personClass }, person(node)),
                el("td", { class: personClass }, person(personhog)),
                el("td", { class: `${deletedClass} nowrap` }, pair((r) => (r.is_deleted ? "yes" : "no"))),
                el("td", { class: "muted mono nowrap" }, pair((r) => String(r.version))));
            }))
          ));
        },

        renderPersons(rows) {
          return el("div", { class: "scroll-x" }, el("table", {},
            el("thead", {}, el("tr", {},
              el("th", {}, "time"), el("th", {}, "team"), el("th", {}, "person"), el("th", {}, "outcome"),
              el("th", { title: "Top level property keys whose values differ or that one side lacks" }, "differing properties"),
              el("th", {}, "deleted"), el("th", {}, "identified"), el("th", {}, "created at"),
              el("th", { title: "Versions order rows within one feed and are not compared across feeds" }, "versions"))),
            el("tbody", {}, rows.map((s) => {
              const node = s.node, personhog = s.personhog;
              const both = node && personhog;
              const pair = (f) => `${node ? f(node) : "–"} / ${personhog ? f(personhog) : "–"}`;
              const differs = (f) => (both && f(node) !== f(personhog) ? "mono diff nowrap" : "mono nowrap");
              const keys = s.differing_properties || [];
              return el("tr", {},
                el("td", { class: "muted mono nowrap" }, this.when(s)),
                el("td", { class: "mono" }, String(s.team_id)),
                el("td", { class: "mono" }, this.shortId(s.person_uuid)),
                el("td", { class: "nowrap" }, el("span", { class: "pill warn" }, s.outcome)),
                el("td", { class: keys.length ? "mono diff" : "muted" }, keys.length ? keys.join(", ") : "–"),
                el("td", { class: differs((r) => r.is_deleted) }, pair((r) => (r.is_deleted ? "yes" : "no"))),
                el("td", { class: differs((r) => r.is_identified) }, pair((r) => (r.is_identified ? "yes" : "no"))),
                el("td", { class: differs((r) => r.created_at) }, pair((r) => r.created_at)),
                el("td", { class: "muted mono nowrap" }, pair((r) => String(r.version))));
            }))
          ));
        },

        renderMerges(rows) {
          const orDash = (v) => (v === null || v === undefined ? "–" : String(v));
          return el("div", { class: "scroll-x" }, el("table", {},
            el("thead", {}, el("tr", {},
              el("th", {}, "time"), el("th", {}, "team"), el("th", {}, "merged person"), el("th", {}, "outcome"),
              el("th", {}, "node survivor"), el("th", {}, "personhog survivor"), el("th", {}, "partitions"))),
            el("tbody", {}, rows.map((s) => {
              const survivorClass = s.node && s.personhog && s.node !== s.personhog ? "mono diff" : "mono";
              const [nodePartition, personhogPartition] = s.partitions || [null, null];
              return el("tr", {},
                el("td", { class: "muted mono nowrap" }, this.when(s)),
                el("td", { class: "mono" }, String(s.team_id)),
                el("td", { class: "mono" }, this.shortId(s.old_person_uuid)),
                el("td", { class: "nowrap" }, el("span", { class: "pill warn" }, s.outcome)),
                el("td", { class: survivorClass }, this.shortId(s.node)),
                el("td", { class: survivorClass }, this.shortId(s.personhog)),
                el("td", { class: "muted mono nowrap" }, `${orDash(nodePartition)} / ${orDash(personhogPartition)}`));
            }))
          ));
        },
      };

      // ---------- boot ----------
      SECTIONS.push(lagSection, debugSection, personhogSection, paritySection, etcdSection);
      const nav = document.getElementById("nav");
      for (const section of SECTIONS) {
        nav.append(el("span", { class: "nav-item", "data-id": section.id, onclick: () => navigate(section.id) }, section.title));
      }
      navigate(location.hash.replace("#", "") || SECTIONS[0].id);
    </script>
  </body>
</html>
