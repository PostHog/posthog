packages:
    - '.'
    - common/esbuilder
    - common/hogvm/typescript
    - common/plugin_transpiler
    - common/storybook
    - common/replay-shared
    - common/replay-headless
    - common/tailwind
    - packages/llm-normalizer
    - packages/quill
    - packages/quill/apps/*
    - packages/quill/packages/*
    - frontend
    - playwright
    - nodejs
    - nodejs/src/scripts
    - products/*
    # products/desktop is a nested standalone workspace (own lockfile, catalog,
    # overrides, Node version); the root install must not absorb it.
    - '!products/desktop'
    - docs/onboarding
    - services/agent-proxy
    - services/integration-service
    - services/oauth-proxy
    - services/mcp
    - services/stripe-app
    - tools/*
    - '!tools/hedgebox-dummy'
    - rust/common/hogvm/node
    - rust/replay-anonymizer-node

blockExoticSubdeps: true
trustPolicy: no-downgrade

# Fix React versions across the monorepo.
overrides:
    axios: ^1.15.0
    '@modelcontextprotocol/sdk': ^1.29.0
    '@types/react': 18.3.27
    '@types/react-dom': 18.3.7
    cipher-base: '>=1.0.5'
    d3-geo: '>=3.1.0'
    d3-selection: '>=3.0.0'
    d3-zoom: '>=3.0.0'
    form-data: '>=4.0.4'
    node-forge: '>=1.4.0'
    pbkdf2: '>=3.1.3'
    react: 18.3.1
    react-dom: 18.3.1
    sha.js: '>=2.4.12'
    typescript: 6.0.3
    ultimate-express>uWebSockets.js: '-'
    fast-xml-parser@^4: '>=4.5.4'
    fast-xml-parser@^5: '>=5.3.5'
    jest-playwright-preset>playwright-core: 1.60.0
    '@smithy/node-http-handler': 4.4.9
    '@smithy/core': 3.24.6
    rolldown: 1.1.4
    '@tiptap/core': 3.20.6
    '@tiptap/extensions': 3.20.6
    '@tiptap/html': 3.20.6
    '@tiptap/markdown': 3.20.6
    '@tiptap/pm': 3.20.6
    '@tiptap/react': 3.20.6
    '@tiptap/starter-kit': 3.20.6
    '@tiptap/suggestion': 3.20.6
    '@tiptap/extension-blockquote': 3.20.6
    '@tiptap/extension-bold': 3.20.6
    '@tiptap/extension-bubble-menu': 3.20.6
    '@tiptap/extension-bullet-list': 3.20.6
    '@tiptap/extension-code': 3.20.6
    '@tiptap/extension-code-block': 3.20.6
    '@tiptap/extension-code-block-lowlight': 3.20.6
    '@tiptap/extension-collaboration': 3.20.6
    '@tiptap/extension-color': 3.20.6
    '@tiptap/extension-document': 3.20.6
    '@tiptap/extension-drag-handle': 3.20.6
    '@tiptap/extension-drag-handle-react': 3.20.6
    '@tiptap/extension-dropcursor': 3.20.6
    '@tiptap/extension-floating-menu': 3.20.6
    '@tiptap/extension-gapcursor': 3.20.6
    '@tiptap/extension-hard-break': 3.20.6
    '@tiptap/extension-heading': 3.20.6
    '@tiptap/extension-horizontal-rule': 3.20.6
    '@tiptap/extension-image': 3.20.6
    '@tiptap/extension-italic': 3.20.6
    '@tiptap/extension-link': 3.20.6
    '@tiptap/extension-list': 3.20.6
    '@tiptap/extension-list-item': 3.20.6
    '@tiptap/extension-list-keymap': 3.20.6
    '@tiptap/extension-node-range': 3.20.6
    '@tiptap/extension-ordered-list': 3.20.6
    '@tiptap/extension-paragraph': 3.20.6
    '@tiptap/extension-placeholder': 3.20.6
    '@tiptap/extension-strike': 3.20.6
    '@tiptap/extension-table': 3.20.6
    '@tiptap/extension-table-of-contents': 3.20.6
    '@tiptap/extension-text': 3.20.6
    '@tiptap/extension-text-align': 3.20.6
    '@tiptap/extension-text-style': 3.20.6
    '@tiptap/extension-underline': 3.20.6

patchedDependencies:
    heatmap.js@2.0.5: patches/heatmap.js@2.0.5.patch
    dayjs@1.11.11: patches/dayjs@1.11.11.patch
    kea@4.0.0-pre.6: patches/kea@4.0.0-pre.6.patch

# Dependencies that require preinstall scripts. Add entries with caution.
onlyBuiltDependencies:
    - '@modelcontextprotocol/ext-apps'
    - '@mongodb-js/zstd'
    - '@parcel/watcher'
    - chartjs-plugin-stacked100
    - '@swc/core'
    - core-js
    - core-js-pure
    - cpu-features
    - esbuild
    - lmdb
    - lz4
    - msgpackr-extract
    - msw
    - node-gyp
    - node-rdkafka
    - protobufjs
    - re2
    - sharp
    - ssh2
    - unrs-resolver
    - workerd

catalog:
    # Kea ecosystem - state management
    kea: ^4.0.0-pre.6
    kea-forms: ^3.2.0
    kea-loaders: ^3.1.1
    kea-localstorage: ^3.1.0
    kea-router: ^3.4.1
    kea-subscriptions: ^3.0.1
    kea-test-utils: ^0.2.4
    kea-waitfor: ^0.2.1
    kea-window-values: ^3.0.1
    # PostHog packages
    '@posthog/icons': ^0.38.0
    '@posthog/brand': 0.10.0
    '@posthog/react': ^1.10.5
    posthog-js: ^1.422.3
    # Build tools
    '@parcel/packager-ts': 2.16.4
    '@parcel/transformer-typescript-types': 2.16.4
    typescript: 6.0.3
    oxfmt: ^0.57.0
    vite: ^8.1.0
    '@vitejs/plugin-react': ^5.2.0
    # Testing
    jest: ^29.7.0
    jest-junit: ^16.0.0
    '@types/jest': ^29.5.12
    '@types/node': ^22.13.14
    '@playwright/test': 1.60.0
    # Storybook
    '@storybook/react': ^10.4.3
    '@storybook/react-vite': ^10.4.3
    storybook: ^10.4.3
    # Common utilities
    fast-equals: ^6.0.0
    fuse.js: ^7.1.0
    query-selector-shadow-dom: ^1.0.0
    '@types/query-selector-shadow-dom': ^1.0.0
    ts-pattern: '4.3'
    use-debounce: ^9.0.3
    # React types
    '@types/react': ^18.3.27
    '@types/react-dom': ^18.3.7
    '@base-ui/react': 1.6.0
    # Other shared
    husky: ^7.0.4
    lint-staged: ~15.4.3
    concurrently: ^5.3.0
    yaml: ^2.8.2

# PostHog packages are released by our own workflows. posthog-js is also
# uploaded to the browser SDK CDN from the posthog-js release workflow, so
# dependency automation should not delay these package updates.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
    - posthog-js
    - posthog-js-lite
    - posthog-node
    - '@posthog/*'
    - kea@4.0.0-pre.6
    - kea-typegen@3.8.3
    - '@earendil-works/*'
    - typebox
    - chartjs-plugin-stacked100@1.7.1
    - torph@0.0.5
    - oxfmt@0.57.0
    - '@oxfmt/*'
    - bloommx@1.0.3
    - '@shadcn/react'
    - mermaid@11.15.0
    - kea-typegen
    - '@typescript/native-preview'
    - '@typescript/native-preview-darwin-arm64'
    - '@typescript/native-preview-darwin-x64'
    - '@typescript/native-preview-linux-arm'
    - '@typescript/native-preview-linux-arm64'
    - '@typescript/native-preview-linux-x64'
    - '@typescript/native-preview-win32-arm64'
    - '@typescript/native-preview-win32-x64'
    - shiki
    - shadcn
    - '@shikijs/*'
