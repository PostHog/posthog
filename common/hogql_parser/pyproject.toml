[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hogql-parser"
version = "1.3.83"
description = "HogQL parser for internal PostHog use"
readme = "README.md"
requires-python = ">=3.10"
# Table form, not the PEP 639 SPDX string: the string form needs packaging>=24.2
# at build time, which older environments running `setup.py --version` lack.
license = { text = "MIT" }
authors = [{ name = "PostHog Inc.", email = "hey@posthog.com" }]
maintainers = [{ name = "PostHog Inc.", email = "hey@posthog.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/PostHog/posthog/tree/master/common/hogql_parser"

[tool.uv]
# uv only rebuilds a path dependency when pyproject.toml/setup.py change; these
# keys make edits to the C++ sources and stubs invalidate the cached build too.
# Deliberately flat globs so build/ and build_wasm/ artifacts don't churn the key.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "*.cpp" },
    { file = "*.h" },
    { file = "hogql_parser-stubs/*.pyi" },
]

[tool.black]
line-length = 120
target-version = ['py310']

[tool.cibuildwheel]
build = [ # Build CPython wheels on Linux and macOS, for x86 as well as ARM
    "cp3*-macosx_x86_64",
    "cp3*-macosx_arm64",
    "cp3*-manylinux_x86_64",
    "cp3*-manylinux_aarch64",
]
build-frontend = "build" # This is the successor to building with pip

[tool.cibuildwheel.macos]
before-build = ["brew install antlr4-cpp-runtime"]

[tool.cibuildwheel.linux]
before-all = [
    # manylinux_2_28 is based on AlmaLinux 8, which uses Fedora's dnf as its package manager
    "dnf install -y unzip cmake curl uuid pkg-config",
    # update cmake for antlr
    "dnf install -y epel-release",
    "dnf install -y cmake3",
    "cmake3 --version",
    "curl --fail --location https://www.antlr.org/download/antlr4-cpp-runtime-4.13.1-source.zip --output antlr4-source.zip || curl --fail --location https://raw.githubusercontent.com/antlr/website-antlr4/gh-pages/download/antlr4-cpp-runtime-4.13.1-source.zip --output antlr4-source.zip",
    # Check that the downloaded archive is the expected runtime - a security measure
    "antlr_known_md5sum=\"c875c148991aacd043f733827644a76f\"",
    "antlr_found_ms5sum=\"$(md5sum antlr4-source.zip | cut -d' ' -f1)\"",
    'if [[ "$antlr_known_md5sum" != "$antlr_found_ms5sum" ]]; then exit 64; fi',
    "unzip antlr4-source.zip -d antlr4-source && cd antlr4-source",
    "cmake3 . -DBUILD_TESTING=OFF -DANTLR4_BUILD_TESTS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5",
    "DESTDIR=out make install",
    "cp -r out/usr/local/include/antlr4-runtime /usr/include/",
    "cp out/usr/local/lib64/libantlr4-runtime.so* /usr/lib64/",
    "ldconfig",
]
archs = [
    "native", # We run x86_64 and aarch64 as separate CI jobs, and we want native in each case as emulation is slow
]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
