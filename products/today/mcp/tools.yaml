# MCP tool definition — tool entries are scaffolded from the OpenAPI schema.
# The tool list and operation IDs are kept in sync automatically:
#   pnpm --filter=@posthog/mcp run scaffold-yaml -- --sync-all
#
# To enable a tool, set enabled: true and add required scopes + annotations.
# All other fields (title, description, enrich_url, etc.) are yours to configure.
category: Today
feature: today
url_prefix: /today
ui_apps: {}
tools:
    today-briefing-get:
        operation: today_briefing_retrieve
        enabled: true
        scopes:
            - today:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: Get my Today briefing
        description: >
            The current user's Today briefing for this project, as shown on the Today home page:
            a short text about the items that need them most (reports assigned to them, insights
            and dashboards they use, firing alerts, assigned support tickets and error issues,
            and GitHub pull requests), plus up to 5 items with a label, a signal and a link. There
            are two editions a day, from 8:00 and from noon local time. The first call of an
            edition starts generation and returns status "collecting"; while a newer edition is
            being written, the last ready briefing comes back with status "writing" and its text.
            Generation takes a few minutes; call again later for the "ready" text. Use this to
            answer "what should I look at today?".
        feature_flag: today-rail-nav
        feature_flag_behavior: enable
    today-briefing-refresh-create:
        operation: today_briefing_refresh_create
        enabled: false
    today-candidates-list:
        operation: today_candidates_retrieve
        enabled: true
        scopes:
            - today:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: List my Today candidates
        description: >
            The items behind the current user's briefing, each with its source, the reason it
            was picked, a link, and the facts the text rests on (for example a priority, a status,
            or the two values behind a change). Use this when you need the numbers and details,
            not the written text. Items are in briefing order, most urgent first.
        feature_flag: today-rail-nav
        feature_flag_behavior: enable
