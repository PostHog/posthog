# MCP tool definitions. Tools are opt-in: an operation is exposed only when it has an entry here.
# List operations without an entry: pnpm --filter=@posthog/mcp run scaffold-yaml -- --candidates --product ui_customization
# Add one: pnpm --filter=@posthog/mcp run scaffold-yaml -- --add <operationId> --product ui_customization
# To keep an operation off on purpose, set enabled: false and give a disabled_reason.
category: UI customization
feature: ui_customization
url_prefix: /home
ui_apps: {}
tools:
    ui-customization-describe:
        operation: ui_customization_describe
        enabled: true
        title: Describe UI customization
        description: >
            Get the layout JSON Schema and default layout for a supported UI customization context, such as
            analytics_sidebar for the Analytics sidebar, before designing alternatives. Read the schema descriptions for
            additional server validation rules, including limits across sections. This does not read or change the
            person's saved layout. Use ui-customization-get to read their layout before replacing it with
            ui-customization-set. Saving always validates the full layout again.
        feature_flag: ui-customization
    ui-customization-get:
        operation: ui_customization_retrieve
        enabled: true
        title: Get UI customization
        description: >
            Get the person's layout for a supported UI customization context. For analytics_sidebar, this is the
            Analytics pane in the new navigation. It is the person's own layout, or the default when customized is
            false. Call it before you change the fragment, then send the whole changed layout to ui-customization-set.
        feature_flag: ui-customization
    ui-customization-reset:
        operation: ui_customization_destroy
        enabled: true
        title: Reset UI customization
        description: >
            Remove the person's own layout for the selected context, such as analytics_sidebar for the Analytics
            sidebar, so it shows the default again. Returns the default layout.
        feature_flag: ui-customization
    ui-customization-set:
        operation: ui_customization_update
        enabled: true
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        title: Set UI customization
        description: >
            Replace the person's layout for the selected UI customization context. It changes only the person who calls
            it, in this project. For analytics_sidebar: Build the layout from sections of items: links and buttons that
            open a PostHog page or an insight, dashboard or notebook of this project, metrics that show the latest value
            of a trends insight, and lists that PostHog fills (pinned, recents, by_posthog). Get the IDs of insights,
            dashboards and notebooks from their tools first; never invent them. Saving rejects an insight, dashboard or
            notebook that does not exist, and a metric whose insight is not a trends insight. Use at most 30 items total
            across all sections, including at most 4 live metrics. Each built-in list counts as one item. Keep the
            default sections the person did not ask to remove, and keep the IDs of the sections you keep. A 400 error
            names each value that does not fit, so fix those values and send it again.
        feature_flag: ui-customization
