# MCP tool definitions. Tools are opt-in: an operation is exposed only when it has an entry here.
# List operations without an entry: pnpm --filter=@posthog/mcp run scaffold-yaml -- --candidates --product messaging
# Add one: pnpm --filter=@posthog/mcp run scaffold-yaml -- --add <operationId> --product messaging
# To keep an operation off on purpose, set enabled: false and give a disabled_reason.
category: Messaging
feature: messaging
url_prefix: /workflows
ui_apps: {}
tools:
    messaging-categories-create:
        operation: messaging_categories_create
        enabled: true
        feature_flag: workflows-email-domain-agent-setup
        scopes:
            - hog_flow:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        exclude_params: [deleted]
        title: Create a message category
        description: >
            Create a message category with a project-unique, immutable key. Categories group messages for
            category-specific subscription preferences. Transactional email can be sent without a category.
    messaging-categories-list:
        operation: messaging_categories_list
        enabled: true
        feature_flag: workflows-email-domain-agent-setup
        scopes:
            - hog_flow:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: List message categories
        description: List message categories in the current project. Categories group messages for category-specific subscription preferences.
    messaging-categories-partial-update:
        operation: messaging_categories_partial_update
        enabled: true
        feature_flag: workflows-email-domain-agent-setup
        scopes:
            - hog_flow:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        exclude_params: [key, deleted]
        title: Update a message category
        description: >
            Update a message category's name, descriptions, or category type by ID. The key cannot change after
            creation. This does not change recipients' stored subscription preferences.
    messaging-categories-retrieve:
        operation: messaging_categories_retrieve
        enabled: true
        feature_flag: workflows-email-domain-agent-setup
        scopes:
            - hog_flow:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: Get a message category
        description: Get a message category by its ID in the current project, including its immutable key and category type.
    opt-outs-add:
        operation: messaging_preferences_bulk_add_opt_outs_create
        enabled: true
        scopes:
            - hog_flow:write
        annotations:
            readOnly: false
            destructive: true
            idempotent: true
        title: Add recipients to the opt-out list
        description: >
            Opt one or more recipients (up to 1000 per call) out of marketing messages. Each entry can name its own
            message category via category_key; entries without one use the request-level category_key, or all marketing
            messages if omitted. Importing only ever opts recipients out, so repeating a call is safe.
    opt-outs-list:
        operation: messaging_preferences_opt_outs_retrieve
        enabled: true
        scopes:
            - hog_flow:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: List opt-outs
        description: >
            List recipients opted out of a message category, most recently updated first. Omit category_key to list
            recipients opted out of all marketing messages.
    opt-outs-remove:
        operation: messaging_preferences_remove_opt_out_create
        enabled: true
        scopes:
            - hog_flow:write
        annotations:
            readOnly: false
            destructive: true
            idempotent: true
        title: Remove a recipient from the opt-out list
        description: >
            Opt a recipient back in to the message category named by category_key, or to all marketing messages if
            omitted. Use to honor a resubscribe recorded in your own app. Repeating a call is safe.
