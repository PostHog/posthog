<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Message preferences</title>
        {# Compiled from the Tailwind classes in this directory. Run #}
        {# `pnpm --filter=@posthog/frontend build:message-preferences` after changing a class here. #}
        <style nonce="{{ request.csp_nonce }}">{{ stylesheet }}</style>
    </head>
    <body>
        {% block content %}
            <div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
                <div class="max-w-md w-full space-y-8">
                    <div>
                        <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Oops!</h2>
                        <p class="mt-2 text-center text-sm text-gray-600">{{ error }}</p>
                    </div>
                    <div class="mt-8 text-center">
                        <a href="/" class="text-blue-600 hover:text-blue-500">Return to homepage</a>
                    </div>
                </div>
            </div>
        {% endblock %}
    </body>
</html>
