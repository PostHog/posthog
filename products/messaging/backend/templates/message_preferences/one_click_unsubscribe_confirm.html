<!DOCTYPE html>
<html>
    <head>{% include "message_preferences/_head.html" %}</head>
    <body>
        {% block content %}
            <div class="min-h-screen bg-gray-50">
                <div class="max-w-2xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
                    <div class="bg-white shadow-xl rounded-xl p-8">
                        <h1 class="text-2xl font-bold text-gray-900 mb-2">Unsubscribe from all marketing emails?</h1>
                        <p class="text-gray-600 text-base mb-8"><span class="font-semibold">{{ recipient.identifier|escape }}</span> will stop receiving marketing emails.</p>
                        <form method="post" action="{{ request.get_full_path }}" class="mb-8">
                            <input type="hidden" name="one_click_unsubscribe" value="1" />
                            <button type="submit"
                                    class="bg-red-500 text-white font-semibold px-6 py-4 rounded-lg cursor-pointer">Unsubscribe</button>
                        </form>
                        <p class="text-gray-600 text-base">
                            Want to stay subscribed to some emails? <a class="text-blue-600 hover:underline" href="{{ request.path }}">Manage your preferences</a>.
                        </p>
                    </div>
                </div>
            </div>
        {% endblock %}
    </body>
</html>
