packages:
  - .

blockExoticSubdeps: true

minimumReleaseAge: 10080

onlyBuiltDependencies:
  - '@shopify/react-native-skia'

patchedDependencies:
  victory-native@42.0.1: patches/victory-native@42.0.1.patch

trustPolicy: no-downgrade

trustPolicyExclude:
  # Keep the same maintenance-release exceptions as the repository workspace.
  - semver@5.7.2 || 6.3.1
  - undici-types@6.21.0
  # Existing SDK 57 lockfile versions with missing publisher provenance records.
  - ua-parser-js@0.7.41 || 1.0.41
