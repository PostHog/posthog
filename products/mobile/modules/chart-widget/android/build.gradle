plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.posthog.code.mobile'
version = '1.0.0'

android {
  namespace "com.posthog.code.mobile.chart"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // The widget fetches PostHog on a timer off the main thread; the session copy lives in encrypted preferences.
  implementation 'androidx.work:work-runtime-ktx:2.9.1'
  implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
