<!doctype html>
<!--
  The web app frames this document, and this document frames the canvas. The browser checks every
  navigation of the canvas frame against the frame-src of this document, not of the app, so the
  canvas can only load documents on the artifact origin. The script hands the app's MessagePort to
  the canvas document that loads first, and to no later one.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Canvas</title>
    </head>
    <body>
        <script>
            ;(() => {
                const channel = 'posthog-canvas'
                const params = new URLSearchParams(location.hash.slice(1))
                let src
                try {
                    src = new URL(params.get('src') ?? '', location.href)
                } catch {
                    return
                }
                if (
                    src.origin !== location.origin ||
                    !src.pathname.startsWith('/canvas-artifacts/') ||
                    src.pathname.startsWith('/canvas-artifacts/frame/')
                ) {
                    return
                }
                const frame = document.createElement('iframe')
                const applyTheme = (theme) => {
                    if (theme === 'dark' || theme === 'light') {
                        document.documentElement.style.colorScheme = theme
                        frame.style.colorScheme = theme
                    }
                }
                document.documentElement.style.height = '100%'
                document.body.style.cssText = 'margin:0;height:100%;overflow:hidden'
                frame.setAttribute('sandbox', 'allow-scripts')
                frame.referrerPolicy = 'no-referrer'
                frame.title = 'Canvas'
                frame.style.cssText = 'display:block;width:100%;height:100%;border:0'
                applyTheme(params.get('theme'))

                let loads = 0
                let port = null
                let connected = false
                const connect = () => {
                    if (!port || connected || loads !== 1) {
                        return
                    }
                    connected = true
                    frame.contentWindow.postMessage({ channel, type: 'connect' }, '*', [port])
                    port = null
                }
                const disconnect = () => {
                    port?.close()
                    port = null
                    parent.postMessage({ channel, type: 'navigated' }, '*')
                }
                frame.addEventListener('load', () => {
                    loads += 1
                    if (loads === 1) {
                        connect()
                    } else {
                        disconnect()
                    }
                })
                addEventListener('message', (event) => {
                    if (event.source !== parent || event.data?.channel !== channel) {
                        return
                    }
                    if (event.data.type === 'set-theme') {
                        applyTheme(event.data.theme)
                    } else if (event.data.type === 'connect' && event.ports[0] && !port && !connected) {
                        port = event.ports[0]
                        if (loads > 1) {
                            disconnect()
                        } else {
                            connect()
                        }
                    }
                })
                frame.src = src.href
                document.body.append(frame)
            })()
        </script>
    </body>
</html>
