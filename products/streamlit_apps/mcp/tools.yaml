# MCP tool definition — tool entries are scaffolded from the OpenAPI schema.
# The tool list and operation IDs are kept in sync automatically:
#   pnpm --filter=@posthog/mcp run scaffold-yaml -- --sync-all
#
# To enable a tool, set enabled: true and add required scopes + annotations.
# All other fields (title, description, enrich_url, etc.) are yours to configure.
category: Streamlit apps
feature: streamlit_apps
url_prefix: /streamlit-apps
ui_apps: {}
tools:
    streamlit-apps-activate-version:
        operation: streamlit_apps_activate_version_create
        enabled: false
    streamlit-apps-connect-info:
        operation: streamlit_apps_connect_info_retrieve
        enabled: false
    streamlit-apps-create:
        operation: streamlit_apps_create
        enabled: true
        scopes:
            - streamlit_app:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        enrich_url: '{short_id}'
        title: Create Streamlit app
        description: >
            Create a new Streamlit app (metadata only — it has no code until you call streamlit-apps-set-source).
            Typical flow: create the app, set its source, then start it. cpu_cores (0.25–8) and memory_gb (0.5–16)
            control the sandbox size and default to 0.5 / 1.
        feature_flag: streamlit-apps
    streamlit-apps-delete:
        operation: streamlit_apps_destroy
        enabled: true
        scopes:
            - streamlit_app:write
        annotations:
            readOnly: false
            destructive: true
            idempotent: true
        title: Delete Streamlit app
        description: |
            Delete a Streamlit app by short_id. Stops any running sandbox and soft-deletes the app.
        feature_flag: streamlit-apps
    streamlit-apps-edit-source:
        operation: streamlit_apps_edit_source_create
        enabled: true
        scopes:
            - streamlit_app:write
            - query:read
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        title: Edit Streamlit app source
        description: >
            Change an existing Streamlit app without resending its whole source. Read the files first with
            streamlit-apps-get-source, then send exact text edits, new files, and deletions against that version
            number as base_version. The edits create a new active version; every file you do not touch stays
            byte-for-byte the same. If base_version is not the latest version, the call fails with 409 and returns
            current_version: read that version again and redo the edits, do not fall back to set-source. If an edit's
            `old` text matches zero or many times, the call fails with 400 and names the file and edit index. If the
            app is running, its sandbox is stopped; call streamlit-apps-start afterwards.
        param_overrides:
            base_version:
                description: >
                    The version number your edits are based on, from streamlit-apps-get-source. Must be the app's
                    latest version.
            file_edits:
                description: >
                    Edits to existing text files. Each entry has a `path` and a list of `edits`, each with `old` (exact
                    text that must match exactly once in the file, including whitespace) and `new`. Edits to one file
                    apply in order.
            create_files:
                description: >
                    New text files keyed by project-relative path, each value the file's full text. The path must not
                    exist in the base version; use file_edits to change an existing file.
            delete_files:
                description: Paths to remove from the app. app.py cannot be removed.
        feature_flag: streamlit-apps
    streamlit-apps-get:
        operation: streamlit_apps_retrieve
        enabled: true
        scopes:
            - streamlit_app:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        enrich_url: '{short_id}'
        title: Get Streamlit app
        description: |
            Get a single Streamlit app by its short_id, including its active version and live sandbox status.
        feature_flag: streamlit-apps
    streamlit-apps-list:
        operation: streamlit_apps_list
        enabled: true
        scopes:
            - streamlit_app:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        enrich_url: '{short_id}'
        list: true
        title: List Streamlit apps
        description: >
            List all Streamlit apps in the current project. Each app is a Python data app that runs in an isolated
            sandbox. Returns short_id, name, description, resource config, and current sandbox status.
        feature_flag: streamlit-apps
    streamlit-apps-put-update:
        operation: streamlit_apps_update
        enabled: false
    streamlit-apps-restart:
        operation: streamlit_apps_restart_create
        enabled: false
    streamlit-apps-set-source:
        operation: streamlit_apps_create_version_from_source_create
        enabled: true
        scopes:
            - streamlit_app:write
            - query:read
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        title: Set Streamlit app source
        description: >
            Create a new version of a Streamlit app from free-text source, and set it as the active version. Use it for
            a new app or a full rewrite only: it replaces every file, so any file you leave out is lost. To change an
            existing app, read it with streamlit-apps-get-source and patch it with streamlit-apps-edit-source. The
            source becomes the root app.py; optional extra text files (helper modules, CSV, JSON) go in `files` and binary
            files (Parquet, images) go base64-encoded in `assets`, so no zip upload is needed. If the app is running,
            its sandbox is stopped; call streamlit-apps-start afterwards to serve the new version. Use
            posthog_apps.query("<HogQL>") inside the app to read PostHog data as a pandas DataFrame. There is no way to
            add pip dependencies — only packages baked into the sandbox image are importable.
        param_overrides:
            source:
                description: >
                    The complete Python source for the app's root app.py (a Streamlit script, e.g. starting with `import
                    streamlit as st`). Sent as plain text.
            files:
                description: >
                    Optional extra text files keyed by project-relative path (e.g. `utils.py`, `data/config.json`), each
                    value the file's full text. Paths must not be `app.py` and must not contain `..`. The app process
                    does not run inside its own directory, so open them via `Path(__file__).parent /
                    "data/config.json"`.
            assets:
                description: >
                    Optional extra binary files keyed by project-relative path (e.g. `data/events.parquet`), each value
                    the file's bytes as standard base64. Same path rules as `files`. Keep them small: the whole call is
                    sent as JSON, so a large file costs tokens on every set-source.
        feature_flag: streamlit-apps
    streamlit-apps-get-source:
        operation: streamlit_apps_source_retrieve
        enabled: true
        scopes:
            - streamlit_app:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: Get Streamlit app source
        description: >
            Read the code of a Streamlit app version. Defaults to the active version; pass version_number for an older
            one. Returns version_number and a manifest of every file (path, size, sha256, content_type) with the full
            text of each text file. Binary files are listed without content. Pass `paths` to get the content of only
            some files, which keeps the response small for a large app. Always read the source here before you change
            an app, then use streamlit-apps-edit-source with the returned version_number, so you do not overwrite a
            newer version with an old local copy.
        param_overrides:
            version_number:
                description: Version number to read. Omit it to read the active version.
            paths:
                description: >
                    Comma-separated file paths to return content for, for example `app.py,utils.py`. The manifest still
                    lists every file. Omit it to get every text file.
        feature_flag: streamlit-apps
    streamlit-apps-start:
        operation: streamlit_apps_start_create
        enabled: true
        scopes:
            - streamlit_app:write
            - query:read
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        enrich_url: '{short_id}'
        title: Start Streamlit app
        description: >
            Start the app's sandbox (boots the active version). Returns immediately while the sandbox boots
            asynchronously — poll streamlit-apps-status until it reports running. Requires an active version (set one
            first with streamlit-apps-set-source). Idempotent: a no-op if already running or starting. The response's
            _posthogUrl is the app's page in PostHog — share that link with humans.
        feature_flag: streamlit-apps
    streamlit-apps-status:
        operation: streamlit_apps_status_retrieve
        enabled: true
        scopes:
            - streamlit_app:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: Get Streamlit app status
        description: >
            Get the live sandbox status for a Streamlit app: one of starting, running, stopping, stopped, or error, plus
            restart_count and last_error. Use this to poll after starting an app.
        feature_flag: streamlit-apps
    streamlit-apps-stop:
        operation: streamlit_apps_stop_create
        enabled: true
        scopes:
            - streamlit_app:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        enrich_url: '{short_id}'
        title: Stop Streamlit app
        description: >
            Stop the app's running sandbox. Idempotent: a no-op if the app is not running. The app's code and versions
            are unaffected — it can be started again later.
        feature_flag: streamlit-apps
    streamlit-apps-update:
        operation: streamlit_apps_partial_update
        enabled: true
        scopes:
            - streamlit_app:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        enrich_url: '{short_id}'
        title: Update Streamlit app
        description: >
            Update an app's metadata or sandbox sizing: name, description, cpu_cores (0.25–8), memory_gb (0.5–16). Only
            the fields you provide change. Resizing applies the next time the sandbox starts. Code changes go through
            streamlit-apps-edit-source (or streamlit-apps-set-source for a full rewrite), not this tool.
        feature_flag: streamlit-apps
    streamlit-apps-upload-version:
        operation: streamlit_apps_upload_version_create
        enabled: false
    streamlit-apps-versions:
        operation: streamlit_apps_versions_retrieve
        enabled: true
        scopes:
            - streamlit_app:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        list: true
        title: List Streamlit app versions
        description: |
            List a Streamlit app's versions (latest first). Each version is an immutable snapshot of the app's code.
        feature_flag: streamlit-apps
