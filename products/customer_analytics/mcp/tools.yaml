    event-streams-add-account:
        operation: event_streams_add_account_create
        enabled: true
        scopes:
            - account:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        title: Add account to my event stream
        description: >
            Add a Customer Analytics account to the caller's event stream so its users' matching events start posting to
            their Slack channel. Provide the stream `id` and the `account_id` to add. Idempotent — adding an account
            that is already in the stream is a no-op. Only accounts with an `external_id` actually deliver (the
            external_id is how events are matched to the account).
        feature_flag: customer-analytics-csp
    event-streams-create:
        operation: event_streams_create
        enabled: true
        scopes:
            - account:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        title: Create my event stream
        description: >
            Create the caller's personal Customer Analytics event stream — a live feed of selected accounts' events
            posted to a Slack channel of their choice. Each user has at most one stream per project (409 if one already
            exists; use event-streams-list first). Provide `event_names` to watch, and optionally `slack_integration` +
            `slack_channel_id` for delivery — the stream only delivers once events, a Slack channel, and at least one
            member account are all configured and `enabled` is true.
        feature_flag: customer-analytics-csp
    event-streams-destroy:
        operation: event_streams_destroy
        enabled: true
        scopes:
            - account:write
        annotations:
            readOnly: false
            destructive: true
            idempotent: true
        title: Delete my event stream
        description: >
            Delete the caller's event stream and its account memberships, and stop its Slack delivery. Only the caller's
            own stream can be deleted.
        feature_flag: customer-analytics-csp
    event-streams-list:
        operation: event_streams_list
        enabled: true
        scopes:
            - account:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: Get my event stream
        description: >
            The caller's Customer Analytics event stream, as a 0-or-1 element array — each user has at most one stream
            per project. Returns its `id` (needed by the other event-stream tools), enabled state, watched
            `event_names`, Slack delivery target, and member `account_ids`.
        feature_flag: customer-analytics-csp
    event-streams-partial-update:
        operation: event_streams_partial_update
        enabled: true
        scopes:
            - account:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        title: Update my event stream
        description: >
            Update the caller's event stream configuration — `enabled`, watched `event_names`, or the Slack delivery
            target (`slack_integration`, `slack_channel_id`, `slack_channel_name`). Omitted fields are left unchanged.
            Manage member accounts via the add/remove account tools, not here.
        feature_flag: customer-analytics-csp
    event-streams-remove-account:
        operation: event_streams_remove_account_create
        enabled: true
        scopes:
            - account:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        title: Remove account from my event stream
        description: >
            Remove a Customer Analytics account from the caller's event stream so its events stop posting to their Slack
            channel. Provide the stream `id` and the `account_id` to remove. Idempotent — removing an account that is
            not in the stream is a no-op.
        feature_flag: customer-analytics-csp
    event-streams-send-test-message:
        operation: event_streams_send_test_message_create
        enabled: true
        scopes:
            - account:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        title: Send event stream test message
        description: >
            Post a test message to the Slack channel configured on the caller's event stream, to verify delivery works
            end to end. Fails with a validation error when the stream has no saved Slack workspace + channel, or when
            Slack rejects the message (e.g. the PostHog bot is not in the channel).
        feature_flag: customer-analytics-csp
    event-streams-update:
        operation: event_streams_update
        enabled: false
    feature-request-product-areas-create:
        operation: feature_request_product_areas_create
        enabled: true
        scopes:
            - customer_analytics:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        title: Create feature request product area
        description: >
            Create a product area for categorizing Customer analytics feature requests. Manager access to Customer
            analytics is required. Provide a unique `name` and optional `display_order`. Lower display orders appear
            first. New areas are active by default.
        feature_flag: customer-analytics-feature-requests
    feature-request-product-areas-list:
        operation: feature_request_product_areas_list
        enabled: true
        scopes:
            - customer_analytics:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        list: true
        title: List feature request product areas
        description: >
            List active product areas used to categorize Customer analytics feature requests. Each area includes its
            `id`, `name`, `display_order`, and active state. Set `include_inactive` to true when editing an existing
            request or managing areas. The same data is queryable through `system.feature_request_product_areas`.
        feature_flag: customer-analytics-feature-requests
    feature-request-product-areas-partial-update:
        operation: feature_request_product_areas_partial_update
        enabled: true
        scopes:
            - customer_analytics:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        title: Update feature request product area
        description: >
            Update a feature request product area by id. Manager access to Customer analytics is required. Accepts any
            subset of `name`, `display_order`, and `is_active`. Inactive areas remain on requests that already use them,
            but editors cannot add them to new requests.
        feature_flag: customer-analytics-feature-requests
    feature-request-product-areas-update:
        operation: feature_request_product_areas_update
        enabled: false
    feature-requests-add-account-create:
        operation: feature_requests_add_account_create
        enabled: true
        scopes:
            - customer_analytics:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        enrich_url: feature-requests/{id}
        title: Link account to feature request
        description: >
            Link another accessible account to a Customer analytics feature request. Pass the request `id`, its current
            `expected_version`, and the account id. You can also provide the account's first evidence item in the same
            atomic change. Relinking an account restores its preserved evidence. The response contains the updated
            request and its next version.
        feature_flag: customer-analytics-feature-requests
    feature-requests-add-evidence-create:
        operation: feature_requests_add_evidence_create
        enabled: true
        scopes:
            - customer_analytics:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        enrich_url: feature-requests/{id}
        title: Add feature request evidence
        description: >
            Add evidence to an active account link on a Customer analytics feature request. Pass the request `id`, its
            current `expected_version`, the `account_link_id`, a free-form `evidence_source`, and at least one of
            `summary`, `customer_quote`, `source_url`, or `image_ids`. Image IDs must refer to uploaded images in the
            current project. The response contains the updated request and its next version.
        feature_flag: customer-analytics-feature-requests
    feature-requests-archive-create:
        operation: feature_requests_archive_create
        enabled: true
        scopes:
            - customer_analytics:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        enrich_url: feature-requests/{id}
        title: Archive feature request
        description: >
            Archive a Customer analytics feature request without deleting its account links, evidence, product areas, or
            history. Pass the request `id` and its current `expected_version`. Archived requests cannot be edited until
            restored.
        feature_flag: customer-analytics-feature-requests
    feature-requests-create:
        operation: feature_requests_create
        enabled: true
        scopes:
            - customer_analytics:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        enrich_url: feature-requests/{id}
        title: Create feature request
        description: >
            Create a Customer analytics feature request linked to one accessible account and one or more active product
            areas. Provide a client-generated UUID as `idempotency_key`. Retrying with the same key returns the original
            request. Use `accounts-list` and `feature-request-product-areas-list` to resolve the required IDs.
        feature_flag: customer-analytics-feature-requests
    feature-requests-history-list:
        operation: feature_requests_history_list
        enabled: true
        scopes:
            - customer_analytics:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        list: true
        title: List feature request history
        description: >
            List the complete change history for a Customer analytics feature request, newest first. Entries group the
            status, priority, account, evidence, and product area changes from one successful save. Account snapshots
            the caller cannot access are removed or redacted. HogQL `system.feature_request_history` exposes entry
            metadata and changed field names, but not before and after values.
        feature_flag: customer-analytics-feature-requests
    feature-requests-list:
        operation: feature_requests_list
        enabled: true
        scopes:
            - customer_analytics:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        enrich_url: feature-requests/{id}
        list: true
        title: List feature requests
        description: >
            List Customer analytics feature requests linked to accounts the caller can access. Filter by search text,
            lifecycle status, priority, product area, account, or archive state. Active requests are returned by
            default. Each request includes its active visible account links, account-specific evidence, product areas,
            and version. For bulk reads and aggregations, query `system.feature_requests` and its related system tables.
        feature_flag: customer-analytics-feature-requests
    feature-requests-partial-update:
        operation: feature_requests_partial_update
        enabled: true
        scopes:
            - customer_analytics:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        enrich_url: feature-requests/{id}
        title: Update feature request
        description: >
            Update a Customer analytics feature request by id. Pass its current `expected_version` and any subset of
            `title`, `description`, `account_ids`, `product_area_ids`, `request_status`, and `request_priority`. Pass
            null as `request_priority` to remove the priority. Removing an account unlinks it but preserves its evidence
            for a later relink. The response contains the next version.
        param_overrides:
            expected_version:
                required: true
        feature_flag: customer-analytics-feature-requests
    feature-requests-remove-evidence-create:
        operation: feature_requests_remove_evidence_create
        enabled: true
        scopes:
            - customer_analytics:write
        annotations:
            readOnly: false
            destructive: true
            idempotent: true
        enrich_url: feature-requests/{id}
        title: Delete feature request evidence
        description: >
            Permanently delete one evidence item from a Customer analytics feature request. Pass the request `id`, its
            current `expected_version`, and the `evidence_id`. The request, account link, and other evidence remain. The
            response contains the updated request and its next version.
        feature_flag: customer-analytics-feature-requests
    feature-requests-restore-create:
        operation: feature_requests_restore_create
        enabled: true
        scopes:
            - customer_analytics:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        enrich_url: feature-requests/{id}
        title: Restore feature request
        description: >
            Restore an archived Customer analytics feature request so editors can change it again. Pass the request `id`
            and its current `expected_version`. Account links, evidence, product areas, and history remain attached.
        feature_flag: customer-analytics-feature-requests
    feature-requests-retrieve:
        operation: feature_requests_retrieve
        enabled: true
        scopes:
            - customer_analytics:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        enrich_url: feature-requests/{id}
        title: Get feature request
        description: >
            Fetch one Customer analytics feature request by id. The response includes its lifecycle status, priority,
            archive state, version, active account links visible to the caller, account-specific evidence, and product
            areas. Use the returned `version` as `expected_version` for the next mutation.
        feature_flag: customer-analytics-feature-requests
    feature-requests-status-history-list:
        operation: feature_requests_status_history_list
        enabled: true
        scopes:
            - customer_analytics:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        list: true
        title: List feature request status history
        description: >
            List status changes for one Customer analytics feature request, newest first. Each entry includes the
            previous status, resulting status, actor, source, and change time. HogQL `system.feature_request_history`
            exposes when changes occurred and which fields changed, but not status values.
        feature_flag: customer-analytics-feature-requests
    feature-requests-update:
        operation: feature_requests_update
        enabled: false
    feature-requests-update-evidence-create:
        operation: feature_requests_update_evidence_create
        enabled: true
        scopes:
            - customer_analytics:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        enrich_url: feature-requests/{id}
        title: Update feature request evidence
        description: >
            Replace the editable fields of one feature request evidence item. Pass the request `id`, its current
            `expected_version`, the `evidence_id`, a free-form `evidence_source`, and the complete values for `summary`,
            `customer_quote`, `source_url`, and `requested_on`. Pass `image_ids` to replace attached images, or omit it
            to preserve them. Image IDs must refer to uploaded images in the current project. The response contains the
            updated request and its next version.
        feature_flag: customer-analytics-feature-requests
    usage-metrics-create:
        operation: groups_types_metrics_create
        enabled: true
        scopes:
            - usage_metric:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        title: Create usage metric
        description: >
            Create a new usage metric for the project. The metric surfaces on both group and person Customer Analytics
            profile pages — usage metrics are not scoped to a specific group type. `filters` accepts two shapes:

            (1) Events (default) — HogFunction filter shape with an `events` array.

            (2) Data warehouse — set `source: "data_warehouse"` plus `table_name`, `timestamp_field`, `key_field`. Call
            `external-data-schemas-list` first to discover synced tables, and `execute-sql` (`SELECT * FROM <table>
            LIMIT 1`) to inspect column names. DW metrics currently render only on group profiles.

            When `math` is `sum`, `math_property` is required; when `math` is `count`, `math_property` must be empty.
            For DW SUM metrics, `math_property` is the column name (or HogQL expression) to sum on the table. Pass
            `group_type_index: 0`.
        param_overrides:
            group_type_index:
                description: >
                    Legacy URL parameter retained for backward compatibility. Pass `0`. The stored value does not scope
                    the metric — usage metrics apply to both groups and persons regardless of this value.
            filters:
                input_schema: UsageMetricFiltersSchema
            math_property:
                description: >
                    Required when `math` is `sum`; must be empty when `math` is `count`. For events metrics this is an
                    event property name. For data warehouse metrics this is the column name (or HogQL expression) to sum
                    on the DW table.
    usage-metrics-destroy:
        operation: groups_types_metrics_destroy
        enabled: true
        scopes:
            - usage_metric:write
        annotations:
            readOnly: false
            destructive: true
            idempotent: true
        title: Delete usage metric
        description: >
            Permanently delete a usage metric by id. Pass `group_type_index: 0` — usage metrics apply to both groups and
            persons regardless of this value.
        param_overrides:
            group_type_index:
                description: >
                    Legacy URL parameter retained for backward compatibility. Pass `0`. The stored value does not scope
                    the metric — usage metrics apply to both groups and persons regardless of this value.
    usage-metrics-list:
        operation: groups_types_metrics_list
        enabled: true
        scopes:
            - usage_metric:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        list: true
        title: List usage metrics
        description: >
            List usage metrics defined for the project. Usage metrics apply to both groups and persons on Customer
            Analytics profile pages — they are NOT scoped to a specific group type despite the legacy URL shape. Returns
            each metric's id, name, format, interval (days), display mode, math aggregation, and filter definition. Pass
            `group_type_index: 0`.
        param_overrides:
            group_type_index:
                description: >
                    Legacy URL parameter retained for backward compatibility. Pass `0`. The stored value does not scope
                    the metric — usage metrics apply to both groups and persons regardless of this value.
    usage-metrics-partial-update:
        operation: groups_types_metrics_partial_update
        enabled: true
        scopes:
            - usage_metric:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        title: Update usage metric
        description: >
            Update fields on an existing usage metric. Accepts a subset of fields; unspecified fields are left
            unchanged. `filters` accepts the events shape (default) or the data warehouse shape (`source:
            "data_warehouse"` plus `table_name`, `timestamp_field`, `key_field`). When switching to DW, call
            `external-data-schemas-list` to discover synced tables. Changing `math` to `sum` requires `math_property`;
            changing to `count` requires clearing `math_property`. For DW SUM metrics, `math_property` is the column
            name to sum. DW metrics currently render only on group profiles. Pass `group_type_index: 0` — usage metrics
            apply to both groups and persons regardless of this value.
        param_overrides:
            group_type_index:
                description: >
                    Legacy URL parameter retained for backward compatibility. Pass `0`. The stored value does not scope
                    the metric — usage metrics apply to both groups and persons regardless of this value.
            filters:
                input_schema: UsageMetricFiltersSchema
            math_property:
                description: >
                    Required when `math` is `sum`; must be empty when `math` is `count`. For events metrics this is an
                    event property name. For data warehouse metrics this is the column name (or HogQL expression) to sum
                    on the DW table.
    usage-metrics-retrieve:
        operation: groups_types_metrics_retrieve
        enabled: true
        scopes:
            - usage_metric:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: Get usage metric
