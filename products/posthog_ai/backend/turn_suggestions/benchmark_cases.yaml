# Labeled PostHog AI turns for tuning the turn suggestion thresholds against live Jev.
# Run them with `python manage.py turn_suggestions_benchmark`.
#
# Every case is invented. Do not paste real conversations here, even with names changed.
#
# `acceptable` lists every offer that would be a good outcome. `[none]` means the card must stay
# hidden. A case that lists `none` next to an offer is borderline: either outcome is fine, so it
# counts toward the offer rate but not toward precision or recall.
#
# Optional fields: `tool_status` (default completed), `earlier` turns, `insights`, `issues`, and
# `scouts_available` (default true).

# Recurring metrics
- name: weekly-signups
  category: recurring_metric
  acceptable: [scout]
  question: How many signups did we get this week compared to last week?
  tools: [query-trends]
  answer: You had 412 signups this week, up 8% from 381 last week. Most of the growth came from organic search.

- name: signups-down-today
  category: recurring_metric
  acceptable: [scout]
  question: Are signups down today? It feels slow.
  tools: [query-trends]
  answer: Signups today are at 31 so far, about 40% below the same time yesterday (52). The drop started around 09:00 UTC and affects every channel.

- name: revenue-month-to-date
  category: recurring_metric
  acceptable: [scout]
  question: What's our revenue month to date and how does it compare to last month?
  tools: [execute-sql]
  answer: Revenue month to date is $48,200, 6% ahead of the same point last month ($45,470). Annual plans make up 38% of it.

- name: checkout-conversion-worry
  category: recurring_metric
  acceptable: [scout]
  question: Is checkout conversion getting worse? I want to keep an eye on it.
  tools: [query-funnel]
  answer: Checkout conversion is 31.2% this week against 33.8% last week. It has slipped for three weeks in a row, mostly on mobile.

- name: p95-latency-concern
  category: recurring_metric
  acceptable: [scout]
  question: Is the p95 page load time on the dashboard page OK this week?
  tools: [execute-sql]
  answer: The p95 load time for /dashboard is 2.8s this week, up from 2.1s last week. The rise lines up with the new charts rollout.

- name: several-metrics-digest
  category: recurring_metric
  acceptable: [scout]
  question: And what's the trial to paid conversion rate?
  tools: [query-funnel]
  answer: Trial to paid conversion is 14.2% for trials that started last month, up from 12.9% the month before.
  earlier:
      - question: How many weekly active users do we have?
        tools: [query-trends]
        answer: You have 3,420 weekly active users, up 4% on last week.
      - question: How many new signups this week?
        tools: [query-trends]
        answer: 412 signups this week, up 8% on last week.

- name: llm-spend-yesterday
  category: recurring_metric
  acceptable: [scout, none]
  question: How much did we spend on LLM calls yesterday?
  tools: [execute-sql]
  answer: LLM spend yesterday was $182.40 across 41,000 generations. The summarization feature accounts for 61% of it.

- name: dau-last-30-days
  category: recurring_metric
  acceptable: [scout, none]
  question: Show me daily active users for the last 30 days
  tools: [query-trends]
  answer: Daily active users averaged 1,210 over the last 30 days, with weekday peaks around 1,450 and weekend lows near 760.

# Investigations
- name: checkout-drop-cause-found
  category: diagnostic
  acceptable: [notebook, scout]
  question: Why did checkout conversion drop on Tuesday?
  tools: [query-funnel, query-session-recordings-list, query-trends]
  answer: Checkout conversion fell from 34% to 21% on Tuesday starting at 14:10 UTC. The drop lines up with the 14:05 release, which broke the payment form on Safari. Recordings show users stuck on the card step. Conversion recovered after the 17:30 rollback.

- name: churn-spike-cause-found
  category: diagnostic
  acceptable: [notebook]
  question: Why did so many accounts cancel last week?
  tools: [execute-sql, query-trends, query-cohorts-list]
  answer: Cancellations rose to 58 last week from a usual 20. Most of them were accounts on the legacy plan that received the price change email on Monday. 41 of the 58 cancellations came within two days of that email.

- name: retention-exploration
  category: diagnostic
  acceptable: [notebook, none]
  question: Why do users who sign up on mobile retain worse than on desktop?
  tools: [query-retention, query-trends, query-funnel]
  answer: Mobile signups retain 18% at week 4 against 31% on desktop. Mobile users rarely finish the onboarding checklist (22% against 58%), and those who do finish retain about as well as desktop users.

