  question: How do I make a cohort of users who did an event at least 3 times?
  tools: [docs-search]
  answer: Create a new cohort, add a behavioral filter "Completed event", pick the event, and set the count to "at least 3 times" in the time range you want.

- name: concept-explanation
  category: knowledge
  acceptable: [none]
  question: What's the difference between a session and a pageview?
  tools: []
  answer: A pageview is one page load. A session groups all of a user's activity until they are inactive for 30 minutes, so one session usually holds several pageviews.

