# Labeled PostHog AI turns for tuning the turn suggestion thresholds against live Jev.
# Run them with `python manage.py turn_suggestions_benchmark`.
#
# Every question and answer is written from scratch with invented names and ids. The mix of case
# kinds (openers with no question, dashboard and flag edits, lookups of one person, monitoring asks,
# investigations) follows the kinds of conversations people have. Do not paste real conversations
# here, even with names changed.
#
# `acceptable` lists every offer that would be a good outcome. `[none]` means the card must stay
# hidden. A case that lists `none` next to offers is borderline: no card or one of those offers is
# fine, so only an offer of another kind counts against it.
#
# Optional fields: `tool_status` (default completed), `earlier` turns, `insights`, `issues`, and
# `scouts_available` (default true).

