# The path after "Nudge by email" goes to the exit, which a file cannot place there. Applying the file sends people on this path to "Text them" instead.
# The path after "Text them" goes to "Nudge by email", which a file cannot place there. Applying the file sends people on this path to the exit instead.
# The email design of "Nudge by email" was made in the email editor, and a file builds the design from html. The file writes "Nudge by email" as type: step with its whole config, so the design stays.
version: 1
key: re-engagement
name: Re-engagement
status: active
trigger:
  type: event
  event: trial started
steps:
  - type: step
    name: Wait for a click
    action_type: wait_until_condition
    config:
      condition:
        filters:
          events:
            - id: $autocapture
              name: $autocapture
              type: events
              order: 0
      max_wait_duration: 3d
    branches:
      - - type: step
          name: Nudge by email
          action_type: function_email
          config:
            template_id: template-email
            inputs:
              email:
                value:
                  from:
                    integrationId: 7
                    integrationIds:
                      - 7
                  to:
                    email: '{person.properties.email}'
                  subject: Your trial ends soon
                  text: Come back and finish setup.
                  html: <p>Come back and finish setup.</p>
                  design:
                    counters:
                      u_row: 1
                      u_column: 1
                      u_content_text: 1
                    schemaVersion: 16
                    body:
                      id: body-1
                      headers: []
                      footers: []
                      rows:
                        - id: row-1
                          cells:
                            - 1
                          columns:
                            - id: column-1
                              contents:
                                - id: text-1
                                  type: text
                                  values:
                                    text: <p>Come back and finish setup.</p>
                                    fontSize: 16px
                              values: {}
                          values: {}
                      values: {}
  - type: step
    name: Text them
    action_type: function_sms
    config:
      template_id: template-twilio
      inputs:
        to:
          value: '{person.properties.phone}'
        body:
          value: Your trial ends soon. Come back and finish setup.
      message_category_type: marketing
exit:
  reason: Done
