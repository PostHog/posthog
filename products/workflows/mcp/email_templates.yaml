# MCP tool definitions. Tools are opt-in: an operation is exposed only when it has an entry here.
# List operations without an entry: pnpm --filter=@posthog/mcp run scaffold-yaml -- --candidates --product workflows
# Add one: pnpm --filter=@posthog/mcp run scaffold-yaml -- --add <operationId> --product workflows --file ../../products/workflows/mcp/email_templates.yaml
# To keep an operation off on purpose, set enabled: false and give a disabled_reason.
category: Workflows
feature: workflows
url_prefix: /workflows/library/templates
ui_apps:
    email-template:
        type: detail
        view_prop: template
tools:
    workflows-create-email-template:
        operation: messaging_templates_create
        enabled: true
        scopes:
            - hog_flow:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        enrich_url: '{id}'
        title: Create email template
        description: >
            Save an email template to the workflows library. Provide name and content.email with subject, a plain-text
            fallback, and design (design JSON for PostHog's visual email editor — schema in the
            designing-email-templates skill); the sent email is compiled from the design JSON. Liquid personalization
            works throughout — Liquid tags, apostrophes, and emoji are ordinary JSON characters, so pass the design
            inline exactly as authored. Then call workflows-show-email-template and share the _posthogUrl link with the
            user.
        exclude_params:
            - content.email.html
        response:
            exclude:
                - content
                - created_by
    workflows-get-email-template:
        operation: messaging_templates_retrieve
        enabled: true
        scopes:
            - hog_flow:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        enrich_url: '{id}'
        title: Get email template
        description: >
            Get an email template by ID, including content.email (subject, text, design). Use this to fetch before
            updating — content is replaced as a whole and humans may have edited the design in the visual editor since
            you last saw it, so build your update payload from this response. Before you change a template, read
            managed_by and change_prompt_context: a template whose managed_by is code changes in its file, as
            change_prompt_context describes, never through the update or patch tools. To display a template to the
            user, use workflows-show-email-template instead.
        response:
            exclude:
                - content.email.html
                - created_by
    workflows-list-email-templates:
        operation: messaging_templates_list
        enabled: true
        scopes:
            - hog_flow:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        enrich_url: '{id}'
        list: true
        title: List email templates
        description: >
            List email templates in the workflows library — metadata only; fetch a template's content with
            workflows-get-email-template. Templates are referenced from a workflow's function_email action.
        response:
            exclude:
                - content
                - created_by
                - change_prompt_starter
                - change_prompt_context
                - change_prompt_variables
    workflows-patch-email-template:
        operation: messaging_templates_design_partial_update
        enabled: true
        scopes:
            - hog_flow:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        input_schema: EmailTemplateDesignPatchSchema
        enrich_url: '{id}'
        title: Patch email template design
        description: >
            Surgically edit an email template's design by sending a small, ordered list of operations instead of
            resending the whole design JSON. Prefer this over workflows-update-email-template for any change to an
            existing design. Reference blocks by their id (call workflows-get-email-template first to read the current
            design and its ids). For the common case — tweak one block — use update_content with a deep-merge patch
            (e.g. {op: update_content, id: '<block-id>', patch: {values: {text: '<p>New copy</p>'}}}); a null leaf
            deletes that key. Use add_content / remove_content / move_content / add_row / remove_row for structural
            changes; ids and Unlayer numbering for added blocks are assigned for you. Operations apply atomically — the
            design is read, the ops applied in order, the result validated and re-rendered to HTML, and saved only if
            valid, otherwise nothing changes. After patching, call workflows-show-email-template so the user sees the
            result. A template whose managed_by is code refuses this with 403 immutable. Change such a template in this
            order: 1. when you can reach its repository, edit the file at source_path in source_repository yourself,
            following change_prompt_context; the next send uploads it. 2. Otherwise, call
            workflows-request-email-template-change.
        response:
            exclude:
                - content
                - created_by
    workflows-show-email-template:
        operation: messaging_templates_retrieve
        enabled: true
        scopes:
            - hog_flow:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        enrich_url: '{id}'
        title: Show email template
        description: >
            Render an email template as an inline preview for the user. Call after creating or updating a template, and
            whenever the user asks to see one. The response carries the final rendered html — read it before describing
            the result. For fetching a template to edit it, use workflows-get-email-template.
        ui_app: email-template
        response:
            exclude:
                - content.email.design
                - created_by
    workflows-upload-email-template:
        operation: messaging_templates_by_key_update
        enabled: true
        feature_flag: workflows-transactional-email-api
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        enrich_url: '{id}'
        title: Upload email template by key
        description: >
            Upload an email template kept as an HTML file in a repository, by a key you choose (such as welcome or
            password-reset). Use this for templates that live in code; use workflows-create-email-template for
            templates designed in PostHog. Send name, subject, html, and optionally text, preheader and source
            (repository, path, ref of the file). Use {{ variables.* }} for every value the email needs; templates
            can't read person properties. The first upload creates the template and makes it sendable over the
            transactional email API with the project's default verified sender, so verify a sender first. Later uploads
            publish changed content at once and answer unchanged when nothing changed. Uploading replaces edits made
            in PostHog. When you upload only because a send answered template_outdated, set if_not_superseded: an
            answer of superseded means newer content is already published and nothing changed. Leave it out to publish
            this content even when newer content replaced it, such as to roll back. A plain 404 means the transactional email API is not enabled for this project: stop and tell
            the user.
    workflows-request-email-template-change:
        operation: messaging_templates_request_change_create
        enabled: true
        feature_flag: workflows-transactional-email-api
        scopes:
            - task:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        title: Request email template change
        description: >
            The fallback for agents that can't edit the file of a template whose managed_by is code. An agent that can
            reach the template's repository, such as a coding agent in the person's workspace, edits the file at
            source_path itself, following change_prompt_context, and does not call this tool. Otherwise, pass the
            person's request as instruction. PostHog Code then starts a task that changes the file and opens a pull
            request in the template's GitHub repository. PostHog doesn't change the template: the next upload of the
            changed file publishes it. Share the returned task_url with the person. Each call starts another task, so
            never repeat a call that succeeded. A plain 404 means the transactional email API is not enabled for this
            project: stop and tell the user.
    workflows-send-email:
        operation: messaging_send_email_create
        enabled: true
        feature_flag: workflows-transactional-email-api
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        title: Send transactional email
        description: >
            Send one transactional email to one recipient from a template, named by template.key (as uploaded with
            workflows-upload-email-template) or template.id (a template made in PostHog). Put every value the
            template needs into message_data, read as {{ variables.* }}; the template can't read person properties.
            Set identifiers.distinct_id to record the email on that person. Pass template.hash, the content_hash of the
            last upload, to check that PostHog holds that content: template_outdated means nothing was sent, so upload
            the template and send again; a template_superseded warning means newer content was sent. Each call sends
            an email, so never repeat a call that succeeded. A plain 404 without a code means the transactional email
            API is not enabled for this project: stop and tell the user.
    workflows-update-email-template:
        operation: messaging_templates_partial_update
        enabled: true
        scopes:
            - hog_flow:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        enrich_url: '{id}'
        title: Update email template
        description: >
            Replace an email template's content as a whole. For small edits to an existing design (change a heading, a
            button color, one paragraph), prefer workflows-patch-email-template — it sends just the changed fields
            instead of the entire design JSON. Use this tool to set content from scratch or replace it wholesale: call
            workflows-get-email-template first (the design may carry fresh human edits from the visual editor) and send
            back the complete content.email with your edited design. The server re-renders the sent email from the
            design on save. After updating, call workflows-show-email-template so the user sees the result, and share
            the returned _posthogUrl edit link. A template whose managed_by is code refuses every update with 403
            immutable. Change such a template in this order: 1. when you can reach its repository, edit the file at
            source_path in source_repository yourself, following change_prompt_context; the next send uploads it. 2.
            Otherwise, call workflows-request-email-template-change.
            To move a template made in PostHog into code, send key (such as welcome) as the only field. A key is set
            once and never changes. The next workflows-upload-email-template with that key updates this template and
            keeps its id, workflow and sender.
        exclude_params:
            - content.email.html
            - managed_by
        response:
            exclude:
                - content
                - created_by
