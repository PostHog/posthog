version: 1
key: welcome-new-signups
name: Welcome new signups
description: A day after signup, marks people who have an email address as ready for the welcome email.
status: draft
trigger:
    type: event
    event: user signed up
steps:
    - type: delay
      name: Wait a day
      duration: 1d
    - type: branch
      name: Has an email address?
      arms:
          - name: Has an email address
            when:
                - { person: email, operator: is_set }
            then:
                - type: function
                  name: Mark as ready for the welcome email
                  template: template-posthog-update-person-properties
                  inputs:
                      distinct_id: '{event.distinct_id}'
                      set_properties:
                          welcome_email_ready: true
exit:
    reason: Welcome new signups finished
