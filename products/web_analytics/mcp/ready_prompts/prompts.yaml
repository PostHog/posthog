# Ready-made web analytics questions, served as MCP prompts (prompts/list, prompts/get) by services/mcp.
# Each prompt is one user message: the question, the tools that answer it, and the shape of the answer.
# `tools` lists the tools in the order the agent should reach for them; the eval suite in
# products/web_analytics/evals checks that the first relevant tool the agent calls is `tools[0]`.
# An argument's value, when the client passes one, is appended to the message as "<name>: <value>".
prompts:
    - name: web-analytics-weekly-summary
      title: How did my website do last week?
      description: Visitors, pageviews, bounce rate and session duration for the last 7 complete days against the 7 before, with top pages, sources and goals.
      tools: [web-analytics-weekly-digest]
      answer_shape: The period covered, each headline metric with its change against the 7 days before, then the top pages, top sources and goal conversions.
      text: |
          How did my website do last week?

          Use `web-analytics-weekly-digest` with the defaults (the last 7 complete days, compared with the 7 days before).
          Answer with the exact dates covered, then unique visitors, pageviews, sessions, bounce rate and average session duration, each with its change against the previous period.
          Then list the top pages, the top traffic sources and any goal conversions.
          Say whether internal and test users were excluded.

    - name: web-analytics-traffic-change
      title: Why did my traffic change this week?
      description: Finds the channels, referrers and landing pages behind a rise or drop in visitors over the last 7 complete days.
      tools: [query-web-overview, query-web-stats]
      answer_shape: The headline change in visitors, then the two or three breakdown rows that explain most of it, each with its visitors before and after.
      text: |
          Why did my traffic change this week?

          First use `query-web-overview` with `compareFilter: { compare: true }` and `dateRange: { date_from: "-7d" }` to measure the change in visitors over the last 7 complete days against the 7 days before.
          Then use `query-web-stats` with the same comparison, broken down by `InitialChannelType`, then `InitialReferringDomain`, then `InitialPage`, and find the rows whose visitor counts moved the most in absolute terms.
          Answer with the headline change, then the two or three rows that explain most of it, each with its visitors in both periods.
          Say which days each period covers, and say so if no single source explains the change.

    - name: web-analytics-compare-periods
      title: Compare this week with last week
      description: Visitors, pageviews, sessions, bounce rate and session duration for the last 7 complete days against the 7 days before.
      tools: [query-web-overview]
      answer_shape: One line per metric with the current value, the previous value and the change in percent, and the days each period covers.
      text: |
          Compare this week with last week.

          Use `query-web-overview` with `dateRange: { date_from: "-7d" }` and `compareFilter: { compare: true }`.
          Answer with one line per metric (visitors, pageviews, sessions, bounce rate, average session duration): this period, the previous period and the change in percent.
          Say which days each period covers. Today's partial day is left out.

    - name: web-analytics-yesterday-vs-last-week
      title: How did yesterday compare with the same day last week?
      description: Sessions, visitors and session duration for yesterday against the same weekday a week earlier.
      tools: [query-web-overview]
      answer_shape: Yesterday's sessions, visitors and average session duration next to the same weekday a week earlier, with the change in percent.
      text: |
          How did yesterday compare with the same day last week?

          Use `query-web-overview` with `dateRange: { date_from: "-1dStart", date_to: "-1dEnd" }` and `compareFilter: { compare: true, compare_to: "-7d" }`.
          Answer with sessions, visitors and average session duration for yesterday and for the same weekday a week earlier, with the change in percent for each.

    - name: web-analytics-top-pages
      title: What are my top pages?
      description: The 10 pages with the most visitors over the last 7 days, with pageviews and bounce rate.
      tools: [query-web-stats]
      answer_shape: A ranked list of paths with visitors, pageviews and bounce rate.
      text: |
          What are my top pages?

          Use `query-web-stats` with `breakdownBy: "Page"`, `includeBounceRate: true`, `doPathCleaning: true` and `limit: 10` over the last 7 days.
          Answer with the pages ranked by visitors, with visitors, pageviews and bounce rate for each.

    - name: web-analytics-traffic-sources
      title: Where do my visitors come from?
      description: Visitors over the last 7 days by channel and by referring domain.
      tools: [query-web-stats]
      answer_shape: The top channels with visitors and their share of the total, then the top referring domains with visitors.
      text: |
          Where do my visitors come from?

          Use `query-web-stats` over the last 7 days twice: once with `breakdownBy: "InitialChannelType"` and once with `breakdownBy: "InitialReferringDomain"`, each with `limit: 10`.
          Answer with the top channels by visitors and their share of all visitors, then the top five referring domains by visitors.
          Report `$direct` as direct traffic.

    - name: web-analytics-worst-bounce-landing-pages
      title: Which landing pages bounce worst?
      description: Landing pages with at least 20 visitors over the last 7 days, ranked by bounce rate.
      tools: [query-web-stats]
      answer_shape: The landing pages with the highest bounce rate, each with its bounce rate and visitors, leaving out pages with fewer than 20 visitors.
      text: |
          Which landing pages bounce worst?

          Use `query-web-stats` with `breakdownBy: "InitialPage"`, `includeBounceRate: true`, `doPathCleaning: true` and `limit: 200` over the last 7 days.
          Leave out landing pages with fewer than 20 visitors, because their bounce rate is noise.
          Answer with the five remaining pages with the highest bounce rate, worst first, each with its bounce rate and visitors.

    - name: web-analytics-goal-conversion-rate
      title: What share of my visitors convert?
      description: The share of visitors over the last 7 days who completed a conversion goal, such as a sign-up or a purchase.
      tools: [query-web-overview]
      answer_shape: The conversion rate, the converting visitors and the total visitors, and the goal used.
      arguments:
          - name: goal
            description: The event or action that counts as a conversion, for example signed_up.
            required: false
      text: |
          What share of my visitors convert to my goal?

          Use the goal given below. If no goal is given, look up the project's events and actions, pick the likeliest conversion (a sign-up or a purchase) and say which one you picked.
          Use `query-web-overview` over the last 7 days with `conversionGoal` set to the goal: `{ customEventName: "<event>" }` for an event, `{ actionId: <id> }` for an action.
          Answer with the conversion rate, the number of visitors who converted and the total number of visitors.

    - name: web-analytics-goal-conversion-by-channel
      title: Which channels bring the most conversions?
      description: Conversions to a goal over the last 7 days by channel, with each channel's conversion rate.
      tools: [query-web-stats]
      answer_shape: Channels ranked by conversions, each with its conversions, visitors and conversion rate, and the goal used.
      arguments:
          - name: goal
            description: The event or action that counts as a conversion, for example signed_up.
            required: false
      text: |
          Which channels bring the most conversions to my goal?

          Use the goal given below. If no goal is given, look up the project's events and actions, pick the likeliest conversion (a sign-up or a purchase) and say which one you picked.
          Use `query-web-stats` with `breakdownBy: "InitialChannelType"` over the last 7 days and `conversionGoal` set to the goal: `{ customEventName: "<event>" }` for an event, `{ actionId: <id> }` for an action.
          Answer with the channels ranked by total conversions, each with its conversions, visitors and conversion rate.

    - name: web-analytics-set-up-conversion-goal
      title: Set up a conversion goal
      description: Turns a sign-up, purchase or other key step into an action that web analytics can use as a conversion goal.
      tools: [action-create, query-web-overview]
      answer_shape: The action that was created or reused, its conversions over the last 7 days, and where to pick it as a goal in Web analytics.
      arguments:
          - name: goal
            description: The step to count as a conversion, for example "a visit to /thank-you" or "the signed_up event".
            required: false
      text: |
          Set up a conversion goal for my website.

          Use the step given below. If none is given, ask me which step counts as a conversion, and suggest the likeliest events from the project (a sign-up or a purchase).
          Check the existing actions first and reuse one that already matches the step. Otherwise create one with `action-create`: match the event, or a `$pageview` whose URL contains the path.
          Then run `query-web-overview` over the last 7 days with `conversionGoal: { actionId: <id> }` to check that it records conversions.
          Answer with the action's name and id, its conversions and conversion rate over the last 7 days, and that it can be picked as the conversion goal in the Web analytics filters.

    - name: web-analytics-worst-web-vitals
      title: Which pages have the worst Core Web Vitals?
      description: The pages with the worst p75 LCP, INP and CLS over the last 7 days, leaving out pages with too few samples.
      tools: [query-web-vitals]
      answer_shape: For each metric with data, the worst pages with their p75 value, rating and sample count. Single-sample pages are called out as noise.
      text: |
          Which pages have the worst Core Web Vitals?

          Use `query-web-vitals` with `percentile: "p75"`, `doPathCleaning: true` and `dateRange: { date_from: "-7d" }`, once for each of `LCP`, `INP` and `CLS`.
          For each metric, answer with the worst pages, worst first, each with its p75 value, its rating (good, needs improvement or poor) and its sample count.
          Do not report a page with only one or two samples as the worst page. Say if a metric has no data.

    - name: web-analytics-ai-agent-traffic
      title: How much of my traffic comes from AI agents and bots?
      description: Pageviews over the last 7 days split into people, AI agents, bots and automation, with the top AI agents.
      tools: [query-trends]
      answer_shape: The share of pageviews for each traffic type, then the AI agents and crawlers with the most pageviews.
      text: |
          How much of my traffic comes from AI agents and bots?

          Load the `filtering-bot-traffic` skill if it's available.
          Use `query-trends` on `$pageview` over the last 7 days, broken down by the event property `$virt_traffic_type`, with `filterTestAccounts: false` so nothing is hidden.
          Then run `query-trends` again, broken down by `$virt_bot_name`, with a `$virt_traffic_type` exact `AI Agent` event property filter.
          Answer with the pageviews and share for each traffic type (Regular, AI Agent, Bot, Automation), then the AI agents with the most pageviews.

    - name: web-analytics-audience
      title: Where are my visitors and what devices do they use?
      description: Visitors over the last 7 days by country and by device type.
      tools: [query-web-stats]
      answer_shape: The top countries with visitors, then the split between desktop, mobile and tablet.
      text: |
          Where are my visitors and what devices do they use?

          Use `query-web-stats` over the last 7 days twice: once with `breakdownBy: "Country"` and `limit: 10`, once with `breakdownBy: "DeviceType"`.
          Answer with the top five countries by visitors, then the visitors and share for each device type.

    - name: web-analytics-daily-visitors
      title: Show my daily visitors for the last 2 weeks
      description: Unique visitors per day over the last 14 days.
      tools: [query-trends]
      answer_shape: One value per day, with today marked as a partial day.
      text: |
          Show my daily visitors for the last 2 weeks.

          Use `query-trends` on `$pageview` with the `dau` math, `interval: "day"` and `dateRange: { date_from: "-14d" }`.
          Answer with the unique visitors for each day. Mark today as a partial day and leave it out of any comparison.
