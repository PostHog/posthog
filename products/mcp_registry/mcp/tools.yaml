# MCP tool definition — tool entries are scaffolded from the OpenAPI schema.
# The tool list and operation IDs are kept in sync automatically:
#   pnpm --filter=@posthog/mcp run scaffold-yaml -- --sync-all
#
# To enable a tool, set enabled: true and add required scopes + annotations.
# All other fields (title, description, enrich_url, etc.) are yours to configure.
category: MCP registry
feature: mcp_registry
url_prefix: /mcp-registry
ui_apps: {}
tools:
    mcp-registry-discover:
        operation: mcp_registry_servers_discover_retrieve
        enabled: true
        scopes:
            - mcp_registry:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: Discover MCP servers for a task
        description: >
            Find the MCP servers most likely to perform a task, ranked, with the instructions to connect to each one.


            Name the vendor or product in `intent` when you know it, as in "vercel deploy" or "linear issues". Matching
            is lexical: it compares your words against the words a server uses about itself, so a paraphrase misses and
            a natural-sounding sentence can rank a novelty server above the vendor's own.


            Each candidate carries `liveness` from a real handshake against the server, `why` with the breakdown behind
            `score`, and `measured` with observed call volume and success rate where PostHog Analytics has seen the
            server in use. `score` is the server's own standing. Ordering also weighs how well its text matched
            `intent`, which the response does not return yet, so adjacent scores can look out of order.


            Most of the index is still unprobed, and an unprobed server scores below a confirmed live one. A first-party
            server behind OAuth can therefore sit under an anonymous one that needs no auth. Read a low-ranked vendor
            server as unproven rather than bad.


            `connect` gives the connection methods, most automated first, with each step marked for the agent to run or
            for a person to do. The index is a global crawl of the official MCP registry rather than a table in this
            project, so it is not queryable in SQL. Use `mcp-registry-server-get` for one candidate's full tool list.
        include_params:
            - intent
            - version
            - limit
    mcp-registry-server-get:
        operation: mcp_registry_servers_retrieve
        enabled: true
        scopes:
            - mcp_registry:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: Get an MCP server
        description: >
            Read one registry server by id, as returned by `mcp-registry-discover`. Adds the full advertised tool list,
            per-version ranking scores, and connection instructions to what discover returns.


            Measured usage is tiered. A project reads its own figures, and not those of other projects that measured the
            same server. A PostHog staff caller reads every contributing project's figures instead, so treat them as
            customer data: they belong to named projects, and must not be repeated into a pull request, a message, or a
            shared document.
    mcp-registry-servers-compare-retrieve:
        operation: mcp_registry_servers_compare_retrieve
        enabled: false
    mcp-registry-servers-list:
        operation: mcp_registry_servers_list
        enabled: false
    mcp-registry-servers-measured-projects-list:
        operation: mcp_registry_servers_measured_projects_list
        enabled: false
    mcp-registry-servers-versions-list:
        operation: mcp_registry_servers_versions_list
        enabled: false
