# MCP tool definitions. Tools are opt-in: an operation is exposed only when it has an entry here.
# List operations without an entry: pnpm --filter=@posthog/mcp run scaffold-yaml -- --candidates --product warehouse_suggestions
# Add one: pnpm --filter=@posthog/mcp run scaffold-yaml -- --add <operationId> --product warehouse_suggestions
# To keep an operation off on purpose, set enabled: false and give a disabled_reason.
category: Warehouse suggestions
feature: warehouse_suggestions
url_prefix: /models
feature_flag: warehouse-suggestions
ui_apps: {}
tools:
    warehouse-suggestions-accept:
        operation: warehouse_suggestions_accept_create
        enabled: true
        scopes:
            - warehouse_objects:write
            - data_catalog_approval:write
            - warehouse_view:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        title: Accept a warehouse suggestion
        description: >
            Accept a proposed warehouse suggestion. Certify and deprecate suggestions mark the view or table as
            certified or deprecated in the data catalog. Accepting a deprecate suggestion on a materialized view also
            stops its refreshes and deletes its stored table, so the view is computed when read; pass
            keep_materialized=true to keep it refreshing. The view stays materialized when other views read from it or
            its refreshes feed person properties, a destination or a workflow; `created_asset.stopped_materialization`
            says whether refreshes stopped. Unmaterialize suggestions turn a rarely read materialized view back into a
            plain view: its refreshes stop, its stored table is deleted, and each read computes the view, taking about
            `read_seconds`. A 409 means the view changed since the suggestion was made, for example another view now
            reads from it or it now refreshes incrementally. Materialize suggestions turn on materialization for the
            view on the proposed schedule, which adds a recurring compute cost; pass refresh_interval_seconds to use
            another schedule. They also apply the payload's refresh_mode: incremental refreshes read only new rows by
            incremental_key and update rows by unique_key, full refreshes rebuild the whole table. The payload is a
            starting point. To change it, pass any of refresh_interval_seconds, refresh_mode, incremental_key,
            unique_key and lookback_seconds; an omitted field keeps the suggested value. Check keys the person chose
            with view-check-incremental first. A 400 names the field the server refused and why. A 409 means the view
            changed since the suggestion was made and its suggested keys no longer apply. Requires human typed
            confirmation.
        confirmed_action:
            message: >
                About to accept warehouse suggestion '{id}'. This applies the change it proposes to the view or table.
                If it is a materialize suggestion, the view then refreshes on a schedule, which adds a recurring compute
                cost. If it is a deprecate suggestion on a materialized view, its refreshes stop and its stored table is
                deleted, unless keep_materialized is true. If it is an unmaterialize suggestion, the view's refreshes
                stop, its stored table is deleted, and each read computes the view instead. Reply 'confirm' to proceed.
            action_label: accept warehouse suggestion
    warehouse-suggestions-dismiss:
        operation: warehouse_suggestions_dismiss_create
        enabled: true
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        title: Dismiss a warehouse suggestion
        description: >
            Dismiss a proposed warehouse suggestion with a reason: not_useful, not_now or other, plus an optional note.
            Nothing changes on the view or table. warehouse-suggestions-resume brings it back.
    warehouse-suggestions-get:
        operation: warehouse_suggestions_retrieve
        enabled: true
        title: Get a warehouse suggestion
        description: >
            Get one warehouse suggestion by id, with the `evidence` behind it. Evidence counts reads between
            `evidence_window_start` and `evidence_window_end`. `human_requests` is the queries people ran on the view or
            table, `human_users` the distinct people, `human_days` the days with such reads, and `requests_by_surface`
            those queries per place, such as sql_editor, dashboard or mcp. `background_requests` is the queries PostHog
            ran on its own, such as cache warming and alerts. `last_read_at` is the latest read of any kind, background
            included. `days_with_data` is how many days of the window PostHog has read history for, not how active this
            project is. A field is missing when the subject had no reads. Use these counts and the numbers in `payload`
            to explain to the user why a view or table should be certified, deprecated, materialized or unmaterialized
            before accepting.
    warehouse-suggestions-list:
        operation: warehouse_suggestions_list
        enabled: true
        list: true
        title: List warehouse suggestions
        description: >
            Recommendations to certify, deprecate, materialize or unmaterialize data warehouse views and tables,
            computed daily from how often the project reads them. Pass status=proposed for the suggestions still waiting
            for a decision. `payload` says what accepting would create or change. `can_act` says whether the caller can
            edit the view or table, which accept, dismiss and resume require. Accepting a certify or deprecate
            suggestion also requires edit access to the data catalog. Use warehouse-suggestions-get for the usage
            evidence behind one suggestion. If the list is empty, call warehouse-suggestions-status to learn why.
            Results come in priority order, the one most worth acting on first. Explain a suggestion to the user with
            the numbers in `payload`, the time and bytes saved or spent per month. For an unmaterialize suggestion,
            compare refresh_seconds_per_month with live_seconds_per_month and say how long one read would take
            (`read_seconds`). For a certify suggestion, use the read counts in `evidence` from
            warehouse-suggestions-get.
        response:
            include:
                - id
                - kind
                - subject_kind
                - subject_id
                - payload
                - status
                - can_act
    warehouse-suggestions-resume:
        operation: warehouse_suggestions_resume_create
        enabled: true
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        title: Resume a dismissed warehouse suggestion
        description: |
            Put a dismissed warehouse suggestion back to proposed, so it can be accepted.
    warehouse-suggestions-status:
        operation: warehouse_suggestions_status_retrieve
        enabled: true
        title: Get warehouse suggestions status
        description: >
            Explain why the project has or lacks warehouse suggestions. Reports whether suggestions are turned on,
            whether the project reads its views often enough to get them, how many days of read history the daily job
            has so far, and when it last ran.
