[workspace]

[package]
name = "meep-domain"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = {version = "0.4", features = ["serde"]}
meep-topic = {path = "../desktop/crates/meep-topic"}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
meep-views = {path="../desktop/crates/meep-views"}
meep-script = {path="../desktop/crates/meep-render/meep-script"}
