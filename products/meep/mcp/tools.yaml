category: Meep
feature: meep
url_prefix: /
ui_apps: {}
tools:
    meep-topic-list:
        operation: meep_topics_list
        enabled: true
        scopes:
            - meep:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: List Meep topics
        description: List private topics for the signed-in member in this project.
    meep-topic-get:
        operation: meep_topics_retrieve
        enabled: true
        scopes:
            - meep:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: Read a Meep topic
        description: Read the mission and linked PostHog task for one topic.
    meep-scout-create:
        operation: meep_topics_create_scout
        enabled: true
        scopes:
            - meep_scout:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        title: Set up a Scout for this topic
        description: Create a native PostHog Scout for a requested recurring investigation. Its findings appear in the assigned Meep topic. Repeating the same definition returns the linked scout.
    meep-scout-set-enabled:
        operation: meep_topics_set_scout_enabled
        enabled: true
        scopes:
            - meep_scout:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        title: Pause or resume a topic Scout
        description: Set a linked native Scout's enabled state when the user asks to pause or resume monitoring.
