[package]
name = "meep-topics"
version = "0.1.0"
edition = "2024"
description = "Persistent topics with a name, description, metadata, and local files"

[dependencies]
anyhow = "1"
cap-std = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["serde", "v4"] }
