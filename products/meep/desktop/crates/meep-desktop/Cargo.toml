[package]
name = "meep-desktop"
version = "0.1.0"
edition = "2024"
description = "Native workspace window leases, Dock integration, and bundled Sparkle updates"

[features]
hot-reload = []

[target.'cfg(unix)'.dependencies]
anyhow = "1"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSImage"] }
objc2-foundation = "0.3"

[dev-dependencies]
tempfile = "3"
