[package]
name = "meep-store"
version = "0.1.0"
edition = "2024"
description = "Transactional storage for application-defined JSON records"

[features]
default = ["bundled"]
bundled = ["rusqlite/bundled"]

[dependencies]
anyhow = "1"
rusqlite = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
