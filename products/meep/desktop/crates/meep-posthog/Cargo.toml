[package]
name = "meep-posthog"
version = "0.1.0"
edition = "2024"
description = "Project-scoped PostHog clients for native and headless hosts"

[features]
oauth = ["dep:subtle", "dep:oauth2", "dep:tempfile", "serde/derive", "dep:tokio", "tokio/net", "tokio/time", "url/serde"]
tasks = ["dep:mime_guess", "reqwest/multipart", "serde/derive", "tokio/fs", "dep:tokio", "url/serde", "dep:uuid"]
chat = ["tasks", "dep:chrono", "chrono/serde", "dep:meep-protocol"]
mcp = ["serde/derive", "dep:uuid", "dep:futures-util", "dep:sse-stream"]
signals = ["serde/derive"]
workflows = ["serde/derive", "dep:uuid", "dep:chrono", "chrono/serde", "dep:futures-util"]

[dependencies]
thiserror = "2"
subtle = { version = "2", optional = true }
futures-util = { version = "0.3", optional = true }
sse-stream = { version = "0.2.6", optional = true }
anyhow = "1"
chrono = { version = "0.4", optional = true }
meep-protocol = { path = "../meep-protocol", optional = true }
mime_guess = { version = "2", optional = true }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls-native-roots"] }
serde = "1"
serde_json = "1"
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["io-util"], optional = true }
url = "2"
uuid = { version = "1", features = ["serde"], optional = true }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[[test]]
name = "desktop_controls"
required-features = ["tasks"]

[[test]]
name = "gateway"
required-features = ["mcp"]
