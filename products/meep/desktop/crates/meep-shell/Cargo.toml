[package]
name = "meep-shell"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
meep-protocol = { path = "../meep-protocol" }
chrono = "0.4"
gpui-kit = { version = "=0.9.0" }
meep-ui = { path = "../meep-render/meep-script/meep-ui" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSGlassEffectView", "NSView", "NSWorkspace", "NSColor", "NSWindow"] }
objc2-foundation = "0.3"
raw-window-handle = "0.6"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "=0.2.130"
