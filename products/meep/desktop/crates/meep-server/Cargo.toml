[package]
name = "meep-server"
version = "0.1.0"
edition = "2024"
description = "Fixture HTTP host for Meep desktop tests"

[features]
fixture-host = []

[dependencies]
meep-script = { path = "../meep-render/meep-script" }
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
log = "0.4"
meep-connectors = { path = "../meep-connectors" }
meep-store = { path = "../meep-store" }
meep-connections = { path = "../meep-connections" }
meep-engine = { path = "../meep-engine", features = ["posthog"] }
meep-ingest = { path = "../meep-ingest" }
meep-policy = { path = "../meep-policy" }
meep-posthog = { path = "../meep-posthog", features = ["oauth", "mcp", "signals", "tasks", "workflows"] }
meep-topic = { path = "../meep-topic" }
meep-wire = { path = "../meep-wire" }
meep-workflows = { path = "../meep-render/meep-workflows" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toon-format = { version = "0.7", default-features = false }
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["serde", "v4"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }

[dev-dependencies]
meep-client = { path = "../meep-client" }
