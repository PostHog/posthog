[package]
name = "meep-machines"
version = "0.1.0"
edition = "2024"
description = "Supervised connections to remote servers with an idle OpenSSH transport"

[dependencies]
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "process"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "io-std", "io-util"] }
