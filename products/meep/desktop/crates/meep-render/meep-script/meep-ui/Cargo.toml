[package]
name = "meep-ui"
version = "0.1.0"
edition = "2024"
description = "Theme, layout, controls and settings components for native GPUI applications"

[features]
default = ["components"]
components = ["dep:gpui-kit"]

[dependencies]
gpui-kit = { version = "=0.9.0", path = "vendor/gpui-kit", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
