[package]
name = "meep-render"
version = "0.1.0"
edition = "2024"

[features]
default = ["ui"]
widgets = ["meep-ui/components", "dep:gpui-kit", "dep:rust-embed"]
ui = ["widgets", "dep:meep-workflow-ui", "dep:image", "dep:chrono", "dep:async-channel", "dep:async-trait", "dep:tokio", "dep:base64", "meep-workflows/runner", "meep-script/native", "meep-script/browser"]
ui-tests = ["ui", "dep:gpui-test", "dep:gpui-platform-test"]
hot-reload = ["ui", "dep:gpui-hot-reload"]

[dependencies]
meep-workflow-ui = { path = "meep-workflow-ui", optional = true }
meep-ui = { path = "meep-script/meep-ui", default-features = false }
meep-script = { path = "meep-script", default-features = false }
meep-workflows = { path = "meep-workflows", default-features = false }
gpui-kit = { path = "meep-script/meep-ui/vendor/gpui-kit", version = "=0.9.0", optional = true }
gpui-hot-reload = { package = "gpui-pre", path = "meep-script/meep-ui/vendor/gpui-pre", version = "=0.3.11", optional = true, features = ["hot-reload"] }
async-channel = { version = "2", optional = true }
anyhow = "1"
chrono = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rust-embed = { version = "8", features = ["debug-embed"], optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-trait = { version = "0.1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"], optional = true }
base64 = { version = "0.22", optional = true }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"], optional = true }
gpui-test = { package = "gpui-pre", path = "meep-script/meep-ui/vendor/gpui-pre", version = "=0.3.11", features = ["test-support"], optional = true }
gpui-platform-test = { package = "gpui-pre-platform", path = "meep-script/meep-ui/vendor/gpui-pre-platform", version = "=0.3.11", features = ["test-support"], optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1"
image = { version = "0.25", default-features = false, optional = true }

[[example]]
name = "counter"
required-features = ["ui"]
