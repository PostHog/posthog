[package]
name = "meep-connectors"
version = "0.1.0"
edition = "2024"
description = "PostHog, MCP and authenticated webhook sources for topic inboxes"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
http = "1"
meep-connections = { path = "../meep-connections" }
meep-ingest = { path = "../meep-ingest" }
meep-posthog = { path = "../meep-posthog", features = ["mcp"] }
meep-store = { path = "../meep-store" }
meep-topic = { path = "../meep-topic" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "2"
toon-format = { version = "0.7", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
tiny_http = "0.12"
