[package]
name = "meep-native-stores"
version = "0.1.0"
edition = "2024"
description = "Host-selectable Calendar, Reminders, Contacts and Mail readers"

[features]
default = ["calendar", "contacts", "mail"]
calendar = ["dep:objc2-foundation", "dep:chrono", "dep:objc2-event-kit", "dep:objc2", "dep:block2"]
contacts = ["dep:objc2-foundation", "dep:objc2-contacts", "dep:objc2", "dep:block2"]
mail = ["dep:objc2-foundation", "dep:chrono", "dep:serde", "dep:serde_json"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", optional = true, features = ["serde"] }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", optional = true }
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
objc2-event-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "block2", "bitflags", "EKCalendar", "EKCalendarItem", "EKEvent", "EKEventStore", "EKObject", "EKParticipant", "EKReminder", "EKSource", "EKTypes"] }
objc2-contacts = { version = "0.3", optional = true, default-features = false, features = ["std", "block2", "CNContact", "CNContactFetchRequest", "CNContactFormatter", "CNContactStore", "CNError", "CNFetchRequest", "CNLabeledValue", "CNPhoneNumber"] }

[dev-dependencies]
tempfile = "3"
chrono-tz = "0.10"

[[example]]
name = "agenda"
required-features = ["calendar"]
