[package]
name = "meep-protocol"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
meep-workflows = { path = "../meep-render/meep-workflows", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
