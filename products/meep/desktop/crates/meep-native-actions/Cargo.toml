[package]
name = "meep-native-actions"
version = "0.1.0"
edition = "2024"
description = "Host-authorized desktop interactions backed by native macOS dialogs and applications"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
tokio = { version = "1", features = ["io-util", "process", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
