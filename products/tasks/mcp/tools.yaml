# MCP tool definition — tool entries are scaffolded from the OpenAPI schema.
# The tool list and operation IDs are kept in sync automatically:
#   pnpm --filter=@posthog/mcp run scaffold-yaml -- --sync-all
#
# To enable a tool, set enabled: true and add required scopes + annotations.
# All other fields (title, description, enrich_url, etc.) are yours to configure.
category: Tasks
feature: tasks
url_prefix: /tasks
ui_apps:
    loops-review:
        type: custom
        app_name: PostHog Loop Review
        description: Review card for a loop before creation, with a Create loop action.
tools:
    channel-create:
        operation: task_channels_create
        enabled: true
        scopes:
            - task:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        title: Resolve or create a channel
        description: >
            Resolve-or-create a public channel by name (normalized to lowercase-dashed). Idempotent: returns the
            existing channel when one with the name already exists. Use channel-list first when the request names an
            existing channel.
    channel-instructions-retrieve:
        operation: task_channels_instructions_retrieve
        enabled: true
        scopes:
            - task:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: Read channel instructions
        description: >
            Read a channel's CONTEXT.md instructions (versioned markdown describing the channel's context). Returns the
            latest `content` and its `version` — pass that version as `base_version` when publishing an update. A
            channel with no instructions yet reads as a blank version 0.
        param_overrides:
            id:
                description: ID of the channel whose instructions to read.
        feature_flag: context-layer
        feature_flag_behavior: disable
    channel-instructions-update:
        operation: task_channels_instructions_update
        enabled: true
        scopes:
            - task:write
        annotations:
            readOnly: false
            destructive: true
            idempotent: false
        title: Update channel instructions
        description: >
            Publish a complete replacement for a channel's CONTEXT.md. Read the current version with
            channel-instructions-retrieve first. Pass its version as base_version. This guard returns a conflict if
            another update changes the document.
        param_overrides:
            id:
                description: ID of the channel whose instructions to update.
            base_version:
                input_schema: ChannelInstructionsBaseVersionSchema
        feature_flag: context-layer
        feature_flag_behavior: disable
    channel-list:
        operation: task_channels_list
        enabled: true
        scopes:
            - task:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: List channels
        description: >
            List the project's channels (public channels plus the requester's personal #me channel). Use this to resolve
            a channel id from its name before creating or listing canvases or reading instructions.
    channel-retrieve:
        operation: task_channels_retrieve
        enabled: true
        scopes:
            - task:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: Get a channel
        description: "Get a single PostHog Tasks channel by id, returning its name and type. Channels are the project's
            workspace channels that group tasks and canvases (public channels plus each member's #me channel)."
        param_overrides:
            id:
                description: ID of the channel to read.
    code-invites-check-access-retrieve:
        operation: code_invites_check_access_retrieve
        enabled: false
    code-invites-redeem-create:
        operation: code_invites_redeem_create
        enabled: false
    code-sandbox-pricing-list:
        operation: code_sandbox_pricing_list
        enabled: false
    desktop-access-retrieve:
        operation: desktop_access_retrieve
        enabled: false
    desktop-beta-terms-create:
        operation: desktop_beta_terms_create
        enabled: false
    desktop-beta-terms-list:
        operation: desktop_beta_terms_list
        enabled: false
    loop-channel-instructions-retrieve:
        operation: task_channels_instructions_retrieve
        enabled: true
        scopes:
            - task:read
            - loop_context_internal:write
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: Read fallback loop context
        description: Read legacy channel context when an unattended loop cannot access an initialized context wiki.
        param_overrides:
            id:
                description: ID of the loop's context channel.
    loop-channel-instructions-update:
        operation: task_channels_instructions_update
        enabled: true
        scopes:
            - task:write
            - loop_context_internal:write
        annotations:
            readOnly: false
            destructive: true
            idempotent: false
        title: Update fallback loop context
        description: Update legacy channel context when an unattended loop cannot access an initialized context wiki.
        param_overrides:
            id:
                description: ID of the loop's context channel.
            base_version:
                input_schema: ChannelInstructionsBaseVersionSchema
    loops-create:
        operation: loops_create
        enabled: true
        scopes:
            - loop:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        title: Create loop
        description: >
            Create a new loop: a named, cloud-executed agent automation that runs on a schedule, a GitHub event, or an
            authenticated API call. Set `instructions` (the prompt delivered to the agent on every run),
            `runtime_adapter`/`model`/`reasoning_effort`, `repositories` (at most 1, may be empty for a connector-only
            loop), `visibility` (`personal` or `team`), `behaviors` (PR creation, CI watch, auto-fix) and `triggers`.
        feature_flag: loops
        confirmed_action:
            message: >
                About to create the loop '{name}', a persistent automation that will run unattended with your GitHub and
                connector access whenever its triggers fire. Reply 'confirm' to create it.
            action_label: create loop
    loops-destroy:
        operation: loops_destroy
        enabled: true
        scopes:
            - loop:write
        annotations:
            readOnly: false
            destructive: true
            idempotent: true
        title: Delete loop
        description: >
            Soft-delete a loop and pause every trigger's schedule so it stops firing. Only the loop owner or a project
            admin can delete a loop.
        feature_flag: loops
    loops-list:
        operation: loops_list
        enabled: true
        scopes:
            - loop:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        list: true
        title: List loops
        description: >
            List loops visible to the current user in the project: personal loops the user owns plus every team-visible
            loop. Returns loop config, trigger summaries, and run bookkeeping (`last_run_at`, `last_run_status`,
            `consecutive_failures`).
        feature_flag: loops
    loops-partial-update:
        operation: loops_partial_update
        enabled: true
        scopes:
            - loop:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        title: Update loop
        description: >
            Update an existing loop's config. On a team loop, identity-bearing fields (`instructions`, `repositories`,
            `connectors`, `behaviors`, `triggers`) are editable only by the current owner: editing them as another
            member takes ownership and re-validates repositories and connectors against that member's own access.
            Editing a loop never affects its in-flight or queued runs; every run snapshots its config at fire time.
        feature_flag: loops
    loops-preview-create:
        operation: loops_preview_create
        enabled: true
        scopes:
            - loop:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: Preview a loop fire
        description: >
            Dry-run a loop: render the assembled instructions and trigger context for a sample payload (or a synthetic
            schedule fire when omitted) without creating a task, run, or any other side effect. Use it to check a loop's
            prompt before enabling it.
        feature_flag: loops
    loops-retrieve:
        operation: loops_retrieve
        enabled: true
        scopes:
            - loop:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        enrich_url: '{id}'
        title: Get loop
        description: >
            Get a specific loop by ID, including its full config (instructions, model, repositories, triggers,
            behaviors, connectors, notifications) and run bookkeeping.
        feature_flag: loops
    loops-run-create:
        operation: loops_run_create
        enabled: true
        scopes:
            - loop:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        title: Manually run a loop
        description: >
            Manually fire a loop right now, outside its configured triggers. Creates a fresh task run using the loop's
            current config snapshot and returns it. Subject to the same usage-gate, overlap policy and rate limits as
            trigger-fired runs.
        feature_flag: loops
    loops-runs-retrieve:
        operation: loops_runs_retrieve
        enabled: true
        scopes:
            - loop:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        enrich_url: '{id}/runs'
        list: true
        title: List loop runs
        description: >
            List a loop's run history, newest first, cursor-paginated. Each entry carries the run's status, branch,
            error message and output (including any PR URL), so an agent can check whether a loop's runs succeeded and
            what they produced.
        feature_flag: loops
    loops-skill-bundles-update:
        operation: loops_skill_bundles_update
        enabled: false
