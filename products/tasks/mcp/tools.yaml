    tasks-create:
        operation: tasks_create
        enabled: true
        scopes:
            - task:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        enrich_url: '{id}'
        title: Create task
        description: >
            Create an agent task in the current project — a unit of work an AI agent picks up and actions, such as
            investigating an inbox report, fixing an error, or opening a pull request. `description` is the prompt
            handed to the agent, so make it specific and actionable. Pass `repository` in `organization/repo` format for
            code tasks so the agent knows where to work; omit it for investigation-only tasks. This creates the task
            record only — it does not start the agent. Returns the created task including its URL; open that URL to
            start the run. Requires the calling token's organization to have Tasks access enabled.
        include_params:
            - title
            - description
            - repository
        param_overrides:
            description:
                description: >
                    The task for the agent to carry out, written as a direct prompt (e.g. "Investigate the spike in
                    $exception events on the checkout page and open a PR with a fix"). Passed verbatim to the agent as
                    its instructions, so be specific.
                required: true
        feature_flag: tasks
        response:
            include:
                - id
                - task_number
                - title
                - description
                - origin_product
                - repository
                - internal
                - created_at
                - updated_at
    tasks-destroy:
        operation: tasks_destroy
        enabled: false
    tasks-handoff-create:
        operation: tasks_handoff_create
        enabled: false
    tasks-list:
        operation: tasks_list
        enabled: true
        scopes:
            - task:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        enrich_url: '{id}'
        list: true
        title: Search and list tasks
        description: >
            Search agent tasks before starting related work. Use `search` to match task titles and descriptions, and
            `channel` to limit results to the current space. The results identify who created each task and whether its
            latest run is active. Supports additional filtering by status, repository, creator, origin product, and
            archived or internal state. Requires the calling token's organization to have Tasks access enabled.
        feature_flag: tasks
        response:
            include:
                - id
                - task_number
                - title
                - description
                - origin_product
                - repository
                - internal
                - channel
                - created_by.first_name
                - created_by.last_name
