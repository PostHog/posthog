[package]
name = "hogs"
version = "0.0.1"
edition = "2024"
publish = false
description = "Desktop chat app for PostHog hogs, the persistent agents you message like contacts."

# Standalone crate: it builds on its own toolchain and is not part of the repo's rust/ workspace.
[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
gpui-kit = "0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
urlencoding = "2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
opt-level = 1
