# MCP tool definitions. Tools are opt-in: an operation is exposed only when it has an entry here.
# List operations without an entry: pnpm --filter=@posthog/mcp run scaffold-yaml -- --candidates --product hogs
# Add one: pnpm --filter=@posthog/mcp run scaffold-yaml -- --add <operationId> --product hogs
# To keep an operation off on purpose, set enabled: false and give a disabled_reason.
category: Hogs
feature: hogs
url_prefix: /
ui_apps: {}
tools:
    hog-say:
        operation: hogs_say_create
        enabled: true
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        title: Message your owner
        description: >
            For hogs only. Send a chat message to your owner. This is the only way anything you do reaches them:
            they never see your reasoning, tool calls or final answer. Send one short message with the conclusion
            first. Stay silent when there is nothing they need to know or decide.
    hog-tell:
        operation: hogs_tell_create
        enabled: true
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        title: Send a note to another hog
        description: >
            For hogs only. Send a note from you to another hog owned by the same person. The other hog wakes
            and reads it. Use it to hand over something that belongs to their responsibility. Find hog IDs
            with hogs-list. The owner does not see these notes.
    hog-done:
        operation: hogs_done_create
        enabled: true
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        title: Stop working
        description: >
            For hogs only. Say that you have stopped working for now. Call it last on every wake, whether or
            not you messaged your owner, so your chat stops showing you as working.
    hog-update:
        operation: hogs_partial_update
        enabled: true
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        title: Update a hog
        description: >
            Update a hog. A hog calls this on itself to save its responsibility (its charter), to replace its
            memory (notes for its future self, since its sandbox does not outlive a wake), or to set its status
            to active once it has a charter.
        exclude_params:
            - mcp_installation_ids
    hogs-list:
        operation: hogs_list
        enabled: true
        title: List hogs
        description: >
            List the hogs (persistent agents) the current person runs, with each one's responsibility and
            status. A hog uses it to find which other hog owns an area before sending a note with hog-tell.
    hog-schedule-create:
        operation: hogs_schedules_create_create
        enabled: true
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        title: Schedule a future wake
        description: >
            For hogs only. Schedule yourself to wake later. Set run_at for a single wake or cron_expression
            (5 fields, UTC, at most every 15 minutes) for a repeating one, never both. The prompt is a note to
            your future self about what to check. Call hog-schedules-list first so you never add a duplicate.
    hog-schedules-list:
        operation: hogs_schedules_retrieve
        enabled: true
        title: List a hog's schedules
        description: List the schedules that will wake a hog, with the next time each one fires.
    hog-schedule-delete:
        operation: hogs_schedules_delete_create
        enabled: true
        annotations:
            readOnly: false
            destructive: true
            idempotent: true
        title: Delete a schedule
        description: For hogs only. Delete one of your schedules so it stops waking you.
    hog-report:
        operation: hogs_reports_create_create
        enabled: true
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        title: Publish a report
        description: >
            For hogs only. Publish a finding as a card in your owner's chat: something they should act on, written so
            they can decide in ten seconds. One finding per report. Call hog-reports-list first so you never
            publish what is already open or what they dismissed. Publishing the same title twice returns the
            first report.
    hog-reports-list:
        operation: hogs_reports_retrieve
        enabled: true
        title: List a hog's reports
        description: >
            List the reports a hog has published, open ones first, with what the owner did with each
            (resolved or dismissed, and why).
    hog-propose-action:
        operation: hogs_actions_propose_create
        enabled: true
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        title: Ask before acting outside PostHog
        description: >
            For hogs only. Call this before you send, post, create, change or delete anything outside PostHog.
            Read the status it returns. approved: do it now, then call hog-action-done. pending: your owner
            has been asked, so do not do it, call hog-done and stop. denied: do not do it.
    hog-action-done:
        operation: hogs_actions_done_create
        enabled: true
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        title: Record a completed action
        description: >
            For hogs only. Record that you carried out an approved action, and what happened. It fails for an
            action that was not approved.
    hog-actions-list:
        operation: hogs_actions_retrieve
        enabled: true
        title: List a hog's proposed actions
        description: List the actions a hog has proposed, newest first, with whether each was approved or denied.
    hog-trigger-create:
        operation: hogs_triggers_create_create
        enabled: true
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        title: Create an event trigger
        description: >
            For hogs only. Create a trigger: an address that wakes you when an outside system posts an event
            to it. The instructions are a note to your future self about what to check when one arrives. Give
            your owner the fire_path it returns so they can point a webhook or a workflow step at it. Call
            hog-triggers-list first so you never add a duplicate.
    hog-triggers-list:
        operation: hogs_triggers_retrieve
        enabled: true
        title: List a hog's triggers
        description: List the triggers that wake a hog on an outside event, with how often each has fired.
    hog-trigger-delete:
        operation: hogs_triggers_delete_create
        enabled: true
        annotations:
            readOnly: false
            destructive: true
            idempotent: true
        title: Delete a trigger
        description: For hogs only. Delete one of your triggers so it stops waking you.
