# MCP tool definitions. Tools are opt-in: an operation is exposed only when it has an entry here.
# List operations without an entry: pnpm --filter=@posthog/mcp run scaffold-yaml -- --candidates --product actions
# Add one: pnpm --filter=@posthog/mcp run scaffold-yaml -- --add <operationId> --product actions
# To keep an operation off on purpose, set enabled: false and give a disabled_reason.
category: Actions
feature: actions
url_prefix: /data-management/actions
ui_apps:
    action:
        type: detail
        view_prop: action
    action-list:
        type: list
        detail_tool: action-get
tools:
    action-create:
        operation: actions_create
        enabled: true
        scopes:
            - action:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        enrich_url: '{id}'
        title: Create action
        description: >
            Create a new action in the project. Actions define reusable event triggers based on page views, clicks, form
            submissions, or custom events. Each action can have multiple steps (OR conditions). Use actions to create
            composite events for insights and funnels. Example: Create a 'Sign Up Click' action with steps matching
            button clicks on the signup page.
        exclude_params:
            - deleted
            - is_calculating
            - bytecode_error
            - creation_context
            - last_calculated_at
        param_overrides:
            name:
                description: Name of the action (must be unique within the project)
        ui_app: action
    action-delete:
        operation: actions_destroy
        enabled: true
        scopes:
            - action:write
        annotations:
            readOnly: false
            destructive: true
            idempotent: false
        title: Delete action
        description: >
            Delete an action by ID (soft delete - marks as deleted). The action will no longer appear in lists but
            historical data is preserved.
        soft_delete: true
    action-get:
        operation: actions_retrieve
        enabled: true
        scopes:
            - action:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        enrich_url: '{id}'
        title: Get action
        description: >
            Get a specific action by ID. Returns the action configuration including all steps and their trigger
            conditions.
        param_overrides:
            id:
                cast: string-int
        ui_app: action
    action-update:
        operation: actions_partial_update
        enabled: true
        scopes:
            - action:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        enrich_url: '{id}'
        title: Update action
        description: |
            Update an existing action by ID. Can update name, description, steps, tags, and Slack notification settings.
        exclude_params:
            - deleted
            - is_calculating
            - bytecode_error
            - creation_context
            - last_calculated_at
        ui_app: action
    actions-get-all:
        operation: actions_list
        enabled: true
        scopes:
            - action:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        enrich_url: '{id}'
        list: true
        title: Get all actions
        description: >
            Get actions in the project. Actions are reusable event definitions that can combine multiple trigger
            conditions (page views, clicks, form submissions) into a single trackable event for use in insights and
            funnels. Supports pagination with `limit` and `offset`, case-insensitive name filtering with `search`,
            filtering by creator with `created_by` (comma-separated user ids), filtering by tag with `tags` (a
            JSON-encoded array of tag names), and sorting with `ordering`. Projects can have thousands of actions, so
            pass `limit` plus the relevant filters rather than fetching every action at once.
        ui_app: action-list
