name: Session recording
model_file: ../../generated/model.fga
tuple_files:
    - ../fixtures.yaml
tuples:
    - { user: 'project:project', relation: project, object: 'session_recording:recording' }
    - { user: 'resource:insights', relation: resource, object: 'session_recording:recording' }
    - { user: 'access_policy:object', relation: policy, object: 'session_recording:recording' }
    - { user: 'organization_member:creator#user', relation: creator, object: 'session_recording:recording' }
    - { user: 'share_link:shared', relation: shared_viewer, object: 'session_recording:recording' }
tests:
    - name: Members and share links have separate permissions
      check:
          - user: user:member
            object: session_recording:recording
            assertions: { can_view: true, can_edit: true, can_delete: true, can_share: true, can_manage_access: false }
          - user: user:creator
            object: session_recording:recording
            assertions: { can_manage_access: true }
          - user: share_link:shared
            object: session_recording:recording
            assertions:
                { can_view: true, can_edit: false, can_delete: false, can_share: false, can_manage_access: false }
          - users: [user:outsider, share_link:other]
            object: session_recording:recording
            assertions:
                { can_view: false, can_edit: false, can_delete: false, can_share: false, can_manage_access: false }
