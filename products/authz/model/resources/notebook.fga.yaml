name: Notebook
model_file: ../../generated/model.fga
tuple_files:
    - ../fixtures.yaml
tuples:
    - { user: 'project:project', relation: project, object: 'notebook:notebook' }
    - { user: 'resource:insights', relation: resource, object: 'notebook:notebook' }
    - { user: 'access_policy:object', relation: policy, object: 'notebook:notebook' }
    - { user: 'organization_member:creator#user', relation: creator, object: 'notebook:notebook' }
    - { user: 'share_link:shared', relation: shared_viewer, object: 'notebook:notebook' }
tests:
    - name: Members and share links have separate permissions
      check:
          - user: user:member
            object: notebook:notebook
            assertions: { can_view: true, can_edit: true, can_delete: true, can_share: true, can_manage_access: false }
          - user: user:creator
            object: notebook:notebook
            assertions: { can_manage_access: true }
          - user: share_link:shared
            object: notebook:notebook
            assertions:
                { can_view: true, can_edit: false, can_delete: false, can_share: false, can_manage_access: false }
          - users: [user:outsider, share_link:other]
            object: notebook:notebook
            assertions:
                { can_view: false, can_edit: false, can_delete: false, can_share: false, can_manage_access: false }

    - name: A member rule lets a guest view a notebook, and only view it
      tuples:
          - { user: 'organization_member:guest#user', relation: member_editor, object: 'access_policy:object' }
      check:
          - user: user:guest
            object: notebook:notebook
            assertions:
                { can_view: true, can_edit: false, can_delete: false, can_share: false, can_manage_access: false }
          - user: user:guest
            object: notebook:other
            assertions: { can_view: false }
