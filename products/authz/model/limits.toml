# Agreed limits for the OpenFGA model. The model checks fail when the model and these numbers or lists differ,
# so every change to the model's size or its rule exceptions shows in this file during review.
# Lower a number or remove a name when the model shrinks. Raise one only after a reviewer agrees to it.

# Relations in each hand-written type in core.fga. A new core type needs an entry here.
[core_relations]
user = 5
organization = 20
organization_member = 9
role = 7
project = 30
access_policy = 20
resource_category = 10

# Relations that a resource in resources.toml adds to the template or replaces.
# A resource without an entry must match the template exactly.
[resource_relations]
dashboard = 4
insight = 4

# Resource relations that use "but not", "and", or a type:* wildcard.
# The template holds the shared precedence rules, so a resource should not add rules of its own.
[complex_resource_relations]
dashboard = ["can_edit", "legacy_editor", "restricted"]
insight = ["can_edit", "has_dashboard", "legacy_editor"]

# Permissions with no matching Action in products/authz/backend/facade/enums.py.
# App code cannot reach these through the SDK.
[unmapped_permissions]
organization = [
    "can_create_project",
    "can_create_role",
    "can_invite_admin",
    "can_invite_member",
    "can_invite_owner",
    "can_list_members",
]
organization_member = ["can_change_level", "can_make_owner"]
