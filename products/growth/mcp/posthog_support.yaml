# MCP tool definitions. Tools are opt-in: an operation is exposed only when it has an entry here.
# List operations without an entry: pnpm --filter=@posthog/mcp run scaffold-yaml -- --candidates --product growth
# Add one: pnpm --filter=@posthog/mcp run scaffold-yaml -- --add <operationId> --product growth --file ../../products/growth/mcp/posthog_support.yaml
# To keep an operation off on purpose, set enabled: false and give a disabled_reason.
category: PostHog support
feature: posthog_support
url_prefix: /
ui_apps: {}
tools:
    posthog-support-draft-create:
        operation: posthog_support_drafts_create
        enabled: true
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        title: Draft a PostHog support ticket
        description: >
            Draft a ticket to PostHog's human support team for the person to approve. It sends nothing. Only for
            privacy, security, compliance, data retention, data deletion, DPA, BAA and billing, and only for what the
            docs don't answer, or when the person disagrees that they do. Never for login problems. For anything else,
            don't call it: tell the person to ask in the support widget in the right-hand sidebar of PostHog, or at
            https://posthog.com/forum when their plan doesn't include support (it's public, so no personal data or
            secrets). Load the writing-posthog-support-tickets skill first, and draft only after you checked the docs
            and did the lookups it asks for. Each field is one part of the ticket. Afterwards, show the person the full
            message in the chat and follow next_step: when can_send is true, ask whether to send it, and otherwise give
            them what next_step says.
    posthog-support-draft-send:
        operation: posthog_support_drafts_send_create
        enabled: true
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        title: Send a drafted PostHog support ticket
        description: >
            Send a draft from posthog-support-draft-create to PostHog's human support team, for the person. Call it only
            after the person saw the full ticket in this conversation and said yes to sending it, such as "please post
            it". Never call it on your own judgment. If they ask for a change, draft it again, show the new version, and
            wait for a yes to that one. A draft becomes at most one ticket: calling again returns the same ticket.
            Afterwards, first give them the ticket number when the response has one, and tell them to log in and watch
            the support panel in the right-hand sidebar of PostHog for replies, at https://app.posthog.com/home#panel=support.
