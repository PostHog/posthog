{% extends "admin/base_site.html" %}
{% block content %}
    <p>Copy this signing secret now. It will not be shown again.</p>
    <p>In the <a href="{{ workflow_url }}">Workflow</a> HTTP action, set these values:</p>
    <dl>
        <dt>
            <label for="key-id">X-PostHog-Audit-Key header</label>
        </dt>
        <dd>
            <input id="key-id" type="text" readonly value="{{ key_id }}" size="40">
        </dd>
        <dt>
            <label for="signing-secret">Signing secret</label>
        </dt>
        <dd>
            <input id="signing-secret"
                   type="text"
                   readonly
                   value="{{ signing_secret }}"
                   size="54"
                   autocomplete="off">
        </dd>
    </dl>
    <p>Publish the Workflow changes and verify a request succeeds before disabling the old credential.</p>
    <p><a href="{{ credential_url }}">Manage credential</a></p>
{% endblock %}
