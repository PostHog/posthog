# MCP tool definitions. Tools are opt-in: an operation is exposed only when it has an entry here.
# List operations without an entry: pnpm --filter=@posthog/mcp run scaffold-yaml -- --candidates --product review_hog
# Add one: pnpm --filter=@posthog/mcp run scaffold-yaml -- --add <operationId> --product review_hog
# To keep an operation off on purpose, set enabled: false and give a disabled_reason.
category: ReviewHog
feature: review_hog
url_prefix: /code-review
ui_apps: {}
tools:
    review-hog-reviews-get:
        operation: review_hog_reviews_retrieve
        enabled: true
        scopes:
            - review_hog:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: Get a ReviewHog review
        description: >
            Fetch one completed ReviewHog review by `id` (from `review-hog-reviews-list`), including the latest turn's
            validated `findings` (each with file, line ranges, priority, and the suggested fix), the
            `dismissed_findings` the validator dropped and why, and the `report_markdown` published to the PR. A first
            review still in flight has no detail yet — poll `review-hog-reviews-list` until it completes.
        feature_flag: review-hog
    review-hog-reviews-list:
        operation: review_hog_reviews_list
        enabled: true
        scopes:
            - review_hog:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        list: true
        title: List ReviewHog reviews
        description: >
            List recent ReviewHog reviews on this project — use it to poll a review's status. Running reviews come
            first, each with `in_progress: true` and a `progress` object (the in-flight turn's `review_stage` plus
            `done`/`total` counters); completed reviews follow, newest first, with their finding counts by priority
            (`must_fix_count`, `should_fix_count`, `consider_count`) and whether they were `published`. Each row's `id`
            opens the full review via `review-hog-reviews-get`. Defaults to the requesting user's reviews; pass
            `scope=everyone` for every review on the project, and `limit` to widen the page.
        feature_flag: review-hog
    review-hog-reviews-trigger:
        operation: review_hog_reviews_trigger_create
        enabled: true
        scopes:
            - review_hog:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        title: Trigger a ReviewHog review
        description: >
            Start a ReviewHog run on a pull request. Pass the PR as `pr_url` (e.g.
            `https://github.com/PostHog/posthog/pull/123`); the repository must be accessible to the project's GitHub
            App installation. `run_mode` picks the variant: `review` (the default) reviews the PR, publishes the review
            to it, and then chains the comment-resolution stage when the requesting user's `resolve_comments` setting is
            on; `review_only` reviews without resolving; `resolve_only` skips the review and only works the PR's
            existing unresolved review threads; `flash` reviews and publishes on a lower-cost model, and never resolves
            comments or pushes fixes. IMPORTANT: resolve-capable runs write to the PR itself. They may push signed fix
            commits to the PR's branch, reply to review threads, and resolve bot-authored threads. Nothing is deleted
            and the commits are plain appends, but the actions are public to everyone on the PR. Non-blocking: returns a
            `workflow_id` and `status` of `started` while the run executes. If the PR's current commit already has a
            published review it returns `already_reviewed` without starting a run (`resolve_only` skips that check,
            since resolving is useful exactly then), and triggering a PR whose review is already running joins the
            in-flight run. Poll progress with `review-hog-reviews-list` and read the finished findings with
            `review-hog-reviews-get`.
        feature_flag: review-hog
