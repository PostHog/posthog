# MCP tool definitions. Tools are opt-in: an operation is exposed only when it has an entry here.
# List operations without an entry: pnpm --filter=@posthog/mcp run scaffold-yaml -- --candidates --product cdp
# Add one: pnpm --filter=@posthog/mcp run scaffold-yaml -- --add <operationId> --product cdp
# To keep an operation off on purpose, set enabled: false and give a disabled_reason.
category: Function templates
feature: hog_function_templates
url_prefix: /pipeline/new
ui_apps: {}
tools:
    cdp-function-templates-list:
        operation: hog_function_templates_list
        enabled: true
        scopes:
            - hog_function:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        list: true
        title: List function templates
        description: >
            List available function templates. Templates are pre-built function configurations for common integrations
            (Slack, webhooks, email, etc.) and transformations (GeoIP, etc.). Filter by type (destination,
            site_destination, site_app, transformation, etc.) via the 'type' query parameter. Results are sorted by
            popularity (number of active functions using each template).
        response:
            include:
                - id
                - name
                - description
                - type
                - status
                - category
                - free
                - icon_url
                - code_language
    cdp-function-templates-retrieve:
        operation: hog_function_templates_retrieve
        enabled: true
        scopes:
            - hog_function:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: Get function template
        description: >
            Get a specific function template by its template ID (e.g. 'template-slack', 'template-geoip'). Returns the
            full template including source code, inputs schema, default filters, and mapping templates. Use this to
            understand what inputs a template requires before creating a function from it.
