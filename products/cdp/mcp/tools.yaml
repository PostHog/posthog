# MCP tool definitions. Tools are opt-in: an operation is exposed only when it has an entry here.
# List operations without an entry: pnpm --filter=@posthog/mcp run scaffold-yaml -- --candidates --product cdp
# Add one: pnpm --filter=@posthog/mcp run scaffold-yaml -- --add <operationId> --product cdp
# To keep an operation off on purpose, set enabled: false and give a disabled_reason.
category: MCP events
feature: cdp
url_prefix: /data-management/destinations
ui_apps: {}
tools:
    mcp-events-preview:
        operation: mcp_event_subscriptions_preview
        enabled: true
        scopes:
            - query:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: Preview MCP event filters
        description: >
            Validate captured-event subscription filters and show up to five matching events from the past seven days.
            Use this before subscribing to posthog.event_captured. Select the intended project first, then pass its
            project_id and the same normal destination filters you will use in events/subscribe. These examples help
            check event names and property conditions; they are not a count or a forecast of delivery volume.
        param_overrides:
            filters:
                input_schema: McpEventFiltersSchema
        feature_flag: mcp-events
