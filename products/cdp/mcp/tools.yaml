category: MCP events
feature: cdp
url_prefix: /pipeline/destinations
tools:
    mcp-events-preview:
        operation: mcp_event_subscriptions_preview
        enabled: true
        feature_flag: mcp-events
        param_overrides:
            filters:
                input_schema: McpEventFiltersSchema
        scopes:
            - query:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: Preview MCP event filters
        description: >
            Validate captured-event subscription filters and show up to five matching events from the past seven days.
            Use this before subscribing to posthog.event_captured. Select the intended project first, then pass its
            project_id and the same normal destination filters you will use in events/subscribe. These examples
            help check event names and property conditions; they are not a count or a forecast of delivery volume.
