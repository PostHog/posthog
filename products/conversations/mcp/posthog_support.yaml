# MCP tool definitions. Tools are opt-in: an operation is exposed only when it has an entry here.
# List operations without an entry: pnpm --filter=@posthog/mcp run scaffold-yaml -- --candidates --product conversations
# Add one: pnpm --filter=@posthog/mcp run scaffold-yaml -- --add <operationId> --product conversations --file ../../products/conversations/mcp/posthog_support.yaml
# To keep an operation off on purpose, set enabled: false and give a disabled_reason.
category: PostHog support
feature: conversations
url_prefix: /my-tickets
ui_apps: {}
tools:
    posthog-support-draft-create:
        operation: posthog_support_drafts_create
        enabled: true
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        title: Draft a PostHog support ticket
        description: >
            Draft a ticket to PostHog's human support team for the person to approve. It sends nothing. Load the
            writing-posthog-support-tickets skill first, and draft only after you checked the docs and did the lookups
            it asks for. Each field is one part of the ticket. Afterwards, show the person the full message and follow
            next_step: when can_send is true, ask whether to send it, and otherwise give them what next_step says.
        feature_flag: mcp-posthog-support-tickets
    posthog-support-draft-send:
        operation: posthog_support_drafts_send_create
        enabled: true
        annotations:
            readOnly: false
            destructive: false
            idempotent: true
        title: Send a drafted PostHog support ticket
        description: >
            Send a draft from posthog-support-draft-create to PostHog's human support team, as the person. Call it only
            after the person saw the full ticket in this conversation and said yes to sending it, such as "please post
            it". Never call it on your own judgment, and never after they asked to edit it first. A draft becomes at
            most one ticket: calling again returns the same ticket. Afterwards, give them the ticket number and
            tickets_url.
        feature_flag: mcp-posthog-support-tickets
