[tool.uv]
required-version = ">=0.13.4"
add-bounds = "major"
exclude-newer = "7 days"
exclude-newer-package = { brotli = false, certifi = false, hogql-parser = false, hogql-parser-rs = false, deltalite = false, posthoganalytics = false, pixelhog = false, hoglint = false, django = false, modal = false, pydantic = false, pydantic-core = false, posthog-hogland = false, google-ads = false, grpcio = false }
# The SDK release bot rewrites the dependency spec on every release, so this constraint
# is what stops a new major from landing by accident. Raise it in the migration PR that
# moves the call sites to the next major.
constraint-dependencies = ["posthoganalytics<9"]
# sentiment takes torch from PyPI with the CUDA libraries, inbox-ranking takes the CPU-only build.
conflicts = [[{ group = "sentiment" }, { group = "inbox-ranking" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = ["tools/hogli", "packages/owners-yaml", "packages/personhog-proto"]

[tool.uv.sources]
hogli = { workspace = true }
owners-yaml = { workspace = true }
personhog-proto = { workspace = true }
infi-clickhouse-orm = { git = "https://github.com/PostHog/infi.clickhouse_orm", rev = "fa20b806e32cf748dfee3545d8926b9c36aff789" }
# pytest-split: pinned to PostHog's fork (immutable tag) for the order-preserving
# optimal_chunks split. Fork: PostHog/pytest-split (of jerry-git/pytest-split).
# Base future upstream rebases on the pinned tag so local fixes survive.
# Cut the next v0.11.0-posthog.N tag and bump this pin.
pytest-split = { git = "https://github.com/PostHog/pytest-split", tag = "v0.11.0-posthog.13" }
torch = [{ index = "pytorch-cpu", group = "inbox-ranking" }]

# These releases cap Django below 6.1 only because 6.1 was untested when they shipped. Upstream main
# raises the cap without library code changes. Drop each block once a release lifts the cap.
[[tool.uv.dependency-metadata]]
name = "django-prometheus"
version = "2.5.0"
requires-dist = ["Django>=4.2,!=5.0.*", "prometheus-client>=0.7"]

[[tool.uv.dependency-metadata]]
name = "django-scim2"
version = "0.23.0"
requires-dist = ["django>=5.2.8", "pygments>=2.20.0,<3.0.0", "scim2-filter-parser>=0.5.0"]

# xgboost's Linux wheel declares nvidia-nccl-cu13 for multi-GPU training. We use xgboost on
# CPU, so drop it to keep the wheel out of the image.
[[tool.uv.dependency-metadata]]
name = "xgboost"
version = "3.2.0"
requires-dist = ["numpy", "scipy"]


[tool.isort]
profile = "black"

[tool.ruff]
line-length = 120
# Pinned apart from requires-python. Raising it to py314 makes ruff format drop the parentheses
# in `except (A, B):` (PEP 758) across the repo, and makes UP037 flag every quoted annotation.
target-version = "py313"
force-exclude = true
exclude = [
    ".git",
    "./.semgrep",
    "./nodejs/node_modules/",
    "./plugins/node_modules/",
    "./env",
    "./posthog/hogql/grammar",
    "products/*/skills/*/scripts",
    # imported desktop app; Biome-linted by its own desktop-* CI
    "products/desktop",
]

[tool.ruff.lint]
ignore = [
    "B017",  # ~38: assertRaises(Exception) too broad
    "B904",  # ~488: raise without from in except
    "B905",  # ~153: zip() without strict=
    "C901",  # ~527: function too complex
    "E501",  # ~4697: line too long
    "E722",  # ~62: bare except
    "E731",  # ~185: lambda assignment
    "F541",  # ~1139: f-string missing placeholders
    "UP007",  # ~377: Union[X,Y] → X | Y (auto-fixable)
    "UP032",  # ~175: use f-string (auto-fixable)
    "UP045",  # ~3064: Optional[X] → X | None (auto-fixable)
    "UP046",  # ~39: generic class → PEP 695 (unsafe)
    "UP047",  # ~37: generic func → PEP 695 (unsafe)
    "UP042",  # ~28: str+Enum → StrEnum (unsafe: changes str()/format() output)
]
select = [
    "B",
    "C4",
    "C9",
    "DJ012",
    "E",
    "F",
    "I",
    "PLC0415",
    "RUF005",
    "RUF013",
    "RUF015",
    "RUF019",
    "T100",
    "T2",
    "TID253",
    "TRY201",
    "TRY400",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
# protoc's _pb2.py files import dependencies for the side effect of loading their descriptors
# into the pool before AddSerializedFile(). ruff must not strip or move those imports.
"packages/personhog-proto/**/*_pb2.py" = ["F401", "E402"]
# deltalite's test suite bootstraps its harness/planner via sys.path (the package is a
# maturin-built extension living under rust/, not part of the Django app), so imports
# are necessarily lazy / post-path-insert (PLC0415, E402); the planner's small CLI
# prints its report (T201).
"rust/deltalite/python/**" = ["PLC0415", "E402", "T201"]
# Django settings aggregator: star imports are how settings modules merge into one namespace.
# Not portable to explicit re-exports without losing the settings-loading semantics.
"posthog/settings/**" = ["F403", "F405"]

# PLC0415 exemptions. products/ and services/llm-gateway/ have their own ruff configs.
# Run `ruff check <path> --select PLC0415 --statistics` before removing an entry.
".github/**" = ["PLC0415"]
"bin/**" = ["PLC0415"]
"common/**" = ["PLC0415"]
"ee/**" = ["PLC0415"]
"manage.py" = ["PLC0415"]
"posthog/**" = ["PLC0415"]
"scripts/**" = ["PLC0415"]
"services/stripe-mock/**" = ["PLC0415"]
"tools/**" = ["PLC0415"]

[tool.ruff.lint.flake8-tidy-imports]
# Heavy SDKs that noticeably slow startup. They must be imported lazily (inside the
# function that uses them), not at module top, so they stay off the Django app-load path.
# Only modules with a single, already-lazy call site are listed — vendor source/destination
# leaf modules legitimately import their own SDK at module level and are loaded on demand.
banned-module-level-imports = ["elevenlabs", "matplotlib", "trafilatura"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
length-sort-straight = true
split-on-trailing-comma = false
section-order = [
    "future",
    "standard-library",
    "testing",
    "django",
    "third-party",
    "posthog.schema",
    "posthog.hogql",
    "posthog",
    "products",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"django" = ["django"] # Group all Django imports into a separate section.
"testing" = [ # Group all testing imports into a separate section.
    "pytest",
    "time_machine",
    "unittest",
    "posthog.test.base",
]
# Separate groups for our own stuff
"posthog.schema" = ["posthog.schema"]
"posthog.hogql" = ["posthog.hogql"]
"posthog" = ["posthog"]
"products" = ["products"]

[tool.djlint]
profile = "django"
extension = "html"
indent = 4
# Formatting covers every Django template; linting is scoped to the email ones, so these
# exclusions are read against those. H021 inline styles and H023 entity references are how
# HTML email has to be written, since mail clients strip stylesheets and render bare
# characters inconsistently. H016 title and H030 meta description are page rules that mean
# nothing in an email.
ignore = "H021,H023,H016,H030"

[tool.dagster]
python_version = "3.14"

[tool.mypy]
python_version = "3.14"
# CI runs in parallel mode, which forces the native parser. Setting it here keeps sequential
# runs (local mypy, dmypy, reports) on the same parser as CI. Do not set num_workers here:
# parallel mode breaks dmypy and report flags, so CI sets MYPY_NUM_WORKERS instead.
native_parser = true
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
    "pydantic.mypy",
]
strict_optional = true
no_implicit_optional = true
warn_unused_ignores = true
check_untyped_defs = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
exclude_gitignore = true
# conftest.py: the root pytest bootstrap collides with services/stripe-mock/tests/conftest.py
# (both resolve to top-level module "conftest")
# rust/deltalite/python: pytest suite for the maturin-built extension; nothing Django
# imports it and it has its own CI (ci-deltalite-python.yml).
# packages/owners-yaml: a standalone distribution that must build and run with no Django. This config
# loads the Django and DRF plugins and the app's settings, so it is the wrong checker for it. ty
# covers it repo-wide instead, and ci-python builds and exercises the wheel in an empty venv.
exclude = ["^(bin/.*|tools/.*|packages/owners-yaml/.*|packages/personhog-proto/.*|rust/deltalite/python/.*|products/desktop/.*|products/stamphog/packages/.*|products/[^/]+/skills/[^/]+/scripts/.*|gunicorn\\.config\\.py|manage\\.py|conftest\\.py)$"]

[[tool.mypy.overrides]]
module = "bin.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "posthog.hogql.grammar.*"
ignore_errors = true

# Profiling code from the nextgensquash tooling — pyinstrument/py-spy
# wrappers do dynamic method swaps that don't fit the static stubs.
[[tool.mypy.overrides]]
module = "posthog.management.migration_profiling.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "posthog.tasks.*"
disallow_untyped_defs = true
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "posthog.settings"

[tool.pyright]
venvPath = ".flox/cache"
venv = "venv"
pythonVersion = "3.14"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = [
    "bin/**",
    "manage.py",
    "posthog/hogql/grammar/**",
    "packages/personhog-proto/**",
    "posthog/schema.py",
    "posthog/schema_enums.py",
    "posthog/temporal/proxy_service/proto/**",
    # PEP 723 scripts with their own deps; mypy excludes these dirs too
    "products/*/skills/*/scripts/**",
    "products/stamphog/packages/**",
    "tools/**",
    "products/warehouse_sources/backend/temporal/data_imports/sources/generated_configs/**",
    "products/warehouse_sources/sources/*/_config.py",
    "rust/deltalite/python/**",
]

[tool.ty.rules]
# Import resolution - ty can't always find all modules/stubs
unresolved-import = "ignore"

# Django-related rules - ty doesn't support Django's metaprogramming yet
# See: https://github.com/astral-sh/ty/issues/291
unresolved-attribute = "ignore"  # Django model fields, relationships, auto-generated attributes
invalid-argument-type = "ignore"  # Django querysets, managers, form fields
unknown-argument = "ignore"  # Django kwargs, queryset filters, manager methods
invalid-base = "ignore"  # Django model metaclasses (e.g., models.Model)
missing-argument = "ignore"  # Django auto-generated __init__, managers
too-many-positional-arguments = "ignore"  # Django metaprogramming signatures

# Dual mypy+ty — mypy still runs, so its artifacts are legitimate
redundant-cast = "ignore"  # casts needed by mypy that ty resolves
unused-type-ignore-comment = "ignore"  # type: ignore comments required by mypy
unused-ignore-comment = "error"  # default is warn, which does not fail CI; error keeps stale ty: ignore directives out

# Flags guards on stub and TypedDict types that runtime data does not honor
# (billing JSON, posthoganalytics.api_key, untyped access-control callers)
redundant-condition = "ignore"

# Django lazy imports and settings indirection
possibly-missing-submodule = "ignore"

# DRF serializer pattern — validate/update/create overrides are idiomatic
invalid-method-override = "ignore"
invalid-attribute-override = "ignore"  # Django manager/field overrides (e.g. `objects`)

# Conditional base classes (e.g. EnterpriseEventQuery | EventQuery pattern)
unsupported-base = "ignore"

# Protobuf generated code + Django lazy references
unresolved-reference = "ignore"

# Third-party library overload stubs (Anthropic SDK, Django, re, etc.)
no-matching-overload = "ignore"

# Framework metaclass magic — ty can't resolve dynamic callables
call-top-callable = "ignore"
call-non-callable = "ignore"

# Django querysets typed as `object` — ty can't narrow through managers
not-iterable = "ignore"

# `in` operator on Django/framework `object` types
unsupported-operator = "ignore"

# Subscript on `object`/`None` from unresolved Django types
not-subscriptable = "ignore"

# mypy already catches deprecations; ty is a fast preflight, not the authority
deprecated = "ignore"

# ty disagrees with mypy on some existing code — baselined, not suppressed.
# These rules catch real bugs in new code, so they stay enabled.
# invalid-type-form is the exception: generated code + ty limitations on valid patterns.
invalid-type-form = "ignore"

[[tool.ty.overrides]]
# Scanner schemas are built with create_model at runtime, so every kwarg looks extra to ty
include = ["products/replay_vision/backend/tests/test_scanners.py"]

[tool.ty.overrides.rules]
pydantic-discarded-extra-argument = "ignore"
