services:
    clickhouse:
        image: ghcr.io/posthog/clickhouse-posthog:26.9.5.2-posthog-aca5bdabb92f
        ulimits:
            nofile:
                soft: 262144
                hard: 262144
        volumes:
            - ../../docker/clickhouse/user_defined_function.xml:/etc/clickhouse-server/user_defined_function.xml:ro
            - ../../posthog/user_scripts:/var/lib/clickhouse/user_scripts:ro
        healthcheck:
            test: ['CMD', 'clickhouse-client', '--query', 'SELECT 1']
            interval: 2s
            timeout: 5s
            retries: 15
