version: 1
owners: []
# Team slugs below are GitHub teams in this organization.
github_org: PostHog
# Automation that a team can redirect or silence under `notifications:`.
producers: [stamphog, visual_review]
# services/mcp generate-tools reads every YAML file in a product's mcp/ directory.
reserved_dirs: ['products/**/mcp/**']
# A product manifest already lists its owners, so it counts as an ownership file.
alias_files: [product.yaml]
# frontend/ runs the Jest suites of the product frontends, so their JUnit paths start from there.
codeowners:
    jest_root: frontend
    jest_root_tests: 'products/**/frontend/**'
    jest_root_packages: products
# Slack channel per team, declared once for the whole repo (root-only registry).
# A team only needs an entry where the derived '#<slug>' is wrong or missing; the
# other 22 slugs in use derive correctly and are deliberately absent.
teams:
    # GitHub team slugs that predate the 'team-' convention: the slug is right,
    # the channel just doesn't match it.
    ai-research:
        slack: '#team-ai-research'
        # The team keeps bot output out of its own channel, so automation posts here instead.
        notifications: '#bots-ai-research'
    batch-exports:
        slack: '#team-batch-exports'
    clickhouse:
        slack: '#team-clickhouse'
    conversations:
        slack: '#team-conversations'
        notifications: '#support-conversations'
    mcp-analytics:
        slack: '#team-mcp-analytics'
    platform-ux:
        slack: '#team-platform-ux'
    team-data-stack:
        slack: '#group-data-stack'
    # PostHog Desktop's channel kept the name it was created under.
    team-posthog-desktop:
        slack: '#team-desktop'
    # The derived '#team-replay' is right; the entry exists only to drop the daily
    # stamphog digest, which the team reads on the PRs themselves.
    team-replay:
        notifications:
            stamphog: false
rules:
    - match: Dockerfile.llm-analytics
      owners: team-ai-observability
    - match:
          - Dockerfile
          - 'docker-compose*.yml'
          - '.prettierrc'
          - '.test_quarantine.json'
          - hogli.yaml
          - tach.toml
          - CLAUDE.md
          - AGENTS.md
          - '/.coderabbit.yaml'
          - '/.greptile/'
          # Every owners.yaml routes to devex (unanchored: matches at any depth)
          # unless a nearer file or rule claims it — ownership-policy edits must
          # never go out for review unassigned.
          - owners.yaml
      owners: team-devex
    # Anchored: bare 'bin/' also matches Cargo's src/bin/, a crate's own binaries.
    - match:
          - '/bin/'
          - '/ee/bin/'
          - '/frontend/bin/'
          - '/nodejs/bin/'
          - '/rust/bin/'
      owners: team-devex
    - match: '/bin/inject_mcp_intents.py'
      owners: mcp-analytics
    - match: '/.agents/skills/manage-dashboard-widgets/'
      owners: team-product-analytics
    - match: '/.claude/'
      owners: team-devex
    - match: '/.claude/agents/ingestion/'
      owners: team-ingestion
    - match: '/bin/start-llm-gateway'
      owners: [team-devex, team-agent-infrastructure]
    - match: '/cli/'
      owners: team-error-tracking
    - match: '/docs/onboarding/ai-observability/'
      owners: team-ai-observability
    - match: '/docs/published/handbook/engineering/developing-locally.md'
      owners: team-devex
    - match:
          - '/frontend/src/lib/lemon-ui/'
          - '/frontend/src/lib/ui/'
      owners: platform-ux
    - match: '/nodejs/tests/'
      owners: team-ingestion
    - match: '/packages/quill/'
      owners: [platform-ux, '@sampennington']
    # The URL surface and the inbound webhook transport: shared plumbing every product
    # lands on, so a change here reaches further than the product that prompted it.
    - match:
          - '/docs/internal/url-routing.md'
          - '/posthog/api/__init__.py'
          - '/posthog/api/rest_router.py'
          - '/posthog/api/routing.py'
          - '/posthog/ee_urls.py'
          - '/posthog/frontend_views.py'
          - '/posthog/github/'
          - '/posthog/ingress/'
          - '/posthog/urls.py'
      owners: team-devex
    - match: '/posthog/helpers/email_utils.py'
      owners: team-platform-features
    - match: '/posthog/test/activity_logging/'
      owners: team-platform-features
    - match: '/posthog/api/test/test_playwright_setup.py'
      owners: team-devex
    # The guards behind the house patterns: semgrep rules, ratchet baselines, invariant tests,
    # and the docs that state the rules. A small edit here can quietly reopen what a guard
    # closed. Busy files that most PRs touch (lib/api.ts, pyproject.toml, the setup receivers
    # and frozen dataclass baselines) stay out, so that the review requests stay rare.
    - match:
          - '/.github/scripts/migration-deletion-allowlist.txt'
          - '/.semgrep/rules/devex/'
          - '/.semgrep/rules/security/prefer-codegen-api.*'
          - '/docs/internal/django-startup-time.md'
          - '/docs/published/handbook/engineering/type-system.md'
          - '/ee/urls.py'
          - '/frontend/src/lib/api-orval-mutator.ts'
          - '/frontend/src/lib/api-ratchet-baseline.txt'
          - '/frontend/src/lib/api-stream.ts'
          - '/posthog/management/commands/analyze_migration_risk.py'
          - '/posthog/migration_helpers/'
          - '/posthog/openapi/'
          - '/posthog/product_urls.py'
          - '/posthog/settings/nextgensquash.py'
          - '/posthog/test/repo_invariants/dataclass_secret_field_exemptions.txt'
          - '/posthog/test/repo_invariants/setup_import_baseline.txt'
          - '/posthog/test/repo_invariants/test_admin_url_conf.py'
          - '/posthog/test/repo_invariants/test_dataclass_secret_fields.py'
          - '/posthog/test/repo_invariants/test_generated_files_are_registered.py'
          - '/posthog/test/repo_invariants/test_migration_dependencies_share_a_database.py'
          - '/posthog/test/repo_invariants/test_migration_run_before.py'
          - '/posthog/test/repo_invariants/test_model_crossing_uses.py'
          - '/posthog/test/repo_invariants/test_model_enum_defaults.py'
          - '/posthog/test/repo_invariants/test_squash_partial_fallback.py'
          - '/posthog/test/repo_invariants/test_startup_import_budget.py'
          - '/products/README.md'
          - '/products/architecture.md'
          - '/products/isolation_baseline.txt'
          - '/products/model_crossing_uses_baseline.txt'
          - '/tools/openapi-codegen/'
      owners: team-devex
    - match: '/posthog/management/commands/find_enum_collisions.py'
      owners: team-devex
    - match: '/posthog/settings/data_warehouse.py'
      owners: team-data-stack
    - match: '/posthog/settings/email.py'
      owners: team-platform-features
    - match:
          - '/docs/internal/web-bot-auth-key-directory.md'
          - '/posthog/settings/web_bot_auth.py'
          - '/posthog/test/test_web_bot_auth.py'
          - '/posthog/web_bot_auth.py'
          - '/posthog/web_bot_auth_keys.py'
      owners: ai-research
    - match: '/posthog/test/test_feature_flag_analytics.py'
      owners: team-feature-flags
    - match: '/services/llm-gateway/'
      owners: team-agent-infrastructure
    - match:
          - '/packages/owners-yaml/'
          - '/tools/hogli-commands/'
          - '/tools/hogli/'
          - '/tools/phrocs/'
      owners: team-devex
    - match: '/products/stamphog/packages/pr-approval-agent/'
      owners: team-devex
    - match: '/tools/query-performance-ai/'
      owners: team-analytics-platform
    # A new product, provider, domain, or top-level package shapes the monorepo layout.
    # The rule names who owns that decision and claims none of the files inside.
    - match:
          - '/products/*'
          - '/posthog/ingress/*'
          - '/posthog/egress/*'
          - '/tools/*'
          - '/services/*'
          - '/packages/*'
          - '/cli/*'
      additions: team-devex
