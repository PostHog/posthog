# Rust service images built by CI.
#
# This is the single source of truth for which images get built.
# Both production (rust-docker-build.yml) and smoke-test
# (rust-smoke-test-build.yml) workflows read this file via the
# shared build workflow (_rust-build-images.yml).
#
# To add a new service: append an entry here. The deploy matrix in
# rust-docker-build.yml must also be updated for production deploys.
- image: sqlx-migrate
  dockerfile: ./rust/Dockerfile.sqlx-migrate
  context: ./rust/
  project: jmsz6gms8g

- image: cymbal
  dockerfile: ./rust/Dockerfile
  project: 8dq0xkk0ck
  # Frame pointers and unwind tables so the profiler can walk Cymbal stacks on
  # aarch64, including native dependency frames (see rust/Dockerfile).
  extra_rustflags: -C force-frame-pointers=yes -C force-unwind-tables=yes
  extra_cflags: -fno-omit-frame-pointer -fasynchronous-unwind-tables

- image: embedding-worker
  dockerfile: ./rust/Dockerfile
  project: 8dq0xkk0ck

- image: feature-flags
  dockerfile: ./rust/Dockerfile
  project: vglf58qgzw

- image: flags-cache-warmer
  bin: warm-flags-cache
  dockerfile: ./rust/Dockerfile
  project: vglf58qgzw
  features: warm-flags-cache
  # Adds redis-cli + awscli for operator use (see bin/rust-jumphost).
  target: runtime-jumphost

- image: flags-cache-builder
  bin: flags-cache-builder
  dockerfile: ./rust/Dockerfile
  project: vglf58qgzw
  features: flags-cache-builder

- image: flags-consumer
  dockerfile: ./rust/Dockerfile
  project: vglf58qgzw

- image: cohort-event-shuffler
  dockerfile: ./rust/Dockerfile
  project: vglf58qgzw

- image: cohort-seeder
  dockerfile: ./rust/Dockerfile
  project: vglf58qgzw
  # Frame pointers and unwind tables so the profiler can walk seeder stacks on
  # aarch64, including native dependency frames (see rust/Dockerfile). The scan
  # hot path is CPU-bound, so a profile that cannot unwind it is unreadable.
  extra_rustflags: -C force-frame-pointers=yes -C force-unwind-tables=yes
  extra_cflags: -fno-omit-frame-pointer -fasynchronous-unwind-tables

- image: cohort-stream-processor
  dockerfile: ./rust/Dockerfile
  project: vglf58qgzw
  features: hotpath-prometheus

- image: batch-import-worker
  dockerfile: ./rust/Dockerfile
  project: 4ppc15q4bv

# capture-logs and capture-apm-metrics build the same crates, so they share
# the capture-apm Depot project and its layer cache.
- image: capture-logs
  dockerfile: ./rust/Dockerfile
  project: 7fzvz4wcsw

# Metrics half of capture-logs: same library, metrics routes only.
- image: capture-apm-metrics
  dockerfile: ./rust/Dockerfile
  project: 7fzvz4wcsw

# rust/logs-ingestion. Named apart from the Node logs-ingestion release, and
# shares ingestion-consumer's Depot project because both build on ingestion-framework.
- image: logs-ingestion-rust
  bin: logs-ingestion
  dockerfile: ./rust/Dockerfile
  project: mtvzx98zjn

# Records the v4 AI research replay dataset (products/ai_training/docs/replay-data.md).
- image: replay-recorder-v4
  dockerfile: ./rust/Dockerfile
  project: vznmbshh6q

- image: hypercache-server
  dockerfile: ./rust/Dockerfile
  project: plc74nsj8z

- image: usage-ingestion
  dockerfile: ./rust/Dockerfile
  project: g9w71772m7
