version: 1
owners: []
rules:
    - match: ['/CODEOWNERS', '/actions/']
      owners: team-devex
    - match: ['/scripts/deltalite_selection.py', '/scripts/test_deltalite_selection.py']
      owners: team-devex
    - match: '/auto-assign-labels.json'
      owners: team-feature-flags
    - match: ['/dependabot.yml', '/pull_request_template.md', '/workflows/']
      owners: team-devex
    # The dependency proof decides which bot updates stamphog may approve on its own.
    - match:
          - '/scripts/dependency_proof/'
          - '/workflows/dependency-proof.yml'
          - '/workflows/dependency-proof-trigger.yml'
          - '/actions/setup-uv/'
      owners: team-devex
      sensitive: true
    - match: '/shared-image-releases.yaml'
      owners: [team-devex, team-data-stack, batch-exports, team-growth, team-apm]
    - match: '/workflows/cd-llm-analytics-image.yml'
      owners: [team-devex, team-ai-observability]
    - match:
          - '/workflows/build-livestream-tui.yml'
          - '/workflows/ci-livestream-tui.yml'
          - '/workflows/ci-livestream.yml'
          - '/workflows/livestream-docker-image.yml'
      owners: [team-devex, team-web-analytics]
    - match:
          - '/workflows/cd-mcp-image.yml'
          - '/workflows/ci-mcp-agent-api-diff.yml'
          - '/workflows/ci-mcp-ui-apps.yml'
          - '/workflows/ci-mcp.yml'
      owners: [team-devex, team-context-and-mcp]
    - match:
          - '/workflows/ci-llm-gateway.yml'
          - '/workflows/llm-gateway-cd.yml'
          - '/workflows/update-ai-costs.yml'
          - '/workflows/update-ai-costs-stale-alert.yml'
      owners: [team-devex, team-agent-infrastructure]
    - match: ['/workflows/ci-llm-gateway.yml', '/workflows/llm-gateway-cd.yml']
      sensitive: true
    - match:
          - '/workflows/ci-agent-proxy.yml'
          - '/workflows/cd-agent-proxy-image.yml'
      owners: team-agent-infrastructure
      sensitive: true
