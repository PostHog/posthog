name: hog-worker cross-build

# hog-worker ships for every hog target, and only the Release hog workflow builds it for a target
# other than the runner's. This builds the targets cargo-zigbuild covers quickly, on glibc, static
# musl and macOS, so a dependency that can't cross-compile fails the pull request that adds it and
# not the next release. The Windows targets need cargo-xwin's download of Microsoft's C runtime and
# SDK, which is slow, so only the release builds them.
# It is not a required check, so a trigger `paths:` filter is safe.
on:
    pull_request:
        paths:
            - 'hog/worker/**'
            - 'hog/release/build-worker.*'
            - 'hog/release/check-worker.sh'
            - 'hog/release/shared.ts'
            - 'hog/release/worker-cross*'
            - 'hog/src/updates/**'
            - '.github/workflows/ci-hog-worker-cross.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    cross-build:
        name: Cross-compile hog-worker
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
                  sparse-checkout: |
                      /hog/release/
                      /hog/src/updates/
                      /hog/worker/
                  sparse-checkout-cone-mode: false

            # glibc on both architectures, static musl and macOS. The release builds all eight.
            - name: Cross-compile the fast targets
              working-directory: hog
              run: >-
                  release/build-worker.sh
                  --target linux-x64
                  --target linux-x64-musl
                  --target darwin-arm64
                  --target linux-arm64

            - name: Check the Linux builds start
              working-directory: hog
              run: |
                  set -euo pipefail
                  for target in linux-x64 linux-x64-musl; do
                      release/check-worker.sh "dist/release/bin/$target/hog-worker"
                  done
