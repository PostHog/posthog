name: Desktop TUI Release

on:
    push:
        tags:
            - 'tui-v*'

concurrency:
    group: desktop-tui-release
    cancel-in-progress: false

env:
    SLACK_CHANNEL: 'C0C3FBES5ST'
    # npm's audit blocks the pnpm bootstrap. See .github/actions/pnpm-install for why.
    NPM_CONFIG_AUDIT: 'false'
    NPM_CONFIG_FUND: 'false'

jobs:
    release:
        name: Publish the TUI to npm
        # npm provenance requires a github-hosted runner; Depot registers as self-hosted
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        environment: npm-posthog-tui
        permissions:
            contents: read
            id-token: write
        outputs:
            version: ${{ steps.version.outputs.version }}
            tarball_sha256: ${{ steps.pack.outputs.tarball_sha256 }}
        defaults:
            run:
                working-directory: products/desktop
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  package_json_file: products/desktop/package.json

            - name: Set up Node 24
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  package-manager-cache: false

            - name: Extract version from tag
              id: version
              run: |
                  TAG_VERSION="${GITHUB_REF#refs/tags/tui-v}"
                  echo "Version: $TAG_VERSION"
                  echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

            - name: Set version in package.json
              env:
                  APP_VERSION: ${{ steps.version.outputs.version }}
              run: |
                  jq --arg v "$APP_VERSION" '.version = $v' apps/tui/package.json > tmp.json && mv tmp.json apps/tui/package.json
                  echo "Set apps/tui/package.json version to $APP_VERSION"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # The TUI bundles the agent from this checkout, so the agent workspace builds first.
            - name: Build the agent workspace
              run: pnpm build:agent

            - name: Build the TUI
              working-directory: products/desktop/apps/tui
              env:
                  VITE_POSTHOG_API_KEY: ${{ vars.VITE_POSTHOG_API_KEY }}
              run: pnpm build

            - name: Test the TUI
              working-directory: products/desktop/apps/tui
              run: pnpm test

            - name: Pack the release tarball
              id: pack
              working-directory: products/desktop/apps/tui
              env:
                  TUI_VERSION: ${{ steps.version.outputs.version }}
              run: |
                  pnpm pack --pack-destination "$RUNNER_TEMP"
                  cd "$RUNNER_TEMP"
                  sha256sum "posthog-tui-${TUI_VERSION}.tgz" > "posthog-tui-${TUI_VERSION}.tgz.sha256"
                  echo "tarball_sha256=$(cut -d' ' -f1 "posthog-tui-${TUI_VERSION}.tgz.sha256")" >> "$GITHUB_OUTPUT"

            # Installs the tarball the way a user will and runs its bin, so a package missing a copied asset
            # or an unresolved workspace dependency fails here rather than on someone's machine.
            - name: Smoke the tarball
              env:
                  TUI_VERSION: ${{ steps.version.outputs.version }}
              run: |
                  prefix="$RUNNER_TEMP/smoke-prefix"
                  home="$RUNNER_TEMP/smoke-home"
                  mkdir -p "$prefix" "$home"
                  npm install -g "$RUNNER_TEMP/posthog-tui-${TUI_VERSION}.tgz" --prefix "$prefix" --no-audit --no-fund
                  printed=$(HOME="$home" "$prefix/bin/posthog-tui" --version)
                  if [ "$printed" != "$TUI_VERSION" ]; then
                    echo "::error::posthog-tui --version printed '$printed', expected '$TUI_VERSION'"
                    exit 1
                  fi
                  installed="$prefix/lib/node_modules/@posthog/tui"
                  for asset in dist/rpc-host.js dist/adapters/codex-app-server/local-tools-mcp-server.js dist/grammars/tree-sitter-python.wasm dist/skills; do
                    if [ ! -e "$installed/$asset" ]; then
                      echo "::error::$asset is missing from the installed package"
                      exit 1
                    fi
                  done

            - name: Upload the tarball for the release job
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: tui-tarball
                  path: ${{ runner.temp }}/posthog-tui-*.tgz*
                  if-no-files-found: error
                  retention-days: 1

            - name: Publish the package to npm registry
              working-directory: products/desktop/apps/tui
              run: pnpm publish --access public --no-git-checks
              env:
                  NPM_CONFIG_PROVENANCE: true

    # hogli-lint: not-a-required-gate -- reads the release result only to report it in Slack
    notify-release:
        name: Post the release to Slack
        needs: release
        if: ${{ !cancelled() }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            actions: read
        outputs:
            thread_ts: ${{ steps.slack.outputs.ts }}
        steps:
            - name: Describe the release
              id: meta
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  RUN_ID: ${{ github.run_id }}
                  RESULT: ${{ needs.release.result }}
                  TAG: ${{ github.ref_name }}
                  SHA: ${{ github.sha }}
              run: |
                  started=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" --jq .run_started_at 2>/dev/null || true)
                  if [ -n "$started" ]; then
                    elapsed=$(( $(date +%s) - $(date -d "$started" +%s) ))
                    duration="$((elapsed / 60))m $((elapsed % 60))s"
                  else
                    duration="Unknown"
                  fi
                  if [ "$RESULT" = "success" ]; then
                    emoji=":white_check_mark:"
                    status="Published to npm"
                  else
                    emoji=":red_circle:"
                    status="Release ${RESULT}"
                  fi
                  {
                    echo "version=${TAG#tui-v}"
                    echo "emoji=$emoji"
                    echo "status=$status"
                    echo "duration=$duration"
                    echo "commit=${SHA:0:7} (${TAG})"
                  } >> "$GITHUB_OUTPUT"

            - name: Post to Slack
              id: slack
              # Slack is a courtesy: a failed post must not fail the release.
              continue-on-error: true
              uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
              with:
                  method: chat.postMessage
                  token: ${{ secrets.SLACK_DEVEX_BOT_TOKEN }}
                  errors: true
                  payload: |
                      channel: "${{ env.SLACK_CHANNEL }}"
                      text: "${{ steps.meta.outputs.emoji }} @posthog/tui ${{ steps.meta.outputs.version }}: ${{ steps.meta.outputs.status }}"
                      unfurl_links: false
                      blocks:
                        - type: "section"
                          text:
                            type: "mrkdwn"
                            text: "${{ steps.meta.outputs.emoji }} *<https://www.npmjs.com/package/@posthog/tui/v/${{ steps.meta.outputs.version }}|@posthog/tui ${{ steps.meta.outputs.version }}>*"
                        - type: "section"
                          fields:
                            - type: "mrkdwn"
                              text: "*Status*\n${{ steps.meta.outputs.status }}"
                            - type: "mrkdwn"
                              text: "*Commit*\n`${{ steps.meta.outputs.commit }}`"
                            - type: "mrkdwn"
                              text: "*Duration*\n${{ steps.meta.outputs.duration }}"
                            - type: "mrkdwn"
                              text: "*Run*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Desktop TUI Release #${{ github.run_number }}>"

    attach-tarball:
        name: Attach the tarball to a GitHub release
        needs: release
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: write
        outputs:
            tarball_sha256: ${{ steps.attach.outputs.tarball_sha256 }}
        steps:
            - name: Download the tarball
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: tui-tarball
                  path: ${{ runner.temp }}

            - name: Create the release
              id: attach
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
                  TUI_VERSION: ${{ needs.release.outputs.version }}
                  TARBALL_SHA256: ${{ needs.release.outputs.tarball_sha256 }}
              run: |
                  tarball="$RUNNER_TEMP/posthog-tui-${TUI_VERSION}.tgz"
                  checksum="${tarball}.sha256"
                  if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                    existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
                    for asset in "$tarball" "$checksum"; do
                      name=$(basename "$asset")
                      if printf '%s\n' "$existing" | grep -qxF "$name"; then
                        gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --output "$RUNNER_TEMP/existing-$name"
                        if ! cmp -s "$asset" "$RUNNER_TEMP/existing-$name"; then
                          echo "::error::$name on the $TAG release differs from the one this run built"
                          exit 1
                        fi
                        echo "$name is already attached to $TAG and matches this run's build"
                      else
                        gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"
                      fi
                    done
                  else
                    gh release create "$TAG" "$tarball" "$checksum" --repo "$GITHUB_REPOSITORY" \
                      --title "@posthog/tui ${TUI_VERSION}" \
                      --notes "https://www.npmjs.com/package/@posthog/tui/v/${TUI_VERSION}" \
                      --latest=false
                  fi
                  echo "tarball_sha256=$TARBALL_SHA256" >> "$GITHUB_OUTPUT"
