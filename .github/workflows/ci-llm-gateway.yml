# This workflow runs the tests for the LLM Gateway service
# (services/llm-gateway/). It lives outside the Backend CI workflow because
# the service has no runtime dependencies on the PostHog Django backend — it
# only needs Python + uv + pytest.
#
# The `llm_services_tests` roll-up is what gets marked as a required check
# in branch protection: new LLM-service test jobs can be added to its `needs`
# array without reconfiguring required checks in the GitHub UI.
name: LLM Services CI

on:
    push:
        branches:
            - master
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read
    pull-requests: read

jobs:
    changes:
        # Push and schedule runs only belong in this repo. Mirrors run CI on their own PRs only.
        if: github.repository == 'PostHog/posthog' || (github.event_name != 'push' && github.event_name != 'schedule')
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            actions: read
            contents: read
            pull-requests: read
        name: Determine need to run LLM Services checks
        outputs:
            llm_gateway: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.llm_gateway || 'true' }}
        steps:
            # A master push only narrows when the previous push ran green, so a skipped
            # commit can never hide a failure that the full suite would have reported.
            - name: Check push baseline
              id: baseline
              if: github.event_name == 'push'
              continue-on-error: true
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
              with:
                  script: |
                      const before = context.payload.before;
                      if (context.payload.forced || !/^[0-9a-f]{40}$/.test(before || '') || /^0+$/.test(before)) {
                          core.info('Full checks: no safe push baseline.');
                          return false;
                      }
                      const { data } = await github.rest.actions.listWorkflowRuns({
                          ...context.repo,
                          workflow_id: 'ci-llm-gateway.yml',
                          branch: 'master',
                          event: 'push',
                          head_sha: before,
                          per_page: 1,
                      });
                      const previous = data.workflow_runs[0];
                      const safe = previous?.head_sha === before && previous?.conclusion === 'success';
                      core.info(safe ? 'Compare the complete push range.' : 'Full checks: push baseline is not green.');
                      return safe;
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: .github/actions/paths-filter
                  sparse-checkout-cone-mode: false

            - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              id: app-token
              if: github.repository == 'PostHog/posthog' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_PATHS_FILTER_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_PATHS_FILTER_PRIVATE_KEY }}
            - name: Fetch push baseline without blobs
              id: fetch-baseline
              if: steps.baseline.outcome == 'success' && steps.baseline.outputs.result == 'true'
              continue-on-error: true
              env:
                  PUSH_BEFORE: ${{ github.event.before }}
              run: git fetch --no-tags --depth=1 --filter=blob:none origin "$PUSH_BEFORE"
            - uses: ./.github/actions/paths-filter
              id: filter
              if: github.event_name == 'pull_request' || steps.fetch-baseline.outcome == 'success'
              continue-on-error: ${{ github.event_name == 'push' }}
              with:
                  token: ${{ steps.app-token.outputs.token || github.token }}
                  base: ${{ github.event.before }}
                  ref: ${{ github.sha }}
                  filters: |
                      llm_gateway:
                        - 'services/llm-gateway/**'
                        - '.github/workflows/ci-llm-gateway.yml'
                        - '.github/actions/setup-uv/**'
            - name: Capture LLM gateway selection to DevEx PostHog
              if: >-
                  !cancelled() && github.run_attempt == '1'
                  && github.repository == 'PostHog/posthog'
                  && github.actor != 'dependabot[bot]'
                  && (github.event_name != 'pull_request'
                      || github.event.pull_request.head.repo.full_name == github.repository)
              continue-on-error: true
              uses: PostHog/posthog-github-action@58dea254b598fb5d469c0699c98af8288a7f7650 # v1.2.0
              with:
                  posthog-token: ${{ secrets.POSTHOG_DEVEX_PROJECT_API_TOKEN }}
                  event: 'posthog-ci-llm-gateway-selection'
                  properties: |
                      {
                        "mode": ${{ toJSON(steps.filter.outcome == 'success' && steps.filter.outputs.llm_gateway == 'false' && 'skip' || 'full') }},
                        "selection_eligible": ${{ github.event_name == 'pull_request' || steps.fetch-baseline.outcome == 'success' }},
                        "matched_file_count": ${{ steps.filter.outcome == 'success' && steps.filter.outputs.llm_gateway_count || 'null' }},
                        "selected_check_count": ${{ steps.filter.outcome == 'success' && steps.filter.outputs.llm_gateway == 'false' && '0' || '1' }},
                        "selection_reason_category": ${{ toJSON(steps.filter.outcome == 'failure' && 'filter-failed' || steps.filter.outcome == 'success' && (steps.filter.outputs.llm_gateway == 'false' && 'no-matching-paths' || 'matching-paths') || github.event_name != 'push' && 'full-event' || steps.baseline.outcome == 'failure' && 'baseline-api-failed' || steps.baseline.outputs.result != 'true' && 'unsafe-baseline' || 'baseline-fetch-failed') }},
                        "selection_reason_detail": ${{ toJSON(format('event={0}; baseline={1}/{2}; fetch={3}; filter={4}', github.event_name, steps.baseline.outcome, steps.baseline.outputs.result, steps.fetch-baseline.outcome, steps.filter.outcome)) }},
                        "pr_draft": ${{ toJSON(github.event.pull_request.draft) }},
                        "merge_queue": ${{ startsWith(github.head_ref, 'trunk-merge/') }},
                        "branch": ${{ toJSON(github.head_ref || github.ref_name) }},
                        "sha": ${{ toJSON(github.sha) }},
                        "pr_number": ${{ github.event.pull_request.number || 'null' }},
                        "run_id": ${{ toJSON(github.run_id) }}
                      }

    llm-gateway:
        name: LLM Gateway Tests
        needs: changes
        if: needs.changes.outputs.llm_gateway == 'true'
        runs-on: depot-ubuntu-24.04-4
        timeout-minutes: 15
        defaults:
            run:
                working-directory: services/llm-gateway

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: '3.14.7'
                  token: ${{ github.token }}

            - name: Install uv
              uses: ./.github/actions/setup-uv
              with:
                  enable-cache: false

            - name: Install dependencies
              run: uv sync --frozen --dev

            - name: Run tests
              id: run-tests
              env:
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
                  FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
                  AWS_DEFAULT_REGION: us-east-1
                  CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_LLM_GATEWAY_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: uv run pytest tests/ -n auto -v --tb=short --junitxml=junit.xml

            - name: Upload test results
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              if: always()
              with:
                  name: junit-results-llm-gateway
                  path: services/llm-gateway/junit.xml

    # Single required status check for branch protection. Add future LLM
    # services test jobs to `needs` here rather than reconfiguring GitHub.
    llm_services_tests:
        needs: [changes, llm-gateway]
        name: LLM Services Tests Pass
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        # !cancelled(): a superseded run records cancelled (which branch protection
        # does not treat as a pass) instead of running on to report failure. A cancelled
        # or timed-out dependency on a live run is still caught by the != success &&
        # != skipped checks below; a legitimate no-change skip passes.
        if: ${{ !cancelled() }}
        steps:
            - name: Check outcomes
              run: |
                  if [[ "${{ needs.changes.result }}" != "success" && "${{ needs.changes.result }}" != "skipped" ]]; then
                    echo "Change detection did not succeed (result: ${{ needs.changes.result }})."
                    exit 1
                  fi

                  if [[ "${{ needs.llm-gateway.result }}" != "success" && "${{ needs.llm-gateway.result }}" != "skipped" ]]; then
                    echo "LLM Gateway tests did not succeed (result: ${{ needs.llm-gateway.result }})."
                    exit 1
                  fi

                  echo "All LLM Services checks passed."
