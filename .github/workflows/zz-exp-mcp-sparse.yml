name: EXP MCP sparse checkout (throwaway)

on:
    pull_request:
        paths:
            - '.github/workflows/zz-exp-mcp-sparse.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    checkout:
        name: checkout ${{ matrix.arm }} rep ${{ matrix.rep }}
        runs-on: depot-ubuntu-24.04-4
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                arm: [full, sparse]
                rep: [1, 2, 3, 4, 5, 6, 7, 8]
        steps:
            - name: Checkout code (full)
              if: matrix.arm == 'full'
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Checkout code (sparse)
              if: matrix.arm == 'sparse'
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout-cone-mode: false
                  sparse-checkout: |
                      /*
                      !/*/
                      package.json
                      /.github/actions/
                      /services/mcp/
                      /packages/
                      /patches/
                      /common/
                      /tools/openapi-codegen/
                      /products/*/mcp/
                      /products/*/frontend/
                      /products/*/skills/
                      /products/notebooks/
                      /products/ai_observability/backend/prompts/
                      /frontend/src/queries/
                      /frontend/src/taxonomy/
                      /frontend/src/mocks/fixtures/

            - name: Record checkout cost
              run: |
                  kib=$(git count-objects -v | awk '/^size(-pack)?:/{s+=$2} END{print s}')
                  echo "RESULT arm=${{ matrix.arm }} rep=${{ matrix.rep }} objects_mib=$((kib / 1024)) files=$(git ls-files -t | grep -c '^H')"
