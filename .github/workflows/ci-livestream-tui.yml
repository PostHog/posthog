name: Livestream TUI

on:
    push:
        branches:
            - master
        paths:
            - '.github/workflows/ci-livestream-tui.yml'
            - 'livestream/tui/**'
            - 'livestream/go.mod'
            - 'livestream/go.sum'
            - 'livestream/Makefile.tui'
            - 'livestream/.golangci.*'
            - '.golangci.*'
    pull_request:
        paths:
            - '.github/workflows/ci-livestream-tui.yml'
            - 'livestream/tui/**'
            - 'livestream/go.mod'
            - 'livestream/go.sum'
            - 'livestream/Makefile.tui'
            - 'livestream/.golangci.*'
            - '.golangci.*'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    build:
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 10
        strategy:
            matrix:
                include:
                    - runner: ubuntu-24.04
                      arch: amd64
                    - runner: ubuntu-24.04-arm
                      arch: arm64

        steps:
            - name: Checkout code
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/checkout@v6.0.2
              with:
                  sparse-checkout: livestream
                  sparse-checkout-cone-mode: false

            - name: Set up Go
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/setup-go@v6.4.0
              with:
                  go-version: '1.26.10'
                  cache-dependency-path: livestream/go.sum

            - name: Build
              run: cd livestream && make -f Makefile.tui build
