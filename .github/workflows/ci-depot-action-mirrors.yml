name: Depot action mirrors

# Depot CI resolves `./.github/actions/<name>` from .depot/actions/<name>, so every local action a
# Depot workflow uses has a mirror there. This check fails when a canonical action changes without
# its mirror, or when an exact mirror drifts. `hogli ci:preflight` runs the same check before a push.
on:
    pull_request:
        paths:
            - .github/workflows/ci-depot-action-mirrors.yml
            - .github/actions/**
            - .depot/**
            - tools/hogli-commands/hogli_commands/depot_mirrors.py

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Depot action mirrors remain synchronized
        runs-on: ubuntu-24.04
        # 5 min absorbs cold-runner startup + the explicit depth=100 fetch of BASE_SHA below.
        # `actions/checkout` defaults to depth=1 (HEAD only); a full-history clone is unnecessary
        # — we only need to diff two SHAs.
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - name: Compare PR diff scope
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  set -euo pipefail
                  # actions/checkout checks out refs/pull/<n>/merge by default, so HEAD
                  # is the merge commit — diffing BASE_SHA..HEAD gives the PR's effective
                  # changes. We only need to fetch BASE_SHA (HEAD is already local).
                  git fetch --no-tags --depth=100 origin "$BASE_SHA"
                  python3 tools/hogli-commands/hogli_commands/depot_mirrors.py "$BASE_SHA"
