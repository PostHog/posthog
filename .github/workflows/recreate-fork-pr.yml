name: Re-create fork PR from a comment
on:
    issue_comment:
        types: [created]
permissions:
    contents: read
jobs:
    recreate:
        name: Re-create fork PR
        if: >
            github.event.issue.pull_request
            && github.event.issue.state == 'open'
            && startsWith(github.event.comment.body, '/recreate-fork-pr')
            && contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association)
        concurrency:
            group: ${{ github.workflow }}-pr-${{ github.event.issue.number }}
            cancel-in-progress: false
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  sparse-checkout: .github/scripts/recreate-fork-pr.js
                  sparse-checkout-cone-mode: false
                  filter: blob:none

            - name: Get app token
              id: app-token
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_SCHEDULED_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_SCHEDULED_ACTIONS_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write
                  permission-issues: write

            - name: Re-create the approved commit
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
              env:
                  FORK_PR_NUMBER: ${{ github.event.issue.number }}
                  COMMENTER: ${{ github.event.comment.user.login }}
                  COMMENT_BODY: ${{ github.event.comment.body }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: |
                      const recreateForkPr = require('./.github/scripts/recreate-fork-pr.js')
                      if (process.env.COMMENT_BODY.split('\n')[0].trim() !== '/recreate-fork-pr') {
                          return
                      }
                      await recreateForkPr({
                          github,
                          context,
                          core,
                          forkPrNumber: Number(process.env.FORK_PR_NUMBER),
                          commenter: process.env.COMMENTER,
                          runUrl: process.env.RUN_URL,
                      })
