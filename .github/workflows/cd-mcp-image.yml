#
# Build and push MCP server container image.
#
# This is the MCP server that runs on k8s (EU + US clusters)
# using Redis for session state instead of Cloudflare Durable Objects.
#
name: MCP Container Image CD

on:
    push:
        branches:
            - master
        paths:
            - 'services/mcp/**'
            - '.github/workflows/cd-mcp-image.yml'
            # Bundled into the MCP image at build time (copy-instructions.ts `shared/` copy +
            # shared parser sources) — without these paths an edit there never rebuilds the
            # image and the bundle goes stale.
            - 'products/ai_observability/backend/prompts/parser_recipe_examples.yaml'
            - 'packages/llm-normalizer/**'
    # paths mirror the push trigger; the build-mcp-image label only forces a
    # build on PRs touching these paths, use workflow_dispatch otherwise.
    pull_request:
        types: [opened, synchronize, reopened, labeled]
        paths:
            - 'services/mcp/**'
            - '.github/workflows/cd-mcp-image.yml'
            - 'products/ai_observability/backend/prompts/parser_recipe_examples.yaml'
            - 'packages/llm-normalizer/**'
    workflow_dispatch:

jobs:
    build:
        name: Build and push container image
        if: |
            github.repository_owner == 'PostHog' && (
                github.event_name == 'push' ||
                github.event_name == 'workflow_dispatch' ||
                contains(github.event.pull_request.labels.*.name, 'build-mcp-image')
            )
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
            id-token: write

        outputs:
            sha: ${{ steps.push.outputs.digest }}

        steps:
            - name: Check out
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 2

            - name: Docker meta and registry login
              id: docker-meta
              uses: ./.github/actions/docker-meta
              with:
                  image-name: posthog-mcp
                  # Publishes only from the default branch of the repo with CD_DEPLOY_ENABLED — assume the role and touch ECR only there;
                  # labeled PRs still build (push=false) without assuming it.
                  aws-role-to-assume: ${{ secrets.AWS_ECR_SHARED_SERVICES_POSTHOG_MASTER_PUBLISH_IAM_ROLE }}
                  push-to-ecr: ${{ github.ref == 'refs/heads/master' && vars.CD_DEPLOY_ENABLED == 'true' }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  dockerhub-username: ${{ secrets.DOCKERHUB_USER }}
                  dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
                  push-to-dockerhub: 'false'
                  # Prod deploys from private ECR; pause the public ghcr push during an embargo.
                  push-to-ghcr: ${{ vars.PUBLIC_IMAGE_PUSH_PAUSED != 'true' }}

            - name: Set up Depot CLI
              uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1

            - name: Build and push container image
              id: push
              uses: depot/build-push-action@5f3b3c2e5a00f0093de47f657aeaefcedff27d18 # v1.17.0
              with:
                  project: c1f2m5s6zd
                  file: ./services/mcp/Dockerfile
                  buildx-fallback: false
                  push: ${{ github.ref == 'refs/heads/master' && vars.CD_DEPLOY_ENABLED == 'true' }}
                  tags: ${{ steps.docker-meta.outputs.tags }}
                  labels: ${{ steps.docker-meta.outputs.labels }}
                  annotations: ${{ steps.docker-meta.outputs.annotations }}
                  platforms: linux/arm64,linux/amd64
                  build-args: |
                      COMMIT_HASH=${{ github.sha }}
                      POSTHOG_UI_APPS_TOKEN=sTMFPsFhdP1Ssg
                      POSTHOG_MCP_APPS_ANALYTICS_BASE_URL=https://us.i.posthog.com

    deploy:
        name: Trigger MCP deployment
        runs-on: ubuntu-24.04
        # Sized past TIMEOUT_SECONDS of the Django wait below.
        timeout-minutes: 345
        needs: build
        if: github.repository_owner == 'PostHog' && vars.CD_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/master'
        # No concurrency group: Charts drops a dispatch whose commit timestamp is not newer than the
        # deployed one, so an older image that finishes its wait later does not replace a newer one.
        permissions:
            contents: read
            deployments: read

        steps:
            - name: Check out
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: .github/scripts/deploy
                  sparse-checkout-cone-mode: false

            # The MCP server calls Django endpoints and checks Django scopes, so an image that ships
            # before Django has them hides tools or fails calls. master is linear, so a Django build
            # that contains the commit of the image has every Django change that the image needs.
            # The token below is minted after this wait, because an App token expires after an hour.
            # Break glass, for an MCP fix while the Django deploy is blocked: set the repository
            # variable MCP_DEPLOY_SKIP_DJANGO_WAIT to true and re-run the failed deploy job.
            - name: Wait for the Django deploy that the image needs
              if: vars.MCP_DEPLOY_SKIP_DJANGO_WAIT != 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  # Deploys run in the repository with CD_DEPLOY_ENABLED, which can be the private
                  # mirror, but the Charts deploy writes the Django records to PostHog/posthog. An
                  # embargoed commit that is not in PostHog/posthog fails this wait, so it needs the
                  # break glass above.
                  REPOSITORY: PostHog/posthog
                  COMMIT_SHA: ${{ github.sha }}
                  # A Django deploy that is blocked longer than this needs a person anyway.
                  TIMEOUT_SECONDS: '19800'
              run: .github/scripts/deploy/wait-for-backend-deploy.sh

            - name: Get deployer token
              id: deployer
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_CHARTS_DEPLOYER_APP_ID }}
                  private-key: ${{ secrets.GH_APP_CHARTS_DEPLOYER_PRIVATE_KEY }}
                  owner: PostHog
                  repositories: charts

            - name: Get PR labels
              id: labels
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
              with:
                  retries: 3
                  script: |
                      try {
                        const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                          owner: 'PostHog',
                          repo: 'posthog',
                          commit_sha: context.sha,
                        });
                        const labels = pulls.flatMap(pr => pr.labels.map(l => l.name));
                        return JSON.stringify([...new Set(labels)]);
                      } catch (error) {
                        if (error.status !== 404 && error.status !== 422) throw error;
                        core.notice(`${context.sha} is not a PostHog/posthog commit, so it has no PR labels.`);
                        return '[]';
                      }

            - name: Trigger MCP deployment
              uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
              with:
                  token: ${{ steps.deployer.outputs.token }}
                  repository: PostHog/charts
                  event-type: commit_state_update
                  client-payload: |
                      {
                        "values": {
                          "image": {
                            "sha": "${{ needs.build.outputs.sha }}"
                          }
                        },
                        "release": "mcp",
                        "commit": ${{ toJson(github.event.head_commit) }},
                        "repository": "PostHog/posthog",
                        "labels": ${{ steps.labels.outputs.result }},
                        "timestamp": "${{ github.event.head_commit.timestamp }}"
                      }
