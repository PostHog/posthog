name: Workflows as code

# Pushes the repository's own workflows in products/workflows/workflows/ to
# PostHog on master. Pull requests run the required check in Frontend CI.
on:
    push:
        branches:
            - master
        paths:
            - products/workflows/workflows/**
            - products/workflows/packages/workflows/**
            - products/workflows/package.json
            - .github/workflows/workflows-as-code.yml
    workflow_dispatch:

# Master pushes share one group with cancellation off, so two pushes never
# race a deploy. The newer run waits, and the newest commit wins.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    workflows:
        name: Push workflows
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        environment: workflows-as-code
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            # The workflow files import @posthog/workflows through the devDependency
            # in products/workflows/package.json, and pnpm only creates that link
            # when the product package is selected too.
            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm install --frozen-lockfile --filter "@posthog/workflows..." --filter "@posthog/products-workflows"

            # Project 2 is PostHog's own project on PostHog Cloud US, which is where
            # these workflows run. The variables exist so a fork can point the push
            # at its own project; the secret is the only thing that has to be set.
            - name: Push workflows to PostHog
              env:
                  POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_WORKFLOWS_API_KEY }}
                  POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_WORKFLOWS_PROJECT_ID || '2' }}
                  POSTHOG_CLI_HOST: ${{ vars.POSTHOG_WORKFLOWS_HOST || 'https://us.posthog.com' }}
              run: |
                  if [[ -z "$POSTHOG_CLI_API_KEY" ]]; then
                      echo "::warning::Push skipped: set the POSTHOG_WORKFLOWS_API_KEY secret to push these workflows to project $POSTHOG_CLI_PROJECT_ID on $POSTHOG_CLI_HOST."
                      exit 0
                  fi
                  pnpm --filter=@posthog/workflows repo:push
