name: PR unowned paths

# Reusable workflow, called by pr-housekeeping.yml on PR open and push.
# Push-cancels-previous-push comes from the caller's concurrency group.

on:
    workflow_call:

permissions:
    contents: read
    pull-requests: write

jobs:
    unowned-paths:
        name: Warn on files with no owner
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        # The fork token cannot write comments, and the queue's batch PR is the
        # union of PRs that were each already checked.
        if: github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'trunk-merge/')

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  # HEAD is the PR merged into its base, so the first parent is the base to compare with.
                  fetch-depth: 2
                  filter: blob:none
                  sparse-checkout: |
                      /packages/owners-yaml/
                      /.github/scripts/post-unowned-paths-section.mjs
                      /frontend/bin/ci-report/
                      **/owners.yaml
                      **/product.yaml
                  sparse-checkout-cone-mode: false

            - name: Install the owners resolver
              run: python3 -m pip install --quiet ./packages/owners-yaml

            # The list goes to a file because a path is text the PR author controls, and the
            # runner reads a log line that starts with `::` as a workflow command.
            - name: List the files this PR leaves with no owner
              id: list
              run: |
                  if owners unowned --against HEAD^1 > unowned-paths.txt; then
                      echo "listed=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "::warning::Could not list the files this PR leaves with no owner, so the CI report keeps its last result."
                  fi

            - name: Post to the CI report
              if: steps.list.outputs.listed == 'true'
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: node .github/scripts/post-unowned-paths-section.mjs unowned-paths.txt
