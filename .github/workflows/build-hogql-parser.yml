name: Release hogql-parser

on:
    pull_request:
        paths:
            - common/hogql_parser/**
            - .github/workflows/build-hogql-parser.yml
    # Publishing is manual and only from master. A pull request builds wheels as a check
    # and cannot reach the publish job.
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check-version:
        name: Check version legitimacy
        runs-on: ubuntu-22.04
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: write
        outputs:
            parser-release-needed: ${{ steps.version.outputs.parser-release-needed }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0 # Fetching all for comparison since last push (not just last commit)
                  filter: blob:none

            - name: Check if common/hogql_parser/ or the workflow has changed
              id: changed-files
              if: github.event_name == 'pull_request'
              uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
              with:
                  files_yaml: |
                      parser:
                      - common/hogql_parser/**
                      workflow:
                      - .github/workflows/build-hogql-parser.yml

            - name: Check if version was bumped
              shell: bash
              id: version
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # A manual dispatch is already a release decision, so it checks the version
                  # without asking which files changed.
                  PARSER_CHANGED: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.changed-files.outputs.parser_any_changed }}
                  WORKFLOW_CHANGED: ${{ steps.changed-files.outputs.workflow_any_changed }}
                  IS_FORK: ${{ github.event.pull_request.head.repo.full_name != 'PostHog/posthog' }}
                  IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  parser_release_needed='false'
                  if [[ "$PARSER_CHANGED" == 'true' ]]; then
                    local=$(cd common/hogql_parser && python setup.py --version)
                    # 200 = version already on PyPI, 404 = needs release.
                    http_code=$(curl -o /dev/null -sSL -w '%{http_code}' "https://pypi.org/pypi/hogql-parser/$local/json")
                    if [[ "$http_code" == '404' ]]; then
                      parser_release_needed='true'
                      # Version was bumped — mark any reminder from an earlier push resolved.
                      if [[ "$IS_PULL_REQUEST" == 'true' ]] && [ -f .github/scripts/post-reminder-section.mjs ]; then
                        GITHUB_TOKEN="$GH_TOKEN" node .github/scripts/post-reminder-section.mjs hogql-parser-py --clear "version bumped to $local"
                      fi
                    elif [[ "$http_code" == '200' ]]; then
                      message_body="It looks like the code of \`hogql-parser\` changed in this PR, but its version stayed the same at $local. 👀"
                      message_body+=$'\n'"Make sure to resolve this in \`common/hogql_parser/setup.py\` before merging!"
                      if [[ "$IS_FORK" == 'true' ]]; then
                        message_body+=$'\n'"This needs to be performed on a branch created on the PostHog/posthog repo itself. A PostHog team member can assist with this."
                      fi
                      if [[ "$IS_PULL_REQUEST" == 'true' ]] && [ -f .github/scripts/post-reminder-section.mjs ]; then
                        BODY="$message_body" GITHUB_TOKEN="$GH_TOKEN" node .github/scripts/post-reminder-section.mjs hogql-parser-py warn "version bump needed"
                      else
                        echo "$message_body"
                      fi
                    else
                      echo "::warning::Unexpected HTTP $http_code from PyPI for hogql-parser $local; assuming not yet published."
                      parser_release_needed='true'
                    fi
                  fi
                  # Build the wheels on workflow-only edits too, so a change to this file is checked.
                  if [[ "$WORKFLOW_CHANGED" == 'true' ]]; then
                    parser_release_needed='true'
                  fi
                  echo "parser-release-needed=$parser_release_needed" >> $GITHUB_OUTPUT

    build-wheels:
        name: Build wheels on ${{ matrix.os }}
        needs: check-version
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        if: needs.check-version.outputs.parser-release-needed == 'true' &&
            (github.event_name == 'workflow_dispatch' ||
            github.event.pull_request.head.repo.full_name == 'PostHog/posthog')
        strategy:
            matrix:
                os: [ubuntu-22.04, ubuntu-22.04-arm, macos-14, macos-15-intel]
                include:
                    - os: macos-14
                      cibw_archs_macos: arm64
                      MACOSX_DEPLOYMENT_TARGET: 14
                    - os: macos-15-intel
                      cibw_archs_macos: x86_64
                      MACOSX_DEPLOYMENT_TARGET: 15
                    - os: ubuntu-22.04
                      cibw_archs_linux: x86_64
                      MACOSX_DEPLOYMENT_TARGET: ''
                    - os: ubuntu-22.04-arm
                      cibw_archs_linux: aarch64
                      MACOSX_DEPLOYMENT_TARGET: ''

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: '3.13.13'

            - name: Build sdist
              if: matrix.os == 'ubuntu-22.04' # Only build the sdist once
              run: |
                  pip install setuptools==80.9.0
                  cd common/hogql_parser && python setup.py sdist

            - name: Install cibuildwheel
              run: pip install cibuildwheel==4.2.*

            - name: Build wheels
              run: cd common/hogql_parser && python -m cibuildwheel --output-dir dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CIBW_ARCHS_MACOS: ${{ matrix.cibw_archs_macos }}
                  CIBW_ARCHS_LINUX: ${{ matrix.cibw_archs_linux }}
                  MACOSX_DEPLOYMENT_TARGET: ${{ matrix.MACOSX_DEPLOYMENT_TARGET }}

            - name: Upload wheels artifact
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: wheels-${{ matrix.os }}
                  path: |
                      common/hogql_parser/dist/*.whl
                      common/hogql_parser/dist/*.tar.gz
                  if-no-files-found: error

    publish:
        name: Publish on PyPI
        needs: [check-version, build-wheels]
        # Only a manual dispatch from master publishes. The environment's deployment branch
        # policy is the registry-side half of that rule, since PyPI's trusted publisher
        # for this project accepts only this environment.
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && github.repository == 'PostHog/posthog'
        environment: pypi-hogql-parser
        permissions:
            id-token: write
        runs-on: ubuntu-22.04
        timeout-minutes: 10
        steps:
            - name: Download wheels from ubuntu-22.04
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: wheels-ubuntu-22.04
                  path: dist

            - name: Download wheels from ubuntu-22.04-arm
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: wheels-ubuntu-22.04-arm
                  path: dist

            - name: Download wheels from macos-14
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: wheels-macos-14
                  path: dist

            - name: Download wheels from macos-15-intel
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: wheels-macos-15-intel
                  path: dist

            - name: Publish package to PyPI
              uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
              with:
                  skip-existing: true
