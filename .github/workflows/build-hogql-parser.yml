name: Release hogql-parser

on:
    push:
        branches: [master]
        paths:
            - common/hogql_parser/**
            - .github/workflows/build-hogql-parser.yml
    pull_request:
        paths:
            - common/hogql_parser/**
            - .github/workflows/build-hogql-parser.yml

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check-version:
        permissions:
            contents: read
            pull-requests: write
        name: Check version legitimacy
        runs-on: ubuntu-22.04
        timeout-minutes: 5
        outputs:
            parser-release-needed: ${{ steps.version.outputs.parser-release-needed }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
                  fetch-depth: 0 # Fetching all for comparison since last push (not just last commit)
                  filter: blob:none

            - name: Check if common/hogql_parser/ or the workflow has changed
              id: changed-files
              uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
              with:
                  files_yaml: |
                      parser:
                      - common/hogql_parser/**
                      workflow:
                      - .github/workflows/build-hogql-parser.yml

            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: '3.13.13'

            - name: Install package metadata dependency
              run: pip install setuptools==80.9.0

            - name: Check if version was bumped
              shell: bash
              id: version
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PARSER_CHANGED: ${{ steps.changed-files.outputs.parser_any_changed }}
                  IS_FORK: ${{ github.event.pull_request.head.repo.full_name != 'PostHog/posthog' }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  parser_release_needed='false'
                  if [[ "$PARSER_CHANGED" == 'true' ]]; then
                    local=$(cd common/hogql_parser && python setup.py --version)
                    # 200 = version already on PyPI, 404 = needs release.
                    http_code=$(curl --retry 3 --retry-all-errors --retry-max-time 90 --connect-timeout 10 --max-time 30 -o /dev/null -sSL -w '%{http_code}' "https://pypi.org/pypi/hogql-parser/$local/json")
                    if [[ "$http_code" == '404' ]]; then
                      parser_release_needed='true'
                      # Version was bumped — mark any reminder from an earlier push resolved.
                      if [[ "$GITHUB_EVENT_NAME" == 'pull_request' && "$IS_FORK" == 'false' ]] && [ -f .github/scripts/post-reminder-section.mjs ]; then
                        GITHUB_TOKEN="$GH_TOKEN" node .github/scripts/post-reminder-section.mjs hogql-parser-py --clear "version bumped to $local"
                      fi
                    elif [[ "$http_code" == '200' ]]; then
                      message_body="It looks like the code of \`hogql-parser\` changed in this PR, but its version stayed the same at $local. 👀"
                      message_body+=$'\n'"Make sure to resolve this in \`common/hogql_parser/setup.py\` before merging!"
                      if [[ "$GITHUB_EVENT_NAME" == 'pull_request' && "$IS_FORK" == 'false' ]] && [ -f .github/scripts/post-reminder-section.mjs ]; then
                        BODY="$message_body" GITHUB_TOKEN="$GH_TOKEN" node .github/scripts/post-reminder-section.mjs hogql-parser-py warn "version bump needed"
                      elif [[ "$GITHUB_EVENT_NAME" == 'pull_request' && "$IS_FORK" == 'true' ]]; then
                        echo "::warning::hogql-parser $local is already on PyPI. Bump the version in common/hogql_parser/setup.py before merging."
                      else
                        echo "Skipping hogql-parser reminder: not a same-repository PR, or reminder script is missing."
                      fi
                    else
                      echo "::error::Unexpected HTTP $http_code from PyPI for hogql-parser $local. Retry the workflow."
                      exit 1
                    fi
                  fi
                  echo "parser-release-needed=$parser_release_needed" >> "$GITHUB_OUTPUT"

    build-wheels:
        name: Build wheels on ${{ matrix.os }}
        needs: check-version
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        if: needs.check-version.outputs.parser-release-needed == 'true' &&
            (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'PostHog/posthog'))
        strategy:
            matrix:
                os: [ubuntu-22.04, ubuntu-22.04-arm, macos-14, macos-15-intel]
                include:
                    - os: macos-14
                      cibw_archs_macos: arm64
                      MACOSX_DEPLOYMENT_TARGET: 14
                    - os: macos-15-intel
                      cibw_archs_macos: x86_64
                      MACOSX_DEPLOYMENT_TARGET: 15
                    - os: ubuntu-22.04
                      cibw_archs_linux: x86_64
                      MACOSX_DEPLOYMENT_TARGET: ''
                    - os: ubuntu-22.04-arm
                      cibw_archs_linux: aarch64
                      MACOSX_DEPLOYMENT_TARGET: ''

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false

            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: '3.13.13'

            - name: Build sdist
              if: matrix.os == 'ubuntu-22.04' # Only build the sdist once
              run: |
                  pip install setuptools==80.9.0
                  cd common/hogql_parser && python setup.py sdist

            - name: Install cibuildwheel
              run: pip install cibuildwheel==4.2.*

            - name: Build wheels
              run: cd common/hogql_parser && python -m cibuildwheel --output-dir dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CIBW_ARCHS_MACOS: ${{ matrix.cibw_archs_macos }}
                  CIBW_ARCHS_LINUX: ${{ matrix.cibw_archs_linux }}
                  MACOSX_DEPLOYMENT_TARGET: ${{ matrix.MACOSX_DEPLOYMENT_TARGET }}

            - name: Upload wheels artifact
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: wheels-${{ matrix.os }}
                  path: |
                      common/hogql_parser/dist/*.whl
                      common/hogql_parser/dist/*.tar.gz
                  if-no-files-found: error

    notify-approval-needed:
        name: Notify Slack - Approval Needed
        needs: build-wheels
        if: github.repository == 'PostHog/posthog' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Request release approval
              continue-on-error: true
              uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
              with:
                  method: chat.postMessage
                  token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
                  payload: |
                      channel: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
                      text: >-
                          <!subteam^${{ vars.GROUP_CLIENT_LIBRARIES_SLACK_GROUP_ID }}> Release approval needed for hogql-parser.
                          Review <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|the release commit> and
                          <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|approve or reject the release>.

    publish:
        if: github.repository == 'PostHog/posthog' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        name: Publish on PyPI
        needs: [check-version, build-wheels, notify-approval-needed]
        environment: Release SDK
        permissions:
            id-token: write
        runs-on: ubuntu-22.04
        timeout-minutes: 10
        steps:
            - name: Download wheels from ubuntu-22.04
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: wheels-ubuntu-22.04
                  path: dist

            - name: Download wheels from ubuntu-22.04-arm
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: wheels-ubuntu-22.04-arm
                  path: dist

            - name: Download wheels from macos-14
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: wheels-macos-14
                  path: dist

            - name: Download wheels from macos-15-intel
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: wheels-macos-15-intel
                  path: dist

            - name: Publish package to PyPI
              uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
              with:
                  skip-existing: true
