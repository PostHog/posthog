name: Desktop Build

on:
    # Dispatched by desktop-ci.yml, the single PR/merge_group run for the whole
    # desktop suite; merge_group gating and PR concurrency live there.
    workflow_call:
        secrets:
            GH_APP_POSTHOG_PATHS_FILTER_APP_ID:
                required: false
            GH_APP_POSTHOG_PATHS_FILTER_PRIVATE_KEY:
                required: false
    push:
        branches: [master]
        paths:
            - 'products/desktop/**'
            - '.github/workflows/desktop-build.yml'

concurrency:
    group: desktop-build-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # One job, so a run acquires one runner. The change detection and the build
    # share it instead of queueing for a runner each, and this job is itself the
    # registered required check, so no third runner waits behind a shell `if`.
    build:
        name: Desktop Build Pass
        # This job is the required status check, so it must always run and emit a
        # verdict — including on merge_group and on PRs with no relevant changes,
        # where the build steps below are skipped.
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            pull-requests: read
        defaults:
            run:
                working-directory: products/desktop
        steps:
            # Own rate-limit bucket; the shared GITHUB_TOKEN goes hot at merge peaks.
            - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              id: app-token
              # forks can't read org secrets, so fall back to github.token
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              with:
                  client-id: ${{ secrets.GH_APP_POSTHOG_PATHS_FILTER_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_PATHS_FILTER_PRIVATE_KEY }}

            - name: Detect relevant changes
              id: filter
              if: github.event_name == 'pull_request'
              uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
              with:
                  token: ${{ steps.app-token.outputs.token || github.token }}
                  predicate-quantifier: every
                  filters: |
                      # Wider excludes than desktop-quality.yml, which keeps .vscode and
                      # .claude in scope because Biome lints them.
                      code:
                        - "products/desktop/**"
                        - "!products/desktop/**/*.md"
                        - "!products/desktop/docs/**"
                        - "!products/desktop/.vscode/**"
                        - "!products/desktop/.claude/**"
                        - "!products/desktop/.husky/**"
                        - "!products/desktop/LICENSE"
                        - "!products/desktop/.gitignore"
                        - "!products/desktop/.env.example"
                      workflow:
                        - ".github/workflows/desktop-build.yml"

            # Decide once whether the build steps run. Skip on merge_group (the
            # suite already ran in full on the PR). On a master push there is no
            # filter, so always build. On a PR, build when code or the workflow
            # changed, and fail closed to a build if change detection did not
            # succeed.
            - name: Decide whether to build
              id: decide
              # Runs before checkout, so it cannot use the products/desktop default.
              working-directory: ${{ github.workspace }}
              run: |
                  if [[ "${{ github.event_name }}" == "merge_group" ]]; then
                    echo "build=false" >> "$GITHUB_OUTPUT"
                  elif [[ "${{ github.event_name }}" != "pull_request" ]]; then
                    echo "build=true" >> "$GITHUB_OUTPUT"
                  elif [[ "${{ steps.filter.outcome }}" != "success" ]]; then
                    echo "build=true" >> "$GITHUB_OUTPUT"
                  elif [[ "${{ steps.filter.outputs.code }}" == "true" || "${{ steps.filter.outputs.workflow }}" == "true" ]]; then
                    echo "build=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "build=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Checkout
              if: steps.decide.outputs.build == 'true'
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Setup pnpm
              if: steps.decide.outputs.build == 'true'
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  package_json_file: products/desktop/package.json

            - name: Setup Node.js
              if: steps.decide.outputs.build == 'true'
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 22

            - name: Get pnpm store path
              if: steps.decide.outputs.build == 'true'
              id: pnpm-store
              run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            # Explicit restore/save instead of setup-node's `cache: pnpm`: that
            # auto-saves on every run (PRs included, ungatable), which the workflow
            # lint forbids. Saves are gated to master pushes below.
            - name: Restore pnpm store
              if: steps.decide.outputs.build == 'true'
              uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: desktop-pnpm-${{ runner.os }}-${{ hashFiles('products/desktop/pnpm-lock.yaml') }}
                  restore-keys: desktop-pnpm-${{ runner.os }}-

            # Only dependency builds are cached, tests themselves always run.
            - name: Restore turbo cache
              if: steps.decide.outputs.build == 'true'
              uses: ./.github/actions/desktop-restore-turbo-cache

            - name: Install dependencies
              if: steps.decide.outputs.build == 'true'
              run: pnpm install --frozen-lockfile
              env:
                  # The packaged app is never launched, so the Electron-ABI rebuild is unused.
                  SKIP_ELECTRON_REBUILD: '1'

            - name: Build packages
              if: steps.decide.outputs.build == 'true'
              run: pnpm run build:deps

            - name: Build code
              if: steps.decide.outputs.build == 'true'
              run: pnpm --filter code build
