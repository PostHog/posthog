name: Check Generated Docs

on:
    workflow_call:
        inputs:
            source_file:
                description: 'File that triggers doc regeneration when changed'
                required: true
                type: string
            additional_source_files:
                description: 'Extra files (newline-separated) that also trigger regeneration, e.g. the generator script'
                required: false
                type: string
                default: ''
            build_command:
                description: 'Command to regenerate the docs'
                required: true
                type: string
            output_file:
                description: 'Generated doc file to check for changes'
                required: true
                type: string
            fail_on_outdated:
                description: 'Whether to fail the workflow if docs are out of date'
                required: false
                type: boolean
                default: false

permissions:
    contents: read
    pull-requests: write

jobs:
    check-docs-generated:
        name: Check docs are up to date
        runs-on: ubuntu-24.04
        timeout-minutes: 10

        steps:
            - name: Check if source file changed
              id: source-check
              env:
                  GH_TOKEN: ${{ github.token }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.sha }}
                  SOURCE_FILE: ${{ inputs.source_file }}
                  ADDITIONAL_SOURCE_FILES: ${{ inputs.additional_source_files }}
              run: |
                  # The compare API caps files at 300. An incomplete lookup must still validate docs.
                  if ! comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA?per_page=1") \
                      || ! jq -e '.files | type == "array" and length < 300' <<< "$comparison" > /dev/null; then
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  changed_files=$(jq -r '.files[] | .filename, (.previous_filename // empty)' <<< "$comparison")
                  if printf '%s\n' "$changed_files" \
                      | grep -qxFf <(printf '%s\n' "$SOURCE_FILE" "$ADDITIONAL_SOURCE_FILES" | grep -v '^$'); then
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Checkout
              if: steps.source-check.outputs.changed == 'true'
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Install pnpm dependencies
              if: steps.source-check.outputs.changed == 'true'
              uses: ./.github/actions/pnpm-install

            - name: Generate docs
              if: steps.source-check.outputs.changed == 'true'
              env:
                  BUILD_COMMAND: ${{ inputs.build_command }}
              run: $BUILD_COMMAND

            - name: Check for uncommitted changes
              id: docs-check
              if: steps.source-check.outputs.changed == 'true'
              env:
                  OUTPUT_FILE: ${{ inputs.output_file }}
              run: |
                  if git diff --exit-code "$OUTPUT_FILE"; then
                      echo "outdated=false" >> $GITHUB_OUTPUT
                  else
                      echo "outdated=true" >> $GITHUB_OUTPUT
                  fi

            - name: Post reminder comment
              if: steps.docs-check.outputs.outdated == 'true'
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  SOURCE_FILE: ${{ inputs.source_file }}
                  BUILD_COMMAND: ${{ inputs.build_command }}
                  OUTPUT_FILE: ${{ inputs.output_file }}
              run: |
                  message_body="### Generated docs update required

                  You updated \`${SOURCE_FILE}\` but the generated docs are out of date.

                  Please run:
                  \`\`\`
                  ${BUILD_COMMAND}
                  \`\`\`

                  Then commit the updated \`${OUTPUT_FILE}\` file."

                  # All callers of this reusable workflow share the one generated-docs section —
                  # if a second caller ever runs on the same PR, they will clobber and false-clear
                  # each other; give the section id an input (registered in SECTIONS) at that point.
                  if [ -f .github/scripts/post-reminder-section.mjs ]; then
                      BODY="$message_body" node .github/scripts/post-reminder-section.mjs generated-docs warn "regeneration needed"
                  else
                      echo "Skipping generated-docs section — script not present on this checkout"
                  fi

            # Docs are current again — mark any reminder from an earlier push resolved.
            - name: Clear docs reminder
              if: steps.docs-check.outputs.outdated == 'false'
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  if [ -f .github/scripts/post-reminder-section.mjs ]; then
                      node .github/scripts/post-reminder-section.mjs generated-docs --clear "docs regenerated"
                  fi

            - name: Fail if docs outdated
              if: steps.docs-check.outputs.outdated == 'true' && inputs.fail_on_outdated
              env:
                  BUILD_COMMAND: ${{ inputs.build_command }}
              run: |
                  echo "::error::Generated docs are out of date. Run '${BUILD_COMMAND}' and commit the changes."
                  exit 1
