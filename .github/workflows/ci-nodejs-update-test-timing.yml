name: Node.js CI - Update test timing

on:
    workflow_dispatch:
        inputs:
            nodejs_run_id:
                description: 'Node.js CI run ID (leave empty to use latest successful master run)'
                required: false
                type: string
    schedule:
        # Daily at 04:20 UTC: merge nodejs/nodejs-timings.json with the JUnit artifacts of a
        # recent successful master Node.js CI run and open/update a PR. The manifest drives greedy
        # bin-packing across the 6 Jest shards in nodejs/test-sequencer.js; balance decays as test
        # files land or get slower without timings, so a periodic refresh keeps the slowest shard
        # close to the mean. Cheap (no test execution — just an artifact download + XML parse).
        - cron: '20 4 * * *'

permissions:
    contents: write
    actions: read
    pull-requests: write

jobs:
    collect-and-refresh:
        name: Refresh Node.js timing manifest from CI artifacts
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Guard — only run on master
              # This job force-resets chore/update-nodejs-timings to github.sha and opens a PR
              # against master. Dispatched from a feature branch or tag, github.ref_name would check
              # out that ref and the PR would carry all of its unrelated commits, so reject anything
              # but master. Scheduled runs always target the default branch, so this only blocks a
              # stray manual dispatch (the sibling ci-storybook-update-test-timing.yml gates the same way).
              env:
                  REF: ${{ github.ref }}
              run: |
                  if [ "$REF" != "refs/heads/master" ]; then
                      echo "::error::This workflow can only run on master (got $REF). Re-dispatch it from master."
                      exit 1
                  fi

            - name: Get app token
              id: app-token
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_POSTHOG_TESTS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_TESTS_PRIVATE_KEY }}

            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ github.ref_name }}
                  token: ${{ steps.app-token.outputs.token }}

            - name: Find Node.js CI run to use
              id: find-run
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  INPUT_RUN_ID: ${{ inputs.nodejs_run_id }}
              run: |
                  validate_run() {
                      local run_id="$1"
                      local run_json artifact_names

                      run_json=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id")
                      if ! jq -e '
                          .conclusion == "success" and
                          .event == "push" and
                          .head_branch == "master" and
                          .path == ".github/workflows/ci-nodejs.yml"
                      ' <<< "$run_json" >/dev/null; then
                          echo "Run $run_id is not a successful master push of ci-nodejs.yml" >&2
                          return 1
                      fi

                      # A shard only writes JUnit XML when its Jest task misses the turbo cache,
                      # so requiring all 6 would reject nearly every run. The refresh merges into
                      # the existing manifest, so partial coverage is fine — one artifact is enough.
                      artifact_names=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts?per_page=100" \
                          --jq '[.artifacts[] | select(.expired == false) | .name]')
                      if ! jq -e '
                          [.[] | select(test("^junit-results-nodejs-[1-9][0-9]*$"))] | length > 0
                      ' <<< "$artifact_names" >/dev/null; then
                          echo "Run $run_id has no live Node.js JUnit shard artifacts" >&2
                          return 1
                      fi
                  }

                  if [ -n "$INPUT_RUN_ID" ]; then
                      if ! validate_run "$INPUT_RUN_ID"; then
                          echo "::error::Provided run must be a successful master Node.js CI push with live JUnit shard artifacts"
                          exit 1
                      fi
                      echo "run_id=$INPUT_RUN_ID" >> "$GITHUB_OUTPUT"
                      echo "Using provided Node.js CI run: $INPUT_RUN_ID"
                      exit 0
                  fi

                  # Find a recent successful ci-nodejs.yml master run whose JUnit artifacts are
                  # still live. They have 1-day retention and only appear when a shard misses the
                  # turbo cache, so the newest run is usually not usable — scan newest-first and
                  # pick the first with unexpired junit-results-nodejs-* artifacts. The repo is busy
                  # enough that master runs can fall outside a plain `gh run list -L 20` window, so
                  # query the workflow's runs filtered to master directly.
                  echo "Searching for a successful master Node.js CI run with live JUnit artifacts..."
                  run_id=$(gh api "repos/${{ github.repository }}/actions/workflows/ci-nodejs.yml/runs?status=success&branch=master&per_page=30" \
                      --jq '.workflow_runs[].id' | \
                      while read -r id; do
                          if validate_run "$id"; then
                              echo "$id"
                              break
                          fi
                      done)

                  if [ -z "$run_id" ]; then
                      echo "::error::No successful master Node.js CI run found with live JUnit artifacts (1-day retention)"
                      exit 1
                  fi
                  echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                  echo "Using Node.js CI run: $run_id"

            - name: Refresh nodejs-timings.json
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  RUN_ID: ${{ steps.find-run.outputs.run_id }}
              # The script downloads the run's junit-results-nodejs-* artifacts and merges them
              # into nodejs/nodejs-timings.json in place (seconds per test file).
              run: ./nodejs/update-nodejs-timings.sh "$RUN_ID"

            - name: Check for changes
              id: check-changes
              run: |
                  if git diff --quiet nodejs/nodejs-timings.json; then
                      echo "No changes to Node.js timings"
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "Node.js timings updated"
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                      git diff --stat nodejs/nodejs-timings.json
                  fi

            # No diff: clean up a stale open PR/branch so it doesn't linger with outdated timings.
            - name: Clean up stale branch
              if: steps.check-changes.outputs.changed == 'false'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  existing_pr=$(gh pr list --head "chore/update-nodejs-timings" --json number --jq '.[0].number' 2>/dev/null || true)
                  if [ -n "$existing_pr" ]; then
                    gh pr close "$existing_pr" --delete-branch || true
                    echo "Closed stale PR #$existing_pr and deleted branch"
                  fi

            - name: Reset branch to checked-out SHA
              # Force-reset the branch to the SHA this job was pinned to so each run is independent
              # of any unmerged commits from prior runs. Using github.sha guarantees the branch tip
              # matches workspace HEAD — otherwise a merge to master during the run could leave
              # ghcommit-action with a parent mismatch ("Expected branch to point to X").
              if: steps.check-changes.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  TARGET_SHA: ${{ github.sha }}
              run: |
                  if gh api repos/${{ github.repository }}/git/ref/heads/chore/update-nodejs-timings >/dev/null 2>&1; then
                    gh api -X PATCH repos/${{ github.repository }}/git/refs/heads/chore/update-nodejs-timings \
                      -f sha="$TARGET_SHA" -F force=true
                    echo "Force-reset branch to $TARGET_SHA (superseding any prior unmerged commits)"
                  else
                    gh api repos/${{ github.repository }}/git/refs -f ref=refs/heads/chore/update-nodejs-timings -f sha="$TARGET_SHA"
                    echo "Created branch at $TARGET_SHA"
                  fi

            - name: Commit via GitHub API (signed)
              if: steps.check-changes.outputs.changed == 'true'
              uses: planetscale/ghcommit-action@25309d8005ac7c3bcd61d3fe19b69e0fe47dbdde # v0.2.20
              with:
                  commit_message: 'chore(ci): update Node.js shard timing manifest'
                  repo: ${{ github.repository }}
                  branch: chore/update-nodejs-timings
                  file_pattern: nodejs/nodejs-timings.json
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

            - name: Create pull request
              if: steps.check-changes.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  RUN_ID: ${{ steps.find-run.outputs.run_id }}
                  REPO: ${{ github.repository }}
              run: |
                  existing_pr=$(gh pr list --head "chore/update-nodejs-timings" --json number --jq '.[0].number' 2>/dev/null || true)
                  if [ -n "$existing_pr" ]; then
                    echo "PR #$existing_pr already exists — updated by commit"
                  else
                    body=$(cat <<EOF
                  ## Problem

                  Node.js shard timings become stale as test files are added, removed, and get slower, which leaves the whole Jest matrix waiting on one outlier shard.

                  ## Changes

                  Refresh the timing manifest from [Node.js CI run ${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID}).

                  ## How did you test this code?

                  The scheduled workflow validated that the source was a successful master run with live JUnit shard artifacts, then merged the manifest.

                  ## Automatic notifications

                  - [ ] Publish to changelog?
                  - [ ] Alert Sales and Marketing teams?

                  ## Docs update

                  No user-facing behavior or documented workflow changes.

                  ## 🤖 Agent context

                  **Autonomy:** Fully autonomous

                  Created by the Node.js timing refresh workflow from validated CI artifacts.
                  EOF
                  )

                    gh pr create \
                      --title "chore(ci): update Node.js shard timing manifest" \
                      --body "$body" \
                      --base master \
                      --head chore/update-nodejs-timings \
                      --reviewer "PostHog/team-devex"
                  fi
