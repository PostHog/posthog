name: Migration & Service Separation Check

# Reusable workflow, called by pr-housekeeping.yml on every PR push.

on:
    workflow_call:
        secrets:
            GH_APP_POSTHOG_PATHS_FILTER_PRIVATE_KEY:
                required: false

permissions:
    contents: read
    pull-requests: read

jobs:
    check-migration-service-separation:
        name: Check migrations and service changes are not in same PR
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: .github/actions/paths-filter
                  sparse-checkout-cone-mode: false

            # Author-attested escape hatch for migrations that change no schema the service reads
            # and ship safely alongside service code. The check is path-only and can't tell a
            # CREATE TABLE from a comment change, so the label opt-in matches the precedent set
            # by skip-inkeep-docs.
            - name: Check for skip label
              id: skip-label
              env:
                  PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
              run: |
                  labels="$PR_LABELS_JSON"
                  echo "Labels: $labels"
                  if echo "$labels" | grep -q '"skip-migration-service-check"'; then
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                      echo "::notice::Skipping check — 'skip-migration-service-check' label is set."
                  else
                      echo "skip=false" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              id: app-token
              if: github.repository == 'PostHog/posthog' && steps.skip-label.outputs.skip != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_PATHS_FILTER_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_PATHS_FILTER_PRIVATE_KEY }}
            - uses: ./.github/actions/paths-filter
              id: filter
              if: steps.skip-label.outputs.skip != 'true'
              with:
                  token: ${{ steps.app-token.outputs.token || github.token }}
                  # Django migrations are not listed. The Node deploy hook (nodejs/src/schema-check/)
                  # holds each Node rollout until the Django migrations its image needs are applied,
                  # which also covers a migration and its Node reader in one PR or one stack.
                  filters: |
                      clickhouse_migrations:
                          - 'posthog/clickhouse/migrations/*.py'
                      sqlx_migrations:
                          - 'rust/persons_migrations/*.sql'
                          - 'rust/behavioral_cohorts_migrations/*.sql'
                          - 'rust/cyclotron-node-migrations/*.sql'
                      nodejs:
                          - 'nodejs/**'

                      rust_services:
                          - 'rust/**'
                          - '!rust/persons_migrations/**'
                          - '!rust/behavioral_cohorts_migrations/**'
                          - '!rust/cyclotron-node-migrations/**'

            - name: Check for conflicting changes
              id: check
              if: steps.skip-label.outputs.skip != 'true'
              env:
                  CLICKHOUSE_MIGRATIONS_CHANGED: ${{ steps.filter.outputs.clickhouse_migrations }}
                  NODEJS_CHANGED: ${{ steps.filter.outputs.nodejs }}
                  SQLX_MIGRATIONS_CHANGED: ${{ steps.filter.outputs.sqlx_migrations }}
                  RUST_SERVICES_CHANGED: ${{ steps.filter.outputs.rust_services }}
              run: |
                  has_error=false
                  error_messages=""

                  # Check nodejs + ClickHouse migrations
                  if [ "$CLICKHOUSE_MIGRATIONS_CHANGED" == "true" ] && [ "$NODEJS_CHANGED" == "true" ]; then
                      error_messages="${error_messages}❌ Found both ClickHouse migration and nodejs changes\n"
                      has_error=true
                  fi

                  # Check nodejs + sqlx migrations
                  if [ "$SQLX_MIGRATIONS_CHANGED" == "true" ] && [ "$NODEJS_CHANGED" == "true" ]; then
                      error_messages="${error_messages}❌ Found both sqlx migration and nodejs changes\n"
                      has_error=true
                  fi

                  # Check rust services + sqlx migrations
                  if [ "$SQLX_MIGRATIONS_CHANGED" == "true" ] && [ "$RUST_SERVICES_CHANGED" == "true" ]; then
                      error_messages="${error_messages}❌ Found both sqlx migration and rust service changes\n"
                      has_error=true
                  fi

                  if [ "$has_error" == "true" ]; then
                      echo "error=true" >> "$GITHUB_OUTPUT"
                      echo -e "$error_messages"
                  else
                      echo "error=false" >> "$GITHUB_OUTPUT"
                      echo "✅ No conflicting changes detected"
                  fi

            - name: Fail if conflicting changes detected
              if: steps.check.outputs.error == 'true'
              run: |
                  echo "::error::This PR contains both ClickHouse or sqlx migration files and service changes. These must be separated into different PRs."
                  echo ""
                  echo "Why? ClickHouse and sqlx migrations are not orchestrated with service deployments."
                  echo "If you merge service code that depends on new schema alongside the migration, your"
                  echo "service may deploy before the migration runs, causing failures."
                  echo "Django migrations are not part of this check: the Node deploy hook waits for them."
                  echo ""
                  echo "Solution: Split into two PRs, and do not stack them:"
                  echo "  1. First PR: Migration changes only (merge and wait for it to deploy)"
                  echo "  2. Second PR: Service code changes (merge after migration is deployed)"
                  echo ""
                  echo "If no migration in this PR changes schema that the service reads, apply the"
                  echo "'skip-migration-service-check' label and the check will skip."
                  exit 1
