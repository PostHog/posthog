name: Jest shard 1 leak probe (throwaway)

# Throwaway measurement, not for merge. Each job runs the PR jest shard 1 workload twice on one runner:
# once as it runs today and once with one candidate fix, so the runner's speed cancels out of the pair.
on:
    pull_request:
        paths:
            - '.github/workflows/tmp-jest-shard-leak-probe.yml'
            - '.github/scripts/tmp_jest_leak_probe.py'
            - 'frontend/jest.probe.*'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    probe:
        name: Probe (${{ matrix.fix }}, shard 1 of ${{ matrix.shards }}, ${{ matrix.order }})
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                fix: [retainmaps, retainmaps-gc, workerlimit, retainmaps-workerlimit, node22]
                order: [today-first, today-second]
                # Two shards is the workload the timeouts came from. Three is what master runs now.
                shards: [2, 3]
                exclude:
                    - fix: retainmaps-gc
                      shards: 3
                    - fix: retainmaps-workerlimit
                      shards: 3
                    - fix: node22
                      shards: 3
                    # An earlier run of this probe measured the worker limit on two shards.
                    - fix: workerlimit
                      shards: 2
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/frontend... install --frozen-lockfile

            - name: Build product files
              run: pnpm --filter=@posthog/frontend build:products

            - name: Run shard 1 as today and with one fix
              env:
                  FIX: ${{ matrix.fix }}
                  ORDER: ${{ matrix.order }}
                  SHARDS: ${{ matrix.shards }}
              run: python3 .github/scripts/tmp_jest_leak_probe.py --fix "$FIX" --order "$ORDER" --shards "$SHARDS" | tee -a "$GITHUB_STEP_SUMMARY"
