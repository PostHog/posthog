name: Jest shard 1 leak probe (throwaway)

# Throwaway measurement, not for merge. Runs the PR jest shard 1 workload twice on one runner,
# with and without runStreamLogic.test.ts, so the runner's speed cancels out of the comparison.
on:
    pull_request:
        paths:
            - '.github/workflows/tmp-jest-shard-leak-probe.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    probe:
        name: Probe (${{ matrix.order }} - ${{ matrix.replica }})
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                order: [with-first, without-first]
                replica: [1, 2]
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/frontend... install --frozen-lockfile

            - name: Run shard 1 with and without the run-stream suite
              env:
                  NODE_OPTIONS: --max-old-space-size=16384
                  ORDER: ${{ matrix.order }}
              run: |
                  set -uo pipefail
                  pnpm --filter=@posthog/frontend build:products

                  # The config's own ignore list, as one pattern, so both variants name it the same way.
                  base_ignore='/node_modules/|/services/mcp/|/products/[^/]+/frontend/e2e/|/products/visual_review/cli/|/products/desktop/'

                  run_variant() {
                      local variant="$1" ignore="$base_ignore" log="$RUNNER_TEMP/jest-$1.log"
                      if [ "$variant" = "without" ]; then
                          ignore="$base_ignore|runStreamLogic\\.test"
                      fi
                      local start
                      start=$(date +%s)
                      # Same command as the selective jest job, plus heap logging and a cold cache per variant.
                      pnpm --filter=@posthog/frontend exec jest \
                          --forceExit \
                          --passWithNoTests \
                          --logHeapUsage \
                          --cacheDirectory="$RUNNER_TEMP/jest-cache-$variant" \
                          --testPathIgnorePatterns="$ignore" \
                          --shard=1/2 \
                          --findRelatedTests src/lib/constants.tsx > "$log" 2>&1
                      local status=$?
                      local wall=$(( $(date +%s) - start ))
                      python3 - "$log" "$variant" "$wall" "$status" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
                  import re, sys
                  log, variant, wall, status = sys.argv[1:5]
                  ansi = re.compile(r"\x1b\[[0-9;]*[A-Za-z]")
                  heaps, first, jest_time, suites = [], None, "?", "?"
                  for raw in open(log, errors="replace"):
                      line = ansi.sub("", raw.rstrip("\n"))
                      m = re.match(r"^(PASS|FAIL) (\S+)(?: \((?:[\d.]+ s, )?(\d+) MB heap size\))?", line)
                      if m:
                          first = first or m.group(2)
                          if m.group(3):
                              heaps.append(int(m.group(3)))
                      if line.startswith("Test Suites:"):
                          suites = line.split(":", 1)[1].strip()
                      if line.startswith("Time:"):
                          jest_time = line.split(":", 1)[1].strip()
                  third = max(1, len(heaps) // 3)
                  mid = lambda xs: sorted(xs)[len(xs) // 2] if xs else 0
                  print(f"variant={variant} exit={status} wall_s={wall} jest_time={jest_time}")
                  print(f"  suites: {suites}")
                  print(f"  first suite: {first}")
                  print(f"  heap MB: median first third={mid(heaps[:third])} middle third={mid(heaps[third:2 * third])} last third={mid(heaps[2 * third:])} max={max(heaps) if heaps else 0}")
                  print(f"  suites reporting over 2000 MB: {sum(1 for h in heaps if h > 2000)} of {len(heaps)}")
                  PY
                  }

                  if [ "$ORDER" = "with-first" ]; then
                      run_variant with
                      run_variant without
                  else
                      run_variant without
                      run_variant with
                  fi
