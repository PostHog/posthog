name: Frontend CI
on:
    pull_request:
        # PRs run a narrowed jest selection, draft or ready, over two shards. The
        # merge queue's trunk-merge/** run is the full matrix that gates master.
        # When selection can't be trusted, a ready PR falls back to the full matrix
        # and a draft skips jest instead, deferring to its ready run. To force the
        # full matrix on a PR, add the `run-ci-frontend` label. The `no-ci` label
        # does the opposite: it silences this workflow on a draft entirely
        # (prototypes).
        # No labeled/unlabeled triggers: GitHub cannot filter a label trigger by
        # name, so every unrelated label re-ran the full jest matrix against a
        # commit CI had already covered. A label here takes effect from the next
        # push, or from ready_for_review.
        types: [opened, synchronize, reopened, ready_for_review]
    push:
        branches:
            - master
    schedule:
        # Where master's jest coverage and its Trunk flaky-test baseline come from.
        # The merge queue's trunk-merge/** run gates every commit before it lands, so
        # the push lane does not repeat the suite. Typecheck, format and bundle size
        # run on every push instead, being cheap and per-commit meaningful.
        # Offset from the other hourly CI crons so the runs do not all fire at once.
        - cron: '7 * * * *'

concurrency:
    # The hourly lane gets its own group, so it queues behind itself rather than
    # behind master pushes. Sharing the ref group would let a slow hourly run hold
    # the group while pushes pile up pending, and GitHub keeps only the newest
    # pending run per group — so the older push, and its per-commit checks, would
    # be dropped.
    group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled' || github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read
    pull-requests: write
    actions: read

env:
    RUNS_ON_INTERNAL_PR: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}

jobs:
    # Job to decide if we should run frontend ci
    # See .github/actions/paths-filter/README.md for filter semantics
    # we skip each step individually, so   they are still reported as success
    # because many of them are required for CI checks to be green
    changes:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        # A draft PR labeled `no-ci` skips this workflow entirely (prototypes):
        # every other job needs this one, and the gates treat skipped as success.
        # The merge queue's trunk-merge/** run is the gate, so skipping a draft
        # never weakens what protects master.
        if: >-
            github.event_name != 'pull_request'
            || github.event.pull_request.draft != true
            || startsWith(github.head_ref, 'trunk-merge/')
            || !contains(github.event.pull_request.labels.*.name, 'no-ci')
        name: Determine need to run frontend checks
        # A snapshot-only bot push (Visual Review auto-commits frontend/snapshots.yml after
        # approval) skips ci-storybook and ci-e2e-playwright (the snapshot-baseline-dependent
        # suites), not these checks. Jest, TypeScript, format, and bundle-size don't depend on
        # the baseline and still gate merge, so they run purely off the paths filter here.
        outputs:
            # AND the broad filter with `exclude` (below): a PR that touches only
            # Node-only product workspaces (their own ci-agents.yml suite, no stories,
            # nothing in the bundle) must not trigger frontend CI. The excluded dirs are
            # derived from pnpm-workspace.yaml, not hardcoded — see the exclude step.
            frontend: >-
                ${{ (steps.filter.outputs.frontend || 'true') == 'true'
                    && (steps.exclude.outputs.outside_node_product_workspaces || 'true') == 'true' }}
            frontend_code: >-
                ${{ (steps.filter.outputs.frontend_code || 'true') == 'true'
                    && (steps.exclude.outputs.outside_node_product_workspaces || 'true') == 'true' }}
            replay_shared: >-
                ${{ (steps.filter.outputs.replay_shared || 'true') == 'true' }}
            complexity_files: ${{ steps.filter.outputs.complexity_files }}
        steps:
            # For pull requests it's not necessary to check out the code, but we
            # also want this to run on master, so we need to check out
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: |
                      .github/actions/paths-filter
                      bin/frontend-exclude-filter
                      pnpm-workspace.yaml
                  sparse-checkout-cone-mode: false

            - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              id: app-token
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_PATHS_FILTER_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_PATHS_FILTER_PRIVATE_KEY }}
            - uses: ./.github/actions/paths-filter
              id: filter
              # Skipped on master push and on the hourly schedule: every output then
              # defaults to true. See "The hourly master lane" in
              # .agents/skills/authoring-ci-workflows/SKILL.md for why a cron cannot
              # diff, and what breaks if this guard is dropped.
              if: github.event_name != 'push' && github.event_name != 'schedule'
              with:
                  token: ${{ steps.app-token.outputs.token || github.token }}
                  list-files: 'escape'
                  filters: |
                      # Consumed as a file list (complexity_files) by the changed-file
                      # complexity check — the PR files API, not a hand-rolled git diff.
                      complexity:
                          - 'frontend/**/*.ts'
                          - 'frontend/**/*.tsx'
                          - 'ee/**/*.ts'
                          - 'ee/**/*.tsx'
                          - 'products/**/*.ts'
                          - 'products/**/*.tsx'
                      frontend:
                        # Avoid running frontend tests for irrelevant changes
                        # NOTE: we are at risk of missing a dependency here.
                        - 'bin/**'
                        - 'frontend/**'
                        - 'ee/frontend/**'
                        - 'common/esbuilder/**'
                        - 'packages/**'
                        - 'products/**/*.ts'
                        - 'products/**/*.tsx'
                        - 'products/**/*.json'
                        # products/desktop is the imported desktop app; it has its own
                        # desktop-* CI and must not drag this suite onto its PRs. Excludes
                        # are order-independent in dorny, so this also covers the broad
                        # **/*.yml and **/*.md rules below. The desktop CI files live
                        # outside products/desktop, so exclude them explicitly too.
                        - '!products/desktop/**'
                        - '!.github/workflows/desktop-*.yml'
                        - '!.github/actions/desktop-*/**'
                        - '!.github/scripts/desktop/**'
                        - 'playwright/**'
                        - 'docs/**/*.tsx'
                        # Make sure we run if someone is explicitly change the workflow
                        - .github/workflows/ci-frontend.yml
                        # various JS config files
                        - .oxlintrc.json
                        - .oxfmtrc*
                        - babel.config.js
                        - package.json
                        - pnpm-lock.yaml
                        - jest.*.ts
                        - tsconfig.json
                        - tsconfig.*.json
                        - webpack.config.js
                        - stylelint*
                        - '**/*.md'
                        - '**/*.mdx'
                        - '**/*.yaml'
                        - '**/*.yml'
                        - .config/.markdownlint-cli2.jsonc
                        # MCP owns its code-quality checks in ci-mcp.yml.
                        - '!services/mcp/**'
                      # Like `frontend` but excludes doc/config-only files that don't affect
                      # compiled output — used to skip Jest, bundle-size, and TypeScript checks
                      # when only markdown or YAML files change.
                      frontend_code:
                        - 'bin/**'
                        - 'frontend/**'
                        - 'ee/frontend/**'
                        - 'common/esbuilder/**'
                        - 'packages/**'
                        - 'products/**/*.ts'
                        - 'products/**/*.tsx'
                        - 'products/**/*.json'
                        # products/desktop is the imported desktop app; it has its own
                        # desktop-* CI and must not drag this suite onto its PRs
                        - '!products/desktop/**'
                        - 'playwright/**'
                        # The onboarding step components compile into the app and sit in the
                        # frontend tsconfig program, so they are code, not docs.
                        - 'docs/**/*.tsx'
                        - .github/workflows/ci-frontend.yml
                        - .oxlintrc.json
                        - .oxfmtrc*
                        - babel.config.js
                        - package.json
                        - pnpm-lock.yaml
                        - jest.*.ts
                        - tsconfig.json
                        - tsconfig.*.json
                        - webpack.config.js
                        - stylelint*
                        - '!services/mcp/**'
                      # The @posthog/replay-shared package's own jest suite (the
                      # jest-replay-shared job). posthog-js bumps land via the catalog +
                      # lockfile and have broken it before (rrweb subpath entries switching
                      # to ESM); its zstd tests need the node:zlib support pinned by .nvmrc.
                      replay_shared:
                        - 'common/replay-shared/**'
                        - pnpm-workspace.yaml
                        - pnpm-lock.yaml
                        - .nvmrc
                        - .github/workflows/ci-frontend.yml

            # The broad `products/**/*.ts(x)` rules above correctly match all product
            # frontend code (which doesn't always live under frontend/ — see
            # products/games, products/data_warehouse, products/ai_observability/shared),
            # but they also match product dirs that are their own Node services
            # (products/<product>/services/**) with their own CI suite and nothing in
            # the bundle. Exclude those so a PR touching only them skips frontend
            # CI. The excluded dirs are derived from pnpm-workspace.yaml (the product paths
            # that declare nested pnpm workspaces) rather than hardcoded, so a new product's
            # services are excluded automatically — see bin/frontend-exclude-filter.
            #
            # A separate step is still needed because these exclusions are generated at
            # runtime from pnpm-workspace.yaml into a filter file, while the main filter
            # above is inline YAML — paths-filter takes one or the other. The exclude-only
            # filter is true only when some changed file lives OUTSIDE every excluded dir.
            - name: Derive Node-only product workspace exclusions
              if: github.event_name != 'push' && github.event_name != 'schedule'
              run: bin/frontend-exclude-filter > "$RUNNER_TEMP/frontend-exclude.yml"
            - uses: ./.github/actions/paths-filter
              id: exclude
              if: github.event_name != 'push' && github.event_name != 'schedule'
              with:
                  token: ${{ steps.app-token.outputs.token || github.token }}
                  filters: ${{ runner.temp }}/frontend-exclude.yml

    # Pick which jest tests to run on a PR by passing changed files to
    # `jest --findRelatedTests` (jest's resolver walks the import graph for us).
    # Skipped on master pushes and on the merge queue's run, where the jest job
    # falls back to its full four-shard matrix. That queue run is what gates
    # master, so it is the only place the full matrix has to run.
    # The run-ci-frontend label forces the full matrix on a PR. When selection
    # can't be trusted (config change, oversized diff, selector failure), a ready
    # PR takes the full matrix and a draft skips jest, deferring to its ready run.
    select-jest-tests:
        name: Select jest tests
        runs-on: ubuntu-latest
        timeout-minutes: 5
        needs: changes
        # Trunk's merge-queue branches open as draft PRs, but their run IS the
        # merge gate, so they must never get the narrowed selection.
        if: |
            !cancelled() && needs.changes.outputs.frontend_code == 'true'
            && github.event_name == 'pull_request'
            && !startsWith(github.head_ref, 'trunk-merge/')
            && !contains(github.event.pull_request.labels.*.name, 'run-ci-frontend')
        outputs:
            mode: ${{ steps.classify.outputs.mode }}
            matrix: ${{ steps.classify.outputs.matrix }}
            should_run: ${{ steps.classify.outputs.should_run }}
            changed_files: ${{ steps.classify.outputs.changed_files }}
            # Telemetry (see capture-jest-selection). Emitted on every path, so a
            # fallback rate can be read per reason rather than inferred from mode alone.
            changed_file_count: ${{ steps.classify.outputs.changed_file_count }}
            selected_file_count: ${{ steps.classify.outputs.selected_file_count }}
            shard_count: ${{ steps.classify.outputs.shard_count }}
            full_run_reason_category: ${{ steps.classify.outputs.full_run_reason_category }}
            full_run_reason_detail: ${{ steps.classify.outputs.full_run_reason_detail }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 1000
                  filter: blob:none

            - name: Compute changed files
              id: diff
              continue-on-error: true
              env:
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: |
                  set -euo pipefail
                  git fetch --no-tags --depth=1000 --filter=blob:none origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
                  # `...` resolves against the merge-base so files merged in from base
                  # don't inflate the diff (mirrors find-affected-stories / snob).
                  git diff --name-only "origin/$BASE_REF...HEAD" > /tmp/changed.txt
                  wc -l < /tmp/changed.txt

            - name: Build narrowed matrix
              id: classify
              env:
                  DIFF_OUTCOME: ${{ steps.diff.outcome }}
                  PR_DRAFT: ${{ github.event.pull_request.draft }}
              run: |
                  set -euo pipefail

                  # Use this whenever the selector can't reason about the diff — a
                  # narrowed run it can't vouch for would be false confidence.
                  # A draft skips jest and defers to its ready run; a ready PR has no
                  # later run on this PR to defer to, so it takes the full matrix.
                  # Mirrors the draft/ready fallback turbo-discover.js applies to the
                  # Django matrices. The run-ci-frontend label forces the full matrix.
                  # $1 is a closed category for grouping the telemetry, $2 the unbounded
                  # detail behind it.
                  fall_back() {
                      local mode should_run matrix shards
                      if [[ "$PR_DRAFT" == "true" ]]; then
                          echo "::notice::$1 ($2); draft skips jest (its ready run selects again)"
                          mode=skip should_run=false shards=0
                          matrix='{"include":[]}'
                      else
                          # Empty matrix: the jest job's own default supplies the full
                          # fanout, so the shard shape is written down in one place.
                          echo "::notice::$1 ($2); running the full jest matrix"
                          mode=full should_run=true shards=4
                          matrix=
                      fi
                      {
                          echo "mode=$mode"
                          echo "matrix=$matrix"
                          echo "should_run=$should_run"
                          echo "changed_files="
                          echo "changed_file_count=${changed_count:-}"
                          echo "selected_file_count=0"
                          echo "shard_count=$shards"
                          echo "full_run_reason_category=$1"
                          echo "full_run_reason_detail=$2"
                      } >> "$GITHUB_OUTPUT"
                  }

                  if [[ "$DIFF_OUTCOME" != "success" ]] || [[ ! -s /tmp/changed.txt ]]; then
                      fall_back diff_unavailable "${DIFF_OUTCOME}"
                      exit 0
                  fi

                  # tr: the count is reported as telemetry now, and BSD wc pads it.
                  changed_count=$(wc -l < /tmp/changed.txt | tr -d ' ')
                  if [[ "$changed_count" -gt 200 ]]; then
                      fall_back over_ceiling "$changed_count files"
                      exit 0
                  fi

                  # Skip when jest config / build / lock files change — these
                  # invalidate jest's resolver, transformer cache, or test discovery
                  # in ways `--findRelatedTests` can't see, so no narrowed run can be
                  # trusted. Pattern matches mirror the frontend_code paths-filter
                  # in `changes`.
                  while IFS= read -r f; do
                      case "$f" in
                          jest.*.ts|babel.config.js|tsconfig.json|tsconfig.*.json|\
                          package.json|pnpm-lock.yaml|webpack.config.js|\
                          .github/workflows/ci-frontend.yml|.nvmrc)
                              fall_back config_change "$f"
                              exit 0
                              ;;
                      esac
                  done < /tmp/changed.txt

                  # Filter the diff to source files jest can resolve. Any code under
                  # frontend/, products/, common/, ee/frontend/ — anything else (docs,
                  # workflows, backend) doesn't reach the jest module graph. Convert
                  # repo-root paths to paths relative to the @posthog/frontend package
                  # cwd because `pnpm --filter=@posthog/frontend exec` runs from there.
                  CHANGED_FILES=$(
                      awk '
                          /\.(ts|tsx|js|jsx|mjs|cjs)$/ {
                              if ($0 ~ /^frontend\//) {
                                  sub(/^frontend\//, "", $0)
                                  print
                                  next
                              }
                              if ($0 ~ /^(products|common|ee\/frontend)\//) {
                                  print "../" $0
                              }
                          }
                      ' /tmp/changed.txt | tr '\n' ' ' | sed 's/ $//'
                  )

                  if [[ -z "$CHANGED_FILES" ]]; then
                      # No frontend source changes (e.g. PR only edits backend or docs)
                      # but `frontend_code` paths-filter still flagged the PR. Skip jest.
                      {
                          echo "mode=selective"
                          echo 'matrix={"include":[]}'
                          echo "should_run=false"
                          echo "changed_files="
                          echo "changed_file_count=$changed_count"
                          echo "selected_file_count=0"
                          echo "shard_count=0"
                          echo "full_run_reason_category="
                          echo "full_run_reason_detail="
                      } >> "$GITHUB_OUTPUT"
                      echo "Selective mode: no frontend source files changed, skipping jest"
                      exit 0
                  fi

                  # Selective mode uses two shards because a widely imported source file
                  # can make --findRelatedTests approach a full suite. --findRelatedTests
                  # walks jest's import graph from these files and runs the matching
                  # *.test.* files.
                  SELECTED_COUNT=$(echo "$CHANGED_FILES" | wc -w | tr -d ' ')
                  {
                      echo "mode=selective"
                      echo 'matrix={"include":[{"segment":"app","chunk":1,"shard_count":2},{"segment":"app","chunk":2,"shard_count":2}]}'
                      echo "should_run=true"
                      echo "changed_files=$CHANGED_FILES"
                      echo "changed_file_count=$changed_count"
                      echo "selected_file_count=$SELECTED_COUNT"
                      echo "shard_count=2"
                      echo "full_run_reason_category="
                      echo "full_run_reason_detail="
                  } >> "$GITHUB_OUTPUT"
                  echo "Selective mode: $SELECTED_COUNT frontend source files"

    frontend-format:
        name: Frontend formatting
        needs: changes
        # Not on the hourly cron: that lane exists for jest only, and formatting
        # already ran on the push that landed each commit.
        if: needs.changes.outputs.frontend == 'true' && github.event_name != 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Mint setup-action GitHub token
              id: setup-gh-token
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              continue-on-error: true
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_SETUP_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_PRIVATE_KEY }}
                  skip-token-revoke: true

            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/playwright... install --frozen-lockfile
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}

            - name: Prepare frontend
              run: bin/turbo --filter=@posthog/frontend prepare

            - name: Check formatting with oxfmt
              run: pnpm run format:frontend:check

            - name: Lint with Stylelint
              run: pnpm run lint:css

            # Product colour tokens are named as plain strings from TypeScript manifests and
            # empty-state configs, so nothing type-checks them. A reference to a token that no
            # longer exists renders a whole surface colourless without failing anything else.
            - name: Check product colour tokens all resolve
              run: pnpm --filter=@posthog/frontend check-color-tokens

            - name: Lint with Oxlint
              run: pnpm exec oxlint --quiet

            # Oxlint has no cyclomatic complexity rule. Warn-only while the backlog
            # settles: findings annotate the diff and land in the shared CI report
            # comment, never a job failure. Scoped to the PR's own diff, no repo-wide
            # baseline. Skip on unrebased branches: bin/lint-complexity.mjs may not
            # exist yet.
            - name: Check cyclomatic complexity of changed files
              if: github.event_name == 'pull_request' && needs.changes.outputs.complexity_files != ''
              env:
                  # Space-separated, from paths-filter (list-files: escape) — the PR
                  # files API, so no git-diff plumbing to drift from what the PR changed.
                  CHANGED_FILES: ${{ needs.changes.outputs.complexity_files }}
              run: |
                  if [ ! -f bin/lint-complexity.mjs ]; then
                      echo "bin/lint-complexity.mjs not present on this branch yet — skipping (rebase to pick it up)"
                      exit 0
                  fi
                  # xargs re-parses the escape format, keeping escaped paths whole.
                  printf '%s' "$CHANGED_FILES" | xargs -r node bin/lint-complexity.mjs --report complexity-findings-ts.json

            - name: Post CI report — complexity
              if: always() && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'trunk-merge/')
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  if [ -f .github/scripts/post-complexity-section.mjs ] && [ -f complexity-findings-ts.json ]; then
                      node .github/scripts/post-complexity-section.mjs typescript complexity-findings-ts.json
                  else
                      echo "Skipping the complexity report section: script or findings not on this branch"
                  fi

            - name: Check markdown formatting with oxfmt
              run: pnpm exec oxfmt --check "**/*.{md,mdx}"

            - name: Check YAML formatting with oxfmt
              run: pnpm exec oxfmt --check "**/*.{yaml,yml}"

            - name: Lint markdown files
              run: pnpm exec markdownlint-cli2 --config .config/.markdownlint-cli2.jsonc "**/*.{md,mdx}"

    frontend-bundle-size:
        name: Frontend bundle size
        needs: [changes]
        # Not on the hourly cron: the vs-base comparison build is pull_request-only,
        # so a cron run measures an absolute size with nothing to compare it against.
        if: needs.changes.outputs.frontend_code == 'true' && github.event_name != 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  filter: blob:none

            # The bundle-size build below git-resets to the base branch mid-job, which
            # removes this repo's local actions from the workspace — a local
            # ./.github/actions/pnpm-install would then fail in its post phase. Use
            # inline cache steps (remote actions, no workspace-dependent post) sharing
            # the same pnpm-<os>-<lockhash> key.
            - name: Install pnpm
              uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

            - name: Fix node-gyp permissions
              run: find ~/setup-pnpm -name gyp_main.py -exec chmod +x {} +

            - name: Mint setup-action GitHub token
              id: setup-gh-token
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              continue-on-error: true
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_SETUP_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_PRIVATE_KEY }}
                  skip-token-revoke: true

            - name: Set up Node.js
              uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version-file: .nvmrc
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}

            - name: Get pnpm store path
              id: pnpm-store
              run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - name: Restore pnpm cache
              uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: pnpm-${{ runner.os }}-

            - name: Install package.json dependencies with pnpm
              run: pnpm --filter=@posthog/playwright... install --frozen-lockfile

            - name: Save pnpm cache
              if: github.ref == 'refs/heads/master'
              uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

            - name: Prepare frontend
              run: bin/turbo --filter=@posthog/frontend prepare

            - name: Build products
              run: pnpm --filter=@posthog/frontend build:products

            # Vendored replacement for preactjs/compressed-size-action: build the PR branch,
            # then git-reset to the base branch and rebuild so the bundle-size and eager-graph
            # reports (both written by build:with-report) get a vs-base baseline. The base
            # build runs LAST in the same workspace, so the plain report filenames hold the
            # base numbers while the sha-suffixed ones hold the PR build's — the post scripts
            # pick the PR report by sha and treat the plain file as the base. Reports are
            # untracked, so they survive `git reset --hard` onto the base tree. A failing base
            # build (build:with-report runs the eager-graph check in --report-only) must never
            # abort the job for every open PR, so budgets are enforced warn-only further down.
            - name: Build frontend (bundle-size + eager-graph report)
              run: pnpm --filter=@posthog/frontend build:with-report

            # Measured before the base build overwrites dist/. Untracked, so it survives the
            # git reset --hard onto the base tree; the dist-size section reads it back.
            - name: Measure PR dist size
              run: du -sb frontend/dist | cut -f1 > frontend/dist-size-pr.txt

            # Runs against the PR's own build, before the base rebuild below overwrites dist/.
            - name: Check toolbar bundle stays under the CloudFront gzip limit
              run: pnpm --filter=@posthog/frontend check-toolbar-size

            # Runs against the PR's own metafile, before the base rebuild overwrites it.
            - name: Check toolbar graph stays inside its module boundary
              run: pnpm --filter=@posthog/frontend check-toolbar-graph

            # Keep the PR-side poster available after the base reset below. This is especially
            # important on the PR that introduces or updates the poster itself.
            - name: Preserve PR toolbar report poster
              if: github.event_name == 'pull_request'
              run: |
                  if [ -f frontend/bin/post-toolbar-size-comment.mjs ]; then
                      cp frontend/bin/post-toolbar-size-comment.mjs frontend/bin/post-toolbar-size-comment-pr.mjs
                  fi

            - name: Build base branch for size comparison
              # A broken base build (install/esbuild — which --report-only does not cover) must
              # only cost the vs-base delta, never redden every open PR's job. The comment steps
              # below already degrade to "no base measurement" when the base reports are absent.
              continue-on-error: true
              if: github.event_name == 'pull_request'
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  git fetch -n origin "$BASE_SHA"
                  git reset --hard "$BASE_SHA"
                  # dist/ is untracked so it survives the reset. Without a clean, the base
                  # build layers differently-hashed chunks on top of the PR's, inflating the
                  # base measurement by hundreds of MiB and making every PR's dist-size delta
                  # a large spurious negative. The build never cleans dist/ itself.
                  rm -rf frontend/dist
                  pnpm --filter=@posthog/frontend... install
                  pnpm --filter=@posthog/frontend build:with-report
                  du -sb frontend/dist | cut -f1 > frontend/dist-size-base.txt

            # Each frontend check contributes one section to a single ci-report comment
            # (how a section writer picks the PR vs base report is report-files.mjs's story).
            # After the base build the tree is on the BASE branch, so guard for the scripts'
            # absence (also covers branches predating a check). Budgets are surfaced
            # warn-only further down.
            # Comment steps skip trunk-merge/**: merge-queue draft PRs are ephemeral and
            # unread, and each section write spends shared GITHUB_TOKEN budget.
            - name: Clean up legacy per-check CI comments
              if: always() && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'trunk-merge/')
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  if [ -f frontend/bin/ci-report/delete-legacy-comments.mjs ]; then
                      node frontend/bin/ci-report/delete-legacy-comments.mjs
                  else
                      echo "Skipping legacy CI comment cleanup — script not present on this checkout"
                  fi

            - name: Post CI report — eager graph
              if: always() && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'trunk-merge/')
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  if [ -f frontend/bin/post-eager-graph-comment.mjs ]; then
                      node frontend/bin/post-eager-graph-comment.mjs
                  else
                      echo "Skipping eager graph section — script not present on this checkout"
                  fi

            - name: Post CI report — bundle size
              if: always() && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'trunk-merge/')
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  if [ -f frontend/bin/post-bundle-size-comment.mjs ]; then
                      node frontend/bin/post-bundle-size-comment.mjs
                  else
                      echo "Skipping bundle size section — script not present on this checkout"
                  fi

            - name: Post CI report — dist size
              if: always() && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'trunk-merge/')
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  if [ -f frontend/bin/post-dist-size-comment.mjs ]; then
                      node frontend/bin/post-dist-size-comment.mjs
                  else
                      echo "Skipping dist size section — script not present on this checkout"
                  fi

            - name: Post CI report — toolbar bundle
              if: always() && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'trunk-merge/')
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  if [ -f frontend/bin/post-toolbar-size-comment-pr.mjs ]; then
                      node frontend/bin/post-toolbar-size-comment-pr.mjs
                  elif [ -f frontend/bin/post-toolbar-size-comment.mjs ]; then
                      node frontend/bin/post-toolbar-size-comment.mjs
                  else
                      echo "Skipping toolbar bundle section — script not present on this checkout"
                  fi

            - name: Check eager graph budgets (warn only)
              if: always() && github.event_name == 'pull_request'
              run: |
                  if [ ! -f frontend/bin/check-eager-graph.mjs ]; then
                      echo "Skipping eager graph check — script not present on this checkout"
                      exit 0
                  fi
                  REPORT="frontend/eager-graph-report-${GITHUB_SHA}.json"
                  if [ ! -f "$REPORT" ]; then
                      REPORT="frontend/eager-graph-report.json"
                  fi
                  if [ ! -f "$REPORT" ]; then
                      echo "Skipping eager graph check — no report found (branch may predate the check)"
                      exit 0
                  fi
                  node frontend/bin/check-eager-graph.mjs --assert-report "$REPORT"

            - name: Check toolbar for CSP eval violations
              run: pnpm --filter=@posthog/frontend check-toolbar-csp-eval

            - name: Calculate dist folder size
              id: dist-size
              # After the base build the workspace's dist/ holds the BASE branch's build, so
              # read back the PR measurement taken before it — the captured metric must be
              # the PR's size. The du fallback covers runs where that file wasn't written
              # (dist/ is still the PR's own build then).
              run: |
                  size_bytes=$(cat frontend/dist-size-pr.txt 2>/dev/null || du -sb frontend/dist | cut -f1)
                  echo "size_bytes=${size_bytes}" >> $GITHUB_OUTPUT
                  echo "Frontend dist folder size: ${size_bytes} bytes ($(numfmt --to=iec-i --suffix=B ${size_bytes}))"

            - name: Capture bundle size to PostHog
              if: |
                  (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'PostHog/posthog') ||
                  (github.event_name != 'pull_request' && github.repository == 'PostHog/posthog')
              uses: PostHog/posthog-github-action@58dea254b598fb5d469c0699c98af8288a7f7650 # v1.2.0
              with:
                  posthog-token: ${{secrets.POSTHOG_API_TOKEN}}
                  event: 'posthog-ci-frontend-bundle-size'
                  properties: |
                      {
                        "size_bytes": ${{ steps.dist-size.outputs.size_bytes }},
                        "branch": ${{ toJSON(github.head_ref || github.ref_name) }},
                        "sha": ${{ toJSON(github.sha) }},
                        "pr_number": ${{ github.event.pull_request.number || 'null' }},
                        "event_type": ${{ toJSON(github.event_name) }}
                      }
            - name: Capture bundle size to DevEx PostHog
              if: |
                  (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'PostHog/posthog') ||
                  (github.event_name != 'pull_request' && github.repository == 'PostHog/posthog')
              continue-on-error: true
              uses: PostHog/posthog-github-action@58dea254b598fb5d469c0699c98af8288a7f7650 # v1.2.0
              with:
                  posthog-token: ${{ secrets.POSTHOG_DEVEX_PROJECT_API_TOKEN }}
                  event: 'posthog-ci-frontend-bundle-size'
                  properties: |
                      {
                        "size_bytes": ${{ steps.dist-size.outputs.size_bytes }},
                        "branch": ${{ toJSON(github.head_ref || github.ref_name) }},
                        "sha": ${{ toJSON(github.sha) }},
                        "pr_number": ${{ github.event.pull_request.number || 'null' }},
                        "event_type": ${{ toJSON(github.event_name) }}
                      }

    frontend-typescript-checks:
        name: Frontend typechecking
        needs: [changes]
        # Not on the hourly cron: that lane exists for jest only, and typechecking
        # already ran on the push that landed each commit.
        if: needs.changes.outputs.frontend_code == 'true' && github.event_name != 'schedule'
        # tsgo peaks ~12 GB type-checking the whole frontend, which OOM-kills it on a 16 GB
        # runner (ubuntu-latest and depot-ubuntu-24.04-4 alike). Peak tracks the type graph,
        # not parallelism or lib checking: skipLibCheck is already on, GOMAXPROCS and
        # declaration:false change nothing, and dropping all of products/ from include removes
        # only 891 of 13703 files because imports pull them back in. Both runners below give
        # the job 32 GB. Talk to #team-devex before changing.
        #
        # Forks get a GitHub-hosted larger runner instead of Depot: this job runs
        # `pnpm install`, so a fork PR controls lifecycle scripts, and Depot runners inject
        # shared cache credentials ambiently (see _rust-build-images.yml, which skips sccache
        # creds for the same reason). GitHub warns against exposing a larger runner with a
        # static IP range to fork pull requests, so keep this runner's group off static IPs.
        runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && 'depot-ubuntu-24.04-8' || 'ubuntu-24.04-8core' }}
        # Kea typegen invalidates on changes to any logic plus everything that depends on it.
        # For changes to shared core (TaxonomicFilter, Insight, etc.) the dependent set is
        # large, so the budget must fit a cache miss on top of the baseline build.
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Mint setup-action GitHub token
              id: setup-gh-token
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              continue-on-error: true
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_SETUP_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_PRIVATE_KEY }}
                  skip-token-revoke: true

            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/playwright... install --no-frozen-lockfile
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}

            - name: Prepare frontend
              run: bin/turbo --filter=@posthog/frontend prepare

            - name: Restore .typegen cache
              uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: .typegen
                  key: ${{ runner.os }}-typegen-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: ${{ runner.os }}-typegen-

            - name: Build products
              run: pnpm --filter=@posthog/frontend build:products

            - name: Check if products.tsx and products.json are up to date
              run: pnpm --filter=@posthog/frontend build:products && git diff --exit-code

            - name: Kea typegen
              run: pnpm --filter=@posthog/frontend typegen:write

            - name: Re-format files after typegen
              run: pnpm exec oxfmt "./{products,frontend/src}/**/*.{ts,tsx}"

            - name: Save .typegen cache
              if: github.ref == 'refs/heads/master'
              uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: .typegen
                  key: ${{ runner.os }}-typegen-${{ hashFiles('pnpm-lock.yaml') }}

            - parallel:
                  - name: Run typescript check (tsgo)
                    run: pnpm --filter=@posthog/frontend typescript:check

                  - name: Check if schema.json and validators.js are up to date
                    run: pnpm --filter=@posthog/frontend schema:build:json && git diff --exit-code

                  - name: Check if mobile replay "schema.json" is up to date
                    run: pnpm --filter=@posthog/frontend mobile-replay:schema:build:json && git diff --exit-code
                    env:
                        NODE_OPTIONS: --max-old-space-size=8192

                  # The manifest is generated from `urls` (scenes/urls.ts + every product
                  # manifest) and is what the MCP's generate-app-url tool resolves entity
                  # links from. Nothing else reads it, so drift is invisible until an agent
                  # hands a user a 404 — this check is the only thing tying it to its source.
                  - name: Check if app-url-manifest.json is up to date
                    run: pnpm --filter=@posthog/frontend build:app-urls:check

                  - name: Validate SetupTaskId completions
                    run: node bin/validate-setup-tasks.mjs

    jest:
        runs-on: ubuntu-latest
        # PRs run two selective shards over the tests reachable from the changed
        # files. The merge queue runs the full four-shard fanout.
        timeout-minutes: 20
        needs: [changes, select-jest-tests]
        # A status function is required because select-jest-tests is skipped on the
        # merge queue's run and on master pushes, and a skipped need would otherwise
        # cascade a skip here.
        # !cancelled() rather than always() so a superseded run's shards stop promptly.
        # Skipped on master push: the merge queue already ran the full matrix for every
        # landed commit, and the hourly scheduled run keeps master's jest coverage and
        # its Trunk flaky baseline.
        if: |
            !cancelled() && needs.changes.outputs.frontend_code == 'true'
            && needs.select-jest-tests.outputs.should_run != 'false'
            && github.event_name != 'push'
        name: Jest test (${{ matrix.segment }} - ${{ matrix.chunk }})
        strategy:
            # If one test fails, still run the others
            fail-fast: false
            # On PRs, select-jest-tests narrows this to the tests reachable from the
            # changed frontend source files, skips jest entirely (should_run=false) on
            # a draft whose selection can't be trusted, or emits the full fanout when a
            # ready PR's can't be. On the merge queue's run and the hourly scheduled run
            # the job is skipped and this default applies: the full four-chunk fanout.
            # Master pushes do not reach here at all (see the `if` above).
            # `segment` is a single fixed value: it survives only as the naming
            # token for job, JUnit file and artifact, which the timings reporter
            # parses as `junit-results-frontend-<segment>-<chunk>`. There used to
            # be a second FOSS segment that deleted ee/ and re-ran the suite, but
            # ee/ holds no frontend code and nothing under frontend/, products/,
            # common/ or packages/ imports from it, so the two segments ran
            # byte-identical suites.
            matrix: ${{ fromJson(needs.select-jest-tests.outputs.matrix || '{"segment":["app"],"chunk":[1,2,3,4]}') }}

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Mint setup-action GitHub token
              id: setup-gh-token
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              continue-on-error: true
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_SETUP_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_PRIVATE_KEY }}
                  skip-token-revoke: true

            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/frontend... install --frozen-lockfile
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}

            - name: Test with Jest
              id: run-jest
              # continue-on-error so a failure doesn't fail the job here; the quarantine
              # gate below is the verdict — it passes when every failure is an
              # already-quarantined flake, fails otherwise.
              continue-on-error: true
              env:
                  NODE_OPTIONS: --max-old-space-size=16384
                  SHARD_INDEX: ${{ matrix.chunk }}
                  SHARD_COUNT: ${{ matrix.shard_count || 4 }}
                  MODE: ${{ needs.select-jest-tests.outputs.mode }}
                  CHANGED_FILES: ${{ needs.select-jest-tests.outputs.changed_files }}
                  JEST_JUNIT_OUTPUT_DIR: ${{ github.workspace }}/junit-results
                  JEST_JUNIT_OUTPUT_NAME: junit-${{ matrix.segment }}-${{ matrix.chunk }}.xml
                  # Trunk attributes flakes by test file; jest-junit's default suite name is the
                  # top-level describe, which collides across files. Anchor identity to the file.
                  JEST_JUNIT_SUITE_NAME: '{filepath}'
                  JEST_JUNIT_ADD_FILE_ATTRIBUTE: 'true'
              run: |
                  if [ "$MODE" = "selective" ]; then
                      # --findRelatedTests walks jest's import graph from the changed
                      # source files and runs the matching tests. Sharding keeps broad
                      # import graphs within the job timeout.
                      #
                      # No --testPathPattern: it is mutually exclusive with
                      # --findRelatedTests (jest folds both into one path regex and
                      # matches nothing), and CHANGED_FILES is already scoped to
                      # frontend source files by select-jest-tests. --passWithNoTests
                      # so a changed source file with no related test doesn't fail the
                      # run — the merge queue's trunk-merge/** run is the gate.
                      pnpm --filter=@posthog/frontend build:products
                      # shellcheck disable=SC2086
                      pnpm --filter=@posthog/frontend exec jest \
                          --forceExit \
                          --passWithNoTests \
                          --shard=$SHARD_INDEX/$SHARD_COUNT \
                          --findRelatedTests $CHANGED_FILES
                  else
                      # 100% = one worker per available core. Public-repo ubuntu-latest
                      # runners have 4 vCPUs; a hardcoded 2 left half the machine idle.
                      bin/turbo run test --filter=@posthog/frontend -- --maxWorkers=100%
                  fi

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  # Keep attempt 1's artifact available so the reporter can identify same-job
                  # failures that pass when GitHub re-runs failed jobs on the same commit.
                  name: junit-results-frontend-${{ matrix.segment }}-${{ matrix.chunk }}${{ github.run_attempt != '1' && format('-attempt{0}', github.run_attempt) || '' }}
                  path: |
                      junit-results/junit-*.xml
                      junit-results/posthog-jest-quarantine-*.jsonl
                  if-no-files-found: ignore
                  retention-days: 1

            # Best-effort Trunk upload (continue-on-error); the "Fail on jest failure" step below is
            # the verdict, so a Trunk outage can't red a passing shard. Internal PRs only (needs the
            # secret). No Trunk variant: variants told apart the old FOSS and EE uploads of the same
            # test files, and only one segment remains.
            # TRUNK_UPLOAD_ENABLED is the master kill-switch: when it is not 'true' this gate
            # skips, so nothing uploads and no known flakes are quarantined. TRUNK_QUARANTINE_ENABLED
            # splits the two — it defaults off, so set it to 'true' to let the verdict step below mask
            # known flakes; otherwise any real failure reds the job (quarantining needs upload on too).
            - name: Quarantine gate
              id: quarantine_gate
              continue-on-error: true
              if: ${{ !cancelled() && env.RUNS_ON_INTERNAL_PR == 'true' && github.repository == 'PostHog/posthog' && github.actor != 'dependabot[bot]' && vars.TRUNK_UPLOAD_ENABLED == 'true' }}
              uses: ./.github/actions/trunk-quarantine-gate
              with:
                  junit-paths: junit-results/junit-${{ matrix.segment }}-${{ matrix.chunk }}.xml
                  previous-step-outcome: ${{ steps.run-jest.outcome }}
                  token: ${{ secrets.TRUNK_API_TOKEN }}
            # Verdict: red a real failure the gate didn't clear as a quarantined flake. != 'success'
            # also covers the skipped gate on fork/Dependabot. Passing shards never red here.
            - name: Fail on jest failure
              if: ${{ !cancelled() && steps.run-jest.outcome == 'failure' && (vars.TRUNK_QUARANTINE_ENABLED != 'true' || steps.quarantine_gate.outcome != 'success') }}
              shell: bash
              run: exit 1

    jest-replay-shared:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: changes
        if: needs.changes.outputs.replay_shared == 'true'
        name: Jest test (replay-shared)
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Mint setup-action GitHub token
              id: setup-gh-token
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              continue-on-error: true
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_SETUP_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_PRIVATE_KEY }}
                  skip-token-revoke: true

            # Full workspace install: the suite's jsdom test environment resolves
            # through the workspace root, not the package's own dependencies, so a
            # filtered install can't run it.
            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}

            - name: Test with Jest
              id: run-jest
              # continue-on-error so the quarantine gate below is the verdict.
              continue-on-error: true
              env:
                  JEST_JUNIT_OUTPUT_DIR: ${{ github.workspace }}/junit-results
                  JEST_JUNIT_OUTPUT_NAME: junit-replay-shared.xml
                  # Anchor flake identity to the test file, matching the main jest job.
                  JEST_JUNIT_SUITE_NAME: '{filepath}'
                  JEST_JUNIT_ADD_FILE_ATTRIBUTE: 'true'
              run: pnpm --filter=@posthog/replay-shared test

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: junit-results-replay-shared
                  path: junit-results/junit-*.xml
                  if-no-files-found: ignore
                  retention-days: 1

            # Best-effort Trunk upload (continue-on-error); the "Fail on jest failure" step below is
            # the verdict. See the jest job for the full rationale.
            # TRUNK_UPLOAD_ENABLED is the master kill-switch: when it is not 'true' this gate
            # skips, so nothing uploads and no known flakes are quarantined. TRUNK_QUARANTINE_ENABLED
            # splits the two — it defaults off, so set it to 'true' to let the verdict step below mask
            # known flakes; otherwise any real failure reds the job (quarantining needs upload on too).
            - name: Quarantine gate
              id: quarantine_gate
              continue-on-error: true
              if: ${{ !cancelled() && env.RUNS_ON_INTERNAL_PR == 'true' && github.repository == 'PostHog/posthog' && github.actor != 'dependabot[bot]' && vars.TRUNK_UPLOAD_ENABLED == 'true' }}
              uses: ./.github/actions/trunk-quarantine-gate
              with:
                  junit-paths: junit-results/junit-replay-shared.xml
                  variant: replay-shared
                  previous-step-outcome: ${{ steps.run-jest.outcome }}
                  token: ${{ secrets.TRUNK_API_TOKEN }}
            - name: Fail on jest failure
              if: ${{ !cancelled() && steps.run-jest.outcome == 'failure' && (vars.TRUNK_QUARANTINE_ENABLED != 'true' || steps.quarantine_gate.outcome != 'success') }}
              shell: bash
              run: exit 1

    report-test-signals:
        name: Report Jest test signals
        needs: [jest]
        runs-on: ubuntu-latest
        continue-on-error: true
        timeout-minutes: 10
        permissions:
            actions: read
            contents: read
        # Runs on every attempt so a same-job failure followed by a pass proves a flake. The
        # parser comes from the trusted base ref because this job receives project tokens.
        if: >-
            !cancelled() &&
            needs.jest.result != 'skipped' &&
            github.repository == 'PostHog/posthog' &&
            (
            (github.event_name != 'pull_request' && github.ref == 'refs/heads/master') ||
            (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == 'PostHog/posthog')
            )
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
                  fetch-depth: 1
            - name: Check for trusted test reporter
              id: test-reporter
              shell: bash
              run: |
                  available=false
                  if [[ -f .github/scripts/report_test_timings.py && -d tools/owners ]] && grep -q -- '"jest"' .github/scripts/report_test_timings.py; then
                    available=true
                  fi
                  if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]] && ! grep -q "def partition_run_attempt" .github/scripts/report_test_timings.py 2>/dev/null; then
                    available=false
                  fi
                  if [[ "$available" != "true" ]]; then
                    echo "Trusted Jest reporter is not available on the checked-out ref for attempt $GITHUB_RUN_ATTEMPT; skipping emit."
                  fi
                  echo "available=$available" >> "$GITHUB_OUTPUT"
            - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              if: steps.test-reporter.outputs.available == 'true'
              with:
                  version: '0.11.28'
            - name: Download Jest results
              if: steps.test-reporter.outputs.available == 'true'
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  path: ./junit-artifacts
                  pattern: junit-results-frontend-*
            - name: Emit per-test signals
              if: steps.test-reporter.outputs.available == 'true'
              continue-on-error: true
              env:
                  POSTHOG_DEVEX_PROJECT_API_TOKEN: ${{ secrets.POSTHOG_DEVEX_PROJECT_API_TOKEN }}
                  POSTHOG_CI_TRACES_EXTRA_TOKEN: ${{ secrets.POSTHOG_API_TOKEN }}
                  POSTHOG_OTLP_TRACES_ENDPOINT: ${{ vars.POSTHOG_OTLP_TRACES_ENDPOINT || 'https://us.i.posthog.com/i/v1/traces' }}
              run: |
                  uv run --script .github/scripts/report_test_timings.py \
                      --runner=jest \
                      --signals-only \
                      ./junit-artifacts

    calculate-running-time:
        name: Calculate running time
        needs:
            [
                jest,
                jest-replay-shared,
                frontend-typescript-checks,
                frontend-format,
                frontend-bundle-size,
                frontend_tests,
                changes,
            ]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: # Run on pull requests to PostHog/posthog + on PostHog/posthog outside of PRs - but never on forks or Dependabot (no secrets access)
            ${{ !cancelled() && github.actor != 'dependabot[bot]' &&
            needs.changes.outputs.frontend_code == 'true' && (
            (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'PostHog/posthog') ||
            (github.event_name != 'pull_request' && github.repository == 'PostHog/posthog')) }}
        steps:
            - name: Get telemetry app token
              id: telemetry-app-token
              if: github.run_attempt == '1'
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ vars.GH_APP_TELEMETRY_APP_ID }}
                  private-key: ${{ secrets.GH_APP_TELEMETRY_PRIVATE_KEY }}
            - name: Capture running time to PostHog
              if: github.run_attempt == '1'
              continue-on-error: true
              uses: PostHog/posthog-github-action@58dea254b598fb5d469c0699c98af8288a7f7650 # v1.2.0
              with:
                  posthog-token: ${{ secrets.POSTHOG_API_TOKEN }}
                  event: 'posthog-ci-running-time'
                  capture-run-duration: true
                  capture-job-durations: true
                  github-token: ${{ steps.telemetry-app-token.outputs.token }}
                  status-job: 'Frontend Tests Pass'
                  runner: 'github'
            - name: Capture running time to DevEx PostHog
              if: github.run_attempt == '1'
              continue-on-error: true
              uses: PostHog/posthog-github-action@58dea254b598fb5d469c0699c98af8288a7f7650 # v1.2.0
              with:
                  posthog-token: ${{ secrets.POSTHOG_DEVEX_PROJECT_API_TOKEN }}
                  event: 'posthog-ci-running-time'
                  capture-run-duration: true
                  capture-job-durations: true
                  github-token: ${{ steps.telemetry-app-token.outputs.token }}
                  status-job: 'Frontend Tests Pass'
                  runner: 'github'

    # Jest-selection telemetry -> DevEx project (347861), alongside the equivalent
    # events for the backend (posthog-ci-test-selection) and Playwright
    # (posthog-ci-e2e-spec-selection). Without it the fallback rate of this selector
    # is only readable by opening runs one at a time.
    # Emitted on full runs too — the merge queue's trunk-merge/** run raises a
    # pull_request event, so `mode=full` there is the baseline selective runs are
    # measured against. Minutes are not duplicated here: join run_id to the runId on
    # posthog-ci-running-time-job, which already carries each shard's duration.
    # Telemetry never reds CI (continue-on-error).
    # hogli-lint: not-a-required-gate — reads results to describe the run, gates nothing
    capture-jest-selection:
        name: Capture jest selection
        needs: [select-jest-tests, jest]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        # Either the selector reached a decision, or jest ran without it (the full-run
        # baseline). Neither holds on a frontend-untouched PR, and there is nothing to
        # report there. Forks and Dependabot never have the secret.
        if: >-
            !cancelled() && github.run_attempt == '1'
            && github.event_name == 'pull_request'
            && github.actor != 'dependabot[bot]'
            && github.event.pull_request.head.repo.full_name == 'PostHog/posthog'
            && (needs.select-jest-tests.outputs.mode != ''
                || needs.jest.result == 'success'
                || needs.jest.result == 'failure')
        steps:
            - name: Capture jest selection to DevEx PostHog
              continue-on-error: true
              uses: PostHog/posthog-github-action@58dea254b598fb5d469c0699c98af8288a7f7650 # v1.2.0
              with:
                  posthog-token: ${{ secrets.POSTHOG_DEVEX_PROJECT_API_TOKEN }}
                  event: 'posthog-ci-jest-selection'
                  properties: |
                      {
                        "mode": ${{ toJSON(needs.select-jest-tests.outputs.mode || 'full') }},
                        "selection_eligible": ${{ needs.select-jest-tests.result == 'success' }},
                        "changed_file_count": ${{ needs.select-jest-tests.outputs.changed_file_count || 'null' }},
                        "selected_file_count": ${{ needs.select-jest-tests.outputs.selected_file_count || 'null' }},
                        "shard_count": ${{ needs.select-jest-tests.outputs.shard_count || 'null' }},
                        "full_run_reason_category": ${{ toJSON(needs.select-jest-tests.outputs.full_run_reason_category || '') }},
                        "full_run_reason_detail": ${{ toJSON(needs.select-jest-tests.outputs.full_run_reason_detail || '') }},
                        "jest_result": ${{ toJSON(needs.jest.result) }},
                        "pr_draft": ${{ toJSON(github.event.pull_request.draft) }},
                        "merge_queue": ${{ startsWith(github.head_ref, 'trunk-merge/') }},
                        "event_type": ${{ toJSON(github.event.action) }},
                        "branch": ${{ toJSON(github.head_ref || github.ref_name) }},
                        "sha": ${{ toJSON(github.sha) }},
                        "pr_number": ${{ github.event.pull_request.number || 'null' }},
                        "run_id": ${{ toJSON(github.run_id) }}
                      }

    frontend_tests:
        needs: [jest, jest-replay-shared, frontend-format, frontend-bundle-size, frontend-typescript-checks]
        name: Frontend Tests Pass
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: always()
        steps:
            - run: exit 0
            - name: Check outcomes
              run: |
                  if [[ "${{ needs.jest.result }}" != "success" && "${{ needs.jest.result }}" != "skipped" ]]; then
                    echo "Frontend jest tests failed."
                    exit 1
                  fi
                  echo "Frontend jest tests passed."
                  if [[ "${{ needs.jest-replay-shared.result }}" != "success" && "${{ needs.jest-replay-shared.result }}" != "skipped" ]]; then
                    echo "Replay shared jest tests failed."
                    exit 1
                  fi
                  echo "Replay shared jest tests passed."
                  if [[ "${{ needs.frontend-format.result }}" != "success" && "${{ needs.frontend-format.result }}" != "skipped" ]]; then
                    echo "Frontend linting failed."
                    exit 1
                  fi
                  echo "Frontend linting passed."
                  if [[ "${{ needs.frontend-bundle-size.result }}" != "success" && "${{ needs.frontend-bundle-size.result }}" != "skipped" ]]; then
                    echo "Frontend bundle size checks failed."
                    exit 1
                  fi
                  echo "Frontend bundle size checks passed."
                  if [[ "${{ needs.frontend-typescript-checks.result }}" != "success" && "${{ needs.frontend-typescript-checks.result }}" != "skipped" ]]; then
                    echo "Frontend TypeScript checks failed."
                    exit 1
                  fi
                  echo "Frontend TypeScript checks passed."
