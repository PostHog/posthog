name: HogQL Language Service Container Image CD

on:
    push:
        branches:
            - master
        paths:
            - 'services/hogql-language-service/**'
            - '.github/workflows/cd-hogql-lang-service-image.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.sha }}
    cancel-in-progress: false

jobs:
    build:
        name: Build and push container image
        if: |
            github.repository_owner == 'PostHog' &&
            (
                github.event_name == 'push' ||
                (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
            )
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
            id-token: write

        outputs:
            sha: ${{ steps.push.outputs.digest }}

        steps:
            - name: Check out
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: services/hogql-language-service/
                  sparse-checkout-cone-mode: false

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
              with:
                  role-to-assume: ${{ vars.AWS_ECR_POSTHOG_MASTER_PUBLISH_IAM_ROLE }}
                  aws-region: us-east-1

            - name: Login to Amazon ECR
              id: aws-ecr
              uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78 # v2.1.2

            - name: Image metadata and ordered release tag
              id: docker-meta
              uses: PostHog/shared-actions/container-image-metadata@2427cf9968667894226f164eab356d96ca930b22 # v1, shared-actions#51
              with:
                  images: ${{ steps.aws-ecr.outputs.registry }}/hogql-lang-service
                  extra-tags: |
                      type=ref,event=branch
                      type=raw,value=${{ github.sha }}
                      type=raw,value=latest,enable={{is_default_branch}}
                  generate-ordered-release-tag: 'true'

            - name: Set up Depot CLI
              uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1

            - name: Build and push container image
              id: push
              uses: depot/build-push-action@5f3b3c2e5a00f0093de47f657aeaefcedff27d18 # v1.17.0
              with:
                  project: c1f2m5s6zd
                  context: ./services/hogql-language-service
                  file: ./services/hogql-language-service/Dockerfile
                  buildx-fallback: false
                  push: ${{ github.ref == 'refs/heads/master' && vars.CD_DEPLOY_ENABLED == 'true' }}
                  tags: ${{ steps.docker-meta.outputs.tags }}
                  labels: ${{ steps.docker-meta.outputs.labels }}
                  annotations: ${{ steps.docker-meta.outputs.annotations }}
                  platforms: linux/arm64,linux/amd64
                  build-args: COMMIT_HASH=${{ github.sha }}

            - name: Publish ordered release tag
              if: vars.CD_DEPLOY_ENABLED == 'true'
              uses: PostHog/shared-actions/container-image-metadata@2427cf9968667894226f164eab356d96ca930b22 # v1, shared-actions#51
              with:
                  images: ${{ steps.aws-ecr.outputs.registry }}/hogql-lang-service
                  publish-ordered-release-tag: 'true'
                  ordered-release-tag: ${{ steps.docker-meta.outputs.ordered-release-tag }}
                  ordered-release-digest: ${{ steps.push.outputs.digest }}

    deploy:
        name: Trigger HogQL language service deployment
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        needs: build
        if: github.event_name == 'push' && github.repository_owner == 'PostHog' && vars.CD_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/master'
        permissions: {}

        steps:
            - name: Get deployer token
              id: deployer
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_CHARTS_DEPLOYER_APP_ID }}
                  private-key: ${{ secrets.GH_APP_CHARTS_DEPLOYER_PRIVATE_KEY }}
                  owner: PostHog
                  repositories: charts

            - name: Get PR labels
              id: labels
              uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
              with:
                  script: |
                      const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        commit_sha: context.sha,
                      });
                      const labels = pulls.flatMap(pr => pr.labels.map(l => l.name));
                      return JSON.stringify([...new Set(labels)]);

            - name: Trigger HogQL language service deployment
              uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
              with:
                  token: ${{ steps.deployer.outputs.token }}
                  repository: PostHog/charts
                  event-type: commit_state_update
                  client-payload: |
                      {
                        "values": {
                          "image": {
                            "sha": "${{ needs.build.outputs.sha }}"
                          }
                        },
                        "release": "hogql-lang-service",
                        "commit": ${{ toJson(github.event.head_commit) }},
                        "repository": ${{ toJson(github.repository) }},
                        "labels": ${{ steps.labels.outputs.result }},
                        "timestamp": "${{ github.event.head_commit.timestamp }}"
                      }
