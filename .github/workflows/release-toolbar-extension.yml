name: Release toolbar extension

# Releases the toolbar Chrome extension from Sampo changesets in frontend/src/toolbar/extension/release/.
# A changeset on master asks for approval, then opens a release pull request that bumps the version.
# Merging that pull request builds the extension and submits it to the Chrome Web Store.
# See "Releases" in frontend/src/toolbar/extension/README.md.

on:
    push:
        branches:
            - master
        paths:
            - 'frontend/src/toolbar/extension/release/.sampo/changesets/*.md'
    workflow_dispatch:
        inputs:
            release_commit:
                description: Merge commit of the toolbar extension release pull request
                required: true
                type: string
            skip_upload:
                description: Submit the version already uploaded to the store, for a run that uploaded it but failed to submit it
                required: false
                type: boolean
                default: false

permissions:
    contents: read

env:
    SAMPO_VERSION: 0.17.4
    RELEASE_DIR: frontend/src/toolbar/extension/release
    RELEASE_BRANCH: chore/release-toolbar-extension
    # npm's audit blocks the pnpm bootstrap. See .github/actions/pnpm-install for why.
    NPM_CONFIG_AUDIT: 'false'
    NPM_CONFIG_FUND: 'false'

# Concurrency is per job, not per workflow. GitHub keeps one pending run per group and replaces it with the next one,
# so a workflow-wide group could drop the run of a merged release pull request while a release waits for approval.

jobs:
    check-changesets:
        name: Check for toolbar extension changesets
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            has-changesets: ${{ steps.check.outputs.has-changesets }}
        steps:
            - name: Checkout changesets
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ github.sha }}
                  sparse-checkout: frontend/src/toolbar/extension/release/.sampo/changesets
                  sparse-checkout-cone-mode: false

            - name: Check for changesets
              id: check
              run: |
                  changeset_count=$(find "$RELEASE_DIR/.sampo/changesets" -name '*.md' 2>/dev/null | wc -l)
                  if [ "$changeset_count" -gt 0 ]; then
                      echo "has-changesets=true" >> "$GITHUB_OUTPUT"
                      echo "Found $changeset_count toolbar extension changeset(s)"
                  else
                      echo "has-changesets=false" >> "$GITHUB_OUTPUT"
                      echo "No toolbar extension changesets remain"
                  fi

    notify-approval-needed:
        name: Notify Slack - Approval Needed
        needs: check-changesets
        if: >-
            github.event_name == 'push'
            && github.repository == 'PostHog/posthog'
            && needs.check-changesets.result == 'success'
            && needs.check-changesets.outputs.has-changesets == 'true'
        uses: posthog/.github/.github/workflows/notify-approval-needed.yml@03565438486849ac0d19543de36c248a27d32a2f
        with:
            checkout_repository: false
            slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
            slack_user_group_id: ${{ vars.GROUP_CLIENT_LIBRARIES_SLACK_GROUP_ID }}
            tag_pattern: toolbar-extension/v*
            tag_sort: version
        secrets:
            slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
            posthog_project_api_key: ${{ secrets.POSTHOG_PROJECT_API_KEY }}

    prepare-release:
        name: Prepare toolbar extension release pull request
        needs: [check-changesets, identify-release, notify-approval-needed, publish]
        # A merged release pull request publishes first. Changesets that landed after it then get their own release.
        if: >-
            !cancelled()
            && github.event_name == 'push'
            && github.repository == 'PostHog/posthog'
            && needs.check-changesets.result == 'success'
            && needs.identify-release.result == 'success'
            && (
                (needs.identify-release.outputs.release-commit == '' && needs.publish.result == 'skipped')
                || (needs.identify-release.outputs.release-commit != '' && needs.publish.result == 'success')
            )
            && needs.check-changesets.outputs.has-changesets == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        # Its required reviewers approve each release before the version bump.
        environment: Release toolbar extension
        # A newer run replaces a pending one here, which loses nothing: each run releases every changeset on master.
        concurrency:
            group: release-toolbar-extension-prepare
            cancel-in-progress: false
        permissions:
            actions: read
            contents: read
        outputs:
            new-version: ${{ steps.prepare-release.outputs.new-version }}
            release-pr: ${{ steps.release-pr.outputs.url }}
        steps:
            # GitHub creates a missing environment without reviewers, and the release app approves the release pull
            # request itself, so this approval is the only person in the loop.
            - name: Require reviewers on the release environment
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  reviewer_count=$(gh api "repos/$REPOSITORY/environments/Release%20toolbar%20extension" \
                      --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length')
                  if [ "$reviewer_count" -eq 0 ]; then
                      echo "::error::The 'Release toolbar extension' environment has no required reviewers. Add them before releasing."
                      exit 1
                  fi

            - name: Get GitHub App token
              id: app-token
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_SCHEDULED_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_SCHEDULED_ACTIONS_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - name: Checkout latest master
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: master
                  fetch-depth: 0
                  filter: blob:none
                  token: ${{ steps.app-token.outputs.token }}
                  sparse-checkout: |
                      .config/.markdownlint-cli2.jsonc
                      .github/actions/pnpm-install
                      .github/actions/setup-pnpm
                      .nvmrc
                      package.json
                      patches
                      pnpm-lock.yaml
                      pnpm-workspace.yaml
                      frontend/src/toolbar/extension/release
                  sparse-checkout-cone-mode: false

            - name: Update to latest master
              run: git pull --ff-only origin master

            - name: Check for remaining changesets
              id: recheck-changesets
              run: |
                  changeset_count=$(find "$RELEASE_DIR/.sampo/changesets" -name '*.md' 2>/dev/null | wc -l)
                  if [ "$changeset_count" -gt 0 ]; then
                      echo "has-changesets=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "has-changesets=false" >> "$GITHUB_OUTPUT"
                      echo "No toolbar extension changesets remain; skipping release preparation"
                  fi

            - name: Notify Slack - Approved
              if: steps.recheck-changesets.outputs.has-changesets == 'true' && needs.notify-approval-needed.outputs.slack_ts != ''
              uses: posthog/.github/.github/actions/slack-thread-reply@03565438486849ac0d19543de36c248a27d32a2f
              with:
                  slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
                  slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
                  thread_ts: ${{ needs.notify-approval-needed.outputs.slack_ts }}
                  message: Release approved. Preparing the toolbar extension version bump.
                  emoji_reaction: white_check_mark

            - name: Install Rust
              if: steps.recheck-changesets.outputs.has-changesets == 'true'
              uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
              with:
                  toolchain: 1.91.1
                  components: cargo

            - name: Cache Sampo CLI
              id: cache-sampo
              if: steps.recheck-changesets.outputs.has-changesets == 'true'
              uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                  path: ~/.cargo/bin/sampo
                  key: sampo-${{ runner.os }}-${{ runner.arch }}-${{ env.SAMPO_VERSION }}

            - name: Install Sampo CLI
              if: steps.recheck-changesets.outputs.has-changesets == 'true' && steps.cache-sampo.outputs.cache-hit != 'true'
              run: cargo install sampo --version "$SAMPO_VERSION" --locked

            - name: Prepare release with Sampo
              id: prepare-release
              if: steps.recheck-changesets.outputs.has-changesets == 'true'
              working-directory: ${{ env.RELEASE_DIR }}
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  sampo release
                  new_version=$(jq -r '.version' package.json)
                  # Chrome takes one to four dot-separated integers, so a pre-release version can't ship.
                  if ! printf '%s' "$new_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                      echo "::error::Chrome can't take the version $new_version"
                      exit 1
                  fi
                  echo "new-version=$new_version" >> "$GITHUB_OUTPUT"

            - name: Install markdown tools
              if: steps.prepare-release.outputs.new-version != ''
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm install --frozen-lockfile --ignore-scripts --filter=@posthog/root

            - name: Format the changelog
              if: steps.prepare-release.outputs.new-version != ''
              run: |
                  pnpm exec markdownlint-cli2 --config .config/.markdownlint-cli2.jsonc --fix "$RELEASE_DIR/CHANGELOG.md"
                  pnpm exec markdownlint-cli2 --config .config/.markdownlint-cli2.jsonc "$RELEASE_DIR/CHANGELOG.md"

            - name: Check release changes
              id: check-changes
              if: steps.prepare-release.outputs.new-version != ''
              run: |
                  changed_files=$( (git diff --name-only; git ls-files --others --exclude-standard) | sort -u)
                  if [ -z "$changed_files" ]; then
                      echo "::error::Sampo did not produce any release changes"
                      exit 1
                  fi

                  unexpected=$(echo "$changed_files" | grep -Ev "^$RELEASE_DIR/(package\.json|CHANGELOG\.md|\.sampo/changesets/[^/]+\.md)$" || true)
                  if [ -n "$unexpected" ]; then
                      echo "::error::Unexpected files changed during toolbar extension release preparation:"
                      echo "$unexpected"
                      exit 1
                  fi

                  for required_file in "$RELEASE_DIR/package.json" "$RELEASE_DIR/CHANGELOG.md"; do
                      if ! echo "$changed_files" | grep -qx "$required_file"; then
                          echo "::error::Release preparation did not update $required_file"
                          exit 1
                      fi
                  done

                  echo "committed=true" >> "$GITHUB_OUTPUT"

            # Unrelated commits can land meanwhile. A new changeset can't, because the release would leave it out.
            - name: Ensure the release files did not change during release preparation
              if: steps.check-changes.outputs.committed == 'true'
              run: |
                  git fetch origin master
                  if ! git diff --quiet HEAD FETCH_HEAD -- "$RELEASE_DIR"; then
                      echo "::error::The release files changed on master during release preparation. Re-run the workflow to include the latest changesets."
                      exit 1
                  fi

            - name: Reset release branch to master
              if: steps.check-changes.outputs.committed == 'true'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  release_owner=${REPOSITORY%%/*}
                  existing_prs=$(gh api --paginate "repos/$REPOSITORY/pulls?state=open&base=master&head=$release_owner:$RELEASE_BRANCH" --jq '.[].number')
                  if [ "$(printf '%s\n' "$existing_prs" | sed '/^$/d' | wc -l)" -gt 1 ]; then
                      echo "::error::More than one open toolbar extension release pull request exists"
                      exit 1
                  fi
                  existing_pr=$(printf '%s\n' "$existing_prs" | sed -n '1p')
                  if [ -n "$existing_pr" ] && [ "$(gh api "repos/$REPOSITORY/pulls/$existing_pr" --jq '.draft')" != 'true' ]; then
                      echo "::error::Release pull request #$existing_pr is ready for review or in the merge queue. Wait for it to merge before preparing another release."
                      exit 1
                  fi

                  target_sha=$(git rev-parse HEAD)
                  if gh api "repos/$REPOSITORY/git/ref/heads/$RELEASE_BRANCH" >/dev/null 2>&1; then
                      gh api -X PATCH "repos/$REPOSITORY/git/refs/heads/$RELEASE_BRANCH" \
                          -f sha="$target_sha" -F force=true
                  else
                      gh api "repos/$REPOSITORY/git/refs" \
                          -f ref="refs/heads/$RELEASE_BRANCH" -f sha="$target_sha"
                  fi

            - name: Commit release changes
              id: commit-release
              if: steps.check-changes.outputs.committed == 'true'
              uses: planetscale/ghcommit-action@25309d8005ac7c3bcd61d3fe19b69e0fe47dbdde # v0.2.20
              with:
                  commit_message: 'chore(toolbar): release the extension v${{ steps.prepare-release.outputs.new-version }}'
                  repo: ${{ github.repository }}
                  branch: ${{ env.RELEASE_BRANCH }}
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

            - name: Create or update release pull request
              id: release-pr
              if: steps.commit-release.outputs.commit-hash != ''
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  NEW_VERSION: ${{ steps.prepare-release.outputs.new-version }}
                  RELEASE_COMMIT: ${{ steps.commit-release.outputs.commit-hash }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  body_file="$RUNNER_TEMP/release-pr.md"
                  cat > "$body_file" <<EOF
                  ## Problem

                  Pending toolbar extension changesets need a reviewed version bump before the extension can go to the Chrome Web Store.

                  ## Changes

                  - Prepare the toolbar extension v$NEW_VERSION for release.
                  - Consume the pending Sampo changesets and update the changelog.
                  - Merging this pull request builds the extension and submits it to the Chrome Web Store for review.

                  ## How did you test this code?

                  - The release workflow validates the generated release files before opening this pull request.

                  **Test rationale:** The pull request contains generated release metadata, so the existing toolbar checks cover the extension.

                  ## Release status

                  - No feature flag controls this change <!-- release-status: no-feature-flag -->

                  ## Docs update

                  - None.

                  ## 🤖 Agent context

                  **Autonomy:** Fully autonomous

                  **Agent:** Sampo $SAMPO_VERSION through GitHub Actions

                  This pull request contains deterministic release output from committed changesets.
                  EOF

                  release_owner=${REPOSITORY%%/*}
                  existing_prs=$(gh api --paginate "repos/$REPOSITORY/pulls?state=open&base=master&head=$release_owner:$RELEASE_BRANCH" --jq '.[].number')
                  if [ "$(printf '%s\n' "$existing_prs" | sed '/^$/d' | wc -l)" -gt 1 ]; then
                      echo "::error::More than one open toolbar extension release pull request exists"
                      exit 1
                  fi

                  existing_pr=$(printf '%s\n' "$existing_prs" | sed -n '1p')
                  if [ -n "$existing_pr" ]; then
                      existing_head_sha=$(gh pr view "$existing_pr" --json headRefOid --jq '.headRefOid')
                      if [ "$existing_head_sha" != "$RELEASE_COMMIT" ]; then
                          echo "::error::The existing release pull request does not contain the generated release commit"
                          exit 1
                      fi
                      gh pr edit "$existing_pr" --title "chore(toolbar): release the extension v$NEW_VERSION" --body-file "$body_file"
                      gh pr ready "$existing_pr"
                      pr_url=$(gh pr view "$existing_pr" --json url --jq '.url')
                  else
                      pr_url=$(gh pr create \
                          --title "chore(toolbar): release the extension v$NEW_VERSION" \
                          --body-file "$body_file" \
                          --base master \
                          --head "$RELEASE_BRANCH")
                  fi

                  echo "url=$pr_url" >> "$GITHUB_OUTPUT"

            - name: Get release approval token
              id: release-approval-token
              if: steps.release-pr.outputs.url != ''
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_RELEASER_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_RELEASER_PRIVATE_KEY }}
                  permission-pull-requests: write

            - name: Approve and request Trunk merge
              if: steps.release-approval-token.outputs.token != ''
              env:
                  GH_TOKEN: ${{ steps.release-approval-token.outputs.token }}
                  RELEASE_COMMIT: ${{ steps.commit-release.outputs.commit-hash }}
                  RELEASE_PR: ${{ steps.release-pr.outputs.url }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  pr_data=$(gh pr view "$RELEASE_PR" --json number,headRefOid)
                  pr_number=$(printf '%s' "$pr_data" | jq -r '.number')
                  pr_head=$(printf '%s' "$pr_data" | jq -r '.headRefOid')
                  if [ "$pr_head" != "$RELEASE_COMMIT" ]; then
                      echo "::error::The release pull request head $pr_head is not the generated release commit $RELEASE_COMMIT"
                      exit 1
                  fi

                  gh api "repos/$REPOSITORY/pulls/$pr_number/reviews" \
                      -f event=APPROVE \
                      -f commit_id="$RELEASE_COMMIT" \
                      -f body='Automated approval for the generated toolbar extension release version bump.' >/dev/null

                  gh pr comment "$RELEASE_PR" --body '/trunk merge'

            - name: Notify Slack - Release pull request created
              if: steps.release-pr.outputs.url != '' && needs.notify-approval-needed.outputs.slack_ts != ''
              uses: posthog/.github/.github/actions/slack-thread-reply@03565438486849ac0d19543de36c248a27d32a2f
              with:
                  slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
                  slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
                  thread_ts: ${{ needs.notify-approval-needed.outputs.slack_ts }}
                  message: 'Release pull request created: ${{ steps.release-pr.outputs.url }}. Merging it submits the extension to the Chrome Web Store.'
                  emoji_reaction: eyes

            - name: Notify Slack - Failed
              if: failure() && needs.notify-approval-needed.outputs.slack_ts != ''
              continue-on-error: true
              uses: posthog/.github/.github/actions/slack-thread-reply@03565438486849ac0d19543de36c248a27d32a2f
              with:
                  slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
                  slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
                  thread_ts: ${{ needs.notify-approval-needed.outputs.slack_ts }}
                  message: 'Failed to prepare the toolbar extension release pull request. <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>'
                  emoji_reaction: x

    identify-release:
        name: Identify merged toolbar extension release
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
        outputs:
            new-version: ${{ steps.release-metadata.outputs.new-version }}
            release-commit: ${{ steps.release-metadata.outputs.release-commit }}
        steps:
            - name: Validate manual release branch
              if: github.event_name == 'workflow_dispatch'
              env:
                  RELEASE_REF: ${{ github.ref }}
              run: |
                  if [ "$RELEASE_REF" != 'refs/heads/master' ]; then
                      echo '::error::Run this workflow from master to retry a release.'
                      exit 1
                  fi

            - name: Checkout release metadata
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ inputs.release_commit || github.sha }}
                  fetch-depth: 2
                  sparse-checkout: |
                      frontend/src/toolbar/extension/release
                  sparse-checkout-cone-mode: false

            - name: Identify release commit
              id: release-metadata
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_APP: scheduled-actions-posthog[bot]
                  RELEASE_COMMIT: ${{ inputs.release_commit || github.sha }}
                  EVENT_NAME: ${{ github.event_name }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  release_prs=$(gh api --paginate "repos/$REPOSITORY/commits/$RELEASE_COMMIT/pulls" \
                      --jq ".[] | select(.merged_at != null and .base.ref == \"master\" and .head.ref == \"$RELEASE_BRANCH\") | .number")
                  release_pr_count=$(printf '%s\n' "$release_prs" | sed '/^$/d' | wc -l)
                  if [ "$release_pr_count" -gt 1 ]; then
                      echo "::error::Found more than one merged toolbar extension release pull request for $RELEASE_COMMIT"
                      exit 1
                  fi
                  if [ "$release_pr_count" -eq 0 ]; then
                      if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
                          echo "::error::$RELEASE_COMMIT is not the merge commit of a merged toolbar extension release pull request. Enter its merge commit SHA and retry."
                          exit 1
                      fi
                      echo "No merged toolbar extension release pull request found for $RELEASE_COMMIT"
                      exit 0
                  fi
                  release_pr=$(printf '%s\n' "$release_prs" | sed -n '1p')

                  pr_data=$(gh api "repos/$REPOSITORY/pulls/$release_pr")
                  if [ "$(printf '%s' "$pr_data" | jq -r '.head.repo.full_name // empty')" != "$REPOSITORY" ]; then
                      echo "::error::The release pull request did not come from $REPOSITORY"
                      exit 1
                  fi
                  if [ "$(printf '%s' "$pr_data" | jq -r '.merge_commit_sha // empty')" != "$RELEASE_COMMIT" ]; then
                      echo "::error::The release pull request merge commit does not match $RELEASE_COMMIT"
                      exit 1
                  fi
                  if [ "$(printf '%s' "$pr_data" | jq -r '.user.login')" != "$RELEASE_APP" ]; then
                      echo "::error::The release pull request was not created by $RELEASE_APP"
                      exit 1
                  fi

                  release_head=$(printf '%s' "$pr_data" | jq -r '.head.sha')
                  if [ "$(gh api "repos/$REPOSITORY/commits/$release_head" --jq '.author.login // empty')" != "$RELEASE_APP" ]; then
                      echo "::error::The release pull request head was not created by $RELEASE_APP"
                      exit 1
                  fi

                  release_files=$(gh api --paginate "repos/$REPOSITORY/pulls/$release_pr/files" --jq '.[].filename')
                  unexpected=$(printf '%s\n' "$release_files" | grep -Ev "^$RELEASE_DIR/(package\.json|CHANGELOG\.md|\.sampo/changesets/[^/]+\.md)$" || true)
                  if [ -n "$unexpected" ]; then
                      echo "::error::Unexpected files in the toolbar extension release pull request:"
                      echo "$unexpected"
                      exit 1
                  fi

                  removed_changesets=$(gh api --paginate "repos/$REPOSITORY/pulls/$release_pr/files" \
                      --jq '.[] | select(.status == "removed" and (.filename | test("^frontend/src/toolbar/extension/release/\\.sampo/changesets/[^/]+\\.md$"))) | .filename')
                  if [ -z "$removed_changesets" ]; then
                      echo "::error::The release pull request did not remove a changeset"
                      exit 1
                  fi

                  for required_file in "$RELEASE_DIR/package.json" "$RELEASE_DIR/CHANGELOG.md"; do
                      if ! printf '%s\n' "$release_files" | grep -qx "$required_file"; then
                          echo "::error::The release pull request did not update $required_file"
                          exit 1
                      fi
                  done

                  new_version=$(jq -r '.version' "$RELEASE_DIR/package.json")
                  if ! grep -qx "## $new_version" "$RELEASE_DIR/CHANGELOG.md"; then
                      echo "::error::The changelog has no entry for the toolbar extension $new_version"
                      exit 1
                  fi

                  echo "new-version=$new_version" >> "$GITHUB_OUTPUT"
                  echo "release-commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # Builds without write or OIDC permissions, so dependency code never holds the publishing credentials.
    build:
        name: Build toolbar extension release
        needs: identify-release
        if: >-
            !cancelled()
            && github.repository == 'PostHog/posthog'
            && github.ref == 'refs/heads/master'
            && needs.identify-release.result == 'success'
            && needs.identify-release.outputs.release-commit != ''
        runs-on: depot-ubuntu-24.04-4
        timeout-minutes: 30
        permissions:
            contents: read
        env:
            NEW_VERSION: ${{ needs.identify-release.outputs.new-version }}
        steps:
            - name: Checkout release commit
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ needs.identify-release.outputs.release-commit }}
                  persist-credentials: false
                  # The same paths as ci-toolbar-extension.yml, which builds the extension on pull requests.
                  sparse-checkout: |
                      /*
                      !/*/
                      /frontend/
                      /products/
                      !/products/*/backend/
                      !/products/desktop/
                      !/products/mobile/
                      /common/
                      /packages/
                      /bin/
                      /patches/
                      /.github/actions/
                      /.husky/
                      /docs/onboarding/
                      /services/mcp/src/ui-apps/lib/
                      **/package.json
                  sparse-checkout-cone-mode: false

            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/frontend... install --frozen-lockfile

            - name: Prepare frontend
              run: bin/turbo --filter=@posthog/frontend prepare

            - name: Build products
              run: pnpm --filter=@posthog/frontend build:products

            - name: Build extension
              run: pnpm --filter=@posthog/frontend build:toolbar-extension

            - name: Check the built version
              id: package
              run: |
                  zip_file="frontend/dist/toolbar-extension/posthog-toolbar-chrome-$NEW_VERSION.zip"
                  manifest_version=$(jq -r '.version' frontend/dist/toolbar-extension/chrome/manifest.json)
                  if [ "$manifest_version" != "$NEW_VERSION" ] || [ ! -f "$zip_file" ]; then
                      echo "::error::The build has version $manifest_version, not $NEW_VERSION"
                      exit 1
                  fi
                  echo "zip=$zip_file" >> "$GITHUB_OUTPUT"

            - name: Upload extension zip
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: toolbar-extension-${{ env.NEW_VERSION }}
                  path: ${{ steps.package.outputs.zip }}
                  if-no-files-found: error
                  retention-days: 90

    publish:
        name: Publish toolbar extension to the Chrome Web Store
        needs: [identify-release, build]
        if: >-
            !cancelled()
            && github.repository == 'PostHog/posthog'
            && github.ref == 'refs/heads/master'
            && needs.identify-release.result == 'success'
            && needs.build.result == 'success'
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        # Holds the Chrome Web Store variables, and lets only master use the Google identity.
        environment: chrome-web-store
        # Uploads replace the item's one draft, so publishes run one at a time. A newer release replaces a pending
        # older one, which loses nothing because the newer version carries the older changes.
        concurrency:
            group: release-toolbar-extension-publish
            cancel-in-progress: false
        permissions:
            contents: write
            id-token: write
        env:
            NEW_VERSION: ${{ needs.identify-release.outputs.new-version }}
            RELEASE_COMMIT: ${{ needs.identify-release.outputs.release-commit }}
            SKIP_UPLOAD: ${{ inputs.skip_upload && 'true' || 'false' }}
            CWS_ITEM: publishers/${{ vars.CHROME_WEB_STORE_PUBLISHER_ID }}/items/${{ vars.CHROME_WEB_STORE_ITEM_ID }}
        steps:
            - name: Checkout the changelog
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ env.RELEASE_COMMIT }}
                  persist-credentials: false
                  sparse-checkout: frontend/src/toolbar/extension/release/CHANGELOG.md
                  sparse-checkout-cone-mode: false

            - name: Download extension zip
              id: package
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: toolbar-extension-${{ env.NEW_VERSION }}
                  path: ${{ runner.temp }}/extension

            - name: Find the zip
              id: zip
              env:
                  ZIP_DIR: ${{ steps.package.outputs.download-path }}
              run: |
                  zip_file="$ZIP_DIR/posthog-toolbar-chrome-$NEW_VERSION.zip"
                  if [ ! -f "$zip_file" ]; then
                      echo "::error::The build artifact has no $zip_file"
                      exit 1
                  fi
                  echo "path=$zip_file" >> "$GITHUB_OUTPUT"

            - name: Authenticate to Google
              id: google
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
              with:
                  workload_identity_provider: ${{ vars.CHROME_WEB_STORE_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ vars.CHROME_WEB_STORE_SERVICE_ACCOUNT }}
                  token_format: access_token
                  access_token_scopes: https://www.googleapis.com/auth/chromewebstore
                  access_token_lifetime: 1800s

            - name: Submit to the Chrome Web Store
              env:
                  ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
                  ZIP_FILE: ${{ steps.zip.outputs.path }}
              run: |
                  api=https://chromewebstore.googleapis.com
                  response="$RUNNER_TEMP/chrome-web-store.json"

                  # Prints the response body, and the error the API sent when the call fails.
                  cws() {
                      if ! curl --fail-with-body -sS -o "$response" -H "Authorization: Bearer $ACCESS_TOKEN" "$@"; then
                          echo "::error::The Chrome Web Store API call failed: $(cat "$response")" >&2
                          exit 1
                      fi
                      cat "$response"
                  }

                  # A retried run must not upload the same version twice, which the store rejects.
                  status=$(cws "$api/v2/$CWS_ITEM:fetchStatus")
                  newest_version=$(printf '%s' "$status" | jq -r '
                      [.submittedItemRevisionStatus, .publishedItemRevisionStatus][]?.distributionChannels[]?.crxVersion' |
                      sort -V | tail -1)
                  if [ -n "$newest_version" ] && [ "$newest_version" != "$NEW_VERSION" ] &&
                      [ "$(printf '%s\n%s\n' "$newest_version" "$NEW_VERSION" | sort -V | tail -1)" = "$newest_version" ]; then
                      echo "::error::The store already has the newer version $newest_version, which includes the changes of $NEW_VERSION"
                      exit 1
                  fi
                  version_state=$(printf '%s' "$status" | jq -r --arg version "$NEW_VERSION" '
                      [.submittedItemRevisionStatus, .publishedItemRevisionStatus]
                      | map(select(. != null and any(.distributionChannels[]?; .crxVersion == $version)) | .state)
                      | first // empty')
                  case "$version_state" in
                      '') ;;
                      PENDING_REVIEW | STAGED | PUBLISHED | PUBLISHED_TO_TESTERS)
                          echo "The store already has version $NEW_VERSION in state $version_state"
                          exit 0
                          ;;
                      *)
                          echo "::error::The store has version $NEW_VERSION in state $version_state. It can't take this version again, so release a new one with a changeset."
                          exit 1
                          ;;
                  esac

                  if [ "$SKIP_UPLOAD" = 'true' ]; then
                      echo "Submitting the version already uploaded to the store"
                  else
                      upload=$(cws -X POST -T "$ZIP_FILE" "$api/upload/v2/$CWS_ITEM:upload")
                      upload_state=$(printf '%s' "$upload" | jq -r '.uploadState')
                      for _ in $(seq 1 30); do
                          case "$upload_state" in
                              IN_PROGRESS | UPLOAD_IN_PROGRESS)
                                  sleep 10
                                  upload_state=$(cws "$api/v2/$CWS_ITEM:fetchStatus" | jq -r '.lastAsyncUploadState')
                                  ;;
                              *) break ;;
                          esac
                      done
                      if [ "$upload_state" != 'SUCCEEDED' ]; then
                          echo "::error::The Chrome Web Store upload ended in state $upload_state. If an earlier run already uploaded $NEW_VERSION, retry with skip_upload."
                          printf '%s\n' "$upload" | jq .
                          exit 1
                      fi
                  fi

                  # The store reviews the version, then publishes it with the item's current visibility.
                  publish=$(cws -X POST -H 'Content-Type: application/json' \
                      -d '{"publishType": "DEFAULT_PUBLISH"}' "$api/v2/$CWS_ITEM:publish")
                  printf '%s\n' "$publish" | jq .
                  echo "Submitted version $NEW_VERSION for review: $(printf '%s' "$publish" | jq -r '.state')" >> "$GITHUB_STEP_SUMMARY"

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  ZIP_FILE: ${{ steps.zip.outputs.path }}
              run: |
                  tag="toolbar-extension/v$NEW_VERSION"
                  if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
                      echo "Release $tag already exists"
                      exit 0
                  fi
                  notes=$(awk -v heading="## $NEW_VERSION" '$0 == heading { found = 1; next } found && /^## / { exit } found' \
                      "$RELEASE_DIR/CHANGELOG.md")
                  # The repository's latest release stays the app's, so this one is never marked latest.
                  gh release create "$tag" "$ZIP_FILE" \
                      --repo "$REPOSITORY" \
                      --target "$RELEASE_COMMIT" \
                      --title "Toolbar extension v$NEW_VERSION" \
                      --notes "$notes" \
                      --latest=false
