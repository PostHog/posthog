name: Update Sandbox Agent Version

on:
    schedule:
        - cron: '0 3 * * *'
    workflow_dispatch:
        inputs:
            version:
                description: 'Agent version to pin. Defaults to the npm "latest" dist-tag.'
                required: false
                type: string
            slack_thread_ts:
                description: 'Slack thread of the release post to reply in. The release workflow sets it.'
                required: false
                type: string

permissions:
    contents: read

concurrency:
    group: update-sandbox-agent-version
    cancel-in-progress: false

jobs:
    update-sandbox-agent-version:
        runs-on: ubuntu-24.04
        timeout-minutes: 125
        permissions:
            contents: read
            packages: read

        env:
            DOCKERFILE: products/tasks/backend/sandbox/images/Dockerfile.sandbox-base
            BRANCH_PREFIX: chore/bump-sandbox-agent-version-
            SLACK_CHANNEL: 'C0C3FBES5ST'
            AGENT_PATHS: products/desktop/packages/agent products/desktop/packages/enricher products/desktop/packages/git products/desktop/packages/harness products/desktop/packages/shared

        steps:
            - name: Guard - only run on master
              env:
                  REF: ${{ github.ref }}
              run: |
                  if [ "$REF" != "refs/heads/master" ]; then
                      echo "::error::This workflow can only run on master (got $REF). Re-dispatch it from master."
                      exit 1
                  fi

            - name: Get app token
              id: app-token
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_SCHEDULED_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_SCHEDULED_ACTIONS_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  sparse-checkout: |
                      products/tasks/backend/sandbox/images/Dockerfile.sandbox-base
                      .github/actions/wait-for-check
                      .github/actions/sandbox-agent-gateway-smoke
                  sparse-checkout-cone-mode: false

            - name: Resolve the published agent version
              id: resolve
              env:
                  REQUESTED_VERSION: ${{ inputs.version }}
              run: |
                  latest="$REQUESTED_VERSION"
                  for attempt in 1 2 3; do
                    if [ -n "$latest" ]; then break; fi
                    latest=$(npm view @posthog/agent version 2>/dev/null || true)
                    if [ -n "$latest" ]; then break; fi
                    echo "npm view returned nothing (attempt $attempt)"
                    sleep $((attempt * 5))
                  done
                  if ! printf '%s' "$latest" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                    echo "could not resolve a version for @posthog/agent (got '$latest')" >&2
                    exit 1
                  fi
                  echo "latest=$latest" >> "$GITHUB_OUTPUT"
                  echo "BRANCH=${BRANCH_PREFIX}${latest}" >> "$GITHUB_ENV"

                  pinned=$(sed -n 's/^ARG AGENT_VERSION=//p' "$DOCKERFILE")
                  if [ -z "$pinned" ]; then
                    echo "no ARG AGENT_VERSION line in $DOCKERFILE" >&2
                    exit 1
                  fi
                  echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
                  echo "Pinned $pinned, published $latest"

            - name: Decide what this run does
              id: state
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  REPO: ${{ github.repository }}
                  LATEST: ${{ steps.resolve.outputs.latest }}
                  PINNED: ${{ steps.resolve.outputs.pinned }}
              run: |
                  current_pr=""
                  stale_prs=""
                  while read -r number head; do
                    if [ -z "$number" ]; then continue; fi
                    if [ "$head" = "$BRANCH" ]; then current_pr="$number"; else stale_prs="$stale_prs $number"; fi
                  done <<< "$(gh pr list --state open --search '"bump sandbox @posthog/agent to" in:title' \
                    --json number,headRefName,isCrossRepository \
                    --jq ".[] | select(.isCrossRepository == false and (.headRefName | startswith(\"${BRANCH_PREFIX}\"))) | \"\(.number) \(.headRefName)\"")"

                  if [ "$LATEST" = "$PINNED" ]; then
                    action=noop
                    echo "Pin already at $LATEST"
                  else
                    declined_by=$(gh api graphql -f query='query($q: String!) {
                        search(query: $q, type: ISSUE, first: 10) { nodes { ... on PullRequest {
                          headRepository { nameWithOwner }
                          timelineItems(last: 1, itemTypes: [CLOSED_EVENT]) { nodes { ... on ClosedEvent { actor { __typename login } } } }
                        } } } }' \
                      -f q="repo:${REPO} is:pr is:closed is:unmerged head:${BRANCH} in:title \"bump sandbox @posthog/agent to ${LATEST}\"" \
                      --jq ".data.search.nodes[] | select(.headRepository.nameWithOwner == \"${REPO}\") | .timelineItems.nodes[0].actor | select(.__typename == \"User\") | .login" | head -1)
                    if [ -n "$declined_by" ]; then
                      action=declined
                      echo "::notice::$declined_by closed the bump PR for $LATEST without merging, so this run leaves the pin alone"
                    elif [ -n "$current_pr" ]; then
                      action=current
                      echo "PR #$current_pr already proposes $LATEST"
                    else
                      action=bump
                    fi
                  fi

                  if [ "$action" = noop ] || [ "$action" = declined ]; then
                    stale_prs="$stale_prs${current_pr:+ $current_pr}"
                  fi
                  {
                    echo "action=$action"
                    echo "stale_prs=${stale_prs# }"
                    echo "current_pr=$current_pr"
                    echo "declined_by=${declined_by:-}"
                  } >> "$GITHUB_OUTPUT"

            - name: Wait for npm to serve the version
              if: steps.state.outputs.action == 'bump'
              env:
                  LATEST: ${{ steps.resolve.outputs.latest }}
              run: |
                  for attempt in $(seq 1 45); do
                    if [ "$(npm view "@posthog/agent@${LATEST}" version 2>/dev/null)" = "$LATEST" ]; then
                      echo "npm serves @posthog/agent@${LATEST}"
                      exit 0
                    fi
                    echo "npm does not serve @posthog/agent@${LATEST} yet (attempt $attempt)"
                    sleep 20
                  done
                  echo "npm did not serve @posthog/agent@${LATEST} within 15 minutes" >&2
                  exit 1

            - name: Bump the pin
              if: steps.state.outputs.action == 'bump'
              env:
                  LATEST: ${{ steps.resolve.outputs.latest }}
              run: |
                  sed -i "s/^ARG AGENT_VERSION=.*/ARG AGENT_VERSION=${LATEST}/" "$DOCKERFILE"
                  if git diff --quiet "$DOCKERFILE"; then
                    echo "could not rewrite ARG AGENT_VERSION in $DOCKERFILE" >&2
                    exit 1
                  fi
                  git diff "$DOCKERFILE"

            - name: Summarize what the bump ships
              if: steps.state.outputs.action == 'bump'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  REPO: ${{ github.repository }}
                  LATEST: ${{ steps.resolve.outputs.latest }}
                  PINNED: ${{ steps.resolve.outputs.pinned }}
              run: |
                  from_tag="agent-v${PINNED}"
                  to_tag="agent-v${LATEST}"
                  compare="https://github.com/${REPO}/compare/${from_tag}...${to_tag}"
                  {
                    echo "## What this ships"
                    echo
                    if ! since=$(gh api "repos/${REPO}/commits/${from_tag}" --jq '.commit.committer.date' 2>/dev/null); then
                      echo "_No \`${from_tag}\` tag, so the commit list is unavailable. Compare on GitHub: [\`${from_tag}...${to_tag}\`](${compare})._"
                    else
                      from_sha=$(gh api "repos/${REPO}/commits/${from_tag}" --jq '.sha')
                      commits=$(for path in $AGENT_PATHS; do
                        gh api --paginate "repos/${REPO}/commits?sha=${to_tag}&path=${path}&since=${since}&per_page=100" \
                          --jq '.[] | "\(.sha) \(.commit.message | split("\n")[0])"'
                      done | grep -v "^${from_sha} " | sort -u -k1,1 | sort -k2)
                      count=$(printf '%s' "$commits" | grep -c . || true)
                      echo "Agent commits between \`${from_tag}\` and \`${to_tag}\` ([compare](${compare})): ${count}"
                      echo
                      printf '%s\n' "$commits" | sed -E 's/^([0-9a-f]{40}) (.*)$/- \2 \1/'
                    fi
                    echo
                    echo "### Dependency changes in the published package"
                    echo
                    deps_ok=true
                    for v in "$PINNED" "$LATEST"; do
                      if ! npm view "@posthog/agent@${v}" dependencies --json > "deps-${v}.json" 2>/dev/null; then
                        deps_ok=false
                      fi
                      jq -r 'to_entries[] | "\(.key) \(.value)"' "deps-${v}.json" 2>/dev/null | sort > "deps-${v}.txt" || deps_ok=false
                    done
                    if [ "$deps_ok" != true ]; then
                      echo "_Unavailable: npm did not return the dependencies for both versions._"
                    elif changed=$(diff "deps-${PINNED}.txt" "deps-${LATEST}.txt" | grep -E '^[<>]'); then
                      echo '```diff'
                      printf '%s\n' "$changed" | sed -E 's/^< /- /; s/^> /+ /'
                      echo '```'
                    else
                      echo "None."
                    fi
                  } > delta.md
                  cat delta.md

            - name: Close bump PRs this run supersedes
              if: steps.state.outputs.stale_prs != ''
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  STALE_PRS: ${{ steps.state.outputs.stale_prs }}
              run: |
                  for number in $STALE_PRS; do
                    gh pr close "$number" --delete-branch
                    echo "Closed PR #$number and deleted its branch"
                  done

            - name: Reset branch to checked-out SHA
              if: steps.state.outputs.action == 'bump'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  TARGET_SHA: ${{ github.sha }}
              run: |
                  if gh api "repos/${{ github.repository }}/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
                    gh api -X PATCH "repos/${{ github.repository }}/git/refs/heads/$BRANCH" \
                      -f sha="$TARGET_SHA" -F force=true
                    echo "Force-reset branch to $TARGET_SHA"
                  else
                    gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$TARGET_SHA"
                    echo "Created branch at $TARGET_SHA"
                  fi

            - name: Commit via GitHub API (signed)
              id: commit
              if: steps.state.outputs.action == 'bump'
              uses: planetscale/ghcommit-action@25309d8005ac7c3bcd61d3fe19b69e0fe47dbdde # v0.2.20
              with:
                  commit_message: 'chore(tasks): bump sandbox @posthog/agent to ${{ steps.resolve.outputs.latest }}'
                  repo: ${{ github.repository }}
                  branch: ${{ env.BRANCH }}
                  file_pattern: products/tasks/backend/sandbox/images/Dockerfile.sandbox-base
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

            - name: Create the pull request
              id: pr
              if: steps.state.outputs.action == 'bump'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  LATEST: ${{ steps.resolve.outputs.latest }}
                  PINNED: ${{ steps.resolve.outputs.pinned }}
              run: |
                  {
                    cat <<BODY
                  ## Problem

                  The sandbox base image pins \`@posthog/agent\` so a published release reaches production sandboxes only through a commit on \`master\`. That pin is at \`${PINNED}\`; npm now serves \`${LATEST}\`.

                  ## Changes

                  - \`Dockerfile.sandbox-base\`: \`AGENT_VERSION\` \`${PINNED}\` to \`${LATEST}\`.

                  The sandbox image workflow builds this image and smokes \`${LATEST}\` on both architectures. This workflow then runs one Claude turn and one Codex turn with that image through the production Go ai-gateway. When both checks pass, the release app approves this PR and adds it to the merge queue. Close it before the queue lands it to keep \`${PINNED}\`. A newer release opens its own PR and closes this one.

                  BODY
                    cat delta.md
                    cat <<BODY

                  ## How did you test this code?

                  The sandbox image CD workflow builds this PR's image on both architectures, checks that the installed \`@posthog/agent\` matches the pin, and runs the \`agent-server\` entrypoint. That covers packaging and dependency resolution. This workflow then drives one Claude turn and one Codex turn from the image through the US Go ai-gateway, on the default models and efforts, and needs both to read a file with a tool. The agent's own test suite ran before the release was published.
                  BODY
                  } > body.md
                  pr_url=$(gh pr create \
                    --title "chore(tasks): bump sandbox @posthog/agent to ${LATEST}" \
                    --body-file body.md \
                    --base master \
                    --head "$BRANCH" \
                    --label "automated" --label "dependencies" --label "skip-agent-review")
                  echo "Created $pr_url"
                  echo "number=${pr_url##*/}" >> "$GITHUB_OUTPUT"
                  echo "url=$pr_url" >> "$GITHUB_OUTPUT"

            - name: Post the bump PR in the release thread
              id: slack-opened-reply
              if: steps.state.outputs.action == 'bump' && inputs.slack_thread_ts != ''
              continue-on-error: true
              uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
              with:
                  method: chat.postMessage
                  token: ${{ secrets.SLACK_DEVEX_BOT_TOKEN }}
                  errors: true
                  payload: |
                      channel: "${{ env.SLACK_CHANNEL }}"
                      thread_ts: "${{ inputs.slack_thread_ts }}"
                      unfurl_links: false
                      text: ":twisted_rightwards_arrows: Sandbox bump PR <${{ steps.pr.outputs.url }}|#${{ steps.pr.outputs.number }}> opened: `${{ steps.resolve.outputs.pinned }}` to `${{ steps.resolve.outputs.latest }}`. It merges on its own once the image smoke passes."

            # A nightly or manual run has no release thread, so the PR post starts one.
            - name: Post the bump PR as a new thread
              id: slack-opened-parent
              if: steps.state.outputs.action == 'bump' && inputs.slack_thread_ts == ''
              continue-on-error: true
              uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
              with:
                  method: chat.postMessage
                  token: ${{ secrets.SLACK_DEVEX_BOT_TOKEN }}
                  errors: true
                  payload: |
                      channel: "${{ env.SLACK_CHANNEL }}"
                      unfurl_links: false
                      text: ":twisted_rightwards_arrows: *@posthog/agent ${{ steps.resolve.outputs.latest }}*: sandbox bump PR <${{ steps.pr.outputs.url }}|#${{ steps.pr.outputs.number }}> opened, from `${{ steps.resolve.outputs.pinned }}`. It merges on its own once the image smoke passes."

            - name: Resolve the Slack thread
              id: thread
              if: ${{ !cancelled() }}
              env:
                  INPUT_TS: ${{ inputs.slack_thread_ts }}
                  PARENT_TS: ${{ steps.slack-opened-parent.outputs.ts }}
              run: |
                  ts="${INPUT_TS:-$PARENT_TS}"
                  echo "ts=$ts" >> "$GITHUB_OUTPUT"
                  printf '%s' "$ts" > .sandbox-agent-slack-thread

            # cd-sandbox-base-image.yml restores this on the merge commit to post that the version is live.
            - name: Cache the Slack thread for the merge notice
              if: github.ref == 'refs/heads/master' && steps.state.outputs.action == 'bump' && steps.thread.outputs.ts != ''
              continue-on-error: true
              uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: .sandbox-agent-slack-thread
                  key: sandbox-agent-slack-${{ steps.resolve.outputs.latest }}

            - name: Wait for the image smoke on the bump commit
              id: smoke
              if: steps.state.outputs.action == 'bump'
              uses: ./.github/actions/wait-for-check
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  checkName: Sandbox Base Image Pass
                  ref: ${{ steps.commit.outputs.commit-hash }}
                  timeoutSeconds: '4500'
                  intervalSeconds: '30'

            - name: Stop when the smoke did not pass
              if: steps.state.outputs.action == 'bump' && steps.smoke.outputs.conclusion != 'success'
              env:
                  CONCLUSION: ${{ steps.smoke.outputs.conclusion }}
                  SHA: ${{ steps.commit.outputs.commit-hash }}
                  PR: ${{ steps.pr.outputs.number }}
              run: |
                  echo "::error::Sandbox Base Image Pass concluded $CONCLUSION on $SHA, so PR #$PR waits for a person"
                  exit 1

            - name: Smoke the agent on the Go ai-gateway
              id: gateway-smoke
              if: steps.state.outputs.action == 'bump'
              timeout-minutes: 25
              uses: ./.github/actions/sandbox-agent-gateway-smoke
              with:
                  image: ghcr.io/posthog/posthog-sandbox-base:${{ steps.commit.outputs.commit-hash }}
                  mint-key: ${{ secrets.AGENT_SMOKE_AI_GATEWAY_MINT_KEY }}
                  registry-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Stop when the gateway smoke did not pass
              if: ${{ !cancelled() && steps.state.outputs.action == 'bump' && steps.gateway-smoke.outputs.result != 'pass' }}
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  RESULT: ${{ steps.gateway-smoke.outputs.result }}
                  SUMMARY_FILE: ${{ steps.gateway-smoke.outputs.summary-file }}
                  PR: ${{ steps.pr.outputs.number }}
              run: |
                  if [ -f "$SUMMARY_FILE" ]; then
                    gh pr comment "$PR" --body-file "$SUMMARY_FILE"
                  fi
                  echo "::error::The gateway smoke reported ${RESULT:-no result}, so PR #$PR waits for a person"
                  exit 1

            - name: Get release approval token
              id: releaser-token
              if: steps.state.outputs.action == 'bump'
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_RELEASER_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_RELEASER_PRIVATE_KEY }}
                  permission-pull-requests: write

            - name: Approve and enqueue the bump
              id: enqueue
              if: steps.state.outputs.action == 'bump'
              env:
                  GH_TOKEN: ${{ steps.releaser-token.outputs.token }}
                  REPO: ${{ github.repository }}
                  SHA: ${{ steps.commit.outputs.commit-hash }}
                  PR: ${{ steps.pr.outputs.number }}
              run: |
                  head=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
                  if [ "$head" != "$SHA" ]; then
                    echo "::error::PR #$PR head $head is not the bump commit $SHA, so this run does not approve it"
                    exit 1
                  fi
                  gh api "repos/${REPO}/pulls/${PR}/reviews" \
                    -f event=APPROVE \
                    -f commit_id="$SHA" \
                    -f body="Automated approval: the sandbox image built from this commit passed the agent smoke on both architectures and one Claude and one Codex turn on the Go ai-gateway." >/dev/null
                  gh pr comment "$PR" --body '/trunk merge'

            - name: Describe the outcome for Slack
              id: outcome
              if: ${{ !cancelled() && steps.thread.outputs.ts != '' }}
              env:
                  ACTION: ${{ steps.state.outputs.action }}
                  ENQUEUE: ${{ steps.enqueue.outcome }}
                  SMOKE: ${{ steps.smoke.outputs.conclusion }}
                  GATEWAY_SMOKE: ${{ steps.gateway-smoke.outputs.result }}
                  PR_URL: ${{ steps.pr.outputs.url }}
                  PR_NUMBER: ${{ steps.pr.outputs.number }}
                  LATEST: ${{ steps.resolve.outputs.latest }}
                  PINNED: ${{ steps.resolve.outputs.pinned }}
                  CURRENT_PR: ${{ steps.state.outputs.current_pr }}
                  DECLINED_BY: ${{ steps.state.outputs.declined_by }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  REPO_URL: ${{ github.server_url }}/${{ github.repository }}
              run: |
                  pr="<${PR_URL}|#${PR_NUMBER}>"
                  case "$ACTION" in
                    bump)
                      if [ "$ENQUEUE" = "success" ]; then
                        text=":white_check_mark: The image built from ${pr} passed the smoke on amd64 and arm64 and on the Go ai-gateway. Approved and added to the merge queue."
                      elif [ -n "$SMOKE" ] && [ "$SMOKE" != "success" ]; then
                        text=":red_circle: Sandbox Base Image Pass concluded \`${SMOKE}\` on ${pr}, so it waits for a person. <${RUN_URL}|View run>"
                      elif [ -n "$GATEWAY_SMOKE" ] && [ "$GATEWAY_SMOKE" != "pass" ]; then
                        text=":red_circle: The Go ai-gateway smoke reported \`${GATEWAY_SMOKE}\` on ${pr}, so it waits for a person. <${RUN_URL}|View run>"
                      elif [ -n "$PR_NUMBER" ]; then
                        text=":red_circle: The bump run failed before ${pr} reached the merge queue. <${RUN_URL}|View run>"
                      else
                        text=":red_circle: The bump run failed before it opened a PR. <${RUN_URL}|View run>"
                      fi
                      ;;
                    noop)
                      text=":information_source: The sandbox pin is already at \`${LATEST}\`, so no bump PR was opened."
                      ;;
                    declined)
                      text=":no_entry_sign: ${DECLINED_BY} closed the bump PR for \`${LATEST}\` without merging, so the sandbox pin stays at \`${PINNED}\`."
                      ;;
                    current)
                      text=":information_source: <${REPO_URL}/pull/${CURRENT_PR}|#${CURRENT_PR}> already proposes \`${LATEST}\`."
                      ;;
                    *)
                      text=":red_circle: The bump run failed before it opened a PR. <${RUN_URL}|View run>"
                      ;;
                  esac
                  echo "text=$text" >> "$GITHUB_OUTPUT"

            - name: Post the outcome in the Slack thread
              if: ${{ !cancelled() && steps.outcome.outputs.text != '' }}
              continue-on-error: true
              uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
              with:
                  method: chat.postMessage
                  token: ${{ secrets.SLACK_DEVEX_BOT_TOKEN }}
                  errors: true
                  payload: |
                      channel: "${{ env.SLACK_CHANNEL }}"
                      thread_ts: "${{ steps.thread.outputs.ts }}"
                      unfurl_links: false
                      text: "${{ steps.outcome.outputs.text }}"
