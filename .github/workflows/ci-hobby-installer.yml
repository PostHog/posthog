name: Hobby Installer

on:
    pull_request:
        paths:
            - '.github/workflows/ci-hobby-installer.yml'
            - 'bin/hobby-installer/**'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    lint-and-test:
        runs-on: ubuntu-24.04
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.2
              with:
                  sparse-checkout: bin/hobby-installer

            - name: Set up Go
              uses: actions/setup-go@v6.4.0
              with:
                  go-version: '1.26.10'
                  cache-dependency-path: bin/hobby-installer/go.sum

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@v9.2.0
              with:
                  version: v2.13.1
                  working-directory: bin/hobby-installer
                  args: --timeout=5m

            - name: Run tests
              run: cd bin/hobby-installer && make test

    build:
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 10
        strategy:
            matrix:
                include:
                    - runner: ubuntu-24.04
                      arch: amd64
                    - runner: ubuntu-24.04-arm
                      arch: arm64

        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.2
              with:
                  sparse-checkout: bin/hobby-installer

            - name: Set up Go
              uses: actions/setup-go@v6.4.0
              with:
                  go-version: '1.26.10'
                  cache-dependency-path: bin/hobby-installer/go.sum

            - name: Build
              run: cd bin/hobby-installer && make build
