name: Test mobile PR on iOS
run-name: iOS simulator for PR ${{ inputs.pr }} at ${{ inputs.revision }}

on:
    workflow_dispatch:
        inputs:
            pr:
                description: Pull request number
                required: true
                type: string
            revision:
                description: Full commit SHA at the head of the pull request
                required: true
                type: string

permissions: {}
cache-mode: none

jobs:
    simulator:
        if: github.repository == 'PostHog/posthog' && github.ref == 'refs/heads/master'
        runs-on: macos-26
        timeout-minutes: 75
        env:
            CI: '1'
            DO_NOT_TRACK: '1'
            EXPO_NO_DOTENV: '1'
            EXPO_NO_TELEMETRY: '1'
        steps:
            - name: Fetch the public PR revision
              env:
                  PR: ${{ inputs.pr }}
                  REVISION: ${{ inputs.revision }}
              run: |
                  [[ "$PR" =~ ^[1-9][0-9]*$ && "$REVISION" =~ ^[0-9a-f]{40}$ ]] || exit 1
                  git init --quiet
                  git remote add origin https://github.com/PostHog/posthog.git
                  git sparse-checkout init --no-cone
                  git sparse-checkout set --no-cone /products/mobile/
                  git fetch --no-tags --depth=1 --filter=blob:none origin "refs/pull/$PR/head"
                  if [[ "$(git rev-parse FETCH_HEAD)" != "$REVISION" ]]; then
                      echo "::error::The PR head changed. Start a new run with its current commit."
                      exit 1
                  fi
                  git checkout --quiet --detach FETCH_HEAD
                  curl --fail --silent --show-error \
                      "https://raw.githubusercontent.com/PostHog/posthog/$GITHUB_SHA/products/mobile/scripts/ci-argent.sh" \
                      --output "$RUNNER_TEMP/ci-argent.sh"

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: products/mobile/.node-version
                  package-manager-cache: false
                  token: ''

            - name: Install the mobile workspace and simulator tools
              working-directory: products/mobile
              run: |
                  npm install --prefix "$RUNNER_TEMP/tools" --no-audit --no-fund pnpm@10.29.3 @swmansion/argent@0.30.1
                  echo "$RUNNER_TEMP/tools/node_modules/.bin" >> "$GITHUB_PATH"
                  "$RUNNER_TEMP/tools/node_modules/.bin/pnpm" install --frozen-lockfile

            - name: Build the bundled app
              working-directory: products/mobile
              run: bash scripts/ci-argent-build.sh "$RUNNER_TEMP/build" "$RUNNER_TEMP/build-logs"

            - name: Run demo walkthroughs and capture screenshots
              env:
                  ARGENT_APP_DIR: ${{ github.workspace }}/products/mobile
              run: |
                  bash "$RUNNER_TEMP/ci-argent.sh" \
                      "$RUNNER_TEMP/build/Build/Products/Release-iphonesimulator/PostHogApp.app" \
                      "$RUNNER_TEMP/results" --screenshots

            - name: Save walkthrough reports and screenshots
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ios-pr-${{ inputs.pr }}-${{ inputs.revision }}
                  path: |
                      ${{ runner.temp }}/results/*.json
                      ${{ runner.temp }}/results/**/*.png
                  retention-days: 3
                  if-no-files-found: warn
