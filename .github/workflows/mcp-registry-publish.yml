name: MCP Registry publish

on:
    pull_request:
        paths:
            - 'services/mcp/server.json'
            - '.github/workflows/mcp-registry-publish.yml'
    push:
        branches:
            - master
        paths:
            - 'services/mcp/server.json'
            - '.github/workflows/mcp-registry-publish.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

env:
    SERVER_JSON: services/mcp/server.json
    REGISTRY_URL: https://registry.modelcontextprotocol.io
    MCP_PUBLISHER_VERSION: v1.8.11
    MCP_PUBLISHER_SHA256: 99fbd857ae2277e5e4a4a2cddc7f4d3e64612c6f90950f44584c3539c9df854f

jobs:
    publish:
        name: Validate and publish server.json
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: services/mcp/server.json
                  sparse-checkout-cone-mode: false

            - name: Install mcp-publisher
              run: |
                  archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
                  curl -fsSL --retry 5 --retry-all-errors --retry-max-time 60 --connect-timeout 10 -o "$archive" \
                      "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
                  echo "${MCP_PUBLISHER_SHA256}  $archive" | sha256sum -c -
                  tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
                  echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

            - name: Validate server.json
              run: mcp-publisher validate "$SERVER_JSON"

            # The registry rejects a second publish of the same version, and it returns a published
            # server.json byte-for-byte. So a published version with different content means the
            # file changed without a version bump, and the change would never reach the registry.
            - name: Check whether this version is published
              id: check
              run: |
                  name=$(jq -r .name "$SERVER_JSON")
                  version=$(jq -r .version "$SERVER_JSON")
                  published="$RUNNER_TEMP/published.json"
                  status=$(curl -sS --retry 5 --retry-max-time 60 --connect-timeout 10 -o "$published" -w '%{http_code}' \
                      "${REGISTRY_URL}/v0/servers/${name//\//%2F}/versions/${version}")

                  case "$status" in
                      404)
                          echo "${name}@${version} is not published yet."
                          echo "publish=true" >> "$GITHUB_OUTPUT"
                          ;;
                      200)
                          if [ "$(jq -S .server "$published")" = "$(jq -S . "$SERVER_JSON")" ]; then
                              echo "${name}@${version} is already published with this content."
                              echo "publish=false" >> "$GITHUB_OUTPUT"
                          else
                              echo "::error file=${SERVER_JSON}::${name}@${version} is already published with different content. Bump \"version\" in ${SERVER_JSON}."
                              exit 1
                          fi
                          ;;
                      *)
                          echo "::error::The registry answered HTTP ${status} for ${name}@${version}."
                          exit 1
                          ;;
                  esac

            - name: Publish to the MCP Registry
              if: steps.check.outputs.publish == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
              env:
                  MCP_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
              run: |
                  mcp-publisher login http --domain posthog.com
                  mcp-publisher publish "$SERVER_JSON"
