name: Knowledge writer merge check

on:
    push:
        branches:
            - master

concurrency:
    group: knowledge-writer-merge-${{ github.sha }}

permissions:
    contents: read
    pull-requests: read

jobs:
    merge-check:
        name: Check merge for docs changes
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        if: github.repository == 'PostHog/posthog' && vars.KNOWLEDGE_WRITER_VERDICTS_URL != ''
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 2
                  sparse-checkout: |
                      .github
                      frontend/src
                      products

            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  repository: PostHog/posthog.com
                  path: posthog.com
                  fetch-depth: 1
                  sparse-checkout: contents/docs

            - name: Install uv
              uses: ./.github/actions/setup-uv
              with:
                  enable-cache: false

            - name: Run merge check
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  ANTHROPIC_API_KEY: ${{ secrets.KNOWLEDGE_WRITER_ANTHROPIC_API_KEY }}
                  KNOWLEDGE_WRITER_API_TOKEN: ${{ secrets.KNOWLEDGE_WRITER_API_TOKEN }}
                  KNOWLEDGE_WRITER_VERDICTS_URL: ${{ vars.KNOWLEDGE_WRITER_VERDICTS_URL }}
                  COMMIT_SHA: ${{ github.sha }}
              run: >-
                  uv run --no-project --python 3.12
                  --with anthropic==0.80.0 --with ast-grep-cli==0.45.3 --with httpx==0.28.1
                  --with pydantic==2.12.5 --with pyyaml==6.0.3
                  python -m products.knowledge_writer.merge_check check "$COMMIT_SHA"
                  --checkout . --docs-checkout posthog.com --post
