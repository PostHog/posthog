name: MCP agent API diff

# Posts a short summary of what a PR changes for agents (tools added or removed, params, scopes,
# annotations, input schema size) into the shared CI report comment. Reviewers of a product PR
# that only regenerates MCP files see megabytes of diff and no hint of what agents will notice.
# Informational only: nothing here can fail a PR, and nothing here is a required check.

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        paths:
            - 'products/*/mcp/**'
            - 'services/mcp/definitions/**'
            - 'services/mcp/schema/**'
            - 'services/mcp/tests/unit/__snapshots__/tool-schemas/**'
            - 'services/mcp/scripts/agent-api-diff.ts'
            - 'services/mcp/scripts/lib/agent-api-diff.ts'
            - 'services/mcp/scripts/post-agent-api-diff-section.mjs'
            - '.github/workflows/ci-mcp-agent-api-diff.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    agent-api-diff:
        name: Summarize agent API changes
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        # Same-repo PRs only: a fork's token cannot write the report comment. The merge queue's
        # draft PRs are ephemeral and unread, and every section write spends shared token budget.
        if: github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'trunk-merge/')
        permissions:
            contents: read
            pull-requests: write
        steps:
            # The checked-out ref is the PR merged into its base, so HEAD^1 is the base tip and
            # the diff against it is exactly what the PR changes, even when the branch is behind.
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 2
                  persist-credentials: false

            - name: Mint setup-action GitHub token
              id: setup-gh-token
              continue-on-error: true
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_SETUP_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_PRIVATE_KEY }}
                  skip-token-revoke: true

            - name: Install pnpm dependencies
              # Match services/mcp/Dockerfile exactly
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/mcp... install --frozen-lockfile
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}

            # Guarded for branches that predate the scripts, and for a checkout without a base parent.
            - name: Compute agent API diff
              continue-on-error: true
              run: |
                  : > "$RUNNER_TEMP/agent-api-diff.md"
                  if [ ! -f services/mcp/scripts/agent-api-diff.ts ]; then
                      echo "Skipping agent API diff - script not present on this checkout"
                  elif ! git rev-parse --verify --quiet 'HEAD^1' > /dev/null; then
                      echo "Skipping agent API diff - no base commit to compare against"
                  else
                      pnpm --filter=@posthog/mcp exec tsx scripts/agent-api-diff.ts --base-ref 'HEAD^1' > "$RUNNER_TEMP/agent-api-diff.md"
                  fi

            - name: Post agent API diff to CI report comment
              continue-on-error: true
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  if [ -f services/mcp/scripts/post-agent-api-diff-section.mjs ]; then
                      node services/mcp/scripts/post-agent-api-diff-section.mjs "$RUNNER_TEMP/agent-api-diff.md"
                  else
                      echo "Skipping report section - script not present on this checkout"
                  fi
