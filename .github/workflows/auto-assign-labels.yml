name: Auto Assign Labels

# Adds team/feature labels to a PR based on its conventional-commit scope and the paths it changes, e.g.
# `feat(flags): …` -> `feature/feature-flags` + `team/feature-flags`. Small
# feature flags PRs from the PostHog AI app also get `review/low-hanging-fruit`. The
# scope -> label mappings live in .github/auto-assign-labels.json so the owning
# team can change them without editing this workflow or the script.
#
# NOTE: This uses `pull_request_target` so it can also label fork PRs (their
# normal token is read-only). That trigger runs with a write token regardless of
# the PR's contents, so we are careful to NEVER execute untrusted code:
#  - we check out `master` and run the script from there, not the PR branch;
#  - the PR title is passed via `env` (never interpolated into a shell line);
#  - the title only selects from the fixed set of labels in the config, so a
#    malicious title can at most apply a pre-approved label, never inject one.
# A consequence (as with auto-assign-reviewers): changes here only take effect
# once merged to master.
# nosemgrep: semgrep.rules.github-actions-pull-request-target
on:
    pull_request_target:
        types: [opened, edited, reopened, ready_for_review, synchronize]

permissions:
    contents: read
    pull-requests: write
    issues: write

# A PR being opened then quickly edited (title/base) queues redundant runs.
# Labeling is idempotent, so drop any in-flight run for the same PR.
concurrency:
    group: auto-assign-labels-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    assign-labels:
        # Labels derived from the queue's own PR title are discarded with the
        # branch; the PR being queued was already labeled from its real title.
        # A closed PR is skipped because its labels select merged changes for release
        # notes, and its title stays editable after merge.
        if: ${{ github.event.pull_request.state == 'open' && !startsWith(github.head_ref, 'trunk-merge/') }}
        runs-on: 'ubuntu-22.04'
        timeout-minutes: 5
        outputs:
            triage: ${{ steps.labels.outputs.triage }}

        steps:
            - name: Checkout master branch
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/checkout@v6.0.2
              with:
                  # MUST be `master` so we never execute untrusted PR code.
                  ref: master
                  sparse-checkout: |
                      /.github/
                      /.nvmrc
                      .gitattributes
                  sparse-checkout-cone-mode: false

            # No fork guard: pull_request_target runs in base context, so org
            # secrets are available even when the PR comes from a fork.
            - name: Mint setup-action GitHub token
              id: setup-gh-token
              continue-on-error: true
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/create-github-app-token@v3.1.1
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_SETUP_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_PRIVATE_KEY }}
                  skip-token-revoke: true

            - name: Setup Node.js
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/setup-node@v6.2.0
              with:
                  node-version-file: .nvmrc
                  # Resolve the node-versions manifest on the app token, not the shared per-repo GITHUB_TOKEN bucket
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}

            - name: Run label assignment script
              id: labels
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  PR_AUTHOR: ${{ github.event.pull_request.user.login }}
                  PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
              run: node .github/scripts/label-pr-from-title.js

    review-triage:
        needs: assign-labels
        if: ${{ needs.assign-labels.outputs.triage == 'true' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
            pull-requests: write

        steps:
            - name: Checkout master branch
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: master
                  persist-credentials: false
                  sparse-checkout: |
                      /.github/
                  sparse-checkout-cone-mode: false

            - name: Triage the pull request
              id: triage
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  AI_GATEWAY_MINT_KEY: ${{ secrets.AGENT_INFRA_TRIAGE_AI_GATEWAY_KEY }}
              run: node .github/scripts/agent-infra-review-triage.js

            - name: Get app token
              id: app-token
              if: ${{ steps.triage.outputs.verdict == 'review' }}
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_POSTHOG_ASSIGN_REVIEWERS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_ASSIGN_REVIEWERS_PRIVATE_KEY }}

            - name: Request the team's review
              if: ${{ steps.triage.outputs.verdict == 'review' }}
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  REPOSITORY: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  TEAM: ${{ steps.triage.outputs.team }}
              run: |
                  gh api --method POST "repos/$REPOSITORY/pulls/$PR_NUMBER/requested_reviewers" \
                      -f "team_reviewers[]=$TEAM" > /dev/null

            - name: Add the review label
              if: ${{ steps.triage.outputs.verdict == 'review' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  LABEL: ${{ steps.triage.outputs.label }}
              run: |
                  gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/labels" \
                      -f "labels[]=$LABEL" > /dev/null
