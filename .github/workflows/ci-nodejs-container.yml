name: Build and deploy node container image

on:
    workflow_dispatch:
    # paths mirror the changes job's dorny filter, which still gates push events.
    pull_request:
        paths:
            - 'nodejs/**'
            - 'common/hogvm/typescript/**'
            - 'common/plugin_transpiler/**'
            - 'common/esbuilder/**'
            - 'common/replay-shared/**'
            - 'common/replay-headless/**'
            - 'rust/common/hogvm/**'
            - 'rust/replay-anonymizer/**'
            - 'rust/replay-anonymizer-node/**'
            - 'Dockerfile.node'
            - '.github/workflows/ci-nodejs-container.yml'
            - 'turbo.json'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
    push:
        branches:
            - 'master'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    changes:
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            pull-requests: read
        timeout-minutes: 5
        # Skipped on trunk-merge/** branches: merge-queue PRs are ephemeral, nothing
        # pulls images pushed for them, and each constituent PR already built its own.
        if: github.repository_owner == 'PostHog' && !startsWith(github.head_ref, 'trunk-merge/')
        name: Determine need to run node Docker build
        outputs:
            node_files: ${{ steps.filter.outputs.node_files }}
            ai_research_replay_files: ${{ steps.filter.outputs.ai_research_replay_files }}
        steps:
            - name: Check out
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: .github/actions/paths-filter
                  sparse-checkout-cone-mode: false

            - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              id: app-token
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_PATHS_FILTER_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_PATHS_FILTER_PRIVATE_KEY }}
            - uses: ./.github/actions/paths-filter
              id: filter
              with:
                  token: ${{ steps.app-token.outputs.token || github.token }}
                  # Keep in sync with the trigger-level pull_request paths above.
                  filters: |
                      node_files:
                        - 'nodejs/**'
                        - 'common/hogvm/typescript/**'
                        - 'common/plugin_transpiler/**'
                        - 'common/esbuilder/**'
                        - 'common/replay-shared/**'
                        - 'common/replay-headless/**'
                        - 'rust/common/hogvm/**'
                        - 'rust/replay-anonymizer/**'
                        - 'rust/replay-anonymizer-node/**'
                        - 'Dockerfile.node'
                        - '.github/workflows/ci-nodejs-container.yml'
                        - 'turbo.json'
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'pnpm-workspace.yaml'
                      # The AI research session replay lanes run this image from a separate deploy target, so that a deploy of unrelated node code does not restart them and empty their caches.
                      # The servers of these lanes import across these trees, so the list holds whole trees and not single files.
                      ai_research_replay_files:
                        - 'nodejs/src/ingestion/pipelines/sessionreplay/**'
                        - 'nodejs/src/ingestion/framework/**'
                        - 'nodejs/src/ingestion/common/**'
                        - 'nodejs/src/ingestion/config.ts'
                        - 'nodejs/src/common/**'
                        - 'nodejs/src/servers/**'
                        - 'nodejs/src/index.ts'
                        - 'nodejs/src/lifecycle.ts'
                        - 'nodejs/src/capabilities.ts'
                        - 'nodejs/src/types.ts'
                        - 'nodejs/package.json'
                        - 'rust/replay-anonymizer/**'
                        - 'rust/replay-anonymizer-node/**'
                        - 'Dockerfile.node'
                        - '.github/workflows/ci-nodejs-container.yml'
                        - 'turbo.json'
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'pnpm-workspace.yaml'

    build:
        needs: changes
        name: Build and push node image
        if: |
            (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.node_files == 'true') ||
            (github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.node_files == 'true' && github.repository_owner == 'PostHog' && vars.CD_DEPLOY_ENABLED == 'true')
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 30
        outputs:
            image-digest: ${{ steps.build.outputs.digest }}
        permissions:
            id-token: write # allow issuing OIDC tokens for this workflow run
            contents: read # allow reading the repo contents
            packages: write # allow push to ghcr.io

        # ECR routing resolved once here so the push target (docker-meta) and the
        # digest pull target read the same value and can't drift: master → posthog-node
        # via the master role; everything else → posthog-node-prs via the prs role.
        env:
            ECR_IMAGE: ${{ github.ref == 'refs/heads/master' && 'posthog-node' || 'posthog-node-prs' }}
            ECR_ROLE: ${{ github.ref == 'refs/heads/master' && vars.AWS_ECR_POSTHOG_MASTER_PUBLISH_IAM_ROLE || vars.AWS_ECR_POSTHOG_PRS_PUBLISH_IAM_ROLE }}

        steps:
            # Fail loudly rather than let the role ternary silently fall back to the PRS
            # role if the master var is unset on master (which would push the prod repo
            # with a role that can't, giving a confusing access-denied).
            - name: Assert master publish role is configured
              if: github.ref == 'refs/heads/master'
              env:
                  MASTER_ROLE: ${{ vars.AWS_ECR_POSTHOG_MASTER_PUBLISH_IAM_ROLE }}
              run: |
                  if [[ -z "$MASTER_ROLE" ]]; then
                    echo "::error::AWS_ECR_POSTHOG_MASTER_PUBLISH_IAM_ROLE is not set — refusing to fall back to the PRS role on master."
                    exit 1
                  fi

            - name: Check out
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

            - name: Set up QEMU
              uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

            - name: Set up Depot CLI
              uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1

            - name: Docker meta and registry login
              id: docker-meta
              uses: ./.github/actions/docker-meta
              with:
                  image-name: posthog-node
                  # ECR repo + role resolved once at job level (see env above). ghcr/dockerhub unchanged.
                  ecr-image-name: ${{ env.ECR_IMAGE }}
                  aws-role-to-assume: ${{ env.ECR_ROLE }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  dockerhub-username: ${{ secrets.DOCKERHUB_USER }}
                  dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
                  # Prod deploys from private ECR; pause the public ghcr push during an embargo.
                  push-to-ghcr: ${{ vars.PUBLIC_IMAGE_PUSH_PAUSED != 'true' }}

            - name: Build and push container image
              id: build
              uses: depot/build-push-action@5f3b3c2e5a00f0093de47f657aeaefcedff27d18 # v1.17.0
              with:
                  context: .
                  buildx-fallback: false
                  project: '00mrvlsdvh'
                  push: ${{ github.event_name == 'pull_request' || vars.CD_DEPLOY_ENABLED == 'true' }}
                  file: Dockerfile.node
                  tags: ${{ steps.docker-meta.outputs.tags }}
                  labels: ${{ steps.docker-meta.outputs.labels }}
                  annotations: ${{ steps.docker-meta.outputs.annotations }}
                  platforms: linux/arm64,linux/amd64
                  build-args: |
                      COMMIT_HASH=${{ github.sha }}

            - name: Container image digest
              env:
                  IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
                  IMAGE_REGISTRY: ${{ steps.docker-meta.outputs.ecr-registry }}
              run: |
                  echo "Image digest: $IMAGE_DIGEST"
                  echo "Full image reference: $IMAGE_REGISTRY/$ECR_IMAGE:${{ github.sha }}@$IMAGE_DIGEST"
                  echo "## Container image built :rocket:" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Image reference:** \`$IMAGE_REGISTRY/$ECR_IMAGE:${{ github.sha }}@$IMAGE_DIGEST\`" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Image SHA:** \`${{ github.sha }}@$IMAGE_DIGEST\`" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
                  echo "- Digest: \`$IMAGE_DIGEST\`" >> $GITHUB_STEP_SUMMARY

            - name: Report failure
              if: failure()
              uses: PostHog/posthog-github-action@58dea254b598fb5d469c0699c98af8288a7f7650 # v1.2.0
              with:
                  posthog-token: ${{ secrets.POSTHOG_API_TOKEN }}
                  event: 'node-image-build'
                  properties: '{"status": "failure", "commit_hash": "${{ github.sha }}"}'
            - name: Report failure to DevEx PostHog
              if: failure()
              continue-on-error: true
              uses: PostHog/posthog-github-action@58dea254b598fb5d469c0699c98af8288a7f7650 # v1.2.0
              with:
                  posthog-token: ${{ secrets.POSTHOG_DEVEX_PROJECT_API_TOKEN }}
                  event: 'node-image-build'
                  properties: '{"status": "failure", "commit_hash": "${{ github.sha }}"}'

            - name: Get deployer token
              if: github.ref == 'refs/heads/master' && github.event_name == 'push' && vars.CD_DEPLOY_ENABLED == 'true'
              id: deployer
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_CHARTS_DEPLOYER_APP_ID }}
                  private-key: ${{ secrets.GH_APP_CHARTS_DEPLOYER_PRIVATE_KEY }}
                  owner: PostHog
                  repositories: charts

            - name: Get PR labels
              if: github.ref == 'refs/heads/master' && github.event_name == 'push' && vars.CD_DEPLOY_ENABLED == 'true'
              id: labels
              uses: ./.github/actions/get-pr-labels
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Trigger node deployment
              if: github.ref == 'refs/heads/master' && github.event_name == 'push' && vars.CD_DEPLOY_ENABLED == 'true'
              uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
              with:
                  token: ${{ steps.deployer.outputs.token }}
                  repository: PostHog/charts
                  event-type: commit_state_update
                  client-payload: |
                      {
                        "values": {
                          "image": {
                            "sha": "${{ github.sha }}@${{ steps.build.outputs.digest }}"
                          }
                        },
                        "release": "node",
                        "commit": ${{ toJson(github.event.head_commit) }},
                        "repository": ${{ toJson(github.repository) }},
                        "labels": ${{ steps.labels.outputs.labels }},
                        "timestamp": "${{ github.event.head_commit.timestamp }}"
                      }

            # The ApplicationSets of the AI research replay lanes in PostHog/charts read state/node-ai-research-session-replay-data.yaml instead of state/node.yaml.
            - name: Trigger node-ai-research-session-replay-data deployment
              if: github.ref == 'refs/heads/master' && github.event_name == 'push' && vars.CD_DEPLOY_ENABLED == 'true' && needs.changes.outputs.ai_research_replay_files == 'true'
              uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
              with:
                  token: ${{ steps.deployer.outputs.token }}
                  repository: PostHog/charts
                  event-type: commit_state_update
                  client-payload: |
                      {
                        "values": {
                          "image": {
                            "sha": "${{ github.sha }}@${{ steps.build.outputs.digest }}"
                          }
                        },
                        "release": "node-ai-research-session-replay-data",
                        "commit": ${{ toJson(github.event.head_commit) }},
                        "repository": ${{ toJson(github.repository) }},
                        "labels": ${{ steps.labels.outputs.labels }},
                        "timestamp": "${{ github.event.head_commit.timestamp }}"
                      }

    ordered_image_alias:
        name: Publish ordered image alias
        needs: build
        # Kargo selects node releases by this tag, so a staged service on the node image can
        # take Freight from it. Mirrors the posthog_build alias job in container-images-cd.yml.
        # Best effort: a missing alias delays that service's Freight and never fails the deploy.
        if: ${{ needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository_owner == 'PostHog' && vars.CD_DEPLOY_ENABLED == 'true' && vars.ORDERED_IMAGE_ALIAS_PAUSED != 'true' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        continue-on-error: true
        permissions:
            id-token: write
            contents: read

        steps:
            - name: Check out
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Compute ordered release tag
              id: ordered-release
              timeout-minutes: 2
              shell: bash
              env:
                  ORDERED_RELEASE_TAG_REGEX: ^r[0-9]{12}-[0-9a-f]{6}$
              run: |
                  set -uo pipefail

                  if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
                      fetch_status=0
                      timeout --kill-after=10s 90s git fetch \
                          --no-tags \
                          --prune \
                          --no-recurse-submodules \
                          --unshallow \
                          --filter=tree:0 \
                          origin \
                          "+${GITHUB_REF}:refs/remotes/origin/${GITHUB_REF_NAME}" || fetch_status=$?
                      if [ "$fetch_status" -ne 0 ]; then
                          echo "::warning title=Ordered release tag skipped::Source history could not be fetched (status $fetch_status)."
                          exit 0
                      fi
                  fi

                  if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" != "false" ]; then
                      echo "::warning title=Ordered release tag skipped::Complete source history is unavailable."
                      exit 0
                  fi

                  if ! head_revision="$(git rev-parse HEAD)" || [ "$head_revision" != "$GITHUB_SHA" ]; then
                      echo "::warning title=Ordered release tag skipped::The checked-out revision does not match GITHUB_SHA."
                      exit 0
                  fi

                  if ! position="$(git rev-list --first-parent --count "$GITHUB_SHA")"; then
                      echo "::warning title=Ordered release tag skipped::The source position could not be computed."
                      exit 0
                  fi

                  if ! [[ "$position" =~ ^[1-9][0-9]{0,11}$ ]]; then
                      echo "::warning title=Ordered release tag skipped::The source position is out of range."
                      exit 0
                  fi

                  if ! printf -v tag 'r%012d-%.6s' "$position" "$GITHUB_SHA"; then
                      echo "::warning title=Ordered release tag skipped::The source position could not be formatted."
                      exit 0
                  fi

                  if ! [[ "$tag" =~ $ORDERED_RELEASE_TAG_REGEX ]]; then
                      echo "::warning title=Ordered release tag skipped::${tag} does not match the required format."
                      exit 0
                  fi

                  echo "tag=${tag}" >> "$GITHUB_OUTPUT"

            - name: Warn when ordered image alias tag is unavailable
              if: ${{ steps.ordered-release.outputs.tag == '' }}
              shell: bash
              run: echo "::warning title=Ordered image alias tag unavailable::Ordered image alias publication was skipped because no ordered release tag was generated."

            - name: Set up Docker Buildx for ordered image alias
              if: ${{ steps.ordered-release.outputs.tag != '' }}
              uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

            - name: Configure AWS credentials for ordered image alias
              if: ${{ steps.ordered-release.outputs.tag != '' }}
              uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
              with:
                  role-to-assume: ${{ vars.AWS_ECR_POSTHOG_MASTER_PUBLISH_IAM_ROLE }}
                  aws-region: us-east-1

            - name: Log in to Amazon ECR for ordered image alias
              if: ${{ steps.ordered-release.outputs.tag != '' }}
              id: ecr-login
              uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78 # v2.1.2

            - name: Publish and read back ordered image alias
              if: ${{ steps.ordered-release.outputs.tag != '' }}
              timeout-minutes: 2
              shell: bash
              env:
                  ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
                  ECR_REPO: posthog-node
                  EXPECTED_DIGEST: ${{ needs.build.outputs.image-digest }}
                  ORDERED_ALIAS: ${{ steps.ordered-release.outputs.tag }}
              run: |
                  set -uo pipefail

                  if [ -z "$EXPECTED_DIGEST" ]; then
                      echo "::warning title=Ordered image alias source digest unavailable::Ordered image alias publication was skipped because no image digest was resolved."
                      exit 0
                  fi

                  if [ -z "$ECR_REGISTRY" ]; then
                      echo "::warning title=Ordered image alias destination unavailable::Ordered image alias publication was skipped because the ECR registry resolved empty."
                      exit 0
                  fi

                  SOURCE_IMAGE="${ECR_REGISTRY}/${ECR_REPO}@${EXPECTED_DIGEST}"
                  TARGET_IMAGE="${ECR_REGISTRY}/${ECR_REPO}:${ORDERED_ALIAS}"

                  publication_status=0
                  timeout --kill-after=5s 40s docker buildx imagetools create \
                      --prefer-index=false \
                      --tag "$TARGET_IMAGE" \
                      "$SOURCE_IMAGE" || publication_status=$?
                  if [ "$publication_status" -ne 0 ]; then
                      echo "::warning::Ordered alias publication exited with status $publication_status"
                  fi

                  readback_status=0
                  resolved_digest="$(timeout --kill-after=5s 40s aws ecr batch-get-image \
                      --repository-name "$ECR_REPO" \
                      --image-ids imageTag="$ORDERED_ALIAS" \
                      --accepted-media-types \
                          "application/vnd.oci.image.index.v1+json" \
                          "application/vnd.docker.distribution.manifest.list.v2+json" \
                          "application/vnd.oci.image.manifest.v1+json" \
                          "application/vnd.docker.distribution.manifest.v2+json" \
                      --query 'images[0].imageId.imageDigest' \
                      --output text)" || readback_status=$?

                  if [ "$readback_status" -ne 0 ]; then
                      result=unknown
                  elif [ "$resolved_digest" = "None" ]; then
                      result=absent
                  elif [[ "$resolved_digest" =~ ^sha256:[0-9a-f]{64}$ ]] && [ "$resolved_digest" = "$EXPECTED_DIGEST" ]; then
                      result=present-at-expected-digest
                  elif [[ "$resolved_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                      result=integrity-mismatch
                  else
                      result=unknown
                  fi

                  case "$result" in
                      present-at-expected-digest)
                          echo "::notice title=Ordered image alias present::The ordered image alias resolves to the expected image digest."
                          ;;
                      absent)
                          echo "::warning title=Ordered image alias absent::The ordered image alias is absent after publication."
                          ;;
                      integrity-mismatch)
                          echo "::error title=Ordered image alias integrity mismatch::The ordered image alias resolves to a different image digest."
                          ;;
                      unknown)
                          echo "::error title=Ordered image alias read-back unavailable::The ordered image alias could not be read back from ECR."
                          ;;
                  esac
