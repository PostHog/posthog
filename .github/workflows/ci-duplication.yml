name: Duplication lint

on:
    pull_request:
        paths:
            - '**.py'
            - '**.ts'
            - '**.tsx'
            - '.github/workflows/ci-duplication.yml'
            - '.github/scripts/post-duplication-section.mjs'
            - 'bin/lint_duplication.py'
            - 'bin/lint-duplication.limits.json'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    duplication:
        name: Duplication lint
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 10
        # Advisory while the gate proves itself; promote to blocking once it
        # has run clean across open PRs for a while.
        continue-on-error: true
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - name: Fetch PR base for the clone baseline
              env:
                  BASE_REF: ${{ github.event.pull_request.base.ref || 'master' }}
              run: git fetch --no-tags --depth=1 origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
            - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version-file: .nvmrc
            - name: Lint for new duplication
              run: |
                  if [ ! -f bin/lint_duplication.py ]; then
                      echo "bin/lint_duplication.py not present on this branch; skipping"
                      exit 0
                  fi
                  python3 bin/lint_duplication.py --base "origin/${{ github.event.pull_request.base.ref || 'master' }}" --report-dir .
            # always() so findings still reach the comment when the lint step fails.
            # Skipped on trunk-merge/** branches: merge-queue draft PRs are ephemeral and
            # unread, and each section write spends shared GITHUB_TOKEN budget.
            - name: Post CI report — duplication (Python)
              if: always() && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'trunk-merge/')
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  if [ -f .github/scripts/post-duplication-section.mjs ] && [ -f duplication-findings-python.json ]; then
                      node .github/scripts/post-duplication-section.mjs python duplication-findings-python.json
                  else
                      echo "Skipping the duplication report section: script or findings not on this branch"
                  fi
            - name: Post CI report — duplication (TypeScript)
              if: always() && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'trunk-merge/')
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  if [ -f .github/scripts/post-duplication-section.mjs ] && [ -f duplication-findings-ts.json ]; then
                      node .github/scripts/post-duplication-section.mjs typescript duplication-findings-ts.json
                  else
                      echo "Skipping the duplication report section: script or findings not on this branch"
                  fi
