name: Terminal relay CI

on:
    pull_request:
        paths:
            - 'services/terminal-relay/**'
            - '.github/workflows/ci-terminal-relay.yml'
    push:
        branches: [master]
        paths:
            - 'services/terminal-relay/**'
            - '.github/workflows/ci-terminal-relay.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - name: Build relay image
              run: docker build -t terminal-relay:test services/terminal-relay
            - name: Test relay protocol
              run: |
                  docker run --rm --user 0 --entrypoint sh \
                    -v "$PWD/services/terminal-relay/test_relay.py:/app/test_relay.py:ro" \
                    terminal-relay:test -c 'pip install --no-cache-dir parameterized==0.9.0 && python -m unittest test_relay'
