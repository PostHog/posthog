name: Update AI Costs Stale Alert

on:
    workflow_dispatch:
    schedule:
        - cron: '20 * * * 1-5'

permissions:
    actions: read
    contents: read
    pull-requests: read

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

env:
    SLACK_CHANNEL: 'C0CB80UM50Q'

jobs:
    alert-stale-pr:
        runs-on: ubuntu-24.04
        timeout-minutes: 5

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
                  sparse-checkout: .github/scripts/update-ai-costs-stale-alert.js
                  sparse-checkout-cone-mode: false

            - name: Check the open LLM cost PR
              id: check
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
              with:
                  script: |
                      const checkStaleCostPr = require('./.github/scripts/update-ai-costs-stale-alert.js')
                      await checkStaleCostPr(
                          { github, context, core },
                          { supportHeroGroup: 'S0CDU0BNFJ4', aiObservabilityGroup: 'S097J2WH3QX' }
                      )

            - name: Post to Slack
              if: steps.check.outputs.text != ''
              uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
              with:
                  method: chat.postMessage
                  token: ${{ secrets.SLACK_DEVEX_BOT_TOKEN }}
                  errors: true
                  payload: |
                      channel: "${{ env.SLACK_CHANNEL }}"
                      unfurl_links: false
                      text: "${{ steps.check.outputs.text }}"
