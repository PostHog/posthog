name: Test quarantine

on:
    pull_request:
        paths:
            - .test_quarantine.json
            - tools/hogli-commands/hogli_commands/quarantine/**
            - .github/workflows/test-quarantine.yml
            - .github/actions/test-quarantine/**

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    check-quarantine:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Check quarantine file
              uses: ./.github/actions/test-quarantine
              with:
                  args: check
