name: Cached schema removals

on:
    pull_request:
        types: [opened, synchronize, reopened, edited]
        paths:
            - 'frontend/src/queries/schema.json'
            - '.github/scripts/check_cached_schema_removals.py'
            - '.github/workflows/ci-cached-schema-removals.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read
    pull-requests: write

jobs:
    check:
        name: Check for fields removed from cached models
        if: ${{ !startsWith(github.head_ref, 'trunk-merge/') }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: |
                      .github/scripts/check_cached_schema_removals.py
                      frontend/src/queries/schema.json
                  sparse-checkout-cone-mode: false

            # The checkout is the PR merged into the base branch, so its first parent is the base the PR is compared with.
            - name: Read the schema from the base branch
              run: |
                  echo "COMMENT_FILE=$RUNNER_TEMP/cached-schema-removals.md" >> "$GITHUB_ENV"
                  base_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq '.parents[0].sha')
                  gh api "repos/$GITHUB_REPOSITORY/contents/frontend/src/queries/schema.json?ref=$base_sha" \
                      -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/base-schema.json"

            - name: Compare the cached model definitions
              id: compare
              env:
                  PR_BODY: ${{ github.event.pull_request.body }}
              run: |
                  python3 .github/scripts/check_cached_schema_removals.py \
                      "$RUNNER_TEMP/base-schema.json" frontend/src/queries/schema.json "$COMMENT_FILE"
                  if [ -f "$COMMENT_FILE" ]; then
                      cat "$COMMENT_FILE" >> "$GITHUB_STEP_SUMMARY"
                  fi

            # Fork tokens cannot write, so fork PRs get the step summary and the failing check only.
            - name: Update the pull request comment
              if: github.event.pull_request.head.repo.full_name == github.repository
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  REMOVED: ${{ steps.compare.outputs.removed }}
              run: |
                  comments_url="repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
                  ids=$(gh api "$comments_url" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- cached-schema-removal -->"))) | .id')
                  comment_id=${ids%%$'\n'*}
                  if [ "$REMOVED" != "true" ]; then
                      if [ -n "$comment_id" ]; then
                          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id"
                      fi
                  elif [ -n "$comment_id" ]; then
                      gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@"$COMMENT_FILE"
                  else
                      gh api "$comments_url" -F body=@"$COMMENT_FILE"
                  fi

            - name: Require an acknowledgement
              if: steps.compare.outputs.removed == 'true' && steps.compare.outputs.acknowledged != 'true'
              run: |
                  echo "::error::This PR removes fields that cached query responses can still hold. Add a 'Cache impact: deprecated', 'accepted' or 'bumped' line to the PR description. See the job summary for the cost of each option."
                  exit 1
