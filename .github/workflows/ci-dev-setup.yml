name: Dev Setup

on:
    pull_request:
        paths:
            - '.flox/**'
            - 'devenv.nix'
            - 'devenv.yaml'
            - 'devenv.lock'
            - 'bin/devenv-tasks.sh'
            - 'bin/helpers/dev-setup-steps.sh'
            - '.github/workflows/ci-dev-setup.yml'
            - 'bin/start'
            - 'pyproject.toml'
            - 'uv.lock'
            - 'pnpm-lock.yaml'
            - 'package.json'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    flox-dev-setup:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        # Skipped on trunk-merge/** heads: merge-queue PRs are ephemeral and every
        # constituent PR already ran this in full.
        if: ${{ !startsWith(github.head_ref, 'trunk-merge/') }}

        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Install Flox
              uses: flox/install-flox-action@c94e7e1ab56ae14fe98bae4fd84384fd135f0c2a # v2.4.0
              with:
                  # This workflow only runs on pull_request, so the cache is never seeded on
                  # master and every PR writes a branch-scoped copy nothing else can read.
                  # Re-downloading the installer on a free runner is cheaper than the churn.
                  use-cache: false

            - name: Activate Flox and verify dev setup
              run: |
                  flox activate -- bash -c '
                    set -euo pipefail

                    echo "--- Flox environment activated successfully ---"

                    echo "--- Toolchain versions ---"
                    echo "Go:     $(go version)"
                    echo "Node:   $(node --version)"
                    echo "Python: $(python --version 2>&1)"
                    echo "Rust:   $(rustc --version)"
                    echo "pnpm:   $(pnpm --version)"
                    echo "uv:     $(uv --version)"

                    echo "--- Python environment ---"
                    uv run python -c "import django; print(f\"Django: {django.__version__}\")"

                    echo "--- Node packages ---"
                    pnpm --filter=@posthog/frontend exec tsc --version
                    pnpm --filter=@posthog/frontend exec tsgo --version
                  '

            - name: Check lockfile consistency
              run: |
                  # git diff cannot see an untracked file, so a deletion would
                  # otherwise pass: flox activate just regenerates it untracked.
                  if ! git ls-files --error-unmatch .flox/env/manifest.lock > /dev/null 2>&1; then
                    echo "::error::.flox/env/manifest.lock must stay tracked. Untracked, every fresh clone resolves against the catalog again, which needs a FloxHub account."
                    exit 1
                  fi
                  if ! git diff --exit-code -- uv.lock pnpm-lock.yaml .flox/env/manifest.lock; then
                    echo "::error::Lockfiles were modified by flox activate. Please commit the updated lockfiles."
                    exit 1
                  fi

    devenv-dev-setup:
        runs-on: ubuntu-24.04
        # Longer than the flox job: this one also evaluates the flake inputs and
        # builds devenv itself before the environment can be entered.
        timeout-minutes: 45
        # Skipped on trunk-merge/** heads: merge-queue PRs are ephemeral and every
        # constituent PR already ran this in full.
        if: ${{ !startsWith(github.head_ref, 'trunk-merge/') }}

        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            # A workflow edit reaches every open PR at once, but devenv.nix only
            # reaches a branch when it rebases. The paths above still fire this
            # workflow on a branch that predates devenv, so report the absence and
            # skip instead of failing on a missing file.
            - name: Check whether the branch carries devenv
              id: has-devenv
              run: |
                  if [ -f devenv.nix ]; then
                    echo "present=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "present=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::devenv.nix is absent on this branch. Rebase on master to run the devenv setup check."
                  fi

            - name: Install Nix
              if: steps.has-devenv.outputs.present == 'true'
              uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
              with:
                  # Flake inputs are fetched from GitHub, which rate-limits anonymous
                  # requests per runner IP.
                  github_access_token: ${{ github.token }}

            # devenv comes from nixpkgs, which cache.nixos.org already has built, so
            # no extra substituter has to be trusted. The revision is pinned rather
            # than taken from the flake registry, so the job does not silently move
            # to a new devenv. Bump it by hand when devenv releases.
            - name: Build devenv
              if: steps.has-devenv.outputs.present == 'true'
              run: nix build github:NixOS/nixpkgs/0af3d1402dec3fc7e93635e511d1f7428c89cebf#devenv --out-link "$RUNNER_TEMP/devenv"

            - name: Enter devenv and verify dev setup
              if: steps.has-devenv.outputs.present == 'true'
              run: |
                  "$RUNNER_TEMP/devenv/bin/devenv" shell -- bash -c '
                    set -euo pipefail

                    echo "--- devenv environment entered successfully ---"

                    echo "--- Toolchain versions ---"
                    echo "Go:     $(go version)"
                    echo "Node:   $(node --version)"
                    echo "Python: $(python --version 2>&1)"
                    echo "Rust:   $(rustc --version)"
                    echo "pnpm:   $(pnpm --version)"
                    echo "uv:     $(uv --version)"

                    echo "--- Python environment ---"
                    uv run python -c "import django; print(f\"Django: {django.__version__}\")"

                    echo "--- Node packages ---"
                    pnpm --filter=@posthog/frontend exec tsc --version
                    pnpm --filter=@posthog/frontend exec tsgo --version
                  '

            - name: Check lockfile consistency
              if: steps.has-devenv.outputs.present == 'true'
              run: |
                  # git diff cannot see an untracked file, so a deletion would
                  # otherwise pass: devenv just regenerates it untracked.
                  if ! git ls-files --error-unmatch devenv.lock > /dev/null 2>&1; then
                    echo "::error::devenv.lock must stay tracked. Untracked, every clone re-resolves the flake inputs and gets a different package set."
                    exit 1
                  fi
                  if ! git diff --exit-code -- uv.lock pnpm-lock.yaml devenv.lock; then
                    echo "::error::Lockfiles were modified by devenv shell. Please commit the updated lockfiles."
                    exit 1
                  fi
