name: Ingestion Node CI

# The ingestion packages are members of the root pnpm workspace, so every job installs from the root
# lockfile filtered to @posthog/ingestion and its dependencies, and turbo builds those dependencies
# (including the native addons, which is why the Rust toolchain is installed). The databases come from
# ingestion/pinned/schema and ingestion's own migrations; no Python runs.

on:
    workflow_dispatch:
    push:
        branches: [master]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    changes:
        name: Determine need to run ingestion Node checks
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        if: github.repository == 'PostHog/posthog'
        permissions:
            contents: read
            pull-requests: read
        outputs:
            node: ${{ steps.filter.outputs.node || 'true' }}
            e2e: ${{ steps.filter.outputs.e2e || 'true' }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  clean: false
                  sparse-checkout: ingestion/ci/actions/paths-filter
                  sparse-checkout-cone-mode: false
            - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              id: app-token
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_PATHS_FILTER_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_PATHS_FILTER_PRIVATE_KEY }}
            - uses: ./ingestion/ci/actions/paths-filter
              id: filter
              if: github.event_name != 'push'
              with:
                  token: ${{ steps.app-token.outputs.token || github.token }}
                  filters: |
                      node:
                        - 'ingestion/node/**'
                        - 'ingestion/proto/**'
                        - 'ingestion/pinned/**'
                        - 'ingestion/ci/**'
                        - 'ingestion/rust/persons_migrations/**'
                        # Workspace dependencies consumed by path.
                        - 'nodejs/packages/common/**'
                        - 'nodejs/packages/replay-storage/**'
                        - 'nodejs/packages/hog-engine/**'
                        - 'common/hogvm/typescript/**'
                        - 'rust/common/hogvm/**'
                        - 'rust/replay-anonymizer/**'
                        - 'rust/replay-anonymizer-node/**'
                        - 'rust/ai-research/**'
                        - 'rust/Cargo.toml'
                        - 'rust/Cargo.lock'
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'pnpm-workspace.yaml'
                        - 'turbo.json'
                        - 'patches/**'
                        - '.nvmrc'
                        # The clientwarnings e2e replays capture's envelope fixture and the no-drift test reads the generated table.
                        - 'ingestion/rust/ingestion_warnings/*.json'
                        # node-common's schema-check test reads every Django app's migrations and the routing
                        # file to prove that each table Node SQL reads has a migration the check covers.
                        - 'posthog/*/migrations/**'
                        - 'posthog/migrations/**'
                        - 'ee/migrations/**'
                        - 'products/*/backend/migrations/**'
                        - 'products/db_routing.yaml'
                        - 'rust/cyclotron-node-migrations/**'
                        - 'rust/behavioral_cohorts_migrations/**'
                        - '.github/workflows/ingestion-node.yml'
                      # The service e2e tests spawn the Rust ingestion consumer and the personhog stack.
                      e2e:
                        - 'ingestion/rust/ingestion-consumer/**'
                        - 'ingestion/rust/ingestion-worker-proto/**'
                        - 'ingestion/rust/personhog-*/**'
                        - 'rust/common/**'
                        - 'rust/Cargo.toml'
                        - 'rust/Cargo.lock'

    check:
        name: Typecheck, lint and format
        needs: changes
        if: needs.changes.outputs.node == 'true'
        runs-on: depot-ubuntu-24.04-4
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  clean: false
            - uses: ./ingestion/ci/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/ingestion... --filter=@posthog/ingestion-ai-research... install --frozen-lockfile
            - uses: ./ingestion/ci/actions/setup-rust
              with:
                  toolchain: 1.91.1
            - name: Set sccache WebDAV key prefix (Cargo.lock hash)
              run: echo "SCCACHE_WEBDAV_KEY_PREFIX=cargo-${{ hashFiles('rust/Cargo.lock') }}" >> "$GITHUB_ENV"
            - uses: ./ingestion/ci/actions/setup-sccache
            - name: Build the dependencies
              run: bin/turbo --filter=@posthog/ingestion --filter=@posthog/ingestion-ai-research prepare
            - name: Typecheck
              run: pnpm --filter=@posthog/node-common --filter=@posthog/ingestion-common --filter=@posthog/replay-storage --filter=@posthog/ingestion --filter=@posthog/ingestion-ai-research typescript:check
            - name: Lint
              run: pnpm --filter=@posthog/node-common --filter=@posthog/ingestion-common --filter=@posthog/replay-storage --filter=@posthog/ingestion --filter=@posthog/ingestion-ai-research lint
            - name: Check formatting
              run: pnpm --filter=@posthog/node-common --filter=@posthog/ingestion-common --filter=@posthog/replay-storage --filter=@posthog/ingestion --filter=@posthog/ingestion-ai-research format:check

    test:
        name: Test (${{ matrix.package }}, ${{ matrix.lane }} ${{ matrix.shard }}/${{ matrix.shard_count }})
        needs: changes
        if: needs.changes.outputs.node == 'true'
        runs-on: depot-ubuntu-24.04-4
        timeout-minutes: 30
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { package: common, lane: parallel, shard: 1, shard_count: 1 }
                    - { package: ingestion-common, lane: parallel, shard: 1, shard_count: 1 }
                    - { package: replay-storage, lane: parallel, shard: 1, shard_count: 1 }
                    - { package: ingestion, lane: parallel, shard: 1, shard_count: 3 }
                    - { package: ingestion, lane: parallel, shard: 2, shard_count: 3 }
                    - { package: ingestion, lane: parallel, shard: 3, shard_count: 3 }
                    - { package: ingestion, lane: serial, shard: 1, shard_count: 2 }
                    - { package: ingestion, lane: serial, shard: 2, shard_count: 2 }
                    - { package: ingestion, lane: postgres-parity, shard: 1, shard_count: 1 }
                    - { package: ai-research, lane: parallel, shard: 1, shard_count: 1 }
                    - { package: ai-research, lane: serial, shard: 1, shard_count: 1 }
        env:
            DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USER }}
            DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  clean: false
            - name: Log in to Docker Hub
              continue-on-error: true
              if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  username: ${{ vars.DOCKERHUB_USER }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Start the services
              working-directory: ingestion/ci
              env:
                  COMPOSE_FILE: ${{ github.workspace }}/ingestion/ci/docker-compose.yml
                  WAIT_FOR_DOCKER_LAUNCH_RETRY_DELAY: 10
              run: |
                  bin/ci-wait-for-docker launch --down db kafka redis7 valkey-cluster clickhouse objectstorage seaweedfs dynamodb
                  bin/ci-wait-for-docker wait --only db kafka redis7 valkey-cluster clickhouse objectstorage seaweedfs dynamodb
                  echo "127.0.0.1 db redis7 kafka clickhouse objectstorage seaweedfs" | sudo tee -a /etc/hosts
            # Its own step: the launch above exports the compose project name through GITHUB_ENV,
            # which only later steps see, and the default name would start a second stack.
            - name: Create the Kafka topics
              working-directory: ingestion/ci
              run: docker compose up kafka-init
            - uses: ./ingestion/ci/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/ingestion... --filter=@posthog/ingestion-ai-research... install --frozen-lockfile
            - uses: ./ingestion/ci/actions/setup-rust
              with:
                  toolchain: 1.91.1
            - name: Set sccache WebDAV key prefix (Cargo.lock hash)
              run: echo "SCCACHE_WEBDAV_KEY_PREFIX=cargo-${{ hashFiles('rust/Cargo.lock') }}" >> "$GITHUB_ENV"
            - uses: ./ingestion/ci/actions/setup-sccache
            - uses: ./ingestion/ci/actions/setup-sqlx-cli
            # The Django tables the services read come from the pinned schema; the persons tables from ingestion's
            # own migrations.
            - name: Create the test databases
              env:
                  PGPASSWORD: posthog
              run: |
                  psql -h localhost -U posthog -d postgres -c 'CREATE DATABASE test_posthog'
                  psql -h localhost -U posthog -d test_posthog -v ON_ERROR_STOP=1 -q -f ingestion/pinned/schema/postgres.sql
                  DATABASE_URL=postgres://posthog:posthog@localhost:5432/test_persons sqlx database create
                  DATABASE_URL=postgres://posthog:posthog@localhost:5432/test_persons sqlx migrate run --source ingestion/rust/persons_migrations/
                  curl -fsS 'http://localhost:8123/' --data-binary 'CREATE DATABASE IF NOT EXISTS posthog_test'
                  python3 ingestion/ci/bin/clickhouse_apply.py ingestion/pinned/schema/clickhouse.sql
            - name: Create the parity database
              if: matrix.lane == 'postgres-parity'
              run: pnpm --filter=@posthog/ingestion setup:test:persons-parity
            - name: Download MaxMind database
              run: ingestion/ci/bin/download-mmdb
            - name: Build the dependencies
              run: bin/turbo --filter=@posthog/ingestion --filter=@posthog/ingestion-ai-research prepare
            - name: Test with Jest
              id: run-tests
              continue-on-error: true
              env:
                  SHARD_INDEX: ${{ matrix.shard }}
                  SHARD_COUNT: ${{ matrix.shard_count }}
                  PERSONS_DATABASE_URL: ${{ matrix.lane == 'postgres-parity' && 'postgres://posthog:posthog@localhost:5432/test_persons_parity' || 'postgres://posthog:posthog@localhost:5432/test_persons' }}
                  PERSONS_READONLY_DATABASE_URL: ${{ matrix.lane == 'postgres-parity' && 'postgres://posthog:posthog@localhost:5432/test_persons_parity' || 'postgres://posthog:posthog@localhost:5432/test_persons' }}
                  JEST_JUNIT_OUTPUT_DIR: ${{ github.workspace }}/ingestion/node/junit
                  JEST_JUNIT_OUTPUT_NAME: junit-${{ matrix.package }}-${{ matrix.lane }}-${{ matrix.shard }}.xml
                  HOG_BYTECODE_CACHE_REQUIRED: 'true'
                  HOG_BYTECODE_CACHE_DIR: ${{ github.workspace }}/ingestion/node/packages/ingestion/tests/fixtures/hog-bytecode
              run: |
                  if [ "${{ matrix.package }}" = "common" ]; then
                      pnpm --filter=@posthog/node-common test
                  elif [ "${{ matrix.package }}" = "ingestion-common" ]; then
                      pnpm --filter=@posthog/ingestion-common test
                  elif [ "${{ matrix.package }}" = "replay-storage" ]; then
                      pnpm --filter=@posthog/replay-storage test
                  elif [ "${{ matrix.package }}" = "ai-research" ]; then
                      pnpm --filter=@posthog/ingestion-ai-research test:${{ matrix.lane }}
                  else
                      pnpm --filter=@posthog/ingestion test:${{ matrix.lane }}
                  fi
            - name: Quarantine gate
              uses: ./ingestion/ci/actions/trunk-quarantine-gate
              with:
                  junit-paths: ingestion/node/junit/junit-*.xml
                  previous-step-outcome: ${{ steps.run-tests.outcome }}
                  token: ${{ secrets.TRUNK_API_TOKEN }}
                  variant: ingestion-node

    e2e:
        name: Service e2e
        needs: changes
        if: needs.changes.outputs.node == 'true' || needs.changes.outputs.e2e == 'true'
        runs-on: depot-ubuntu-24.04-4
        timeout-minutes: 30
        permissions:
            contents: read
        env:
            DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USER }}
            DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  clean: false
            - name: Log in to Docker Hub
              continue-on-error: true
              if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  username: ${{ vars.DOCKERHUB_USER }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            # etcd is for the personhog stack the Kafka parity test spawns.
            - name: Start the services
              working-directory: ingestion/ci
              env:
                  COMPOSE_FILE: ${{ github.workspace }}/ingestion/ci/docker-compose.yml
                  WAIT_FOR_DOCKER_LAUNCH_RETRY_DELAY: 10
              run: |
                  bin/ci-wait-for-docker launch --down db kafka redis7 valkey-cluster clickhouse etcd objectstorage seaweedfs dynamodb
                  bin/ci-wait-for-docker wait --only db kafka redis7 valkey-cluster clickhouse etcd objectstorage seaweedfs dynamodb
                  echo "127.0.0.1 db redis7 kafka clickhouse objectstorage seaweedfs" | sudo tee -a /etc/hosts
            - name: Create the Kafka topics
              working-directory: ingestion/ci
              run: docker compose up kafka-init
            - uses: ./ingestion/ci/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/ingestion... install --frozen-lockfile
            - uses: ./ingestion/ci/actions/setup-protoc
            - uses: ./ingestion/ci/actions/setup-rust
              with:
                  toolchain: 1.91.1
            - name: Set sccache WebDAV key prefix (Cargo.lock hash)
              run: echo "SCCACHE_WEBDAV_KEY_PREFIX=cargo-${{ hashFiles('rust/Cargo.lock') }}" >> "$GITHUB_ENV"
            - uses: ./ingestion/ci/actions/setup-sccache
            - uses: ./ingestion/ci/actions/setup-sqlx-cli
            - name: Create the test databases
              env:
                  PGPASSWORD: posthog
              run: |
                  psql -h localhost -U posthog -d postgres -c 'CREATE DATABASE test_posthog'
                  psql -h localhost -U posthog -d test_posthog -v ON_ERROR_STOP=1 -q -f ingestion/pinned/schema/postgres.sql
                  DATABASE_URL=postgres://posthog:posthog@localhost:5432/test_persons sqlx database create
                  DATABASE_URL=postgres://posthog:posthog@localhost:5432/test_persons sqlx migrate run --source ingestion/rust/persons_migrations/
                  curl -fsS 'http://localhost:8123/' --data-binary 'CREATE DATABASE IF NOT EXISTS posthog_test'
                  python3 ingestion/ci/bin/clickhouse_apply.py ingestion/pinned/schema/clickhouse.sql
            - name: Download MaxMind database
              run: ingestion/ci/bin/download-mmdb
            - name: Build the dependencies
              run: bin/turbo --filter=@posthog/ingestion prepare
            - name: Build the Rust ingestion consumer and the personhog stack
              working-directory: rust
              run: cargo build -p ingestion-consumer -p personhog-replica -p personhog-router -p personhog-leader -p personhog-writer -p personhog-identity -p personhog-test-harness -p personhog-parity-monitor
            - name: Test the Rust ingestion consumer against the Node ingestion API
              env:
                  NODE_OPTIONS: '--max_old_space_size=4096'
                  LOG_LEVEL: ${{ runner.debug == '1' && 'info' || 'error' }}
              run: pnpm --filter=@posthog/ingestion test:rust-ingestion-e2e
            - name: Test Kafka parity between the Postgres and personhog person backends
              env:
                  NODE_OPTIONS: '--max_old_space_size=4096'
                  LOG_LEVEL: ${{ runner.debug == '1' && 'info' || 'error' }}
              run: pnpm --filter=@posthog/ingestion test:personhog-kafka-parity-e2e
            - name: Upload the personhog stack logs
              if: failure()
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: personhog-kafka-parity-logs
                  path: rust/target/debug/harness-logs/
                  if-no-files-found: ignore
                  retention-days: 7
            - name: Dump the ClickHouse logs on failure
              if: failure()
              working-directory: ingestion/ci
              run: |
                  docker compose logs --no-color --tail=500 clickhouse || true

    ingestion_node_tests:
        name: Ingestion Node Tests Pass
        needs: [changes, check, test, e2e]
        if: ${{ !cancelled() }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions: {}
        steps:
            - name: Check all ingestion Node jobs
              run: |
                  if [[ "${{ needs.changes.result }}" != "success" && "${{ needs.changes.result }}" != "skipped" ]]; then
                      echo "Change detection did not succeed (result: ${{ needs.changes.result }})."
                      exit 1
                  fi
                  if [[ "${{ needs.changes.outputs.node }}" != "true" && "${{ needs.changes.outputs.e2e }}" != "true" ]]; then
                      echo "Ingestion Node checks were skipped (no relevant changes)."
                      exit 0
                  fi
                  if [[ "${{ needs.check.result }}" != "success" && "${{ needs.check.result }}" != "skipped" ]]; then
                      echo "check did not pass (result: ${{ needs.check.result }})."
                      exit 1
                  fi
                  if [[ "${{ needs.test.result }}" != "success" && "${{ needs.test.result }}" != "skipped" ]]; then
                      echo "test did not pass (result: ${{ needs.test.result }})."
                      exit 1
                  fi
                  if [[ "${{ needs.e2e.result }}" != "success" && "${{ needs.e2e.result }}" != "skipped" ]]; then
                      echo "e2e did not pass (result: ${{ needs.e2e.result }})."
                      exit 1
                  fi
