# Revalidate every ownership identity against the GitHub org, once a week.
#
# The PR-scoped lint (validate-product-yamls in ci-backend.yml) only sees the ownership files a
# PR changed, so it cannot see a slug going stale after the file merged. A GitHub team that is
# renamed or deleted leaves valid-looking files behind, and the slug then routes its merges
# nowhere and drops out of reviewer assignment. This run reads every file again.

name: Ownership live lint

on:
    schedule:
        # Mondays, ahead of the 07:00 UTC stamphog digest, so a dead slug is reported before the
        # week's digests route on it.
        - cron: '17 6 * * 1'
    workflow_dispatch:

env:
    SLACK_CHANNEL: 'C0AS64N6DJL' # #alerts-devex

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled' || github.ref }}
    cancel-in-progress: false

jobs:
    owners-live-lint:
        name: Validate every ownership identity against GitHub
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            # Plain checkout: the lint reads every owners.yaml and product.yaml in the tree.
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            # Default GITHUB_TOKEN can't list /repos/{repo}/teams (needs org-level
            # `members: read`). Reuse the assign-reviewers app — same secret, same
            # use case. `owner: PostHog` scopes the issued token at the org so
            # org-level permissions actually flow through; otherwise the token is
            # repo-scoped and the org scope gets dropped.
            - name: Get app token
              id: app-token
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_POSTHOG_ASSIGN_REVIEWERS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_ASSIGN_REVIEWERS_PRIVATE_KEY }}
                  owner: ${{ github.repository_owner }}
                  # Literal: a cron payload carries no event.repository, and this file lives in one repo.
                  repositories: posthog

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: 3.13.13
                  # Reuse the app token already minted above instead of a second mint.
                  token: ${{ steps.app-token.outputs.token || github.token }}

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28'

            - name: Install Python dependencies
              run: UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev

            - name: Lint every ownership file against the GitHub org
              id: lint
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: ./bin/hogli owners:lint --live

            # Only the lint step failing means an ownership file names an identity the org no
            # longer has. Infra failures upstream (checkout, token, uv sync) are CI noise. Nobody
            # watches a scheduled run, so alert explicitly when the lint itself fails.
            - name: Notify Slack on lint failure
              if: failure() && steps.lint.outcome == 'failure'
              uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
              with:
                  method: chat.postMessage
                  token: ${{ secrets.SLACK_DEVEX_BOT_TOKEN }}
                  errors: true
                  payload: |
                      channel: "${{ env.SLACK_CHANNEL }}"
                      text: ":red_circle: Ownership live lint failed"
                      blocks:
                        - type: "section"
                          text:
                            type: "mrkdwn"
                            text: ":red_circle: *Ownership live lint failed*. An ownership file names a team slug or handle that no longer exists in the GitHub org, so its merges route nowhere and reviewer assignment skips it."
                        - type: "actions"
                          elements:
                            - type: "button"
                              text:
                                type: "plain_text"
                                text: "View run"
                              url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
