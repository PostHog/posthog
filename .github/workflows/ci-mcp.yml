name: MCP CI

on:
    push:
        branches: [master]
    pull_request:
        # Draft PRs run build + unit tests only; the integration tests (which boot
        # the full PostHog backend and trigger on any non-pytest Python change) run
        # when the PR is marked ready for review; that full run is the merge gate.
        # The `no-ci` label silences this workflow on a draft entirely (prototypes).
        # No labeled/unlabeled triggers here, so it takes effect from the next push.
        types: [opened, synchronize, reopened, ready_for_review]

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read
    pull-requests: read

jobs:
    changes:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        # A draft PR labeled `no-ci` skips this workflow entirely (prototypes):
        # every other job needs this one, and the gates treat skipped as success.
        # ready_for_review re-runs everything, so the merge gate is unaffected.
        if: >-
            github.event_name != 'pull_request'
            || github.event.pull_request.draft != true
            || startsWith(github.head_ref, 'trunk-merge/')
            || !contains(github.event.pull_request.labels.*.name, 'no-ci')
        name: Determine need to run MCP checks
        outputs:
            mcp: ${{ steps.filter.outputs.mcp || 'true' }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            # MCP integration tests boot the full PostHog backend (Django web server,
            # Celery worker, migrations, demo data), so the filter stays broad: any
            # non-pytest Python change across the app triggers it.
            - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              id: app-token
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              with:
                  client-id: ${{ secrets.GH_APP_POSTHOG_PATHS_FILTER_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_PATHS_FILTER_PRIVATE_KEY }}
            - uses: ./.github/actions/paths-filter
              id: filter
              if: github.event_name != 'push' # Run all tests on master push
              with:
                  token: ${{ steps.app-token.outputs.token || github.token }}
                  filters: |
                      mcp:
                        # MCP service and per-product tool/UI-app configs
                        - 'services/mcp/**'
                        - 'products/*/mcp/**'
                        # Bundled into the MCP server (parser recipe tools)
                        - 'packages/llm-normalizer/**'
                        # MCP integration tests exercise the full PostHog backend
                        - 'posthog/**/*.py'
                        - 'ee/**/*.py'
                        - 'common/**/*.py'
                        - 'products/*/backend/**/*.py'
                        # Query schemas used by MCP analytics tools
                        - 'frontend/src/queries/schema.json'
                        # Shared UI component library (used by MCP UI apps)
                        - 'common/mosaic/**'
                        # Code generation tooling
                        - 'tools/openapi-codegen/**'
                        # Django entry point (manage.py migrate / generate_demo_data)
                        - manage.py
                        # Python dependencies (build + integration-tests run `uv sync --frozen`)
                        - pyproject.toml
                        - uv.lock
                        # Node runtime + workspace dependencies
                        - .nvmrc
                        - pnpm-lock.yaml
                        # Docker compose stack (dev.yml extends base.yml)
                        - docker-compose.base.yml
                        - docker-compose.dev.yml
                        - docker-compose.profiles.yml
                        # Docker helper scripts invoked in CI setup
                        - bin/ci-wait-for-docker
                        - bin/ci-reserve-ports
                        - bin/wait-for-docker
                        # Database init scripts used by docker compose
                        - 'docker/postgres-init-scripts/**'
                        # Persons DB migrations (sqlx migrate run in integration tests)
                        - 'rust/persons_migrations/**'
                        # ClickHouse UDF copied in integration test setup
                        - 'posthog/user_scripts/latest_user_defined_function.xml'
                        # Composite actions used by the workflow
                        - '.github/actions/commit-snapshots/**'
                        # hogli db setup (db:restore-test-db). Scoped to the
                        # modules that command actually imports — framework,
                        # manifest, boot modules, db_schema — so unrelated hogli
                        # commands (doctor, devbox, ...) don't trigger this suite.
                        - 'tools/hogli/**'
                        - 'hogli.yaml'
                        - 'tools/hogli-commands/hogli_commands/db_schema.py'
                        - 'tools/hogli-commands/hogli_commands/prechecks.py'
                        - 'tools/hogli-commands/hogli_commands/telemetry_props.py'
                        - 'tools/hogli-commands/hogli_commands/hint_hook.py'
                        - 'tools/hogli-commands/hogli_commands/hints.py'
                        # CI config
                        - '.github/workflows/ci-mcp.yml'
                        - '.github/workflows/ci-mcp-integration-tests.yml'
                        - '.github/workflows/mcp-publish.yml'
                        # The integration tests drive a running Django server over HTTP and
                        # never import pytest modules, so exclude them. Narrow on purpose:
                        #  - modules, not whole test/ dirs: those also hold runtime code, such
                        #    as posthog/test/base.py, which the backend boot imports via
                        #    setup_test_environment.
                        #  - '*_test.py' only under products/*/backend, where it is the
                        #    colocated-test convention. Under posthog/ that suffix names
                        #    production code this suite runs (ClickHouse migrations, UDF
                        #    scripts copied into ClickHouse during setup).
                        #  - per-tree prefixes, because an exclude is tested against every file
                        #    the filter sees, not just the include it sits next to: a bare
                        #    '!**/conftest.py' would also veto tools/hogli/tests/conftest.py,
                        #    which the tools/hogli/** include above covers.
                        - '!posthog/**/test_*.py'
                        - '!posthog/**/conftest.py'
                        - '!ee/**/test_*.py'
                        - '!ee/**/conftest.py'
                        - '!common/**/test_*.py'
                        - '!common/**/conftest.py'
                        - '!products/*/backend/**/test_*.py'
                        - '!products/*/backend/**/*_test.py'
                        - '!products/*/backend/**/conftest.py'
    build:
        name: Build Package
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: changes
        if: needs.changes.outputs.mcp == 'true'

        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Mint setup-action GitHub token
              id: setup-gh-token
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              continue-on-error: true
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_PRIVATE_KEY }}
                  skip-token-revoke: true

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: 3.13.13
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28' # pinned: unpinned setup-uv calls GH API on every job, exhausts rate limit
                  enable-cache: true
                  cache-dependency-glob: uv.lock
                  save-cache: ${{ github.ref == 'refs/heads/master' }}

            - name: Install Python dependencies
              run: UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev

            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/root --filter=@posthog/mcp... --filter='./products/*' install --frozen-lockfile
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}

            - name: Check MCP code quality
              run: |
                  pnpm exec oxlint --quiet services/mcp
                  pnpm exec oxfmt --check "services/mcp/**/*.{md,mdx}"
                  pnpm exec oxfmt --check "services/mcp/**/*.{yaml,yml}"
                  pnpm exec markdownlint-cli2 --config .config/.markdownlint-cli2.jsonc "services/mcp/**/*.{md,mdx}"

            - name: Build package
              run: cd services/mcp && pnpm build

            - name: Type check (tsgo)
              run: cd services/mcp && pnpm typecheck

            - name: Check MCP schema is up to date
              run: |
                  ./bin/hogli build:schema-mcp
                  if ! git diff --exit-code services/mcp/schema/tool-inputs.json; then
                    echo ""
                    echo "::error::MCP tool-inputs.json is out of date. Run 'hogli build:schema-mcp' and commit the result."
                    exit 1
                  fi

            - name: Check generated UI apps are up to date
              run: |
                  cd services/mcp && pnpm run generate:ui-apps
                  if ! git diff --exit-code -- src/ui-apps/apps/generated/ src/resources/ui-apps.generated.ts; then
                    echo ""
                    echo "::warning::The following generated files are out of date:"
                    git diff --name-only -- src/ui-apps/apps/generated/ src/resources/ui-apps.generated.ts
                    echo ""
                    echo "::error::Generated UI app files are out of date. Run 'pnpm --filter=@posthog/mcp run generate:ui-apps' and commit the result."
                    exit 1
                  fi

            - name: Lint tool names
              run: cd services/mcp && pnpm lint-tool-names

    unit-tests:
        name: Unit Tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: changes
        if: needs.changes.outputs.mcp == 'true'
        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Mint setup-action GitHub token
              id: setup-gh-token
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              continue-on-error: true
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_PRIVATE_KEY }}
                  skip-token-revoke: true

            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/mcp... --filter='./products/*' install --frozen-lockfile
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}

            # The workers-pool project in vitest.config.mts parses wrangler.jsonc
            # up front and needs `assets.directory` (./public/) populated and
            # `shared/guidelines.md` (imported by src/mcp.ts) on disk. Both are
            # gitignored: public/ is produced by `pnpm build` (UI apps) and
            # guidelines.md by the wrangler build command.
            - name: Run wrangler pre-build steps
              working-directory: services/mcp
              run: |
                  pnpm build
                  pnpm exec tsx scripts/copy-instructions.ts

            - name: Run unit tests
              run: |
                  pnpm --filter=@posthog/mcp run test -u

                  if [ -n "$(git status --porcelain -- services/mcp/tests/unit)" ]; then
                    echo ""
                    git status --short -- services/mcp/tests/unit
                    echo "::error::MCP unit test artifacts are out of date. Run 'pnpm --filter=@posthog/mcp run test -u' and commit the result."
                    exit 1
                  fi

            - name: Run Hono unit tests
              run: cd services/mcp && pnpm run test:hono

            - name: Create snapshot patch
              id: create-snapshot-patch
              if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.actor, '[bot]') && github.actor != 'posthog-bot' && !contains(github.actor, 'github-actions') }}
              run: |
                  SNAPSHOT_PATH="services/mcp/tests/unit"

                  if [ -z "$(git status --porcelain -- "$SNAPSHOT_PATH")" ]; then
                    echo "No MCP unit test changes"
                    echo "has-changes=false" >> $GITHUB_OUTPUT
                  else
                    echo "MCP unit test changes detected:"
                    git status --short -- "$SNAPSHOT_PATH"

                    git add -N "$SNAPSHOT_PATH"
                    mkdir -p /tmp/patches
                    git diff --binary --full-index "$SNAPSHOT_PATH" > /tmp/patches/mcp-unit-tests.patch
                    echo "has-changes=true" >> $GITHUB_OUTPUT
                  fi

            - name: Upload snapshot patch
              if: ${{ steps.create-snapshot-patch.outputs.has-changes == 'true' && always() }}
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: mcp-snapshot-patch
                  path: /tmp/patches/mcp-unit-tests.patch
                  retention-days: 1
                  if-no-files-found: ignore

    # Attempt 1 of the integration tests. The job body lives in
    # ci-mcp-integration-tests.yml so the retry below can run the exact same
    # thing; workflow_call shares this run's dispatch, so the split costs no
    # extra dispatches. Skipped on drafts: these boot the full PostHog backend
    # and trigger on any non-pytest Python change, so they're the expensive
    # half of this workflow. Build and unit tests still run on drafts; the
    # `MCP Tests Pass` aggregator treats skipped as success, and the
    # ready-for-review run is the merge gate.
    integration-tests:
        name: Integration Tests
        needs: changes
        if: needs.changes.outputs.mcp == 'true' && (github.event.pull_request.draft != true || startsWith(github.head_ref, 'trunk-merge/'))
        uses: ./.github/workflows/ci-mcp-integration-tests.yml
        secrets: inherit

    # One retry on a fresh runner, only when attempt 1 died before its tests
    # started — that is setup/infra by construction (port binds, registry
    # timeouts; a dead runner leaves no outputs at all, so it lands here too).
    # The gate accepts a green retry, so the merge queue never sees a red
    # required check for a first infra failure. A failure during the tests is
    # real: tests-started is 'true', this job skips, and the gate reds.
    integration-tests-retry:
        name: Integration Tests (retry)
        needs: integration-tests
        if: >-
            !cancelled()
            && needs.integration-tests.result == 'failure'
            && needs.integration-tests.outputs.tests-started != 'true'
        uses: ./.github/workflows/ci-mcp-integration-tests.yml
        secrets: inherit

    handle-snapshots:
        name: Commit snapshot changes
        runs-on: ubuntu-latest
        timeout-minutes: 5
        needs: [changes, unit-tests]
        # A status function is required to commit regenerated snapshots even when unit-tests
        # failed (a snapshot mismatch fails that job). !cancelled() rather than always() so a
        # superseded run does not push a stale snapshot commit to the branch.
        if: ${{ !cancelled() && needs.changes.outputs.mcp == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.actor, '[bot]') && github.actor != 'posthog-bot' && !contains(github.actor, 'github-actions') }}
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Get app token
              id: app-token
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_POSTHOG_TESTS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_TESTS_PRIVATE_KEY }}

            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  token: ${{ steps.app-token.outputs.token }}
                  fetch-depth: 1

            - name: Download snapshot patches
              id: download-patches
              continue-on-error: true
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  pattern: mcp-snapshot-patch
                  path: /tmp/snapshot-patches
                  merge-multiple: true

            - name: Check for patches
              id: check-patches
              run: |
                  if [ "${{ steps.download-patches.outcome }}" == "failure" ] || [ ! -d /tmp/snapshot-patches ]; then
                    echo "has-patches=false" >> $GITHUB_OUTPUT
                    echo "No snapshot patches found"
                    exit 0
                  fi

                  if [ -n "$(find /tmp/snapshot-patches -name '*.patch' -type f -size +0c 2>/dev/null)" ]; then
                    echo "has-patches=true" >> $GITHUB_OUTPUT
                    echo "Found patches:"
                    ls -la /tmp/snapshot-patches/
                  else
                    echo "has-patches=false" >> $GITHUB_OUTPUT
                    echo "Patch files empty or missing - no snapshot changes"
                  fi

            - name: Commit snapshots
              if: steps.check-patches.outputs.has-patches == 'true'
              uses: ./.github/actions/commit-snapshots
              with:
                  workflow-type: mcp
                  patch-path: /tmp/snapshot-patches
                  snapshot-path: 'services/mcp/tests/unit/'
                  commit-message: 'test(mcp): update unit test snapshots'
                  pr-number: ${{ github.event.pull_request.number }}
                  repository: ${{ github.repository }}
                  commit-sha: ${{ github.event.pull_request.head.sha }}
                  branch-name: ${{ github.event.pull_request.head.ref }}
                  github-token: ${{ steps.app-token.outputs.token }}

    # Collation job for required status check
    mcp_tests:
        needs: [changes, build, unit-tests, integration-tests, integration-tests-retry, handle-snapshots]
        name: MCP Tests Pass
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: always()
        steps:
            - name: Check all MCP jobs
              run: |
                  # Fail if change detection failed or was cancelled (outputs are empty on cancel, so the exit below would report green).
                  if [[ "${{ needs.changes.result }}" != "success" && "${{ needs.changes.result }}" != "skipped" ]]; then
                    echo "Change detection did not succeed (result: ${{ needs.changes.result }})."
                    exit 1
                  fi

                  # Pass if no MCP changes detected (jobs were skipped)
                  if [[ "${{ needs.changes.outputs.mcp }}" != "true" ]]; then
                    echo "MCP checks were skipped (no relevant changes)."
                    exit 0
                  fi

                  if [[ "${{ needs.build.result }}" != "success" && "${{ needs.build.result }}" != "skipped" ]]; then
                    echo "MCP build did not succeed (result: ${{ needs.build.result }})."
                    exit 1
                  fi

                  if [[ "${{ needs.unit-tests.result }}" != "success" && "${{ needs.unit-tests.result }}" != "skipped" ]]; then
                    echo "MCP unit tests did not succeed (result: ${{ needs.unit-tests.result }})."
                    exit 1
                  fi

                  INTEGRATION_RESULT="${{ needs.integration-tests.result }}"
                  RETRY_RESULT="${{ needs.integration-tests-retry.result }}"

                  # A green retry upgrades attempt 1: the retry job only fires when
                  # attempt 1 failed before its tests started (setup/infra), so its
                  # success means the suite actually passed on a fresh runner. A real
                  # test failure leaves the retry skipped and attempt 1 red.
                  if [[ "$INTEGRATION_RESULT" == "failure" && "$RETRY_RESULT" == "success" ]]; then
                    echo "MCP integration tests failed during setup; the retry attempt passed."
                    INTEGRATION_RESULT="success"
                  fi

                  if [[ "$INTEGRATION_RESULT" != "success" && "$INTEGRATION_RESULT" != "skipped" ]]; then
                    echo "MCP integration tests did not succeed (result: $INTEGRATION_RESULT, retry: $RETRY_RESULT)."
                    exit 1
                  fi

                  if [[ "$RETRY_RESULT" != "success" && "$RETRY_RESULT" != "skipped" ]]; then
                    echo "MCP integration test retry did not succeed (result: $RETRY_RESULT)."
                    exit 1
                  fi

                  if [[ "${{ needs.handle-snapshots.result }}" != "success" && "${{ needs.handle-snapshots.result }}" != "skipped" ]]; then
                    echo "MCP snapshot commit job did not succeed (result: ${{ needs.handle-snapshots.result }})."
                    exit 1
                  fi

                  echo "All MCP checks passed."
