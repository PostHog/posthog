name: LLM Gateway CD

on:
    workflow_dispatch:
    push:
        branches:
            - master
        paths:
            - 'services/llm-gateway/**'
            - '.github/workflows/llm-gateway-cd.yml'

jobs:
    build:
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 10
        if: github.repository_owner == 'PostHog'

        permissions:
            contents: read
            packages: write
            id-token: write

        outputs:
            sha: ${{ steps.push.outputs.digest }}

        steps:
            - name: Check out llm-gateway code
              uses: actions/checkout@v6.0.2
              with:
                  sparse-checkout: |
                      services/llm-gateway/
                      .github/actions/docker-meta/
                  sparse-checkout-cone-mode: false

            - name: Docker meta and registry login
              id: docker-meta
              uses: $/.github/actions/docker-meta
              with:
                  image-name: llm-gateway
                  # Publishes only from the default branch — assume the role and touch ECR only there
                  # (a non-default-branch workflow_dispatch builds nothing to push).
                  aws-role-to-assume: ${{ vars.AWS_ECR_POSTHOG_MASTER_PUBLISH_IAM_ROLE }}
                  push-to-ecr: ${{ github.ref == 'refs/heads/master' }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  dockerhub-username: ${{ secrets.DOCKERHUB_USER }}
                  dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
                  # Legacy path — remove once Helm charts are updated to ghcr.io/posthog/<image>
                  legacy-images: ghcr.io/posthog/posthog/llm-gateway

            - name: Set up Depot CLI
              uses: depot/setup-action@v1.7.1

            - name: Build and push Docker image
              id: push
              if: github.repository_owner == 'PostHog' && vars.CD_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/master'
              uses: depot/build-push-action@v1.17.0
              with:
                  context: ./services/llm-gateway/
                  file: services/llm-gateway/Dockerfile
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: ${{ steps.docker-meta.outputs.tags }}
                  labels: ${{ steps.docker-meta.outputs.labels }}
                  annotations: ${{ steps.docker-meta.outputs.annotations }}
                  project: 90mkjhdrjz # llm-gateway depot project

    deploy:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        needs: build
        if: github.repository_owner == 'PostHog' && vars.CD_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/master'
        permissions: {}
        steps:
            - name: get deployer token
              id: deployer
              uses: actions/create-github-app-token@v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_CHARTS_DEPLOYER_APP_ID }}
                  private-key: ${{ secrets.GH_APP_CHARTS_DEPLOYER_PRIVATE_KEY }}
                  owner: PostHog
                  repositories: charts

            - name: Trigger llm-gateway deployment
              uses: peter-evans/repository-dispatch@v4.0.1
              with:
                  token: ${{ steps.deployer.outputs.token }}
                  repository: PostHog/charts
                  event-type: commit_state_update
                  client-payload: |
                      {
                        "values": {
                          "image": {
                            "sha": "${{ needs.build.outputs.sha }}"
                          }
                        },
                        "release": "llm-gateway",
                        "commit": ${{ toJson(github.event.head_commit) }},
                        "repository": "PostHog/posthog",
                        "labels": [],
                        "timestamp": "${{ github.event.head_commit.timestamp }}"
                      }
