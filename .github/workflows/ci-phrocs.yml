name: Phrocs TUI

on:
    push:
        branches:
            - master
        paths:
            - '.github/workflows/ci-phrocs.yml'
            - 'tools/phrocs/**'
    pull_request:
        paths:
            - '.github/workflows/ci-phrocs.yml'
            - 'tools/phrocs/**'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-24.04
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.2
              with:
                  sparse-checkout: tools/phrocs
                  sparse-checkout-cone-mode: false

            - name: Set up Go
              uses: actions/setup-go@v6.2.0
              with:
                  go-version: '1.26.10'
                  cache-dependency-path: tools/phrocs/go.sum

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@v9.2.0
              with:
                  version: latest
                  working-directory: tools/phrocs
                  args: --timeout=5m

            - name: Run tests
              run: cd tools/phrocs && go test -count=1 -v ./...
