name: shellcheck

on:
    pull_request:

permissions:
    contents: read

jobs:
    shell_check:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        name: shellcheck
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            # The runner image ships shellcheck, so apt is only a fallback. apt has
            # no retries and a 120s per-fetch timeout by default, and a stalled
            # mirror can hold this job past its timeout, which the merge queue
            # reads as a failed required check.
            - name: Install shellcheck
              run: |
                  if command -v shellcheck >/dev/null; then
                      shellcheck --version
                      exit 0
                  fi
                  sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
                  sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y shellcheck
            - name: Check secrets scripts
              run: cd bin && shellcheck deploy-hobby

            - name: Check Windows-compatible repository paths
              run: |
                  shellcheck .github/scripts/check-windows-paths.sh .github/scripts/check-windows-paths.test.sh
                  .github/scripts/check-windows-paths.test.sh
                  .github/scripts/check-windows-paths.sh

            - name: Check desktop backend coupling script
              run: |
                  shellcheck .github/scripts/desktop/*.sh
                  .github/scripts/desktop/check-pr-backend-coupling.test.sh

            - name: Check product JUnit preparation script
              run: |
                  shellcheck .github/scripts/prepare-product-junit-for-trunk.sh .github/scripts/prepare-product-junit-for-trunk.test.sh
                  bash .github/scripts/prepare-product-junit-for-trunk.test.sh

            # Runs here, not in a path-gated ci-* job, so AGENTS/CLAUDE changes
            # anywhere in the repo are validated on every PR.
            - name: Check AGENTS.md / CLAUDE.md symlinks
              run: |
                  shellcheck .github/scripts/check-agents-md-symlinks.sh
                  .github/scripts/check-agents-md-symlinks.sh
