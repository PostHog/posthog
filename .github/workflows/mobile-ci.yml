name: Mobile CI

# Typecheck, lint and unit tests for the PostHog mobile app (products/mobile).
# The app is its own pnpm workspace with its own lockfile, so this workflow never
# installs the repo root workspace.

on:
    # Trigger paths keep the workflow inert on every PR that does not touch the app.
    # Markdown is excluded because no check here reads it.
    pull_request:
        paths:
            - 'products/mobile/**'
            - '!products/mobile/**/*.md'
            - 'products/signals/frontend/generated/api.schemas.ts'
            - '.github/workflows/mobile-ci.yml'
    # Master pushes refresh the pnpm store cache that PR runs restore.
    push:
        branches: [master]
        paths:
            - 'products/mobile/**'
            - '!products/mobile/**/*.md'
            - 'products/signals/frontend/generated/api.schemas.ts'
            - '.github/workflows/mobile-ci.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    check:
        name: Typecheck, lint and test
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 15
        defaults:
            run:
                working-directory: products/mobile
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
                  sparse-checkout: |
                      products/mobile
                      products/signals/frontend/generated/api.schemas.ts
                  sparse-checkout-cone-mode: false

            # Reads packageManager from the app's package.json, not the repo root's,
            # so the pnpm that wrote products/mobile/pnpm-lock.yaml also installs it.
            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  package_json_file: products/mobile/package.json
              env:
                  # The action bootstraps pnpm with `npm ci`. A stalled npm audit or fetch
                  # waits for npm's 300s default, so cap each attempt and skip the audit.
                  # See .github/actions/setup-pnpm for the measured failure.
                  NPM_CONFIG_FETCH_TIMEOUT: 45000
                  NPM_CONFIG_FETCH_RETRIES: 2
                  NPM_CONFIG_AUDIT: 'false'
                  NPM_CONFIG_FUND: 'false'

            # The app pins its own Node in .node-version, which EAS builds read too.
            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: products/mobile/.node-version
                  token: ${{ github.token }}

            - name: Get pnpm store path
              id: pnpm-store
              run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            # Explicit restore and save instead of setup-node's `cache: pnpm`, which
            # saves on every run, PRs included. Only master pushes write the cache.
            - name: Restore pnpm store
              id: pnpm-cache
              uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: mobile-pnpm-${{ runner.os }}-${{ hashFiles('products/mobile/pnpm-lock.yaml') }}
                  restore-keys: mobile-pnpm-${{ runner.os }}-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Save pnpm store
              if: github.ref == 'refs/heads/master' && steps.pnpm-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: mobile-pnpm-${{ runner.os }}-${{ hashFiles('products/mobile/pnpm-lock.yaml') }}

            - name: Typecheck
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            - name: Test
              run: pnpm test --ci
