name: Mobile CI

# Typecheck, lint, unit tests and release metadata checks for the mobile app.
# App checks install the standalone mobile workspace. The replay bundle check
# installs only the two root workspace packages that produce the WebView player.
#
# The committed replay bundle is a pinned snapshot of the player, so a player change
# does not have to regenerate a file the mobile team owns. A PR that changes the
# bundle or its build script must match the current player source exactly. A PR
# that changes only the player builds the bundle to prove it still compiles.
#
# "Mobile CI Pass" reports on every pull request so repository rules can require it.
# PR housekeeping calls this workflow on each PR event. Change detection skips
# validation when the app, its imported API types, and its replay bundle inputs are unchanged.
# A trigger-level paths filter would leave unrelated PRs waiting for a status that never arrives.

on:
    workflow_call:
        secrets:
            GH_APP_POSTHOG_PATHS_FILTER_PRIVATE_KEY:
                required: true
    # Master pushes refresh the pnpm store cache that PR runs restore.
    push:
        branches: [master]
        paths:
            - 'products/mobile/**'
            - '!products/mobile/**/*.md'
            - '.github/workflows/mobile-ci.yml'

concurrency:
    # github.workflow is the caller's name, so the release caller and the PR
    # caller never cancel or wait on each other.
    group: mobile-ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    changes:
        name: Detect mobile changes
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
        outputs:
            # A push has no PR diff to filter: a master push already matched the
            # trigger paths, and the release caller validates its exact commit.
            mobile: ${{ steps.filter.outputs.mobile || 'true' }}
            api_types: ${{ steps.filter.outputs.api_types || 'false' }}
            # The pinned bundle is behind the player source on most master commits, so a push checks it
            # against the commit that last changed it (see the replay_bundle job) instead of against HEAD.
            replay_bundle: ${{ steps.filter.outputs.replay_bundle || 'false' }}
            replay_player: ${{ steps.filter.outputs.replay_player || 'true' }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
                  sparse-checkout: .github/actions/paths-filter
                  sparse-checkout-cone-mode: false
            - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              id: app-token
              if: github.repository == 'PostHog/posthog' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_PATHS_FILTER_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_PATHS_FILTER_PRIVATE_KEY }}
                  permission-pull-requests: read
            - uses: ./.github/actions/paths-filter
              id: filter
              if: github.event_name != 'push'
              with:
                  token: ${{ steps.app-token.outputs.token || github.token }}
                  filters: |
                      mobile:
                          - 'products/mobile/**'
                          - '!products/mobile/**/*.md'
                          - '.github/workflows/mobile-ci.yml'
                      api_types:
                          - 'products/posthog_ai/frontend/generated/api.schemas.ts'
                          - 'products/signals/frontend/generated/api.schemas.ts'
                          - 'products/error_tracking/frontend/generated/api.schemas.ts'
                      # Only these can change what ships, so only they must match the source.
                      replay_bundle:
                          - 'products/mobile/src/features/replay/web/phonePlayer.generated.replay'
                          - 'common/replay-headless/build-phone.mjs'
                      replay_player:
                          - 'common/replay-headless/**'
                          - 'common/replay-shared/**'
                          - 'patches/**'
                          - 'package.json'
                          - 'pnpm-lock.yaml'
                          - 'pnpm-workspace.yaml'
                          - '.nvmrc'
                          - '.gitattributes'
                          - '.github/actions/setup-pnpm/**'
                          - '.github/workflows/mobile-ci.yml'

    check:
        name: Check mobile
        needs: changes
        if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.api_types == 'true'
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 15
        env:
            # Reusable workflows keep the caller's name. Only the direct master
            # trigger warms the cache; release callers must validate their commit.
            MOBILE_RUN_CHECKS: ${{ github.event_name != 'push' || github.workflow != 'Mobile CI' }}
            # The generated API files are type-only imports, so their changes need
            # typechecking but cannot affect mobile lint, runtime or release policy.
            MOBILE_RUN_FULL_CHECKS: ${{ needs.changes.outputs.mobile == 'true' && (github.event_name != 'push' || github.workflow != 'Mobile CI') }}
        defaults:
            run:
                working-directory: products/mobile
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
                  sparse-checkout: |
                      products/mobile
                      products/posthog_ai/frontend/generated/api.schemas.ts
                      products/signals/frontend/generated/api.schemas.ts
                      products/error_tracking/frontend/generated/api.schemas.ts
                  sparse-checkout-cone-mode: false

            # Reads packageManager from the app's package.json, not the repo root's,
            # so the pnpm that wrote products/mobile/pnpm-lock.yaml also installs it.
            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  package_json_file: products/mobile/package.json
              env:
                  # The action bootstraps pnpm with `npm ci`. A stalled npm audit or fetch
                  # waits for npm's 300s default, so cap each attempt and skip the audit.
                  # See .github/actions/setup-pnpm for the measured failure.
                  NPM_CONFIG_FETCH_TIMEOUT: 45000
                  NPM_CONFIG_FETCH_RETRIES: 2
                  NPM_CONFIG_AUDIT: 'false'
                  NPM_CONFIG_FUND: 'false'

            # The app pins its own Node in .node-version, which EAS builds read too.
            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: products/mobile/.node-version
                  token: ${{ github.token }}

            - name: Get pnpm store path
              id: pnpm-store
              run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            # Explicit restore and save instead of setup-node's `cache: pnpm`, which
            # saves on every run, PRs included. Only master pushes write the cache.
            - name: Restore pnpm store
              id: pnpm-cache
              uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: mobile-pnpm-${{ runner.os }}-${{ hashFiles('products/mobile/pnpm-lock.yaml') }}
                  restore-keys: mobile-pnpm-${{ runner.os }}-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Save pnpm store
              if: github.ref == 'refs/heads/master' && steps.pnpm-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: mobile-pnpm-${{ runner.os }}-${{ hashFiles('products/mobile/pnpm-lock.yaml') }}

            - name: Typecheck
              if: env.MOBILE_RUN_CHECKS == 'true'
              run: pnpm typecheck

            - name: Lint
              if: env.MOBILE_RUN_FULL_CHECKS == 'true'
              run: pnpm lint

            - name: Test
              if: env.MOBILE_RUN_FULL_CHECKS == 'true'
              run: pnpm test --ci

            # Workflow changes also reach branches that have not rebased onto the
            # release tooling yet. Those branches still run the existing checks.
            - name: Fetch release validation base
              if: env.MOBILE_RUN_FULL_CHECKS == 'true' && hashFiles('products/mobile/scripts/releases/release.mjs') != '' && (github.event.pull_request.base.sha != '' || github.event.before != '')
              env:
                  MOBILE_RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
              run: git fetch --no-tags --depth=1 --filter=blob:none origin "$MOBILE_RELEASE_BASE"

            - name: Validate release requests
              if: env.MOBILE_RUN_FULL_CHECKS == 'true' && hashFiles('products/mobile/scripts/releases/release.mjs') != ''
              env:
                  MOBILE_RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
              run: pnpm release:check

            - name: Test release policy
              if: env.MOBILE_RUN_FULL_CHECKS == 'true' && hashFiles('products/mobile/scripts/releases/release.mjs') != ''
              run: pnpm release:test

    replay_bundle:
        name: Check mobile replay bundle
        needs: changes
        if: needs.changes.outputs.replay_bundle == 'true' || needs.changes.outputs.replay_player == 'true'
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
                  sparse-checkout: |
                      .github/actions/setup-pnpm
                      .nvmrc
                      common/replay-headless
                      common/replay-shared
                      package.json
                      patches
                      pnpm-lock.yaml
                      pnpm-workspace.yaml
                      products/mobile/src/features/replay/web
                  sparse-checkout-cone-mode: false

            # Branches that predate the replay player still run the other mobile checks.
            - name: Set up Node and pnpm
              if: hashFiles('products/mobile/src/features/replay/web/playerHtml.ts', 'products/mobile/src/features/replay/web/phonePlayer.generated.replay') != ''
              uses: ./.github/actions/setup-pnpm

            - name: Verify generated WebView player
              if: hashFiles('products/mobile/src/features/replay/web/playerHtml.ts', 'products/mobile/src/features/replay/web/phonePlayer.generated.replay') != ''
              env:
                  CHECK_COMMITTED_BUNDLE: ${{ needs.changes.outputs.replay_bundle }}
              run: |
                  pnpm --filter @posthog/replay-headless... install --frozen-lockfile --ignore-scripts
                  if [[ "$CHECK_COMMITTED_BUNDLE" == "true" ]]; then
                    pnpm --filter @posthog/replay-headless run build:phone --check
                  else
                    pnpm --filter @posthog/replay-headless run build:phone
                  fi

            # The bundle is minified, so its diff cannot be reviewed. This lists the player source changes the
            # refresh brings into the app, so the mobile team can review those instead of the bytes.
            - name: Summarize the player changes this bundle brings in
              if: github.event_name == 'pull_request' && needs.changes.outputs.replay_bundle == 'true'
              env:
                  REPO: ${{ github.repository }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  set -euo pipefail
                  bundle=products/mobile/src/features/replay/web/phonePlayer.generated.replay
                  inputs=(common/replay-shared common/replay-headless patches package.json pnpm-lock.yaml pnpm-workspace.yaml)
                  # The range is computed from ancestry, not commit dates, because a committer date is whatever the author set.
                  git fetch --quiet --no-tags --filter=blob:none --depth=500 origin "$BASE_SHA" "$HEAD_SHA"
                  for attempt in $(seq 1 40); do
                    previous=$(git log -1 --topo-order --format=%H "$BASE_SHA" -- "$bundle")
                    shallow=$(cat "$(git rev-parse --git-path shallow)" 2>/dev/null || true)
                    # A shallow root looks like it added every file, and a range that reaches one is cut short.
                    if [[ -z "$shallow" ]] || { [[ -n "$previous" ]] && ! grep -qxF "$previous" <<<"$shallow" \
                         && ! git rev-list "$previous..$HEAD_SHA" | grep -qxF -f <(echo "$shallow"); }; then
                      break
                    fi
                    [[ "$attempt" == 40 ]] && { echo "History is too deep to find the previous bundle." >&2; exit 1; }
                    git fetch --quiet --no-tags --filter=blob:none --deepen=500 origin "$BASE_SHA" "$HEAD_SHA"
                  done
                  {
                    echo "## Player changes in this replay bundle"
                    if [[ -z "$previous" ]]; then
                      echo "This is the first bundle, so there is no earlier bundle to compare against."
                    else
                      echo "Review these commits instead of the minified bundle. They changed the player source or its dependencies after ${previous:0:10}, which built the previous bundle."
                      echo
                      commits=$(git log --topo-order --format='%H%x09%s' "$previous..$HEAD_SHA" -- "${inputs[@]}")
                      if [[ -z "$commits" ]]; then
                        echo "No player source or dependency commits."
                      else
                        # Commit titles come from contributors, so they are escaped rather than rendered as markdown.
                        jq -R -r --arg repo "$REPO" 'split("\t") | "- [\(.[0][0:10])](https://github.com/\($repo)/commit/\(.[0])) " + (.[1:] | join("\t") | gsub("(?<c>[\\\\`*_{}\\[\\]()#+!<>|~-])"; "\\\(.c)"))' <<<"$commits"
                      fi
                    fi
                  } >>"$GITHUB_STEP_SUMMARY"

            # Release runs ship the committed bundle, and Mobile CI Pass is not a required check, so a
            # bundle could reach master without its PR check passing. No later commit touched the bundle,
            # so it is identical at the commit that last changed it, and that commit's source must build it.
            - name: Find the commit that last changed the bundle
              id: pinned
              if: github.event_name != 'pull_request' && hashFiles('products/mobile/src/features/replay/web/phonePlayer.generated.replay') != ''
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
              run: |
                  last_change() {
                    gh api "repos/$REPO/commits?sha=$GITHUB_SHA&path=$1&per_page=1" --jq '.[0].sha // empty'
                  }
                  bundle_sha=$(last_change products/mobile/src/features/replay/web/phonePlayer.generated.replay)
                  script_sha=$(last_change common/replay-headless/build-phone.mjs)
                  if [[ -z "$bundle_sha" || -z "$script_sha" ]]; then
                    echo "Could not find the commits that last changed the replay bundle and its build script."
                    exit 1
                  fi
                  # "ahead" means the build script changed after the bundle, so the bundle must match that newer commit.
                  if [[ "$(gh api "repos/$REPO/compare/$bundle_sha...$script_sha" --jq .status)" == "ahead" ]]; then
                    echo "sha=$script_sha" >>"$GITHUB_OUTPUT"
                  else
                    echo "sha=$bundle_sha" >>"$GITHUB_OUTPUT"
                  fi

            - name: Check out the commit that last changed the bundle
              if: steps.pinned.outputs.sha != ''
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
                  ref: ${{ steps.pinned.outputs.sha }}
                  path: pinned
                  sparse-checkout: |
                      .nvmrc
                      common/replay-headless
                      common/replay-shared
                      package.json
                      patches
                      pnpm-lock.yaml
                      pnpm-workspace.yaml
                      products/mobile/src/features/replay/web
                  sparse-checkout-cone-mode: false

            - name: Verify the shipped bundle against the source it was built from
              if: steps.pinned.outputs.sha != ''
              working-directory: pinned
              run: |
                  cmp products/mobile/src/features/replay/web/phonePlayer.generated.replay \
                    ../products/mobile/src/features/replay/web/phonePlayer.generated.replay
                  pnpm --filter @posthog/replay-headless... install --frozen-lockfile --ignore-scripts
                  pnpm --filter @posthog/replay-headless run build:phone --check

    mobile_checks:
        name: Mobile CI Pass
        needs: [changes, check, replay_bundle]
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        steps:
            - name: Check all mobile jobs
              run: |
                  # Fail if change detection failed or was cancelled (outputs are empty on cancel, so a skipped check would report green).
                  if [[ "${{ needs.changes.result }}" != "success" && "${{ needs.changes.result }}" != "skipped" ]]; then
                    echo "Change detection did not succeed (result: ${{ needs.changes.result }})."
                    exit 1
                  fi

                  if [[ "${{ needs.replay_bundle.result }}" != "success" && "${{ needs.replay_bundle.result }}" != "skipped" ]]; then
                    echo "Mobile replay bundle verification failed."
                    exit 1
                  fi

                  if [[ "${{ needs.changes.outputs.mobile }}" != "true" && "${{ needs.changes.outputs.api_types }}" != "true" && "${{ needs.changes.outputs.replay_bundle }}" != "true" && "${{ needs.changes.outputs.replay_player }}" != "true" ]]; then
                    echo "Mobile checks were skipped (no relevant changes)"
                    exit 0
                  fi

                  if [[ "${{ needs.check.result }}" != "success" && "${{ needs.check.result }}" != "skipped" ]]; then
                    echo "Mobile typecheck, lint, test or release checks failed."
                    exit 1
                  fi

                  echo "All mobile checks passed."
