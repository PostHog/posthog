name: Desktop Agent Release Verify

permissions:
    contents: read

on:
    pull_request:
        branches:
            - master
        paths:
            - 'packages/agent/**'
            - '.github/actions/desktop-build-agent-release/**'
            - '.github/workflows/desktop-agent-release.yml'
            - '.github/workflows/desktop-agent-release-verify.yml'

env:
    # npm's audit blocks the pnpm bootstrap. See .github/actions/pnpm-install for why.
    NPM_CONFIG_AUDIT: 'false'
    NPM_CONFIG_FUND: 'false'

jobs:
    verify:
        name: Verify agent release build
        runs-on: depot-ubuntu-24.04-4
        timeout-minutes: 30
        # Skipped on trunk-merge/** heads: merge-queue PRs are ephemeral and every
        # constituent PR already ran this in full.
        if: ${{ !startsWith(github.head_ref, 'trunk-merge/') }}
        defaults:
            run:
                working-directory: packages/agent
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6.0.2
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@v6.0.9
              with:
                  package_json_file: packages/agent/package.json

            - name: Set up Node 24
              uses: actions/setup-node@v6.4.0
              with:
                  node-version-file: .nvmrc

            - name: Get pnpm store path
              id: pnpm-store
              run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            # Restore-only: desktop-warm-caches.yml seeds this on master pushes.
            - name: Restore pnpm store
              uses: actions/cache/restore@v5.0.3
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: desktop-pnpm-${{ runner.os }}-${{ hashFiles('products/desktop/pnpm-lock.yaml') }}
                  restore-keys: desktop-pnpm-${{ runner.os }}-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build and test agent release
              uses: $/.github/actions/desktop-build-agent-release
