name: Build rust container images

# Reusable workflow — not triggered directly.
# Called by rust-docker-build.yml (production) and
# rust-smoke-test-build.yml (smoke tests).
# Image list lives in .github/rust-images.yml.

on:
    workflow_call:
        inputs:
            tag-rules:
                description: 'Docker metadata tag rules (newline-separated)'
                required: true
                type: string
            checkout-ref:
                description: 'Git ref for checkout (leave empty for default)'
                type: string
                default: ''
            timeout-minutes:
                description: 'Per-image build timeout'
                type: number
                default: 30
            event-name:
                description: 'PostHog event name for failure reporting'
                type: string
                default: 'posthog-rust-image-build'
            extra-failure-props:
                description: 'Additional JSON properties for failure reporting (without outer braces)'
                type: string
                default: ''
            image-filter:
                description: 'Comma-separated list of images to build (empty = all)'
                type: string
                default: ''
            push:
                description: 'Whether to push built images to the registry'
                type: boolean
                default: true
            ecr-repository-suffix:
                description: 'Suffix of the shared-services ECR repository (empty for <image>, -prs for <image>-prs)'
                type: string
                default: ''
            require-ecr:
                description: 'Fail a push when the shared-services ECR publish role is not set'
                type: boolean
                default: false
        secrets:
            POSTHOG_API_TOKEN:
                required: false
            POSTHOG_DEVEX_PROJECT_API_TOKEN:
                required: false
            AWS_ECR_SHARED_SERVICES_PUBLISH_IAM_ROLE:
                required: false
        outputs:
            digests:
                description: 'JSON object mapping image name to digest (empty when push is false)'
                value: ${{ jobs.collect.outputs.digests }}

jobs:
    load-matrix:
        name: load image matrix
        runs-on: ubuntu-24.04
        timeout-minutes: 2
        permissions:
            contents: read
        outputs:
            matrix: ${{ steps.set.outputs.matrix }}
        steps:
            - name: Check out rust-images.yml
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: .github/rust-images.yml
                  sparse-checkout-cone-mode: false

            - name: Read and filter matrix
              id: set
              env:
                  IMAGE_FILTER: ${{ inputs.image-filter }}
              run: |
                  full=$(yq -o=json -I=0 '.' .github/rust-images.yml)
                  if [ -n "$IMAGE_FILTER" ]; then
                      matrix=$(echo "$full" | jq -c --arg f "$IMAGE_FILTER" \
                        '[.[] | select(.image as $img | ($f | split(",") | map(ltrimstr(" ") | rtrimstr(" ")) | index($img)) != null)]')
                  else
                      matrix="$full"
                  fi
                  if [ "$matrix" = "[]" ]; then
                      echo "::error::image-filter '$IMAGE_FILTER' matched no images in rust-images.yml"
                      exit 1
                  fi
                  echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

    build:
        name: build ${{ matrix.image }}
        needs: load-matrix
        strategy:
            matrix:
                include: ${{ fromJson(needs.load-matrix.outputs.matrix) }}
        runs-on: depot-ubuntu-22.04
        timeout-minutes: ${{ inputs.timeout-minutes }}
        env:
            ECR_PUBLISH_ROLE: ${{ secrets.AWS_ECR_SHARED_SERVICES_PUBLISH_IAM_ROLE }}
        permissions:
            id-token: write
            contents: read
            packages: write

        defaults:
            run:
                working-directory: rust

        steps:
            - name: Check Out Repo
              # Use sparse checkout to only select files in rust directory
              # Turning off cone mode ensures that files in the project root are not included during checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ inputs.checkout-ref || '' }}
                  sparse-checkout: |
                      rust/
                      proto/
                  sparse-checkout-cone-mode: false

            - name: Copy proto files into rust build context
              working-directory: .
              run: cp -r proto rust/proto

            - name: Set up Depot CLI
              uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1

            - name: Login to ghcr.io
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # The images also go to the shared-services ECR. Deploys pull them through the VPC
            # endpoint instead of paying NAT egress to ghcr. ECR replication copies each push to
            # eu-central-1.
            - name: Require the shared-services ECR publish role
              if: ${{ inputs.push && inputs.require-ecr && env.ECR_PUBLISH_ROLE == '' }}
              run: |
                  echo "::error::The shared-services ECR publish role is not set, so the image would reach ghcr only."
                  exit 1

            - name: Configure AWS credentials for the shared-services ECR
              id: ecr-credentials
              if: ${{ inputs.push && env.ECR_PUBLISH_ROLE != '' }}
              uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
              with:
                  role-to-assume: ${{ env.ECR_PUBLISH_ROLE }}
                  aws-region: us-east-1

            - name: Login to the shared-services ECR
              id: ecr
              if: ${{ steps.ecr-credentials.outcome == 'success' }}
              uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78 # v2.1.2

            - name: Docker meta
              id: meta
              uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
              # Kargo reads org.opencontainers.image.revision from the image index to match an
              # image to its source commit, so the annotations must land on the index, not only
              # on the per-platform manifests.
              env:
                  DOCKER_METADATA_ANNOTATIONS_LEVELS: index
              with:
                  # One push writes the same digest to both registries.
                  images: |
                      ghcr.io/posthog/posthog/${{ matrix.image }}
                      ${{ steps.ecr.outputs.registry && format('{0}/{1}{2}', steps.ecr.outputs.registry, matrix.image, inputs.ecr-repository-suffix) || '' }}
                  tags: ${{ inputs.tag-rules }}
                  labels: |
                      org.opencontainers.image.title=posthog
                      org.opencontainers.image.url=https://github.com/PostHog/posthog
                      org.opencontainers.image.source=https://github.com/PostHog/posthog
                  annotations: |
                      org.opencontainers.image.title=posthog
                      org.opencontainers.image.url=https://github.com/PostHog/posthog
                      org.opencontainers.image.source=https://github.com/PostHog/posthog

            - name: Retrieve sccache configuration
              id: sccache
              env:
                  IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
              run: |
                  echo "cache-key-prefix=cargo-${{ hashFiles('rust/Cargo.lock') }}" >> "$GITHUB_OUTPUT"
                  if [ "$IS_FORK_PR" = "true" ]; then
                      echo "Fork PR — skipping sccache credentials (build runs without remote cache)"
                      exit 0
                  fi
                  echo "endpoint=$SCCACHE_WEBDAV_ENDPOINT" >> "$GITHUB_OUTPUT"
                  echo "::add-mask::$SCCACHE_WEBDAV_TOKEN"
                  echo "token=$SCCACHE_WEBDAV_TOKEN" >> "$GITHUB_OUTPUT"

            # Native debug symbols go to PostHog error tracking from the runner, after the image
            # is pushed (see "Upload native debug symbols" below). Only master pushes on the
            # canonical deploy repo upload them: those are the runs the trust policy admits, and a
            # dispatch builds an unreviewed branch. Only rust/Dockerfile has the symbols stage.
            - name: Decide whether to upload symbols
              id: symbols
              env:
                  ENABLED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.CD_DEPLOY_ENABLED == 'true' && matrix.dockerfile == './rust/Dockerfile' }}
              run: |
                  if [ "$ENABLED" = "true" ]; then
                      echo "enabled=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "Native symbol upload disabled for this build"
                  fi

            - name: Build and push image
              id: docker_build
              uses: depot/build-push-action@5f3b3c2e5a00f0093de47f657aeaefcedff27d18 # v1.17.0
              with:
                  project: ${{ matrix.project }}
                  context: ./rust/
                  file: ${{ matrix.dockerfile }}
                  target: ${{ matrix.target || '' }}
                  push: ${{ inputs.push }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  annotations: ${{ steps.meta.outputs.annotations }}
                  platforms: linux/arm64,linux/amd64
                  build-args: |
                      SCCACHE_LOG=debug
                      SCCACHE_NO_DAEMON=1
                      BIN=${{ matrix.bin || matrix.image }}
                      BUILD_FEATURES=${{ matrix.features || '' }}
                      EXTRA_RUSTFLAGS=${{ matrix.extra_rustflags || '' }}
                      EXTRA_CFLAGS=${{ matrix.extra_cflags || '' }}
                      SQLX_DATABASES=${{ matrix.sqlx_databases || '' }}
                      SCCACHE_WEBDAV_KEY_PREFIX=${{ steps.sccache.outputs.cache-key-prefix }}
                  secrets: |
                      SCCACHE_WEBDAV_ENDPOINT=${{ steps.sccache.outputs.endpoint }}
                      SCCACHE_WEBDAV_TOKEN=${{ steps.sccache.outputs.token }}

            # The symbols stage of rust/Dockerfile: the binary and the workspace sources its
            # debug info names. The same arguments as the image build, so the builder stage
            # comes from the layer cache and only the collect step runs. Symbols must never
            # block shipping an image, so this step and the upload warn instead of failing.
            - name: Export native debug symbols
              id: export_symbols
              if: steps.symbols.outputs.enabled == 'true'
              continue-on-error: true
              # continue-on-error does not cover the job's own timeout-minutes, which would cancel
              # the job after the image push and skip the deploy, so both steps stay well inside it.
              timeout-minutes: 10
              uses: depot/build-push-action@5f3b3c2e5a00f0093de47f657aeaefcedff27d18 # v1.17.0
              with:
                  project: ${{ matrix.project }}
                  context: ./rust/
                  file: ${{ matrix.dockerfile }}
                  target: symbols
                  platforms: linux/arm64,linux/amd64
                  outputs: type=local,dest=${{ runner.temp }}/symbols
                  build-args: |
                      SCCACHE_LOG=debug
                      SCCACHE_NO_DAEMON=1
                      BIN=${{ matrix.bin || matrix.image }}
                      BUILD_FEATURES=${{ matrix.features || '' }}
                      EXTRA_RUSTFLAGS=${{ matrix.extra_rustflags || '' }}
                      EXTRA_CFLAGS=${{ matrix.extra_cflags || '' }}
                      SQLX_DATABASES=${{ matrix.sqlx_databases || '' }}
                      SCCACHE_WEBDAV_KEY_PREFIX=${{ steps.sccache.outputs.cache-key-prefix }}
                  secrets: |
                      SCCACHE_WEBDAV_ENDPOINT=${{ steps.sccache.outputs.endpoint }}
                      SCCACHE_WEBDAV_TOKEN=${{ steps.sccache.outputs.token }}

            # They go to the internal PostHog project (HOG_PROJECT_ID=2 on US cloud), and hog logs
            # in with this job's OIDC token, through the trust policy for master pushes of the deploy
            # repo. hog finds each source file at the path DWARF records, so the sources go back to
            # those absolute paths under /app before each platform's upload. GITHUB_SHA stays unset
            # for hog, so it stamps no release: symbolication resolves by GNU build id alone, and
            # the image jobs run concurrently, so a shared lookup-then-create release would race.
            - name: Upload native debug symbols
              if: steps.export_symbols.outcome == 'success'
              continue-on-error: true
              timeout-minutes: 5
              env:
                  BIN: ${{ matrix.bin || matrix.image }}
                  HOG_PROJECT_ID: '2'
                  # Copy the checksum from the release's SHA256SUMS when HOG_VERSION changes.
                  HOG_VERSION: 0.3.0
                  HOG_SHA256: 9dff37a41ec5bf947c190fc4760e95a051be9ea7744eb3d0f4a4e7be695674bc
              run: |
                  set -euo pipefail
                  hog_dir="$RUNNER_TEMP/hog"
                  mkdir -p "$hog_dir"
                  curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --retry-max-time 60 --connect-timeout 10 \
                      -o "$hog_dir/hog.tar.gz" \
                      "https://github.com/PostHog/posthog/releases/download/hog%2Fv$HOG_VERSION/hog-linux-x64.tar.gz"
                  echo "$HOG_SHA256  $hog_dir/hog.tar.gz" | sha256sum -c -
                  # hog runs hog-worker from its own folder, so the archive is extracted whole.
                  tar -xzf "$hog_dir/hog.tar.gz" -C "$hog_dir"

                  for platform_dir in "$RUNNER_TEMP"/symbols/linux_*; do
                      sudo rm -rf /app
                      sudo tar -xf "$platform_dir/sources.tar" -C /
                      mkdir -p "$platform_dir/binary"
                      mv "$platform_dir/$BIN" "$platform_dir/binary/"
                      env -u GITHUB_SHA "$hog_dir/hog" error-tracking upload "$platform_dir/binary" --include-source
                      echo "Native debug symbols uploaded for $BIN ($(basename "$platform_dir"))"
                  done
                  sudo rm -rf /app

            - name: Build failure properties
              if: failure()
              id: failure-props
              env:
                  EXTRA: ${{ inputs.extra-failure-props }}
              run: |
                  props='{"status": "failure", "commit_hash": "${{ github.sha }}", "image": "${{ matrix.image }}"'
                  if [ -n "$EXTRA" ]; then
                      props="$props, $EXTRA"
                  fi
                  echo "json=${props}}" >> "$GITHUB_OUTPUT"

            - name: Report failure
              if: failure() && github.event_name != 'pull_request'
              uses: PostHog/posthog-github-action@58dea254b598fb5d469c0699c98af8288a7f7650 # v1.2.0
              with:
                  posthog-token: ${{ secrets.POSTHOG_API_TOKEN }}
                  event: ${{ inputs.event-name }}
                  properties: ${{ steps.failure-props.outputs.json }}
            - name: Report failure to DevEx PostHog
              if: failure() && github.event_name != 'pull_request'
              continue-on-error: true
              uses: PostHog/posthog-github-action@58dea254b598fb5d469c0699c98af8288a7f7650 # v1.2.0
              with:
                  posthog-token: ${{ secrets.POSTHOG_DEVEX_PROJECT_API_TOKEN }}
                  event: ${{ inputs.event-name }}
                  properties: ${{ steps.failure-props.outputs.json }}

            # A build without a push has no registry digest to record.
            - name: Container image digest
              if: inputs.push
              env:
                  DIGEST: ${{ steps.docker_build.outputs.digest }}
              run: echo "$DIGEST" > /tmp/digest-${{ matrix.image }}.txt

            - name: Upload digest
              if: inputs.push
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: digest-${{ matrix.image }}
                  path: /tmp/digest-${{ matrix.image }}.txt
                  retention-days: 1

    collect:
        name: collect digests
        needs: [load-matrix, build]
        if: inputs.push
        runs-on: ubuntu-24.04
        timeout-minutes: 2
        permissions:
            contents: read
        outputs:
            digests: ${{ steps.aggregate.outputs.digests }}
        steps:
            - name: Download all digest artifacts
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  pattern: digest-*
                  path: /tmp/digests
                  merge-multiple: true

            - name: Aggregate digests
              id: aggregate
              run: |
                  shopt -s nullglob
                  echo "Contents of /tmp/digests/:"
                  ls -laR /tmp/digests/ 2>/dev/null || echo "/tmp/digests/ does not exist"
                  digests='{}'
                  found=0
                  for file in /tmp/digests/digest-*.txt; do
                      found=1
                      name="${file##*/digest-}"
                      name="${name%.txt}"
                      digest=$(cat "$file")
                      if [ -z "$digest" ]; then
                          echo "::error::Empty digest for $name (file: $file)"
                          exit 1
                      fi
                      digests=$(echo "$digests" | jq -c --arg k "$name" --arg v "$digest" '. + {($k): $v}')
                  done
                  if [ "$found" -eq 0 ]; then
                      echo "::error::No digest artifacts found under /tmp/digests/"
                      exit 1
                  fi
                  echo "digests=$digests" >> "$GITHUB_OUTPUT"
