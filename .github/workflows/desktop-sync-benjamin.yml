name: Desktop Sync Benjamin

on:
    schedule:
        - cron: '0 6 * * MON'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: desktop-sync-benjamin
    cancel-in-progress: false

jobs:
    sync-benjamin:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            SYNC_BRANCH: chore/sync-benjamin

        steps:
            - name: Guard - only run on master
              env:
                  REF: ${{ github.ref }}
              run: |
                  if [ "$REF" != "refs/heads/master" ]; then
                      echo "::error::This workflow can only run on master (got $REF). Re-dispatch it from master."
                      exit 1
                  fi

            - name: Get app token
              id: app-token
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_SCHEDULED_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_SCHEDULED_ACTIONS_PRIVATE_KEY }}

            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  sparse-checkout: |
                      .nvmrc
                      products/desktop/scripts/sync-benjamin.mts
                      products/desktop/packages/agent/src/adapters/benjamin
                  sparse-checkout-cone-mode: false

            - name: Set up Node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc

            - name: Sync the vendored instruction
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
              run: node products/desktop/scripts/sync-benjamin.mts

            - name: Check for changes
              id: check-changes
              run: |
                  if git diff --quiet products/desktop/packages/agent/src/adapters/benjamin; then
                    echo "changes=false" >> $GITHUB_OUTPUT
                    echo "Vendored instruction is already at the upstream tip"
                  else
                    echo "changes=true" >> $GITHUB_OUTPUT
                    git diff --stat products/desktop/packages/agent/src/adapters/benjamin
                  fi

            - name: Find the open sync PR
              id: find-pr
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  pr=$(gh pr list --head "$SYNC_BRANCH" --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].number' 2>/dev/null || true)
                  echo "number=$pr" >> "$GITHUB_OUTPUT"

            - name: Clean up stale sync PR
              if: steps.check-changes.outputs.changes == 'false' && steps.find-pr.outputs.number != ''
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  STALE_PR: ${{ steps.find-pr.outputs.number }}
              run: |
                  gh pr close "$STALE_PR" --delete-branch || true
                  echo "Closed stale PR #$STALE_PR and deleted branch"

            - name: Read the pinned commit
              id: lock
              if: steps.check-changes.outputs.changes == 'true'
              run: |
                  commit=$(jq -r .commit products/desktop/packages/agent/src/adapters/benjamin/benjamin.lock.json)
                  echo "commit=$commit" >> $GITHUB_OUTPUT

            - name: Build PR body
              if: steps.check-changes.outputs.changes == 'true'
              env:
                  COMMIT: ${{ steps.lock.outputs.commit }}
              run: |
                  {
                    echo "Upstream bump of the vendored Benjamin-Plus instruction."
                    echo
                    echo "- Source: [JetBrains/benjamin-plus-skill@\`$COMMIT\`](https://github.com/JetBrains/benjamin-plus-skill/commit/$COMMIT)"
                    echo "- Regenerated by \`products/desktop/scripts/sync-benjamin.mts\`, which verifies the file against upstream \`SHA256SUMS.txt\` before writing."
                    echo
                    echo "**Do not merge unattended.** The instruction ships into every cloud agent session that runs with \`POSTHOG_BENJAMIN=1\`, so a human has to:"
                    echo
                    echo "1. read the instruction diff, and"
                    echo "2. re-run the token-efficiency benchmark before this lands."
                  } > "$RUNNER_TEMP/pr-body.md"

            - name: Reset branch to checked-out SHA
              if: steps.check-changes.outputs.changes == 'true'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  TARGET_SHA: ${{ github.sha }}
              run: |
                  if gh api "repos/${{ github.repository }}/git/ref/heads/$SYNC_BRANCH" >/dev/null 2>&1; then
                    gh api -X PATCH "repos/${{ github.repository }}/git/refs/heads/$SYNC_BRANCH" \
                      -f sha="$TARGET_SHA" -F force=true
                  else
                    gh api repos/${{ github.repository }}/git/refs -f ref="refs/heads/$SYNC_BRANCH" -f sha="$TARGET_SHA"
                  fi

            - name: Commit via GitHub API (signed)
              if: steps.check-changes.outputs.changes == 'true'
              uses: planetscale/ghcommit-action@25309d8005ac7c3bcd61d3fe19b69e0fe47dbdde # v0.2.20
              with:
                  commit_message: 'chore(tasks): bump vendored benjamin-plus instruction'
                  repo: ${{ github.repository }}
                  branch: ${{ env.SYNC_BRANCH }}
                  file_pattern: 'products/desktop/packages/agent/src/adapters/benjamin'
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

            - name: Create or update pull request
              if: steps.check-changes.outputs.changes == 'true'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  PREVIOUS_PR: ${{ steps.find-pr.outputs.number }}
              run: |
                  existing_pr=$(gh pr list --head "$SYNC_BRANCH" --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].number' 2>/dev/null || true)
                  if [ -n "$existing_pr" ]; then
                    gh pr edit "$existing_pr" --body-file "$RUNNER_TEMP/pr-body.md"
                    is_draft=$(gh pr view "$existing_pr" --json isDraft --jq '.isDraft')
                    if [ "$is_draft" = "false" ]; then
                      gh pr ready --undo "$existing_pr"
                      gh pr comment "$existing_pr" --body "The vendored instruction changed after this PR was marked ready. It is back in draft: re-read the diff and re-run the benchmark before merging." || true
                    fi
                  else
                    if [ -n "$PREVIOUS_PR" ]; then
                      printf '\nSupersedes #%s.\n' "$PREVIOUS_PR" >> "$RUNNER_TEMP/pr-body.md"
                    fi
                    new_pr_url=$(gh pr create \
                      --draft \
                      --title "chore(tasks): bump vendored benjamin-plus instruction" \
                      --body-file "$RUNNER_TEMP/pr-body.md" \
                      --base master \
                      --head "$SYNC_BRANCH" \
                      --label "automated" --label "dependencies")
                    echo "Created $new_pr_url"
                    if [ -n "$PREVIOUS_PR" ]; then
                      gh pr comment "$PREVIOUS_PR" --body "Superseded by $new_pr_url" || true
                    fi
                  fi
