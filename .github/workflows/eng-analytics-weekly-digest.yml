name: Engineering analytics weekly digest

# Posts last week's Depot spend and pull request figures to #alerts-devex every Monday.
# .github/scripts/eng-analytics-weekly-digest.mjs says where each figure comes from.
#
# Required. Until these are set, the job logs a warning and posts nothing:
#   - vars.ENG_ANALYTICS_PROJECT_ID: the PostHog project with the GitHub and Depot warehouse sources.
#   - secrets.ENG_ANALYTICS_POSTHOG_API_KEY: a personal API key for that project, scoped to
#     engineering_analytics:read.
#   - secrets.SLACK_DEVEX_BOT_TOKEN: the DevEx Slack bot.
#
# Optional:
#   - secrets.DEPOT_TOKEN: a Depot organization token that can read usage. Without it the digest
#     posts no spend.
#   - vars.DEPOT_CONTRACT_USD: the Depot contract's usage allowance in list-price dollars.
#   - vars.DEPOT_CONTRACT_START and vars.DEPOT_CONTRACT_END: the contract dates, as YYYY-MM-DD.
#     Without all three the digest posts no contract sentence.

on:
    schedule:
        - cron: '0 13 * * 1' # Mondays 13:00 UTC
    workflow_dispatch:
        inputs:
            dry_run:
                description: 'Print the digest blocks instead of posting to Slack'
                type: boolean
                default: true

permissions:
    contents: read

jobs:
    digest:
        runs-on: ubuntu-24.04
        # The endpoint calls run in parallel. The slowest takes about 8.5 minutes: 3 attempts of 150s
        # with 30s between them.
        timeout-minutes: 12
        # Never run from forks (no secret access anyway), only the canonical repo.
        # Manual dispatch is master-only so branch-controlled code can't run with the secrets.
        if: >-
            github.repository == 'PostHog/posthog' &&
            (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master')
        steps:
            # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
            - uses: actions/checkout@v6.0.2
              with:
                  sparse-checkout: |
                      .github/scripts/eng-analytics-weekly-digest.mjs
                      .nvmrc
                  sparse-checkout-cone-mode: false

            # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
            - uses: actions/setup-node@v6.2.0
              with:
                  node-version-file: .nvmrc

            - name: Build and post weekly CI digest
              # POSTHOG_HOST and SLACK_CHANNEL (#alerts-devex) use the script's defaults.
              env:
                  POSTHOG_PROJECT_ID: ${{ vars.ENG_ANALYTICS_PROJECT_ID }}
                  POSTHOG_API_KEY: ${{ secrets.ENG_ANALYTICS_POSTHOG_API_KEY }}
                  # Pins the GitHub source when the project has more than one.
                  ENG_ANALYTICS_SOURCE_ID: ${{ vars.ENG_ANALYTICS_SOURCE_ID }}
                  SLACK_BOT_TOKEN: ${{ secrets.SLACK_DEVEX_BOT_TOKEN }}
                  DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
                  DEPOT_CONTRACT_USD: ${{ vars.DEPOT_CONTRACT_USD }}
                  DEPOT_CONTRACT_START: ${{ vars.DEPOT_CONTRACT_START }}
                  DEPOT_CONTRACT_END: ${{ vars.DEPOT_CONTRACT_END }}
                  # Manual runs default to a dry run. Scheduled runs have no inputs, so they post.
                  DRY_RUN: ${{ inputs.dry_run }}
              run: node .github/scripts/eng-analytics-weekly-digest.mjs
