name: Renovate dashboard digest

# Posts the pending Renovate updates to #alerts-devex. The lookup is read-only.

on:
    schedule:
        - cron: '50 13 * * 3' # Wednesdays 13:50 UTC
    workflow_dispatch:
        inputs:
            dry_run:
                description: 'Print the message blocks instead of posting to Slack'
                type: boolean
                default: true
            channel:
                description: 'Slack channel or user ID to post to instead of #alerts-devex'
                type: string
                default: ''

permissions:
    contents: read

jobs:
    # Renovate is third-party npm code, so the Slack token stays out of this job.
    lookup:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        # Manual dispatch is master-only so branch-controlled code can't run with the Slack token.
        if: >-
            github.repository == 'PostHog/posthog' &&
            (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master')
        # One Renovate process for every manager keeps its event loop so busy that large
        # npm downloads overrun the 60s request timeout, and that error aborts the whole lookup.
        strategy:
            matrix:
                # Keep in sync with enabledManagers in .github/renovate.json5.
                manager: [npm, github-actions, cargo, pep621, gomod, custom.regex, nodenv, nvm]
        steps:
            # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
            - uses: actions/checkout@v6.0.2
              with:
                  persist-credentials: false

            # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
            - uses: actions/setup-node@v6.2.0
              with:
                  node-version-file: .nvmrc

            - name: Look up pending updates
              env:
                  GITHUB_COM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RENOVATE_REPORT_TYPE: file
                  RENOVATE_REPORT_PATH: ${{ runner.temp }}/renovate-report.json
                  RENOVATE_FORCE: '{"enabledManagers": ["${{ matrix.manager }}"]}'
                  LOG_LEVEL: warn
                  npm_config_ignore_scripts: 'true'
              run: npx --yes renovate@44.219.0 --platform=local --dry-run=lookup

            # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
            - uses: actions/upload-artifact@v7.0.1
              with:
                  name: renovate-report-${{ matrix.manager }}
                  path: ${{ runner.temp }}/renovate-report.json
                  if-no-files-found: error
                  retention-days: 7

    post:
        needs: lookup
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
            - uses: actions/checkout@v6.0.2
              with:
                  persist-credentials: false
                  sparse-checkout: |
                      .github/scripts/renovate-dashboard-digest.mjs
                      .github/scripts/weekly-report-common.mjs
                      .nvmrc
                  sparse-checkout-cone-mode: false

            # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
            - uses: actions/setup-node@v6.2.0
              with:
                  node-version-file: .nvmrc

            # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
            - uses: actions/download-artifact@v7.0.0
              with:
                  pattern: renovate-report-*
                  path: ${{ runner.temp }}/renovate-reports

            - name: Post the digest
              env:
                  RENOVATE_REPORTS_DIR: ${{ runner.temp }}/renovate-reports
                  SLACK_BOT_TOKEN: ${{ secrets.SLACK_DEVEX_BOT_TOKEN }}
                  SLACK_CHANNEL: ${{ inputs.channel }}
                  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
              run: node .github/scripts/renovate-dashboard-digest.mjs
