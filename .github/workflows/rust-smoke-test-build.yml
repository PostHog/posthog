name: Build rust smoke test images

# Builds Docker images for Rust services from PR branches labeled 'smoke_test'.
# This is a build-only workflow — no deployment. Use it to get feature branch
# images into ghcr.io for pre-merge smoke testing in staging/production.
#
# Usage:
#   Build all images: add the 'smoke_test' label to your PR
#   Build specific images: add 'smoke_test:capture', 'smoke_test:cymbal', etc.
#   Manual trigger: Actions tab -> workflow_dispatch -> enter image names
#
# An unlabeled PR that changes a Dockerfile, the build context, or an image
# entry builds the few images that change can break, so a broken image build
# fails here instead of on master. Selection: .github/scripts/select_rust_image_checks.py
#
# Image list: .github/rust-images.yml
# Build steps: .github/workflows/_rust-build-images.yml

on:
    workflow_dispatch:
        inputs:
            images:
                description: 'Comma-separated image names to build (empty = all)'
                type: string
                default: ''
    pull_request:
        types: [opened, reopened, labeled, synchronize]
        paths:
            - 'rust/**'
            - 'proto/**'
            - '.github/workflows/rust-smoke-test-build.yml'
            - '.github/workflows/_rust-build-images.yml'
            - '.github/rust-images.yml'

concurrency:
    # GitHub cannot filter a label trigger by name. Any other label gets a group of its
    # own, so adding it does not cancel a smoke test build that is in progress.
    group: rust-smoke-test-${{ (github.event.action == 'labeled' && !startsWith(github.event.label.name, 'smoke_test')) && github.run_id || github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true

jobs:
    resolve-filter:
        name: resolve image filter
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        # Merge queue PRs skip: each constituent PR already ran this check.
        # Only a smoke_test label starts a build. Any other label changes no code.
        if: >-
            (github.event_name == 'workflow_dispatch' && github.repository == 'PostHog/posthog') ||
            (github.event.pull_request.head.repo.full_name == 'PostHog/posthog' &&
             !startsWith(github.head_ref, 'trunk-merge/') &&
             (github.event.action != 'labeled' || startsWith(github.event.label.name, 'smoke_test')))
        permissions:
            contents: read
        outputs:
            build: ${{ steps.parse.outputs.requested == 'true' || steps.select.outputs.filter != '' }}
            filter: ${{ steps.select.outputs.filter || steps.parse.outputs.filter }}
        steps:
            - name: Parse image filter
              id: parse
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  DISPATCH_IMAGES: ${{ github.event.inputs.images }}
                  PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
              run: |
                  if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                      echo "requested=true" >> "$GITHUB_OUTPUT"
                      echo "filter=$DISPATCH_IMAGES" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  requested=false
                  filter=""
                  for label in $(echo "$PR_LABELS" | jq -r '.[]'); do
                      case "$label" in
                          smoke_test)
                              requested=true
                              ;;
                          smoke_test:*)
                              requested=true
                              img="${label#smoke_test:}"
                              filter="${filter:+$filter,}$img"
                              ;;
                      esac
                  done
                  echo "requested=$requested" >> "$GITHUB_OUTPUT"
                  echo "filter=$filter" >> "$GITHUB_OUTPUT"

            # Without a smoke_test label, build only the images this change can break
            # through the Docker build itself. Cargo CI already covers code changes.
            - name: Check out the image list and selector
              if: steps.parse.outputs.requested != 'true'
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 2
                  filter: blob:none
                  sparse-checkout: |
                      .github/rust-images.yml
                      .github/scripts/select_rust_image_checks.py
                  sparse-checkout-cone-mode: false

            # HEAD is the pull request's merge commit, so HEAD^1 is the base branch tip.
            - name: Select images the change can break
              id: select
              if: steps.parse.outputs.requested != 'true'
              run: |
                  filter=$(python3 .github/scripts/select_rust_image_checks.py HEAD^1)
                  echo "Selected images: ${filter:-none}"
                  echo "filter=$filter" >> "$GITHUB_OUTPUT"

    build-images:
        needs: resolve-filter
        if: needs.resolve-filter.outputs.build == 'true'
        uses: ./.github/workflows/_rust-build-images.yml
        with:
            image-filter: ${{ needs.resolve-filter.outputs.filter }}
            tag-rules: |
                type=ref,event=pr
                type=sha
                type=raw,value=${{ github.head_ref || github.ref_name }}
            checkout-ref: ${{ github.event.pull_request.head.sha || github.sha }}
            timeout-minutes: 30
            event-name: posthog-rust-smoke-test-image-build
            extra-failure-props: '"pr": "${{ github.event.pull_request.number }}"'
        secrets:
            POSTHOG_API_TOKEN: ${{ secrets.POSTHOG_API_TOKEN }}
            POSTHOG_DEVEX_PROJECT_API_TOKEN: ${{ secrets.POSTHOG_DEVEX_PROJECT_API_TOKEN }}
        permissions:
            id-token: write
            contents: read
            packages: write
