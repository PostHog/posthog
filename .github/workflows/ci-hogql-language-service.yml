name: HogQL Language Service

on:
    push:
        branches:
            - master
        paths:
            - '.github/workflows/ci-hogql-language-service.yml'
            - 'services/hogql-language-service/**'
    pull_request:
        paths:
            - '.github/workflows/ci-hogql-language-service.yml'
            - 'services/hogql-language-service/**'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    test:
        name: HogQL language service tests
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 10

        steps:
            - name: Check out
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/checkout@v6.0.2
              with:
                  sparse-checkout: services/hogql-language-service/
                  sparse-checkout-cone-mode: false

            - name: Set up Go
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/setup-go@v6.2.0
              with:
                  go-version-file: services/hogql-language-service/go.mod
                  cache-dependency-path: services/hogql-language-service/go.sum

            - name: Run tests
              working-directory: services/hogql-language-service
              run: go test -race ./...

            - name: Enforce autocomplete latency budget
              working-directory: services/hogql-language-service
              env:
                  HOGQL_LANGUAGE_SERVICE_ENFORCE_LATENCY_BUDGET: '1'
              run: go test ./internal/completion -run '^TestCompleteContextualCatalogStaysWithinLatencyBudget$' -count=1
