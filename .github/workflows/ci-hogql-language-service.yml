name: HogQL Language Service

on:
    push:
        branches:
            - master
        paths:
            - '.github/workflows/ci-hogql-language-service.yml'
            - 'services/hogql-language-service/**'
    pull_request:
        paths:
            - '.github/workflows/ci-hogql-language-service.yml'
            - 'services/hogql-language-service/**'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    test:
        name: HogQL language service tests
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 10

        steps:
            - name: Check out
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: services/hogql-language-service/
                  sparse-checkout-cone-mode: false

            - name: Set up Go
              uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
              with:
                  go-version-file: services/hogql-language-service/go.mod
                  cache-dependency-path: services/hogql-language-service/go.sum

            - name: Run tests
              working-directory: services/hogql-language-service
              run: go test -race ./...
