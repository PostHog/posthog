name: Node.js CI
on:
    pull_request:
    push:
        branches:
            - master

env:
    OBJECT_STORAGE_ENABLED: true
    OBJECT_STORAGE_ENDPOINT: 'http://localhost:19000'
    OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
    OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'
    OBJECT_STORAGE_SESSION_RECORDING_FOLDER: 'session_recordings'
    OBJECT_STORAGE_BUCKET: 'posthog'
    # set the max buffer size small enough that the functional tests behave the same in CI as when running locally
    SESSION_RECORDING_MAX_BUFFER_SIZE_KB: 1024
    RUNS_ON_INTERNAL_PR: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # Job to decide if we should run nodejs services ci
    # See .github/actions/paths-filter/README.md for filter semantics
    changes:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        name: Determine need to run Node.js checks
        permissions:
            contents: read
            pull-requests: read
        outputs:
            nodejs: ${{ steps.nodejs-changes.outputs.nodejs || 'true' }}
        steps:
            # For pull requests it's not necessary to checkout the code, but we
            # also want this to run on master so we need to checkout
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  clean: false
                  filter: blob:none
                  fetch-depth: 0

            - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              id: app-token
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              with:
                  client-id: ${{ secrets.GH_APP_POSTHOG_PATHS_FILTER_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_PATHS_FILTER_PRIVATE_KEY }}
            - uses: ./.github/actions/paths-filter
              id: filter
              if: github.event_name != 'push' # Run all tests on master push
              with:
                  token: ${{ steps.app-token.outputs.token || github.token }}
                  filters: |
                      nodejs:
                        - .github/workflows/ci-nodejs.yml
                        # The report job executes these after Jest uploads its JUnit artifacts.
                        - '.github/actions/report-jest-timings/**'
                        - '.github/scripts/report_test_timings.py'
                        - 'bin/report-jest-timings'
                        # Node DB setup builds sqlx-cli via this composite; changes to it must exercise these jobs.
                        - '.github/actions/setup-sqlx-cli/**'
                        - 'nodejs/**'
                        # The Jest shared-fixtures suite pins the native replay anonymizer against
                        # its Rust tests; a rust-side change (incl. the shared fixtures) must run it.
                        - 'rust/replay-anonymizer/**'
                        - 'rust/replay-anonymizer-node/**'
                        # These native addons are built by Turbo before Node.js tests. Their Rust
                        # dependencies are not part of the ingestion consumer's targeted e2e set.
                        - 'rust/common/hogvm/**'
                        - '**/crosslang/**'
                        # The clientwarnings consumer e2e replays capture's warning envelope from
                        # this shared fixture. Without it the rust filter below decides, and it only
                        # admits ingestion-consumer, which does not depend on the fixture's crate, so
                        # a capture-side envelope change would skip the test that pins the consumer.
                        - 'rust/common/ingestion_warnings/*.json'
                        - 'posthog/clickhouse/**'
                        - 'ee/migrations/**'
                        - 'posthog/management/commands/setup_test_environment.py'
                        - 'posthog/migrations/**'
                        - 'posthog/plugins/**'
                        # Compose files only, no Dockerfile glob: these jobs run the suites from
                        # source via pnpm and the compose stack's only build contexts are rust/,
                        # so no app image is built here. Dockerfile.node is gated separately in
                        # ci-nodejs-container.yml.
                        - 'docker*.yml'
                      rust:
                        - 'rust/**'
                        - 'proto/**'
                        - '.github/rust-images.yml'
                        - '.github/actions/rust-compute-affected/**'

            - name: Install rust for affected-crate detection
              if: github.event_name != 'push' && steps.filter.outputs.rust == 'true'
              uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
              with:
                  toolchain: 1.91.1

            - name: Compute affected Rust crates
              id: rust-affected
              if: github.event_name != 'push' && steps.filter.outputs.rust == 'true'
              uses: ./.github/actions/rust-compute-affected
              with:
                  event-name: ${{ github.event_name }}
                  pr-base-sha: ${{ github.event.pull_request.base.sha }}
                  push-before-sha: ${{ github.event.before }}

            - name: Decide whether Node.js checks should run
              id: nodejs-changes
              env:
                  NODEJS_CHANGED: ${{ steps.filter.outputs.nodejs }}
                  RUST_CHANGED: ${{ steps.filter.outputs.rust }}
                  RUST_REBUILD_ALL: ${{ steps.rust-affected.outputs.rebuild-all }}
                  RUST_AFFECTED_CRATES: ${{ steps.rust-affected.outputs.crates }}
                  RUST_NODE_E2E_CRATES: '["ingestion-consumer"]'
              run: |
                  if [ "${{ github.event_name }}" = "push" ]; then
                    echo "nodejs=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  if [ "$NODEJS_CHANGED" = "true" ]; then
                    echo "nodejs=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  if [ "$RUST_CHANGED" = "true" ]; then
                    if [ "$RUST_REBUILD_ALL" = "true" ]; then
                      echo "nodejs=true" >> "$GITHUB_OUTPUT"
                      exit 0
                    fi

                    if echo "${RUST_AFFECTED_CRATES:-[]}" | jq -e --argjson e2e_crates "$RUST_NODE_E2E_CRATES" '. as $affected | any($e2e_crates[]; . as $crate | $affected | index($crate) != null)' >/dev/null; then
                      echo "nodejs=true" >> "$GITHUB_OUTPUT"
                      exit 0
                    fi
                  fi

                  echo "nodejs=false" >> "$GITHUB_OUTPUT"

    lint:
        if: needs.changes.outputs.nodejs == 'true'
        name: Node.js Code quality (depot-ubuntu-24.04)
        needs: changes
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  clean: false

            - name: Mint setup-action GitHub token
              id: setup-gh-token
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              continue-on-error: true
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_PRIVATE_KEY }}
                  skip-token-revoke: true

            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/nodejs... install --frozen-lockfile
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}

            - name: Install rust
              uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
              with:
                  toolchain: 1.91.1

            - name: Set sccache WebDAV key prefix (Cargo.lock hash)
              run: echo "SCCACHE_WEBDAV_KEY_PREFIX=cargo-${{ hashFiles('rust/Cargo.lock') }}" >> "$GITHUB_ENV"

            - name: Install sccache
              uses: ./.github/actions/setup-sccache

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
              with:
                  shared-key: 'v2-rust-nodejs'
                  workspaces: rust
                  save-if: ${{ github.ref == 'refs/heads/master' }}

            - name: Prepare Node.js workspace
              run: bin/turbo --filter=@posthog/nodejs prepare

            - parallel:
                  - name: Check formatting with prettier
                    run: pnpm --filter=@posthog/nodejs format:check

                  - name: Lint with ESLint
                    run: pnpm --filter=@posthog/nodejs lint

                  # Guards the cdp/ingestion separation: fails on new lane->lane or shared->lane
                  # imports. Presence-checked so branches without the guard yet are unaffected.
                  - name: Check ingestion boundaries
                    run: |
                        if [ -f nodejs/bin/check-ingestion-boundaries.mjs ]; then
                            node nodejs/bin/check-ingestion-boundaries.mjs
                        else
                            echo "Ingestion boundary guard not present on this branch; skipping."
                        fi

    build:
        if: needs.changes.outputs.nodejs == 'true'
        name: Node.js Build (depot-ubuntu-24.04)
        needs: changes
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  clean: false

            - name: Mint setup-action GitHub token
              id: setup-gh-token
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              continue-on-error: true
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_PRIVATE_KEY }}
                  skip-token-revoke: true

            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/nodejs... install --frozen-lockfile
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}

            - name: Install rust
              uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
              with:
                  toolchain: 1.91.1

            - name: Set sccache WebDAV key prefix (Cargo.lock hash)
              run: echo "SCCACHE_WEBDAV_KEY_PREFIX=cargo-${{ hashFiles('rust/Cargo.lock') }}" >> "$GITHUB_ENV"

            - name: Install sccache
              uses: ./.github/actions/setup-sccache

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
              with:
                  shared-key: 'v2-rust-nodejs'
                  workspaces: rust
                  save-if: ${{ github.ref == 'refs/heads/master' }}

            - name: Prepare Node.js workspace
              run: bin/turbo --filter=@posthog/nodejs prepare

            - name: Check builds correctly
              run: pnpm --filter=@posthog/nodejs build

            - name: Sanity check output
              run: |
                  cd nodejs
                  # We expect it to fail but check that the error isn't "MODULE_NOT_FOUND"
                  if node dist/index.js 2>&1 | grep "MODULE_NOT_FOUND"; then
                      echo "❌ Build is invalid - failed with 'MODULE_NOT_FOUND' error"
                      exit 1
                  else
                      echo "✅ Build is valid - failed as expected without module errors"
                  fi

    tests:
        if: needs.changes.outputs.nodejs == 'true'
        name: Node.js ${{ matrix.lane }} Tests ${{ matrix.shard }}/${{ matrix.shard_count }} (depot-ubuntu-24.04-4)
        needs: changes
        runs-on: depot-ubuntu-24.04-4
        # Tests fit comfortably in 30, but a rust change misses the turbo cache and cold-builds the
        # replay-anonymizer addon's whole dependency tree first (no rust caching in this job yet).
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include:
                    - lane: parallel
                      shard: 1
                      shard_count: 1
                    - lane: serial
                      shard: 1
                      shard_count: 3
                    - lane: serial
                      shard: 2
                      shard_count: 3
                    - lane: serial
                      shard: 3
                      shard_count: 3
        env:
            DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USER }}
            DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
            REDIS_URL: 'redis://localhost'
            CLICKHOUSE_HOST: 'localhost'
            CLICKHOUSE_DATABASE: 'posthog_test'
            KAFKA_HOSTS: 'kafka:9092'

        steps:
            - name: Code check out
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  clean: false
            - name: Clean up data directories with container permissions
              run: |
                  # Use docker to clean up files created by containers
                  [ -d "data" ] && docker run --rm -v "$(pwd)/data:/data" alpine sh -c "rm -rf /data/seaweedfs /data/minio" || true
              continue-on-error: true

            - name: Log in to Docker Hub
              if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  username: ${{ vars.DOCKERHUB_USER }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Stop/Start stack with Docker Compose
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
                  COMPOSE_PROFILES: dev_tools,dynamodb
                  WAIT_FOR_DOCKER_LAUNCH_RETRIES: 3
                  WAIT_FOR_DOCKER_LAUNCH_RETRY_DELAY: 5
              run: |
                  bin/ci-wait-for-docker launch --down

            - name: Wait for Docker services
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
                  COMPOSE_PROFILES: dev_tools,dynamodb
              run: bin/ci-wait-for-docker wait

            - name: Add service hostnames to /etc/hosts
              run: echo "127.0.0.1 db redis7 kafka clickhouse clickhouse-coordinator objectstorage seaweedfs temporal" | sudo tee -a /etc/hosts

            - name: Mint setup-action GitHub token
              id: setup-gh-token
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              continue-on-error: true
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_PRIVATE_KEY }}
                  skip-token-revoke: true

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version-file: 'pyproject.toml'
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}

            - name: Install uv
              id: setup-uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28' # pinned: unpinned setup-uv calls GH API on every job, exhausts rate limit
                  enable-cache: true
                  cache-dependency-glob: uv.lock
                  save-cache: ${{ github.ref == 'refs/heads/master' }}

            - name: Install rust
              uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
              with:
                  toolchain: 1.91.1

            - name: Set sccache WebDAV key prefix (Cargo.lock hash)
              run: echo "SCCACHE_WEBDAV_KEY_PREFIX=cargo-${{ hashFiles('rust/Cargo.lock') }}" >> "$GITHUB_ENV"

            - name: Install sccache
              uses: ./.github/actions/setup-sccache

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
              with:
                  shared-key: 'v2-rust-nodejs'
                  workspaces: rust
                  save-if: ${{ github.ref == 'refs/heads/master' }}

            - name: Install sqlx-cli
              uses: ./.github/actions/setup-sqlx-cli

            - name: Install SAML (python3-saml) dependencies
              if: steps.setup-uv.outputs.cache-hit != 'true'
              run: |
                  sudo rm -f /etc/apt/sources.list.d/*twingate*
                  sudo apt-get update
                  sudo apt-get install libxml2-dev libxmlsec1-dev libxmlsec1-openssl

            - name: Install python dependencies
              run: |
                  UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev

            - name: Download MaxMind Database
              run: |
                  ./bin/download-mmdb

            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/nodejs... install --frozen-lockfile
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}

            - name: Wait for Clickhouse, Redis, Kafka, DynamoDB, SeaweedFS
              # seaweedfs backs the blob-store integration tests; the profile-scoped
              # stack launch above never starts it (it sits in the replay/agents
              # profiles), so start it explicitly here — no profiles overlay in play.
              # objectstorage starts by default but is listed so --wait blocks on its
              # bootstrap sentinel: it returns InvalidAccessKeyId until that finishes.
              run: docker compose -f docker-compose.dev.yml up kafka redis7 valkey-cluster clickhouse maildev dynamodb objectstorage seaweedfs -d --wait

            - name: Create Kafka topics
              run: docker compose -f docker-compose.dev.yml up kafka-init

            - name: Fetch base branch for diff
              if: github.event_name == 'pull_request'
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: git fetch origin "$BASE_REF" --depth=1

            - name: Check for migrations in this PR
              id: check_migrations
              if: github.event_name == 'pull_request'
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  if git diff --name-only "origin/$BASE_REF..HEAD" | grep -E '(migrations/|rust/.*migrate)'; then
                    echo "has_migrations=true" >> $GITHUB_OUTPUT
                  else
                    echo "has_migrations=false" >> $GITHUB_OUTPUT
                  fi

            - name: Set up databases (fast path - restore schema)
              if: github.event_name == 'pull_request' && steps.check_migrations.outputs.has_migrations == 'false'
              env:
                  TEST: 'true'
                  SECRET_KEY: 'abcdef' # unsafe - for testing only
                  DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/posthog'
                  BEHAVIORAL_COHORTS_DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/test_behavioral_cohorts'
                  # Downloading an artifact requires the Actions permission, which the setup-actions app does not hold
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # Download pre-migrated schema from CI
                  ./bin/hogli db:download-schema

                  # Create test databases
                  docker compose -f docker-compose.dev.yml exec -T db psql -U posthog -c "DROP DATABASE IF EXISTS test_posthog;"
                  docker compose -f docker-compose.dev.yml exec -T db psql -U posthog -c "CREATE DATABASE test_posthog;"

                  # Restore schema to test database
                  echo "Restoring schema to test_posthog database..."
                  gunzip -c .postgres-backups/schema-latest.sql.gz | docker compose -f docker-compose.dev.yml exec -T db psql -q -U posthog test_posthog
                  echo "✅ Schema restored"

                  # Run Rust migrations for test databases
                  cd nodejs && pnpm run setup:test:rust

                  # Create dedicated persons database for postgres-parity tests
                  pnpm run setup:test:persons-parity

                  # Set up ClickHouse test database and schema
                  cd .. && TEST=1 SECRET_KEY='abcdef' python manage.py setup_test_environment --only-clickhouse

            - name: Set up databases (slow path - run migrations)
              if: github.event_name != 'pull_request' || steps.check_migrations.outputs.has_migrations == 'true'
              env:
                  TEST: 'true'
                  SECRET_KEY: 'abcdef' # unsafe - for testing only
                  DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/posthog'
                  BEHAVIORAL_COHORTS_DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/test_behavioral_cohorts'
              run: |
                  pnpm --filter=@posthog/nodejs setup:test
                  # Create dedicated persons database for postgres-parity tests
                  cd nodejs && pnpm run setup:test:persons-parity

            # Build workspace deps (Rust addons + TS) up front so the Jest step times only tests, not the addon compile.
            - name: Prepare Node.js workspace
              env:
                  SHARD_INDEX: ${{ matrix.shard }}
                  SHARD_COUNT: ${{ matrix.shard_count }}
              run: bin/turbo --filter=@posthog/nodejs prepare

            - name: Test with Jest
              id: run-jest
              # continue-on-error so the quarantine gate below is the verdict — it passes when
              # every failure is an already-quarantined flake, fails otherwise.
              continue-on-error: true
              env:
                  # Below DB name has `test_` prepended, as that's how Django (ran above) creates the test DB
                  DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/test_posthog'
                  BEHAVIORAL_COHORTS_DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/test_behavioral_cohorts'
                  PERSONS_DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/test_persons'
                  PERSONS_READONLY_DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/test_persons'
                  REDIS_URL: 'redis://localhost'
                  NODE_OPTIONS: '--max_old_space_size=4096'
                  SHARD_INDEX: ${{ matrix.shard }}
                  SHARD_COUNT: ${{ matrix.shard_count }}
                  LOG_LEVEL: ${{ runner.debug == '1' && 'info' || 'error' }}
                  # Emit JUnit XML for the Trunk upload below.
                  JEST_JUNIT_OUTPUT_DIR: ${{ github.workspace }}/junit-results
                  JEST_JUNIT_OUTPUT_NAME: junit-nodejs-${{ matrix.lane }}-${{ matrix.shard }}.xml
                  # Trunk attributes flakes by test file; jest-junit's default suite name is the
                  # describe block, so make it the file path instead.
                  JEST_JUNIT_SUITE_NAME: '{filepath}'
                  JEST_JUNIT_ADD_FILE_ATTRIBUTE: 'true'
                  # New compileHog callers must generate and commit their source-addressed fixture.
                  HOG_BYTECODE_CACHE_REQUIRED: 'true'
              run: |
                  if [ -f nodejs/jest.serial.config.js ]; then
                    cd nodejs && pnpm run test:${{ matrix.lane }}
                  elif [ "${{ matrix.lane }}" = 'serial' ]; then
                    bin/turbo run test --filter=@posthog/nodejs
                  else
                    echo "Parallel Jest config is not present on this branch; skipping."
                  fi

            - name: Test postgres-parity (isolated DB)
              id: run-parity
              continue-on-error: true
              if: (success() || failure()) && matrix.lane == 'serial' && matrix.shard == 1
              env:
                  DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/test_posthog'
                  BEHAVIORAL_COHORTS_DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/test_behavioral_cohorts'
                  PERSONS_DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/test_persons_parity'
                  PERSONS_READONLY_DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/test_persons_parity'
                  REDIS_URL: 'redis://localhost'
                  NODE_OPTIONS: '--max_old_space_size=4096'
                  LOG_LEVEL: ${{ runner.debug == '1' && 'info' || 'error' }}
                  JEST_JUNIT_OUTPUT_DIR: ${{ github.workspace }}/junit-results
                  JEST_JUNIT_OUTPUT_NAME: junit-nodejs-postgres-parity.xml
                  JEST_JUNIT_SUITE_NAME: '{filepath}'
                  JEST_JUNIT_ADD_FILE_ATTRIBUTE: 'true'
              run: cd nodejs && pnpm run test:postgres-parity

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  # Attempt-suffixed so a same-run re-run keeps attempt 1's artifact available
                  # for the recovery/failure correlation the signal job does. Retention 1 day:
                  # these are inputs to the signal and slow-test jobs, nothing long-lived.
                  # jest-junit's outputDir resolves against the jest process cwd, which is the
                  # workspace root for the turbo invocation but `nodejs/` if a shard ever runs
                  # jest directly; cover both.
                  name: junit-results-nodejs-${{ matrix.shard }}${{ github.run_attempt != '1' && format('-attempt{0}', github.run_attempt) || '' }}
                  path: |
                      junit-results/junit-nodejs-*.xml
                      junit-results/posthog-jest-quarantine-*.jsonl
                      nodejs/junit-results/junit-nodejs-*.xml
                      nodejs/junit-results/posthog-jest-quarantine-*.jsonl
                  if-no-files-found: ignore
                  retention-days: 1

            # Best-effort Trunk upload (continue-on-error); the "Fail on test failure" step below is
            # the verdict, so a Trunk outage can't red a passing shard. Internal PRs only (needs the
            # secret).
            # TRUNK_UPLOAD_ENABLED is the master kill-switch: when it is not 'true' this gate
            # skips, so nothing uploads and no known flakes are quarantined. TRUNK_QUARANTINE_ENABLED
            # splits the two — it defaults off, so set it to 'true' to let the verdict step below mask
            # known flakes; otherwise any real failure reds the job (quarantining needs upload on too).
            - name: Quarantine gate
              id: quarantine_gate
              continue-on-error: true
              if: ${{ !cancelled() && env.RUNS_ON_INTERNAL_PR == 'true' && github.repository == 'PostHog/posthog' && github.actor != 'dependabot[bot]' && vars.TRUNK_UPLOAD_ENABLED == 'true' }}
              uses: ./.github/actions/trunk-quarantine-gate
              with:
                  junit-paths: junit-results/junit-*.xml
                  # Worst of the two test steps: the gate must know the run failed even when
                  # only the parity step (shard 1) did. A skipped parity step counts as success.
                  previous-step-outcome: ${{ (steps.run-jest.outcome == 'failure' || steps.run-parity.outcome == 'failure') && 'failure' || 'success' }}
                  token: ${{ secrets.TRUNK_API_TOKEN }}

            # Verdict: red a real failure the gate didn't clear as a quarantined flake. != 'success'
            # also covers the skipped gate on fork/Dependabot. Sits before the logs-on-failure step
            # so a real failure still triggers it via failure().
            - name: Fail on test failure
              if: ${{ !cancelled() && (steps.run-jest.outcome == 'failure' || steps.run-parity.outcome == 'failure') && (vars.TRUNK_QUARANTINE_ENABLED != 'true' || steps.quarantine_gate.outcome != 'success') }}
              shell: bash
              run: exit 1

            - name: Output logs on failure
              if: failure()
              run: |
                  docker compose -f docker-compose.dev.yml logs clickhouse
                  # Echo out the logs stored in the container
                  docker compose -f docker-compose.dev.yml exec clickhouse cat /var/log/clickhouse-server/clickhouse-server.err.log

    rust_ingestion_e2e:
        if: needs.changes.outputs.nodejs == 'true'
        name: Rust ingestion consumer Node API e2e (depot-ubuntu-24.04-4)
        needs: changes
        runs-on: depot-ubuntu-24.04-4
        timeout-minutes: 30
        env:
            DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USER }}
            DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
            REDIS_URL: 'redis://localhost'
            CLICKHOUSE_HOST: 'localhost'
            CLICKHOUSE_DATABASE: 'posthog_test'
            KAFKA_HOSTS: 'kafka:9092'
        steps:
            - name: Code check out
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  clean: false

            - name: Clean up data directories with container permissions
              run: |
                  # Use docker to clean up files created by containers
                  [ -d "data" ] && docker run --rm -v "$(pwd)/data:/data" alpine sh -c "rm -rf /data/seaweedfs /data/minio" || true
              continue-on-error: true

            - name: Log in to Docker Hub
              if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  username: ${{ vars.DOCKERHUB_USER }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Stop/Start stack with Docker Compose
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
                  COMPOSE_PROFILES: dev_tools
                  WAIT_FOR_DOCKER_LAUNCH_RETRIES: 3
                  WAIT_FOR_DOCKER_LAUNCH_RETRY_DELAY: 5
              run: |
                  bin/ci-wait-for-docker launch --down

            - name: Wait for Docker services
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
                  COMPOSE_PROFILES: dev_tools
              run: bin/ci-wait-for-docker wait

            - name: Add service hostnames to /etc/hosts
              run: echo "127.0.0.1 db redis7 kafka clickhouse clickhouse-coordinator objectstorage seaweedfs temporal" | sudo tee -a /etc/hosts

            - name: Mint setup-action GitHub token
              id: setup-gh-token
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              continue-on-error: true
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_PRIVATE_KEY }}
                  skip-token-revoke: true

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version-file: 'pyproject.toml'
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}

            - name: Install uv
              id: setup-uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28' # pinned: unpinned setup-uv calls GH API on every job, exhausts rate limit
                  enable-cache: true
                  cache-dependency-glob: uv.lock
                  save-cache: ${{ github.ref == 'refs/heads/master' }}

            - name: Install rust
              uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
              with:
                  toolchain: 1.91.1

            - name: Set sccache WebDAV key prefix (Cargo.lock hash)
              run: echo "SCCACHE_WEBDAV_KEY_PREFIX=cargo-${{ hashFiles('rust/Cargo.lock') }}" >> "$GITHUB_ENV"

            - name: Install sccache
              uses: ./.github/actions/setup-sccache

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
              with:
                  shared-key: 'v2-rust-nodejs'
                  workspaces: rust
                  save-if: ${{ github.ref == 'refs/heads/master' }}

            - name: Install sqlx-cli
              uses: ./.github/actions/setup-sqlx-cli

            - name: Install SAML (python3-saml) dependencies
              if: steps.setup-uv.outputs.cache-hit != 'true'
              run: |
                  sudo rm -f /etc/apt/sources.list.d/*twingate*
                  sudo apt-get update
                  sudo apt-get install libxml2-dev libxmlsec1-dev libxmlsec1-openssl

            - name: Install python dependencies
              run: |
                  UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev

            - name: Download MaxMind Database
              run: |
                  ./bin/download-mmdb

            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/nodejs... install --frozen-lockfile
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}

            - name: Wait for Clickhouse, Redis, Kafka
              run: docker compose -f docker-compose.dev.yml up kafka redis7 clickhouse maildev -d --wait

            - name: Create Kafka topics
              run: docker compose -f docker-compose.dev.yml up kafka-init

            - name: Fetch base branch for diff
              if: github.event_name == 'pull_request'
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: git fetch origin "$BASE_REF" --depth=1

            - name: Check for migrations in this PR
              id: check_migrations
              if: github.event_name == 'pull_request'
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  if git diff --name-only "origin/$BASE_REF..HEAD" | grep -E '(migrations/|rust/.*migrate)'; then
                    echo "has_migrations=true" >> $GITHUB_OUTPUT
                  else
                    echo "has_migrations=false" >> $GITHUB_OUTPUT
                  fi

            - name: Set up databases (fast path - restore schema)
              if: github.event_name == 'pull_request' && steps.check_migrations.outputs.has_migrations == 'false'
              env:
                  TEST: 'true'
                  SECRET_KEY: 'abcdef' # unsafe - for testing only
                  DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/posthog'
                  BEHAVIORAL_COHORTS_DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/test_behavioral_cohorts'
                  # Downloading an artifact requires the Actions permission, which the setup-actions app does not hold
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # Download pre-migrated schema from CI
                  ./bin/hogli db:download-schema

                  # Create test databases
                  docker compose -f docker-compose.dev.yml exec -T db psql -U posthog -c "DROP DATABASE IF EXISTS test_posthog;"
                  docker compose -f docker-compose.dev.yml exec -T db psql -U posthog -c "CREATE DATABASE test_posthog;"

                  # Restore schema to test database
                  echo "Restoring schema to test_posthog database..."
                  gunzip -c .postgres-backups/schema-latest.sql.gz | docker compose -f docker-compose.dev.yml exec -T db psql -q -U posthog test_posthog
                  echo "✅ Schema restored"

                  # Run Rust migrations for test databases
                  cd nodejs && pnpm run setup:test:rust

                  # Set up ClickHouse test database and schema
                  cd .. && TEST=1 SECRET_KEY='abcdef' python manage.py setup_test_environment --only-clickhouse

            - name: Set up databases (slow path - run migrations)
              if: github.event_name != 'pull_request' || steps.check_migrations.outputs.has_migrations == 'true'
              env:
                  TEST: 'true'
                  SECRET_KEY: 'abcdef' # unsafe - for testing only
                  DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/posthog'
                  BEHAVIORAL_COHORTS_DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/test_behavioral_cohorts'
              run: pnpm --filter=@posthog/nodejs setup:test

            # The Node ingestion API worker runs as a real subprocess (tsx src/index.ts), so it
            # needs the compiled workspace dependencies (e.g. @posthog/hogvm/dist) on disk. The
            # regular Jest job gets these via `bin/turbo run test` (^build); here we build them
            # explicitly since we invoke the test directly.
            - name: Build Node.js workspace dependencies
              run: bin/turbo --filter=@posthog/nodejs prepare

            # ingestion-consumer depends on ingestion-worker-proto, whose build script runs protoc.
            - name: Install protoc
              uses: ./.github/actions/setup-protoc

            - name: Pre-build Rust ingestion consumer
              working-directory: rust
              run: cargo build -p ingestion-consumer

            - name: Test Rust ingestion consumer with Node ingestion API
              env:
                  DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/test_posthog'
                  BEHAVIORAL_COHORTS_DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/test_behavioral_cohorts'
                  PERSONS_DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/test_persons'
                  PERSONS_READONLY_DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/test_persons'
                  REDIS_URL: 'redis://localhost'
                  NODE_OPTIONS: '--max_old_space_size=4096'
                  LOG_LEVEL: ${{ runner.debug == '1' && 'info' || 'error' }}
              run: |
                  if [ -f nodejs/tests/service-e2e/rust-ingestion-consumer.serial.test.ts ] || [ -f nodejs/tests/service-e2e/rust-ingestion-consumer.test.ts ]; then
                    cd nodejs && pnpm run test:rust-ingestion-e2e
                  else
                    echo "Rust ingestion service e2e test is not present on this branch; skipping."
                  fi

            - name: Output logs on failure
              if: failure()
              run: |
                  docker compose -f docker-compose.dev.yml logs clickhouse
                  # Echo out the logs stored in the container
                  docker compose -f docker-compose.dev.yml exec clickhouse cat /var/log/clickhouse-server/clickhouse-server.err.log

    report-test-speed:
        name: Node.js test-speed report
        needs: [tests]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        continue-on-error: true
        permissions:
            actions: read
            contents: read
        # Prints the per-shard/per-test slow-down breakdown to the job log and summary.
        # It runs only the PR's reporter against uploaded JUnit and has no write permissions.
        if: >-
            !cancelled() &&
            needs.tests.result != 'skipped' &&
            github.repository == 'PostHog/posthog' &&
            (
            (github.event_name != 'pull_request' && github.ref == 'refs/heads/master') ||
            (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == 'PostHog/posthog')
            )
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
                  fetch-depth: 1
            - name: Check for trusted test reporter
              id: test-reporter
              shell: bash
              run: |
                  available=false
                  if [[ -f .github/scripts/report_test_timings.py && -f bin/report-jest-timings && -d tools/owners ]] && grep -q -- '--timings' .github/scripts/report_test_timings.py; then
                    available=true
                  fi
                  if [[ "$available" != "true" ]]; then
                    echo "Trusted timings reporter is not available on the checked-out ref; skipping speed report."
                  fi
                  echo "available=$available" >> "$GITHUB_OUTPUT"
            - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              if: steps.test-reporter.outputs.available == 'true'
              with:
                  version: '0.11.28'
            - name: Download Jest results
              if: steps.test-reporter.outputs.available == 'true'
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  path: ./junit-artifacts
                  pattern: junit-results-nodejs-*
            - name: Render test-speed report
              if: steps.test-reporter.outputs.available == 'true'
              uses: ./.github/actions/report-jest-timings
              with:
                  artifacts: ./junit-artifacts

    node_tests:
        # report-test-speed is deliberately not in needs: it is visible but non-gating.
        needs: [tests, rust_ingestion_e2e, build, lint]
        name: Node.js Tests Pass
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: always()
        steps:
            - run: exit 0
            - name: Check outcomes
              run: |
                  if [[ "${{ needs.tests.result }}" != "success" && "${{ needs.tests.result }}" != "skipped" ]]; then
                    echo "One or more jobs in the Node.js test matrix failed."
                    exit 1
                  fi
                  echo "All jobs in the Node.js test matrix passed."
                  if [[ "${{ needs.rust_ingestion_e2e.result }}" != "success" && "${{ needs.rust_ingestion_e2e.result }}" != "skipped" ]]; then
                    echo "Rust ingestion consumer Node API e2e failed."
                    exit 1
                  fi
                  echo "Rust ingestion consumer Node API e2e passed."
                  if [[ "${{ needs.build.result }}" != "success" && "${{ needs.build.result }}" != "skipped" ]]; then
                    echo "Node.js build failed."
                    exit 1
                  fi
                  echo "Node.js build passed."
                  if [[ "${{ needs.lint.result }}" != "success" && "${{ needs.lint.result }}" != "skipped" ]]; then
                    echo "Node.js lint failed."
                    exit 1
                  fi
                  echo "Node.js lint passed."
