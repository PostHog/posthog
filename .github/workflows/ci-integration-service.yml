name: Integration Service CI

# Trigger-level `paths:` rather than the always-fire + in-workflow paths-filter shape
# agent-proxy uses. This whole workflow is skippable — it covers one isolated package with
# no cross-repo coupling — and an unscoped PR subscription spends the shared repo-wide
# dispatch budget (see tools/hogli-commands/.../pr_event_fanout.py). If this ever becomes
# a required status check, it needs the in-workflow filter + always-running gate instead,
# because branch protection treats a never-dispatched check as pending forever.
on:
    push:
        branches:
            - master
        paths:
            - 'services/integration-service/**'
            - '.github/workflows/ci-integration-service.yml'
    pull_request:
        paths:
            - 'services/integration-service/**'
            - '.github/workflows/ci-integration-service.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    integration-service:
        name: Integration Service checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            # --ignore-scripts: nothing in this package's dependency tree runs code at
            # install time. This service reads every platform integration credential we
            # own, so an install-time script in a transitive package is exactly the
            # supply-chain path worth closing.
            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm install --frozen-lockfile --ignore-scripts --filter @posthog/integration-service...

            - name: Typecheck
              working-directory: services/integration-service
              run: pnpm typecheck

            - name: Unit tests
              working-directory: services/integration-service
              run: pnpm test:unit

            # Real Postgres via testcontainers; the ubuntu runner provides Docker.
            - name: Integration tests
              working-directory: services/integration-service
              run: pnpm test:integration

            - name: Lint
              working-directory: services/integration-service
              run: pnpm exec oxlint

            - name: Format check
              working-directory: services/integration-service
              run: pnpm format:check

            - name: Build
              working-directory: services/integration-service
              run: pnpm build
