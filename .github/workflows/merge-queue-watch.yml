name: Merge queue watch

# Prototype. Every 15 minutes, read the last three hours of Trunk merge queue test runs, flag PRs
# that look like a loop, and post to #merge-queue-watch-proto. Read only against Trunk.
# See .github/scripts/merge-queue-watch.mjs for the rules and thresholds.

on:
    schedule:
        # Off the top of the hour: GitHub delays or drops scheduled runs most often at :00.
        - cron: '4,19,34,49 * * * *'
    workflow_dispatch: # manual run, for testing and for a bot to start on demand

# Serialize ticks so the cooldown check never races a post from the previous tick.
concurrency:
    group: merge-queue-watch
    cancel-in-progress: false

permissions:
    contents: read

env:
    SLACK_CHANNEL: 'C0CAYS95ACT' # #merge-queue-watch-proto

jobs:
    watch:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: |
                      .github/scripts/merge-queue-watch.mjs
                  sparse-checkout-cone-mode: false

            - name: Check the merge queue
              env:
                  TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
                  SLACK_BOT_TOKEN: ${{ secrets.SLACK_DEVEX_BOT_TOKEN }}
                  # A person to tag when the detector is highly confident, meaning exactly one PR carries a
                  # culprit label. Unset never tags. A variable, not a secret, because it is an identifier.
                  ALERT_OWNER_SLACK_ID: ${{ vars.MERGE_QUEUE_ALERT_OWNER_SLACK_ID }}
                  # Incoming-webhook trigger of the investigation workflow. The URL is the only thing
                  # guarding the endpoint, so it must be a secret: an Actions variable prints in
                  # this public repo's step log. Unset still posts the Slack alert and skips the agent.
                  INVESTIGATION_WEBHOOK_URL: ${{ secrets.MERGE_QUEUE_INVESTIGATION_WEBHOOK_URL }}
              run: node .github/scripts/merge-queue-watch.mjs
