name: Master run traces

# Emits one OTLP trace per completed master workflow run: root span = the run,
# a span per job beneath it, a span per step beneath those. Covers every workflow,
# including the ones with no telemetry of their own (Container Images CD, the
# container CD lane, the Rust image builds). Master pushes are scanned repo-wide;
# Backend CI's push and scheduled runs come from Depot, which exposes workflow and job
# timestamps. Those traces stop at jobs because Depot provides no step or job-queue timestamps.
#
# Complements .github/scripts/report_test_timings.py, which emits per-test traces
# from JUnit XML under its own trace IDs. Those stay separate traces.
#
# Cron rather than a `workflow_run: workflows: ['*']` listener: that listener fires
# once per completed run (~40 per master push) and `'*'` matches the listener itself,
# so it self-triggers up to GitHub's 3-level workflow_run chain cap — thousands of
# dispatches a day against a repo that has to respect a 500-runs/10s cap. One cron
# tick that scans for newly-finished runs costs 24 dispatches a day instead.
#
# The watermark is this workflow's own last successful run, read back from the Actions
# API, so there is no cache or committed state to lose. A failed tick doesn't advance
# it, so the next tick re-covers the gap.
on:
    schedule:
        # Hourly. GitHub can delay a scheduled tick under load, which only means the next
        # one batches more runs — the watermark is time-based, so nothing is missed. The
        # 6h default lookback leaves plenty of headroom for a few skipped ticks.
        - cron: '0 * * * *'
    workflow_dispatch:
        inputs:
            since:
                description: 'ISO 8601 watermark override, for a manual backfill'
                required: false
                type: string

# Serialize ticks so two never scan the same window at once.
concurrency:
    group: ci-master-run-traces
    cancel-in-progress: false

permissions:
    contents: read
    actions: read # list master runs and read their jobs when the App-token mint falls back

jobs:
    emit-traces:
        name: Emit master run traces
        # hogli-lint: not-a-required-gate — report-only telemetry, gates nothing.
        if: github.repository == 'PostHog/posthog'
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            # Scheduled runs check out master, so PR code cannot replace the reporter
            # that receives the project token.
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
                  sparse-checkout: |
                      .github/scripts/report_workflow_run_traces.py
                      .github/scripts/depot_backend_runs.py
                      .github/actions/setup-uv
                  sparse-checkout-cone-mode: false

            # Share the telemetry app with the frontend, Storybook, and Playwright
            # calculate-running-time jobs to avoid more traffic on the posthog-tests
            # app used by ci-alerts-devex. Fall back to github.token if token creation fails.
            - name: Mint telemetry GitHub token
              id: app-token
              continue-on-error: true
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ vars.GH_APP_TELEMETRY_APP_ID }}
                  private-key: ${{ secrets.GH_APP_TELEMETRY_PRIVATE_KEY }}
                  skip-token-revoke: true

            - uses: ./.github/actions/setup-uv
              with:
                  enable-cache: false

            - uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1
              continue-on-error: true
              timeout-minutes: 1

            # Deliberately not continue-on-error: a red tick is what holds the watermark
            # at the last clean one, so the next tick re-covers the window. This workflow
            # gates nothing, so failing costs a notification rather than a blocked merge.
            - name: Emit master run traces
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
                  # The commit comparison needs contents read, which github.token has.
                  GH_TOKEN: ${{ github.token }}
                  DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
                  SINCE: ${{ inputs.since }}
                  POSTHOG_DEVEX_PROJECT_API_TOKEN: ${{ secrets.POSTHOG_DEVEX_PROJECT_API_TOKEN }}
                  # dual emission while CI traces migrate to the project behind POSTHOG_API_TOKEN
                  POSTHOG_CI_TRACES_EXTRA_TOKEN: ${{ secrets.POSTHOG_API_TOKEN }}
                  POSTHOG_OTLP_TRACES_ENDPOINT: ${{ vars.POSTHOG_OTLP_TRACES_ENDPOINT || 'https://us.i.posthog.com/i/v1/traces' }}
              run: |
                  args=()
                  if [[ -n "$SINCE" ]]; then
                    args+=(--since "$SINCE")
                  fi
                  uv run --script .github/scripts/report_workflow_run_traces.py "${args[@]}"
