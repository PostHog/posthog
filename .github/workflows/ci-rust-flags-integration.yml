name: Rust Flags Integration Tests

on:
    workflow_dispatch:
    pull_request:
        paths:
            - 'rust/feature-flags/**'
            - 'rust/personhog-replica/**'
            - 'rust/personhog-router/**'
            - 'posthog/api/test/rust_integration/**'
            - 'posthog/api/feature_flag.py'
            - 'posthog/api/cohort.py'
            - 'posthog/models/feature_flag/**'
            - 'posthog/models/cohort/**'
            - 'posthog/models/group_type_mapping.py'
            - '.github/workflows/ci-rust-flags-integration.yml'
    push:
        branches:
            - master
        paths:
            - 'rust/feature-flags/**'
            - 'rust/personhog-replica/**'
            - 'rust/personhog-router/**'
            - 'posthog/api/test/rust_integration/**'
            - 'posthog/api/feature_flag.py'
            - 'posthog/api/cohort.py'
            - 'posthog/models/feature_flag/**'
            - 'posthog/models/cohort/**'
            - 'posthog/models/group_type_mapping.py'
            - '.github/workflows/ci-rust-flags-integration.yml'

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    # Cache-bust knob. Keep in sync with ci-backend.yml, which saves these caches.
    SCHEMA_CACHE_EPOCH: v2
    # Django SECRET_KEY for cryptographic signing (sessions, CSRF, etc.) - test-only, not used in production
    SECRET_KEY: '6b01eee4f945ca25045b5aab440b953461b81b72'
    DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/test_posthog'
    REDIS_URL: 'redis://localhost:6379/'
    TEST: 1
    UV_HTTP_TIMEOUT: 300
    # Shared by the Rust flags service and the pytest step — the batch flag evaluation
    # tests (static cohort generation) authenticate with it. Test-only value.
    INTERNAL_REQUEST_TOKEN: 'rust-integration-internal-token'

jobs:
    rust-flags-integration:
        name: Rust /flags Integration Tests (depot-ubuntu-24.04)
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 30
        # Skipped on trunk-merge/** heads: merge-queue PRs are ephemeral and every
        # constituent PR already ran this in full.
        if: ${{ !startsWith(github.head_ref, 'trunk-merge/') }}

        services:
            postgres:
                image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
                env:
                    POSTGRES_USER: posthog
                    POSTGRES_PASSWORD: posthog
                    POSTGRES_DB: test_posthog
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

            redis:
                image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  # Deep enough to reach the PR's merge base, which keys the schema cache below.
                  fetch-depth: 1000
                  filter: blob:none

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: '3.13.13'

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28'
                  enable-cache: true

            - name: Install system dependencies
              # protobuf-compiler (protoc) is needed to build personhog-router: its
              # transitive etcd-client dep compiles proto files in a build script.
              run: sudo rm -f /etc/apt/sources.list.d/*twingate* && sudo apt-get update && sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl postgresql-client protobuf-compiler

            - name: Install Rust
              uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
              with:
                  toolchain: 1.91.1

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
              with:
                  shared-key: 'v2-rust-flags-integration-debug'
                  workspaces: rust
                  save-if: ${{ github.ref == 'refs/heads/master' }}

            - name: Install Python dependencies
              run: UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev

            - name: Create persons database
              run: |
                  PGPASSWORD=posthog psql -h localhost -U posthog -d test_posthog -c "CREATE DATABASE test_posthog_persons;"

            - name: Install sqlx-cli
              uses: ./.github/actions/setup-sqlx-cli

            - name: Fetch current PR base for merge-base
              if: github.event_name == 'pull_request'
              env:
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: git fetch --no-tags --depth=1000 --filter=blob:none origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

            - name: Compute schema cache key from merge-base
              id: schema-key
              if: github.event_name == 'pull_request'
              env:
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: |
                  # HEAD is the synthetic merge commit; HEAD^2 is the PR branch tip.
                  MERGE_BASE=$(git merge-base HEAD^2 "origin/${BASE_REF}" 2>/dev/null || echo "")
                  if [ -z "$MERGE_BASE" ]; then
                      echo "key=" >> $GITHUB_OUTPUT
                      echo "migrations_key=" >> $GITHUB_OUTPUT
                      echo "::notice::merge-base not found (branch too stale?), so the schema cache is skipped"
                      exit 0
                  fi
                  # Routing decides which app labels reach the dump, so an edited routing config matches no master dump.
                  DB_ROUTING=$(git ls-tree -r --format='%(objectname) %(path)' "$MERGE_BASE" -- products/db_routing.yaml posthog/product_db_config.py posthog/product_db_router.py)
                  DB_ROUTING_HEAD=$(git ls-tree -r --format='%(objectname) %(path)' HEAD -- products/db_routing.yaml posthog/product_db_config.py posthog/product_db_router.py)
                  if [ "$DB_ROUTING" != "$DB_ROUTING_HEAD" ]; then
                      echo "key=" >> $GITHUB_OUTPUT
                      echo "migrations_key=" >> $GITHUB_OUTPUT
                      echo "::notice::db routing config or router differs from the merge base, so the schema cache is skipped"
                      exit 0
                  fi
                  echo "key=posthog-schema-master-${MERGE_BASE}" >> $GITHUB_OUTPUT
                  # Last-resort restore prefix: matches the newest saved dump of any
                  # migration set, for the window where both exact keys miss. Gated on
                  # checkout age (a day) because a re-run of an old run keeps its original
                  # commit: a stale checkout can lack migrations the newest dump records,
                  # and the migrate top-ups only apply forward, so they cannot repair a
                  # dump that is newer than the code.
                  HEAD_AGE_SECONDS=$(( $(date +%s) - $(git show -s --format=%ct HEAD) ))
                  if [ "$HEAD_AGE_SECONDS" -lt 86400 ]; then
                      echo "prefix_key=posthog-schema-mig-${SCHEMA_CACHE_EPOCH}-" >> $GITHUB_OUTPUT
                  fi
                  # Must match ci-backend.yml's save-side computation byte for byte or the key never hits.
                  MIG_FILES=$(git ls-tree -r --format='%(objectname) %(path)' "$MERGE_BASE" \
                      | grep -E '/migrations/[^/]+\.py$|^[0-9a-f]+ uv\.lock$' \
                      | grep -vE '/(clickhouse|async_migrations)/migrations/' \
                      | LC_ALL=C sort) || true
                  PG_IMAGE=$(git show "${MERGE_BASE}:docker-compose.base.yml" 2>/dev/null \
                      | grep -m1 -E '^[[:space:]]*image:[[:space:]]*postgres:' | tr -d '[:space:]')
                  if [ -z "$MIG_FILES" ]; then
                      echo "migrations_key=" >> $GITHUB_OUTPUT
                      echo "::notice::no migration files matched, so restore falls back to the SHA schema key"
                  else
                      MIG_HASH=$(printf '%s\n%s\n%s' "$MIG_FILES" "$PG_IMAGE" "$DB_ROUTING" | sha256sum | cut -c1-40)
                      echo "migrations_key=posthog-schema-mig-${SCHEMA_CACHE_EPOCH}-${MIG_HASH}" >> $GITHUB_OUTPUT
                  fi

            - name: Restore schema cache from master
              if: ${{ github.event_name == 'pull_request' && steps.schema-key.outputs.key != '' }}
              uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: schema.sql.gz
                  # Prefer the shared content key; fall back to the exact merge-base SHA key,
                  # then to the newest dump of any migration set. Right after a migration
                  # lands on master both exact keys miss until ci-backend re-dumps; the
                  # migrate step below tops a slightly stale dump up in seconds instead of
                  # replaying the full history.
                  key: ${{ steps.schema-key.outputs.migrations_key || steps.schema-key.outputs.key }}
                  restore-keys: |
                      ${{ steps.schema-key.outputs.key }}
                      ${{ steps.schema-key.outputs.prefix_key }}

            - name: Prime test_posthog from cached schema
              # hogli db:restore-test-db is unusable here: it shells into the docker compose db service.
              if: ${{ github.event_name == 'pull_request' }}
              env:
                  PGHOST: localhost
                  PGUSER: posthog
                  PGPASSWORD: posthog
              run: |
                  # The default shell is `bash -e`, so without this psql's exit code hides a failed
                  # gunzip and a truncated dump commits as a half-primed schema.
                  set -o pipefail
                  prime() {
                      gunzip -c schema.sql.gz \
                          | psql -q -v ON_ERROR_STOP=1 --single-transaction test_posthog || return 1
                      # The dump is schema-only, so rows written by data migrations are absent.
                      python manage.py ensure_migration_defaults || return 1
                  }
                  if [ ! -f schema.sql.gz ]; then
                      echo "::notice::schema cache miss, so migrate runs from scratch"
                      exit 0
                  fi
                  if ! prime; then
                      # A half-primed database would let migrate skip work it still needs to do.
                      echo "::warning::schema restore failed (stale or incompatible dump?), so migrate runs from scratch"
                      psql -v ON_ERROR_STOP=1 postgres -c "DROP DATABASE IF EXISTS test_posthog;" -c "CREATE DATABASE test_posthog;"
                  fi

            - name: Set up test database schema
              run: |
                  python manage.py migrate --run-syncdb
              env:
                  DEBUG: '1'
                  DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/test_posthog'

            - name: Run persons database migrations
              run: |
                  sqlx migrate run --source rust/persons_migrations/
              env:
                  DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/test_posthog_persons'

            - name: Build Rust services
              working-directory: rust
              env:
                  # Debug builds compile much faster than release.
                  # We disable debug assertions because the codebase contains
                  # debug_assert! checks that intentionally panic on data invariant
                  # violations, which would crash the service mid-test-run.
                  RUSTFLAGS: '-C debug-assertions=no'
              # The Django flag API reads person/group/cohort data exclusively through
              # personhog (no ORM fallback), so the replica and router run alongside the
              # flags service. Building them together keeps one RUSTFLAGS/cache context.
              run: cargo build -p feature-flags -p personhog-replica -p personhog-router

            - name: Download MaxMind Database
              run: |
                  ./bin/download-mmdb

            - name: Start Rust flags service
              working-directory: rust
              run: |
                  ./target/debug/feature-flags > /tmp/rust-flags.log 2>&1 &
                  RUST_FLAGS_PID=$!
                  echo "RUST_FLAGS_PID=$RUST_FLAGS_PID" >> $GITHUB_ENV
                  # Wait for service to be ready, checking the process is still alive
                  for i in {1..30}; do
                      if ! kill -0 "$RUST_FLAGS_PID" 2>/dev/null; then
                          echo "ERROR: Rust flags service exited unexpectedly"
                          exit 1
                      fi
                      if curl -s http://127.0.0.1:3001/_readiness > /dev/null 2>&1; then
                          echo "Rust flags service is ready"
                          break
                      fi
                      echo "Waiting for Rust flags service... ($i/30)"
                      sleep 2
                  done
                  if ! curl -s http://127.0.0.1:3001/_readiness > /dev/null 2>&1; then
                      echo "ERROR: Rust flags service failed to start after 30 attempts"
                      exit 1
                  fi
              env:
                  BIND_HOST: '127.0.0.1'
                  BIND_PORT: '3001'
                  READ_DATABASE_URL: postgres://posthog:posthog@localhost:5432/test_posthog
                  WRITE_DATABASE_URL: postgres://posthog:posthog@localhost:5432/test_posthog
                  PERSONS_READ_DATABASE_URL: postgres://posthog:posthog@localhost:5432/test_posthog_persons
                  PERSONS_WRITE_DATABASE_URL: postgres://posthog:posthog@localhost:5432/test_posthog_persons
                  REDIS_URL: redis://localhost:6379/
                  # Disable cohort definition caching so each request fetches
                  # fresh cohort data. Without this, tests that create new cohorts
                  # after the first cache load would see stale definitions.
                  CACHE_TTL_SECONDS: '0'
                  RUST_BACKTRACE: '1'

            - name: Start personhog services
              working-directory: rust
              run: |
                  # personhog-replica serves person/group/cohort reads from the persons DB;
                  # personhog-router fronts it and is what Django talks to via PERSONHOG_ADDR.
                  # Both run as raw binaries against the existing postgres — the read path
                  # needs no etcd, config server, or leader election.
                  PRIMARY_DATABASE_URL='postgres://posthog:posthog@localhost:5432/test_posthog_persons' \
                  GRPC_ADDRESS='127.0.0.1:50051' \
                      ./target/debug/personhog-replica > /tmp/personhog-replica.log 2>&1 &
                  PERSONHOG_REPLICA_PID=$!
                  echo "PERSONHOG_REPLICA_PID=$PERSONHOG_REPLICA_PID" >> $GITHUB_ENV

                  REPLICA_URL='http://127.0.0.1:50051' \
                  GRPC_ADDRESS='127.0.0.1:50052' \
                      ./target/debug/personhog-router > /tmp/personhog-router.log 2>&1 &
                  PERSONHOG_ROUTER_PID=$!
                  echo "PERSONHOG_ROUTER_PID=$PERSONHOG_ROUTER_PID" >> $GITHUB_ENV

                  # gRPC has no HTTP readiness endpoint, so probe the listening port directly.
                  wait_for_grpc() {
                      local name=$1 pid=$2 port=$3
                      for i in {1..30}; do
                          if ! kill -0 "$pid" 2>/dev/null; then
                              echo "ERROR: $name exited unexpectedly"
                              return 1
                          fi
                          if timeout 1 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/$port" 2>/dev/null; then
                              echo "$name is accepting connections on $port"
                              return 0
                          fi
                          echo "Waiting for $name on $port... ($i/30)"
                          sleep 2
                      done
                      echo "ERROR: $name failed to accept connections on $port"
                      return 1
                  }
                  wait_for_grpc personhog-replica "$PERSONHOG_REPLICA_PID" 50051
                  wait_for_grpc personhog-router "$PERSONHOG_ROUTER_PID" 50052
              env:
                  RUST_BACKTRACE: '1'

            - name: Start Django API server
              run: |
                  python manage.py runserver 127.0.0.1:8000 --noreload &
                  DJANGO_PID=$!
                  echo "DJANGO_PID=$DJANGO_PID" >> $GITHUB_ENV
                  for i in {1..15}; do
                      if ! kill -0 "$DJANGO_PID" 2>/dev/null; then
                          echo "ERROR: Django server exited unexpectedly"
                          exit 1
                      fi
                      if curl -s http://127.0.0.1:8000/_health > /dev/null 2>&1; then
                          echo "Django server is ready"
                          break
                      fi
                      echo "Waiting for Django server... ($i/15)"
                      sleep 2
                  done
                  if ! curl -s http://127.0.0.1:8000/_health > /dev/null 2>&1; then
                      echo "ERROR: Django server failed to start after 15 attempts"
                      exit 1
                  fi
              env:
                  DEBUG: '1'
                  # Override the global TEST=1 so Celery tasks are enqueued to Redis
                  # (not executed synchronously) and don't try to reach ClickHouse.
                  TEST: '0'
                  DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/test_posthog'
                  # Django reads PERSONS_DB_WRITER_URL (not PERSONS_DATABASE_URL) to
                  # configure the persons_db_writer database alias.
                  PERSONS_DB_WRITER_URL: 'postgres://posthog:posthog@localhost:5432/test_posthog_persons'
                  # Person/group/cohort reads go through personhog (no ORM fallback), so the
                  # flag API needs the router address to create group- and cohort-based flags.
                  PERSONHOG_ADDR: 'localhost:50052'

            - name: Run integration tests
              run: |
                  pytest posthog/api/test/rust_integration/ -v --tb=short
              env:
                  SKIP_RUST_INTEGRATION_TESTS: '0'
                  FEATURE_FLAGS_SERVICE_URL: 'http://127.0.0.1:3001'
                  DJANGO_API_URL: 'http://127.0.0.1:8000'
                  DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/test_posthog'
                  PERSONS_DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/test_posthog_persons'
                  PERSONS_DB_WRITER_URL: 'postgres://posthog:posthog@localhost:5432/test_posthog_persons'

            - name: Dump service logs
              if: failure()
              run: |
                  echo "=== Rust flags service logs ==="
                  cat /tmp/rust-flags.log || echo "No log file found"
                  echo "=== personhog-replica logs ==="
                  cat /tmp/personhog-replica.log || echo "No log file found"
                  echo "=== personhog-router logs ==="
                  cat /tmp/personhog-router.log || echo "No log file found"

            - name: Stop services
              if: always()
              run: |
                  for pid in "$RUST_FLAGS_PID" "$PERSONHOG_REPLICA_PID" "$PERSONHOG_ROUTER_PID" "$DJANGO_PID"; do
                      if [ -n "$pid" ]; then
                          kill "$pid" || true
                      fi
                  done
