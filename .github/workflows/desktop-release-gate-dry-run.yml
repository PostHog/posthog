name: Desktop Release Gate Dry Run

# Read-only rehearsal of the backend-deploy gate in desktop-release.yml: runs the
# detection and deploy-poll scripts against real history and real GitHub
# Deployments without building, releasing or touching the update feed. Use it to
# see what a release cut at range_end_sha would wait for. The poll step never
# fails the run; a not-deployed result is reported in the step summary.

on:
    workflow_dispatch:
        inputs:
            range_start_sha:
                description: 'Range start (exclusive). Empty: the published feed version, or full desktop history.'
                required: false
                default: ''
            range_end_sha:
                description: 'Range end. Empty: the commit this workflow runs on.'
                required: false
                default: ''
            timeout_seconds:
                description: 'How long the deploy poll runs before reporting not-deployed.'
                required: false
                default: '30'

jobs:
    dry-run:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            pull-requests: read
            deployments: read
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  filter: blob:none
                  persist-credentials: false

            - name: Detect backend-coupled commits
              id: detect
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  RANGE_START_SHA: ${{ inputs.range_start_sha }}
                  CURRENT_SHA: ${{ inputs.range_end_sha || github.sha }}
              run: |
                  echo '## Backend coupling detection' >>"$GITHUB_STEP_SUMMARY"
                  .github/scripts/desktop/detect-backend-coupling.sh | tee -a "$GITHUB_STEP_SUMMARY"

            - name: Poll deployment status
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  REQUIRED_SHAS: ${{ steps.detect.outputs.required_shas }}
                  POLL_SECONDS: '5'
                  TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
              run: |
                  echo '## Deployment status' >>"$GITHUB_STEP_SUMMARY"
                  if .github/scripts/desktop/wait-for-backend-deploy.sh | tee -a "$GITHUB_STEP_SUMMARY"; then
                    echo 'Gate would pass.' >>"$GITHUB_STEP_SUMMARY"
                  else
                    echo 'Gate would still be waiting (see log above).' >>"$GITHUB_STEP_SUMMARY"
                  fi
