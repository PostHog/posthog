name: Bump the pinned hog engine

# Ingestion pins @posthog/hog-engine. When npm has a newer version, this opens (or refreshes) the
# PR that moves the pin, so the bump runs ingestion's tests in ingestion's lane like any other
# change there. Until the pin exists, the dependency is a workspace link and this does nothing.

on:
    workflow_dispatch:
    schedule:
        - cron: '30 10 * * 1-5'
        - cron: '30 20 * * 1-5'

permissions:
    contents: read

concurrency:
    group: bump-hog-engine
    cancel-in-progress: false

env:
    BRANCH: chore/ingestion-bump-hog-engine
    MANIFEST: ingestion/node/packages/ingestion/package.json

jobs:
    bump:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        if: github.repository == 'PostHog/posthog'
        steps:
            - name: Get app token
              id: app-token
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_SCHEDULED_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_SCHEDULED_ACTIONS_PRIVATE_KEY }}

            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  token: ${{ steps.app-token.outputs.token }}

            - name: Compare the pin with npm
              id: compare
              run: |
                  set -euo pipefail
                  pinned=$(node -p "require('./$MANIFEST').dependencies['@posthog/hog-engine'] || ''")
                  if ! [[ "$pinned" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "The engine is not pinned yet ($pinned); nothing to bump"
                      echo "bump=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  latest=$(npm view @posthog/hog-engine version)
                  echo "pinned=$pinned latest=$latest"
                  if [ "$pinned" = "$latest" ]; then
                      echo "bump=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "bump=true" >> "$GITHUB_OUTPUT"
                      echo "latest=$latest" >> "$GITHUB_OUTPUT"
                  fi

            - uses: ./.github/actions/pnpm-install
              if: steps.compare.outputs.bump == 'true'
              with:
                  install-command: pnpm install --frozen-lockfile --filter "@posthog/ingestion..."

            - name: Move the pin
              if: steps.compare.outputs.bump == 'true'
              env:
                  LATEST: ${{ steps.compare.outputs.latest }}
              run: pnpm --filter @posthog/ingestion add --save-exact "@posthog/hog-engine@${LATEST}"

            - name: Reset the branch to this commit
              if: steps.compare.outputs.bump == 'true'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  set -euo pipefail
                  if gh api "repos/${{ github.repository }}/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
                      gh api -X PATCH "repos/${{ github.repository }}/git/refs/heads/$BRANCH" -f sha="${{ github.sha }}" -F force=true >/dev/null
                  else
                      gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref="refs/heads/$BRANCH" -f sha="${{ github.sha }}" >/dev/null
                  fi

            - name: Commit via GitHub API (signed)
              if: steps.compare.outputs.bump == 'true'
              uses: planetscale/ghcommit-action@25309d8005ac7c3bcd61d3fe19b69e0fe47dbdde # v0.2.20
              with:
                  commit_message: 'chore(ingestion): bump @posthog/hog-engine to ${{ steps.compare.outputs.latest }}'
                  repo: ${{ github.repository }}
                  branch: ${{ env.BRANCH }}
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

            - name: Open or refresh the pull request
              if: steps.compare.outputs.bump == 'true'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  LATEST: ${{ steps.compare.outputs.latest }}
              run: |
                  set -euo pipefail
                  title="chore(ingestion): bump @posthog/hog-engine to $LATEST"
                  body="Automated bump of ingestion's pinned hog engine to the version on npm. The engine's own tests ran when it was published; this PR runs ingestion's tests against it."
                  existing=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)
                  if [ -n "$existing" ]; then
                      gh pr edit "$existing" --title "$title" --body "$body"
                  else
                      gh pr create --title "$title" --body "$body" --base master --head "$BRANCH"
                  fi
