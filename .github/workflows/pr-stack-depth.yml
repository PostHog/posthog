name: PR stack depth

on:
    workflow_call:
        inputs:
            max-open-depth:
                type: number
                default: 5

permissions:
    contents: read
    pull-requests: write

jobs:
    stack-depth:
        name: Stack depth
        # `position` counts merged layers, so a PR at or below the limit can't fail. The skip
        # lives here, not in the caller, to keep the `stack-depth / Stack depth` check name.
        if: ${{ github.event.pull_request.stack.position > inputs.max-open-depth }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: |
                      .github/scripts/check-stack-depth.mjs
                      frontend/bin/ci-report
                  sparse-checkout-cone-mode: false

            - name: Check open layers below this pull request
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  MAX_OPEN_DEPTH: ${{ inputs.max-open-depth }}
                  STACK_NUMBER: ${{ github.event.pull_request.stack.number }}
              run: node .github/scripts/check-stack-depth.mjs
