name: PR stack depth

on:
    workflow_call:

permissions:
    contents: read
    pull-requests: read

jobs:
    stack-depth:
        name: Stack depth
        if: ${{ github.event.pull_request.stack != null }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: .github/scripts/check-stack-depth.mjs
                  sparse-checkout-cone-mode: false

            - name: Check open layers below this pull request
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  STACK_NUMBER: ${{ github.event.pull_request.stack.number }}
              run: node .github/scripts/check-stack-depth.mjs
