name: PR stack depth

# Fails a pull request above the configured number of open layers in its GitHub
# stack, because each layer starts its own CI runs on every push and restack.

on:
    workflow_call:
        inputs:
            max-open-depth:
                type: number
                default: 5

permissions:
    contents: read
    pull-requests: write

jobs:
    stack-depth:
        name: Stack depth
        # `stack.position` counts merged layers too, so in a stack on the default branch it
        # is an upper bound on the open depth, and a PR at or below the limit cannot fail.
        # A stack on another branch always runs, because the layers under that branch count
        # too. A PR outside a stack, which includes every merge queue batch PR, has no
        # `stack`. The skip sits here, not on the caller job, because a skipped caller
        # reports only `stack-depth` and never the `stack-depth / Stack depth` context that
        # the ruleset requires.
        if: >-
            github.event.pull_request.stack.position > inputs.max-open-depth
            || (github.event.pull_request.stack && github.event.pull_request.stack.base.ref != github.event.repository.default_branch)
        runs-on: ubuntu-24.04
        timeout-minutes: 5

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: |
                      .github/scripts/check-stack-depth.mjs
                      frontend/bin/ci-report
                  sparse-checkout-cone-mode: false

            - name: Check open layers below this pull request
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                  MAX_OPEN_DEPTH: ${{ inputs.max-open-depth }}
                  STACK_NUMBER: ${{ github.event.pull_request.stack.number }}
              run: node .github/scripts/check-stack-depth.mjs
