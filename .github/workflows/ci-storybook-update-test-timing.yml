name: Storybook CI - Update test timing

on:
    workflow_dispatch:
        inputs:
            storybook_run_id:
                description: 'Storybook CI run ID (leave empty to use latest successful master run)'
                required: false
                type: string
    schedule:
        # Daily at 04:00 UTC: regenerate common/storybook/storybook-timings.json from the
        # JUnit artifacts of a recent successful master Storybook run and open/update a PR. The
        # manifest drives greedy bin-packing across the 16 visual-regression shards in
        # common/storybook/test-sequencer.js; balance decays as story files land without timings,
        # so a periodic refresh keeps the slowest shard close to the mean. Cheap (no story
        # execution — just an artifact download + XML parse).
        - cron: '0 4 * * *'

permissions:
    contents: write
    actions: read
    pull-requests: write

jobs:
    collect-and-refresh:
        name: Refresh storybook timing manifest from CI artifacts
        if: github.repository == 'PostHog/posthog'
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Guard — only run on master
              # This job force-resets chore/update-storybook-timings to github.sha and opens a PR
              # against master. Dispatched from a feature branch or tag, github.ref_name would check
              # out that ref and the PR would carry all of its unrelated commits, so reject anything
              # but master. Scheduled runs always target the default branch, so this only blocks a
              # stray manual dispatch (the sibling ci-backend-update-test-timing.yml gates the same way).
              env:
                  REF: ${{ github.ref }}
              run: |
                  if [ "$REF" != "refs/heads/master" ]; then
                      echo "::error::This workflow can only run on master (got $REF). Re-dispatch it from master."
                      exit 1
                  fi

            - name: Get app token
              id: app-token
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/create-github-app-token@v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_POSTHOG_TESTS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_TESTS_PRIVATE_KEY }}

            # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
            - uses: actions/checkout@v6.0.2
              with:
                  ref: ${{ github.ref_name }}
                  token: ${{ steps.app-token.outputs.token }}
                  sparse-checkout: |
                      common/storybook/update-storybook-timings.sh
                      common/storybook/storybook-timings.json
                  sparse-checkout-cone-mode: false

            - name: Find Storybook CI run to use
              id: find-run
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  INPUT_RUN_ID: ${{ inputs.storybook_run_id }}
              run: |
                  # Master pushes run the chromium shards and the nightly scheduled run runs the
                  # webkit and firefox shards, so the manifest is refreshed from one run of each.
                  # The nightly run is found by its webkit shards; its firefox artifacts come with it.
                  validate_run() {
                      local run_id="$1" event="$2" browser="$3" shard_pattern="$4" shard_count="$5"
                      local run_json artifact_names

                      run_json=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id")
                      if ! jq -e --arg event "$event" '
                          .conclusion == "success" and
                          .event == $event and
                          .head_branch == "master" and
                          .path == ".github/workflows/ci-storybook.yml"
                      ' <<< "$run_json" >/dev/null; then
                          echo "Run $run_id is not a successful master $event run of ci-storybook.yml" >&2
                          return 1
                      fi

                      artifact_names=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts?per_page=100" \
                          --jq '[.artifacts[] | select(.expired == false) | .name]')
                      if ! jq -e --arg pattern "^junit-results-storybook-$browser-(?:$shard_pattern)\$" --argjson count "$shard_count" '
                          ([.[] | select(test($pattern))] | unique | length) == $count
                      ' <<< "$artifact_names" >/dev/null; then
                          echo "Run $run_id does not have all $shard_count live $browser JUnit shard artifacts" >&2
                          return 1
                      fi
                  }

                  # Storybook JUnit artifacts have 1-day retention, so the newest run is not always
                  # usable: scan newest-first and pick the first with unexpired artifacts. The repo
                  # is busy enough that master runs can fall outside a plain `gh run list -L 20`
                  # window, so query the workflow's master runs directly. The event is matched
                  # here rather than with the API's `event` parameter, which returns stale pages.
                  find_run() {
                      local event="$1"
                      shift
                      gh api "repos/${{ github.repository }}/actions/workflows/ci-storybook.yml/runs?status=success&branch=master&per_page=100" \
                          --jq ".workflow_runs[] | select(.event == \"$event\") | .id" | \
                          while read -r id; do
                              if validate_run "$id" "$event" "$@"; then
                                  echo "$id"
                                  break
                              fi
                          done
                  }

                  if [ -n "$INPUT_RUN_ID" ]; then
                      if ! validate_run "$INPUT_RUN_ID" push chromium '[1-9]|1[0-6]' 16; then
                          echo "::error::Provided run must be a successful master Storybook push with all chromium shard artifacts"
                          exit 1
                      fi
                      chromium_run_id="$INPUT_RUN_ID"
                      echo "Using provided Storybook CI run for chromium: $chromium_run_id"
                  else
                      echo "Searching for a successful master Storybook push with live chromium JUnit artifacts..."
                      chromium_run_id=$(find_run push chromium '[1-9]|1[0-6]' 16)
                      if [ -z "$chromium_run_id" ]; then
                          echo "::error::No successful master Storybook push found with live chromium JUnit artifacts (1-day retention)"
                          exit 1
                      fi
                      echo "Using Storybook CI run for chromium: $chromium_run_id"
                  fi

                  echo "Searching for a successful nightly Storybook run with live webkit JUnit artifacts..."
                  webkit_run_id=$(find_run schedule webkit '[1-4]' 4)
                  if [ -z "$webkit_run_id" ]; then
                      echo "::warning::No successful nightly Storybook run with live webkit JUnit artifacts; keeping the manifest's webkit timings"
                  else
                      echo "Using Storybook CI run for webkit: $webkit_run_id"
                  fi

                  echo "run_ids=$chromium_run_id $webkit_run_id" >> "$GITHUB_OUTPUT"

            - name: Regenerate storybook-timings.json
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  RUN_IDS: ${{ steps.find-run.outputs.run_ids }}
              # The script downloads the runs' junit-results-storybook-* artifacts and rewrites
              # common/storybook/storybook-timings.json in place (seconds per story file, per browser).
              run: |
                  read -ra run_ids <<< "$RUN_IDS"
                  ./common/storybook/update-storybook-timings.sh "${run_ids[@]}"

            - name: Check for changes
              id: check-changes
              run: |
                  if git diff --quiet common/storybook/storybook-timings.json; then
                      echo "No changes to storybook timings"
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "Storybook timings updated"
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                      git diff --stat common/storybook/storybook-timings.json
                  fi

            # No diff: clean up a stale open PR/branch so it doesn't linger with outdated timings.
            - name: Clean up stale branch
              if: steps.check-changes.outputs.changed == 'false'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  existing_pr=$(gh pr list --head "chore/update-storybook-timings" --json number --jq '.[0].number' 2>/dev/null || true)
                  if [ -n "$existing_pr" ]; then
                    gh pr close "$existing_pr" --delete-branch || true
                    echo "Closed stale PR #$existing_pr and deleted branch"
                  fi

            - name: Reset branch to checked-out SHA
              # Force-reset the branch to the SHA this job was pinned to so each run is independent
              # of any unmerged commits from prior runs. Using github.sha guarantees the branch tip
              # matches workspace HEAD — otherwise a merge to master during the run could leave
              # ghcommit-action with a parent mismatch ("Expected branch to point to X").
              if: steps.check-changes.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  TARGET_SHA: ${{ github.sha }}
              run: |
                  if gh api repos/${{ github.repository }}/git/ref/heads/chore/update-storybook-timings >/dev/null 2>&1; then
                    gh api -X PATCH repos/${{ github.repository }}/git/refs/heads/chore/update-storybook-timings \
                      -f sha="$TARGET_SHA" -F force=true
                    echo "Force-reset branch to $TARGET_SHA (superseding any prior unmerged commits)"
                  else
                    gh api repos/${{ github.repository }}/git/refs -f ref=refs/heads/chore/update-storybook-timings -f sha="$TARGET_SHA"
                    echo "Created branch at $TARGET_SHA"
                  fi

            - name: Commit via GitHub API (signed)
              if: steps.check-changes.outputs.changed == 'true'
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: planetscale/ghcommit-action@v0.2.20
              with:
                  commit_message: 'chore(ci): update storybook shard timing manifest'
                  repo: ${{ github.repository }}
                  branch: chore/update-storybook-timings
                  file_pattern: common/storybook/storybook-timings.json
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

            - name: Create pull request
              if: steps.check-changes.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  RUN_IDS: ${{ steps.find-run.outputs.run_ids }}
                  REPO: ${{ github.repository }}
              run: |
                  existing_pr=$(gh pr list --head "chore/update-storybook-timings" --json number --jq '.[0].number' 2>/dev/null || true)
                  if [ -n "$existing_pr" ]; then
                    echo "PR #$existing_pr already exists — updated by commit"
                  else
                    run_links=""
                    for run_id in $RUN_IDS; do
                      run_links="$run_links [run $run_id](https://github.com/$REPO/actions/runs/$run_id)"
                    done
                    body=$(cat <<EOF
                  ## Problem

                  Storybook shard timings become stale as story files are added and removed, which makes visual-regression CI less balanced.

                  ## Changes

                  Refresh the timing manifest from Storybook CI${run_links}.

                  ## How did you test this code?

                  The scheduled workflow validated that the sources were a successful master push with all Chromium shard artifacts and, when one was found, a successful nightly run with all WebKit shard artifacts, then regenerated the manifest.

                  ## Docs update

                  No user-facing behavior or documented workflow changes.

                  ## 🤖 Agent context

                  **Autonomy:** Fully autonomous

                  Created by the Storybook timing refresh workflow from validated CI artifacts.
                  EOF
                  )

                    gh pr create \
                      --title "chore(ci): update storybook shard timing manifest" \
                      --body "$body" \
                      --base master \
                      --head chore/update-storybook-timings \
                      --reviewer "PostHog/team-devex"
                  fi
