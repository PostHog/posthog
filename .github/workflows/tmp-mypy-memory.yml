name: tmp mypy memory experiment
on:
    pull_request:
        paths:
            - .github/workflows/tmp-mypy-memory.yml

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    mypy-memory:
        name: mypy ${{ matrix.variant.name }} ${{ matrix.runner }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 50
        strategy:
            fail-fast: false
            matrix:
                runner: [depot-ubuntu-24.04, depot-ubuntu-24.04-4]
                variant:
                    - { name: fg-w2, flags: '--cache-fine-grained', workers: '2' }
                    - { name: nofg-w2, flags: '', workers: '2' }
                    - { name: nofg-w1, flags: '', workers: '1' }
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 1

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: 3.14.7

            - name: Install uv
              id: setup-uv
              uses: ./.github/actions/setup-uv

            - name: Install SAML (python3-saml) dependencies
              if: steps.setup-uv.outputs.cache-hit != 'true'
              run: |
                  sudo rm -f /etc/apt/sources.list.d/*twingate*
                  sudo apt-get update
                  sudo apt-get install libxml2-dev libxmlsec1 libxmlsec1-dev libxmlsec1-openssl

            - name: Install Python dependencies
              run: UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev

            - name: Download GeoIP database
              run: ./bin/download-mmdb

            - name: Machine
              run: |
                  nproc
                  free -m
                  swapon --show || true

            - name: Cold and warm mypy
              timeout-minutes: 40
              env:
                  MYPY_NUM_WORKERS: ${{ matrix.variant.workers }}
                  FLAGS: ${{ matrix.variant.flags }}
                  VARIANT: ${{ matrix.variant.name }}
                  RUNNER: ${{ matrix.runner }}
              run: |
                  sample() {
                      while sleep 1; do
                          free -b | awk '/^Mem:/{m=$3} /^Swap:/{s=$3} END{print m, s}'
                          ps -C mypy,python -o rss= | awk '{t+=$1} END{print "rss", t*1024}'
                      done > "$1"
                  }
                  peak() {
                      awk '$1!="rss"{u=$1+$2; if(u>p)p=u; if($2>sw)sw=$2} $1=="rss"{if($2>r)r=$2} END{printf "%.2f GiB, swap %.2f GiB, mypy rss %.2f", p/2^30, sw/2^30, r/2^30}' "$1"
                  }
                  run() {
                      local label=$1 log=mem-$1.txt
                      sample "$log" & local sampler=$!
                      local start=$SECONDS
                      local code=0
                      read -ra flags <<< "$FLAGS"
                      timeout 18m mypy "${flags[@]}" . > "out-$label.txt" 2>&1 || code=$?
                      local secs=$((SECONDS - start))
                      kill $sampler
                      tail -1 "out-$label.txt"
                      echo "| $VARIANT | $RUNNER | $label | $code | $secs s | $(peak "$log") GiB | $(du -sh .mypy_cache | cut -f1) |" | tee -a "$GITHUB_STEP_SUMMARY"
                  }
                  echo "| variant | runner | run | exit | wall | peak used+swap, swap, mypy rss | cache |" >> "$GITHUB_STEP_SUMMARY"
                  echo "|---|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
                  run cold
                  echo "" >> posthog/models/team/team.py
                  run warm-team-edit
