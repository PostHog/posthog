name: Script tests

# Unit tests for the helper scripts in .github/scripts that gate CI decisions
# (e.g. schema-impact narrowing). Without this, a regression in the narrowing
# logic could silently skip affected product tests.
on:
    pull_request:
        paths:
            - .github/scripts/**
            - .github/auto-assign-labels.json
            - .github/workflows/ci-scripts.yml
            # turbo-discover.test.js pins the Django segment table to these.
            - .github/workflows/ci-backend.yml
            - .depot/workflows/ci-backend.yml
            # The backend test selector and its verdict script gate ci-backend.
            - tools/snob_backend_test_selection_shadow.py
            - tools/test_snob_backend_test_selection_shadow.py
            - tools/test_selection_verdict.py
            - tools/test_test_selection_verdict.py

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    script-tests:
        name: .github/scripts unit tests
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            # The tests take seconds, so a full checkout of the monorepo dominated
            # the job. Check out only the trees the suite reads: most tests are
            # pure logic over path strings, but a few read the real repo to guard
            # against drift — trunk-impacted-targets.test.js walks proto/, rust/,
            # nodejs/ and every workspace package.json (the unanchored pattern
            # pulls each manifest without its source tree), and
            # report_test_timings imports tools/owners and finds the root by
            # owners.yaml. A new test that reads another path must add it here.
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 1
                  sparse-checkout: |
                      /.github/
                      /.depot/
                      /tools/
                      /proto/
                      /rust/
                      /nodejs/
                      /posthog/personhog_client/
                      /.semgrep/
                      /frontend/bin/ci-report/
                      /products/README.md
                      /services/README.md
                      /.nvmrc
                      /owners.yaml
                      /pnpm-workspace.yaml
                      /uv.lock
                      /tach.toml
                      /pyproject.toml
                      package.json
                  sparse-checkout-cone-mode: false

            - name: Setup Node.js
              uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version-file: .nvmrc

            # The preinstalled python3 runs these standalone tests, so no
            # setup-python step. defusedxml + opentelemetry + tools/owners are
            # report_test_timings.py's script deps.
            - name: Install pytest
              run: python3 -m pip install --quiet pytest parameterized defusedxml==0.7.1 opentelemetry-sdk==1.33.1 opentelemetry-exporter-otlp-proto-http==1.33.1 ./tools/owners

            # `-c /dev/null` skips the repo pytest.ini (its --reuse-db addopt needs
            # pytest-django, which we don't install here). `--noconftest` skips the
            # root conftest.py, whose autouse fixtures import the posthog package
            # (and thus Django) — not installed in this lightweight job. The
            # existence filter drops a file an unrebased PR predates, rather than
            # failing on it.
            - name: Python script tests
              run: |
                  set -euo pipefail
                  files=(
                      .github/scripts/test_schema_usage_scan.py
                      .github/scripts/test_report_test_timings.py
                      .github/scripts/test_report_workflow_run_traces.py
                      .github/scripts/test_optimize_test_durations.py
                      tools/test_snob_backend_test_selection_shadow.py
                      tools/test_test_selection_verdict.py
                  )
                  present=()
                  for file in "${files[@]}"; do [ -e "$file" ] && present+=("$file"); done
                  if [ "${#present[@]}" -eq 0 ]; then
                      echo "None of the listed test files exist; skipping instead of letting pytest discover the whole repo"
                      exit 0
                  fi
                  python3 -m pytest "${present[@]}" -v -c /dev/null -p no:cacheprovider --noconftest

            # schema-impact.test.js shells out to schema_usage_scan.py via the same
            # preinstalled python3. The existence filter drops a file an unrebased
            # PR predates, rather than failing on it.
            - name: Node script tests
              run: |
                  set -euo pipefail
                  files=(
                      .github/scripts/schema-impact.test.js
                      .github/scripts/ci-alerts-devex.test.js
                      .github/scripts/monitor-github-rate-limit.test.js
                      .github/scripts/label-pr-from-title.test.js
                      .github/scripts/assign-reviewers.test.js
                      .github/scripts/post-ci-sections.test.mjs
                      .github/scripts/weekly-flaky-report.test.mjs
                      .github/scripts/weekly-slow-tests-report.test.mjs
                      .github/scripts/patch-cli-npm-installer.test.mjs
                      .github/scripts/turbo-discover-cascade.test.js
                      .github/scripts/turbo-discover.test.js
                      .github/scripts/turbo-discover-staleness.test.js
                      .github/scripts/turbo-discover-sizing.test.js
                      .github/scripts/selected-django-shards.test.js
                      .github/scripts/trunk-impacted-targets.test.js
                  )
                  present=()
                  for file in "${files[@]}"; do [ -e "$file" ] && present+=("$file"); done
                  if [ "${#present[@]}" -eq 0 ]; then
                      echo "None of the listed test files exist; skipping instead of letting node --test discover the whole repo"
                      exit 0
                  fi
                  node --test "${present[@]}"
