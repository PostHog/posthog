name: Turbo CI

# Reusable workflow, called by pr-housekeeping.yml on every PR push.
# Push-cancels-previous-push comes from the caller's concurrency group.

on:
    workflow_call:

jobs:
    turbo-affected-4:
        timeout-minutes: 30
        name: Turbo Affected
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                # os: [depot-ubuntu-22.04, depot-ubuntu-22.04-4]
                os: [depot-ubuntu-22.04-4]
        permissions:
            contents: read

        steps:
            - name: Check out code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  # Just fetch the current commit/PR head
                  fetch-depth: 1

            # Conditionally fetch the base branch so Turborepo can compare against it
            - name: Fetch base branch
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    # Try to fetch the base branch; fall back to master for Graphite virtual branches
                    # (e.g. graphite-base/49227) which don't exist as real remote refs
                    if git fetch origin refs/heads/${GITHUB_BASE_REF}:refs/heads/${GITHUB_BASE_REF} --depth=1 2>/dev/null; then
                      echo "TURBO_SCM_BASE=${GITHUB_BASE_REF}" >> $GITHUB_ENV
                    else
                      echo "::warning::Base branch ${GITHUB_BASE_REF} not found as remote ref, falling back to master"
                      git fetch origin refs/heads/master:refs/heads/master --depth=1
                      echo "TURBO_SCM_BASE=master" >> $GITHUB_ENV
                    fi
                  else
                    git fetch origin refs/heads/master:refs/heads/master --depth=1
                    echo "TURBO_SCM_BASE=master" >> $GITHUB_ENV
                  fi

            # Turbo only, not the workspace. The dry run builds the task graph
            # from the package manifests, turbo.json and the lockfile. It runs no
            # task, so it never reads node_modules. The root install this
            # replaces pulled the whole toolchain — Playwright, Parcel, the
            # TypeScript preview — for a step that finishes in about a second,
            # and it became the slowest part of PR housekeeping whenever the
            # pnpm store cache restored only part of the store.
            #
            # The version comes from package.json, so a bump there cannot leave
            # this job on an older Turbo than the workspace pins. Turbo warns
            # that it found no local install. That warning is expected here.
            - name: Install turbo
              env:
                  # Keep a registry blip from failing the job.
                  npm_config_fetch_retries: 3
                  npm_config_fetch_retry_mintimeout: 10000
                  npm_config_fetch_retry_maxtimeout: 60000
              # Installed under RUNNER_TEMP, which is always writable, rather
              # than into the workspace, where a node_modules directory would
              # change what Turbo hashes.
              run: |
                  version="$(jq -re '.devDependencies.turbo | ltrimstr("^")' package.json)"
                  npm install --prefix "$RUNNER_TEMP/turbo" --no-audit --no-fund --no-save "turbo@$version"
                  echo "$RUNNER_TEMP/turbo/node_modules/.bin" >> "$GITHUB_PATH"

            # Turbo ships a prebuilt binary, and this job runs no package
            # script, so the runner's own Node is enough to start it. That
            # removes setup-node, and with it the app token that served only
            # setup-node's version-manifest lookups.
            - name: Turbo Affected
              run: turbo build --affected --dry-run
              env:
                  TURBO_SCM_BASE: ${{ env.TURBO_SCM_BASE }}
