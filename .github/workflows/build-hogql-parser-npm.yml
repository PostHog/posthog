name: Release hogql-parser npm

on:
    push:
        branches: [master]
        paths:
            - common/hogql_parser/**
            - .github/workflows/build-hogql-parser-npm.yml
    pull_request:
        paths:
            - common/hogql_parser/**
            - .github/workflows/build-hogql-parser-npm.yml

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    # npm's audit blocks the pnpm bootstrap. See .github/actions/pnpm-install for why.
    NPM_CONFIG_AUDIT: 'false'
    NPM_CONFIG_FUND: 'false'

jobs:
    check-package-version:
        permissions:
            contents: read
            pull-requests: write
        name: Check npm package version
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            committed-version: ${{ steps.check-package-version.outputs.committed-version }}
            published-version: ${{ steps.check-package-version.outputs.published-version }}
            is-new-version: ${{ steps.check-package-version.outputs.is-new-version }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
                  fetch-depth: 0
                  filter: blob:none

            - name: Check if common/hogql_parser/ has changed
              id: changed-files
              uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
              with:
                  files_yaml: |
                      parser:
                      - common/hogql_parser/**

            - name: Check package version and detect an update
              id: check-package-version
              uses: PostHog/check-package-version@f540540cb12d45ec3c58d42dbf1d60070ed2d268 # v2.1.1
              with:
                  path: common/hogql_parser

            - name: Comment on PR if version not bumped
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.changed-files.outputs.parser_any_changed == 'true' && steps.check-package-version.outputs.is-new-version == 'false'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  COMMITTED_VERSION: ${{ steps.check-package-version.outputs.committed-version }}
                  IS_FORK: ${{ github.event.pull_request.head.repo.full_name != 'PostHog/posthog' }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  message_body="It looks like the code of \`@posthog/hogql-parser\` (npm) changed in this PR, but its version stayed the same at $COMMITTED_VERSION. 👀"
                  message_body+=$'\n'"Make sure to resolve this in \`common/hogql_parser/package.json\` before merging!"
                  if [[ "$IS_FORK" == 'true' ]]; then
                    message_body+=$'\n'"This needs to be performed on a branch created on the PostHog/posthog repo itself. A PostHog team member will assist with this."
                  fi
                  if [ -f .github/scripts/post-reminder-section.mjs ]; then
                    BODY="$message_body" GITHUB_TOKEN="$GH_TOKEN" node .github/scripts/post-reminder-section.mjs hogql-parser-npm warn "version bump needed"
                  else
                    echo "Skipping hogql-parser-npm section — script not present on this checkout"
                  fi

            # Version was bumped — mark any reminder from an earlier push resolved.
            - name: Clear version reminder
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.changed-files.outputs.parser_any_changed == 'true' && steps.check-package-version.outputs.is-new-version == 'true'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NEW_VERSION: ${{ steps.check-package-version.outputs.committed-version }}
              run: |
                  if [ -f .github/scripts/post-reminder-section.mjs ]; then
                    node .github/scripts/post-reminder-section.mjs hogql-parser-npm --clear "version bumped to $NEW_VERSION"
                  fi

    build-wasm:
        name: Build WASM
        needs: check-package-version
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        if: needs.check-package-version.outputs.is-new-version == 'true' &&
            (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'PostHog/posthog'))
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false

            - name: Setup Emscripten for WASM build
              uses: ./.github/actions/setup-emsdk

            - name: Install Ninja
              run: sudo apt-get install -y ninja-build

            - name: Build WASM package
              run: cd common/hogql_parser && npm run build

            - name: Upload dist artifact
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: hogql-parser-dist
                  path: common/hogql_parser/dist/
                  if-no-files-found: error

    notify-approval-needed:
        name: Notify Slack - Approval Needed
        needs: build-wasm
        if: github.repository == 'PostHog/posthog' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Request release approval
              continue-on-error: true
              uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
              with:
                  method: chat.postMessage
                  token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
                  payload: |
                      channel: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
                      text: >-
                          <!subteam^${{ vars.GROUP_CLIENT_LIBRARIES_SLACK_GROUP_ID }}> Release approval needed for @posthog/hogql-parser.
                          Review <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|the release commit> and
                          <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|approve or reject the release>.

    publish-npm:
        if: github.repository == 'PostHog/posthog' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        name: Publish on npm
        needs: [build-wasm, notify-approval-needed]
        environment: Release SDK
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false

            - name: Download dist artifact
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: hogql-parser-dist
                  path: common/hogql_parser/dist

            - name: Set up Node.js
              uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version-file: .nvmrc
                  registry-url: https://registry.npmjs.org

            - name: Ensure modern npm (OIDC support)
              run: npm install -g npm@11.6.4

            - name: Publish package to npm
              run: cd common/hogql_parser && npm publish --access public
              env:
                  NODE_AUTH_TOKEN: ''
                  NPM_CONFIG_PROVENANCE: true
