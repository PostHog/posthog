name: Rust CI

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    benchmark:
        runs-on: depot-ubuntu-22.04-4
        timeout-minutes: 5
        strategy:
            fail-fast: false
            matrix:
                mode: [baseline, guarded]
                sample: [1, 2, 3]
        steps:
            - name: Install system OpenSSL
              env:
                  MODE: ${{ matrix.mode }}
              run: |
                  set -euo pipefail
                  probe() {
                      test "$(dpkg-query -W -f='${Status}' libssl-dev 2>/dev/null)" = 'install ok installed' &&
                      pkg-config --exists openssl &&
                      printf '#include <openssl/ssl.h>\nint main(void) { return OPENSSL_init_ssl(0, 0) != 1; }\n' |
                          cc -x c -o "$RUNNER_TEMP/openssl-probe" - $(pkg-config --cflags --libs openssl) &&
                      "$RUNNER_TEMP/openssl-probe"
                  }
                  start=$SECONDS
                  if [[ "$MODE" == guarded ]] && probe; then
                      echo 'Using installed OpenSSL and pkg-config provider'
                  else
                      sudo rm -f /etc/apt/sources.list.d/*twingate*
                      sudo apt-get update
                      sudo apt-get install -y libssl-dev pkg-config
                  fi
                  echo "setup_seconds=$((SECONDS - start))"
                  probe
