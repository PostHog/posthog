name: Rust CI
on:
    workflow_dispatch:
    push:
        branches: [master, main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    CARGO_TERM_COLOR: always
    UV_HTTP_TIMEOUT: 120
    RUNS_ON_INTERNAL_PR: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}

jobs:
    # Learning mode: nothing reads these outputs, so a recommendation cannot change what runs.
    # Fork and Dependabot runs get no secret; the queue always runs everything anyway.
    # The step fails open, because this telemetry must not turn a passing workflow red.
    dynamic-ci-filter:
        name: Trunk Dynamic CI (Learning Mode)
        if: >-
            github.event_name == 'pull_request' &&
            github.repository == 'PostHog/posthog' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]' &&
            !startsWith(github.head_ref, 'trunk-merge/')
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions: {}
        steps:
            - name: Ask Trunk which jobs this diff needs
              continue-on-error: true
              uses: trunk-io/dynamic-ci@5bfe63e878e3ec8bf14c0fa3b7e250685e668d75 # v0.1.6
              with:
                  token: ${{ secrets.TRUNK_API_TOKEN }}

    # Job to decide if we should run rust ci
    # See .github/actions/paths-filter/README.md for filter semantics
    changes:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        if: github.repository == 'PostHog/posthog'
        name: Determine need to run Rust checks
        permissions:
            contents: read
            pull-requests: read
        # Set job outputs to values from filter step
        outputs:
            rust: ${{ steps.filter.outputs.rust || 'true' }}
            all_crates: ${{ steps.filter.outputs.all_crates || 'false' }}
            flags_db: ${{ steps.filter.outputs.flags_db || 'true' }}
        steps:
            # For pull requests it's not necessary to checkout the code, but we
            # also want this to run on master so we need to checkout
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  clean: false
                  sparse-checkout: .github/actions/paths-filter
                  sparse-checkout-cone-mode: false
            - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              id: app-token
              if: github.repository == 'PostHog/posthog' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_PATHS_FILTER_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_PATHS_FILTER_PRIVATE_KEY }}
            - uses: ./.github/actions/paths-filter
              id: filter
              if: github.event_name != 'push' # Run all tests on master push
              with:
                  token: ${{ steps.app-token.outputs.token || github.token }}
                  filters: |
                      rust:
                        # Avoid running rust tests for irrelevant changes
                        - 'rust/**'
                        - 'ingestion/rust/**'
                        - 'proto/**'
                        - 'ingestion/proto/**'
                        - '.github/workflows/ci-rust.yml'
                        - '.github/scripts/rust_test_shards.py'
                        - '.github/scripts/resolve-changed-files.sh'
                        - '.github/actions/setup-uv/**'
                        - '.github/workflows/rust.yml'
                        - '.github/workflows/rust-docker-build.yml'
                        - '.github/actions/setup-protoc/**'
                        - '.github/actions/setup-rust/**'
                        - '.github/actions/setup-sccache/**'
                        - 'posthog/management/commands/setup_test_environment.py'
                        - 'posthog/migrations/**'
                        - 'ee/migrations/**'
                        - 'docker-compose.dev.yml'
                        - 'docker-compose.base.yml'
                        # The rust mirror of the out-of-band domain list has a parity test
                        # against the shared json.
                        - 'posthog/security/crosslang/**'
                        # The rust mirror of the AI event limits has a parity test against the shared json.
                        - 'products/ai_observability/shared/crosslang/**'
                        # Hypercache contract: Python serializer changes may break Rust deserialization
                        - 'posthog/api/feature_flag.py'
                        - 'posthog/models/feature_flag/flags_cache.py'
                        - 'posthog/models/feature_flag/feature_flag.py'
                        - 'rust/feature-flags/tests/fixtures/hypercache_contract.json'
                        # common-cohort-team-access tests its query against the table these migrations build
                        - 'products/cohorts/backend/migrations/**'
                        # replay-core-v4's tests read the encryption vectors the Node writers pin
                        - 'ingestion/node/packages/ai-research/src/pipelines/ml-mirror/keys/encryption-vector*.json'
                        - 'ingestion/node/packages/ai-research/src/pipelines/ai-research/v4-keys/encryption-vector*.json'
                      all_crates:
                        - '.github/scripts/rust_test_shards.py'
                        # Pins the service images that every crate's tests run against.
                        # A determinator rule would also rebuild and deploy every Rust image.
                        - 'docker-compose.base.yml'
                      # What the feature-flags stall recovery tests exercise: the whole request path.
                      flags_db:
                        - 'rust/feature-flags/**'
                        - 'rust/common/database/**'
                        # An sqlx bump can change how a pool recovers.
                        - 'rust/Cargo.lock'
                        - 'rust/.config/nextest.toml'
                        - '.github/workflows/ci-rust.yml'

    # Compute affected crates and test shards. Only runs when Rust changes
    # are detected, keeping the lightweight `changes` job fast for non-Rust PRs.
    affected:
        name: Compute affected Rust crates
        needs: changes
        if: needs.changes.outputs.rust == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
        outputs:
            matrix: ${{ steps.shards.outputs.matrix }}
            affected_crates: ${{ steps.affected.outputs.crates }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 1
                  filter: blob:none
                  sparse-checkout: |
                      rust/
                      ingestion/rust/
                      proto/
                      ingestion/proto/
                      .github/rust-images.yml
                      .github/scripts/rust_test_shards.py
                      .github/scripts/resolve-changed-files.sh
                      .github/actions/rust-compute-affected/
                      .github/actions/setup-rust/
                  sparse-checkout-cone-mode: false
                  clean: false

            - name: Resolve the changed files
              id: changed-files
              if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.all_crates != 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  MERGE_TARGET: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.ref }}
              run: |
                  if [ -f .github/scripts/resolve-changed-files.sh ]; then
                      bash .github/scripts/resolve-changed-files.sh
                  else
                      echo 'resolved=false' >> "$GITHUB_OUTPUT"
                  fi

            - name: Install rust
              uses: ./.github/actions/setup-rust
              with:
                  toolchain: 1.91.1

            - name: Compute affected crates
              id: affected
              uses: ./.github/actions/rust-compute-affected
              with:
                  event-name: ${{ github.event_name }}
                  pr-base-sha: ${{ github.event.pull_request.base.sha }}
                  push-before-sha: ${{ github.event.before }}
                  base-ref: ${{ github.event_name == 'push' && github.event.before || steps.changed-files.outputs.merge_base }}
                  changed-files: ${{ runner.temp }}/changed-files.txt
                  rebuild-all: ${{ steps.changed-files.outputs.resolved != 'true' && 'true' || 'false' }}

            # Bin-pack affected packages into balanced test shards.
            - name: Compute test shards
              id: shards
              env:
                  AFFECTED_CRATES: ${{ steps.affected.outputs.crates }}
              run: python3 .github/scripts/rust_test_shards.py

    build:
        name: Build Rust (${{ matrix.packages }})
        strategy:
            matrix: ${{ fromJSON(needs.affected.outputs.matrix) }}
        needs: [changes, affected]
        if: needs.changes.outputs.rust == 'true'
        runs-on: depot-ubuntu-22.04-4
        timeout-minutes: 20
        permissions:
            contents: read

        defaults:
            run:
                working-directory: rust

        steps:
            # Checkout project code
            # Use sparse checkout to only select files in rust directory
            # Turning off cone mode ensures that files in the project root are not included during checkout
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: |
                      rust/
                      ingestion/rust/
                      proto/
                      ingestion/proto/
                      .github/actions/setup-protoc/
                      .github/actions/setup-rust/
                      .github/actions/setup-sccache/
                  sparse-checkout-cone-mode: false
                  clean: false

            - name: Install system OpenSSL
              run: |
                  sudo rm -f /etc/apt/sources.list.d/*twingate*
                  sudo apt-get update
                  sudo apt-get install -y libssl-dev pkg-config

            # protoc and rustup both write $GITHUB_PATH, so they stay out of a
            # `parallel:` block. Concurrent writes crash the GitHub Actions runner
            # ("Collection was modified" or a missing-key error), and the runner
            # fails the step even though the tool installed fine.
            - name: Install protoc
              uses: ./.github/actions/setup-protoc

            - name: Install rust
              uses: ./.github/actions/setup-rust
              with:
                  toolchain: 1.91.1

            - name: Set sccache WebDAV key prefix (Cargo.lock hash)
              run: echo "SCCACHE_WEBDAV_KEY_PREFIX=cargo-${{ hashFiles('rust/Cargo.lock') }}" >> "$GITHUB_ENV"

            - name: Install sccache
              uses: ./.github/actions/setup-sccache

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
              with:
                  shared-key: 'v2-rust-ci'
                  workspaces: rust
                  save-if: ${{ github.ref == 'refs/heads/master' }}

            - name: Run cargo build
              env:
                  # Use system OpenSSL instead of vendored to avoid assembly build issue (2026-01-13)
                  OPENSSL_NO_VENDOR: '1'
                  SHARD_PACKAGES: ${{ matrix.packages }}
              run: |
                  crates=()
                  for c in $SHARD_PACKAGES; do crates+=(-p "$c"); done
                  echo "Building shard crates: ${crates[*]}"
                  cargo build "${crates[@]}" --locked --release
                  find target/release/ -maxdepth 1 -executable -type f -exec strip {} +

            - name: Report sccache counters
              if: always()
              continue-on-error: true
              run: |
                  if command -v sccache >/dev/null; then
                      # The full report includes the cache endpoint, so allow only numeric counters.
                      sccache --show-stats 2>/dev/null | awk '/^(Compile requests|Cache hits|Cache misses|Non-cacheable calls)[[:space:]]+[0-9]+$/ { print }'
                  fi

    test:
        name: Test Rust (${{ matrix.packages }})
        strategy:
            matrix: ${{ fromJSON(needs.affected.outputs.matrix) }}
        needs: [changes, affected]
        if: needs.changes.outputs.rust == 'true'
        runs-on: depot-ubuntu-24.04-4
        timeout-minutes: 20
        permissions:
            contents: read
        env:
            DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USER }}
            DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

        defaults:
            run:
                working-directory: rust

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  clean: false
            - name: Clean up data directories with container permissions
              working-directory: .
              run: |
                  # Use docker to clean up files created by containers (from repo root, not rust/)
                  if [ -d "data" ]; then
                      docker run --rm -v "$(pwd)/data:/data" alpine sh -c "rm -rf /data/seaweedfs /data/minio" || true
                  fi
              continue-on-error: true

            - name: Log in to Docker Hub
              continue-on-error: true
              if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  username: ${{ vars.DOCKERHUB_USER }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Setup main repo and dependencies
              env:
                  COMPOSE_FILE: ../docker-compose.dev.yml:../docker-compose.profiles.yml
                  # `replay` boots SeaweedFS (S3 API on :8333), required by the
                  # batch-import-worker temp-bucket integration tests, which fail
                  # rather than skip when the store is down in CI.
                  COMPOSE_PROFILES: etcd,replay
                  WAIT_FOR_DOCKER_LAUNCH_RETRY_DELAY: 10
              run: |
                  ../bin/ci-wait-for-docker launch --down
                  # objectstorage reports healthy only once its `posthog` bucket and
                  # `object_storage_root_user` identity exist; the cohort processor's S3 tests use both.
                  ../bin/ci-wait-for-docker wait seaweedfs objectstorage

                  echo "127.0.0.1 db redis7 kafka clickhouse clickhouse-coordinator objectstorage seaweedfs temporal" | sudo tee -a /etc/hosts

            # please keep the tag version here in sync with rust-version in rust/*/Cargo.toml
            - name: Install rust
              uses: ./.github/actions/setup-rust
              with:
                  toolchain: 1.91.1

            - name: Install protoc
              uses: ./.github/actions/setup-protoc

            - name: Set sccache WebDAV key prefix (Cargo.lock hash)
              run: echo "SCCACHE_WEBDAV_KEY_PREFIX=cargo-${{ hashFiles('rust/Cargo.lock') }}" >> "$GITHUB_ENV"

            - name: Install sccache
              uses: ./.github/actions/setup-sccache

            - name: Mint setup-action GitHub token
              id: setup-gh-token
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              continue-on-error: true
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_SETUP_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_PRIVATE_KEY }}
                  skip-token-revoke: true

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version-file: 'pyproject.toml'
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}

            - name: Install uv
              id: setup-uv
              uses: ./.github/actions/setup-uv

            - name: Install SAML (python3-saml) dependencies
              if: steps.setup-uv.outputs.cache-hit != 'true'
              run: |
                  sudo rm -f /etc/apt/sources.list.d/*twingate*
                  sudo apt-get update
                  sudo apt-get install libxml2-dev libxmlsec1-dev libxmlsec1-openssl postgresql-client

            - name: Install python dependencies
              run: |
                  UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev --directory ..

            - name: Install sqlx-cli
              uses: ./.github/actions/setup-sqlx-cli

            - name: Set up databases
              env:
                  DEBUG: 'true'
                  TEST: 'true'
                  SECRET_KEY: 'abcdef' # unsafe - for testing only
                  DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/posthog'
              run: cd ../ && python manage.py setup_test_environment

            - name: Run sqlx migrations
              env:
                  DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/posthog_persons'
              run: |
                  sqlx migrate run --source persons_migrations/
                  DATABASE_URL='postgres://posthog:posthog@localhost:5432/test_posthog' sqlx migrate run --source behavioral_cohorts_migrations/

            - name: Download MaxMind Database
              run: |
                  cd ../ && ./bin/download-mmdb

            - name: Install cargo-binstall
              uses: cargo-bins/cargo-binstall@5cbf019d8cb9b9d5b086218c41458ea35d817691 # main

            - name: Install cargo-nextest
              # --force: Swatinem/rust-cache restores ~/.cargo/.crates2.json but not the
              # binary itself, so without --force binstall can short-circuit ("already
              # installed") and leave no `cargo nextest` binary.
              run: cargo binstall --no-confirm --force --locked cargo-nextest@0.9.140

            - name: Run cargo test
              id: run-tests
              # continue-on-error so the quarantine gate below is the verdict — it passes when
              # every failure is an already-quarantined flake, fails otherwise.
              continue-on-error: true
              env:
                  RUST_BACKTRACE: 1
                  # Set up dual database environment for feature-flags service
                  PERSONS_READ_DATABASE_URL: ${{ contains(format(' {0} ', matrix.packages), ' feature-flags ') && 'postgres://posthog:posthog@localhost:5432/posthog_persons' || '' }}
                  PERSONS_WRITE_DATABASE_URL: ${{ contains(format(' {0} ', matrix.packages), ' feature-flags ') && 'postgres://posthog:posthog@localhost:5432/posthog_persons' || '' }}
                  FLAGS_DB_CHANGED: ${{ needs.changes.outputs.flags_db }}
              run: |
                  # nextest (instead of plain `cargo test`) emits JUnit XML for the Trunk quarantine
                  # gate below. It does not run doctests; those run in their own step, outside the
                  # gate, because they emit no JUnit and so could never be cleared as quarantined.
                  # --no-tests=pass matches `cargo test` semantics for packages/filters with no tests.
                  # Each run overwrites target/nextest/ci/junit.xml, so stash it per package —
                  # even on failure, so the failing results still reach Trunk.
                  run_nextest() {
                      local junit_name=$1
                      shift
                      local rc=0
                      cargo nextest run --profile ci --no-tests=pass "$@" || rc=$?
                      if [ -f target/nextest/ci/junit.xml ]; then
                          mv target/nextest/ci/junit.xml "junit-nextest-$junit_name.xml"
                      fi
                      return $rc
                  }
                  # Keep testing the remaining packages after a failure: the gate masks a shard
                  # only from its JUnit files, so every package must contribute its results —
                  # an early exit would let a masked failure skip the packages behind it.
                  overall_rc=0
                  for pkg in ${{ matrix.packages }}; do
                      echo "::group::Testing $pkg"
                      # Free cgroups, overlayfs, and network namespaces from previous testcontainers
                      docker system prune -f --volumes 2>/dev/null || true
                      extra_args=""
                      # Limit test threads for packages with sqlx pool exhaustion issues
                      if [ "$pkg" = "property-defs-rs" ]; then
                          extra_args="--test-threads=4"
                      fi
                      if [ "$pkg" = "cohort-seeder" ] && [ -f cohort-seeder/Cargo.toml ] && grep -q '^pg-test-support[[:space:]]*=' cohort-seeder/Cargo.toml; then
                          features="pg-test-support"
                          # ch-test-support arms the live-ClickHouse rebuild corpus against the
                          # compose stack's clickhouse; the grep keeps branches that predate the
                          # feature building.
                          if grep -q '^ch-test-support[[:space:]]*=' cohort-seeder/Cargo.toml; then
                              features="pg-test-support,ch-test-support"
                          fi
                          DATABASE_URL='postgres://posthog:posthog@localhost:5432/test_posthog' run_nextest "$pkg" -p "$pkg" --features "$features" $extra_args || overall_rc=1
                      else
                          run_nextest "$pkg" -p "$pkg" $extra_args || overall_rc=1
                      fi
                      # Error-tracking rate-limiter e2e tests are #[ignore]'d (they need a real Redis
                      # via testcontainers/Docker, absent in some environments). This job has Docker,
                      # so run them here, single-threaded to avoid concurrent-container flakes. The
                      # `rate_limiting` filter matches nothing on branches without these tests, so it
                      # stays safe for unrebased PRs.
                      if [ "$pkg" = "cymbal" ]; then
                          run_nextest cymbal-ignored -p cymbal -E 'test(rate_limiting)' --run-ignored only --test-threads=1 || overall_rc=1
                      fi
                      # usage-ingestion's e2e tests are #[ignore]'d (they need Kafka and ClickHouse).
                      # This job has both, on the suffixed schema `setup_test_environment` created.
                      # Single-threaded so the load test's throughput measurement stays clean. The
                      # Cargo.toml guard keeps this a no-op on branches predating the crate.
                      if [ "$pkg" = "usage-ingestion" ] && [ -f usage-ingestion/Cargo.toml ]; then
                          USAGE_INGESTION_E2E_CLICKHOUSE_DATABASE=posthog_test \
                          USAGE_INGESTION_E2E_TOPIC=clickhouse_billing_usage_records_test \
                          USAGE_INGESTION_E2E_LOAD_REQUESTS=2000 \
                              run_nextest usage-ingestion-ignored -p usage-ingestion --run-ignored only --test-threads=1 || overall_rc=1
                      fi
                      # cohort-stream-processor's broker and S3 tests are #[ignore]'d. This job runs Kafka
                      # and SeaweedFS (objectstorage, :19000). `kind(test)` selects the tests/ binaries,
                      # whose ignored tests all need this stack. One at a time: each joins its own
                      # consumer group and most create several 64-partition topics. Not `localhost`: it
                      # also resolves to `::1`, where the broker refuses, and the tests' readers fail on that.
                      if [ "$pkg" = "cohort-stream-processor" ]; then
                          KAFKA_HOSTS=kafka:9092 \
                          CHECKPOINT_S3_ENDPOINT=http://localhost:19000 \
                          CHECKPOINT_S3_REGION=us-east-1 \
                          CHECKPOINT_S3_BUCKET=posthog \
                          CHECKPOINT_S3_ACCESS_KEY_ID=object_storage_root_user \
                          CHECKPOINT_S3_SECRET_ACCESS_KEY=object_storage_root_password \
                              run_nextest cohort-stream-processor-ignored -p cohort-stream-processor -E 'kind(test)' --run-ignored only --test-threads=1 || overall_rc=1
                      fi
                      # feature-flags' persons DB stall tests are #[ignore]'d: they lock posthog_person,
                      # so they run one at a time, and only on master or when flags_db matches. The file
                      # guard keeps this a no-op on branches that predate them.
                      if [ "$pkg" = "feature-flags" ] && [ "$FLAGS_DB_CHANGED" = "true" ] && [ -f feature-flags/tests/stall_recovery.rs ]; then
                          run_nextest feature-flags-stall -p feature-flags -E 'binary(stall_recovery)' --run-ignored only --test-threads=1 || overall_rc=1
                      fi
                      echo "::endgroup::"
                  done
                  exit $overall_rc

            - name: Dump Kafka logs on failure
              if: ${{ !cancelled() && (failure() || steps.run-tests.outcome == 'failure') }}
              env:
                  COMPOSE_FILE: ../docker-compose.dev.yml:../docker-compose.profiles.yml
              run: |
                  docker ps -a || true
                  docker compose logs --no-color --tail=500 kafka || true
                  docker compose ps -a -q kafka | xargs -r docker inspect || true

            # Doctests fail the job directly: they emit no JUnit, so the quarantine gate
            # below can neither see nor mask them.
            - name: Run doctests
              env:
                  RUST_BACKTRACE: 1
                  PERSONS_READ_DATABASE_URL: ${{ contains(format(' {0} ', matrix.packages), ' feature-flags ') && 'postgres://posthog:posthog@localhost:5432/posthog_persons' || '' }}
                  PERSONS_WRITE_DATABASE_URL: ${{ contains(format(' {0} ', matrix.packages), ' feature-flags ') && 'postgres://posthog:posthog@localhost:5432/posthog_persons' || '' }}
              run: |
                  for pkg in ${{ matrix.packages }}; do
                      # nextest skips doctests; run them only for packages with a lib target
                      # (`cargo test --doc` errors on bin-only packages).
                      if cargo metadata --no-deps --format-version 1 | jq -e --arg p "$pkg" '[.packages[] | select(.name == $p) | .targets[] | select(.kind | index("lib"))] | length > 0' >/dev/null; then
                          cargo test --doc -p "$pkg"
                      fi
                  done

            # Best-effort Trunk upload (continue-on-error); the "Fail on test failure" step below is
            # the verdict, so a Trunk outage can't red a passing job. Internal PRs only (needs the
            # secret).
            # TRUNK_UPLOAD_ENABLED is the master kill-switch: when it is not 'true' this gate
            # skips, so nothing uploads and no known flakes are quarantined. TRUNK_QUARANTINE_ENABLED
            # splits the two — it defaults off, so set it to 'true' to let the verdict step below mask
            # known flakes; otherwise any real failure reds the job (quarantining needs upload on too).
            - name: Quarantine gate
              id: quarantine_gate
              continue-on-error: true
              if: ${{ !cancelled() && env.RUNS_ON_INTERNAL_PR == 'true' && github.repository == 'PostHog/posthog' && github.actor != 'dependabot[bot]' && vars.TRUNK_UPLOAD_ENABLED == 'true' }}
              uses: ./.github/actions/trunk-quarantine-gate
              with:
                  junit-paths: rust/junit-nextest-*.xml
                  test-collection-id: TewkWR1w # rust
                  previous-step-outcome: ${{ steps.run-tests.outcome }}
                  token: ${{ secrets.TRUNK_API_TOKEN }}

            # Verdict: red a real failure the gate didn't clear as a quarantined flake. != 'success'
            # also covers the skipped gate on fork/Dependabot.
            - name: Fail on test failure
              if: ${{ !cancelled() && steps.run-tests.outcome == 'failure' && (vars.TRUNK_QUARANTINE_ENABLED != 'true' || steps.quarantine_gate.outcome != 'success') }}
              shell: bash
              run: exit 1

            - name: Report sccache counters
              if: always()
              continue-on-error: true
              run: |
                  if command -v sccache >/dev/null; then
                      # The full report includes the cache endpoint, so allow only numeric counters.
                      sccache --show-stats 2>/dev/null | awk '/^(Compile requests|Cache hits|Cache misses|Non-cacheable calls)[[:space:]]+[0-9]+$/ { print }'
                  fi

    linting:
        name: Lint Rust services (depot-ubuntu-22.04-4)
        needs: changes
        if: needs.changes.outputs.rust == 'true'
        runs-on: depot-ubuntu-22.04-4
        timeout-minutes: 15
        permissions:
            contents: read

        defaults:
            run:
                working-directory: rust

        steps:
            # Checkout project code
            # Use sparse checkout to only select files in rust directory
            # Turning off cone mode ensures that files in the project root are not included during checkout
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  # clippy --all-targets compiles replay-core-v4's tests, which read the encryption vectors the Node writers pin.
                  sparse-checkout: |
                      rust/
                      ingestion/rust/
                      proto/
                      ingestion/proto/
                      .github/actions/setup-protoc/
                      .github/actions/setup-rust/
                      .github/actions/setup-sccache/
                      ingestion/node/packages/ai-research/src/pipelines/ml-mirror/keys/encryption-vector*.json
                      ingestion/node/packages/ai-research/src/pipelines/ai-research/v4-keys/encryption-vector*.json
                  sparse-checkout-cone-mode: false
                  clean: false

            - name: Install system OpenSSL
              run: |
                  sudo rm -f /etc/apt/sources.list.d/*twingate*
                  sudo apt-get update
                  sudo apt-get install -y libssl-dev pkg-config

            # protoc and rustup both write $GITHUB_PATH, so they stay out of a
            # `parallel:` block. Concurrent writes crash the GitHub Actions runner
            # ("Collection was modified" or a missing-key error), and the runner
            # fails the step even though the tool installed fine.
            - name: Install protoc
              uses: ./.github/actions/setup-protoc

            - name: Install rust
              uses: ./.github/actions/setup-rust
              with:
                  toolchain: 1.91.1
                  components: clippy,rustfmt

            - name: Check format
              run: cargo fmt -- --check

            - name: Set sccache WebDAV key prefix (Cargo.lock hash)
              run: echo "SCCACHE_WEBDAV_KEY_PREFIX=cargo-${{ hashFiles('rust/Cargo.lock') }}" >> "$GITHUB_ENV"

            - name: Install sccache
              uses: ./.github/actions/setup-sccache

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
              with:
                  shared-key: 'v2-rust-ci'
                  workspaces: rust
                  save-if: ${{ github.ref == 'refs/heads/master' }}

            - name: Run clippy
              env:
                  # Use system OpenSSL instead of vendored to avoid assembly build issue (2026-01-13)
                  OPENSSL_NO_VENDOR: '1'
              run: cargo clippy --all-targets --all-features -- -D warnings

            - name: Run cargo check
              env:
                  # Use system OpenSSL instead of vendored to avoid assembly build issue (2026-01-13)
                  OPENSSL_NO_VENDOR: '1'
              run: cargo check --all-features

            - name: Install cargo-binstall
              uses: cargo-bins/cargo-binstall@5cbf019d8cb9b9d5b086218c41458ea35d817691 # main

            - name: Install cargo-shear
              # --force is required: Swatinem/rust-cache restores ~/.cargo/.crates2.json
              # (which records cargo-shear as installed) but not the binary itself, so
              # without --force binstall short-circuits ("already installed") and the
              # next step fails with `error: no such command: shear`.
              run: cargo binstall --no-confirm --force cargo-shear@1.1.12

            - name: Run cargo shear
              run: cargo shear

            - name: Report sccache counters
              if: always()
              continue-on-error: true
              run: |
                  if command -v sccache >/dev/null; then
                      # The full report includes the cache endpoint, so allow only numeric counters.
                      sccache --show-stats 2>/dev/null | awk '/^(Compile requests|Cache hits|Cache misses|Non-cacheable calls)[[:space:]]+[0-9]+$/ { print }'
                  fi

    # Collate job - single required status check for branch protection.
    # Individual jobs skip entirely when no Rust changes, saving runner time.
    rust_tests:
        needs: [changes, affected, build, test, linting]
        name: Rust Tests Pass
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        permissions: {}
        steps:
            - name: Check all Rust jobs
              run: |
                  # Fail if change detection failed, affected computation failed, or either was cancelled (outputs are empty on cancel, so the exit below would report green).
                  if [[ "${{ needs.changes.result }}" != "success" && "${{ needs.changes.result }}" != "skipped" ]]; then
                    echo "Change detection did not succeed (result: ${{ needs.changes.result }})."
                    exit 1
                  fi

                  # Pass if no Rust changes detected (jobs were skipped)
                  if [[ "${{ needs.changes.outputs.rust }}" != "true" ]]; then
                    echo "Rust checks were skipped (no relevant changes)"
                    exit 0
                  fi

                  if [[ "${{ needs.affected.result }}" != "success" && "${{ needs.affected.result }}" != "skipped" ]]; then
                    echo "Affected crate computation did not succeed (result: ${{ needs.affected.result }})."
                    exit 1
                  fi

                  if [[ "${{ needs.build.result }}" != "success" && "${{ needs.build.result }}" != "skipped" ]]; then
                    echo "Rust build failed."
                    exit 1
                  fi

                  if [[ "${{ needs.test.result }}" != "success" && "${{ needs.test.result }}" != "skipped" ]]; then
                    echo "Rust tests failed."
                    exit 1
                  fi

                  if [[ "${{ needs.linting.result }}" != "success" && "${{ needs.linting.result }}" != "skipped" ]]; then
                    echo "Rust linting failed."
                    exit 1
                  fi

                  echo "All Rust checks passed."
