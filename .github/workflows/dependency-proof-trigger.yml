name: Dependency proof trigger

# dependency-proof.yml runs on `workflow_run` after this workflow, from its default-branch copy,
# because it holds the dependency proof App key, which a `pull_request` job must never see.
# This workflow has no paths filter, so every head of every pull request gets a result.

on:
    pull_request:
        types: [opened, synchronize, reopened]

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    trigger:
        name: Request a dependency proof
        runs-on: ubuntu-24.04
        timeout-minutes: 2
        steps:
            - run: 'true'
