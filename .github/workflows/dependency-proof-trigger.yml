name: Dependency proof trigger

# This workflow exists only so that dependency-proof.yml can run on `workflow_run` for every pull
# request. That workflow runs its default-branch copy and holds the dependency proof App key, which
# a `pull_request` job must never see. This one has no paths filter, so every head of every pull
# request gets a result.

on:
    pull_request:
        types: [opened, synchronize, reopened]

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    trigger:
        name: Request a dependency proof
        runs-on: ubuntu-24.04
        timeout-minutes: 2
        steps:
            - run: 'true'
