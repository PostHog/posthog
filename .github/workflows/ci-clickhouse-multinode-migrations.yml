name: ClickHouse Multinode Migration Smoke

on:
    push:
        branches:
            - master
    pull_request:
        paths:
            - 'posthog/clickhouse/migrations/**'
            - 'posthog/settings/data_stores.py'
            - 'posthog/clickhouse/cluster.py'
            - 'posthog/clickhouse/client/migration_tools.py'
            - 'docker/clickhouse/config.d/multinode/**'
            - 'docker-compose.multinode-clickhouse.yml'
            - 'tools/infra-scripts/clickhouse-multinode/**'
            - 'posthog/clickhouse/hcl/**'
            - '.github/workflows/ci-clickhouse-multinode-migrations.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read
    # Pull the pinned hclexp image from ghcr for the live-schema convergence gate.
    packages: read
    # Download the migrated-schema artifact produced by ci-backend.yml on master.
    actions: read

jobs:
    multinode-migration-smoke:
        name: Run ClickHouse migrations against per-cluster topology
        runs-on: ubuntu-24.04
        # The common path primes Postgres from the master schema artifact. The
        # fallback applies every Django migration from scratch and grows with the
        # migration count, so the timeout is sized for the fallback. Raise it if
        # migrate keeps creeping up.
        timeout-minutes: 40
        env:
            DEBUG: '1'
            MULTINODE_CLICKHOUSE: '1'
            CLICKHOUSE_HOST: localhost
            CLICKHOUSE_MIGRATIONS_HOST: localhost
            CLICKHOUSE_DATABASE: posthog
            CLICKHOUSE_USER: default
            CLICKHOUSE_PASSWORD: ''
            CLICKHOUSE_SECURE: 'false'
            CLICKHOUSE_VERIFY: 'false'
            DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/posthog'
            REDIS_URL: 'redis://localhost'
            # unsafe - for testing only
            SECRET_KEY: '6b01eee4f945ca25045b5aab440b953461faf08693a9abbf1166dc7c6b9772da'
            # PostHogConfig.ready() calls setup_async_migrations() which reads
            # posthog_asyncmigration / posthog_instancesetting. Skip it so the
            # smoke can run against a schema-only Postgres dump.
            SKIP_ASYNC_MIGRATIONS_SETUP: '1'
            # If the "Fetch master schema dump" step below succeeds, this file
            # exists and the smoke script primes Postgres from it instead of
            # running a full `manage.py migrate`. No artifact → file absent →
            # script falls back to migrate automatically.
            PRIME_POSTGRES_FROM: schema.sql.gz
            # The chschema build used by the live-schema convergence gate is pinned in
            # posthog/clickhouse/hcl/bin/image.txt; the repo variable overrides it when set.
            HCLEXP_IMAGE: ${{ vars.HCLEXP_IMAGE }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Add multinode hostnames to /etc/hosts
              run: |
                  echo "127.0.0.1 clickhouse-data clickhouse-ai-events clickhouse-aux clickhouse-ops clickhouse-sessions clickhouse-logs clickhouse-ingestion-events clickhouse-ingestion-small clickhouse-ingestion-medium kafka zookeeper" | sudo tee -a /etc/hosts

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: 3.13.13

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28'
                  enable-cache: true
                  cache-dependency-glob: uv.lock

            - name: Install Python dependencies
              run: UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev

            - name: Fetch master schema dump
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # ci-backend.yml's "Validate migrations" job uploads the post-migrate
                  # schema as the migrated-schema artifact on every master push, held
                  # for the retention-days set on that upload step. The scan below stays
                  # well inside that window because master pushes are far more frequent.
                  # The Actions cache also holds it, but the repo's 10 GB LRU pool evicts
                  # the dump within minutes, so the artifact is the reliable source. Any
                  # recent master schema works, because the smoke only needs Postgres
                  # bootable and migrate_clickhouse doesn't touch it.
                  # Resolve the artifact through successful master runs of
                  # ci-backend.yml rather than the repo-wide artifact list, so only
                  # that workflow's uploads are ever trusted. Paths-filtered master
                  # pushes can succeed without producing the artifact, hence the scan.
                  # Any failure here degrades to the full-migrate fallback in the
                  # smoke script (PRIME_POSTGRES_FROM stays absent).
                  RUN_IDS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci-backend.yml/runs?branch=master&event=push&status=success&per_page=10" \
                      --jq '.workflow_runs[].id' || true)
                  ARTIFACT_ID=""
                  for RUN_ID in $RUN_IDS; do
                      ARTIFACT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?name=migrated-schema" \
                          --jq '[.artifacts[] | select(.expired | not)][0].id // empty' || true)
                      if [ -n "$ARTIFACT_ID" ]; then
                          echo "using migrated-schema artifact ${ARTIFACT_ID} from master run ${RUN_ID}"
                          break
                      fi
                  done
                  if [ -z "$ARTIFACT_ID" ]; then
                      echo "::warning::no migrated-schema artifact in recent successful master ci-backend runs; falling back to full migrate"
                      exit 0
                  fi
                  if ! { gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > migrated-schema.zip \
                      && unzip -o migrated-schema.zip schema.sql.gz \
                      && gunzip -t schema.sql.gz; }; then
                      echo "::warning::migrated-schema artifact ${ARTIFACT_ID} unusable; falling back to full migrate"
                      rm -f schema.sql.gz
                  fi

            - name: Log in to ghcr.io
              uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Install hclexp
              run: bash posthog/clickhouse/hcl/bin/install-hclexp

            - name: Run smoke test
              run: tools/infra-scripts/clickhouse-multinode/multinode-migration-smoke

            - name: Dump compose logs on failure
              if: failure()
              run: |
                  docker compose -f docker-compose.multinode-clickhouse.yml logs --no-color > multinode-compose.log || true

            - name: Upload compose logs on failure
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: multinode-compose-logs
                  path: multinode-compose.log
                  if-no-files-found: ignore
