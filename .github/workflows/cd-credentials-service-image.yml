name: Credentials Service Container Image CD

on:
    push:
        branches:
            - master
        paths:
            - 'services/credentials-service/**'
            - '.github/workflows/cd-credentials-service-image.yml'
    workflow_dispatch:

jobs:
    build:
        name: Build and push container image
        if: |
            github.repository_owner == 'PostHog' && vars.CD_DEPLOY_ENABLED == 'true' && (
                github.event_name == 'push' ||
                github.event_name == 'workflow_dispatch'
            )
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
            id-token: write

        outputs:
            sha: ${{ steps.push.outputs.digest }}

        steps:
            - name: Check out
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 2

            - name: Docker meta and registry login
              id: docker-meta
              uses: ./.github/actions/docker-meta
              with:
                  image-name: posthog-credentials-service
                  # Publishes only from the default branch — assume the role and touch ECR only there
                  # (a non-default-branch workflow_dispatch builds nothing to push).
                  aws-role-to-assume: ${{ vars.AWS_ECR_POSTHOG_MASTER_PUBLISH_IAM_ROLE }}
                  push-to-ecr: ${{ github.ref == 'refs/heads/master' }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  dockerhub-username: ${{ secrets.DOCKERHUB_USER }}
                  dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
                  push-to-dockerhub: 'false'
                  push-to-ghcr: ${{ vars.PUBLIC_IMAGE_PUSH_PAUSED != 'true' }}

            - name: Set up Depot CLI
              uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1

            - name: Build and push container image
              id: push
              uses: depot/build-push-action@5f3b3c2e5a00f0093de47f657aeaefcedff27d18 # v1.17.0
              with:
                  project: 3nsbp7m1b2 # credentials-service
                  file: ./services/credentials-service/Dockerfile
                  buildx-fallback: false
                  push: ${{ github.ref == 'refs/heads/master' }}
                  tags: ${{ steps.docker-meta.outputs.tags }}
                  labels: ${{ steps.docker-meta.outputs.labels }}
                  annotations: ${{ steps.docker-meta.outputs.annotations }}
                  platforms: linux/arm64,linux/amd64
                  build-args: COMMIT_HASH=${{ github.sha }}

    ordered_image_alias:
        name: Publish ordered image alias
        needs: build
        # Kargo promotes images by this tag (^r[0-9]{12}-[0-9a-f]{6}$). Best effort:
        # a missing alias delays Kargo for that build and never fails the deploy.
        if: ${{ needs.build.result == 'success' && github.repository_owner == 'PostHog' && vars.CD_DEPLOY_ENABLED == 'true' && vars.ORDERED_IMAGE_ALIAS_PAUSED != 'true' && github.ref == 'refs/heads/master' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        continue-on-error: true
        permissions:
            contents: read
            packages: write
            id-token: write

        steps:
            - name: Check out
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Compute ordered release tag
              id: ordered-release
              timeout-minutes: 2
              shell: bash
              env:
                  ORDERED_RELEASE_TAG_REGEX: ^r[0-9]{12}-[0-9a-f]{6}$
              run: |
                  set -uo pipefail

                  if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
                      fetch_status=0
                      timeout --kill-after=10s 90s git fetch \
                          --no-tags \
                          --prune \
                          --no-recurse-submodules \
                          --unshallow \
                          --filter=tree:0 \
                          origin \
                          "+${GITHUB_REF}:refs/remotes/origin/${GITHUB_REF_NAME}" || fetch_status=$?
                      if [ "$fetch_status" -ne 0 ]; then
                          echo "::warning title=Ordered release tag skipped::Source history could not be fetched (status $fetch_status)."
                          exit 0
                      fi
                  fi

                  if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" != "false" ]; then
                      echo "::warning title=Ordered release tag skipped::Complete source history is unavailable."
                      exit 0
                  fi

                  if ! head_revision="$(git rev-parse HEAD)" || [ "$head_revision" != "$GITHUB_SHA" ]; then
                      echo "::warning title=Ordered release tag skipped::The checked-out revision does not match GITHUB_SHA."
                      exit 0
                  fi

                  if ! position="$(git rev-list --first-parent --count "$GITHUB_SHA")"; then
                      echo "::warning title=Ordered release tag skipped::The source position could not be computed."
                      exit 0
                  fi

                  if ! [[ "$position" =~ ^[1-9][0-9]{0,11}$ ]]; then
                      echo "::warning title=Ordered release tag skipped::The source position is out of range."
                      exit 0
                  fi

                  if ! printf -v tag 'r%012d-%.6s' "$position" "$GITHUB_SHA"; then
                      echo "::warning title=Ordered release tag skipped::The source position could not be formatted."
                      exit 0
                  fi

                  if ! [[ "$tag" =~ $ORDERED_RELEASE_TAG_REGEX ]]; then
                      echo "::warning title=Ordered release tag skipped::${tag} does not match the required format."
                      exit 0
                  fi

                  echo "tag=${tag}" >> "$GITHUB_OUTPUT"

            - name: Warn when ordered image alias tag is unavailable
              if: ${{ steps.ordered-release.outputs.tag == '' }}
              shell: bash
              run: echo "::warning title=Ordered image alias tag unavailable::Ordered image alias publication was skipped because no ordered release tag was generated."

            - name: Set up Docker Buildx for ordered image alias
              if: ${{ steps.ordered-release.outputs.tag != '' }}
              uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

            - name: Login to ghcr.io
              if: ${{ steps.ordered-release.outputs.tag != '' && vars.PUBLIC_IMAGE_PUSH_PAUSED != 'true' }}
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Configure AWS credentials for ordered image alias
              if: ${{ steps.ordered-release.outputs.tag != '' }}
              continue-on-error: true
              uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
              with:
                  role-to-assume: ${{ vars.AWS_ECR_POSTHOG_MASTER_PUBLISH_IAM_ROLE }}
                  aws-region: us-east-1

            - name: Log in to Amazon ECR for ordered image alias
              if: ${{ steps.ordered-release.outputs.tag != '' }}
              continue-on-error: true
              id: ecr-login
              uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78 # v2.1.2

            - name: Publish and reconcile ordered image alias
              if: ${{ steps.ordered-release.outputs.tag != '' }}
              timeout-minutes: 8
              shell: bash
              env:
                  GHCR_IMAGE: ghcr.io/posthog/posthog-credentials-service
                  PUBLIC_IMAGE_PUSH_PAUSED: ${{ vars.PUBLIC_IMAGE_PUSH_PAUSED }}
                  ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
                  DIGEST: ${{ needs.build.outputs.sha }}
                  ORDERED_ALIAS: ${{ steps.ordered-release.outputs.tag }}
              # Read the alias before publishing, accept it when it already resolves to this
              # build, and never move it when it resolves elsewhere. Kargo caches the alias
              # as immutable, and a rebuild at the same commit can yield a new index digest.
              run: |
                  set -uo pipefail

                  if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                      echo "::warning title=Ordered image alias skipped::No image digest was resolved for this build."
                      exit 0
                  fi

                  inspect_digest() {
                      local output
                      output="$(timeout --kill-after=10s 20s docker buildx imagetools inspect \
                          --format '{{json .Manifest.Digest}}' "$1" 2>/dev/null)" || return $?
                      [[ "$output" =~ ^\"(sha256:[0-9a-f]{64})\"$ ]] || return 65
                      printf '%s\n' "${BASH_REMATCH[1]}"
                  }

                  # present-at-expected-digest | integrity-mismatch | absent | unknown
                  classify_alias() {
                      local observed
                      if observed="$(inspect_digest "$TARGET_IMAGE")" || observed="$(inspect_digest "$TARGET_IMAGE")"; then
                          if [ "$observed" = "$DIGEST" ]; then echo present-at-expected-digest; else echo integrity-mismatch; fi
                      elif inspect_digest "$SOURCE_IMAGE" >/dev/null; then
                          echo absent
                      else
                          echo unknown
                      fi
                  }

                  publish_alias() {
                      SOURCE_IMAGE="${1}@${DIGEST}"
                      TARGET_IMAGE="${1}:${ORDERED_ALIAS}"

                      state="$(classify_alias)"
                      if [ "$state" = "absent" ]; then
                          # --prefer-index=false re-tags the existing index by digest, so the
                          # alias resolves to the same digest and keeps its annotations.
                          timeout --kill-after=10s 35s docker buildx imagetools create \
                              --prefer-index=false \
                              --tag "$TARGET_IMAGE" \
                              "$SOURCE_IMAGE" >&2 || echo "::warning::Alias publication client exited $?"
                          state="$(classify_alias)"
                      fi

                      case "$state" in
                          present-at-expected-digest)
                              echo "::notice title=Ordered image alias present::${TARGET_IMAGE} resolves to ${DIGEST}."
                              ;;
                          integrity-mismatch)
                              echo "::error title=Ordered image alias integrity mismatch::${TARGET_IMAGE} resolves to a different digest; left untouched."
                              return 1
                              ;;
                          absent)
                              echo "::warning title=Ordered image alias absent::${TARGET_IMAGE} is absent after publication."
                              return 1
                              ;;
                          *)
                              echo "::error title=Ordered image alias read-back unavailable::${TARGET_IMAGE} could not be read back."
                              return 1
                              ;;
                      esac
                  }

                  status=0
                  if [ "$PUBLIC_IMAGE_PUSH_PAUSED" = "true" ]; then
                      echo "::notice title=Ordered image alias skipped on ghcr::PUBLIC_IMAGE_PUSH_PAUSED is set, so only ECR gets the alias."
                  else
                      publish_alias "$GHCR_IMAGE" || status=1
                  fi
                  if [ -n "$ECR_REGISTRY" ]; then
                      publish_alias "${ECR_REGISTRY}/posthog-credentials-service" || status=1
                  else
                      echo "::warning title=Ordered image alias destination unavailable::The ECR registry resolved empty, so the ECR alias was skipped."
                      status=1
                  fi
                  exit "$status"

    deploy:
        name: Trigger credentials-service deployment
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        needs: build
        if: github.ref == 'refs/heads/master'
        permissions: {}

        steps:
            - name: Get deployer token
              id: deployer
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_CHARTS_DEPLOYER_APP_ID }}
                  private-key: ${{ secrets.GH_APP_CHARTS_DEPLOYER_PRIVATE_KEY }}
                  owner: PostHog
                  repositories: charts

            - name: Get PR labels
              id: labels
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
              with:
                  retries: 3
                  script: |
                      try {
                        const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                          owner: 'PostHog',
                          repo: 'posthog',
                          commit_sha: context.sha,
                        });
                        const labels = pulls.flatMap(pr => pr.labels.map(l => l.name));
                        return JSON.stringify([...new Set(labels)]);
                      } catch (error) {
                        if (error.status !== 404 && error.status !== 422) throw error;
                        core.notice(`${context.sha} is not a PostHog/posthog commit, so it has no PR labels.`);
                        return '[]';
                      }

            - name: Trigger credentials-service deployment
              uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
              with:
                  token: ${{ steps.deployer.outputs.token }}
                  repository: PostHog/charts
                  event-type: commit_state_update
                  client-payload: |
                      {
                        "values": {
                          "image": {
                            "sha": "${{ needs.build.outputs.sha }}"
                          }
                        },
                        "release": "credentials-service",
                        "commit": ${{ toJson(github.event.head_commit) }},
                        "repository": "PostHog/posthog",
                        "labels": ${{ steps.labels.outputs.result }},
                        "timestamp": "${{ github.event.head_commit.timestamp }}"
                      }
