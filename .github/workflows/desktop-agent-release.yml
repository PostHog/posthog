name: Desktop Agent Release

on:
    push:
        tags:
            - 'agent-v*'

concurrency:
    group: desktop-agent-release
    cancel-in-progress: false

env:
    SLACK_CHANNEL: 'C0C3FBES5ST'
    # npm's audit blocks the pnpm bootstrap. See .github/actions/pnpm-install for why.
    NPM_CONFIG_AUDIT: 'false'
    NPM_CONFIG_FUND: 'false'

jobs:
    release:
        name: Publish agent to npm
        # npm provenance requires a github-hosted runner; Depot registers as self-hosted
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        environment: npm-posthog-agent
        permissions:
            contents: read
            id-token: write
        outputs:
            version: ${{ steps.version.outputs.version }}
        defaults:
            run:
                working-directory: products/desktop
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  package_json_file: products/desktop/package.json

            - name: Set up Node 24
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  package-manager-cache: false

            - name: Extract version from tag
              id: version
              run: |
                  TAG_VERSION="${GITHUB_REF#refs/tags/agent-v}"
                  echo "Version: $TAG_VERSION"
                  echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

            - name: Set version in package.json
              env:
                  APP_VERSION: ${{ steps.version.outputs.version }}
              run: |
                  jq --arg v "$APP_VERSION" '.version = $v' packages/agent/package.json > tmp.json && mv tmp.json packages/agent/package.json
                  echo "Set packages/agent/package.json version to $APP_VERSION"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build and test agent release
              uses: ./.github/actions/desktop-build-agent-release

            - name: Publish the package to npm registry
              working-directory: products/desktop/packages/agent
              run: pnpm publish --access public --no-git-checks
              env:
                  NPM_CONFIG_PROVENANCE: true

    # hogli-lint: not-a-required-gate -- reads the release result only to report it in Slack
    notify-release:
        name: Post the release to Slack
        needs: release
        if: ${{ !cancelled() }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            actions: read
        outputs:
            thread_ts: ${{ steps.slack.outputs.ts }}
        steps:
            - name: Describe the release
              id: meta
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  RUN_ID: ${{ github.run_id }}
                  RESULT: ${{ needs.release.result }}
                  TAG: ${{ github.ref_name }}
                  SHA: ${{ github.sha }}
              run: |
                  started=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" --jq .run_started_at 2>/dev/null || true)
                  if [ -n "$started" ]; then
                    elapsed=$(( $(date +%s) - $(date -d "$started" +%s) ))
                    duration="$((elapsed / 60))m $((elapsed % 60))s"
                  else
                    duration="Unknown"
                  fi
                  if [ "$RESULT" = "success" ]; then
                    emoji=":white_check_mark:"
                    status="Published to npm"
                  else
                    emoji=":red_circle:"
                    status="Release ${RESULT}"
                  fi
                  {
                    echo "version=${TAG#agent-v}"
                    echo "emoji=$emoji"
                    echo "status=$status"
                    echo "duration=$duration"
                    echo "commit=${SHA:0:7} (${TAG})"
                  } >> "$GITHUB_OUTPUT"

            - name: Post to Slack
              id: slack
              # Slack is a courtesy: a failed post must not stop the pin bump below.
              continue-on-error: true
              uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
              with:
                  method: chat.postMessage
                  token: ${{ secrets.SLACK_DEVEX_BOT_TOKEN }}
                  errors: true
                  payload: |
                      channel: "${{ env.SLACK_CHANNEL }}"
                      text: "${{ steps.meta.outputs.emoji }} @posthog/agent ${{ steps.meta.outputs.version }}: ${{ steps.meta.outputs.status }}"
                      unfurl_links: false
                      blocks:
                        - type: "section"
                          text:
                            type: "mrkdwn"
                            text: "${{ steps.meta.outputs.emoji }} *<https://www.npmjs.com/package/@posthog/agent/v/${{ steps.meta.outputs.version }}|@posthog/agent ${{ steps.meta.outputs.version }}>*"
                        - type: "section"
                          fields:
                            - type: "mrkdwn"
                              text: "*Status*\n${{ steps.meta.outputs.status }}"
                            - type: "mrkdwn"
                              text: "*Commit*\n`${{ steps.meta.outputs.commit }}`"
                            - type: "mrkdwn"
                              text: "*Duration*\n${{ steps.meta.outputs.duration }}"
                            - type: "mrkdwn"
                              text: "*Run*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Desktop Agent Release #${{ github.run_number }}>"

    bump-sandbox-agent-pin:
        name: Open a PR bumping the sandbox agent pin
        needs: [release, notify-release]
        # notify-release runs on !cancelled(), so this job restates the release gate it used to inherit.
        if: ${{ !cancelled() && needs.release.result == 'success' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: read
            actions: write
        steps:
            - name: Dispatch the agent version bump
              env:
                  GH_TOKEN: ${{ github.token }}
                  AGENT_VERSION: ${{ needs.release.outputs.version }}
                  SLACK_THREAD_TS: ${{ needs.notify-release.outputs.thread_ts }}
              run: |
                  echo "Dispatching sandbox agent pin bump to $AGENT_VERSION"
                  gh workflow run update-sandbox-agent-version.yml \
                    --repo PostHog/posthog \
                    --ref master \
                    -f version="$AGENT_VERSION" \
                    -f slack_thread_ts="$SLACK_THREAD_TS"
