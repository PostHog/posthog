name: Build and deploy rust container images

# Production build + deploy for Rust services on master.
# Uses selective builds: only images affected by changed files are built and deployed.
# workflow_dispatch always builds all images (escape hatch).
#
# Image list: .github/rust-images.yml
# Build steps: .github/workflows/_rust-build-images.yml
# Affected-set computation: rust/affected-services (Rust binary crate)

on:
    workflow_dispatch:
    push:
        paths:
            - 'rust/**'
            - 'proto/**'
            - '.github/workflows/rust-docker-build.yml'
            - '.github/workflows/_rust-build-images.yml'
            - '.github/rust-images.yml'
        branches:
            - 'master'
    pull_request:
        paths:
            - 'rust/**'
            - 'proto/**'
            - '.github/workflows/rust-docker-build.yml'
            - '.github/workflows/_rust-build-images.yml'
            - '.github/rust-images.yml'
        branches:
            - 'master'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    affected:
        name: compute affected images
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        # Skip on workflow_dispatch — always build everything (escape hatch)
        # Skipped on trunk-merge/** branches: merge-queue PRs are ephemeral, nothing
        # pulls images pushed for them, and each constituent PR already built its own.
        if: >-
            github.event_name != 'workflow_dispatch' &&
            !startsWith(github.head_ref, 'trunk-merge/') &&
            (github.event_name != 'pull_request' ||
             github.event.pull_request.head.repo.full_name == github.repository)
        permissions:
            contents: read
        outputs:
            image-filter: ${{ steps.compute.outputs.images }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  sparse-checkout: |
                      rust/
                      proto/
                      .github/rust-images.yml
                      .github/actions/rust-compute-affected/
                  sparse-checkout-cone-mode: false
                  clean: false

            - name: Install rust
              uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
              with:
                  toolchain: 1.91.1

            - name: Compute affected images
              id: compute
              uses: ./.github/actions/rust-compute-affected
              with:
                  event-name: ${{ github.event_name }}
                  pr-base-sha: ${{ github.event.pull_request.base.sha }}
                  push-before-sha: ${{ github.event.before }}

    build-images:
        needs: affected
        # A status function is required because 'affected' may be skipped (workflow_dispatch)
        # and a skipped need would otherwise cascade a skip here. !cancelled() covers that
        # while still stopping the build after manual workflow cancellation.
        # Run unless affected explicitly found zero images ('none') or failed.
        # The trunk-merge guard is repeated here because a skipped 'affected' leaves
        # image-filter empty, which this condition would otherwise treat as buildable.
        if: |
            !cancelled() &&
            !startsWith(github.head_ref, 'trunk-merge/') &&
            (github.event_name != 'pull_request' ||
             github.event.pull_request.head.repo.full_name == github.repository) &&
            needs.affected.result != 'failure' &&
            needs.affected.outputs.image-filter != 'none'
        uses: ./.github/workflows/_rust-build-images.yml
        with:
            # Only the canonical deploy repo pushes prod images on master; PRs still push for validation.
            push: ${{ github.event_name == 'pull_request' || vars.CD_DEPLOY_ENABLED == 'true' }}
            image-filter: ${{ needs.affected.outputs.image-filter || '' }}
            tag-rules: |
                type=ref,event=pr
                type=ref,event=branch
                type=semver,pattern={{version}}
                type=semver,pattern={{major}}.{{minor}}
                type=sha
            timeout-minutes: 30
        secrets:
            POSTHOG_API_TOKEN: ${{ secrets.POSTHOG_API_TOKEN }}
            POSTHOG_DEVEX_PROJECT_API_TOKEN: ${{ secrets.POSTHOG_DEVEX_PROJECT_API_TOKEN }}
            # Deliberately reuses the frontend sourcemap upload key: sourcemaps and
            # native symbols go through the same symbol-set upload API on the same
            # internal project, so there is no separate org secret to create.
            # Rotating POSTHOG_UPLOAD_SOURCEMAPS_CLI_API_KEY affects both uploads.
            POSTHOG_UPLOAD_SYMBOLS_CLI_API_KEY: ${{ secrets.POSTHOG_UPLOAD_SOURCEMAPS_CLI_API_KEY }}
        permissions:
            id-token: write
            contents: read
            packages: write

    deploy:
        name: deploy ${{ matrix.release }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        needs: build-images
        if: github.repository_owner == 'PostHog' && vars.CD_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/master'
        strategy:
            # fail-fast false so one missing digest doesn't cancel other deploys
            fail-fast: false
            matrix:
                include:
                    - release: capture
                      digest_key: capture
                      values_key: image
                    - release: capture-replay
                      digest_key: capture
                      values_key: image
                    - release: property-defs-rs
                      digest_key: property-defs-rs
                      values_key: image
                    - release: property-vals-rs
                      digest_key: property-vals-rs
                      values_key: image
                    - release: feature-flags
                      digest_key: feature-flags
                      values_key: image
                    - release: flags-cache-jumphost
                      digest_key: flags-cache-warmer
                      values_key: image
                    - release: flags-cache-builder
                      digest_key: flags-cache-builder
                      values_key: image
                    - release: flags-consumer
                      digest_key: flags-consumer
                      values_key: image
                    - release: cohort-event-shuffler
                      digest_key: cohort-event-shuffler
                      values_key: image
                    - release: cohort-seeder
                      digest_key: cohort-seeder
                      values_key: image
                    - release: cohort-stream-processor
                      digest_key: cohort-stream-processor
                      values_key: image
                    - release: batch-import-worker
                      digest_key: batch-import-worker
                      values_key: image
                    - release: cymbal
                      digest_key: cymbal
                      values_key: image
                    - release: embedding-worker
                      digest_key: embedding-worker
                      values_key: image
                    - release: capture-logs
                      digest_key: capture-logs
                      values_key: image
                    - release: ingestion-consumer
                      digest_key: ingestion-consumer
                      values_key: image
                    - release: ingestion-control-plane
                      digest_key: ingestion-control-plane
                      values_key: image
                    - release: pgcollector
                      digest_key: pgcollector
                      values_key: image
                    - release: pgapi
                      digest_key: pgapi
                      values_key: image
                    - release: kafka-deduplicator
                      digest_key: kafka-deduplicator
                      values_key: image
                    - release: sqlx-migrate
                      digest_key: sqlx-migrate
                      values_key: image
                    - release: personhog-identity
                      digest_key: personhog-identity
                      values_key: image
                    - release: personhog-leader
                      digest_key: personhog-leader
                      values_key: image
                    - release: personhog-replica
                      digest_key: personhog-replica
                      values_key: image
                    - release: personhog-router
                      digest_key: personhog-router
                      values_key: image
                    - release: personhog-writer
                      digest_key: personhog-writer
                      values_key: image
                    - release: personhog-test-harness
                      digest_key: personhog-test-harness
                      values_key: image
                    - release: kafka-assigner
                      digest_key: kafka-assigner
                      values_key: image
                    - release: hypercache-server
                      digest_key: hypercache-server
                      values_key: image
                    - release: usage-ingestion
                      digest_key: usage-ingestion
                      values_key: image
        steps:
            - name: check if image was built
              id: check
              env:
                  DIGESTS: ${{ needs.build-images.outputs.digests }}
                  KEY: ${{ matrix.digest_key }}
              run: |
                  digest=$(echo "$DIGESTS" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('$KEY',''))")
                  if [ -n "$digest" ]; then
                      echo "skip=false" >> "$GITHUB_OUTPUT"
                      echo "digest=$digest" >> "$GITHUB_OUTPUT"
                  else
                      echo "Skipping ${{ matrix.release }} — image not in this build"
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: get deployer token
              if: steps.check.outputs.skip != 'true'
              id: deployer
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_CHARTS_DEPLOYER_APP_ID }}
                  private-key: ${{ secrets.GH_APP_CHARTS_DEPLOYER_PRIVATE_KEY }}
                  owner: PostHog
                  repositories: charts

            - name: trigger ${{ matrix.release }} deployment
              if: steps.check.outputs.skip != 'true'
              uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
              with:
                  token: ${{ steps.deployer.outputs.token }}
                  repository: PostHog/charts
                  event-type: commit_state_update
                  client-payload: |
                      {
                        "values": {"${{ matrix.values_key }}": {"sha": "${{ steps.check.outputs.digest }}"}},
                        "release": "${{ matrix.release }}",
                        "commit": ${{ toJson(github.event.head_commit) }},
                        "repository": ${{ toJson(github.repository) }},
                        "labels": [],
                        "timestamp": "${{ github.event.head_commit.timestamp }}"
                      }

    ordered_image_alias:
        name: publish ordered image aliases
        needs: build-images
        # Freight cadence v2 sorts releases by this tag, so every deployable rust image
        # gets one. Mirrors the posthog_build alias job in container-images-cd.yml,
        # against ghcr instead of ECR. Best effort: a missing alias delays Freight for
        # that build and never fails the deploy.
        if: ${{ needs.build-images.result == 'success' && needs.build-images.outputs.digests != '' && github.repository_owner == 'PostHog' && vars.CD_DEPLOY_ENABLED == 'true' && vars.ORDERED_IMAGE_ALIAS_PAUSED != 'true' && github.ref == 'refs/heads/master' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        continue-on-error: true
        permissions:
            contents: read
            packages: write

        steps:
            - name: Check out
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Compute ordered release tag
              id: ordered-release
              timeout-minutes: 2
              shell: bash
              env:
                  ORDERED_RELEASE_TAG_REGEX: ^r[0-9]{12}-[0-9a-f]{6}$
              run: |
                  set -uo pipefail

                  if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
                      fetch_status=0
                      timeout --kill-after=10s 90s git fetch \
                          --no-tags \
                          --prune \
                          --no-recurse-submodules \
                          --unshallow \
                          --filter=tree:0 \
                          origin \
                          "+${GITHUB_REF}:refs/remotes/origin/${GITHUB_REF_NAME}" || fetch_status=$?
                      if [ "$fetch_status" -ne 0 ]; then
                          echo "::warning title=Ordered release tag skipped::Source history could not be fetched (status $fetch_status)."
                          exit 0
                      fi
                  fi

                  if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" != "false" ]; then
                      echo "::warning title=Ordered release tag skipped::Complete source history is unavailable."
                      exit 0
                  fi

                  if ! head_revision="$(git rev-parse HEAD)" || [ "$head_revision" != "$GITHUB_SHA" ]; then
                      echo "::warning title=Ordered release tag skipped::The checked-out revision does not match GITHUB_SHA."
                      exit 0
                  fi

                  if ! position="$(git rev-list --first-parent --count "$GITHUB_SHA")"; then
                      echo "::warning title=Ordered release tag skipped::The source position could not be computed."
                      exit 0
                  fi

                  if ! [[ "$position" =~ ^[1-9][0-9]{0,11}$ ]]; then
                      echo "::warning title=Ordered release tag skipped::The source position is out of range."
                      exit 0
                  fi

                  if ! printf -v tag 'r%012d-%.6s' "$position" "$GITHUB_SHA"; then
                      echo "::warning title=Ordered release tag skipped::The source position could not be formatted."
                      exit 0
                  fi

                  if ! [[ "$tag" =~ $ORDERED_RELEASE_TAG_REGEX ]]; then
                      echo "::warning title=Ordered release tag skipped::${tag} does not match the required format."
                      exit 0
                  fi

                  echo "tag=${tag}" >> "$GITHUB_OUTPUT"

            - name: Warn when ordered image alias tag is unavailable
              if: ${{ steps.ordered-release.outputs.tag == '' }}
              shell: bash
              run: echo "::warning title=Ordered image alias tag unavailable::Ordered image alias publication was skipped because no ordered release tag was generated."

            - name: Set up Docker Buildx for ordered image aliases
              if: ${{ steps.ordered-release.outputs.tag != '' }}
              uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

            - name: Login to ghcr.io
              if: ${{ steps.ordered-release.outputs.tag != '' }}
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish and read back ordered image aliases
              if: ${{ steps.ordered-release.outputs.tag != '' }}
              timeout-minutes: 5
              shell: bash
              env:
                  DIGESTS: ${{ needs.build-images.outputs.digests }}
                  ORDERED_ALIAS: ${{ steps.ordered-release.outputs.tag }}
                  REGISTRY: ghcr.io/posthog/posthog
              run: |
                  set -uo pipefail
                  failures=0
                  while IFS=$'\t' read -r image digest; do
                      if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                          echo "::warning title=Ordered image alias skipped::${image}: no digest was resolved for this build."
                          continue
                      fi
                      source_image="${REGISTRY}/${image}@${digest}"
                      target_image="${REGISTRY}/${image}:${ORDERED_ALIAS}"
                      # --prefer-index=false re-tags the existing index by digest, so the
                      # alias resolves to the same digest and keeps its annotations.
                      if ! timeout --kill-after=5s 40s docker buildx imagetools create \
                          --prefer-index=false \
                          --tag "$target_image" \
                          "$source_image"; then
                          echo "::warning title=Ordered image alias publication failed::${image}: publication of ${ORDERED_ALIAS} did not succeed."
                          failures=$((failures + 1))
                          continue
                      fi
                      resolved="$(timeout --kill-after=5s 40s docker buildx imagetools inspect \
                          --format '{{.Manifest.Digest}}' "$target_image" 2>/dev/null || true)"
                      if [ "$resolved" = "$digest" ]; then
                          echo "::notice title=Ordered image alias present::${image}:${ORDERED_ALIAS} resolves to ${digest}."
                      elif [ -z "$resolved" ]; then
                          echo "::error title=Ordered image alias read-back unavailable::${image}:${ORDERED_ALIAS} could not be read back from ghcr."
                          failures=$((failures + 1))
                      else
                          echo "::error title=Ordered image alias integrity mismatch::${image}:${ORDERED_ALIAS} resolves to ${resolved}, expected ${digest}."
                          failures=$((failures + 1))
                      fi
                  done < <(echo "$DIGESTS" | jq -r 'to_entries[] | "\(.key)\t\(.value)"')
                  if [ "$failures" -gt 0 ]; then
                      exit 1
                  fi
