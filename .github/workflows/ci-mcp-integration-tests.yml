name: MCP Integration Tests

# The MCP integration-tests job, extracted so ci-mcp.yml can run it twice:
# attempt 1 always, and a retry attempt on a fresh runner only when attempt 1
# failed BEFORE its tests started (see the tests-started output below). A
# failure before the test step is setup/infra by construction — a Docker port
# bind lost to an ephemeral socket, a dead runner (which leaves no outputs at
# all, so it lands in the retry branch too), a registry timeout. The `MCP
# Tests Pass` gate accepts a green retry, so the merge queue never sees a red
# required check for a first infra failure. A failure during the tests
# themselves is real and reds immediately, with no retry.
#
# workflow_call shares the caller's run dispatch, so this costs nothing
# against the repo's 500-runs/10s dispatch budget.

on:
    workflow_call:
        outputs:
            tests-started:
                description: '"true" once the job reached its test step; empty when it died during setup or the runner was lost'
                value: ${{ jobs.tests.outputs.tests-started }}

permissions:
    contents: read

env:
    # Manual cache-bust knob. Keep in sync with SCHEMA_CACHE_EPOCH in ci-backend.yml, which saves these caches on master pushes.
    SCHEMA_CACHE_EPOCH: v2
    RUNS_ON_INTERNAL_PR: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}

jobs:
    tests:
        name: Tests
        runs-on: depot-ubuntu-24.04-4
        # Sized for a schema-cache miss (full migrate from scratch), not just a hit.
        timeout-minutes: 45
        outputs:
            tests-started: ${{ steps.mark-tests-started.outputs.started }}
        env:
            DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USER }}
            DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
            OPT_OUT_CAPTURE: 1
            SECRET_KEY: '6b01eee4f945ca25045b5aab440b953461faf08693a9abbf1166dc7c6b9772da'
            DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/posthog'
            PERSONS_DB_WRITER_URL: 'postgres://posthog:posthog@localhost:5432/posthog_persons'
            PERSONHOG_ADDR: 'localhost:50052'
            POSTHOG_PERSONS_DB_NAME: 'posthog_persons'
            REDIS_URL: 'redis://localhost'
            CLICKHOUSE_HOST: 'localhost'
            CLICKHOUSE_SECURE: 'False'
            CLICKHOUSE_VERIFY: 'False'
            OBJECT_STORAGE_ENABLED: 'True'
            OBJECT_STORAGE_ENDPOINT: 'http://localhost:19000'
            OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'
            SKIP_SERVICE_VERSION_REQUIREMENTS: 1
            NO_RESTART_LOOP: 1
            DISABLE_SECURE_SSL_REDIRECT: 'True'
            CLICKHOUSE_LOGS_CLUSTER_SECURE: 'False'
            CELERY_METRICS_PORT: 8999
            POSTHOG_FEATURE_FLAGS_FORCE_ENABLED: 'logs-alerting,dashboard-widgets,product-business-knowledge,billing-alerts'
            # Required for the feature_flags test_evaluation endpoint, which authenticates
            # historical-flag override requests to the Rust flags service. Any non-empty
            # value is fine for CI — the Rust service in the test stack accepts it.
            INTERNAL_REQUEST_TOKEN: 'mcp-ci-internal-request-token'
            # Internal API auth needs a non-empty INTERNAL_API_SECRET when DEBUG/TEST are off, and
            # this job boots the app prod-like. The dev value is fine for CI.
            INTERNAL_API_SECRET: 'posthog123'

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  # Deep clone so we can compute the merge-base with the PR base ref
                  # for the schema cache key (matches ci-backend.yml's turbo-discover).
                  fetch-depth: 1000
                  filter: blob:none

            - name: Clean up data directories with container permissions
              run: |
                  [ -d "data" ] && docker run --rm -v "$(pwd)/data:/data" alpine sh -c "rm -rf /data/seaweedfs /data/minio" || true
              continue-on-error: true

            - name: Pull Docker images
              shell: bash
              env:
                  COMPOSE_PROFILES: temporal
              run: |
                  cp posthog/user_scripts/latest_user_defined_function.xml docker/clickhouse/user_defined_function.xml
                  docker compose -f docker-compose.dev.yml -f docker-compose.profiles.yml pull --quiet &

            - name: Add service hostnames to /etc/hosts
              shell: bash
              run: echo "127.0.0.1 db redis7 kafka clickhouse clickhouse-coordinator objectstorage seaweedfs temporal" | sudo tee -a /etc/hosts

            - name: Mint setup-action GitHub token
              id: setup-gh-token
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              continue-on-error: true
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_PRIVATE_KEY }}
                  skip-token-revoke: true

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: 3.13.13
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28' # pinned: unpinned setup-uv calls GH API on every job, exhausts rate limit
                  enable-cache: true
                  cache-dependency-glob: uv.lock
                  save-cache: ${{ github.ref == 'refs/heads/master' }}

            - name: Install SAML (python3-saml) dependencies
              shell: bash
              run: |
                  sudo rm -f /etc/apt/sources.list.d/*twingate* && sudo apt-get update && sudo apt-get install libxml2-dev libxmlsec1-dev libxmlsec1-openssl

            - name: Install Python dependencies
              shell: bash
              run: |
                  UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev

            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/mcp... --filter='./products/*' install --frozen-lockfile
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}

            - name: Set up needed files
              shell: bash
              run: |
                  mkdir -p frontend/dist
                  touch frontend/dist/index.html
                  touch frontend/dist/layout.html
                  touch frontend/dist/exporter.html

            - name: Install Rust
              uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
              with:
                  toolchain: 1.91.1
                  components: cargo

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
              with:
                  shared-key: 'v2-rust-mcp'
                  workspaces: rust
                  save-if: ${{ github.ref == 'refs/heads/master' }}

            - name: Install sqlx-cli
              uses: ./.github/actions/setup-sqlx-cli

            - name: Build Rust flags service
              working-directory: rust
              env:
                  # Debug builds compile much faster than release.
                  # We disable debug assertions because the codebase contains
                  # debug_assert! checks that intentionally panic on data invariant
                  # violations, which would crash the service mid-test-run.
                  RUSTFLAGS: '-C debug-assertions=no'
              run: cargo build -p feature-flags

            - name: Download MaxMind Database
              run: ./bin/download-mmdb

            - name: Log in to Docker Hub
              if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  username: ${{ vars.DOCKERHUB_USER }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Start Docker services
              shell: bash
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
                  COMPOSE_PROFILES: temporal
              run: bin/ci-wait-for-docker launch --down

            - name: Wait for Docker services
              shell: bash
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
                  COMPOSE_PROFILES: temporal
              run: bin/ci-wait-for-docker wait temporal

            - name: Fetch current PR base for merge-base
              if: github.event_name == 'pull_request'
              env:
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: git fetch --no-tags --depth=1000 --filter=blob:none origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

            - name: Compute schema cache key from merge-base
              id: schema-key
              if: github.event_name == 'pull_request'
              env:
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: |
                  # HEAD is the synthetic merge commit; HEAD^2 is the PR branch tip.
                  # The fetch-depth:1000 checkout + base-ref fetch above ensure the
                  # full ancestry needed to find the divergence point is available.
                  MERGE_BASE=$(git merge-base HEAD^2 "origin/${BASE_REF}" 2>/dev/null || echo "")
                  if [ -z "$MERGE_BASE" ]; then
                      echo "key=" >> $GITHUB_OUTPUT
                      echo "migrations_key=" >> $GITHUB_OUTPUT
                      echo "::notice::merge-base not found (branch too stale?) — schema cache will be skipped"
                      exit 0
                  fi
                  # Routing decides which app labels reach the dump, and the prime step below
                  # replays them from the checked-out copy, so these inputs belong in the key. A PR
                  # that edits any of them matches no master dump, the merge-base one included:
                  # drop both keys and let migrations run from scratch.
                  DB_ROUTING=$(git ls-tree -r --format='%(objectname) %(path)' "$MERGE_BASE" -- products/db_routing.yaml posthog/product_db_config.py posthog/product_db_router.py)
                  DB_ROUTING_HEAD=$(git ls-tree -r --format='%(objectname) %(path)' HEAD -- products/db_routing.yaml posthog/product_db_config.py posthog/product_db_router.py)
                  if [ "$DB_ROUTING" != "$DB_ROUTING_HEAD" ]; then
                      echo "key=" >> $GITHUB_OUTPUT
                      echo "migrations_key=" >> $GITHUB_OUTPUT
                      echo "::notice::db routing config or router differs from the merge base, so the schema cache is skipped"
                      exit 0
                  fi
                  echo "key=posthog-schema-master-${MERGE_BASE}" >> $GITHUB_OUTPUT
                  # Last-resort restore prefix: matches the newest saved dump of any
                  # migration set, for the window where both exact keys miss. Gated on
                  # checkout age (a day) because a re-run of an old run keeps its original
                  # commit: a stale checkout can lack migrations the newest dump records,
                  # and the migrate top-ups only apply forward, so they cannot repair a
                  # dump that is newer than the code.
                  HEAD_AGE_SECONDS=$(( $(date +%s) - $(git show -s --format=%ct HEAD) ))
                  if [ "$HEAD_AGE_SECONDS" -lt 86400 ]; then
                      echo "prefix_key=posthog-schema-mig-${SCHEMA_CACHE_EPOCH}-" >> $GITHUB_OUTPUT
                  fi
                  # Shared migration-set key. Must match ci-backend.yml's save-side computation byte for byte or it never hits.
                  MIG_FILES=$(git ls-tree -r --format='%(objectname) %(path)' "$MERGE_BASE" \
                      | grep -E '/migrations/[^/]+\.py$|^[0-9a-f]+ uv\.lock$' \
                      | grep -vE '/(clickhouse|async_migrations)/migrations/' \
                      | LC_ALL=C sort) || true
                  PG_IMAGE=$(git show "${MERGE_BASE}:docker-compose.base.yml" 2>/dev/null \
                      | grep -m1 -E '^[[:space:]]*image:[[:space:]]*postgres:' | tr -d '[:space:]')
                  if [ -z "$MIG_FILES" ]; then
                      echo "migrations_key=" >> $GITHUB_OUTPUT
                      echo "::notice::no migration files matched — restore will fall back to the SHA schema key"
                  else
                      MIG_HASH=$(printf '%s\n%s\n%s' "$MIG_FILES" "$PG_IMAGE" "$DB_ROUTING" | sha256sum | cut -c1-40)
                      echo "migrations_key=posthog-schema-mig-${SCHEMA_CACHE_EPOCH}-${MIG_HASH}" >> $GITHUB_OUTPUT
                  fi

            - name: Restore schema cache from master
              if: ${{ github.event_name == 'pull_request' && steps.schema-key.outputs.key != '' }}
              uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: schema.sql.gz
                  # Prefer the shared content key; fall back to the exact merge-base SHA key,
                  # then to the newest dump of any migration set. Right after a migration
                  # lands on master both exact keys miss until ci-backend re-dumps; the
                  # migrate step below tops a slightly stale dump up in seconds instead of
                  # replaying the full history.
                  key: ${{ steps.schema-key.outputs.migrations_key || steps.schema-key.outputs.key }}
                  restore-keys: |
                      ${{ steps.schema-key.outputs.key }}
                      ${{ steps.schema-key.outputs.prefix_key }}

            - name: Prime posthog from cached schema
              # No-op on cache miss; manage.py migrate below falls back to a full migrate.
              # MCP integration tests hit the live posthog DB, not test_posthog — that's
              # the only deviation from ci-backend.yml's equivalent step.
              if: ${{ github.event_name == 'pull_request' }}
              env:
                  TARGET_DB: posthog
              run: |
                  if [ ! -f schema.sql.gz ]; then
                      echo "::notice::Schema cache miss — manage.py migrate will run from scratch"
                      exit 0
                  fi
                  mkdir -p .postgres-backups
                  mv schema.sql.gz .postgres-backups/schema-latest.sql.gz
                  if ! ./bin/hogli db:restore-test-db; then
                      echo "::warning::Schema restore failed (stale/incompatible cached dump?) — manage.py migrate will run from scratch"
                      exit 0
                  fi
                  # The dump is produced by ci-backend.yml, where TEST=1 activates
                  # ProductDBRouter and routes the apps in products/db_routing.yaml to
                  # separate databases: their tables are absent from the dump, but
                  # django_migrations still records their migrations as applied. This job
                  # configures no product DBs, so those apps live on the default DB —
                  # drop their migration records so migrate below replays them from 0001
                  # and actually creates the tables.
                  APPS=$(python - <<'EOF'
                  import yaml
                  with open("products/db_routing.yaml") as f:
                      routes = yaml.safe_load(f)["routes"]
                  print(",".join(sorted({"'%s'" % r["app_label"] for r in routes})))
                  EOF
                  )
                  if [ -n "$APPS" ]; then
                      docker compose -f docker-compose.dev.yml exec -T db psql -U posthog posthog \
                        -c "DELETE FROM django_migrations WHERE app IN ($APPS);"
                  fi

            - name: Run migrations
              run: |
                  # Create persons database and run sqlx migrations first
                  DATABASE_URL="postgres://posthog:posthog@localhost:5432/posthog_persons" \
                    sqlx database create
                  DATABASE_URL="postgres://posthog:posthog@localhost:5432/posthog_persons" \
                    sqlx migrate run --source rust/persons_migrations/
                  # Then run Django migrations. When the schema cache primed the DB above,
                  # this only applies migrations added by the PR (the django_migrations
                  # table from the dump tells Django which ones are already applied).
                  python manage.py migrate --noinput
                  python manage.py migrate_clickhouse

            - name: Start Rust flags service
              working-directory: rust
              env:
                  BIND_HOST: '127.0.0.1'
                  BIND_PORT: '3001'
                  READ_DATABASE_URL: postgres://posthog:posthog@localhost:5432/posthog
                  WRITE_DATABASE_URL: postgres://posthog:posthog@localhost:5432/posthog
                  PERSONS_READ_DATABASE_URL: postgres://posthog:posthog@localhost:5432/posthog_persons
                  PERSONS_WRITE_DATABASE_URL: postgres://posthog:posthog@localhost:5432/posthog_persons
                  REDIS_URL: redis://localhost:6379/
                  CACHE_TTL_SECONDS: '0'
                  RUST_BACKTRACE: '1'
              run: |
                  ./target/debug/feature-flags > /tmp/rust-flags.log 2>&1 &
                  RUST_FLAGS_PID=$!
                  echo "RUST_FLAGS_PID=$RUST_FLAGS_PID" >> $GITHUB_ENV
                  for i in {1..30}; do
                      if ! kill -0 "$RUST_FLAGS_PID" 2>/dev/null; then
                          echo "ERROR: Rust flags service exited unexpectedly"
                          cat /tmp/rust-flags.log || true
                          exit 1
                      fi
                      if curl -s http://127.0.0.1:3001/_readiness > /dev/null 2>&1; then
                          echo "Rust flags service is ready"
                          break
                      fi
                      echo "Waiting for Rust flags service... ($i/30)"
                      sleep 2
                  done
                  if ! curl -s http://127.0.0.1:3001/_readiness > /dev/null 2>&1; then
                      echo "ERROR: Rust flags service failed to start after 30 attempts"
                      cat /tmp/rust-flags.log || true
                      exit 1
                  fi

            - name: Start personhog services
              shell: bash
              env:
                  COMPOSE_FILE: docker-compose.dev.yml
                  COMPOSE_PROFILES: ingestion
              run: bin/ci-wait-for-docker launch personhog-replica personhog-router

            - name: Seed test data
              run: python manage.py generate_demo_data --n-clusters 10 --days-past 7 --days-future 0 --skip-materialization --skip-flag-sync --skip-user-product-list

            - name: Create API key and extract test IDs
              run: |
                  python -c "
                  import django, os
                  os.environ['DJANGO_SETTINGS_MODULE'] = 'posthog.settings'
                  django.setup()
                  from posthog.models import Organization, Team, User, EventDefinition
                  from posthog.models.personal_api_key import PersonalAPIKey
                  from posthog.models.utils import hash_key_value
                  org = Organization.objects.first()
                  team = Team.objects.first()
                  user = User.objects.first()
                  PersonalAPIKey.objects.create(
                      user=user,
                      label='mcp_ci_api_key',
                      secure_value=hash_key_value('phx_e2e_demo_api_key'),
                      scopes=['*'],
                  )
                  # Ensure common event definitions exist for MCP integration tests
                  for event_name in ['\$pageview', '\$pageleave', '\$autocapture', '\$screen']:
                      EventDefinition.objects.get_or_create(name=event_name, team=team)
                  print(f'TEST_ORG_ID={org.id}')
                  print(f'TEST_PROJECT_ID={team.id}')
                  " >> $GITHUB_ENV

            - name: Source celery queues
              run: |
                  source ./bin/celery-queues.env
                  echo "CELERY_WORKER_QUEUES=$CELERY_WORKER_QUEUES" >> $GITHUB_ENV

            - name: Start PostHog web & Celery worker
              run: |
                  python manage.py run_autoreload_celery --type=worker &> /tmp/celery.log &
                  python -m granian --interface asgi posthog.asgi:application --host 0.0.0.0 --port 8000 --workers 1 &> /tmp/server.log &

            - name: Wait for PostHog to be ready
              uses: iFaxity/wait-on-action@1fe019e0475491e9e8c4f421b6914ccc3ed8f99c # v1.2.1
              with:
                  resource: http://localhost:8000
                  timeout: 180000
                  interval: 2000
                  verbose: true

            # Everything above is setup: a failure before this point (or a runner
            # death, which never sets the output at all) makes the caller's retry
            # attempt eligible. A failure after this point is a real test failure.
            - name: Mark tests started
              id: mark-tests-started
              run: echo "started=true" >> "$GITHUB_OUTPUT"

            - name: Run integration tests
              id: run-integration-tests
              # continue-on-error so the quarantine gate below is the verdict — it passes when
              # every failure is an already-quarantined flake, fails otherwise.
              continue-on-error: true
              # The junit reporter (alongside the default console one) feeds the Trunk upload below.
              # No `--` before the flags: pnpm forwards it literally, and vitest then treats
              # everything after it as positional args, silently dropping the junit reporter.
              run: cd services/mcp && pnpm run test:integration --reporter=default --reporter=junit --outputFile.junit=junit-integration.xml
              env:
                  TEST_POSTHOG_API_BASE_URL: http://localhost:8000
                  TEST_POSTHOG_PERSONAL_API_KEY: phx_e2e_demo_api_key
                  TEST_ORG_ID: ${{ env.TEST_ORG_ID }}
                  TEST_PROJECT_ID: ${{ env.TEST_PROJECT_ID }}

            # Best-effort Trunk upload (continue-on-error); the "Fail on test failure" step below is
            # the verdict, so a Trunk outage can't red a passing job. Internal PRs only (needs the
            # secret).
            # TRUNK_UPLOAD_ENABLED is the master kill-switch: when it is not 'true' this gate
            # skips, so nothing uploads and no known flakes are quarantined. TRUNK_QUARANTINE_ENABLED
            # splits the two — it defaults off, so set it to 'true' to let the verdict step below mask
            # known flakes; otherwise any real failure reds the job (quarantining needs upload on too).
            - name: Quarantine gate
              id: quarantine_gate
              continue-on-error: true
              if: ${{ !cancelled() && env.RUNS_ON_INTERNAL_PR == 'true' && github.repository == 'PostHog/posthog' && github.actor != 'dependabot[bot]' && vars.TRUNK_UPLOAD_ENABLED == 'true' }}
              uses: ./.github/actions/trunk-quarantine-gate
              with:
                  junit-paths: services/mcp/junit-integration.xml
                  previous-step-outcome: ${{ steps.run-integration-tests.outcome }}
                  token: ${{ secrets.TRUNK_API_TOKEN }}

            # Verdict: red a real failure the gate didn't clear as a quarantined flake. != 'success'
            # also covers the skipped gate on fork/Dependabot. Sits before the logs-on-failure steps
            # so a real failure still triggers them via failure().
            - name: Fail on test failure
              if: ${{ !cancelled() && steps.run-integration-tests.outcome == 'failure' && (vars.TRUNK_QUARANTINE_ENABLED != 'true' || steps.quarantine_gate.outcome != 'success') }}
              shell: bash
              run: exit 1

            - name: Show server logs on failure
              if: failure()
              run: cat /tmp/server.log || true

            - name: Show celery logs on failure
              if: failure()
              run: cat /tmp/celery.log || true

            - name: Show Rust flags service logs on failure
              if: failure()
              run: cat /tmp/rust-flags.log || true

            - name: Show docker compose logs on failure
              if: failure()
              shell: bash
              run: docker compose -f docker-compose.dev.yml logs
