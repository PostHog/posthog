name: Dependency scan

on:
    pull_request:
        paths:
            - '**/pnpm-lock.yaml'
            - '**/uv.lock'
            - '**/Cargo.lock'
            - '**/go.mod'
            - .github/scripts/dependency_scan.py
            - .github/scripts/dependency_scan.py.lock
            - .github/scripts/post-dependency-scan-section.mjs
            - .github/workflows/dependency-scan.yml
    push:
        branches:
            - master
        paths:
            - '**/pnpm-lock.yaml'
            - '**/uv.lock'
            - '**/Cargo.lock'
            - '**/go.mod'

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
    scan:
        name: Scan changed dependencies
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions: {}
        outputs:
            findings: ${{ steps.scan.outputs.findings }}
            sarif: ${{ steps.scan.outputs.sarif }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
                  fetch-depth: 2
                  filter: blob:none
                  sparse-checkout: |
                      .github/scripts/dependency_scan.py
                      .github/scripts/dependency_scan.py.lock
                      .github/actions/setup-uv
                  sparse-checkout-cone-mode: false

            - uses: ./.github/actions/setup-uv
              with:
                  enable-cache: false

            - name: Fetch the commit before the push
              if: github.event_name == 'push'
              env:
                  BEFORE: ${{ github.event.before }}
              run: git fetch --no-tags --depth=1 --filter=blob:none origin "$BEFORE"

            - name: Scan added and changed packages
              id: scan
              env:
                  BASE_REF: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
              run: uv run --frozen --script .github/scripts/dependency_scan.py

    code-scanning:
        name: Upload the scan to code scanning
        needs: scan
        if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'trunk-merge/'))
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            security-events: write
        steps:
            - name: Write the scan results to a file
              env:
                  SARIF: ${{ needs.scan.outputs.sarif }}
              run: printf '%s' "$SARIF" > guarddog.sarif

            - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
              with:
                  sarif_file: guarddog.sarif
                  category: guarddog

    report:
        name: Post the scan to the CI report
        needs: scan
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'trunk-merge/')
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
                  sparse-checkout: |
                      .github/scripts/post-dependency-scan-section.mjs
                      frontend/bin/ci-report
                      .nvmrc
                  sparse-checkout-cone-mode: false

            - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version-file: .nvmrc

            - name: Post the scan to the CI report
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  FINDINGS: ${{ needs.scan.outputs.findings }}
              run: node .github/scripts/post-dependency-scan-section.mjs
