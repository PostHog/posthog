name: Dependency scan

on:
    pull_request:
        paths:
            - '**/pnpm-lock.yaml'
            - '**/uv.lock'
            - '**/Cargo.lock'
            - '**/go.mod'
            - .github/scripts/dependency_scan.py
            - .github/scripts/dependency_scan.py.lock
            - .github/scripts/post-dependency-scan-section.mjs
            - .github/workflows/dependency-scan.yml

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
    scan:
        name: Scan changed dependencies
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions: {}
        outputs:
            findings: ${{ steps.scan.outputs.findings }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
                  fetch-depth: 2
                  filter: blob:none
                  sparse-checkout: |
                      .github/scripts/dependency_scan.py
                      .github/scripts/dependency_scan.py.lock
                      .github/actions/setup-uv
                  sparse-checkout-cone-mode: false

            - uses: ./.github/actions/setup-uv
              with:
                  enable-cache: false

            - name: Scan added and changed packages
              id: scan
              run: uv run --frozen --script .github/scripts/dependency_scan.py

    report:
        name: Post the scan to the CI report
        needs: scan
        if: github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'trunk-merge/')
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
                  sparse-checkout: |
                      .github/scripts/post-dependency-scan-section.mjs
                      frontend/bin/ci-report
                      .nvmrc
                  sparse-checkout-cone-mode: false

            - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version-file: .nvmrc

            - name: Post the scan to the CI report
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  FINDINGS: ${{ needs.scan.outputs.findings }}
              run: node .github/scripts/post-dependency-scan-section.mjs
