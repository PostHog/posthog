# Runs the inbox ranking multi-head network and `nn` family tests with the inbox-ranking dependency group.
# torch is not a main dependency, so the other test jobs skip these tests.
name: Inbox ranking network CI

on:
    pull_request:
        paths:
            - '.github/workflows/ci-inbox-ranking.yml'
            - 'posthog/dags/locations/signals_ml.py'
            - 'products/signals/dags/inbox_ranking/**'
            - 'pyproject.toml'
            - 'uv.lock'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

env:
    SECRET_KEY: '6b01eee4f945ca25045b5aab440b953461faf08693a9abbf1166dc7c6b9772da' # unsafe - for testing only
    TEST: 1

jobs:
    network:
        name: Torch network and ONNX parity tests
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v6.0.2
              with:
                  clean: false

            - name: Mint setup-action GitHub token
              id: setup-gh-token
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              continue-on-error: true
              uses: actions/create-github-app-token@v3.1.1
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_SETUP_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_SETUP_ACTIONS_PRIVATE_KEY }}
                  skip-token-revoke: true

            - name: Set up Python
              uses: actions/setup-python@v6.2.0
              with:
                  python-version-file: 'pyproject.toml'
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}

            - name: Install uv
              id: setup-uv
              uses: $/.github/actions/setup-uv

            - name: Install SAML (python3-saml) dependencies
              if: steps.setup-uv.outputs.cache-hit != 'true'
              run: |
                  sudo rm -f /etc/apt/sources.list.d/*twingate*
                  sudo apt-get update
                  sudo apt-get install libxml2-dev libxmlsec1-dev libxmlsec1-openssl

            - name: Install python dependencies with the inbox-ranking group
              run: UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev --group inbox-ranking

            # The tests need no database, ClickHouse or Redis, so the job starts no services.
            - name: Run the network and nn family tests
              run: |
                  python -c "import torch, onnxruntime"
                  pytest products/signals/dags/inbox_ranking/tests/test_multihead_network.py \
                      products/signals/dags/inbox_ranking/tests/test_multihead.py \
                      products/signals/dags/inbox_ranking/tests/test_nn.py -v --tb=short
