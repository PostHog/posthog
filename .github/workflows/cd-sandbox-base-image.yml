name: Tasks Sandbox Container Image CD

on:
    push:
        branches:
            - master
    # Narrower than the changes job's dorny filter, which also gates push events.
    # A skills edit changes a COPY payload rather than a build instruction, so it
    # cannot break the image build, and the :sha image a PR build pushes is never
    # pulled by anything. `ci-agent-skills.yml` already builds the same skills on
    # the same PR. Master keeps rebuilding on skills changes through the filter
    # below, so the :master image production resolves still gets current skills.
    pull_request:
        paths:
            - '.github/workflows/cd-sandbox-base-image.yml'
            - 'products/tasks/backend/sandbox/images/**'
            - 'products/desktop/packages/agent-shadow/**'
            - 'products/posthog_ai/scripts/**'
            # The notebook image bakes this package and stamps its content hash.
            - 'products/notebooks/backend/sandbox/kernel/**'
            - 'products/notebooks/backend/kernel_package.py'
    workflow_dispatch:

jobs:
    changes:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        # A fork PR runs in the base repo, so `repository_owner` does not exclude it,
        # but its read-only GITHUB_TOKEN cannot push to ghcr.io. Skipping here leaves
        # `sandbox_image` unset so both build jobs skip too, which keeps a fork off
        # the skills build it would only pay for to fail at the push.
        # trunk-merge/** heads are skipped the same way: merge-queue PRs are ephemeral,
        # nothing pulls images pushed for them, and each constituent PR already built its own.
        if: |
            github.repository_owner == 'PostHog' &&
            !startsWith(github.head_ref, 'trunk-merge/') &&
            (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        name: Determine if sandbox image needs to be built
        permissions:
            contents: read
            pull-requests: read
        outputs:
            sandbox_image: ${{ steps.filter.outputs.sandbox_image }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: .github/actions/paths-filter
                  sparse-checkout-cone-mode: false

            - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              id: app-token
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              with:
                  client-id: ${{ vars.GH_APP_POSTHOG_PATHS_FILTER_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_PATHS_FILTER_PRIVATE_KEY }}
            - uses: ./.github/actions/paths-filter
              id: filter
              with:
                  token: ${{ steps.app-token.outputs.token || github.token }}
                  # Wider than the trigger-level pull_request paths above, because
                  # this also gates push events, where a skills change does have to
                  # rebuild the image that :master serves.
                  filters: |
                      sandbox_image:
                        - '.github/workflows/cd-sandbox-base-image.yml'
                        - 'products/tasks/backend/sandbox/images/**'
                        - 'products/desktop/packages/agent-shadow/**'
                        - 'products/*/skills/**'
                        - 'products/posthog_ai/scripts/**'
                        - 'products/notebooks/backend/sandbox/kernel/**'
                        - 'products/notebooks/backend/kernel_package.py'

    build_skills:
        needs: changes
        name: Build agent skills from source
        if: |
            github.repository_owner == 'PostHog' &&
            (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (
                needs.changes.outputs.sandbox_image == 'true' ||
                github.event_name == 'workflow_dispatch' ||
                contains(github.event.pull_request.labels.*.name, 'build-tasks-sandbox-image')
            )
        runs-on: ubuntu-latest
        # `Run migrations` builds the schema from scratch on ubuntu-latest with no schema cache and
        # takes 22-29 minutes, so a 30-minute budget left no headroom and cut the job off mid-migrate
        # on two of three recent runs. `Build skills`, the step this job exists for, takes 10 seconds.
        timeout-minutes: 45
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  # Deep enough to reach the PR's merge base, which keys the schema cache below.
                  fetch-depth: 1000
                  filter: blob:none

            - name: Fetch base branch for merge-base computation
              if: github.event_name == 'pull_request'
              env:
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              # Scoped, blob-less, no-tags: without an explicit refspec, git fetch
              # falls back to remote.origin.fetch and pulls every branch.
              run: git fetch --no-tags --depth=1000 --filter=blob:none origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

            - name: Compute schema cache keys
              id: schema-key
              # Restores the schema dump ci-backend saves on master pushes, so the
              # migrate step below only tops up what is newer instead of replaying the
              # full migration history. On a PR the migration-set key is the merge-base's;
              # on a push or dispatch it is HEAD's. A cache miss falls through to a full
              # migrate, so an absent or wrong key is never a correctness risk.
              env:
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
                  IS_PR: ${{ github.event_name == 'pull_request' }}
                  # Manual cache-bust knob. Keep in sync with SCHEMA_CACHE_EPOCH in
                  # ci-backend.yml, which saves these caches on master pushes.
                  SCHEMA_CACHE_EPOCH: v2
              run: |
                  if [ "$IS_PR" != "true" ]; then
                      # Pushed or dispatched commit is checked out directly: no merge
                      # commit, no base ref. The per-SHA key would point at this same
                      # push's cache (saved concurrently by ci-backend, so racy); rely
                      # on the stable migration-set key below.
                      REF=HEAD
                  else
                      # HEAD is the synthetic merge commit; HEAD^2 is the PR branch tip.
                      MERGE_BASE=$(git merge-base HEAD^2 "origin/${BASE_REF}" 2>/dev/null || echo "")
                      if [ -z "$MERGE_BASE" ]; then
                          echo "key=" >> $GITHUB_OUTPUT
                          echo "migrations_key=" >> $GITHUB_OUTPUT
                          echo "::notice::merge-base not found (branch too stale?), so the schema cache is skipped"
                          exit 0
                      fi
                      # Routing decides which app labels reach the dump, so an edited routing
                      # config matches no master dump: drop both keys and migrate from scratch.
                      DB_ROUTING_BASE=$(git ls-tree -r --format='%(objectname) %(path)' "$MERGE_BASE" -- products/db_routing.yaml posthog/product_db_config.py posthog/product_db_router.py)
                      DB_ROUTING_HEAD=$(git ls-tree -r --format='%(objectname) %(path)' HEAD -- products/db_routing.yaml posthog/product_db_config.py posthog/product_db_router.py)
                      if [ "$DB_ROUTING_BASE" != "$DB_ROUTING_HEAD" ]; then
                          echo "key=" >> $GITHUB_OUTPUT
                          echo "migrations_key=" >> $GITHUB_OUTPUT
                          echo "::notice::db routing config or router differs from the merge base, so the schema cache is skipped"
                          exit 0
                      fi
                      echo "key=posthog-schema-master-${MERGE_BASE}" >> $GITHUB_OUTPUT
                      REF="$MERGE_BASE"
                  fi
                  # Last-resort restore prefix: matches the newest saved dump when the exact
                  # keys miss. Gated on checkout age because a re-run of an old commit could
                  # restore a dump newer than its code, which forward-only migrate cannot repair.
                  HEAD_AGE_SECONDS=$(( $(date +%s) - $(git show -s --format=%ct HEAD) ))
                  if [ "$HEAD_AGE_SECONDS" -lt 86400 ]; then
                      echo "prefix_key=posthog-schema-mig-${SCHEMA_CACHE_EPOCH}-" >> $GITHUB_OUTPUT
                  fi
                  # Must match ci-backend.yml's save-side computation byte for byte or the key never hits.
                  MIG_FILES=$(git ls-tree -r --format='%(objectname) %(path)' "$REF" \
                      | grep -E '/migrations/[^/]+\.py$|^[0-9a-f]+ uv\.lock$' \
                      | grep -vE '/(clickhouse|async_migrations)/migrations/' \
                      | LC_ALL=C sort) || true
                  # Routing decides which app labels are in the dump, so these inputs belong in the key.
                  DB_ROUTING=$(git ls-tree -r --format='%(objectname) %(path)' "$REF" -- products/db_routing.yaml posthog/product_db_config.py posthog/product_db_router.py)
                  PG_IMAGE=$(git show "${REF}:docker-compose.base.yml" 2>/dev/null \
                      | grep -m1 -E '^[[:space:]]*image:[[:space:]]*postgres:' | tr -d '[:space:]')
                  if [ -z "$MIG_FILES" ]; then
                      echo "migrations_key=" >> $GITHUB_OUTPUT
                      echo "::notice::no migration files matched, so restore falls back to the SHA schema key"
                  else
                      MIG_HASH=$(printf '%s\n%s\n%s' "$MIG_FILES" "$PG_IMAGE" "$DB_ROUTING" | sha256sum | cut -c1-40)
                      echo "migrations_key=posthog-schema-mig-${SCHEMA_CACHE_EPOCH}-${MIG_HASH}" >> $GITHUB_OUTPUT
                  fi

            - name: Start Docker services
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
              run: bin/ci-wait-for-docker launch

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version-file: 'pyproject.toml'
                  token: ${{ github.token }}

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28'
                  enable-cache: true
                  save-cache: ${{ github.ref == 'refs/heads/master' }}

            - name: Install python dependencies
              run: UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev

            - name: Install Rust
              uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
              with:
                  toolchain: stable
                  components: cargo

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
              with:
                  shared-key: 'v2-rust-skills'
                  workspaces: rust
                  save-if: ${{ github.ref == 'refs/heads/master' }}

            - name: Install sqlx-cli
              uses: ./.github/actions/setup-sqlx-cli

            - name: Wait for Docker services
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
              run: bin/ci-wait-for-docker wait

            - name: Restore schema cache from master
              if: steps.schema-key.outputs.migrations_key != '' || steps.schema-key.outputs.key != ''
              uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: schema.sql.gz
                  # Prefer the shared content key; fall back to the exact merge-base SHA
                  # key, then to the newest dump of any migration set.
                  key: ${{ steps.schema-key.outputs.migrations_key || steps.schema-key.outputs.key }}
                  restore-keys: |
                      ${{ steps.schema-key.outputs.key }}
                      ${{ steps.schema-key.outputs.prefix_key }}

            - name: Prime posthog from cached schema
              # db:restore-schema-fresh restores the dump and seeds the RunPython data a
              # schema-only dump lacks; the migrate step below layers anything newer on
              # top. On failure it leaves a fresh empty db, so migrate runs the full history.
              env:
                  SECRET_KEY: '6b01eee4f945ca25045b5aab440b953461faf08693a9abbf1166dc7c6b9772da'
                  DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/posthog'
                  REDIS_URL: 'redis://localhost'
                  OBJECT_STORAGE_ENABLED: 'False'
                  TEST: 1
                  DEBUG: 1
                  TARGET_DB: posthog
              run: |
                  if [ ! -f schema.sql.gz ]; then
                      echo "::notice::Schema cache miss, so the migrate step below runs the full history"
                      exit 0
                  fi
                  mkdir -p .postgres-backups
                  mv schema.sql.gz .postgres-backups/schema-latest.sql.gz
                  if ! ./bin/hogli db:restore-schema-fresh; then
                      echo "::warning::Schema restore failed (stale or incompatible cached dump?), so the migrate step below runs the full history"
                  fi

            - name: Run migrations
              env:
                  SECRET_KEY: '6b01eee4f945ca25045b5aab440b953461faf08693a9abbf1166dc7c6b9772da'
                  DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/posthog'
                  REDIS_URL: 'redis://localhost'
                  OBJECT_STORAGE_ENABLED: 'False'
                  TEST: 1
                  DEBUG: 1
              run: |
                  DATABASE_URL="postgres://posthog:posthog@localhost:5432/posthog_persons" \
                    sqlx database create
                  DATABASE_URL="postgres://posthog:posthog@localhost:5432/posthog_persons" \
                    sqlx migrate run --source rust/persons_migrations/
                  python manage.py migrate --noinput
                  python manage.py setup_dev --no-data

            - name: Build skills
              env:
                  SECRET_KEY: '6b01eee4f945ca25045b5aab440b953461faf08693a9abbf1166dc7c6b9772da'
                  DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/posthog'
                  REDIS_URL: 'redis://localhost'
                  OBJECT_STORAGE_ENABLED: 'False'
                  TEST: 1
                  DEBUG: 1
              run: ./bin/hogli build:skills

            - name: Download context-mill skills
              run: |
                  CONTEXT_MILL_ZIP_URL="https://github.com/PostHog/context-mill/releases/latest/download/skills-mcp-resources.zip"
                  TARGET_DIR="products/posthog_ai/dist/skills"
                  tmp_dir=$(mktemp -d)
                  trap 'rm -rf "$tmp_dir"' EXIT
                  echo "Downloading context-mill skills from ${CONTEXT_MILL_ZIP_URL}..."
                  curl -fsSL --retry 2 --retry-delay 3 -o "$tmp_dir/cm.zip" "$CONTEXT_MILL_ZIP_URL"
                  unzip -q -o "$tmp_dir/cm.zip" -d "$tmp_dir/outer"
                  mkdir -p "$TARGET_DIR"
                  count=0
                  while read -r inner_zip; do
                      skill_name="$(basename "$inner_zip" .zip)"
                      skill_name="${skill_name#omnibus-}"
                      skill_dir="$TARGET_DIR/$skill_name"
                      mkdir -p "$skill_dir"
                      unzip -q -o "$inner_zip" -d "$skill_dir"
                      find "$skill_dir" -name 'SKILL.md' -type f -exec sed -i 's/^\(name: *\)omnibus-/\1/' {} +
                      count=$((count + 1))
                  done < <(find "$tmp_dir/outer" -name 'omnibus-*.zip' -type f)
                  echo "Installed ${count} context-mill skills into ${TARGET_DIR}"

            - name: Upload built skills
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: built-skills
                  path: products/posthog_ai/dist/skills/
                  retention-days: 1

    sandbox_base_build:
        needs: [changes, build_skills]
        name: Build and push Tasks Sandbox container image
        if: |
            github.repository_owner == 'PostHog' &&
            (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (
                needs.changes.outputs.sandbox_image == 'true' ||
                github.event_name == 'workflow_dispatch' ||
                contains(github.event.pull_request.labels.*.name, 'build-tasks-sandbox-image')
            )
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 15
        permissions:
            id-token: write # allow issuing OIDC tokens for this workflow run
            contents: read # allow at least reading the repo contents, add other permissions if necessary
            packages: write # allow push to ghcr.io

        steps:
            - name: Check out
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 2

            - name: Download built skills
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: built-skills
                  path: products/posthog_ai/dist/skills/

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

            - name: Set up QEMU
              uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

            - name: Set up Depot CLI
              uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1

            - name: Login to ghcr.io
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
                  logout: false

            - name: Resolve published agent version
              id: agent-version
              run: |
                  version=$(curl -fsSL --retry 3 https://registry.npmjs.org/@posthog%2fagent/latest | jq -r '.version')
                  if [[ -z "$version" || "$version" == "null" ]]; then
                    echo "Could not resolve the latest @posthog/agent version" >&2
                    exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - parallel:
                  - name: Build and push container image (base)
                    id: build
                    uses: depot/build-push-action@5f3b3c2e5a00f0093de47f657aeaefcedff27d18 # v1.17.0
                    with:
                        project: vpl2362h0x # tasks-sandbox-images
                        context: . # use local checkout (includes downloaded artifact)
                        file: ./products/tasks/backend/sandbox/images/Dockerfile.sandbox-base
                        buildx-fallback: false # the fallback is so slow it's better to just fail
                        push: ${{ github.event_name == 'pull_request' || vars.CD_DEPLOY_ENABLED == 'true' }}
                        tags: ${{ github.ref == 'refs/heads/master' && format('ghcr.io/posthog/posthog-sandbox-base:master,ghcr.io/posthog/posthog-sandbox-base:{0}', github.sha) || format('ghcr.io/posthog/posthog-sandbox-base:{0}', github.sha) }}
                        platforms: linux/arm64,linux/amd64
                        build-args: |
                            AGENT_VERSION=${{ steps.agent-version.outputs.version }}
                            COMMIT_HASH=${{ github.sha }}

                  - name: Build and push container image (notebook)
                    id: build-notebook
                    uses: depot/build-push-action@5f3b3c2e5a00f0093de47f657aeaefcedff27d18 # v1.17.0
                    with:
                        project: vpl2362h0x # tasks-sandbox-images
                        context: . # use local checkout (includes downloaded artifact)
                        file: ./products/tasks/backend/sandbox/images/Dockerfile.sandbox-notebook
                        buildx-fallback: false # the fallback is so slow it's better to just fail
                        push: ${{ github.event_name == 'pull_request' || vars.CD_DEPLOY_ENABLED == 'true' }}
                        tags: ${{ github.ref == 'refs/heads/master' && format('ghcr.io/posthog/posthog-sandbox-notebook:master,ghcr.io/posthog/posthog-sandbox-notebook:{0}', github.sha) || format('ghcr.io/posthog/posthog-sandbox-notebook:{0}', github.sha) }}
                        platforms: linux/arm64,linux/amd64
                        build-args: COMMIT_HASH=${{ github.sha }}

                  - name: Build and push container image (streamlit)
                    id: build-streamlit
                    uses: depot/build-push-action@5f3b3c2e5a00f0093de47f657aeaefcedff27d18 # v1.17.0
                    with:
                        project: vpl2362h0x # tasks-sandbox-images
                        context: . # use local checkout (includes downloaded artifact)
                        file: ./products/tasks/backend/sandbox/images/Dockerfile.sandbox-streamlit
                        buildx-fallback: false # the fallback is so slow it's better to just fail
                        push: ${{ github.event_name == 'pull_request' || vars.CD_DEPLOY_ENABLED == 'true' }}
                        tags: ${{ github.ref == 'refs/heads/master' && format('ghcr.io/posthog/posthog-sandbox-streamlit:master,ghcr.io/posthog/posthog-sandbox-streamlit:{0}', github.sha) || format('ghcr.io/posthog/posthog-sandbox-streamlit:{0}', github.sha) }}
                        platforms: linux/arm64,linux/amd64

            - parallel:
                  - name: Build and push container image (pi)
                    id: build-pi
                    uses: depot/build-push-action@5f3b3c2e5a00f0093de47f657aeaefcedff27d18 # v1.17.0
                    with:
                        project: vpl2362h0x # tasks-sandbox-images
                        context: . # use local checkout (includes downloaded artifact)
                        file: ./products/tasks/backend/sandbox/images/Dockerfile.sandbox-pi
                        buildx-fallback: false # the fallback is so slow it's better to just fail
                        push: ${{ github.event_name == 'pull_request' || vars.CD_DEPLOY_ENABLED == 'true' }}
                        tags: ${{ github.ref == 'refs/heads/master' && format('ghcr.io/posthog/posthog-sandbox-pi:master,ghcr.io/posthog/posthog-sandbox-pi:{0}', github.sha) || format('ghcr.io/posthog/posthog-sandbox-pi:{0}', github.sha) }}
                        platforms: linux/arm64,linux/amd64
                        build-args: |
                            BASE_IMAGE=ghcr.io/posthog/posthog-sandbox-base:${{ github.sha }}

                  - name: Build and push container image (vm)
                    id: build-vm
                    uses: depot/build-push-action@5f3b3c2e5a00f0093de47f657aeaefcedff27d18 # v1.17.0
                    with:
                        project: vpl2362h0x # tasks-sandbox-images
                        context: . # use local checkout (includes downloaded artifact)
                        file: ./products/tasks/backend/sandbox/images/Dockerfile.sandbox-vm
                        buildx-fallback: false # the fallback is so slow it's better to just fail
                        push: true
                        tags: ${{ github.ref == 'refs/heads/master' && format('ghcr.io/posthog/posthog-sandbox-vm:master,ghcr.io/posthog/posthog-sandbox-vm:{0}', github.sha) || format('ghcr.io/posthog/posthog-sandbox-vm:{0}', github.sha) }}
                        platforms: linux/arm64,linux/amd64
                        build-args: |
                            BASE_IMAGE=ghcr.io/posthog/posthog-sandbox-base:${{ github.sha }}

    # Single required status check for branch protection. Add future sandbox
    # image jobs to `needs` here rather than reconfiguring GitHub.
    # NOT registered as required yet: the trigger-level pull_request paths
    # filter means this check never reports on PRs that don't touch sandbox
    # paths, and a required check that never reports blocks merging forever.
    # Before registering it in the ruleset, remove that paths filter.
    sandbox_base_image_check:
        needs: [changes, build_skills, sandbox_base_build]
        name: Sandbox Base Image Pass
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: always()
        permissions: {}
        steps:
            - name: Check all sandbox image jobs
              run: |
                  # Fail if change detection failed or was cancelled (both build jobs skip then, so the exit below would report green).
                  if [[ "${{ needs.changes.result }}" != "success" && "${{ needs.changes.result }}" != "skipped" ]]; then
                    echo "Change detection did not succeed (result: ${{ needs.changes.result }})."
                    exit 1
                  fi

                  # Pass if build wasn't required (no relevant changes, no dispatch, no label)
                  if [[ "${{ needs.build_skills.result }}" == "skipped" && "${{ needs.sandbox_base_build.result }}" == "skipped" ]]; then
                    echo "Sandbox image build was skipped (no relevant changes)."
                    exit 0
                  fi

                  if [[ "${{ needs.build_skills.result }}" != "success" && "${{ needs.build_skills.result }}" != "skipped" ]]; then
                    echo "Agent skills build failed."
                    exit 1
                  fi

                  if [[ "${{ needs.sandbox_base_build.result }}" != "success" && "${{ needs.sandbox_base_build.result }}" != "skipped" ]]; then
                    echo "Sandbox base image build failed."
                    exit 1
                  fi

                  echo "All sandbox image checks passed."
