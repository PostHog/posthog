name: Backend & Dagster CI - Update test timing

on:
    workflow_dispatch:
        inputs:
            backend_run_id:
                description: 'Backend CI run ID (leave empty to use latest successful run)'
                required: false
                type: string
            dagster_run_id:
                description: 'Dagster CI run ID (leave empty to use latest successful run)'
                required: false
                type: string
    schedule:
        # Every 6 hours: merge the latest CI timing artifacts and refresh the Actions cache
        # that ci-backend / ci-dagster restore for sharding. Frequent refresh keeps splits
        # balanced even after large batches of new tests land mid-day. Cheap: it merges
        # artifacts without executing any tests.
        - cron: '0 3,9,15,21 * * *'

permissions:
    contents: read
    actions: read

jobs:
    collect-and-merge:
        name: Collect timing data from CI artifacts
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Get app token
              id: app-token
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_POSTHOG_TESTS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_TESTS_PRIVATE_KEY }}

            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  # For PRs: checkout PR head; for schedule/dispatch: checkout branch by name (not SHA)
                  ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
                  repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
                  token: ${{ steps.app-token.outputs.token }}

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28' # pinned: unpinned setup-uv calls GH API on every job, exhausts rate limit

            - name: Find Backend CI run to use
              id: find-backend-run
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  INPUT_RUN_ID: ${{ inputs.backend_run_id }}
                  # Optional org/repo variable to tune how many runs the per-segment plan averages
                  # (default 5). Unset renders empty and the shell default kicks in.
                  BACKEND_RUNS_TO_AVERAGE: ${{ vars.BACKEND_RUNS_TO_AVERAGE }}
              run: |
                  if [ -n "$INPUT_RUN_ID" ]; then
                      echo "run_id=$INPUT_RUN_ID" >> $GITHUB_OUTPUT
                      echo "run_ids=$INPUT_RUN_ID" >> $GITHUB_OUTPUT
                      echo "Using provided Backend CI run: $INPUT_RUN_ID"
                      exit 0
                  fi

                  # Find recent successful ci-backend.yml runs with timing artifacts.
                  # Most runs skip tests due to path filtering and finish in seconds, so filter by duration first
                  # Runs that actually execute tests take 15+ minutes
                  # Only consider runs from the past 14 days to ensure artifacts haven't expired
                  echo "Searching for Backend CI runs with timing artifacts..."

                  # The per-segment file-mode plan (.test_durations.core/.temporal) is averaged over
                  # the last N runs to damp one run's timing noise (~-8pp makespan/mean on real PRs,
                  # 1 -> 5 runs; the achievable floor is ~0%). The union .test_durations and the
                  # JUnit de-tax still use the newest run alone (the primary). N stays small so the
                  # extra downloads stay modest.
                  N="${BACKEND_RUNS_TO_AVERAGE:-5}"
                  # Guard a mis-set variable: a non-integer would make the `-ge` test below error
                  # out (never breaking the loop) and silently average every candidate run.
                  [[ "$N" =~ ^[1-9][0-9]*$ ]] || N=5
                  found=0  # counts qualifying runs inside the loop below

                  # Calculate date 14 days ago in ISO 8601 format
                  cutoff_date=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-14d +%Y-%m-%dT%H:%M:%SZ)
                  # Newest first: runs that ran tests (>5 min) and uploaded a full set of timing
                  # artifacts (>=38), up to N. Scan a wider candidate window since most runs skip.
                  run_ids=$(gh api "repos/${{ github.repository }}/actions/workflows/ci-backend.yml/runs?status=success&branch=master&per_page=100&created=>=$cutoff_date" \
                      --jq '.workflow_runs[] | select(
                          (.updated_at | fromdateiso8601) - (.run_started_at | fromdateiso8601) > 300
                      ) | .id' | head -25 | \
                      while read id; do
                          count=$(gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts?per_page=100" \
                              --jq '[.artifacts[] | select(.name | startswith("timing_data-")) | select(.expired == false)] | length' 2>/dev/null)
                          echo "Run $id has $count timing artifacts" >&2
                          if [ "$count" -ge "38" ]; then
                              echo "$id"
                              found=$((found + 1))
                              [ "$found" -ge "$N" ] && break
                          fi
                      done)

                  primary=$(echo "$run_ids" | head -1)
                  if [ -z "$primary" ]; then
                      echo "::error::No suitable Backend CI run found with timing artifacts"
                      exit 1
                  fi

                  echo "run_id=$primary" >> $GITHUB_OUTPUT
                  echo "run_ids=$(echo $run_ids | tr '\n' ' ')" >> $GITHUB_OUTPUT
                  echo "Found Backend CI runs (newest first): $(echo $run_ids | tr '\n' ' ')"

            - name: Find Dagster CI run to use
              id: find-dagster-run
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  INPUT_RUN_ID: ${{ inputs.dagster_run_id }}
              run: |
                  if [ -n "$INPUT_RUN_ID" ]; then
                      echo "run_id=$INPUT_RUN_ID" >> $GITHUB_OUTPUT
                      echo "Using provided Dagster CI run: $INPUT_RUN_ID"
                      exit 0
                  fi

                  # Find a recent successful ci-dagster.yml run with timing artifacts
                  # Only consider runs from the past 14 days to ensure artifacts haven't expired
                  echo "Searching for Dagster CI run with timing artifacts..."

                  # Calculate date 14 days ago in ISO 8601 format
                  cutoff_date=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-14d +%Y-%m-%dT%H:%M:%SZ)
                  # Get runs that took more than 5 minutes (300 seconds) - likely ran tests
                  run_id=$(gh api "repos/${{ github.repository }}/actions/workflows/ci-dagster.yml/runs?status=success&branch=master&per_page=100&created=>=$cutoff_date" \
                      --jq '.workflow_runs[] | select(
                          (.updated_at | fromdateiso8601) - (.run_started_at | fromdateiso8601) > 300
                      ) | .id' | head -5 | \
                      while read id; do
                          count=$(gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts?per_page=100" \
                              --jq '[.artifacts[] | select(.name | startswith("timing_data-Dagster-")) | select(.expired == false)] | length' 2>/dev/null)
                          echo "Run $id has $count Dagster timing artifacts" >&2
                          # Expect at least 3 Dagster shards
                          if [ "$count" -ge "3" ]; then
                              echo "$id"
                              break
                          fi
                      done)

                  if [ -z "$run_id" ]; then
                      echo "::warning::No suitable Dagster CI run found with timing artifacts - skipping Dagster"
                      echo "run_id=" >> $GITHUB_OUTPUT
                  else
                      echo "run_id=$run_id" >> $GITHUB_OUTPUT
                      echo "Found Dagster CI run: $run_id"
                  fi

            - name: Restore the previous map for the drift fallback
              # The merge below takes product entries only from the products file
              # (--replace-prefix), so a Products slice that fails the drift check
              # needs a stand-in or every product loses its durations. The last
              # cached map is that stand-in. A miss leaves the checked-out file.
              uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              continue-on-error: true
              with:
                  path: .test_durations
                  # run_id never matches — forces the prefix restore-key to the newest entry.
                  key: posthog-test-durations-${{ github.run_id }}
                  restore-keys: |
                      posthog-test-durations-

            - name: Set the previous map aside
              # The restore lands on the tracked file; keep the copy elsewhere and put
              # the committed file back so the change check below diffs a clean tree.
              run: |
                  cp .test_durations /tmp/previous_durations
                  git checkout -- .test_durations

            - name: Download timing artifacts
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  BACKEND_RUN_ID: ${{ steps.find-backend-run.outputs.run_id }}
                  BACKEND_RUN_IDS: ${{ steps.find-backend-run.outputs.run_ids }}
                  DAGSTER_RUN_ID: ${{ steps.find-dagster-run.outputs.run_id }}
              run: |
                  # Download backend timing artifacts. Use segment-specific patterns
                  # so we don't accidentally pull Dagster artifacts here when the same
                  # run ID is provided for both jobs (they share the timing_data- prefix
                  # and would otherwise collide on extraction into the same dir).
                  gh run download "$BACKEND_RUN_ID" \
                      --pattern "timing_data-Core-*" \
                      --pattern "timing_data-Temporal-*" \
                      --pattern "timing_data-Products-*" \
                      --dir timing_artifacts

                  # JUnit artifacts power precise per-shard carrier detection.
                  # Without these, optimize_test_durations.py silently takes the
                  # statistical fallback and the JUnit-arg becomes a no-op.
                  gh run download "$BACKEND_RUN_ID" \
                      --pattern "junit-results-backend-core-*" \
                      --pattern "junit-results-backend-temporal-*" \
                      --pattern "product-junit-results-*" \
                      --dir junit_artifacts || \
                      echo "::warning::No JUnit artifacts found — falling back to statistical carrier detection"

                  # Multi-run: pull timing + JUnit for each run we average into the per-segment
                  # file-mode plan (Core/Temporal only). Each run is de-taxed + scoped on its own
                  # below, then averaged. The primary is also downloaded here (into its own dir) so
                  # the union/JUnit steps above stay untouched. A run with no JUnit just gets its
                  # per-segment slice skipped, same fallback as the single-run path.
                  for rid in $BACKEND_RUN_IDS; do
                      gh run download "$rid" \
                          --pattern "timing_data-Core-*" \
                          --pattern "timing_data-Temporal-*" \
                          --dir "runs/$rid/timing" || { echo "::warning::No timing for run $rid — skipping it"; continue; }
                      gh run download "$rid" \
                          --pattern "junit-results-backend-core-*" \
                          --pattern "junit-results-backend-temporal-*" \
                          --dir "runs/$rid/junit" || echo "::warning::No JUnit for run $rid — its per-segment slice is skipped"
                  done

                  # Download dagster timing artifacts if available
                  if [ -n "$DAGSTER_RUN_ID" ]; then
                      gh run download "$DAGSTER_RUN_ID" --pattern "timing_data-Dagster-*" --dir timing_artifacts
                      echo "Downloaded Dagster timing artifacts"
                      # JUnit too, so the Dagster segment can prune dead nodeids like the others.
                      # Naming differs from the backend artifacts: junit-results-dagster-N.
                      gh run download "$DAGSTER_RUN_ID" --pattern "junit-results-dagster-*" --dir junit_artifacts || \
                          echo "::warning::No Dagster JUnit artifacts found — Dagster runs unscoped"
                  else
                      echo "Skipping Dagster timing artifacts (no suitable run found)"
                  fi

            - name: Process timing data
              env:
                  DAGSTER_RUN_ID: ${{ steps.find-dagster-run.outputs.run_id }}
                  BACKEND_RUN_IDS: ${{ steps.find-backend-run.outputs.run_ids }}
              run: |
                  # Process each segment separately with migration tax correction, then merge.
                  # Core, Temporal, and Products use JUnit for precise carrier detection.
                  # Scope Core, Temporal, and Dagster to the nodeids their run's JUnit saw run.
                  # Every shard restores the merged union and refreshes only its own slice, so
                  # without scoping a deleted or renamed test rides every refresh and never
                  # leaves these files, and the union merge below keeps inflating sharding
                  # budgets with dead nodeids. --scope-to-junit hard-fails when JUnit artifacts
                  # are missing, so retry unscoped to keep the existing behavior.
                  if ! uv run .github/scripts/optimize_test_durations.py timing_artifacts /tmp/core_durations \
                      --segment Core --junit-dir junit_artifacts --scope-to-junit; then
                      echo "::warning::Scoped Core durations failed, retrying unscoped"
                      uv run .github/scripts/optimize_test_durations.py timing_artifacts /tmp/core_durations \
                          --segment Core --junit-dir junit_artifacts
                  fi
                  if ! uv run .github/scripts/optimize_test_durations.py timing_artifacts /tmp/temporal_durations \
                      --segment Temporal --junit-dir junit_artifacts --scope-to-junit; then
                      echo "::warning::Scoped Temporal durations failed, retrying unscoped"
                      uv run .github/scripts/optimize_test_durations.py timing_artifacts /tmp/temporal_durations \
                          --segment Temporal --junit-dir junit_artifacts
                  fi
                  # Products has its own guarded scoping inside the script (only scopes when the
                  # JUnit shard set is complete), so no flag here.
                  # Products has no unscoped retry. A slice whose shape drifted from
                  # the clock must not reach the cache, and a missing slice is worse
                  # (the merge takes product entries only from this file), so keep
                  # the previous slice and still refresh Core and Temporal.
                  set +e
                  uv run .github/scripts/optimize_test_durations.py timing_artifacts /tmp/products_durations \
                      --segment Products --junit-dir junit_artifacts --fail-on-drift
                  products_status=$?
                  set -e
                  if [ "$products_status" -ne 0 ]; then
                      echo "::warning::Products durations refresh exited $products_status; keeping the previous products slice. Drift or an incomplete JUnit set are the expected causes, see the log above."
                      # Only entries the fresh slices do not carry: the outlier merge would
                      # otherwise let a stale value here beat a fresh one for the same test.
                      jq -s 'add' $(ls /tmp/core_durations /tmp/temporal_durations /tmp/dagster_durations 2>/dev/null) > /tmp/fresh_durations
                      jq --slurpfile fresh /tmp/fresh_durations \
                          'with_entries(select((.key | startswith("products/")) and ($fresh[0][.key] == null)))' \
                          /tmp/previous_durations > /tmp/products_durations
                  fi

                  # Process Dagster segment if available
                  if [ -n "$DAGSTER_RUN_ID" ]; then
                      if ! uv run .github/scripts/optimize_test_durations.py timing_artifacts /tmp/dagster_durations \
                          --segment Dagster --junit-dir junit_artifacts --scope-to-junit; then
                          echo "::warning::Scoped Dagster durations failed, retrying unscoped"
                          uv run .github/scripts/optimize_test_durations.py timing_artifacts /tmp/dagster_durations \
                              --segment Dagster
                      fi
                      echo "Processed Dagster timing data"
                  fi

                  # Outlier-merge across per-segment outputs. Single implementation
                  # in optimize_test_durations.py (outlier_merge_durations) is shared
                  # with per-segment artifact processing and covered by tests next
                  # to the script — see test_optimize_test_durations.py.
                  uv run .github/scripts/optimize_test_durations.py .test_durations \
                      --merge-files /tmp/core_durations /tmp/temporal_durations /tmp/products_durations /tmp/dagster_durations \
                      --replace-prefix products/

                  # Additionally emit nodeid-clean per-segment files for
                  # --split-granularity=file. The shared .test_durations above is a union
                  # across every CI job, so a Core file-mode plan scoped to it budgets weight
                  # for tests that never run in Core (other segments' param variants,
                  # product-routed files) — that mis-scoping is the imbalance file-mode hit.
                  # --scope-to-junit trims each file to exactly the nodeids that segment's
                  # JUnit saw run; the run-set is already in the artifacts, so this adds no
                  # collection. The union above is untouched (item-mode + turbo-discover still
                  # read it); these are purely additive, cached per-segment below.
                  #
                  # AVERAGED over the last N runs (newest first) to damp one run's timing noise:
                  # on real PRs a single-run plan lands ~+30-50% makespan/mean, multi-run ~-8pp of
                  # that, and good vs bad single run is just luck (the floor is ~0%). Each run is
                  # de-taxed + scoped on its own through the same path as before, then averaged;
                  # the newest run is passed first so it anchors membership (a test deleted since
                  # an older run never lingers). Non-fatal throughout: a run with no JUnit is
                  # skipped, and if none survive ci-backend falls back to scoping the union.
                  core_files=""
                  temporal_files=""
                  for rid in $BACKEND_RUN_IDS; do
                      if uv run .github/scripts/optimize_test_durations.py "runs/$rid/timing" "/tmp/core_$rid" \
                          --segment Core --junit-dir "runs/$rid/junit" --scope-to-junit; then
                          core_files="$core_files /tmp/core_$rid"
                      fi
                      if uv run .github/scripts/optimize_test_durations.py "runs/$rid/timing" "/tmp/temporal_$rid" \
                          --segment Temporal --junit-dir "runs/$rid/junit" --scope-to-junit; then
                          temporal_files="$temporal_files /tmp/temporal_$rid"
                      fi
                  done

                  if [ -n "$core_files" ]; then
                      uv run .github/scripts/optimize_test_durations.py .test_durations.core --average-files $core_files \
                          || echo "::warning::Core multi-run average failed — file-mode falls back to union scoping"
                  else
                      echo "::warning::Core per-segment durations skipped (no JUnit in any run?) — file-mode falls back to union scoping"
                  fi
                  if [ -n "$temporal_files" ]; then
                      uv run .github/scripts/optimize_test_durations.py .test_durations.temporal --average-files $temporal_files \
                          || echo "::warning::Temporal multi-run average failed — file-mode falls back to union scoping"
                  else
                      echo "::warning::Temporal per-segment durations skipped (no JUnit in any run?) — file-mode falls back to union scoping"
                  fi

                  # Also drop timing/JUnit download dirs (incl. the per-run runs/ tree) so the
                  # artifact upload below only sees the merged files.
                  rm -rf timing_artifacts junit_artifacts runs /tmp/core_* /tmp/temporal_* /tmp/products_durations /tmp/dagster_durations

            - name: Compute the cache key
              id: durations-meta
              run: |
                  # Full ISO-8601 cache key → each run writes its own entry. Restores match by
                  # prefix and only ever touch the newest entry, so prior entries age out 7 days
                  # after they stop being newest. This ensures a manual workflow_dispatch can
                  # refresh the cache intra-day (GitHub Actions cache keys are immutable, so a
                  # per-day key blocked same-day updates). ~1 MB zstd each; tiny footprint.
                  NOW=$(date -u +%FT%H%M%SZ)
                  echo "date=$NOW" >> "$GITHUB_OUTPUT"
                  echo "cache_key=posthog-test-durations-$NOW" >> "$GITHUB_OUTPUT"

            - name: Save test durations to Actions cache
              # The merged file is the source of truth for PR + master sharding (ci-backend and
              # ci-dagster restore it by the posthog-test-durations- prefix). Scheduled/dispatch
              # runs are on master, so the cache is readable from every branch. Saved every run;
              # a same-day key is an immutable no-op.
              uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              continue-on-error: true
              with:
                  path: .test_durations
                  key: ${{ steps.durations-meta.outputs.cache_key }}

            - name: Save per-segment durations to Actions cache
              # Nodeid-clean per-segment files for --split-granularity=file, restored by
              # ci-backend via the posthog-segment-durations- prefix. The prefix MUST NOT
              # start with posthog-test-durations- : the union restores match that prefix and
              # take the newest entry, so a shared prefix would shadow the union .test_durations
              # across every backend + dagster shard. Same per-day key shape as the union; a
              # miss makes file-mode fall back to scoping the union (still correct, just the
              # pre-fix balance). continue-on-error so a cache hiccup never fails the merge.
              uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              continue-on-error: true
              with:
                  path: |
                      .test_durations.core
                      .test_durations.temporal
                  key: posthog-segment-durations-${{ steps.durations-meta.outputs.date }}-${{ github.run_id }}

            - name: Publish the merged durations as an artifact
              # The cold-start floor for the consumers. .test_durations is not in the
              # repo: every consumer restores the newest cache and, on a miss, downloads
              # this artifact from the latest successful run of this workflow. 90 days
              # outlives any plausible cache lapse; the daily refresh keeps it fresh.
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: test-durations
                  path: |
                      .test_durations
                      .test_durations.core
                      .test_durations.temporal
                  include-hidden-files: true
                  # The per-segment files are absent when their multi-run average failed.
                  if-no-files-found: error
                  retention-days: 90
