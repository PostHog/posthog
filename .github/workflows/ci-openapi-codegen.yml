name: OpenAPI Codegen

on:
    push:
        branches:
            - master
    pull_request:
        paths:
            - '.github/workflows/ci-openapi-codegen.yml'
            - 'tools/openapi-codegen/**'

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    test:
        # Push and schedule runs only belong in this repo. Mirrors run CI on their own PRs only.
        if: github.repository == 'PostHog/posthog' || (github.event_name != 'push' && github.event_name != 'schedule')
        name: OpenAPI codegen tests
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: |
                      /*
                      !/*/
                      **/package.json
                      /.github/actions/pnpm-install/
                      /.github/actions/setup-pnpm/
                      /.husky/
                      /bin/fix-rdkafka-paths
                      /patches/
                      /tools/openapi-codegen/
                  sparse-checkout-cone-mode: false

            - name: Check master push inputs
              id: changes
              if: github.event_name == 'push'
              env:
                  BEFORE: ${{ github.event.before }}
              # Use the complete push diff, not the trigger's first 300 changed files.
              # Missing history or a failed comparison must run the tests.
              run: |
                  if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] &&
                      git fetch --no-tags --depth=1 origin "$BEFORE" &&
                      git diff --quiet "$BEFORE" "$GITHUB_SHA" -- \
                          ':(top,glob)*' \
                          ':(top,glob)**/package.json' \
                          .github/workflows/ci-openapi-codegen.yml \
                          .github/actions/pnpm-install/ \
                          .github/actions/setup-pnpm/ \
                          .husky/ bin/fix-rdkafka-paths patches/ tools/openapi-codegen/; then
                      echo 'run=false' >> "$GITHUB_OUTPUT"
                  else
                      echo 'run=true' >> "$GITHUB_OUTPUT"
                  fi

            - name: Install pnpm dependencies
              if: steps.changes.outputs.run != 'false'
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/openapi-codegen install --frozen-lockfile

            - name: Run tests
              if: steps.changes.outputs.run != 'false'
              run: pnpm --filter=@posthog/openapi-codegen test
