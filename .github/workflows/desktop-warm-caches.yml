name: Desktop Warm Caches

# GitHub only shares caches saved on the default branch with other branches,
# and the desktop PR workflows are restore-only. This job seeds every cache
# they restore. Saves are allowed here because the triggers are
# default-branch-scoped (push to master + manual dispatch).

on:
    push:
        branches: [master]
        paths:
            - 'products/desktop/**'
            - '.github/workflows/desktop-warm-caches.yml'
    workflow_dispatch:

concurrency:
    group: desktop-warm-caches-${{ github.ref }}
    # hogli-lint: allow-master-cancel -- a cache warmed for the newest master commit supersedes
    # the older run's, so cancelling that run loses nothing.
    cancel-in-progress: true

jobs:
    linux:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        defaults:
            run:
                working-directory: products/desktop
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  package_json_file: products/desktop/package.json

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 22

            - name: Get pnpm store path
              id: pnpm-store
              run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - name: Cache pnpm store
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: desktop-pnpm-${{ runner.os }}-${{ hashFiles('products/desktop/pnpm-lock.yaml') }}
                  restore-keys: desktop-pnpm-${{ runner.os }}-

            # Save a fresh entry per commit so the cache does not grow forever, but
            # restore the previous commit's entry as a fallback so build:deps and
            # typecheck start warm instead of cold on every master push. Mirrors the
            # keys in .github/actions/desktop-restore-turbo-cache.
            - name: Cache turbo artifacts
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: products/desktop/.turbo/cache
                  key: desktop-turbo-${{ github.sha }}
                  restore-keys: desktop-turbo-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  SKIP_ELECTRON_REBUILD: '1'

            - name: Seed turbo cache (build + typecheck)
              run: |
                  pnpm run build:deps
                  pnpm run typecheck

    macos:
        runs-on: macos-latest
        timeout-minutes: 30
        permissions:
            contents: read
        defaults:
            run:
                working-directory: products/desktop
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  package_json_file: products/desktop/package.json

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 22

            - name: Get pnpm store path
              id: pnpm-store
              run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            # Key the Electron and Playwright caches on the one version each depends
            # on, not the whole lockfile. Any unrelated dependency bump changes the
            # lockfile hash and evicts both, which forces a slow re-download and
            # re-save; the resolved versions below change only when they actually do.
            - name: Resolve cache versions
              id: versions
              run: |
                  set -euo pipefail
                  electron=$(grep -m1 -oE '^  electron@[^:]+' pnpm-lock.yaml | sed 's/^  electron@//')
                  playwright=$(grep -m1 -oE '^  playwright@[^:]+' pnpm-lock.yaml | sed 's/^  playwright@//')
                  echo "electron=$electron" >> "$GITHUB_OUTPUT"
                  echo "playwright=$playwright" >> "$GITHUB_OUTPUT"

            - name: Cache pnpm store
              id: pnpm-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: desktop-pnpm-${{ runner.os }}-${{ hashFiles('products/desktop/pnpm-lock.yaml') }}
                  restore-keys: desktop-pnpm-${{ runner.os }}-

            # desktop-test.yml's integration-test job restores both caches with a
            # restore-keys prefix (electron-<os>-, playwright-<os>-), so it still
            # finds these narrower keys.
            - name: Cache Electron binary
              id: electron-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/Library/Caches/electron
                  key: electron-${{ runner.os }}-${{ steps.versions.outputs.electron }}
                  restore-keys: electron-${{ runner.os }}-

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/Library/Caches/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.versions.outputs.playwright }}
                  restore-keys: playwright-${{ runner.os }}-

            # macOS minutes are 10x; do nothing when every cache is already warm.
            - name: Install dependencies
              if: >-
                  steps.pnpm-cache.outputs.cache-hit != 'true' ||
                  steps.electron-cache.outputs.cache-hit != 'true' ||
                  steps.playwright-cache.outputs.cache-hit != 'true'
              # Electron's own postinstall fills ~/Library/Caches/electron; the sqlite
              # rebuild only touches node_modules, which is not cached, so skip it.
              run: pnpm install --frozen-lockfile
              env:
                  SKIP_ELECTRON_REBUILD: '1'

            - name: Install Playwright Chromium
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: pnpm --filter code exec playwright install chromium
