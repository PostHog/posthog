# Checks and tests for the warehouse source vendors under the top-level `sources/` tree.
# The vendor tests need no service: no Postgres, ClickHouse, Redis or Kafka. So a pull
# request that only changes vendors runs this small lane, and Backend CI does not start.
name: Warehouse sources CI

on:
    pull_request:
        paths:
            - 'sources/**'
            # The SDK re-exports the shared source code that lives in the product.
            - 'products/warehouse_sources/backend/**'
            - 'pyproject.toml'
            - 'uv.lock'
            - 'pytest.ini'
            - 'conftest.py'
            - 'tach.toml'
            - '.github/workflows/ci-warehouse-sources.yml'
            - '.github/actions/setup-python-cached/**'
            - '.github/actions/setup-uv/**'
    schedule:
        # Master coverage for vendor tests. A change under posthog/ can break a vendor
        # through the SDK, and no pull request trigger above sees that change.
        # Offset from the other hourly CI crons so the runs do not all fire at once.
        - cron: '28 * * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    # The hourly lane gets its own group, so it queues behind itself rather than behind
    # other runs on master.
    group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled' || github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    sources:
        name: Warehouse sources checks and tests
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  # The pull request merge commit and its first parent, the base, so the
                  # vendor selection below can diff the two without the GitHub API.
                  fetch-depth: 2
                  persist-credentials: false

            - name: Set up Python
              uses: ./.github/actions/setup-python-cached
              with:
                  python-version: 3.14.7

            - name: Install uv
              id: setup-uv
              uses: ./.github/actions/setup-uv

            - name: Install SAML dependencies
              if: steps.setup-uv.outputs.cache-hit != 'true'
              run: sudo rm -f /etc/apt/sources.list.d/*twingate* && sudo apt-get update && sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl

            - name: Install Python dependencies
              run: UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev

            # A diff that stays inside vendor directories runs only those vendors. A vendor
            # cannot import another vendor (tach and import-linter enforce that), so the tests
            # of the other vendors cannot change. Any other file (the SDK, sources/conftest.py,
            # the product, a manifest, this workflow) runs every vendor. A deleted vendor has
            # no tests left to run.
            - name: Select vendor tests
              id: select
              env:
                  EVENT_NAME: ${{ github.event_name }}
              run: |
                  if [ "$EVENT_NAME" != "pull_request" ]; then
                      echo "targets=sources/" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  run_all=false
                  vendors=()
                  while IFS= read -r file; do
                      vendor=$(echo "$file" | sed -nE 's#^sources/([^/]+)/.+#\1#p')
                      if [ -z "$vendor" ] || [ "$vendor" = "sdk" ]; then
                          run_all=true
                      elif [ -d "sources/$vendor" ]; then
                          vendors+=("sources/$vendor")
                      fi
                  done < <(git diff --name-only HEAD^1 HEAD)
                  if [ "$run_all" = "true" ]; then
                      targets="sources/"
                  else
                      targets=$(printf '%s\n' "${vendors[@]}" | sort -u | tr '\n' ' ')
                  fi
                  echo "Vendor tests: ${targets:-none}"
                  echo "targets=$targets" >> "$GITHUB_OUTPUT"

            - name: Lint and check formatting
              run: |
                  ruff check sources/
                  ruff format --check --diff sources/

            - name: Check module boundaries (tach)
              run: ./bin/hogli lint:tach

            # tach leaves test files out of its dependency pass. The import-linter contract for
            # sources.* also checks the vendor tests.
            - name: Check vendor imports (import-linter)
              run: lint-imports

            # The repo invariants that walk the sources/ tree name it as a scan root. The
            # Django matrix runs all of them, but it does not start for a vendor-only diff.
            - name: Run repo invariants that scan sources/
              # An empty list would make pytest collect the whole repo, so it fails instead.
              run: |
                  mapfile -t invariants < <(grep -lE '"sources"' posthog/test/repo_invariants/test_*.py)
                  if [ "${#invariants[@]}" -eq 0 ]; then
                      echo "::error::No repo invariant names the sources/ root."
                      exit 1
                  fi
                  pytest -p no:cacheprovider -n auto "${invariants[@]}"

            # These tests load the full vendor catalog, so a change to one vendor can fail them.
            - name: Run vendor catalog tests
              run: pytest -p no:cacheprovider products/warehouse_sources/backend/temporal/data_imports/sources/tests --tb=short

            - name: Run vendor tests
              if: steps.select.outputs.targets != ''
              env:
                  TARGETS: ${{ steps.select.outputs.targets }}
              run: |
                  read -ra targets <<< "$TARGETS"
                  pytest -p no:cacheprovider "${targets[@]}" -m 'not async_migrations' --reruns=2 --reruns-delay=1 --tb=short

    # Collate job: one check name to mark as required.
    warehouse_sources_tests:
        needs: [sources]
        name: Warehouse sources tests pass
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        steps:
            - name: Check warehouse sources CI status
              run: |
                  if [[ "${{ needs.sources.result }}" != "success" && "${{ needs.sources.result }}" != "skipped" ]]; then
                    echo "Warehouse sources checks and tests did not succeed (result: ${{ needs.sources.result }})."
                    exit 1
                  fi
                  echo "Warehouse sources checks and tests passed."
