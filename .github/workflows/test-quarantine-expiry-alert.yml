# Warn #alerts-devex before an expired .test_quarantine.json entry starts failing
# `hogli test:quarantine check`. That check fails on a calendar date rather than on a commit,
# so nothing in a PR signals it coming.

name: Test quarantine expiry alert

on:
    schedule:
        - cron: '37 8 * * *'
    workflow_dispatch:

env:
    SLACK_CHANNEL: 'C0AS64N6DJL' # #alerts-devex

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled' || github.ref }}
    cancel-in-progress: false

jobs:
    alert-expiring:
        name: Alert on quarantine entries about to fail check
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            # Full checkout: the quarantine CLI decides which files it reads, so this job does not list them.
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: List entries 7 days and 1 day from failing check
              id: due
              uses: ./.github/actions/test-quarantine
              with:
                  # Slack rejects a section block over 3000 characters.
                  args: due --in-days 7 --in-days 1 --max-chars 3000

            - name: Notify Slack
              if: steps.due.outputs.stdout != ''
              uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
              with:
                  method: chat.postMessage
                  token: ${{ secrets.SLACK_DEVEX_BOT_TOKEN }}
                  errors: true
                  payload: |
                      channel: "${{ env.SLACK_CHANNEL }}"
                      text: ":hourglass_flowing_sand: Test quarantine entries will fail CI soon"
                      blocks:
                        - type: "section"
                          text:
                            type: "mrkdwn"
                            text: ":hourglass_flowing_sand: *Test quarantine entries will fail CI soon.* Remove or re-add each entry in <${{ github.server_url }}/${{ github.repository }}/blob/master/.test_quarantine.json|.test_quarantine.json> before `hogli test:quarantine check` fails on the date shown."
                        - type: "section"
                          text:
                            type: "mrkdwn"
                            text: ${{ toJSON(steps.due.outputs.stdout) }}

            # Nobody watches a scheduled run, and a broken alerter otherwise looks the same as nothing being due.
            - name: Notify Slack on alert failure
              if: failure()
              uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
              with:
                  method: chat.postMessage
                  token: ${{ secrets.SLACK_DEVEX_BOT_TOKEN }}
                  errors: true
                  payload: |
                      channel: "${{ env.SLACK_CHANNEL }}"
                      text: ":red_circle: Test quarantine expiry alert failed"
                      blocks:
                        - type: "section"
                          text:
                            type: "mrkdwn"
                            text: ":red_circle: *Test quarantine expiry alert failed.* Entries close to failing `hogli test:quarantine check` may not have been reported."
                        - type: "actions"
                          elements:
                            - type: "button"
                              text:
                                type: "plain_text"
                                text: "View run"
                              url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
