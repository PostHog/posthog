name: Master CI Alerts

# Master CI now runs as an hourly scheduled full-suite run (the Trunk merge
# queue runs the full suite before every merge, so master pushes no longer
# trigger CI). When one of those scheduled runs fails, post it to #alerts-devex.
# One message per failed workflow run, with no dedup or incident tracking:
# every commit on master already passed this same suite in the merge queue,
# so a scheduled failure is rare and each one is worth a look.

on:
    workflow_run:
        # Keep in sync with the CI workflows that carry the hourly master
        # schedule (each one's trigger comment points back at this file).
        workflows:
            - 'Python CI'
            - 'Backend CI'
            - 'Node.js CI'
            - 'Frontend CI'
            - 'Storybook'
            - 'Security'
            - 'Dagster CI'
            - 'E2E CI Playwright'
            - 'Rust CI'
            - 'MCP CI'
            - 'LLM Services CI'
        types: [completed]
        branches: [master]

permissions:
    contents: read

jobs:
    alert:
        name: Post failed scheduled master run to Slack
        # Only the hourly scheduled master runs alert here; PR runs report on their PR.
        if: >-
            github.repository == 'PostHog/posthog'
            && github.event.workflow_run.event == 'schedule'
            && github.event.workflow_run.conclusion == 'failure'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Post failure to #alerts-devex
              env:
                  SLACK_BOT_TOKEN: ${{ secrets.SLACK_DEVEX_BOT_TOKEN }}
                  SLACK_CHANNEL: 'C0AS64N6DJL' # #alerts-devex
                  WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
                  RUN_URL: ${{ github.event.workflow_run.html_url }}
                  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
              run: |
                  set -euo pipefail
                  text=":robot_face: :red_circle: Hourly master run of *${WORKFLOW_NAME}* failed on \`${HEAD_SHA:0:10}\`. <${RUN_URL}|View the run>"
                  # No curl retries: chat.postMessage is not idempotent, a retry could double-post.
                  response=$(curl -fsS --connect-timeout 10 https://slack.com/api/chat.postMessage \
                      -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
                      -H 'Content-Type: application/json; charset=utf-8' \
                      -d "$(jq -n --arg channel "$SLACK_CHANNEL" --arg text "$text" '{channel: $channel, text: $text}')")
                  # Slack returns HTTP 200 with ok=false on API errors, so check the body.
                  if [ "$(echo "$response" | jq -r '.ok')" != "true" ]; then
                      echo "::error::Slack post failed: $(echo "$response" | jq -r '.error // "unknown"')"
                      exit 1
                  fi
