name: Agent Egress

on:
    push:
        branches:
            - master
        paths:
            - '.github/workflows/ci-agent-egress.yml'
            - 'products/tasks/services/egress-proxy/**'
    pull_request:
        paths:
            - '.github/workflows/ci-agent-egress.yml'
            - 'products/tasks/services/egress-proxy/**'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        defaults:
            run:
                shell: bash
                working-directory: products/tasks/services/egress-proxy
        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
                  sparse-checkout: products/tasks/services/egress-proxy
                  sparse-checkout-cone-mode: false

            - name: Set up Go
              id: go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
              with:
                  go-version-file: products/tasks/services/egress-proxy/go.mod
                  cache: false

            - name: Get Go cache date
              id: go-cache-date
              run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

            - name: Restore Go cache
              id: go-cache
              uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
              with:
                  path: |
                      ~/go/pkg/mod
                      ~/.cache/go-build
                  key: agent-egress-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('products/tasks/services/egress-proxy/go.sum') }}-${{ steps.go-cache-date.outputs.date }}
                  restore-keys: |
                      agent-egress-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('products/tasks/services/egress-proxy/go.sum') }}-

            - name: Check formatting
              run: |
                  unformatted=$(gofmt -l .)
                  if [[ -n "$unformatted" ]]; then
                      printf '%s\n' "$unformatted"
                      exit 1
                  fi

            - name: Vet
              run: go vet ./...

            - name: Test
              run: go test -race -count=1 ./...

            - name: Save Go cache
              if: github.ref == 'refs/heads/master' && steps.go-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
              with:
                  path: |
                      ~/go/pkg/mod
                      ~/.cache/go-build
                  key: ${{ steps.go-cache.outputs.cache-primary-key }}
