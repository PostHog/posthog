name: CI CLI
permissions:
    contents: read
on:
    pull_request:
        paths:
            - 'cli/**'
            - 'rust/cymbal/tests/static/native/**'
            - 'rust/cymbal/tests/static/apple/**'
            - '.github/actions/paths-filter/**'
            - 'services/mcp/src/cli/**'
            - 'services/mcp/src/tools/**'
            - 'services/mcp/src/api/**'
            - 'services/mcp/schema/**'
            - 'services/mcp/scripts/build-cli*.ts'
            - 'services/mcp/scripts/hono-esbuild-config.ts'
            - 'services/mcp/package.json'
            - 'dist-workspace.toml'
            - 'pnpm-lock.yaml'
            - '.github/workflows/release.yml'
            - '.github/workflows/ci-cli.yml'
            - '.github/workflows/release-cli.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    changes:
        name: Detect Rust CLI changes
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        if: ${{ !startsWith(github.head_ref, 'trunk-merge/') }}
        permissions:
            contents: read
            pull-requests: read
        outputs:
            rust: ${{ steps.filter.outputs.rust != 'false' || steps.filter.outputs.unmatched_paths != 'false' || steps.filter.outputs.all_count == '' || steps.filter.outputs.all_count < github.event.pull_request.changed_files || steps.filter.outputs.all_count >= 3000 }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: .github/actions/paths-filter
                  sparse-checkout-cone-mode: false
            - uses: ./.github/actions/paths-filter
              id: filter
              with:
                  filters: |
                      all:
                          - '**'
                      unmatched_paths:
                          - '!**'
                      rust:
                          - 'cli/**'
                          - 'rust/cymbal/tests/static/native/**'
                          - 'rust/cymbal/tests/static/apple/**'
                          - '.github/workflows/ci-cli.yml'
                          - '.github/actions/paths-filter/**'

    tests:
        name: Run tests
        needs: changes
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        # Skipped on trunk-merge/** heads: merge-queue PRs are ephemeral and every
        # constituent PR already ran this in full.
        if: ${{ !cancelled() && !startsWith(github.head_ref, 'trunk-merge/') && needs.changes.outputs.rust != 'false' }}
        defaults:
            run:
                working-directory: cli
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: |
                      /cli/
                      /rust/cymbal/tests/static/native/
                      /rust/cymbal/tests/static/apple/
                  sparse-checkout-cone-mode: false

            - name: Install rust
              uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
              with:
                  toolchain: 1.91.1

            - name: Check Cargo.lock is up to date
              run: |
                  cargo update --workspace --locked
                  git diff --exit-code Cargo.lock

            - name: Run tests
              run: cargo test --all-features

    clippy:
        name: Clippy
        needs: changes
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        if: ${{ !cancelled() && !startsWith(github.head_ref, 'trunk-merge/') && needs.changes.outputs.rust != 'false' }}
        defaults:
            run:
                working-directory: cli
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: |
                      /cli/
                      /rust/cymbal/tests/static/native/
                      /rust/cymbal/tests/static/apple/
                  sparse-checkout-cone-mode: false

            - name: Install rust
              uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
              with:
                  toolchain: 1.91.1
                  components: clippy

            - name: Run clippy
              run: cargo clippy --all-targets --all-features -- -D warnings

    format:
        name: Format
        needs: changes
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        if: ${{ !cancelled() && !startsWith(github.head_ref, 'trunk-merge/') && needs.changes.outputs.rust != 'false' }}
        defaults:
            run:
                working-directory: cli
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: |
                      /cli/
                      /rust/cymbal/tests/static/native/
                      /rust/cymbal/tests/static/apple/
                  sparse-checkout-cone-mode: false

            - name: Install rust
              uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
              with:
                  toolchain: 1.91.1
                  components: rustfmt

            - name: Check formatting
              run: cargo fmt --all -- --check

    api-cli-release-bundle:
        name: API CLI release bundle
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        if: ${{ !startsWith(github.head_ref, 'trunk-merge/') }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: |
                      /*
                      !/*/
                      **/package.json
                      /.github/actions/pnpm-install/
                      /.github/actions/setup-pnpm/
                      /.husky/
                      /bin/fix-rdkafka-paths
                      /patches/
                      /services/mcp/
                      /packages/llm-normalizer/
                      /packages/quill/packages/
                      /tools/openapi-codegen/
                      /products/posthog_ai/skills/querying-posthog-data/references/guidelines.md
                      /products/ai_observability/backend/prompts/parser_recipe_examples.yaml
                      /products/notebooks/
                      /products/product_analytics/mcp/apps/explainChart/
                  sparse-checkout-cone-mode: false

            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter '@posthog/mcp...' install --frozen-lockfile

            - name: Build API CLI release bundle
              run: pnpm --dir services/mcp run build:cli:release

            - name: Verify API CLI release bundle
              run: node -e "const { statSync } = require('node:fs'); if (statSync('cli/lib/posthog-api-cli.mjs').size <= 0) process.exit(1)"
