# Secrets a workflow may read from a secret store.
#
# WF010 fails when `.github/workflows/**` reads a `secrets.NAME` that is absent
# here, so a typo or an unprovisioned secret is caught at lint time instead of
# interpolating to an empty string and making a step do nothing.
#
# `store` says where the value comes from, so a reader knows which console to
# open: `org`, `repo`, `environment:<name>`, or `missing` when nothing
# provides it yet. A `missing` entry needs a `note` saying what breaks.
#
# Names a reusable workflow declares under `on.workflow_call.secrets` are
# inputs, not store reads, and belong to WF011 rather than this file.
#
# Variables are deliberately out of scope: `vars.X` is unset-means-off for
# kill switches such as PRIVATE_SYNC_PAUSED, so absence there is legitimate.

