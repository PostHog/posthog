name: Render Jest timing report
description: Publish a browser report from downloaded Jest JUnit artifacts

inputs:
    artifacts:
        description: Downloaded JUnit artifacts
        required: true

runs:
    using: composite
    steps:
        - name: Render browser report
          shell: bash
          env:
              JEST_ARTIFACTS: ${{ inputs.artifacts }}
              REPORT: ${{ runner.temp }}/jest-test-speed-report.html
          run: bin/report-jest-timings --artifacts "$JEST_ARTIFACTS" --html "$REPORT"
        - name: Upload browser report
          id: report
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
          with:
              path: ${{ runner.temp }}/jest-test-speed-report.html
              archive: false
              retention-days: 7
              if-no-files-found: error
        - name: Write timing summary
          shell: bash
          env:
              JEST_ARTIFACTS: ${{ inputs.artifacts }}
              REPORT_URL: ${{ steps.report.outputs.artifact-url }}
          run: |
              bin/report-jest-timings --artifacts "$JEST_ARTIFACTS" --markdown-overview >> "$GITHUB_STEP_SUMMARY"
              printf '\n[Open the full interactive Jest timing report](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
