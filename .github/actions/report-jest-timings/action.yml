name: Render Jest timing summary
description: Render a GitHub Actions-compatible overview and paginated Jest timing tables

inputs:
    artifacts:
        description: Downloaded JUnit artifacts
        required: true

runs:
    using: composite
    steps:
        - name: Render test-speed overview
          shell: bash
          env:
              JEST_ARTIFACTS: ${{ inputs.artifacts }}
          run: |
              set -o pipefail
              bin/report-jest-timings --artifacts "$JEST_ARTIFACTS" --markdown-overview | tee -a "$GITHUB_STEP_SUMMARY"
        - name: Render individual test timings 1
          shell: bash
          env:
              JEST_ARTIFACTS: ${{ inputs.artifacts }}
              PAGE: 1
          run: bin/report-jest-timings --artifacts "$JEST_ARTIFACTS" --markdown-page "$PAGE" >> "$GITHUB_STEP_SUMMARY"
        - name: Render individual test timings 2
          shell: bash
          env:
              JEST_ARTIFACTS: ${{ inputs.artifacts }}
              PAGE: 2
          run: bin/report-jest-timings --artifacts "$JEST_ARTIFACTS" --markdown-page "$PAGE" >> "$GITHUB_STEP_SUMMARY"
        - name: Render individual test timings 3
          shell: bash
          env:
              JEST_ARTIFACTS: ${{ inputs.artifacts }}
              PAGE: 3
          run: bin/report-jest-timings --artifacts "$JEST_ARTIFACTS" --markdown-page "$PAGE" >> "$GITHUB_STEP_SUMMARY"
        - name: Render individual test timings 4
          shell: bash
          env:
              JEST_ARTIFACTS: ${{ inputs.artifacts }}
              PAGE: 4
          run: bin/report-jest-timings --artifacts "$JEST_ARTIFACTS" --markdown-page "$PAGE" >> "$GITHUB_STEP_SUMMARY"
        - name: Render individual test timings 5
          shell: bash
          env:
              JEST_ARTIFACTS: ${{ inputs.artifacts }}
              PAGE: 5
          run: bin/report-jest-timings --artifacts "$JEST_ARTIFACTS" --markdown-page "$PAGE" >> "$GITHUB_STEP_SUMMARY"
        - name: Render individual test timings 6
          shell: bash
          env:
              JEST_ARTIFACTS: ${{ inputs.artifacts }}
              PAGE: 6
          run: bin/report-jest-timings --artifacts "$JEST_ARTIFACTS" --markdown-page "$PAGE" >> "$GITHUB_STEP_SUMMARY"
        - name: Render individual test timings 7
          shell: bash
          env:
              JEST_ARTIFACTS: ${{ inputs.artifacts }}
              PAGE: 7
          run: bin/report-jest-timings --artifacts "$JEST_ARTIFACTS" --markdown-page "$PAGE" >> "$GITHUB_STEP_SUMMARY"
        - name: Render individual test timings 8
          shell: bash
          env:
              JEST_ARTIFACTS: ${{ inputs.artifacts }}
              PAGE: 8
          run: bin/report-jest-timings --artifacts "$JEST_ARTIFACTS" --markdown-page "$PAGE" >> "$GITHUB_STEP_SUMMARY"
        - name: Render individual test timings 9
          shell: bash
          env:
              JEST_ARTIFACTS: ${{ inputs.artifacts }}
              PAGE: 9
          run: bin/report-jest-timings --artifacts "$JEST_ARTIFACTS" --markdown-page "$PAGE" >> "$GITHUB_STEP_SUMMARY"
        - name: Render individual test timings 10
          shell: bash
          env:
              JEST_ARTIFACTS: ${{ inputs.artifacts }}
              PAGE: 10
          run: bin/report-jest-timings --artifacts "$JEST_ARTIFACTS" --markdown-page "$PAGE" >> "$GITHUB_STEP_SUMMARY"
        - name: Render individual test timings 11
          shell: bash
          env:
              JEST_ARTIFACTS: ${{ inputs.artifacts }}
              PAGE: 11
          run: bin/report-jest-timings --artifacts "$JEST_ARTIFACTS" --markdown-page "$PAGE" >> "$GITHUB_STEP_SUMMARY"
        - name: Render individual test timings 12
          shell: bash
          env:
              JEST_ARTIFACTS: ${{ inputs.artifacts }}
              PAGE: 12
          run: bin/report-jest-timings --artifacts "$JEST_ARTIFACTS" --markdown-page "$PAGE" >> "$GITHUB_STEP_SUMMARY"
        - name: Check summary pagination capacity
          shell: bash
          env:
              JEST_ARTIFACTS: ${{ inputs.artifacts }}
          run: |
              if [[ -n "$(bin/report-jest-timings --artifacts "$JEST_ARTIFACTS" --markdown-page 13)" ]]; then
                  echo "Jest report needs more than 12 summary pages; increase the page capacity." >&2
                  exit 1
              fi
