name: Docker meta and registry login
description: Log in to GHCR, DockerHub, and ECR, then generate standardized Docker image tags and labels.

inputs:
    image-name:
        required: true
        description: 'Image name without registry prefix (e.g., posthog-node, capture, llm-gateway)'
    aws-role-to-assume:
        required: false
        default: ''
        description: 'AWS IAM role ARN for ECR access. Required when push-to-ecr=true (the default).'
    github-token:
        required: true
        description: 'GitHub token for GHCR login'
    dockerhub-username:
        required: true
        description: 'DockerHub username'
    dockerhub-password:
        required: true
        description: 'DockerHub password/token'
    ecr-image-name:
        required: false
        default: ''
        description: 'ECR image name if different from image-name (e.g., posthog-cloud). Defaults to image-name.'
    legacy-images:
        required: false
        default: ''
        description: 'Additional legacy image destinations (newline-separated) to publish to during migration. Remove once consumers are updated to the standard paths.'
    push-to-dockerhub:
        required: false
        default: 'false'
        description: 'Whether to also push to DockerHub as posthog/<image-name>. Only needed for the main posthog-cloud image.'
    push-to-ghcr:
        required: false
        default: 'true'
        description: 'Whether to push to ghcr.io. Set to false to skip GHCR publishing.'
    push-to-ecr:
        required: false
        default: 'true'
        description: 'Whether to push to AWS ECR (and assume the AWS role). Set to false for images consumed only via GHCR (e.g. sandbox-host images Modal pulls directly). When false, the AWS configure-credentials + ECR-login steps are skipped, the ECR tag is omitted from the images list, and ecr-registry output is empty.'
    generate-ordered-release-tag:
        required: false
        default: 'false'
        description: 'Generate a source-ordered release tag for the default branch. Unshallowing registers origin as a promisor remote and marks the checkout as a partial clone; this is inert on ephemeral hosted runners but persists in self-hosted or reused checkouts.'

outputs:
    tags:
        description: 'Docker metadata tags'
        value: ${{ steps.meta.outputs.tags }}
    labels:
        description: 'Docker metadata labels'
        value: ${{ steps.meta.outputs.labels }}
    annotations:
        description: 'Docker metadata annotations'
        value: ${{ steps.annotations.outputs.value }}
    ecr-registry:
        description: 'ECR registry URL'
        value: ${{ steps.aws-ecr.outputs.registry }}
    ordered-release-tag:
        description: 'Source-ordered release tag, or empty when disabled or unavailable.'
        value: ${{ steps.ordered-release.outputs.tag }}

runs:
    using: 'composite'
    steps:
        - name: Configure AWS credentials
          if: inputs.push-to-ecr == 'true'
          uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
          with:
              role-to-assume: ${{ inputs.aws-role-to-assume }}
              aws-region: us-east-1

        - name: Login to Amazon ECR
          if: inputs.push-to-ecr == 'true'
          id: aws-ecr
          uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78 # v2.1.2

        - name: Login to ghcr.io
          uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
          with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ inputs.github-token }}
              logout: false

        - name: Login to DockerHub
          uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
          with:
              username: ${{ inputs.dockerhub-username }}
              password: ${{ inputs.dockerhub-password }}

        # Build the images list: standard paths + any legacy paths for backwards compatibility
        - name: Build images list
          id: images
          shell: bash
          run: |
              {
                echo "list<<EOF"
                if [ "$PUSH_TO_GHCR" = "true" ]; then
                  echo "ghcr.io/posthog/$IMAGE_NAME"
                fi
                if [ "$PUSH_TO_DOCKERHUB" = "true" ]; then
                  echo "posthog/$IMAGE_NAME"
                fi
                if [ "$PUSH_TO_ECR" = "true" ]; then
                  echo "$ECR_REGISTRY/${ECR_IMAGE_NAME:-$IMAGE_NAME}"
                fi
                if [ -n "$LEGACY_IMAGES" ]; then
                  echo "$LEGACY_IMAGES"
                fi
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
          env:
              IMAGE_NAME: ${{ inputs.image-name }}
              ECR_REGISTRY: ${{ steps.aws-ecr.outputs.registry }}
              LEGACY_IMAGES: ${{ inputs.legacy-images }}
              ECR_IMAGE_NAME: ${{ inputs.ecr-image-name }}
              PUSH_TO_DOCKERHUB: ${{ inputs.push-to-dockerhub }}
              PUSH_TO_GHCR: ${{ inputs.push-to-ghcr }}
              PUSH_TO_ECR: ${{ inputs.push-to-ecr }}

        - name: Extract commit metadata
          id: commit
          shell: bash
          env:
              EVENT_AUTHOR: ${{ github.event.head_commit.author.username }}
              EVENT_COMMITTER: ${{ github.event.head_commit.committer.username }}
              LC_ALL: C.UTF-8
          run: |
              set -euo pipefail
              subject="$(git log -1 --format=%s)"
              author="${EVENT_AUTHOR:-$(git log -1 --format=%an)}"
              committer="${EVENT_COMMITTER:-$(git log -1 --format=%cn)}"
              timestamp="$(TZ=UTC git show -s --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd HEAD)"
              if [ "${#subject}" -gt 160 ]; then
                subject="${subject:0:157}..."
              fi
              {
                echo "subject=${subject}"
                echo "author=${author}"
                echo "committer=${committer}"
                echo "timestamp=${timestamp}"
              } >> "$GITHUB_OUTPUT"

        - name: Docker meta
          id: meta
          uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
          env:
              DOCKER_METADATA_ANNOTATIONS_LEVELS: index
          with:
              images: ${{ steps.images.outputs.list }}
              tags: |
                  type=ref,event=pr
                  type=ref,event=branch
                  type=sha,format=long
                  type=raw,value=${{ github.sha }}
                  type=raw,value=latest,enable={{is_default_branch}}

        - name: Add commit annotations
          id: annotations
          shell: bash
          env:
              AUTHOR: ${{ steps.commit.outputs.author }}
              COMMITTER: ${{ steps.commit.outputs.committer }}
              MESSAGE: ${{ steps.commit.outputs.subject }}
              METADATA_ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
              TIMESTAMP: ${{ steps.commit.outputs.timestamp }}
          run: |
              set -euo pipefail
              {
                echo "value<<ANNOTATIONS_EOF"
                printf '%s\n' "$METADATA_ANNOTATIONS"
                printf 'index:com.posthog.image.author=%s\n' "$AUTHOR"
                printf 'index:com.posthog.image.committer=%s\n' "$COMMITTER"
                printf 'index:com.posthog.image.message=%s\n' "$MESSAGE"
                printf 'index:com.posthog.image.commit-timestamp=%s\n' "$TIMESTAMP"
                echo "ANNOTATIONS_EOF"
              } >> "$GITHUB_OUTPUT"

        - name: Fetch source history for ordered release tag
          id: ordered-history
          if: inputs.generate-ordered-release-tag == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          continue-on-error: true
          shell: bash
          run: |
              set -euo pipefail
              # The runner supplies -e; expected failures are captured explicitly.
              if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
                fetch_status=0
                timeout --kill-after=5s 40s git fetch \
                  --no-tags \
                  --prune \
                  --no-recurse-submodules \
                  --unshallow \
                  --filter=tree:0 \
                  origin \
                  "+${GITHUB_REF}:refs/remotes/origin/${GITHUB_REF_NAME}" || fetch_status=$?
                if [ "$fetch_status" -ne 0 ]; then
                  echo "::warning::Source history for the ordered release tag could not be fetched (status $fetch_status). The ordered release tag will be skipped."
                  exit 0
                fi
              fi

        - name: Compute ordered release tag
          id: ordered-release
          if: inputs.generate-ordered-release-tag == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          continue-on-error: true
          shell: bash
          env:
              ORDERED_RELEASE_TAG_REGEX: ^r[0-9]{12}-[0-9a-f]{6}$
          run: |
              set -uo pipefail
              echo "tag=" >> "$GITHUB_OUTPUT"

              if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" != "false" ]; then
                echo "::warning::Skipping ordered release tag because complete source history is unavailable"
                exit 0
              fi

              if ! head_revision="$(git rev-parse HEAD)" || [ "$head_revision" != "$GITHUB_SHA" ]; then
                echo "::warning::Skipping ordered release tag because the checked-out revision does not match GITHUB_SHA"
                exit 0
              fi

              if ! position="$(git rev-list --first-parent --count "$GITHUB_SHA")"; then
                echo "::warning::Skipping ordered release tag because the source position could not be computed"
                exit 0
              fi

              if ! [[ "$position" =~ ^[1-9][0-9]{0,11}$ ]]; then
                echo "::warning::Skipping ordered release tag because the source position is out of range"
                exit 0
              fi

              if ! printf -v tag 'r%012d-%.6s' "$position" "$GITHUB_SHA"; then
                echo "::warning::Skipping ordered release tag because the source position could not be formatted"
                exit 0
              fi

              if ! [[ "$tag" =~ $ORDERED_RELEASE_TAG_REGEX ]]; then
                echo "::warning::Skipping ordered release tag because $tag does not match the required format"
                exit 0
              fi

              echo "tag=${tag}" >> "$GITHUB_OUTPUT"
