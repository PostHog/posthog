name: Shared image releases
description: Inspect source policy and approved shared-image publication bindings
inputs:
    working-directory:
        description: Relative path to the executing repository checkout
        required: false
    shared-image-operation:
        description: Shared-image operation to execute
        required: false
        default: inspect
    shared-image-policy:
        description: Path to the canonical shared-image manifest in the executing checkout
        required: false
        default: .github/shared-image-releases.yaml
    shared-image-repository:
        description: Common build repository from workflow configuration
        required: true
    shared-image-registry:
        description: Approved common image registry from workflow configuration
        required: true
    shared-image-destination-registry:
        description: Approved destination registry from workflow configuration
        required: true
    shared-image-destinations:
        description: Infrastructure-approved JSON array of owner, repository, registry and replicas
        required: false
        default: '[]'
outputs:
    channels:
        description: Whether the policy has configured publication channels
    publication-results:
        description: JSON resolved publication bindings keyed by image and channel for inspect
runs:
    using: node24
    main: dist/index.js
