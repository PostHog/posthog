name: Compute affected Rust services
description: |
    Builds the affected-services binary (cached) and runs it to determine
    which crates and container images are affected by the current change.

inputs:
    event-name:
        description: github.event_name — controls how the base ref is resolved
        required: true
    pr-base-sha:
        description: 'Base SHA for PR / merge-group events'
        required: false
        default: ''
    push-before-sha:
        description: 'Previous HEAD for push events (github.event.before)'
        required: false
        default: ''
    base-ref:
        description: |
            A merge base the caller already resolved. When set, the action diffs
            against it and makes no compare call, so the package graph and a
            `changed-files` list from the caller share one base. A value that is
            not a full commit SHA rebuilds all.
        required: false
        default: ''
    rebuild-all:
        description: 'Force a full rebuild (skip diff analysis)'
        required: false
        default: 'false'
    changed-files:
        description: |
            Path to a newline-separated list of changed files. When set, the
            binary reads the change set from it instead of running git diff,
            so the caller's checkout needs no history. The base commit is then
            fetched on its own, at depth 1, for the old package graph.
        required: false
        default: ''
    token:
        description: Token for the compare API call that resolves the merge base.
        required: false
        default: ${{ github.token }}

outputs:
    crates:
        description: JSON array of affected crate names
        value: ${{ steps.compute.outputs.crates }}
    images:
        description: "Comma-separated affected image names (empty = all, 'none' = skip)"
        value: ${{ steps.compute.outputs.images }}
    rebuild-all:
        description: "'true' when every service needs rebuilding"
        value: ${{ steps.compute.outputs.rebuild_all }}

runs:
    using: composite
    steps:
        - name: Restore cached binary
          id: cache
          uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
          with:
              path: rust/target/release/affected-services
              key: affected-services-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/affected-services/**', 'rust/Cargo.lock') }}

        - name: Build on cache miss
          if: steps.cache.outputs.cache-hit != 'true'
          shell: bash
          working-directory: rust
          run: cargo build -p affected-services --release --locked

        - name: Save binary to cache
          # Save only on master — a PR ref's cache is scoped to that PR alone and
          # just evicts the shared one. PRs restore master's binary; PRs that touch
          # affected-services rebuild without saving. Matches setup-sccache/sqlx-cli.
          if: steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/master'
          uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
          with:
              path: rust/target/release/affected-services
              key: affected-services-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/affected-services/**', 'rust/Cargo.lock') }}

        - name: Compute affected services
          id: compute
          shell: bash
          env:
              EVENT_NAME: ${{ inputs.event-name }}
              PR_BASE_SHA: ${{ inputs.pr-base-sha }}
              PUSH_BEFORE_SHA: ${{ inputs.push-before-sha }}
              BASE_REF: ${{ inputs.base-ref }}
              FORCE_REBUILD: ${{ inputs.rebuild-all }}
              CHANGED_FILES: ${{ inputs.changed-files }}
              REPOSITORY: ${{ github.repository }}
              GH_TOKEN: ${{ inputs.token }}
          working-directory: rust
          run: |
              if [ "$FORCE_REBUILD" = "true" ]; then
                  echo "rebuild-all requested"
                  result=$(./target/release/affected-services --files rust/Cargo.lock)
              else
                  if [ -n "$BASE_REF" ]; then
                      if [[ "$BASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
                          base_ref="$BASE_REF"
                      else
                          echo "base-ref is not a commit SHA: $BASE_REF"
                          base_ref=""
                      fi
                  elif [ "$EVENT_NAME" = "push" ]; then
                      base_ref="$PUSH_BEFORE_SHA"
                  else
                      # Try to resolve the base branch name from the GitHub
                      # event payload so we diff against the current tip rather
                      # than the potentially stale PR base SHA.
                      base_branch=""
                      if [ -f "$GITHUB_EVENT_PATH" ]; then
                          base_branch=$(jq -r '.pull_request.base.ref // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
                      fi

                      if [ -n "$base_branch" ]; then
                          head_sha=$(git rev-parse HEAD)
                          # On an API error gh writes the error body to stdout, so
                          # only a full SHA counts as a merge base.
                          base_ref=$(gh api "repos/$REPOSITORY/compare/$base_branch...$head_sha?per_page=1" --jq '.merge_base_commit.sha' 2>/dev/null || true)
                          if [[ "$base_ref" =~ ^[0-9a-f]{40}$ ]]; then
                              echo "Using the merge base of $base_branch and HEAD from the compare API: $base_ref"
                          else
                              echo "The compare API gave no merge base; falling back to PR base SHA"
                              base_ref="$PR_BASE_SHA"
                          fi
                      else
                          base_ref="$PR_BASE_SHA"
                      fi
                  fi

                  if [ -z "$base_ref" ] || echo "$base_ref" | grep -qE '^0+$'; then
                      echo "No valid base ref — rebuilding all"
                      result=$(./target/release/affected-services --files rust/Cargo.lock)
                  else
                      if ! git cat-file -e "$base_ref^{commit}" 2>/dev/null; then
                          git fetch --no-tags --depth=1 --filter=blob:none origin "$base_ref" || true
                      fi
                      if [ -n "$CHANGED_FILES" ]; then
                          result=$(./target/release/affected-services --stdin --base-ref "$base_ref" < "$CHANGED_FILES")
                      else
                          result=$(./target/release/affected-services --base-ref "$base_ref")
                      fi
                  fi
              fi

              rebuild_all=$(echo "$result" | jq -r '.rebuild_all')
              crates=$(echo "$result" | jq -c '.crates')
              images=$(echo "$result" | jq -r '.images | join(",")')

              echo "rebuild_all=$rebuild_all, crates=$crates, images=$images"

              echo "rebuild_all=$rebuild_all" >> "$GITHUB_OUTPUT"
              echo "crates=$crates" >> "$GITHUB_OUTPUT"

              if [ "$rebuild_all" = "true" ]; then
                  echo "Rebuild all triggered"
                  echo "images=" >> "$GITHUB_OUTPUT"
              elif [ -z "$images" ]; then
                  echo "No images affected — build will be skipped"
                  echo "images=none" >> "$GITHUB_OUTPUT"
              else
                  echo "Affected images: $images"
                  echo "images=$images" >> "$GITHUB_OUTPUT"
              fi
