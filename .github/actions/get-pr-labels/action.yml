name: 'Get merged pull request labels'
shell: bash
description: 'Get the labels of the PR that was merged to create this push event'
inputs:
    token:
        description: 'GH token'
        required: true
outputs:
    labels:
        description: 'JSON array labels of the PR that was merged (if any)'
        value: ${{ steps.labels.outputs.labels }}
runs:
    using: 'composite'
    steps:
        - name: Get PR associated with the last commit
          id: pr-info
          shell: bash
          env:
              GITHUB_TOKEN: ${{ inputs.token }}
              SHA: ${{ github.sha }}
          run: |
              response="$RUNNER_TEMP/pr-info.json"
              for attempt in 1 2 3; do
                status=$(curl -sS --connect-timeout 10 -o "$response" -w '%{http_code}' \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/PostHog/posthog/commits/$SHA/pulls") || status=000
                case "$status" in
                  200)
                    { echo "data<<PR_INFO_EOF"; cat "$response"; echo; echo "PR_INFO_EOF"; } >> "$GITHUB_OUTPUT"
                    exit 0
                    ;;
                  404|422)
                    echo "::notice::$SHA is not a PostHog/posthog commit, so it has no PR labels."
                    exit 0
                    ;;
                esac
                echo "::warning::PR lookup attempt $attempt returned HTTP $status"
                sleep $((attempt * 10))
              done
              echo "::error::PR lookup failed with HTTP $status after 3 attempts"
              exit 1

        - name: Extract PR number
          shell: bash
          if: steps.pr-info.outputs.data
          id: extract-pr
          continue-on-error: true
          env:
              PR_DATA: ${{ toJSON(fromJSON(steps.pr-info.outputs.data)) }}
          run: |
              echo "PR_NUMBER=$(echo "$PR_DATA" | jq -r '.[-1].number')" >> $GITHUB_OUTPUT

        - name: Fetch PR Labels
          shell: bash
          id: labels
          env:
              GITHUB_TOKEN: ${{ inputs.token }}
              PR_NUMBER: ${{ steps.extract-pr.outputs.PR_NUMBER }}
              REPOSITORY: PostHog/posthog
          run: |
              if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
                echo labels="[]" >> $GITHUB_OUTPUT
                exit 0
              fi
              LABELS=$(curl -fsS --retry 5 --retry-max-time 60 --connect-timeout 10 \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/repos/$REPOSITORY/issues/$PR_NUMBER/labels | jq -rc '[.[].name]')
              echo "Labels of PR #$PR_NUMBER: $LABELS"

              echo labels="$LABELS" >> $GITHUB_OUTPUT
