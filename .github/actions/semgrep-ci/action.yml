name: Semgrep diff-aware scan
description: >
    Run `semgrep ci` in the digest-pinned Semgrep image. On pull requests semgrep
    resolves the merge-base with the base branch itself (GH_TOKEN fast path, then
    deepening fetches) and reports only findings the PR introduces; on pushes there
    is no baseline, so it runs a full scan. Runs logged out: nothing is uploaded to
    semgrep.dev, and any finding fails the step via the exit code.

inputs:
    image:
        description: Digest-pinned semgrep/semgrep Docker image
        required: true
    args:
        description: >
            Arguments for `semgrep ci` (--config, --include/--exclude, --exclude-rule,
            --jobs, ...). Split on whitespace, so values must not contain spaces,
            quotes or `#` (see the guard in the step below). Anchor --include/--exclude
            patterns with a leading slash (--include /bin); unanchored patterns also
            match same-named nested directories anywhere in the tree.
        required: true

runs:
    using: composite
    steps:
        - name: Run semgrep ci
          shell: bash
          env:
              SEMGREP_ARGS: ${{ inputs.args }}
              SEMGREP_IMAGE: ${{ inputs.image }}
              # Lets semgrep resolve the PR merge-base with one API call instead of
              # deepening fetches (cli/src/semgrep/meta.py GithubMeta._find_branchoff_point)
              GH_TOKEN: ${{ github.token }}
          # GithubMeta reads the GITHUB_* vars and the event payload to detect the
          # PR context; the baseline git operations need the checkout's persisted
          # auth from .git/config, and safe.directory because the workspace is
          # owned by the runner user while the container runs as root.
          run: |
              # A `#` anywhere in SEMGREP_ARGS silently truncates the scan.
              # Callers write the value as a YAML block scalar (`args: >-`), and
              # inside one a `#` is data, not a YAML comment. It survives into
              # this variable, which the last line splices into the
              # `sh -c "..."` string. That inner shell re-parses the string as a
              # SCRIPT -- which is what performs the documented whitespace split
              # into flags -- and `exec` then replaces the shell on the first
              # command it finds. So every token that ends a command truncates
              # the flag list: `#`, a newline, `;`, `&`, `|`. Semgrep loads
              # fewer configs, scans a narrower tree, and still exits 0.
              # Quoting is NOT the fix: `$SEMGREP_ARGS` already sits inside
              # double quotes, and quoting it again collapses every flag into a
              # single argument. An allowlist rather than a blocklist, because
              # the dangerous set is "whatever this shell's grammar treats as a
              # terminator", not a list anyone can keep current.
              # `hogli lint:workflows` (WF012) applies the same allowlist to a
              # caller's literal args; this catches a value a GitHub expression
              # interpolates in, which the linter cannot see.
              case "$SEMGREP_ARGS" in
                  *[!\ A-Za-z0-9._/@:=+-]*)
                      echo "::error title=semgrep-ci::args may contain only flags and [A-Za-z0-9._/@:=+-]; the container shell re-parses this value as a script, so a '#', newline, ';' or similar silently drops every flag after it"
                      exit 1
                      ;;
              esac

              docker run --rm \
                -v "$GITHUB_WORKSPACE:/src" -w /src \
                -v "$GITHUB_EVENT_PATH:/github-event.json:ro" \
                -e SEMGREP_ENABLE_VERSION_CHECK=false \
                -e GITHUB_ACTIONS -e GITHUB_EVENT_NAME -e GITHUB_EVENT_PATH=/github-event.json \
                -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL -e GITHUB_API_URL \
                -e GITHUB_SHA -e GITHUB_REF -e GITHUB_HEAD_REF -e GITHUB_RUN_ID \
                -e GITHUB_REPOSITORY_ID -e GITHUB_REPOSITORY_OWNER_ID \
                -e GH_TOKEN \
                "$SEMGREP_IMAGE" \
                sh -c "git config --global --add safe.directory /src && exec semgrep ci --metrics=off --verbose --timeout 300 $SEMGREP_ARGS"
