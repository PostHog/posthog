name: Setup sqlx-cli
description: |
    Installs sqlx-cli and adds it to PATH.
    Uses actions/cache to avoid recompiling from source on every run.
    The binary is pinned to a specific version for reproducibility.

inputs:
    version:
        description: 'sqlx-cli version to install (e.g. 0.8.0)'
        required: false
        default: '0.8.0'

runs:
    using: composite
    steps:
        - name: Restore sqlx-cli binary from cache
          id: cache-sqlx-cli
          uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
          with:
              path: ${{ runner.temp }}/sqlx-cli
              key: sqlx-cli-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}

        - name: Install Rust toolchain on cache miss
          # Building sqlx-cli from source needs the Rust toolchain, but a cache hit
          # skips the build, so only reach for the toolchain (and static.rust-lang.org)
          # when we actually have to compile. rustup fetches over the network, so retry
          # a dropped connection instead of failing the job on a single blip.
          if: steps.cache-sqlx-cli.outputs.cache-hit != 'true'
          shell: bash
          run: |
              set -euo pipefail
              for attempt in 1 2 3; do
                  if rustup toolchain install stable --profile minimal --component cargo --no-self-update; then
                      break
                  fi
                  if [ "$attempt" -eq 3 ]; then
                      echo "rustup toolchain install failed after $attempt attempts" >&2
                      exit 1
                  fi
                  delay=$((attempt * 15))
                  echo "rustup toolchain install attempt $attempt failed; retrying in ${delay}s..." >&2
                  sleep "$delay"
              done
              rustup default stable

        - name: Build sqlx-cli on cache miss
          if: steps.cache-sqlx-cli.outputs.cache-hit != 'true'
          shell: bash
          env:
              SQLX_CLI_VERSION: ${{ inputs.version }}
          run: |
              set -euo pipefail
              echo "Cache miss — building sqlx-cli v$SQLX_CLI_VERSION from source"

              cargo install sqlx-cli \
                --version "$SQLX_CLI_VERSION" \
                --features postgres \
                --no-default-features \
                --locked \
                --root "$RUNNER_TEMP/sqlx-cli"

              chmod +x "$RUNNER_TEMP/sqlx-cli/bin/sqlx"

        - name: Save sqlx-cli binary to cache
          if: steps.cache-sqlx-cli.outputs.cache-hit != 'true' && github.ref == 'refs/heads/master'
          uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
          with:
              path: ${{ runner.temp }}/sqlx-cli
              key: sqlx-cli-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}

        - name: Add sqlx-cli to PATH
          shell: bash
          run: |
              echo "$RUNNER_TEMP/sqlx-cli/bin" >> "$GITHUB_PATH"
              "$RUNNER_TEMP/sqlx-cli/bin/sqlx" --version
