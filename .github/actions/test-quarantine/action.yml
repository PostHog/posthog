name: Run the test quarantine CLI
description: |
    Runs `hogli test:quarantine` without installing the dev environment. The
    quarantine core is stdlib-only and the CLI needs only click, so quarantine
    jobs stay decoupled from lockfile health. Needs a full checkout.

inputs:
    args:
        description: Arguments for `hogli test:quarantine`, separated by spaces
        required: true

outputs:
    stdout:
        description: What the command printed to stdout
        value: ${{ steps.run.outputs.stdout }}

runs:
    using: composite
    steps:
        - name: Set up Python
          uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
          with:
              python-version-file: 'pyproject.toml'

        - name: Install uv
          uses: ./.github/actions/setup-uv
          with:
              enable-cache: 'false'

        - name: Run hogli test:quarantine
          id: run
          shell: bash
          env:
              ARGS: ${{ inputs.args }}
          run: |
              read -ra args <<< "$ARGS"
              stdout=$(PYTHONPATH=tools/hogli-commands uv run --no-project --with click python -m hogli_commands.quarantine.cli "${args[@]}")
              [ -z "$stdout" ] || printf '%s\n' "$stdout"
              {
                  echo 'stdout<<EOF'
                  [ -z "$stdout" ] || printf '%s\n' "$stdout"
                  echo 'EOF'
              } >> "$GITHUB_OUTPUT"
