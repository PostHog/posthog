name: Set up uv
description: Install the repository's pinned uv version and optionally restore its cache

inputs:
    enable-cache:
        description: Whether to use the uv cache
        default: auto
    cache-dependency-glob:
        description: Files used to calculate the uv cache key
        default: |
            **/*requirements*.txt
            **/*requirements*.in
            **/*constraints*.txt
            **/*constraints*.in
            **/pyproject.toml
            **/uv.lock
            **/*.py.lock
    save-cache:
        description: Whether to save the uv cache after the job
        default: 'true'

outputs:
    uv-version:
        description: The installed uv version
        value: ${{ steps.setup-uv.outputs.uv-version }}
    uv-path:
        description: The path to the installed uv binary
        value: ${{ steps.setup-uv.outputs.uv-path }}
    uvx-path:
        description: The path to the installed uvx binary
        value: ${{ steps.setup-uv.outputs.uvx-path }}
    cache-hit:
        description: Whether a matching cache entry was restored
        value: ${{ steps.setup-uv.outputs.cache-hit }}
    cache-key:
        description: The uv cache key
        value: ${{ steps.setup-uv.outputs.cache-key }}

runs:
    using: composite
    steps:
        - name: Install uv
          id: setup-uv
          uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
          with:
              version: '0.11.28' # Exact pins avoid GitHub API resolution for each concurrent job.
              enable-cache: ${{ inputs.enable-cache }}
              cache-dependency-glob: ${{ inputs.cache-dependency-glob }}
              save-cache: ${{ inputs.save-cache }}
