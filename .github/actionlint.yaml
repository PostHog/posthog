self-hosted-runner:
    labels:
        - depot-ubuntu-22.04
        - depot-ubuntu-22.04-4
        - depot-ubuntu-24.04
        - depot-ubuntu-24.04-4
        - depot-ubuntu-24.04-8
        - depot-macos-15
        - depot-macos-26
        - depot-ubuntu-24.04-arm-4
        - depot-windows-2022-4
        - ubuntu-24.04-8core

# The vendored .github/actions/paths-filter emits one output per filter name at
# runtime, but action.yml can only declare the static `changes` output, so
# actionlint's strict output typing false-positives on every per-filter output
# (e.g. steps.filter.outputs.backend). Upstream dorny/paths-filter avoided this
# only because actionlint's popular-actions database special-cases it. The
# `{changes: string}` anchor keeps this scoped to that action's output type.
#
# actionlint 1.7.12 rejects the `stacked` pull_request activity type, which GitHub
# dispatches when a PR joins a stack. Remove the ignore once actionlint lists it. Its
# pattern matches any path because CI lints flattened copies outside .github/workflows.
paths:
    '**/*.yml':
        ignore:
            - 'invalid activity type "stacked" for "pull_request" Webhook event'
    '.github/workflows/**/*.yml':
        ignore:
            - 'property ".+" is not defined in object type \{changes: string\}'
    '.github/workflows/**/*.yaml':
        ignore:
            - 'property ".+" is not defined in object type \{changes: string\}'
