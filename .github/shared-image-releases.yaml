version: 1
filters:
    dataWarehouse:
        # posthog/hogql* covers hogql and hogql_queries, which the shell gate
        # this replaces matched as one prefix.
        - 'posthog/hogql*/**'
        - 'products/warehouse_sources_queue/**'
        - 'posthog/temporal/data_modeling/**'
        - 'products/customer_analytics/backend/**'
        # The extract worker imports the whole warehouse_sources backend
        # (models, facade, scheduling, tasks) and the data_warehouse facade.
        - 'products/warehouse_sources/backend/**'
        - 'products/data_warehouse/backend/**'
        - 'posthog/warehouse/**'
        - Dockerfile
        - 'posthog/temporal/common/**'
        - 'posthog/management/commands/start_temporal_worker.py'
        - pyproject.toml
        - bin/temporal-django-worker
        - 'posthog/clickhouse/migrations/**'
    dataWarehouseMetadata:
        - 'posthog/hogql*/**'
        - 'posthog/temporal/data_modeling/**'
        - 'products/customer_analytics/backend/**'
        - 'products/warehouse_sources/backend/**'
        - 'posthog/temporal/common/**'
        - 'posthog/management/commands/start_temporal_worker.py'
        - pyproject.toml
        - bin/temporal-django-worker
        - 'posthog/clickhouse/migrations/**'
        - 'products/data_modeling/backend/**'
        - 'posthog/llm/**'
        - 'products/data_warehouse/backend/**'
        - 'posthog/personhog_client/**'
        - 'packages/personhog-proto/**'
        - 'posthog/kafka_client/**'
        - 'common/hogvm/**'
        - 'posthog/models/**'
        - 'posthog/migrations/**'
        - 'products/*/backend/migrations/**'
        - posthog/schema.py
        - 'posthog/settings/temporal.py'
        - posthog/exceptions.py
        - uv.lock
        - manage.py
        - Dockerfile
    experimentsRecalculationActivity:
        - 'products/experiments/backend/**'
        - 'products/experiments/stats/**'
        - 'posthog/hogql*/**'
        - 'posthog/clickhouse/**'
        - 'posthog/temporal/common/**'
        - 'posthog/management/commands/start_temporal_worker.py'
        - 'posthog/settings/temporal.py'
        - posthog/schema.py
        - 'posthog/models/**'
        - 'posthog/migrations/**'
        - 'products/*/backend/migrations/**'
        - posthog/exceptions.py
        - 'products/feature_flags/backend/**'
        - 'products/cohorts/backend/**'
        - 'products/analytics_platform/backend/lazy_computation/**'
        - 'products/ai_observability/backend/facade/**'
        - 'common/hogvm/**'
        - pyproject.toml
        - uv.lock
        - bin/temporal-django-worker
        - manage.py
        - Dockerfile
    alertsPlatformDelivery:
        - 'products/alerts_platform/backend/**'
        - 'products/logs/backend/**'
        - 'products/notifications/backend/**'
        - 'products/access_control/backend/facade/**'
        - 'products/alerts/backend/facade/destinations.py'
        - 'products/alerts/backend/logic/delivery_destinations.py'
        - 'products/alerts/backend/logic/destinations.py'
        - 'products/alerts/backend/logic/destination_configs.py'
        - 'products/alerts/backend/logic/alert_email.py'
        - 'products/alerts/backend/logic/alert_in_app.py'
        - 'products/signals/backend/**'
        - 'posthog/email.py'
        - 'posthog/templates/email/alert_platform_notification.html'
        - 'posthog/templates/email/base.html'
        - 'posthog/templates/email/styles.html'
        - 'posthog/slack/**'
        - 'posthog/egress/slack/**'
        - 'posthog/egress/observability/**'
        - 'posthog/security/**'
        - 'posthog/helpers/encrypted_fields.py'
        - 'posthog/kafka_client/**'
        - 'posthog/hogql*/**'
        - 'posthog/clickhouse/**'
        - 'posthog/temporal/common/**'
        - 'posthog/management/commands/start_temporal_worker.py'
        - 'posthog/settings/temporal.py'
        - posthog/schema.py
        - 'posthog/models/**'
        - 'posthog/migrations/**'
        - 'products/*/backend/migrations/**'
        - posthog/exceptions.py
        - 'common/hogvm/**'
        - pyproject.toml
        - uv.lock
        - bin/temporal-django-worker
        - manage.py
        - Dockerfile

images:
    posthog-cloud:
        channels:
            experiments-recalculation-activity:
                repository: posthog-temporal-workers/experiments-recalculation-activity
                filter: experimentsRecalculationActivity
                bootstrapPolicyDigest: a06fc277bfb801b6da6406ac2a8d0ed82ac09c13e1ac37234c8a4e01b44b1313
            data-warehouse-metadata:
                repository: posthog-temporal-workers/data-warehouse-metadata
                filter: dataWarehouseMetadata
                bootstrapPolicyDigest: 49975342dfa3dce5f0c4767e2bc90c295a7ce12cfb5daaa99075026f20dd3620
            alerts-platform-delivery:
                repository: posthog-temporal-workers/alerts-platform-delivery
                filter: alertsPlatformDelivery
                bootstrapPolicyDigest: 44aa81545fac7148bc440a10aee53985b48c90fbede9193f9da06c4928afdf19
