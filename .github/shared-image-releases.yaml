version: 1
filters:
    dataWarehouse:
        # posthog/hogql* covers hogql and hogql_queries, which the shell gate
        # this replaces matched as one prefix.
        - 'posthog/hogql*/**'
        - 'products/warehouse_sources_queue/**'
        - 'posthog/temporal/data_modeling/**'
        - 'products/customer_analytics/backend/**'
        # The extract worker imports the whole warehouse_sources backend
        # (models, facade, scheduling, tasks) and the data_warehouse facade.
        - 'products/warehouse_sources/backend/**'
        - 'products/data_warehouse/backend/**'
        - 'posthog/warehouse/**'
        - Dockerfile
        - 'posthog/temporal/common/**'
        - 'posthog/management/commands/start_temporal_worker.py'
        - pyproject.toml
        - bin/temporal-django-worker
        - 'posthog/clickhouse/migrations/**'
    dataWarehouseMetadata:
        - 'posthog/hogql*/**'
        - 'posthog/temporal/data_modeling/**'
        - 'products/customer_analytics/backend/**'
        - 'products/warehouse_sources/backend/**'
        - 'posthog/temporal/common/**'
        - 'posthog/management/commands/start_temporal_worker.py'
        - pyproject.toml
        - bin/temporal-django-worker
        - 'posthog/clickhouse/migrations/**'
        - 'products/data_modeling/backend/**'
        - 'posthog/llm/**'
        - 'products/data_warehouse/backend/**'
        - 'posthog/personhog_client/**'
        - 'packages/personhog-proto/**'
        - 'posthog/kafka_client/**'
        - 'common/hogvm/**'
        - 'posthog/models/**'
        - 'posthog/migrations/**'
        - 'products/*/backend/migrations/**'
        - posthog/schema.py
        - 'posthog/settings/temporal.py'
        - posthog/exceptions.py
        - uv.lock
        - manage.py
        - Dockerfile
    experimentsRecalculationActivity:
        - 'products/experiments/backend/**'
        - 'products/experiments/stats/**'
        - 'posthog/hogql*/**'
        - 'posthog/clickhouse/**'
        - 'posthog/temporal/common/**'
        - 'posthog/management/commands/start_temporal_worker.py'
        - 'posthog/settings/temporal.py'
        - posthog/schema.py
        - 'posthog/models/**'
        - 'posthog/migrations/**'
        - 'products/*/backend/migrations/**'
        - posthog/exceptions.py
        - 'products/feature_flags/backend/**'
        - 'products/cohorts/backend/**'
        - 'products/analytics_platform/backend/lazy_computation/**'
        - 'products/ai_observability/backend/facade/**'
        - 'common/hogvm/**'
        - pyproject.toml
        - uv.lock
        - bin/temporal-django-worker
        - manage.py
        - Dockerfile
    alertsPlatformEvaluation:
        - 'products/alerts_platform/backend/**'
        - 'products/alerts/backend/**'
        - 'products/logs/backend/**'
        - 'products/billing_alerts/backend/**'
        - products/warehouse_sources/backend/facade/temporal.py
        - products/warehouse_sources/backend/temporal/sync_alert_evaluate.py
        - 'products/warehouse_sources/backend/sync_alerts/**'
        - 'products/warehouse_sources/backend/models/**'
        - products/warehouse_sources/backend/presentation/views/external_data_source/helpers.py
        - products/warehouse_sources/backend/facade/source_inputs.py
        - products/warehouse_sources/backend/logic/source_inputs.py
        - products/warehouse_sources/backend/temporal/data_imports/sources/__init__.py
        - products/warehouse_sources/backend/temporal/data_imports/sources/common/registry.py
        - 'products/warehouse_sources/backend/temporal/data_imports/sources/*/source.py'
        - 'posthog/temporal/alerts/**'
        - 'posthog/tasks/alerts/**'
        - 'posthog/hogql*/**'
        - 'posthog/clickhouse/**'
        - 'posthog/caching/**'
        - 'posthog/query_cache/**'
        - 'posthog/api/services/**'
        - 'posthog/schema_migrations/**'
        - 'products/product_analytics/backend/models/**'
        - products/product_analytics/backend/facade/models.py
        - products/product_analytics/backend/facade/queries.py
        - 'products/product_analytics/backend/hogql_queries/trends/**'
        - 'products/product_analytics/backend/hogql_queries/funnels/**'
        - products/metrics/backend/hogql_queries/metrics_query_runner.py
        - 'products/metrics/backend/facade/**'
        - 'products/metrics/backend/*.py'
        - products/metrics/backend/dashboard_import/promql_text.py
        - 'products/cdp/backend/models/**'
        - products/cdp/backend/facade/models.py
        - products/cdp/backend/internal_events.py
        - 'products/exports/backend/facade/**'
        - 'products/exports/backend/models/**'
        - products/exports/backend/tasks/failure_handler.py
        - posthog/temporal/exports/workflows.py
        - 'posthog/storage/**'
        - 'ee/billing/**'
        - posthog/cloud_utils.py
        - posthog/redis.py
        - posthog/sync.py
        - posthog/errors.py
        - 'common/hogvm/**'
        - 'posthog/temporal/common/**'
        - 'posthog/management/commands/start_temporal_worker.py'
        - 'posthog/settings/temporal.py'
        - posthog/schema.py
        - 'posthog/models/**'
        - 'posthog/migrations/**'
        - 'products/*/backend/migrations/**'
        - posthog/exceptions.py
        - pyproject.toml
        - uv.lock
        - bin/temporal-django-worker
        - manage.py
        - Dockerfile

images:
    posthog-cloud:
        channels:
            experiments-recalculation-activity:
                repository: posthog-temporal-workers/experiments-recalculation-activity
                filter: experimentsRecalculationActivity
                bootstrapPolicyDigest: a06fc277bfb801b6da6406ac2a8d0ed82ac09c13e1ac37234c8a4e01b44b1313
            data-warehouse-metadata:
                repository: posthog-temporal-workers/data-warehouse-metadata
                filter: dataWarehouseMetadata
                bootstrapPolicyDigest: 49975342dfa3dce5f0c4767e2bc90c295a7ce12cfb5daaa99075026f20dd3620
            alerts-platform-evaluation:
                repository: posthog-temporal-workers/alerts-platform-evaluation
                filter: alertsPlatformEvaluation
                bootstrapPolicyDigest: cd03bf84d1f15710421e83d4cd0d5442e0a83715a0c7cdd6d99496fecc79bf39
