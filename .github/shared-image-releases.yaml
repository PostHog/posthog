version: 1
filters:
    dataWarehouse:
        # posthog/hogql* covers hogql and hogql_queries, which the shell gate
        # this replaces matched as one prefix.
        - 'posthog/hogql*/**'
        - 'products/warehouse_sources_queue/**'
        - 'posthog/temporal/data_modeling/**'
        - 'products/customer_analytics/backend/**'
        # The extract worker imports the whole warehouse_sources backend
        # (models, facade, scheduling, tasks) and the data_warehouse facade.
        - 'products/warehouse_sources/backend/**'
        - 'products/data_warehouse/backend/**'
        - 'posthog/warehouse/**'
        - Dockerfile
        - 'posthog/temporal/common/**'
        - 'posthog/management/commands/start_temporal_worker.py'
        - pyproject.toml
        - bin/temporal-django-worker
        - 'posthog/clickhouse/migrations/**'
    experimentsRecalculationActivity:
        - 'products/experiments/backend/**'
        - 'products/experiments/stats/**'
        - 'posthog/hogql*/**'
        - 'posthog/clickhouse/**'
        - 'posthog/temporal/common/**'
        - 'posthog/management/commands/start_temporal_worker.py'
        - 'posthog/settings/temporal.py'
        - pyproject.toml
        - uv.lock
        - bin/temporal-django-worker
        - manage.py
        - Dockerfile

images:
    posthog-cloud:
        channels:
            experiments-recalculation-activity:
                repository: posthog-temporal-workers/experiments-recalculation-activity
                filter: experimentsRecalculationActivity
                bootstrapPolicyDigest: 888b34ce50bec1c78cdd2550f40fbc2dce8b3576716da71b042f92ecc83d17b2
