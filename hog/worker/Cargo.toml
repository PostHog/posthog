# hog-worker: the file work of `hog error-tracking`, in the Rust that posthog-cli runs. It ships
# next to the hog binary. A workspace of its own, so it builds and releases without cli/.
[workspace]
members = ["."]
resolver = "2"

[package]
name = "hog-worker"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "hog-worker"
path = "src/main.rs"

# The crates that decide a written byte are pinned with `=` to the versions in cli/Cargo.lock,
# because a symbol set must hash the same from either CLI. test/parity/worker-pins.test.ts fails
# until both sides name the same version.
[dependencies]
anyhow = "1.0.100"
dunce = "1.0.5"
# zip deflates through flate2's C zlib backend. Built from the source libz-sys carries, so every
# platform deflates the same way and none needs a zlib of its own.
libz-sys = { version = "=1.1.25", features = ["static"] }
magic_string = "=0.3.4"
posthog-symbol-data = "=0.5.2"
proguard = "=5.7.0"
rayon = "1.11.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
sourcemap = "=9.2.2"
symbolic = { version = "=12.17.2", features = ["debuginfo"] }
urlencoding = "=2.1.3"
# posthog-symbol-data compresses with this crate, so its version decides the bytes of a container.
zstd = "=0.13.5"
uuid = { version = "=1.18.1", features = ["v4", "v5", "v7"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate", "deflate-zlib"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
