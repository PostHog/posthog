name: Publish backend coverage from Depot

# pull_request_target runs this file from the base branch. Never check out or execute the PR.
# The PR-controlled Backend CI workflow may only upload inert report data; this workflow validates
# and renders it with base code before minting a token that can write the shared CI report comment.
#
# Before merge, add three Depot secret variants with no broader fallback. Scope each to repository
# posthog/posthog, branch master, and workflow ci-backend-coverage-report.yml:
# - DEPOT_CI_COVERAGE_TOKEN: a Depot org token that can list workflows and download artifacts
# - GH_APP_POSTHOG_TESTS_COVERAGE_APP_ID: the tests-posthog App client ID
# - GH_APP_POSTHOG_TESTS_COVERAGE_PRIVATE_KEY: the tests-posthog App private key
# nosemgrep: semgrep.rules.github-actions-pull-request-target
on:
    pull_request_target:
        branches: [master]
        types: [opened, synchronize, reopened, ready_for_review]

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: depot-backend-coverage-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    publish:
        name: Publish backend coverage
        if: >-
            github.event.pull_request.draft == false &&
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 105
        steps:
            - name: Set up Depot CLI
              uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1

            - name: Download inert coverage report data
              id: report
              env:
                  DEPOT_TOKEN: ${{ secrets.DEPOT_CI_COVERAGE_TOKEN }}
                  REPOSITORY: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  REPORT_ARCHIVE: ${{ runner.temp }}/coverage-report-data.zip
              run: |
                  set -euo pipefail
                  if [ -z "$DEPOT_TOKEN" ]; then
                      echo "::error::DEPOT_CI_COVERAGE_TOKEN is not configured for this trusted workflow"
                      exit 1
                  fi

                  deadline=$((SECONDS + 100 * 60))
                  terminal_polls=0
                  while (( SECONDS < deadline )); do
                      workflows=$(depot ci workflow list --repo "$REPOSITORY" --pr "$PR_NUMBER" \
                          --sha "$HEAD_SHA" --name 'Backend CI on Depot' --trigger pull_request -n 5 -o json)
                      workflow=$(jq -c --arg sha "$HEAD_SHA" \
                          '[.[] | select(.head_sha == $sha and .workflow_path == "ci-backend.yml")] | max_by(.created_at) // empty' \
                          <<<"$workflows")
                      if [ -z "$workflow" ]; then
                          sleep 15
                          continue
                      fi

                      run_id=$(jq -r '.run_id' <<<"$workflow")
                      artifacts=$(depot ci artifacts list "$run_id" -o json)
                      artifact=$(jq -c \
                          '[.artifacts[] | select(.name == "coverage-report-data" and .job_key == "ci-backend.yml:backend-coverage-report")] | max_by(.attempt) // empty' \
                          <<<"$artifacts")
                      if [ -n "$artifact" ]; then
                          size=$(jq -r '.size_bytes' <<<"$artifact")
                          if (( size > 2097152 )); then
                              echo "::error::Coverage report artifact is larger than 2 MiB"
                              exit 1
                          fi
                          depot ci artifacts download "$(jq -r '.artifact_id' <<<"$artifact")" \
                              --output-file "$REPORT_ARCHIVE"
                          echo "available=true" >> "$GITHUB_OUTPUT"
                          break
                      fi

                      case $(jq -r '.status' <<<"$workflow") in
                          finished|failed|cancelled)
                              terminal_polls=$((terminal_polls + 1))
                              if (( terminal_polls >= 4 )); then
                                  echo "No coverage report artifact was produced by Depot; skipping publish."
                                  echo "available=false" >> "$GITHUB_OUTPUT"
                                  exit 0
                              fi
                              ;;
                          *) terminal_polls=0 ;;
                      esac
                      sleep 15
                  done

                  if [ ! -f "$REPORT_ARCHIVE" ]; then
                      echo "::error::Depot did not produce coverage report data within 100 minutes"
                      exit 1
                  fi

            - name: Validate report archive
              if: steps.report.outputs.available == 'true'
              env:
                  REPORT_ARCHIVE: ${{ runner.temp }}/coverage-report-data.zip
                  REPORT_DATA: ${{ runner.temp }}/coverage-report-data.json
              run: |
                  python3 - "$REPORT_ARCHIVE" "$REPORT_DATA" <<'PY'
                  import sys
                  import zipfile
                  from pathlib import Path

                  archive, output = map(Path, sys.argv[1:])
                  with zipfile.ZipFile(archive) as uploaded:
                      entries = [entry for entry in uploaded.infolist() if not entry.is_dir()]
                      if len(entries) != 1 or entries[0].filename != "coverage-report-data.json":
                          raise SystemExit("coverage artifact must contain only coverage-report-data.json")
                      if entries[0].file_size > 2 * 1024 * 1024:
                          raise SystemExit("coverage report data is larger than 2 MiB")
                      output.write_bytes(uploaded.read(entries[0]))
                  PY

            - name: Check out trusted publisher # nosemgrep: yaml.github-actions.security.pull-request-target-code-checkout.pull-request-target-code-checkout
              if: steps.report.outputs.available == 'true'
              # v6.0.2 checks out only the trusted base SHA below, never pull request code.
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  sparse-checkout: |
                      .github/scripts/coverage_report.py
                      .github/scripts/post-coverage-section.mjs
                      frontend/bin/ci-report/update-ci-report.mjs
                      .nvmrc
                  sparse-checkout-cone-mode: false
                  persist-credentials: false

            - name: Set up uv
              if: steps.report.outputs.available == 'true'
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.12.13'

            - name: Render validated report data
              if: steps.report.outputs.available == 'true'
              env:
                  REPORT_DATA: ${{ runner.temp }}/coverage-report-data.json
                  REPORT_BODY: ${{ runner.temp }}/coverage-comment.md
                  PATCH_DATA: ${{ runner.temp }}/patch-coverage.json
              run: |
                  uv run --script .github/scripts/coverage_report.py \
                      --report-data-in "$REPORT_DATA" \
                      --patch-json-out "$PATCH_DATA" \
                      --out "$REPORT_BODY"

            - name: Set up Node.js
              if: steps.report.outputs.available == 'true'
              uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version-file: .nvmrc

            - name: Mint CI report comment token
              id: report-token
              if: steps.report.outputs.available == 'true'
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_POSTHOG_TESTS_COVERAGE_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_TESTS_COVERAGE_PRIVATE_KEY }}
                  permission-pull-requests: write

            - name: Post to CI report comment
              if: steps.report.outputs.available == 'true'
              env:
                  GITHUB_TOKEN: ${{ steps.report-token.outputs.token }}
                  REPORT_BODY: ${{ runner.temp }}/coverage-comment.md
                  PATCH_DATA: ${{ runner.temp }}/patch-coverage.json
              run: node .github/scripts/post-coverage-section.mjs "$REPORT_BODY" "$PATCH_DATA"
