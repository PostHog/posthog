name: Privileged Depot backend controls

# This trigger uses the default branch version of the workflow. Never check out or execute
# pull request code here because this workflow receives write credentials.
# nosemgrep: semgrep.rules.github-actions-pull-request-target
on:
    pull_request_target:
        types: [opened, synchronize, reopened, ready_for_review]

concurrency:
    # A bot commit triggers the next SHA before this run posts its evidence.
    group: privileged-depot-backend-controls-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
    cancel-in-progress: true

permissions:
    checks: read
    contents: read
    pull-requests: read

jobs:
    route:
        name: Confirm Depot backend handoff
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 12
        outputs:
            depot: ${{ steps.route.outputs.depot || 'false' }}
        steps:
            - name: Wait for Depot handoff
              id: route
              env:
                  EVENT_AT: ${{ github.event.pull_request.updated_at }}
                  GH_TOKEN: ${{ github.token }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  deadline=$((SECONDS + 600))
                  while [ "$SECONDS" -lt "$deadline" ]; do
                      state=$(gh api -X GET "repos/$REPO/commits/$HEAD_SHA/check-runs" \
                          -f check_name='Hand off backend tests to Depot CI' -f per_page=100 \
                          | jq -r --arg since "$EVENT_AT" --argjson pr "$PR_NUMBER" \
                              '[.check_runs[] | select((.started_at // "") >= $since and any(.pull_requests[]?; .number == $pr))] | max_by(.id) | if . == null then "" elif .status == "completed" then .conclusion // "" else .status end')
                      case "$state" in
                          success)
                              echo "depot=true" >> "$GITHUB_OUTPUT"
                              exit 0
                              ;;
                          ""|queued|in_progress|pending|waiting|requested) sleep 15 ;;
                          *)
                              echo "Backend CI stayed on GitHub Actions (handoff: $state)."
                              exit 0
                              ;;
                      esac
                  done
                  echo "::warning::Backend handoff did not settle within 10 minutes"

    commit-snapshots:
        name: Commit backend snapshots
        needs: [route]
        if: needs.route.outputs.depot == 'true'
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 35
        steps:
            - name: Set up Depot CLI
              uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1

            - name: Download backend snapshot update
              id: artifact
              env:
                  DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
                  DEPOT_APP_ID: '219785'
                  EVENT_AT: ${{ github.event.pull_request.updated_at }}
                  GH_TOKEN: ${{ github.token }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  [ -n "$DEPOT_TOKEN" ] || { echo "::error::DEPOT_TOKEN is not available to the trusted workflow"; exit 1; }

                  snapshot_check_state() {
                      gh api -X GET "repos/$REPO/commits/$HEAD_SHA/check-runs" \
                          -f check_name='Backend CI on Depot / Commit snapshot changes' \
                          -f app_id="$DEPOT_APP_ID" -f per_page=100 \
                          | jq -r --arg since "$EVENT_AT" --argjson pr "$PR_NUMBER" \
                              '[.check_runs[] | select((.started_at // "") >= $since and any(.pull_requests[]?; .number == $pr))] | max_by(.id) | if . == null then "" elif .status == "completed" then .conclusion // "" else .status end'
                  }

                  terminal_polls=0
                  deadline=$((SECONDS + 1500))
                  while [ "$SECONDS" -lt "$deadline" ]; do
                      workflows=$(depot ci workflow list --repo "$REPO" --pr "$PR_NUMBER" --sha "$HEAD_SHA" \
                          --status queued --status running --status finished --status failed --status cancelled -n 20 -o json)
                      while read -r run_id; do
                          [ -n "$run_id" ] || continue
                          artifacts=$(depot ci artifacts list "$run_id" -o json)
                          artifact=$(jq -r --arg name "snapshot-update-$HEAD_SHA" \
                              '[.artifacts[] | select(.workflow_path == "ci-backend.yml" and .job_key == "handle-snapshots" and .name == $name)] | max_by(.created_at) | if . == null then "" else "\(.artifact_id)\t\(.size_bytes)" end' \
                              <<< "$artifacts")
                          if [ -n "$artifact" ]; then
                              artifact_id=${artifact%%$'\t'*}
                              artifact_size=${artifact#*$'\t'}
                              if [ "$artifact_size" -gt 52428800 ]; then
                                  echo "::error::Snapshot update artifact exceeds 50 MiB"
                                  exit 1
                              fi
                              depot ci artifacts download "$artifact_id" --output-file "$RUNNER_TEMP/snapshot-update.zip"
                              echo "found=true" >> "$GITHUB_OUTPUT"
                              exit 0
                          fi
                      done < <(jq -r '[.[] | select(.workflow_path == "ci-backend.yml")] | sort_by(.created_at) | reverse | .[].run_id' <<< "$workflows")

                      state=$(snapshot_check_state)
                      case "$state" in
                          success|failure|cancelled|skipped)
                              terminal_polls=$((terminal_polls + 1))
                              if [ "$terminal_polls" -ge 3 ]; then
                                  echo "Snapshot handling finished without an update (conclusion: $state)."
                                  exit 0
                              fi
                              ;;
                          *) terminal_polls=0 ;;
                      esac
                      sleep 15
                  done
                  echo "::error::No terminal snapshot result for $HEAD_SHA within 25 minutes"
                  exit 1

            - name: Validate backend snapshot update
              id: validate
              if: steps.artifact.outputs.found == 'true'
              env:
                  BRANCH: ${{ github.event.pull_request.head.ref }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  zip="$RUNNER_TEMP/snapshot-update.zip"
                  update="$RUNNER_TEMP/snapshot-update.json"
                  mapfile -t entries < <(zipinfo -1 "$zip")
                  if [ "${#entries[@]}" -ne 1 ] || [ "${entries[0]}" != "snapshot-update.json" ]; then
                      echo "::error::Snapshot update artifact must contain only snapshot-update.json"
                      exit 1
                  fi
                  set +o pipefail
                  unzip -p "$zip" snapshot-update.json | dd of="$update" bs=1048576 count=51 status=none
                  unzip_status=${PIPESTATUS[0]}
                  set -o pipefail
                  [ "$(wc -c < "$update")" -le 52428800 ] || { echo "::error::Snapshot update exceeds 50 MiB"; exit 1; }
                  [ "$unzip_status" -eq 0 ] || { echo "::error::Snapshot update archive is invalid"; exit 1; }

                  jq -e \
                      --arg repo "$REPO" --argjson pr "$PR_NUMBER" --arg branch "$BRANCH" --arg head "$HEAD_SHA" '
                          type == "object" and
                          ((keys | sort) == (["additions", "branch", "changes", "deletions", "head_sha", "pull_request", "repository", "version"] | sort)) and
                          .version == 1 and .repository == $repo and .pull_request == $pr and .branch == $branch and .head_sha == $head and
                          (.changes | type == "object" and (.added | type == "number") and (.modified | type == "number") and (.deleted | type == "number") and (.total | type == "number") and .total > 0 and .total == (.added + .modified + .deleted)) and
                          (.additions | type == "array") and (.deletions | type == "array") and
                          ((.additions | length) + (.deletions | length) == .changes.total) and
                          ((.additions | length) + (.deletions | length) <= 500) and
                          all(.additions[]; type == "object" and ((keys | sort) == ["contents", "path", "sha256"]) and (.path | type == "string") and (.contents | type == "string") and (.sha256 | test("^[0-9a-f]{64}$"))) and
                          all(.deletions[]; type == "object" and (keys == ["path"]) and (.path | type == "string")) and
                          ([.additions[].path, .deletions[].path] | length) == ([.additions[].path, .deletions[].path] | unique | length) and
                          all((.additions[].path, .deletions[].path); test("^(ee|posthog|products)/[A-Za-z0-9_./-]+\\.ambr$"))
                      ' "$update" > /dev/null || { echo "::error::Snapshot update metadata or paths are invalid"; exit 1; }

                  total=0
                  count=$(jq '.additions | length' "$update")
                  for ((i = 0; i < count; i++)); do
                      jq -r ".additions[$i].contents" "$update" > "$RUNNER_TEMP/snapshot-content.b64"
                      base64 -d "$RUNNER_TEMP/snapshot-content.b64" > "$RUNNER_TEMP/snapshot-content"
                      expected=$(jq -r ".additions[$i].sha256" "$update")
                      actual=$(sha256sum "$RUNNER_TEMP/snapshot-content" | cut -d' ' -f1)
                      [ "$actual" = "$expected" ] || { echo "::error::Snapshot content checksum mismatch"; exit 1; }
                      total=$((total + $(stat -c '%s' "$RUNNER_TEMP/snapshot-content")))
                  done
                  [ "$total" -le 36700160 ] || { echo "::error::Decoded snapshot update exceeds 35 MiB"; exit 1; }
                  echo "valid=true" >> "$GITHUB_OUTPUT"

            - name: Checkout trusted CI report code
              if: steps.validate.outputs.valid == 'true'
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ github.sha }}
                  sparse-checkout-cone-mode: false
                  sparse-checkout: |
                      .github/scripts/post-snapshot-section.mjs
                      frontend/bin/ci-report/update-ci-report.mjs
                      .nvmrc

            - name: Set up Node.js
              if: steps.validate.outputs.valid == 'true'
              uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version-file: .nvmrc
                  token: ${{ github.token }}

            - name: Get app token for snapshot commit and report
              if: steps.validate.outputs.valid == 'true'
              id: snapshot-app-token
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_POSTHOG_TESTS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_TESTS_PRIVATE_KEY }}

            - name: Commit backend snapshots and update the CI report
              if: steps.validate.outputs.valid == 'true'
              env:
                  BRANCH: ${{ github.event.pull_request.head.ref }}
                  GH_TOKEN: ${{ steps.snapshot-app-token.outputs.token }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  update="$RUNNER_TEMP/snapshot-update.json"
                  pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
                  current=$(jq -r '.head.sha' <<< "$pr")
                  jq -e --arg repo "$REPO" --arg branch "$BRANCH" '
                      .state == "open" and .head.repo.full_name == $repo and .head.ref == $branch
                  ' <<< "$pr" > /dev/null || { echo "::error::Pull request identity changed before the snapshot commit"; exit 1; }

                  if [ "$current" != "$HEAD_SHA" ]; then
                      node .github/scripts/post-snapshot-section.mjs backend skip '{}' "$REPO" "$HEAD_SHA" "$current"
                      echo "Branch advanced to $current; skipped snapshot commit for $HEAD_SHA"
                      exit 0
                  fi

                  gh pr merge --disable-auto "$PR_NUMBER" --repo "$REPO" || echo "Auto-merge was not enabled"
                  query="mutation(\$input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: \$input) { commit { oid } } }"
                  jq -n \
                      --arg query "$query" --arg repo "$REPO" --arg branch "$BRANCH" --arg head "$HEAD_SHA" \
                      --slurpfile update "$update" '
                          {query: $query, variables: {input: {
                              branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                              expectedHeadOid: $head,
                              message: {headline: "test(backend): update query snapshots"},
                              fileChanges: {additions: [$update[0].additions[] | {path, contents}], deletions: $update[0].deletions}
                          }}}
                      ' > "$RUNNER_TEMP/snapshot-commit.json"
                  response=$(gh api graphql --input "$RUNNER_TEMP/snapshot-commit.json")
                  commit=$(jq -er '.data.createCommitOnBranch.commit.oid' <<< "$response")
                  verified=$(gh api "repos/$REPO/commits/$commit" --jq '.commit.verification.verified')
                  [ "$verified" = true ] || { echo "::error::GitHub did not verify snapshot commit $commit"; exit 1; }
                  changes=$(jq -c '.changes' "$update")
                  node .github/scripts/post-snapshot-section.mjs backend update "$changes" "$REPO" "$HEAD_SHA" "$commit"
                  echo "::notice::Snapshots were committed in $commit. This run fails to require review."
                  exit 1

    commit-openapi-types:
        name: Commit generated OpenAPI types
        needs: [route, commit-snapshots]
        if: always() && needs.route.outputs.depot == 'true' && needs.commit-snapshots.result == 'success'
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 35
        steps:
            - name: Set up Depot CLI
              uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1

            - name: Download generated OpenAPI types
              id: artifact
              env:
                  DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
                  DEPOT_APP_ID: '219785'
                  EVENT_AT: ${{ github.event.pull_request.updated_at }}
                  GH_TOKEN: ${{ github.token }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  [ -n "$DEPOT_TOKEN" ] || { echo "::error::DEPOT_TOKEN is not available to the trusted workflow"; exit 1; }

                  openapi_check_state() {
                      gh api -X GET "repos/$REPO/commits/$HEAD_SHA/check-runs" \
                          -f check_name='Backend CI on Depot / Validate OpenAPI types' \
                          -f app_id="$DEPOT_APP_ID" -f per_page=100 \
                          | jq -r --arg since "$EVENT_AT" --argjson pr "$PR_NUMBER" \
                              '[.check_runs[] | select((.started_at // "") >= $since and any(.pull_requests[]?; .number == $pr))] | max_by(.id) | if . == null then "" elif .status == "completed" then .conclusion // "" else .status end'
                  }

                  terminal_polls=0
                  deadline=$((SECONDS + 1500))
                  while [ "$SECONDS" -lt "$deadline" ]; do
                      workflows=$(depot ci workflow list --repo "$REPO" --pr "$PR_NUMBER" --sha "$HEAD_SHA" \
                          --status queued --status running --status finished --status failed --status cancelled -n 20 -o json)
                      while read -r run_id; do
                          [ -n "$run_id" ] || continue
                          artifacts=$(depot ci artifacts list "$run_id" -o json)
                          artifact=$(jq -r --arg name "openapi-update-$HEAD_SHA" \
                              '[.artifacts[] | select(.workflow_path == "ci-backend.yml" and .job_key == "check-openapi-types" and .name == $name)] | max_by(.created_at) | if . == null then "" else "\(.artifact_id)\t\(.size_bytes)" end' \
                              <<< "$artifacts")
                          if [ -n "$artifact" ]; then
                              artifact_id=${artifact%%$'\t'*}
                              artifact_size=${artifact#*$'\t'}
                              if [ "$artifact_size" -gt 52428800 ]; then
                                  echo "::error::OpenAPI update artifact exceeds 50 MiB"
                                  exit 1
                              fi
                              depot ci artifacts download "$artifact_id" --output-file "$RUNNER_TEMP/openapi-update.zip"
                              echo "found=true" >> "$GITHUB_OUTPUT"
                              exit 0
                          fi
                      done < <(jq -r '[.[] | select(.workflow_path == "ci-backend.yml")] | sort_by(.created_at) | reverse | .[].run_id' <<< "$workflows")

                      state=$(openapi_check_state)
                      case "$state" in
                          success|failure|cancelled|skipped)
                              terminal_polls=$((terminal_polls + 1))
                              if [ "$terminal_polls" -ge 3 ]; then
                                  echo "OpenAPI validation finished without a generated update (conclusion: $state)."
                                  exit 0
                              fi
                              ;;
                          *) terminal_polls=0 ;;
                      esac
                      sleep 15
                  done
                  echo "::error::No terminal OpenAPI result for $HEAD_SHA within 25 minutes"
                  exit 1

            - name: Validate generated OpenAPI types
              id: validate
              if: steps.artifact.outputs.found == 'true'
              env:
                  BRANCH: ${{ github.event.pull_request.head.ref }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  zip="$RUNNER_TEMP/openapi-update.zip"
                  update="$RUNNER_TEMP/openapi-update.json"
                  mapfile -t entries < <(zipinfo -1 "$zip")
                  if [ "${#entries[@]}" -ne 1 ] || [ "${entries[0]}" != "openapi-update.json" ]; then
                      echo "::error::OpenAPI update artifact must contain only openapi-update.json"
                      exit 1
                  fi
                  set +o pipefail
                  unzip -p "$zip" openapi-update.json | dd of="$update" bs=1048576 count=51 status=none
                  unzip_status=${PIPESTATUS[0]}
                  set -o pipefail
                  [ "$(wc -c < "$update")" -le 52428800 ] || { echo "::error::OpenAPI update exceeds 50 MiB"; exit 1; }
                  [ "$unzip_status" -eq 0 ] || { echo "::error::OpenAPI update archive is invalid"; exit 1; }

                  jq -e \
                      --arg repo "$REPO" \
                      --argjson pr "$PR_NUMBER" \
                      --arg branch "$BRANCH" \
                      --arg head "$HEAD_SHA" '
                          type == "object" and
                          ((keys | sort) == (["additions", "branch", "deletions", "head_sha", "pull_request", "repository", "version"] | sort)) and
                          .version == 1 and .repository == $repo and .pull_request == $pr and .branch == $branch and .head_sha == $head and
                          (.additions | type == "array") and (.deletions | type == "array") and
                          ((.additions | length) + (.deletions | length) > 0) and
                          ((.additions | length) + (.deletions | length) <= 500) and
                          all(.additions[]; type == "object" and ((keys | sort) == ["contents", "path", "sha256"]) and
                              (.path | type == "string") and (.contents | type == "string") and (.sha256 | test("^[0-9a-f]{64}$"))) and
                          all(.deletions[]; type == "object" and (keys == ["path"]) and (.path | type == "string")) and
                          ([.additions[].path, .deletions[].path] | length) == ([.additions[].path, .deletions[].path] | unique | length) and
                          all(.additions[].path, .deletions[].path;
                              test("^frontend/src/generated/[A-Za-z0-9_./-]+$") or
                              . == "frontend/src/lib/agentScopes.generated.ts" or
                              test("^products/[a-z0-9_]+/frontend/generated/(api|api\\.schemas|api\\.zod)\\.ts$") or
                              test("^products/[a-z0-9_]+/mcp/tools\\.yaml$") or
                              . == "services/mcp/definitions/core.yaml" or
                              . == "services/mcp/src/api/generated.ts" or
                              test("^services/mcp/src/generated/[a-z0-9_]+/api\\.ts$") or
                              test("^services/mcp/src/tools/generated/[a-z0-9_-]+\\.ts$") or
                              test("^services/mcp/schema/(generated-tool-definitions|tool-definitions-all)\\.json$"))
                      ' "$update" > /dev/null || { echo "::error::OpenAPI update metadata or paths are invalid"; exit 1; }

                  total=0
                  count=$(jq '.additions | length' "$update")
                  for ((i = 0; i < count; i++)); do
                      jq -r ".additions[$i].contents" "$update" > "$RUNNER_TEMP/openapi-content.b64"
                      base64 -d "$RUNNER_TEMP/openapi-content.b64" > "$RUNNER_TEMP/openapi-content"
                      expected=$(jq -r ".additions[$i].sha256" "$update")
                      actual=$(sha256sum "$RUNNER_TEMP/openapi-content" | cut -d' ' -f1)
                      [ "$actual" = "$expected" ] || { echo "::error::OpenAPI update content checksum mismatch"; exit 1; }
                      total=$((total + $(stat -c '%s' "$RUNNER_TEMP/openapi-content")))
                  done
                  [ "$total" -le 36700160 ] || { echo "::error::Decoded OpenAPI update exceeds 35 MiB"; exit 1; }
                  echo "valid=true" >> "$GITHUB_OUTPUT"

            - name: Get app token for OpenAPI type commits
              if: steps.validate.outputs.valid == 'true'
              id: openapi-app-token
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_POSTHOG_TESTS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_TESTS_PRIVATE_KEY }}

            - name: Commit OpenAPI types
              if: steps.validate.outputs.valid == 'true'
              env:
                  BRANCH: ${{ github.event.pull_request.head.ref }}
                  GH_TOKEN: ${{ steps.openapi-app-token.outputs.token }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  update="$RUNNER_TEMP/openapi-update.json"
                  pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
                  jq -e --arg repo "$REPO" --arg branch "$BRANCH" --arg head "$HEAD_SHA" '
                      .state == "open" and .head.repo.full_name == $repo and .head.ref == $branch and .head.sha == $head
                  ' <<< "$pr" > /dev/null || { echo "::error::Pull request head changed before the OpenAPI commit"; exit 1; }

                  gh pr merge --disable-auto "$PR_NUMBER" --repo "$REPO" || echo "Auto-merge was not enabled"
                  query="mutation(\$input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: \$input) { commit { oid } } }"
                  jq -n \
                      --arg query "$query" \
                      --arg repo "$REPO" \
                      --arg branch "$BRANCH" \
                      --arg head "$HEAD_SHA" \
                      --slurpfile update "$update" '
                          {
                              query: $query,
                              variables: {
                                  input: {
                                      branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                                      expectedHeadOid: $head,
                                      message: {headline: "chore: update OpenAPI generated types"},
                                      fileChanges: {
                                          additions: [$update[0].additions[] | {path, contents}],
                                          deletions: $update[0].deletions
                                      }
                                  }
                              }
                          }
                      ' > "$RUNNER_TEMP/openapi-commit.json"
                  response=$(gh api graphql --input "$RUNNER_TEMP/openapi-commit.json")
                  commit=$(jq -er '.data.createCommitOnBranch.commit.oid' <<< "$response")
                  verified=$(gh api "repos/$REPO/commits/$commit" --jq '.commit.verification.verified')
                  [ "$verified" = true ] || { echo "::error::GitHub did not verify OpenAPI commit $commit"; exit 1; }
                  echo "Committed generated OpenAPI types in $commit"
