# Depot CI shadow of .github/workflows/ci-backend.yml. Lives under .depot/ so
# GitHub Actions ignores it; only Depot CI parses this file. Statuses posted
# from here are non-blocking; canonical is the authoritative signal.
#
# Apples-to-apples is the whole point — keep action pins, env vars, runner
# sizes, and pytest flags in sync with the canonical workflow. A drift-check
# job in .github/workflows/ci-backend-shadow-drift.yml fails when canonical
# changes without a matching depot bump.
#
# Intentional deltas vs canonical (everything else is kept apples-to-apples):
# - runs-on: depot-* labels instead of ubuntu-latest
# - action paths: ./.depot/actions/... instead of ./.github/actions/... (pnpm-install,
#   setup-sqlx-cli, setup-python-cached, and paths-filter mirror the canonical
#   composites; any deltas are documented in each mirror's header)
# - permissions: pull-requests:read (no comment/auto-commit side effects)
# - Stripped side effects: artifact uploads, CI report section posters (canonical
#   additionally skips these on trunk-merge/** branches to save GITHUB_TOKEN budget;
#   the shadow strips them entirely, so that gating has nothing to mirror), snapshot
#   auto-commit (handle-snapshots), posthog-github-action telemetry (including the
#   capture-test-selection job — turbo-discover still emits its telemetry outputs to
#   stay apples-to-apples, they just have no consumer here),
#   --store-durations write, test-selection verdict (so the guard skipping it when both
#   test matrices were skipped has nothing to mirror), Trunk flaky-test quarantine
#   gate (canonical runs per-shard analytics-uploader steps that post to the
#   external Trunk service; the upload is best-effort and a local "Fail on test
#   failure" step owns the pass/fail verdict. Canonical can stage or filter JUnit
#   before this upload. The shadow strips all of it because a non-blocking timing
#   trial must not post to Trunk, and so it also omits the test
#   steps' continue-on-error and that verdict step, letting each shard's test
#   exit code be the verdict directly. Canonical gates each quarantine gate on the
#   TRUNK_UPLOAD_ENABLED repo variable as an upload kill-switch, and its verdict step
#   on TRUNK_QUARANTINE_ENABLED to decide whether known flakes are masked; since the
#   shadow strips both the gate and the verdict step entirely, both variables are
#   no-ops here and there is nothing to mirror. Canonical's turbo-tests gate now calls
#   ./.github/actions/trunk-quarantine-gate to retry once. The shadow has no gate, so it
#   does not need a mirrored action)
# - Per-test failure rollup: canonical's django_tests gate uploads product JUnit and, when a
#   test job fails, downloads that shard's JUnit to list the actual failing tests. The shadow
#   strips artifact uploads (above), so it has nothing to download and keeps the plain
#   dependency-result table — depot-exempt for the same reason as the other uploads.
# - report-test-timings: canonical emits per-test OTLP spans from the uploaded JUnit. The shadow
#   strips artifact uploads (above) and posts no telemetry, so the whole job is depot-exempt —
#   changes confined to it (script deps, the reporter's availability guard, emission secret
#   plumbing such as dual-project tokens, the JUnit-artifact download pattern, re-run attempt
#   handling — including the attempt-suffixed junit artifact names canonical uploads so the
#   reporter can pair re-run recoveries with attempt-1 failures, and the guard that skips the
#   job when both test matrices were skipped, with the needs: entries that feed it) need no
#   depot bump.
# - mirror-schema-cache: canonical's master run copies the migrated schema dump out of the
#   migrated-schema artifact into GitHub Actions Cache, so fork PRs (which run without
#   secrets and cannot authenticate to Depot Cache) prime instead of migrating from scratch.
#   The shadow strips artifact uploads (above) and routes every cache write to Depot Cache
#   (below), so it has neither the artifact to download nor a GitHub cache to fill: the job,
#   and the check-migrations mig_schema_key output that feeds it, are depot-exempt.
# - migrated-schema upload settings: canonical tunes the upload retention; the shadow
#   strips artifact uploads (above), so those changes are depot-exempt.
# - OpenAPI types: validation remains a separate job like canonical, but its
#   auto-commit side effect is dropped
# - events_json variants: gated on the test-new-events-schema label only; canonical also
#   doubles the matrices on workflow_dispatch, but shadow dispatches stay legacy-only so
#   trial runs do the same work as sampled PR runs
# - per-segment split plans (.test_durations.core/.temporal): the restore steps mirror
#   canonical but miss until the depot timing refresher saves those files to Depot Cache;
#   shards fall back to the union .test_durations
# - actions/cache reads/writes route to Depot Cache, not GitHub Actions Cache,
#   so shared keys with canonical (schema, uv, pnpm) do not collide
# - hypothesis constants cache: the restore and save steps mirror canonical verbatim, but the
#   save only fires on master test-matrix runs and the shadow skips those, so the Depot Cache
#   entry only exists after a master workflow_dispatch. Sampled PR shards run cold (they rebuild
#   the pool, as canonical did before this cache existed) until then: bounded, documented, and
#   harmless because the shadow never gates merges.
# - GITHUB_TOKEN / OTEL_SERVICE_NAME neutralized (ambient on Depot, not on GHA)
# - GitHub App IDs: canonical reads several from org variables (vars.GH_APP_*_APP_ID);
#   the shadow strips those app-token steps, so there is nothing to mirror
# - Three data-modeling tests deselected (Depot-only MinIO 403 quarantine)
# - COMPOSE_PROJECT_NAME pinned to posthog because bin/wait-for-docker filters by that
#   project name and checkout directory names are not stable across CI providers
# - Canonical baseline checkouts and comparisons use PostHog/posthog directly so fork
#   dispatches compare against the authoritative upstream master branch
# - Docker Hub login reads Depot's secret store (secrets.DOCKERHUB_*) rather than
#   canonical's env.DOCKERHUB_USERNAME / vars.DOCKERHUB_USER because Depot never indirects
#   through env:, so canonical's per-job env-scoping (workflow-level -> job-level,
#   for the gha-workflow-env-secret Semgrep fix) is depot-exempt. Login is best-effort
#   because these jobs only pull public images and can fall back to anonymous pulls.
# - Path-filter persons-SQL is folded into migrations
# - Snapshot mode matches canonical, but snapshot patch upload/commit is stripped;
#   canonical's per-schema-leg patch scoping (legacy legs exclude *.new_events_schema.ambr,
#   events_json legs ship only those) is therefore depot-exempt too
# - Test durations restored from Depot Cache (posthog-test-durations- prefix), refreshed by
#   .depot/workflows/ci-backend-update-test-timing.yml, so shard counts match GitHub Actions.
#   Committed .test_durations is the fallback.
# - Sharding-plan pinning: canonical snapshots the durations files as a run-scoped
#   artifact and every test job applies it, so re-runs shard like attempt 1. The shadow
#   strips artifact uploads (above), so it keeps floating restores; no depot bump needed
#   for changes confined to that pinning.
# - master (push) runs only check-migrations to prime the shared schema cache; the
#   test matrices are skipped on master (canonical runs them). Sampled source PRs and
#   dispatches run the full graph — that is where the apples-to-apples comparison happens.
#   Trunk merge-queue PRs are excluded because they would repeat a source PR's trial run.

# This workflow runs all of our backend django tests.
#
# Shards derive from .test_durations (Amdahl), restored from Depot Cache (else committed);
# .depot/workflows/ci-backend-update-test-timing.yml keeps that cache fresh.
name: '[optional, does not block merge] Backend CI'
# OPTIONAL, non-blocking shadow of canonical Backend CI — its statuses must never gate
# merging (hence the "[optional, does not block merge]" name prefix). The
# CI_DEPOT_SHADOW_PERCENT Depot CI variable (0-100; 0 or unset = fully off) is both the
# master switch and the eligible pull_request sample rate: when >0, source PR runs are sampled
# at that percent. Trunk merge-queue PRs and draft PRs labeled `no-ci` are excluded before a
# runner is allocated. Master (push) runs only check-migrations to prime the schema cache (test
# matrices are skipped there); workflow_dispatch always runs. The `sample` job rolls deterministic
# per-run dice; `changes` (root of the needs graph) only runs when sampled in, so the whole
# workflow cascades off on a miss. This is a Depot variable, NOT a GitHub one —
# Depot CI reads its own `vars` store. Set it with:
#   depot ci vars add CI_DEPOT_SHADOW_PERCENT=<n> --repo PostHog/posthog    (n=0 disables)
# The drift check (.github/workflows/ci-backend-shadow-drift.yml) keeps this file in sync
# with canonical; it runs whenever either file changes, independent of this variable.
on:
    push:
        branches:
            - master
    workflow_dispatch:
        inputs:
            clickhouseServerVersion:
                description: ClickHouse server version. Leave blank for default
                type: string
    pull_request:
        # Eligible source PRs run the snob-selected Django subset (one shard per active segment),
        # draft or ready; turbo-tests still skip drafts. When selection can't be
        # trusted, a ready source PR runs the full matrices and a draft skips them.
        # Add the `run-ci-backend` label to force the full matrices on a PR; the
        # `no-ci` label silences the workflow on a draft entirely. No
        # labeled/unlabeled triggers, so a label takes effect from the next push
        # or from ready_for_review. Trunk merge-queue PRs are filtered by the
        # sampling gate because their source PR already supplied a trial run.
        types: [opened, synchronize, reopened, ready_for_review]
concurrency:
    # PRs: one active run per branch, cancel stale. Push: per-SHA so master
    # pushes never cancel each other (check-migrations always completes).
    group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
    # Schema cache epoch. Bump to abandon every shared schema cache entry at once
    # (key is posthog-schema-mig-<epoch>-<hash>). Single-sourced so the merge-base (PR)
    # and HEAD (push) key computations below can't drift.
    # ci-e2e-playwright.yml, ci-dagster.yml, ci-mcp.yml and ci-rust-flags-integration.yml restore by the same key; keep their copies in sync when bumping.
    SCHEMA_CACHE_EPOCH: v2
    # Hypothesis constants cache epoch. Bump to abandon every shared entry at once
    # (key is posthog-hypothesis-constants-<version>-<epoch>-<isoyear>-<isoweek>); used by
    # the Django test shards below.
    HYPOTHESIS_CONSTANTS_EPOCH: v1
    SECRET_KEY: '6b01eee4f945ca25045b5aab440b953461faf08693a9abbf1166dc7c6b9772da' # unsafe - for testing only
    COMPOSE_PROJECT_NAME: posthog
    DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/posthog'
    REDIS_URL: 'redis://localhost'
    CLICKHOUSE_HOST: 'localhost'
    CLICKHOUSE_SECURE: 'False'
    CLICKHOUSE_VERIFY: 'False'
    # Restricted `autoresearch` user defined in docker/clickhouse/users-dev.xml,
    # pointed at the CI test DB (posthog_test, not `default` as in regular dev).
    CLICKHOUSE_TEST_CLUSTER_HOST: 'localhost'
    CLICKHOUSE_TEST_CLUSTER_DATABASE: 'posthog_test'
    CLICKHOUSE_TEST_CLUSTER_USER: 'autoresearch'
    CLICKHOUSE_TEST_CLUSTER_PASSWORD: 'autoresearchpass'
    CLICKHOUSE_TEST_CLUSTER_SECURE: 'False'
    CLICKHOUSE_TEST_CLUSTER_VERIFY: 'False'
    TEST: 1
    # Depot CI runners expose OTEL_SERVICE_NAME=ci-worker ambient; GitHub Actions test steps do not.
    # Left set, it leaks into settings.OTEL_SERVICE_NAME (personhog metric client_name label) and
    # diverges from test assertions. Blank it to match the GHA environment. (GITHUB_TOKEN is also
    # injected ambient and leaks into plugin download auth headers, but GITHUB_-prefixed vars are
    # reserved and cannot be overridden via env: — it is unset inside the test run scripts instead.)
    OTEL_SERVICE_NAME: ''
    CLICKHOUSE_SERVER_IMAGE_VERSION: ${{ github.event.inputs.clickhouseServerVersion || '' }}
    CLICKHOUSE_COMPAT_PYTEST_TARGETS: 'posthog/clickhouse ee/clickhouse'
    OBJECT_STORAGE_ENABLED: 'True'
    OBJECT_STORAGE_ENDPOINT: 'http://localhost:19000'
    OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
    OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'
    UV_HTTP_TIMEOUT: 120
    # tests would intermittently fail in GH actions
    # with exit code 134 _after passing_ all tests
    # this appears to fix it
    # absolute wild tbh https://stackoverflow.com/a/75503402
    DISPLAY: ':99.0'
    # this is a fake key so this workflow can run for external contributors as they do not have access to secrets (that we don't need here)
    OIDC_RSA_PRIVATE_KEY: ${{ vars.OIDC_RSA_FAKE_PRIVATE_KEY }}
    RUNS_ON_INTERNAL_PR: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    SANDBOX_JWT_PRIVATE_KEY: ${{ vars.OIDC_RSA_FAKE_PRIVATE_KEY }}
permissions:
    contents: read
    actions: read
    pull-requests: read
jobs:
    # Manual dispatch bypasses sampling so an explicit full run cannot silently no-op.
    # Automatic runs still require a nonzero sampling percentage. Exclude automatic
    # runs that only duplicate work before allocating even this small runner.
    sample:
        if: >-
            github.event_name == 'workflow_dispatch'
            || (vars.CI_DEPOT_SHADOW_PERCENT != ''
                && vars.CI_DEPOT_SHADOW_PERCENT != '0'
                && (github.event_name != 'pull_request'
                    || (!startsWith(github.head_ref, 'trunk-merge/')
                        && (github.event.pull_request.draft != true
                            || !contains(github.event.pull_request.labels.*.name, 'no-ci')))))
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 5
        name: '[optional, does not block merge] Sample run'
        outputs:
            sampled: ${{ steps.roll.outputs.sampled }}
        steps:
            - name: Roll sampling dice
              id: roll
              env:
                  PERCENT: ${{ vars.CI_DEPOT_SHADOW_PERCENT }}
                  RUN_ID: ${{ github.run_id }}
                  EVENT: ${{ github.event_name }}
              run: |
                  set -euo pipefail
                  # Only pull_request is sampled; push and workflow_dispatch always run
                  # when enabled (sampling them would skip cache priming or no-op a dispatch).
                  if [ "$EVENT" != "pull_request" ]; then
                      echo "sampled=true" >> "$GITHUB_OUTPUT"
                      echo "::notice::Optional Backend CI: $EVENT always runs when enabled."
                      exit 0
                  fi
                  # Deterministic per-run dice. Non-integer percent → 0 (off).
                  case "$PERCENT" in ''|*[!0-9]*) PERCENT=0 ;; esac
                  bucket=$(( RUN_ID % 100 ))
                  if [ "$bucket" -lt "$PERCENT" ]; then
                      echo "sampled=true" >> "$GITHUB_OUTPUT"
                      echo "::notice::Optional Backend CI: PR sampled IN (bucket $bucket < ${PERCENT}%)."
                  else
                      echo "sampled=false" >> "$GITHUB_OUTPUT"
                      echo "::notice::Optional Backend CI: PR sampled OUT (bucket $bucket >= ${PERCENT}%) — skipped."
                  fi
    # Job to decide if we should run backend ci
    # See .github/actions/paths-filter/README.md for filter semantics
    changes:
        # Root of the `needs` graph: skipped when `sample` says skip (or is itself skipped),
        # which cascades the whole workflow off.
        needs: sample
        if: needs.sample.outputs.sampled == 'true'
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 5
        name: Determine need to run backend and migration checks
        # Set job outputs to values from filter step
        outputs:
            # run-ci-backend is documented as forcing the full matrices, but every
            # gate reads this output, so the label cannot reach them while the paths
            # filter says false. Nothing under .github/ is in the backend filter, so
            # a sharding or timing script change was untestable on its own PR.
            backend: ${{ contains(github.event.pull_request.labels.*.name, 'run-ci-backend') && 'true' || (steps.filter.outputs.backend || 'true') }}
            backend_files: ${{ steps.filter.outputs.backend_files }}
            migrations: ${{ steps.filter.outputs.migrations || 'true' }}
            migrations_files: ${{ steps.filter.outputs.migrations_files }}
            migrations_any: ${{ steps.filter.outputs.migrations_any || 'true' }}
            tasks_temporal: ${{ steps.filter.outputs.tasks_temporal || 'true' }}
            openapi_types: ${{ steps.filter.outputs.openapi_types || 'true' }}
            # The label has to reach discovery as well: `backend` alone only starts the
            # discover job, which then sees no legacy change and no affected product and
            # emits an empty matrix. A forced legacy change makes it test everything.
            legacy: ${{ contains(github.event.pull_request.labels.*.name, 'run-ci-backend') && 'true' || (steps.filter.outputs.legacy || 'true') }}
            schema: ${{ steps.filter.outputs.schema || 'true' }}
            product_yamls: ${{ steps.filter.outputs.product_yamls || 'false' }}
            product_yamls_files: ${{ steps.filter.outputs.product_yamls_files }}
        steps:
            # For pull requests it's not necessary to checkout the code, but we
            # also want this to run on master so we need to checkout
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  clean: false
                  sparse-checkout: .depot/actions/paths-filter
                  sparse-checkout-cone-mode: false
            - name: Clean up data directories with container permissions
              run: |
                  # Use docker to clean up files created by containers
                  [ -d "data" ] && docker run --rm -v "$(pwd)/data:/data" alpine sh -c "rm -rf /data/seaweedfs /data/minio" || true
              continue-on-error: true
            - uses: ./.depot/actions/paths-filter
              id: filter
              if: github.event_name != 'push' # Run all tests on master push
              with:
                  list-files: 'escape'
                  filters: |
                      backend:
                        # Avoid running backend tests for irrelevant changes
                        # NOTE: we are at risk of missing a dependency here. We could make
                        # the dependencies more clear if we separated the backend/frontend
                        # code completely
                        - 'ee/**/*'
                        - '!ee/frontend/**' # frontend code under ee/ must not trigger backend
                        - 'common/__init__.py'
                        - 'common/hogql_parser/**'
                        - 'common/hogvm/**'
                        - 'common/ingestion/**'
                        - 'common/migration_utils/**'
                        - 'common/plugin_transpiler/**'
                        - 'posthog/**/*'
                        - 'products/**/backend/**/*'
                        # Python outside backend/ — products like logs and
                        # posthog_ai point `backend:test` at extra roots
                        # (skills/, scripts/). Catch any .py change so the
                        # backend job triggers when only those files move.
                        - 'products/**/*.py'
                        # products/desktop is the imported desktop app; it has its own
                        # desktop-* CI and must not drag this suite onto its PRs
                        - '!products/desktop/**'
                        # Each product's package.json declares the per-product
                        # backend:test script that turbo-discover reads to
                        # compose the Product matrix. Without this entry,
                        # widening or fixing the script doesn't trigger
                        # tests it controls.
                        - 'products/*/package.json'
                        - bin/build-schema-latest-versions.py
                        - bin/build-taxonomy-json.py
                        - bin/check_uv_python_compatibility.py
                        - bin/find_python_dependencies.py
                        - bin/unit_metrics.py
                        - pyproject.toml
                        - uv.lock
                        - requirements.txt
                        - requirements-dev.txt
                        - mypy.ini
                        - pytest.ini
                        - conftest.py # Root conftest loads for every pytest run
                        - .test_quarantine.json # Un-quarantining must re-run the affected tests
                        # turbo-discover reads the module graph for the dependent
                        # cascade, and `tach check` validates it — a graph-only PR
                        # must still dispatch both.
                        - tach.toml
                        # generates posthog/schema.py
                        - frontend/src/queries/schema.json
                        # Operator parity check
                        - rust/feature-flags/src/properties/property_models.rs
                        - frontend/src/products.json # Loaded at runtime by posthog/products.py
                        - 'products/*/manifest.tsx' # Generates products.json
                        # hogli setup commands this workflow runs: db:restore-test-db
                        # and product:bootstrap/lint. Scoped to the modules those
                        # commands actually import — framework, manifest, boot
                        # modules, db_schema, product — so unrelated hogli commands
                        # (doctor, devbox, ...) don't trigger this suite.
                        - 'tools/hogli/**'
                        - hogli.yaml
                        - 'tools/hogli-commands/hogli_commands/db_schema.py'
                        - 'tools/hogli-commands/hogli_commands/prechecks.py'
                        - 'tools/hogli-commands/hogli_commands/telemetry_props.py'
                        - 'tools/hogli-commands/hogli_commands/hint_hook.py'
                        - 'tools/hogli-commands/hogli_commands/hints.py'
                        - 'tools/hogli-commands/hogli_commands/product/**'
                        - 'tools/hogli-commands/hogli_commands/product_structure.yaml'
                        # product:lint --all checks these generated files against the tree,
                        # so a baseline-only edit must run it too. The crossings baseline is
                        # also what product:lint reads to let a wiring location leave a
                        # product's turbo.json inputs, so both edits must run the checks.
                        - products/isolation_baseline.txt
                        - products/model_crossing_uses_baseline.txt
                        - 'products/*/turbo.json'
                        # Make sure we run if someone is explicitly changing the workflow
                        - .depot/workflows/ci-backend.yml
                        - .github/clickhouse-versions.json
                        # We use docker compose for tests, make sure we rerun on
                        # changes to docker-compose.dev.yml e.g. dependency
                        # version changes
                        - docker-compose.dev.yml
                        - docker-compose.profiles.yml
                        - docker-compose.base.yml
                        - bin/wait-for-docker
                        - bin/ci-wait-for-docker
                        - frontend/public/email/*
                        - 'docker/clickhouse/**'
                        # Markdown-only changes (e.g. a README under posthog/) match the
                        # broad globs above but exercise no backend code — exclude them so
                        # a docs-only PR doesn't run the whole backend suite.
                        # These excludes are load-bearing: an over-broad exclude silently
                        # skips the suite rather than over-running it, so only exclude
                        # patterns that truly never affect backend. They also drop matched
                        # files from `backend_files`.
                        - '!**/*.md'
                        - '!**/*.mdx'
                      legacy:
                        # Non-product backend code — when only products/ change,
                        # turbo-discover uses Turbo query affectedness to detect changed
                        # products and decide whether Django runs.
                        # Everything from backend: EXCEPT products/**/backend/**/*
                        - 'ee/**/*'
                        - '!ee/frontend/**' # frontend code under ee/ must not trigger backend
                        - 'common/__init__.py'
                        - 'common/hogql_parser/**'
                        - 'common/hogvm/**'
                        - 'common/ingestion/**'
                        - 'common/migration_utils/**'
                        - 'common/plugin_transpiler/**'
                        - 'posthog/**/*'
                        - bin/build-schema-latest-versions.py
                        - bin/build-taxonomy-json.py
                        - bin/check_uv_python_compatibility.py
                        - bin/find_python_dependencies.py
                        - bin/unit_metrics.py
                        - pyproject.toml
                        - uv.lock
                        - requirements.txt
                        - requirements-dev.txt
                        - mypy.ini
                        - pytest.ini
                        - conftest.py
                        - .test_quarantine.json
                        - frontend/src/products.json
                        - 'products/*/manifest.tsx'
                        - rust/feature-flags/src/properties/property_models.rs
                        - .depot/workflows/ci-backend.yml
                        - .github/clickhouse-versions.json
                        - docker-compose.dev.yml
                        - docker-compose.profiles.yml
                        - docker-compose.base.yml
                        - bin/wait-for-docker
                        - bin/ci-wait-for-docker
                        - frontend/public/email/*
                        - 'docker/clickhouse/**'
                        # Same rationale as the backend filter's excludes above: docs-only
                        # changes match the broad globs but exercise no legacy backend code,
                        # so they shouldn't trigger the Django/turbo-discover path either.
                        - '!**/*.md'
                        - '!**/*.mdx'
                        # Generated from frontend/src/queries/schema.json (see the `schema`
                        # filter below). Excluding them here routes schema-only PRs into
                        # turbo-discover's schema-impact narrowing instead of the
                        # all-products legacy path. This cannot skip Django: the
                        # schemaChanged branch hard-sets run_legacy=true. It also cannot
                        # hide a hand-edit to the generated files — ci-python.yml
                        # regenerates schema.py and fails on any diff, and both files stay
                        # in the `schema` (and `backend`) filters so turbo-discover still
                        # takes the schema path for them.
                        - '!posthog/schema.py'
                        - '!posthog/schema_enums.py'
                      schema:
                        # Tracked separately from `legacy` so turbo-discover can
                        # diff schema.json and narrow the product matrix to
                        # products that import the changed types.
                        - frontend/src/queries/schema.json
                        # The generated outputs are excluded from `legacy` above; listing
                        # them here keeps run_legacy=true (full Django) for any schema
                        # change, including a stray hand-edit to a generated file.
                        - posthog/schema.py
                        - posthog/schema_enums.py
                      migrations:
                        - 'docker/clickhouse/**'
                        - 'posthog/migrations/*.py'
                        - 'products/*/backend/migrations/*.py'
                        - 'products/*/migrations/*.py'  # Legacy structure
                        # persons-SQL folded into migrations here (see header deltas):
                        # depot strips canonical's separate persons-migration job
                        - 'rust/persons_migrations/*.sql'
                        - 'rust/bin/migrate-persons'
                      # Any migration file in any app (broader than `migrations` above,
                      # which omits ee/ and posthog sub-package dirs). Gates the
                      # deleted-migration check in repo-checks.
                      migrations_any:
                        - '**/migrations/*.py'
                      tasks_temporal:
                        - 'products/tasks/backend/temporal/**/*'
                      product_yamls:
                        - 'products/*/product.yaml'
                        - '**/owners.yaml'
                        # Resolver changes must re-run the owners.yaml lint too.
                        - 'tools/owners/**'
                      openapi_types:
                        # Generated OpenAPI types - validate they match schema
                        - 'frontend/src/generated/**/*'
                        - 'frontend/src/lib/agentScopes.generated.ts'
                        - 'products/*/frontend/generated/**/*'
                        - 'services/mcp/src/generated/**/*'
                        - 'services/mcp/src/api/generated.ts'
                        # Generation tooling - changes here could affect output
                        - 'tools/openapi-codegen/**/*'
                        - 'services/mcp/scripts/lib/**'
                        - 'frontend/bin/generate-openapi-types.mjs'
                        - 'frontend/src/lib/api-orval-mutator.ts'
                        - 'services/mcp/scripts/**/*'
                        # MCP tool config sources - feed generate-tools.ts
                        - 'services/mcp/definitions/**/*.yaml'
                        - 'services/mcp/definitions/prompts/**/*.md'
                        - 'products/*/mcp/**/*.yaml'
                        - 'products/*/mcp/prompts/**/*.md'
                        - 'services/mcp/schema/tool-definitions.json'
                        - 'services/mcp/schema/tool-definitions-v2.json'
                        - 'services/mcp/src/tools/generated/**/*'
                        - 'services/mcp/schema/generated-tool-definitions.json'
                        - 'services/mcp/schema/tool-definitions-all.json'

    detect-snapshot-mode:
        name: Detect snapshot mode
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 5
        needs: [changes]
        if: needs.changes.outputs.backend == 'true'
        outputs:
            mode: ${{ steps.detect.outputs.mode }}
        steps:
            - name: Detect mode
              id: detect
              env:
                  PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
                  REPO: ${{ github.repository }}
                  HAS_NO_SNAPSHOT_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-snapshot-update') }}
                  AUTHOR: ${{ github.actor }}
              run: |
                  if [ "$PR_REPO" != "$REPO" ] && [ -n "$PR_REPO" ]; then
                    echo "mode=check" >> "$GITHUB_OUTPUT"
                    echo "Fork detected - running in check mode"
                  elif [ "$HAS_NO_SNAPSHOT_LABEL" == "true" ]; then
                    echo "mode=check" >> "$GITHUB_OUTPUT"
                    echo "No-snapshot label detected - running in check mode"
                  else
                    echo "Workflow triggered by: $AUTHOR"
                    if [[ "$AUTHOR" != "dependabot[bot]" ]] && \
                       { [[ "$AUTHOR" == *"github-actions"* ]] || [[ "$AUTHOR" == *"[bot]"* ]] || [[ "$AUTHOR" == "posthog-bot" ]]; }; then
                      echo "mode=check" >> "$GITHUB_OUTPUT"
                      echo "Bot actor detected - running in check mode"
                    else
                      echo "mode=update" >> "$GITHUB_OUTPUT"
                      echo "Running in update mode"
                    fi
                  fi

    # Fast pre-job: determines which products need testing and if Django should run
    # Only needs pnpm + node — no Python, Docker, or services
    # Runs on depot for turbo remote cache access (cache status drives Django gating)
    turbo-discover:
        needs: changes
        # Not on master push: master only primes the schema cache; this cascades the matrices off.
        if: needs.changes.outputs.backend == 'true' && github.event_name != 'push'
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 20
        name: Discover product tests
        env:
            # Whether this run selects backend tests at all: a PR, off the merge queue's
            # trunk-merge/** run (that run is the merge gate and stays full), and without
            # the run-ci-backend label. turbo-discover.js reads it too, so a run that never
            # selects reports an empty mode rather than a selector error.
            SELECTION_APPLIES: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'trunk-merge/') && !contains(github.event.pull_request.labels.*.name, 'run-ci-backend') && needs.changes.outputs.backend == 'true' }}
        outputs:
            run_legacy: ${{ steps.discover.outputs.run_legacy }}
            run_legacy_reason: ${{ steps.discover.outputs.run_legacy_reason }}
            matrix: ${{ steps.discover.outputs.matrix }}
            schema_cache_key: ${{ steps.schema-key.outputs.key }}
            schema_migrations_key: ${{ steps.schema-key.outputs.migrations_key }}
            schema_prefix_key: ${{ steps.schema-key.outputs.prefix_key }}
            django_shards: ${{ steps.discover.outputs.django_shards }}
            # Which Django tests this PR runs. Empty mode = this run does not select.
            mode: ${{ steps.discover.outputs.mode }}
            # The rest of that decision (segment file lists, run_poe, run_temporal,
            # segment_shards) as one JSON object; consumers read it with fromJSON.
            selection: ${{ steps.discover.outputs.selection }}
            # The posthog-ci-test-selection event properties, as one JSON object.
            telemetry: ${{ steps.discover.outputs.telemetry }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 1000
                  filter: blob:none
            - name: Fetch current PR base for Turbo affected diff
              if: github.event_name == 'pull_request'
              env:
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: git fetch --no-tags --depth=1000 --filter=blob:none origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
            - name: Compute schema cache key from merge-base
              id: schema-key
              if: github.event_name == 'pull_request'
              env:
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: |
                  # HEAD is the synthetic merge commit; HEAD^2 is the PR branch tip.
                  # The fetch-depth:1000 checkout + base-ref fetch above ensure the
                  # full ancestry needed to find the divergence point is available.
                  MERGE_BASE=$(git merge-base HEAD^2 "origin/${BASE_REF}" 2>/dev/null || echo "")
                  if [ -z "$MERGE_BASE" ]; then
                      echo "key=" >> $GITHUB_OUTPUT
                      echo "migrations_key=" >> $GITHUB_OUTPUT
                      echo "::notice::merge-base not found (branch too stale?) — schema cache will be skipped"
                      exit 0
                  fi
                  # Routing decides which app labels reach the dump, and the consumers replay them
                  # from the checked-out copy, so these inputs belong in the key below. A PR that
                  # edits any of them matches no master dump, the merge-base one included: drop
                  # both keys and let migrations run from scratch.
                  DB_ROUTING=$(git ls-tree -r --format='%(objectname) %(path)' "$MERGE_BASE" -- products/db_routing.yaml posthog/product_db_config.py posthog/product_db_router.py)
                  DB_ROUTING_HEAD=$(git ls-tree -r --format='%(objectname) %(path)' HEAD -- products/db_routing.yaml posthog/product_db_config.py posthog/product_db_router.py)
                  if [ "$DB_ROUTING" != "$DB_ROUTING_HEAD" ]; then
                      echo "key=" >> $GITHUB_OUTPUT
                      echo "migrations_key=" >> $GITHUB_OUTPUT
                      echo "::notice::db routing config or router differs from the merge base, so the schema cache is skipped"
                      exit 0
                  fi
                  # Exact branch-point key, kept as the fallback restore key below.
                  echo "key=posthog-schema-master-${MERGE_BASE}" >> $GITHUB_OUTPUT
                  # Last-resort restore prefix: matches the newest saved dump of any
                  # migration set, for the window where both exact keys miss. Gated on
                  # checkout age (a day) because a re-run of an old run keeps its original
                  # commit: a stale checkout can lack migrations the newest dump records,
                  # and the migrate top-ups only apply forward, so they cannot repair a
                  # dump that is newer than the code.
                  HEAD_AGE_SECONDS=$(( $(date +%s) - $(git show -s --format=%ct HEAD) ))
                  if [ "$HEAD_AGE_SECONDS" -lt 86400 ]; then
                      echo "prefix_key=posthog-schema-mig-${SCHEMA_CACHE_EPOCH}-" >> $GITHUB_OUTPUT
                  fi
                  # Shared key: hash merge-base schema inputs, not PR head, so PR migrations still
                  # apply as the pytest delta. uv.lock covers third-party migration changes; the
                  # postgres image is folded in so a server-version bump invalidates the key.
                  # Non-Django migration frameworks are excluded from this Postgres schema dump.
                  # SCHEMA_CACHE_EPOCH (workflow env) prefixes the key as a manual cache-bust knob.
                  MIG_FILES=$(git ls-tree -r --format='%(objectname) %(path)' "$MERGE_BASE" \
                      | grep -E '/migrations/[^/]+\.py$|^[0-9a-f]+ uv\.lock$' \
                      | grep -vE '/(clickhouse|async_migrations)/migrations/' \
                      | LC_ALL=C sort) || true
                  PG_IMAGE=$(git show "${MERGE_BASE}:docker-compose.base.yml" 2>/dev/null \
                      | grep -m1 -E '^[[:space:]]*image:[[:space:]]*postgres:' | tr -d '[:space:]')
                  if [ -z "$MIG_FILES" ]; then
                      echo "migrations_key=" >> $GITHUB_OUTPUT
                      echo "::notice::no migration files matched — restore will fall back to the SHA schema key"
                  else
                      MIG_HASH=$(printf '%s\n%s\n%s' "$MIG_FILES" "$PG_IMAGE" "$DB_ROUTING" | sha256sum | cut -c1-40)
                      echo "migrations_key=posthog-schema-mig-${SCHEMA_CACHE_EPOCH}-${MIG_HASH}" >> $GITHUB_OUTPUT
                  fi
            # Depot shadow: canonical threads a setup-action app token into
            # pnpm-install; mint stripped here (secret not available on Depot).
            - name: Install pnpm dependencies
              uses: ./.depot/actions/pnpm-install
              with:
                  install-command: pnpm install --frozen-lockfile --filter=@posthog/root
            # turbo-discover.js runs .github/scripts/tach_map.py under `uv run
            # --no-project` for the dependent cascade; the script pins tach, so no
            # Python project sync is needed. A missing uv widens the cascade to
            # every product rather than failing the job.
            - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              continue-on-error: true
              with:
                  version: '0.11.28' # pinned: unpinned setup-uv calls GH API on every job, exhausts rate limit
            - name: Restore test durations from cache
              # Restore fresh timings so shard counts match GitHub Actions; miss falls back to committed.
              uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: .test_durations
                  key: posthog-test-durations-${{ github.run_id }}
                  restore-keys: |
                      posthog-test-durations-
            - name: Fall back to the last published durations
              # .test_durations is not in the repo. The timing workflow refreshes the
              # cache several times a day and publishes the same files as an artifact
              # of its own runs. On a cache miss (retention lapsed, timing workflow
              # down for two weeks) take the newest artifact; if that is gone too,
              # pytest-split splits by count and turbo-discover sizes from file counts
              # until the next timing run.
              if: ${{ hashFiles('.test_durations') == '' }}
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-backend-update-test-timing.yml \
                      --branch master --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
                  if [ -z "$run_id" ]; then
                      echo "::warning::No successful timing run to fall back to, sharding without durations"
                      exit 0
                  fi
                  gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name test-durations --dir . \
                      || echo "::warning::Timing artifact of run $run_id unavailable, sharding without durations"
            - name: Restore per-segment test durations from cache
              uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: |
                      .test_durations.core
                      .test_durations.temporal
                  key: posthog-segment-durations-${{ github.run_id }}
                  restore-keys: |
                      posthog-segment-durations-
            # The backend test selector picks the Django tests this PR needs, and on a legacy
            # diff its product list narrows the product matrix too: turbo-discover.js cannot
            # see which products a posthog/ or ee/ edit reaches, and the selector can, because
            # it follows the import graph into products/. Both matrices read one verdict, so
            # they can never disagree about whether the selection is trustworthy.
            # Only on a legacy diff: turbo-discover.js trusts the selection only when the paths
            # filter saw a legacy edit, and falls back without a selector run otherwise. The
            # DISABLE_BACKEND_TEST_SELECTION kill switch skips the run too; the script still
            # reports the `disabled` reason from its own env.
            - name: Install uv
              # Optional setup: a failure here must fall back to the full matrices like a
              # selector failure does, not fail the job that gates every test job.
              continue-on-error: true
              if: env.SELECTION_APPLIES == 'true' && needs.changes.outputs.legacy == 'true' && vars.DISABLE_BACKEND_TEST_SELECTION != 'true'
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28'

            - name: Run the backend test selector
              id: select
              # A selector failure or hang must not fail this job, which gates every test job
              # in the workflow — turbo-discover.js falls back to the full matrices instead.
              # The step timeout bounds a hang well inside the job's, so the fallback still
              # reaches the matrices rather than taking the whole job down with it.
              continue-on-error: true
              timeout-minutes: 8
              if: env.SELECTION_APPLIES == 'true' && needs.changes.outputs.legacy == 'true' && vars.DISABLE_BACKEND_TEST_SELECTION != 'true'
              env:
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              shell: bash
              run: |
                  set -euo pipefail
                  uv run tools/snob_backend_test_selection_shadow.py \
                      --base-ref "origin/$BASE_REF" \
                      > /tmp/selection.json

            - name: Discover products to test
              id: discover
              env:
                  # On pushes to master, always run everything.
                  # On PRs, use the path filter to detect legacy changes.
                  LEGACY_CHANGED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.legacy }}
                  # Empty when the selector did not run or failed, which falls back to the
                  # full matrices on a ready PR and skips them on a draft.
                  SELECTION_JSON: ${{ steps.select.outcome == 'success' && '/tmp/selection.json' || '' }}
                  # Kill switch — set the DISABLE_BACKEND_TEST_SELECTION repo variable to put
                  # every PR back on the full matrices without a code change.
                  SELECTION_DISABLED: ${{ vars.DISABLE_BACKEND_TEST_SELECTION || 'false' }}
                  # A draft has a later ready run to defer to, so an untrusted selection skips
                  # the heavy matrices there instead of running all of them.
                  PR_DRAFT: ${{ github.event.pull_request.draft }}
                  SCHEMA_CHANGED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.schema }}
                  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || '' }}
                  TURBO_SCM_HEAD: ${{ github.sha }}
                  # Kill switch — drop comma-separated products from the matrix; empty = run all.
                  SKIP_PRODUCT_TESTS: ${{ vars.SKIP_PRODUCT_TESTS || '' }}
              run: |
                  # turbo-discover.js uses Turbo's Git affectedness to detect
                  # changed products. Non-isolated product changes trigger the
                  # full suite (all products + Django).
                  RESULT=$(node .github/scripts/turbo-discover.js)
                  echo "Result: $RESULT"
                  echo "matrix=$(echo "$RESULT" | jq -c '.matrix')" >> $GITHUB_OUTPUT
                  echo "run_legacy=$(echo "$RESULT" | jq -r '.run_legacy')" >> $GITHUB_OUTPUT
                  echo "run_legacy_reason=$(echo "$RESULT" | jq -r '.run_legacy_reason // empty')" >> "$GITHUB_OUTPUT"
                  echo "django_shards=$(echo "$RESULT" | jq -c '.django_shards // empty')" >> $GITHUB_OUTPUT
                  echo "$RESULT" | jq -r '"mode=\(.selection.mode)", "selection=\(.selection | tojson)", "telemetry=\(.telemetry | tojson)"' >> "$GITHUB_OUTPUT"

            # Depot shadow note: canonical uploads /tmp/selection.json for its
            # test-selection-verdict job. The shadow strips that job and all artifact
            # uploads, so there is no Upload selection artifact step here.

    build-product-test-matrix:
        name: Build product test matrix
        needs: [turbo-discover]
        if: >-
            !cancelled() && needs.turbo-discover.result == 'success' && needs.turbo-discover.outputs.matrix != '[]' && needs.turbo-discover.outputs.matrix != ''
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 5
        outputs:
            include: ${{ steps.build.outputs.include }}
        steps:
            - name: Build product matrix include list
              id: build
              env:
                  PRODUCT_MATRIX_JSON: ${{ needs.turbo-discover.outputs.matrix }}
                  # Manual shadow runs compare with canonical master pushes, which run legacy schema only.
                  RUN_NEW_EVENTS_SCHEMA: ${{ contains(github.event.pull_request.labels.*.name, 'test-new-events-schema') }}
              run: |
                  if [[ "$RUN_NEW_EVENTS_SCHEMA" == "true" ]]; then
                      schema_modes='[false, true]'
                  else
                      schema_modes='[false]'
                      echo "Skipping new-events-schema variants (add the test-new-events-schema label to run them)"
                  fi
                  include=$(jq -cn --argjson matrix "$PRODUCT_MATRIX_JSON" --argjson schema_modes "$schema_modes" '
                    [
                      $matrix[] as $entry
                      | $schema_modes[] as $new_events_schema
                      | $entry + {"new-events-schema": $new_events_schema}
                    ]
                  ')
                  echo "include=$include" >> "$GITHUB_OUTPUT"
                  echo "Product test matrix size: $(jq -r 'length' <<< "$include")"

    # Runs product tests in parallel — one matrix job per group
    # Each job gets its own runner + Docker stack, so no shared DB conflicts
    # Small products (< 50 tests) are grouped into a single job to avoid setup overhead
    # A status function is required to inspect dependency results after failures.
    # Use !cancelled(), not always(), so superseded matrix jobs still receive cancellation.
    turbo-tests:
        needs: [changes, turbo-discover, detect-snapshot-mode, build-product-test-matrix, get_clickhouse_versions]
        if: >-
            !cancelled() && (github.event.pull_request.draft != true || startsWith(github.head_ref, 'trunk-merge/') || contains(github.event.pull_request.labels.*.name, 'run-ci-backend')) && needs.turbo-discover.result == 'success' && needs.build-product-test-matrix.result == 'success' && needs.build-product-test-matrix.outputs.include != '[]' && needs.build-product-test-matrix.outputs.include != ''
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 40
        name: Product tests (${{ matrix.group }}, events schema ${{ matrix.new-events-schema && 'json' || 'legacy' }})
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJson(needs.build-product-test-matrix.outputs.include) }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            # Start Docker early (before dependency installs) so containers can pull
            # images and initialize while we install deps. This matches the pattern
            # used by core-tests/django and makes the later wait step negligible.
            - name: Clean up data directories
              run: |
                  [ -d "data" ] && docker run --rm -v "$(pwd)/data:/data" alpine sh -c "rm -rf /data/seaweedfs /data/minio" || true
              continue-on-error: true
            - name: Log in to Docker Hub
              if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
              continue-on-error: true
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Start services
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
                  COMPOSE_PROFILES: temporal,azure
                  CLICKHOUSE_SERVER_IMAGE: ${{ needs.get_clickhouse_versions.outputs.local_image }}
              run: |
                  cp posthog/user_scripts/latest_user_defined_function.xml docker/clickhouse/user_defined_function.xml
                  bin/ci-wait-for-docker launch --background --down \
                    db redis7 clickhouse zookeeper kafka objectstorage \
                    temporal elasticsearch objectstorage-azure
            # Depot shadow: canonical threads a setup-action app token into both
            # pnpm-install and setup-python; mint stripped here (secret not
            # available on Depot), so setup-python keeps the bot PAT.
            - parallel:
                  - name: Install pnpm dependencies
                    uses: ./.depot/actions/pnpm-install
                    with:
                        install-command: pnpm install --frozen-lockfile --filter=@posthog/root
                  - name: Set up Python
                    uses: ./.depot/actions/setup-python-cached
                    with:
                        python-version: 3.13.13
                        token: ${{ secrets.POSTHOG_BOT_PAT }}
                  - name: Install Rust
                    uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
                    with:
                        toolchain: 1.91.1
                        components: cargo
            - name: Install uv
              id: setup-uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28' # pinned: unpinned setup-uv calls GH API on every job, exhausts rate limit
                  enable-cache: true
                  cache-dependency-glob: uv.lock
                  save-cache: ${{ github.ref == 'refs/heads/master' }}
            - name: Install SAML dependencies
              if: steps.setup-uv.outputs.cache-hit != 'true'
              run: sudo rm -f /etc/apt/sources.list.d/*twingate* && sudo apt-get update && sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl
            - name: Install sqlx-cli
              uses: ./.depot/actions/setup-sqlx-cli
            - name: Install Python dependencies
              run: UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev
            - name: Add service hostnames to /etc/hosts
              run: echo "127.0.0.1 db redis7 kafka clickhouse clickhouse-coordinator objectstorage temporal" | sudo tee -a /etc/hosts
            - name: Set up needed files
              run: |
                  mkdir -p frontend/dist
                  touch frontend/dist/index.html frontend/dist/layout.html frontend/dist/exporter.html
                  ./bin/download-mmdb
            - name: Wait for Docker services
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
                  COMPOSE_PROFILES: temporal,azure
                  CLICKHOUSE_SERVER_IMAGE: ${{ needs.get_clickhouse_versions.outputs.local_image }}
              # objectstorage answers InvalidAccessKeyId until its bootstrap registers identities.
              run: bin/ci-wait-for-docker wait objectstorage
            - name: Restore schema cache from master
              if: ${{ github.event_name == 'pull_request' && needs.turbo-discover.outputs.schema_cache_key != '' }}
              uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: schema.sql.gz
                  # Prefer the shared content key; fall back to the exact merge-base SHA key,
                  # then to the newest dump of any migration set. Right after a migration
                  # lands on master both exact keys miss until ci-backend re-dumps, and a
                  # from-scratch migrate costs ~17 minutes per shard; pytest's keepdb
                  # migrate tops a slightly stale dump up in seconds instead.
                  key: ${{ needs.turbo-discover.outputs.schema_migrations_key || needs.turbo-discover.outputs.schema_cache_key }}
                  restore-keys: |
                      ${{ needs.turbo-discover.outputs.schema_cache_key }}
                      ${{ needs.turbo-discover.outputs.schema_prefix_key }}
            - name: Prime test_posthog from cached schema
              # Treat cache problems as misses; the migrate step below rebuilds the DB
              # whenever this one reports restored=false.
              id: prime-schema
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  echo "restored=false" >> "$GITHUB_OUTPUT"
                  if [ ! -f schema.sql.gz ]; then
                      echo "::notice::Schema cache miss; the migrate step will build test_posthog"
                      exit 0
                  fi
                  mkdir -p .postgres-backups
                  mv schema.sql.gz .postgres-backups/schema-latest.sql.gz
                  if ./bin/hogli db:restore-test-db; then
                      echo "restored=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "::warning::Schema restore failed (stale/incompatible cached dump?); the migrate step will build test_posthog"
                  fi
            - name: Migrate test_posthog from scratch
              # Any run without a restored schema cache (master, dispatches, PR cache
              # misses) replays the full migration chain here, in a process that exits
              # before tests: the executor's memory high-water stays resident in
              # whichever process runs it, and pytest must not carry it through the
              # test phase. pytest --reuse-db adopts the DB like the PR prime above;
              # any failure falls back to the in-pytest migrate.
              if: ${{ github.event_name != 'pull_request' || steps.prime-schema.outputs.restored != 'true' }}
              env:
                  DATABASE_URL: postgres://posthog:posthog@localhost:5432/test_posthog
              run: |
                  admin_psql() { docker compose -f docker-compose.dev.yml exec -T db psql -U posthog postgres "$@"; }
                  if ! admin_psql -c "DROP DATABASE IF EXISTS test_posthog;" -c "CREATE DATABASE test_posthog;"; then
                      echo "::warning::Could not recreate test_posthog; pytest --reuse-db will run the full migrate itself"
                      exit 0
                  fi
                  if ! python manage.py migrate; then
                      echo "::warning::Out-of-process migrate failed; pytest --reuse-db will run the full migrate itself"
                      admin_psql -c "DROP DATABASE IF EXISTS test_posthog;" || true
                  fi
            - name: Register Temporal search attributes
              run: |
                  bin/wait-for-docker temporal
                  python manage.py register_temporal_search_attributes
            - name: Restore test durations from cache
              uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: .test_durations
                  key: posthog-test-durations-${{ github.run_id }}
                  restore-keys: |
                      posthog-test-durations-
            - name: Fall back to the last published durations
              # .test_durations is not in the repo. The timing workflow refreshes the
              # cache several times a day and publishes the same files as an artifact
              # of its own runs. On a cache miss (retention lapsed, timing workflow
              # down for two weeks) take the newest artifact; if that is gone too,
              # pytest-split splits by count and turbo-discover sizes from file counts
              # until the next timing run.
              if: ${{ hashFiles('.test_durations') == '' }}
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-backend-update-test-timing.yml \
                      --branch master --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
                  if [ -z "$run_id" ]; then
                      echo "::warning::No successful timing run to fall back to, sharding without durations"
                      exit 0
                  fi
                  gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name test-durations --dir . \
                      || echo "::warning::Timing artifact of run $run_id unavailable, sharding without durations"
            - name: Run product tests
              # --force: discover already decided this product needs testing, skip turbo cache
              # --log-order=stream: stream pytest output live instead of buffering until completion
              # legs: one turbo invocation per entry, each with its own pytest-split flags
              # (e.g. "-- --splits 3 --group 1"). A job holds several legs when a split
              # product's last shard had budget left over for whole small products, and
              # pytest-split flags must not leak from that shard onto its job-mates.
              env:
                  PRODUCT_LEGS: ${{ toJSON(matrix.legs) }}
                  # Read only when an unrebased branch planned the pre-legs shape.
                  LEGACY_FILTERS: ${{ matrix.filters }}
                  LEGACY_PYTEST_ARGS: ${{ matrix.pytest_args }}
                  CLICKHOUSE_HOGQL_USE_NEW_EVENTS_SCHEMA: ${{ matrix.new-events-schema && 'true' || 'false' }}
                  # products/tasks/backend/temporal moved here from the Django Temporal
                  # segment, and its conftest and workflows talk to Modal. Injected only
                  # when that directory changed, matching the gate the Django job used.
                  MODAL_TOKEN_ID: ${{ needs.changes.outputs.tasks_temporal == 'true' && secrets.MODAL_TOKEN_ID || '' }}
                  MODAL_TOKEN_SECRET: ${{ needs.changes.outputs.tasks_temporal == 'true' && secrets.MODAL_TOKEN_SECRET || '' }}
                  AWS_S3_ALLOW_UNSAFE_RENAME: 'true'
                  # --reuse-db: keep the test database between sequential product runs to avoid
                  # ClickHouse drop/create race conditions with ReplicatedMergeTree ZK metadata.
                  # --durations-path: turbo runs products from products/<name>/, so pytest-split
                  # needs an explicit path back to the repo-root durations file for balanced sharding.
                  PYTEST_ADDOPTS: >-
                      --reuse-db
                      --durations-path ../../.test_durations
                      ${{ needs.detect-snapshot-mode.outputs.mode == 'update' && '--snapshot-update --snapshot-warn-unused' || '' }}
                      ${{ github.event_name == 'pull_request' && '--cov=backend --cov-report=xml:coverage.xml' || '' }}
                  # turbo runs each product's backend:test with the product dir as CWD, so --cov=backend
                  # scopes coverage to that product and writes products/<name>/coverage.xml — works for
                  # bin-packed buckets (each product writes its own file) and split products (unioned later).
                  # sysmon: Python 3.12+'s low-overhead coverage backend, ~a few % vs ~20% for the C tracer.
                  COVERAGE_CORE: sysmon
              shell: bash
              run: |
                  set +e
                  overall=0
                  # A workflow edit reaches an open PR before the script edit does, so a
                  # branch that has not rebased still plans the flat {filters, pytest_args}
                  # shape. Normalize that into one leg rather than requiring the new key.
                  if [ -z "$PRODUCT_LEGS" ] || [ "$PRODUCT_LEGS" = "null" ]; then
                      PRODUCT_LEGS=$(jq -cn --arg f "$LEGACY_FILTERS" --arg a "$LEGACY_PYTEST_ARGS" \
                          '[{filters: $f, pytest_args: $a}]')
                      echo "Matrix entry carries no legs; running the legacy single invocation"
                  fi
                  leg_count=$(jq 'length' <<< "$PRODUCT_LEGS")
                  # Neither shape present means the job would pass having run no tests, and
                  # the rollup gate only reads this step's outcome. Fail loudly instead.
                  if [ -z "$leg_count" ] || [ "$leg_count" -lt 1 ]; then
                      echo "::error::No test legs in this matrix entry; refusing to pass without running tests"
                      exit 1
                  fi
                  for ((leg_index = 0; leg_index < leg_count; leg_index++)); do
                      leg_filters=$(jq -r ".[$leg_index].filters" <<< "$PRODUCT_LEGS")
                      leg_args=$(jq -r ".[$leg_index].pytest_args" <<< "$PRODUCT_LEGS")
                      echo "::group::turbo backend:test $leg_filters $leg_args"
                      # Word splitting is intended here: both variables carry several flags.
                      # shellcheck disable=SC2086
                      pnpm turbo run backend:test $leg_filters --concurrency=1 --output-logs=full --force --log-order=stream $leg_args
                      exit_code=$?
                      echo "::endgroup::"
                      if [ $exit_code -eq 5 ]; then
                          echo "No tests collected for this leg, this is expected when splitting tests"
                      elif [ $exit_code -ne 0 ]; then
                          overall=$exit_code
                      fi
                  done
                  set -e
                  exit $overall
    # Lightweight repo-wide checks that only need Python + uv (no Docker/DB).
    # Consolidates checks that previously each spun up their own runner.
    repo-checks:
        needs: [changes]
        # product_yamls: ownership-only PRs still need the owners.yaml lint below.
        if: (needs.changes.outputs.backend == 'true' || needs.changes.outputs.product_yamls == 'true') && github.event_name != 'push'
        timeout-minutes: 10
        permissions:
            contents: read
            pull-requests: read # list PR files for the deleted-migration check
        name: Repo checks (depot-ubuntu-24.04)
        runs-on: depot-ubuntu-24.04
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - name: Set up Python
              uses: ./.depot/actions/setup-python-cached
              with:
                  python-version: 3.13.13
            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28' # pinned: unpinned setup-uv calls GH API on every job, exhausts rate limit
            - name: Install Python dependencies
              run: UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev
            - name: Bootstrap scaffold product
              run: ./bin/hogli product:bootstrap spline_reticulator --non-interactive
            - name: Lint product structure
              run: ./bin/hogli product:lint --all
            # Distributed owners.yaml tree: schema, product.yaml/owners.yaml
            # conflicts, dead rule globs, coverage (warn-only). No --live, so no
            # secrets — fork PRs get validated too (the --live slug check runs in
            # the fork-gated validate-product-yamls job instead).
            - parallel:
                  - name: Lint owners.yaml files
                    run: ./bin/hogli owners:lint
                  - name: Check version specifiers
                    run: python .github/scripts/check-version-specifiers.py
                  - name: Check IDOR model coverage
                    run: python .github/scripts/check-idor-model-coverage.py
                  - name: Check DWH presentation layer stays source-agnostic
                    run: python .github/scripts/check-dwh-source-agnostic.py
                  - name: Check operator parity
                    run: python .github/scripts/check-operator-parity.py
                  - name: Check module boundaries (tach)
                    # Two passes: tests are in the interface graph but not the dependency graph.
                    # A branch that predates the command still excludes tests in tach.toml, so
                    # the old single pass is the right check there.
                    run: |
                        if ./bin/hogli lint:tach --help >/dev/null 2>&1; then
                            ./bin/hogli lint:tach
                        else
                            tach check --dependencies --interfaces
                        fi
                  - name: Check product facade enforcement (import-linter)
                    run: lint-imports
                  # These guards take the whole repo as input (import graph after
                  # django.setup(), signal registries, repo-wide AST scans), so diff-based
                  # test selection can't pick them and the Django matrix skips them on
                  # products-only diffs and drafts. They need no service containers.
                  # Branches that predate the directory still carry the guards at their
                  # old paths, so fall back to those rather than failing on a missing arg.
                  - name: Run repo invariants (whole-repo pytest guards)
                    run: |
                        if [ -d posthog/test/repo_invariants ]; then
                            pytest -p no:cacheprovider posthog/test/repo_invariants
                        else
                            pytest -p no:cacheprovider posthog/test/test_startup_import_budget.py posthog/test/test_dataclass_defaults.py
                        fi
            # Block deleting historical migration files (see safe-django-migrations.md).
            # GITHUB_ACTIONS=false suppresses the command's PR annotations on the shadow.
            - name: Check deleted migrations
              if: github.event_name == 'pull_request' && needs.changes.outputs.migrations_any == 'true'
              env:
                  GITHUB_ACTIONS: 'false'
                  REPO: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: .github/scripts/list-removed-renamed-paths.sh | ./bin/hogli lint:migration-deletions

    validate-product-yamls:
        needs: [changes]
        if: >
            needs.changes.outputs.product_yamls == 'true' &&
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 5
        name: Validate product.yaml owners (depot-ubuntu-24.04)
        runs-on: depot-ubuntu-24.04
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - name: Get app token
              id: app-token
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_POSTHOG_ASSIGN_REVIEWERS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_ASSIGN_REVIEWERS_PRIVATE_KEY }}
                  owner: ${{ github.repository_owner }}
                  repositories: ${{ github.event.repository.name }}
            - name: Set up Python
              uses: ./.depot/actions/setup-python-cached
              with:
                  python-version: 3.13.13
                  token: ${{ steps.app-token.outputs.token || github.token }}
            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28'
            - name: Install Python dependencies
              run: UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev
            - name: Validate changed product.yaml owners
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  CHANGED_FILES: ${{ needs.changes.outputs.product_yamls_files }}
              run: |
                  mapfile -t names < <(echo "$CHANGED_FILES" | tr ' ' '\n' | sed -n 's|^products/\([^/]*\)/product.yaml$|\1|p')
                  existing=()
                  for n in "${names[@]}"; do
                    [ -f "products/$n/product.yaml" ] && existing+=("$n")
                  done
                  if [ "${#existing[@]}" -eq 0 ]; then
                    echo "No existing product.yaml files in diff after filtering"
                    exit 0
                  fi
                  ./bin/hogli product:lint:owners "${existing[@]}"
            - name: Validate owners.yaml identities against GitHub
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  CHANGED_FILES: ${{ needs.changes.outputs.product_yamls_files }}
              # Scoped to the diff: unscoped, one stale slug fails every owners.yaml PR.
              # xargs re-parses the paths-filter escape format, keeping escaped paths whole.
              run: printf '%s' "$CHANGED_FILES" | xargs -r ./bin/hogli owners:lint --live

    # Migration validation.
    # This job needs Docker + DB. Canonical master is checked out beside the comparison
    # branch so repository switches cannot disturb live Compose bind mounts.
    check-migrations:
        needs: [changes]
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.migrations == 'true'
        # On master this job replays the full migration history from scratch to
        # produce the schema dump every PR job restores. That replay grows with
        # every merged migration, so the limit needs headroom over it: it is
        # there to cancel a hang, not to cap how long the history takes.
        timeout-minutes: 40
        name: Validate migrations
        runs-on: depot-ubuntu-24.04
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  clean: false
            - name: Clean up data directories with container permissions
              run: |
                  # Use docker to clean up files created by containers
                  [ -d "data" ] && docker run --rm -v "$(pwd)/data:/data" alpine sh -c "rm -rf /data/seaweedfs /data/minio" || true
              continue-on-error: true
            - name: Log in to Docker Hub
              if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
              continue-on-error: true
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Stop/Start stack with Docker Compose
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
              run: bin/ci-wait-for-docker launch --background --down db redis7 clickhouse
            - name: Set up Python
              uses: ./.depot/actions/setup-python-cached
              with:
                  python-version: 3.13.13
            - name: Install uv
              id: setup-uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28' # pinned: unpinned setup-uv calls GH API on every job, exhausts rate limit
                  enable-cache: true
                  cache-dependency-glob: uv.lock
                  save-cache: ${{ github.ref == 'refs/heads/master' }}
            - name: Install SAML (python3-saml) dependencies
              if: steps.setup-uv.outputs.cache-hit != 'true'
              run: |
                  sudo rm -f /etc/apt/sources.list.d/*twingate*
                  sudo apt-get update
                  sudo apt-get install libxml2-dev libxmlsec1-dev libxmlsec1-openssl
            - name: Install Rust
              uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
              with:
                  toolchain: 1.91.1
                  components: cargo
            - name: Install sqlx-cli
              uses: ./.depot/actions/setup-sqlx-cli
            # First running migrations from master, to simulate the real-world scenario
            - name: Checkout upstream master
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  repository: PostHog/posthog
                  ref: master
                  path: upstream-master
            - name: Install python dependencies for master
              working-directory: upstream-master
              run: |
                  UV_PROJECT_ENVIRONMENT=.venv-master uv sync --frozen --dev
            - name: Compute master schema cache key
              # Must match the migration-set computation in turbo-discover and the
              # push-side save below (inputs, hash, and key prefix). Keyed off the
              # master checkout (HEAD here) so a restored dump is exactly the state
              # that "Run migrations up to master" would build from scratch.
              if: github.event_name != 'push'
              id: master-schema-key
              working-directory: upstream-master
              run: |
                  MIG_FILES=$(git ls-tree -r --format='%(objectname) %(path)' HEAD \
                      | grep -E '/migrations/[^/]+\.py$|^[0-9a-f]+ uv\.lock$' \
                      | grep -vE '/(clickhouse|async_migrations)/migrations/' \
                      | LC_ALL=C sort) || true
                  # Routing decides which app labels are in the dump, so these inputs belong in the key.
                  DB_ROUTING=$(git ls-tree -r --format='%(objectname) %(path)' HEAD -- products/db_routing.yaml posthog/product_db_config.py posthog/product_db_router.py)
                  PG_IMAGE=$(git show "HEAD:docker-compose.base.yml" 2>/dev/null \
                      | grep -m1 -E '^[[:space:]]*image:[[:space:]]*postgres:' | tr -d '[:space:]')
                  if [ -z "$MIG_FILES" ]; then
                      echo "key=" >> $GITHUB_OUTPUT
                  else
                      MIG_HASH=$(printf '%s\n%s\n%s' "$MIG_FILES" "$PG_IMAGE" "$DB_ROUTING" | sha256sum | cut -c1-40)
                      echo "key=posthog-schema-mig-${SCHEMA_CACHE_EPOCH}-${MIG_HASH}" >> $GITHUB_OUTPUT
                  fi
            - name: Restore master schema dump from cache
              if: github.event_name != 'push' && steps.master-schema-key.outputs.key != ''
              uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: schema.sql.gz
                  key: ${{ steps.master-schema-key.outputs.key }}
                  # The exact key misses in the minutes between a master migration
                  # landing and its dump being saved. The PR base commit's dump is
                  # always older than the checkout, so migrate just tops it up.
                  restore-keys: |
                      posthog-schema-master-${{ github.event.pull_request.base.sha }}
            - name: Wait for Docker services
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
              run: bin/ci-wait-for-docker wait --only db redis7 clickhouse
            - name: Prime posthog DB from cached schema
              # Turns "Run migrations up to master" below into a no-op instead
              # of a full migration run.
              if: github.event_name != 'push'
              run: |
                  if [ ! -f schema.sql.gz ]; then
                      echo "::notice::Master schema cache miss — the next step runs all migrations from scratch"
                      exit 0
                  fi
                  # The load is atomic: on failure the transaction rolls back and
                  # the fallback below recreates an empty DB for a full migrate.
                  # ensure_migration_defaults re-seeds data-migration rows the
                  # schema-only dump lacks.
                  if gunzip -c schema.sql.gz | docker compose -f docker-compose.dev.yml exec -T db psql -q -v ON_ERROR_STOP=1 --single-transaction -U posthog posthog > /dev/null \
                      && (cd upstream-master && .venv-master/bin/python manage.py ensure_migration_defaults); then
                      echo "Primed posthog DB from cached master schema"
                  else
                      echo "::warning::Cached schema restore failed — recreating empty DB; the next step runs all migrations from scratch"
                      # Terminate lingering sessions first or DROP DATABASE fails
                      # (same guard as _recreate_database in hogli's db_schema.py).
                      docker compose -f docker-compose.dev.yml exec -T db psql -U posthog postgres -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'posthog' AND pid <> pg_backend_pid();"
                      docker compose -f docker-compose.dev.yml exec -T db psql -U posthog postgres -c "DROP DATABASE IF EXISTS posthog;"
                      docker compose -f docker-compose.dev.yml exec -T db psql -U posthog postgres -c "CREATE DATABASE posthog;"
                  fi
                  rm -f schema.sql.gz
            - name: Run migrations up to master
              working-directory: upstream-master
              run: |
                  # Run Django migrations first (excluding managed=False models)
                  .venv-master/bin/python manage.py migrate
                  # Then run persons migrations using sqlx; comment out until we've merged
                  # DATABASE_URL="postgres://posthog:posthog@localhost:5432/posthog_persons" \
                  #   sqlx database create
                  # DATABASE_URL="postgres://posthog:posthog@localhost:5432/posthog_persons" \
                  #   sqlx migrate run --source rust/persons_migrations/
            - name: Register upstream baseline for migration checks
              run: git fetch --no-tags --prune --depth=1 "$GITHUB_WORKSPACE/upstream-master" HEAD:refs/remotes/upstream/master
            # Now we can consider this PR's migrations
            - name: Checkout this PR
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  # For same-repo PRs, checkout the actual branch (not the merge commit)
                  # so upstream/master..HEAD reflects PR files. Fork PRs fall back
                  # to the default merge commit.
                  ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'PostHog/posthog') && github.event.pull_request.head.ref || github.ref }}
                  clean: false
            - name: Install python dependencies for this PR
              run: |
                  UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev
            # Depot shadow: migration SQL-comment + risk-analysis-comment steps stripped.
            # Keep the risk check itself so blocked migrations still fail the job.
            - name: Run migration risk analysis
              if: github.event_name == 'pull_request'
              run: python manage.py analyze_migration_risk --fail-on-blocked
            - name: Run migrations for this PR
              run: |
                  # Run Django migrations first (excluding managed=False models)
                  python manage.py migrate
                  # Then run persons migrations using sqlx
                  DATABASE_URL="postgres://posthog:posthog@localhost:5432/posthog_persons" \
                    sqlx migrate run --source rust/persons_migrations/
            - name: Dump migrated schema
              if: github.event_name == 'push'
              run: |
                  set -e
                  set -o pipefail
                  # Dump schema + django_migrations data so Django knows which migrations are applied
                  # Run pg_dump inside container to ensure version match (host has pg_dump 16, container has 15)
                  (docker compose -f docker-compose.dev.yml exec -T db pg_dump --schema-only --clean --if-exists -U posthog posthog && \
                   docker compose -f docker-compose.dev.yml exec -T db pg_dump --data-only --table=django_migrations -U posthog posthog) | gzip > schema.sql.gz
                  # Verify the dump is valid
                  gunzip -t schema.sql.gz
            - name: Save schema to Actions cache for PR shards
              # Kept as the exact merge-base key that every consumer's restore-keys falls back to.
              if: github.event_name == 'push'
              uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: schema.sql.gz
                  key: posthog-schema-master-${{ github.sha }}
            - name: Compute migration-set schema key
              # Must match the merge-base computation in turbo-discover and the
              # master restore key above (inputs, hash, and key prefix).
              if: github.event_name == 'push'
              id: mig-schema-key
              run: |
                  MIG_FILES=$(git ls-tree -r --format='%(objectname) %(path)' HEAD \
                      | grep -E '/migrations/[^/]+\.py$|^[0-9a-f]+ uv\.lock$' \
                      | grep -vE '/(clickhouse|async_migrations)/migrations/' \
                      | LC_ALL=C sort) || true
                  # Routing decides which app labels are in the dump, so these inputs belong in the key.
                  DB_ROUTING=$(git ls-tree -r --format='%(objectname) %(path)' HEAD -- products/db_routing.yaml posthog/product_db_config.py posthog/product_db_router.py)
                  PG_IMAGE=$(git show "HEAD:docker-compose.base.yml" 2>/dev/null \
                      | grep -m1 -E '^[[:space:]]*image:[[:space:]]*postgres:' | tr -d '[:space:]')
                  if [ -z "$MIG_FILES" ]; then
                      echo "key=" >> $GITHUB_OUTPUT
                      echo "::notice::no migration files matched — skipping migration-set schema save"
                  else
                      MIG_HASH=$(printf '%s\n%s\n%s' "$MIG_FILES" "$PG_IMAGE" "$DB_ROUTING" | sha256sum | cut -c1-40)
                      echo "key=posthog-schema-mig-${SCHEMA_CACHE_EPOCH}-${MIG_HASH}" >> $GITHUB_OUTPUT
                  fi
            - name: Save schema to Actions cache (migration-set key)
              if: github.event_name == 'push' && steps.mig-schema-key.outputs.key != ''
              uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: schema.sql.gz
                  key: ${{ steps.mig-schema-key.outputs.key }}
            - name: Check migrations
              # Skip migration safety check on master push (no migration_files from path filter)
              if: github.event_name != 'push'
              env:
                  MIGRATIONS_FILES: ${{ needs.changes.outputs.migrations_files }}
              run: |
                  DATABASE_URL="postgres://posthog:posthog@localhost:5432/posthog_persons" \
                    sqlx migrate info --source rust/persons_migrations/
                  python manage.py makemigrations --check --dry-run
            - name: Check CH migrations
              env:
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: |
                  # Count only migrations this PR adds; a stacked PR's base branch already carries the lower layers'.
                  DIFF_BASE=upstream/master
                  if [ -n "$BASE_REF" ] && [ "$BASE_REF" != "master" ]; then
                      if git fetch --no-tags --depth=1 --filter=blob:none origin "$BASE_REF:refs/remotes/origin/$BASE_REF"; then
                          DIFF_BASE="origin/$BASE_REF"
                      else
                          echo "::warning::Could not fetch base ref $BASE_REF; counting CH migrations against master instead"
                      fi
                  fi
                  # Same as above, except now for CH looking at files that were added in posthog/clickhouse/migrations/
                  git diff --name-status "$DIFF_BASE"..HEAD | grep "A\sposthog/clickhouse/migrations/" | grep -v README | awk '{print $2}' | python manage.py test_ch_migrations_are_safe
    check-openapi-types:
        needs: [changes]
        # Not on master push: master only primes the schema cache.
        if: (needs.changes.outputs.backend == 'true' || needs.changes.outputs.openapi_types == 'true') && github.event_name != 'push'
        timeout-minutes: 20
        name: Validate OpenAPI types
        runs-on: depot-ubuntu-24.04
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'PostHog/posthog') && github.event.pull_request.head.ref || github.ref }}
                  clean: false
            - name: Clean up data directories with container permissions
              run: |
                  [ -d "data" ] && docker run --rm -v "$(pwd)/data:/data" alpine sh -c "rm -rf /data/seaweedfs /data/minio" || true
              continue-on-error: true
            - name: Log in to Docker Hub
              if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
              continue-on-error: true
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Stop/Start stack with Docker Compose
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
              run: bin/ci-wait-for-docker launch --background --down db clickhouse
            - name: Set up Python
              uses: ./.depot/actions/setup-python-cached
              with:
                  python-version: 3.13.13
            - name: Install uv
              id: setup-uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28'
                  enable-cache: true
                  cache-dependency-glob: uv.lock
                  save-cache: ${{ github.ref == 'refs/heads/master' }}
            - name: Install SAML (python3-saml) dependencies
              if: steps.setup-uv.outputs.cache-hit != 'true'
              run: |
                  sudo rm -f /etc/apt/sources.list.d/*twingate*
                  sudo apt-get update
                  sudo apt-get install libxml2-dev libxmlsec1-dev libxmlsec1-openssl
            - name: Install python dependencies
              run: UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev
            - name: Install pnpm dependencies
              uses: ./.depot/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/root --filter=@posthog/frontend... --filter=@posthog/mcp... install --frozen-lockfile
            - name: Wait for Docker services
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
              run: bin/ci-wait-for-docker wait --only db clickhouse
            - name: Add OpenAPI Problem Matcher
              run: echo "::add-matcher::.github/openapi-problem-matcher.json"
            - name: Check OpenAPI types
              run: |
                  ./bin/hogli build:openapi
                  pnpm --filter=@posthog/mcp run scaffold-yaml -- --sync-all
                  if git diff --exit-code; then
                      echo "OpenAPI types are up to date"
                      exit 0
                  fi
                  echo "::error::OpenAPI types are out of date — run 'hogli build:openapi' locally and commit the result."
                  exit 1
    build_django_matrix:
        name: Build Django matrix
        needs: [changes, get_clickhouse_versions, turbo-discover]
        if: |
            !cancelled() &&
            needs.changes.outputs.backend == 'true' &&
            needs.get_clickhouse_versions.result == 'success'
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 5
        outputs:
            include: ${{ steps.build.outputs.include }}
        steps:
            - name: Build matrix include list
              id: build
              env:
                  OLDEST_SUPPORTED_IMAGE: ${{ needs.get_clickhouse_versions.outputs.oldest_supported_image }}
                  COMPAT_MATRIX_JSON: ${{ needs.get_clickhouse_versions.outputs.compat_matrix }}
                  DJANGO_SHARDS_JSON: ${{ needs.turbo-discover.outputs.django_shards }}
                  MODE: ${{ needs.turbo-discover.outputs.mode }}
                  RUN_POE: ${{ fromJSON(needs.turbo-discover.outputs.selection || '{}').run_poe }}
                  RUN_TEMPORAL: ${{ fromJSON(needs.turbo-discover.outputs.selection || '{}').run_temporal }}
                  CORE_FILES: ${{ fromJSON(needs.turbo-discover.outputs.selection || '{}').core_files }}
                  COMPAT_FILES: ${{ fromJSON(needs.turbo-discover.outputs.selection || '{}').compat_files }}
                  SEGMENT_SHARDS: ${{ fromJSON(needs.turbo-discover.outputs.selection || '{}').segment_shards }}
                  # A trunk-merge/** PR opens as a draft but is the merge gate, and
                  # turbo-discover deliberately does not select for it. Reporting it as a
                  # draft here would turn that empty MODE into "skip" and build an
                  # empty matrix, so the queue would merge having run no Django tests
                  # at all. Not-draft makes the empty MODE fall through to the full
                  # matrix, which is what the queue has to run.
                  IS_DRAFT: ${{ github.event.pull_request.draft && !startsWith(github.head_ref, 'trunk-merge/') }}
                  IS_PR_RUN: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'trunk-merge/') }}
                  FORCE_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'run-ci-backend') }}
                  # Manual shadow runs compare with canonical master pushes, which run legacy schema only.
                  RUN_NEW_EVENTS_SCHEMA: ${{ contains(github.event.pull_request.labels.*.name, 'test-new-events-schema') }}
              run: |
                  # :NOTE: Keep shard counts/group ranges in sync with historical Django matrix tuning.
                  # Consult #team-devex before changing.

                  # A draft PR must never fall back to the full matrix. turbo-discover sets
                  # MODE to "skip"/"full"/"selected"; an empty MODE on a
                  # draft means turbo-discover was cancelled or failed (typically
                  # ready_for_review superseding it mid-flight). Skip here and defer to the
                  # ready run. The run-ci-backend label intentionally forces full on a draft.
                  if [[ -z "$MODE" && "$IS_DRAFT" == "true" && "$FORCE_FULL" != "true" ]]; then
                      echo "::notice::Draft PR with no trusted Django selection — skipping heavy matrices; the ready-for-review run is the full gate"
                      MODE="skip"
                  fi

                  if [[ "$MODE" == "skip" ]]; then
                      # Draft PR where selection couldn't be trusted: skip the heavy
                      # matrices and defer to the full run on ready for review.
                      echo "include=[]" >> "$GITHUB_OUTPUT"
                      echo "Django matrix size: 0 (mode=skip)"
                      exit 0
                  fi
                  if [[ "$MODE" == "selected" ]]; then
                      # Selected mode: run only the segments that have selected files. Shard
                      # counts come from turbo-discover, which applies its per-shard budget to
                      # the selected tests' recorded seconds. A wide selection therefore
                      # spreads over several jobs instead of running to the job timeout in
                      # one. No counts means one shard per segment.
                      segment_shards="${SEGMENT_SHARDS:-}"
                      [[ -z "$segment_shards" ]] && segment_shards='{"core": 1, "poe": 1, "temporal": 1}'

                      core_count=0
                      [[ -n "$CORE_FILES" ]] && core_count=$(jq -r '.core' <<< "$segment_shards")
                      core=$(jq -cn --arg image "$OLDEST_SUPPORTED_IMAGE" --argjson n "$core_count" '
                        [range(1; $n + 1) | {
                          segment: "Core",
                          "person-on-events": false,
                          "new-events-schema": false,
                          "python-version": "3.13.13",
                          "clickhouse-server-image": $image,
                          concurrency: $n,
                          group: .,
                          artifact_key: ("core-" + (.|tostring)),
                          compat: false
                        }]
                      ')
                      core_new_events_schema=$(jq -cn --arg image "$OLDEST_SUPPORTED_IMAGE" --argjson n "$core_count" '
                        [range(1; $n + 1) | {
                          segment: "Core",
                          "person-on-events": false,
                          "new-events-schema": true,
                          "python-version": "3.13.13",
                          "clickhouse-server-image": $image,
                          concurrency: $n,
                          group: .,
                          artifact_key: ("core-events-json-" + (.|tostring)),
                          compat: false
                        }]
                      ')
                      poe_count=0
                      [[ "$IS_PR_RUN" != "true" && "$RUN_POE" == "true" ]] && poe_count=$(jq -r '.poe' <<< "$segment_shards")
                      core_persons_on_events=$(jq -cn --arg image "$OLDEST_SUPPORTED_IMAGE" --argjson n "$poe_count" '
                        [range(1; $n + 1) | {
                          segment: "Core",
                          "person-on-events": true,
                          "new-events-schema": false,
                          "python-version": "3.13.13",
                          "clickhouse-server-image": $image,
                          concurrency: $n,
                          group: .,
                          artifact_key: ("core-poe-" + (.|tostring)),
                          compat: false
                        }]
                      ')
                      core_persons_on_events_new_schema=$(jq -cn --arg image "$OLDEST_SUPPORTED_IMAGE" --argjson n "$poe_count" '
                        [range(1; $n + 1) | {
                          segment: "Core",
                          "person-on-events": true,
                          "new-events-schema": true,
                          "python-version": "3.13.13",
                          "clickhouse-server-image": $image,
                          concurrency: $n,
                          group: .,
                          artifact_key: ("core-poe-events-json-" + (.|tostring)),
                          compat: false
                        }]
                      ')
                      temporal_count=0
                      [[ "$RUN_TEMPORAL" == "true" ]] && temporal_count=$(jq -r '.temporal' <<< "$segment_shards")
                      temporal=$(jq -cn --arg image "$OLDEST_SUPPORTED_IMAGE" --argjson n "$temporal_count" '
                        [range(1; $n + 1) | {
                          segment: "Temporal",
                          "person-on-events": false,
                          "new-events-schema": false,
                          "python-version": "3.13.13",
                          "clickhouse-server-image": $image,
                          concurrency: $n,
                          group: .,
                          artifact_key: ("temporal-" + (.|tostring)),
                          compat: false
                        }]
                      ')
                      temporal_new_events_schema=$(jq -cn --arg image "$OLDEST_SUPPORTED_IMAGE" --argjson n "$temporal_count" '
                        [range(1; $n + 1) | {
                          segment: "Temporal",
                          "person-on-events": false,
                          "new-events-schema": true,
                          "python-version": "3.13.13",
                          "clickhouse-server-image": $image,
                          concurrency: $n,
                          group: .,
                          artifact_key: ("temporal-events-json-" + (.|tostring)),
                          compat: false
                        }]
                      ')
                      # Compat covers the older supported ClickHouse versions over
                      # CLICKHOUSE_COMPAT_PYTEST_TARGETS. Selection can drop it only when the
                      # diff touches none of those paths — otherwise a narrowed run would
                      # silently lose the one signal the full matrix has about old servers.
                      # One unsharded entry per version, over the selected compat files.
                      if [[ -n "$COMPAT_FILES" ]]; then
                          compat=$(jq -cn --argjson compat "${COMPAT_MATRIX_JSON:-[]}" '
                            [ $compat
                              | map(."clickhouse-server-image") | unique | to_entries[]
                              | {
                                  "clickhouse-server-image": .value,
                                  segment: "Core",
                                  "person-on-events": false,
                                  "new-events-schema": false,
                                  "python-version": "3.13.13",
                                  concurrency: 1,
                                  group: 1,
                                  compat: true,
                                  artifact_key: ("compat-" + ((.key + 1)|tostring))
                                }
                            ]
                          ')
                      else
                          compat="[]"
                      fi
                  else
                      # Full run: auto-shard counts from turbo-discover (Amdahl's law on .test_durations).
                      # Falls back to hardcoded defaults if turbo-discover failed or data is missing.
                      CORE_SHARDS=38
                      CORE_POE_SHARDS=7
                      TEMPORAL_SHARDS=7
                      if [ -n "$DJANGO_SHARDS_JSON" ] && echo "$DJANGO_SHARDS_JSON" | jq -e '.Core.shards' > /dev/null 2>&1; then
                        CORE_SHARDS=$(echo "$DJANGO_SHARDS_JSON" | jq -r '.Core.shards')
                        CORE_POE_SHARDS=$(echo "$DJANGO_SHARDS_JSON" | jq -r '.CorePOE.shards')
                        TEMPORAL_SHARDS=$(echo "$DJANGO_SHARDS_JSON" | jq -r '.Temporal.shards')
                        echo "Auto-sharding: Core=$CORE_SHARDS, CorePOE=$CORE_POE_SHARDS, Temporal=$TEMPORAL_SHARDS"
                      else
                        echo "::warning::Django shard auto-sizing unavailable, using defaults: Core=$CORE_SHARDS, CorePOE=$CORE_POE_SHARDS, Temporal=$TEMPORAL_SHARDS"
                      fi

                      # The legacy-mode safeguard leg runs only where a regression must not
                      # land: merge queue and master. Ordinary PR lanes run the
                      # customer-default mode only, so a PR pays no shards for the legacy
                      # mode. The queue's trunk-merge/** run is a pull_request event as well,
                      # so it is exempted by branch. Compat keeps its own legacy-mode rows in
                      # every lane, because it guards old servers, not this.
                      if [[ "$IS_PR_RUN" == "true" ]]; then
                          CORE_POE_SHARDS=0
                      fi

                      core=$(jq -cn --arg image "$OLDEST_SUPPORTED_IMAGE" --argjson shards "$CORE_SHARDS" '
                        [range(1; $shards + 1) | {
                          segment: "Core",
                          "person-on-events": false,
                          "new-events-schema": false,
                          "python-version": "3.13.13",
                          "clickhouse-server-image": $image,
                          concurrency: $shards,
                          group: .,
                          artifact_key: ("core-" + (.|tostring)),
                          compat: false
                        }]
                      ')

                      core_new_events_schema=$(jq -cn --arg image "$OLDEST_SUPPORTED_IMAGE" --argjson shards "$CORE_SHARDS" '
                        [range(1; $shards + 1) | {
                          segment: "Core",
                          "person-on-events": false,
                          "new-events-schema": true,
                          "python-version": "3.13.13",
                          "clickhouse-server-image": $image,
                          concurrency: $shards,
                          group: .,
                          artifact_key: ("core-events-json-" + (.|tostring)),
                          compat: false
                        }]
                      ')

                      core_persons_on_events=$(jq -cn --arg image "$OLDEST_SUPPORTED_IMAGE" --argjson shards "$CORE_POE_SHARDS" '
                        [range(1; $shards + 1) | {
                          segment: "Core",
                          "person-on-events": true,
                          "new-events-schema": false,
                          "python-version": "3.13.13",
                          "clickhouse-server-image": $image,
                          concurrency: $shards,
                          group: .,
                          artifact_key: ("core-poe-" + (.|tostring)),
                          compat: false
                        }]
                      ')

                      core_persons_on_events_new_schema=$(jq -cn --arg image "$OLDEST_SUPPORTED_IMAGE" --argjson shards "$CORE_POE_SHARDS" '
                        [range(1; $shards + 1) | {
                          segment: "Core",
                          "person-on-events": true,
                          "new-events-schema": true,
                          "python-version": "3.13.13",
                          "clickhouse-server-image": $image,
                          concurrency: $shards,
                          group: .,
                          artifact_key: ("core-poe-events-json-" + (.|tostring)),
                          compat: false
                        }]
                      ')

                      temporal=$(jq -cn --arg image "$OLDEST_SUPPORTED_IMAGE" --argjson shards "$TEMPORAL_SHARDS" '
                        [range(1; $shards + 1) | {
                          segment: "Temporal",
                          "person-on-events": false,
                          "new-events-schema": false,
                          "python-version": "3.13.13",
                          "clickhouse-server-image": $image,
                          concurrency: $shards,
                          group: .,
                          artifact_key: ("temporal-" + (.|tostring)),
                          compat: false
                        }]
                      ')

                      temporal_new_events_schema=$(jq -cn --arg image "$OLDEST_SUPPORTED_IMAGE" --argjson shards "$TEMPORAL_SHARDS" '
                        [range(1; $shards + 1) | {
                          segment: "Temporal",
                          "person-on-events": false,
                          "new-events-schema": true,
                          "python-version": "3.13.13",
                          "clickhouse-server-image": $image,
                          concurrency: $shards,
                          group: .,
                          artifact_key: ("temporal-events-json-" + (.|tostring)),
                          compat: false
                        }]
                      ')

                      compat_source="${COMPAT_MATRIX_JSON:-[]}"
                      compat=$(jq -cn --argjson compat "$compat_source" '
                        [
                          $compat
                          | to_entries[]
                          | .value + {
                              segment: "Core",
                              "person-on-events": false,
                              "new-events-schema": false,
                              "python-version": "3.13.13",
                              compat: true,
                              artifact_key: ("compat-" + ((.key + 1)|tostring))
                            }
                        ]
                      ')
                  fi

                  if [[ "$RUN_NEW_EVENTS_SCHEMA" != "true" ]]; then
                      echo "Skipping new-events-schema variants (add the test-new-events-schema label to run them)"
                      core_new_events_schema="[]"
                      core_persons_on_events_new_schema="[]"
                      temporal_new_events_schema="[]"
                  fi

                  include=$(jq -cn \
                    --argjson core "$core" \
                    --argjson core_new_events_schema "$core_new_events_schema" \
                    --argjson core_persons_on_events "$core_persons_on_events" \
                    --argjson core_persons_on_events_new_schema "$core_persons_on_events_new_schema" \
                    --argjson temporal "$temporal" \
                    --argjson temporal_new_events_schema "$temporal_new_events_schema" \
                    --argjson compat "$compat" \
                    '$core + $core_new_events_schema + $core_persons_on_events + $core_persons_on_events_new_schema + $temporal + $temporal_new_events_schema + $compat')

                  echo "include=$include" >> "$GITHUB_OUTPUT"
                  echo "Django matrix size: $(jq -r 'length' <<< "$include") (mode=$MODE)"
    django:
        needs: [changes, turbo-discover, detect-snapshot-mode, get_clickhouse_versions, build_django_matrix]
        # Run legacy pytest if:
        # 1. Legacy code directly changed (ee/, posthog/)
        # 2. OR product changes affect legacy code (turbo-discover outputs run_legacy=true)
        # 3. OR turbo-discover itself failed (conservative: run Django on detection failure)
        # The non-empty include guard covers drafts in skip mode and selected runs
        # that chose zero files — an empty matrix would otherwise fail the job.
        # A status function is required to inspect dependency results after failures.
        # Use !cancelled(), not always(), so superseded matrix jobs still receive cancellation.
        if: |
            !cancelled() &&
            needs.changes.outputs.backend == 'true' &&
            needs.build_django_matrix.result == 'success' &&
            needs.build_django_matrix.outputs.include != '[]' &&
            (needs.changes.outputs.legacy == 'true' ||
             needs.turbo-discover.outputs.run_legacy == 'true' ||
             (needs.turbo-discover.result != 'success' && needs.turbo-discover.result != 'skipped'))
        # increase for tmate testing
        # 45 to match canonical; the shadow is non-blocking so no deploy-gate coupling.
        timeout-minutes: 45
        name: Django tests – ${{ matrix.segment }}${{ matrix.compat && ' compat' || '' }} (persons-on-events ${{ (matrix.segment == 'Core' && !matrix.person-on-events && !matrix.compat) && 'on' || 'off' }}, events schema ${{ matrix.new-events-schema && 'json' || 'legacy' }}), Py ${{ matrix.python-version }}, ${{ matrix.clickhouse-server-image }} (${{matrix.group}}/${{ matrix.concurrency }})
        # Match canonical's runner size. The shadow restores the same master-primed
        # schema cache (turbo-discover key + check-migrations save), so shards skip
        # migrations exactly like canonical once Depot's cache is warmed by a master run.
        runs-on: depot-ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJson(needs.build_django_matrix.outputs.include) }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 1
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.ref }}
                  lfs: true
                  clean: false
            - name: Install signal-fanout
              shell: bash
              run: sudo install -m 0755 .github/scripts/signal-fanout /usr/local/bin/signal-fanout
            - name: Clean up data directories with container permissions
              run: |
                  # Use docker to clean up files created by containers
                  [ -d "data" ] && docker run --rm -v "$(pwd)/data:/data" alpine sh -c "rm -rf /data/seaweedfs /data/minio" || true
              continue-on-error: true
            - name: 'Safeguard: ensure no stray Python modules at product root'
              run: |
                  echo "Checking that products/* only contain backend/, frontend/, or shared/ as Python code roots..."
                  BAD_FILES=$(find products -maxdepth 2 -type f -name "*.py" ! -path "*/backend/*" ! -name "__init__.py" ! -name "conftest.py" -o -maxdepth 2 -type d -name "migrations" ! -path "*/backend/*")
                  if [ -n "$BAD_FILES" ]; then
                    echo "❌ Found Python code or migrations outside backend/:"
                    echo "$BAD_FILES"
                    echo "Please move these into the appropriate backend/ folder."
                    exit 1
                  fi
                  echo "✅ No stray Python files or migrations found at product roots."
            # Pre-tests
            # Copies the fully versioned UDF xml file for use in CI testing
            - name: Log in to Docker Hub
              if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
              continue-on-error: true
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Stop/Start stack with Docker Compose
              shell: bash
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
                  COMPOSE_PROFILES: temporal,azure
                  CLICKHOUSE_SERVER_IMAGE: ${{ matrix.clickhouse-server-image || needs.get_clickhouse_versions.outputs.oldest_supported_image }}
                  WAIT_FOR_DOCKER_LAUNCH_RETRIES: 3
                  WAIT_FOR_DOCKER_LAUNCH_RETRY_DELAY: 5
              run: |
                  cp posthog/user_scripts/latest_user_defined_function.xml docker/clickhouse/user_defined_function.xml
                  bin/ci-wait-for-docker launch --background --down-all-profiles
            - name: Add service hostnames to /etc/hosts
              shell: bash
              run: echo "127.0.0.1 db redis7 kafka clickhouse clickhouse-coordinator objectstorage seaweedfs temporal" | sudo tee -a /etc/hosts
            # Tool cache steps inlined rather than the setup-python-cached composite:
            # this job checks out the PR head ref, which cannot resolve a local
            # action that only exists on master until the branch rebases. The
            # restore sits before the parallel block so the tool cache is warm
            # when setup-python starts.
            - name: Restore Python tool cache
              id: python-toolcache
              uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: ${{ runner.tool_cache }}/Python/${{ matrix.python-version }}
                  key: python-toolcache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}
            - parallel:
                  - name: Set up Python
                    uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
                    with:
                        python-version: ${{ matrix.python-version }}
                  - name: Install Rust
                    if: needs.changes.outputs.backend == 'true'
                    uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
                    with:
                        toolchain: 1.91.1
                        components: cargo
            - name: Save Python tool cache
              if: github.ref == 'refs/heads/master' && steps.python-toolcache.outputs.cache-hit != 'true'
              uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: ${{ runner.tool_cache }}/Python/${{ matrix.python-version }}
                  key: python-toolcache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}
            - name: Install uv
              id: setup-uv-tests
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28' # pinned: unpinned setup-uv calls GH API on every job, exhausts rate limit
                  enable-cache: true
                  cache-dependency-glob: uv.lock
                  save-cache: ${{ github.ref == 'refs/heads/master' }}
            - name: Install SAML (python3-saml) dependencies
              if: ${{ needs.changes.outputs.backend == 'true' && steps.setup-uv-tests.outputs.cache-hit != 'true' }}
              shell: bash
              run: |
                  sudo rm -f /etc/apt/sources.list.d/*twingate* && sudo apt-get update && sudo apt-get install libxml2-dev libxmlsec1-dev libxmlsec1-openssl
            - name: Install sqlx-cli
              if: needs.changes.outputs.backend == 'true'
              uses: ./.depot/actions/setup-sqlx-cli
            - name: Determine if hogql-parser has changed compared to upstream master
              shell: bash
              id: hogql-parser-diff
              run: |
                  git fetch --no-tags --prune --depth=1 https://github.com/PostHog/posthog.git master
                  changed=$(git diff --quiet HEAD FETCH_HEAD -- common/hogql_parser/ && echo "false" || echo "true")
                  echo "changed=$changed" >> $GITHUB_OUTPUT
            # tests would intermittently fail in GH actions
            # with exit code 134 _after passing_ all tests
            # this appears to fix it
            # absolute wild tbh https://stackoverflow.com/a/75503402

            # Cache Qt library packages to reduce network dependency and flakiness
            # Using cache-apt-pkgs-action instead of setup-qt-libs to avoid network issues
            - name: Cache and install Qt libraries
              uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # v1.6.0
              with:
                  packages: libegl1 libdbus-1-3 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0 x11-utils libxcb-cursor0 libopengl0
                  version: 1.0
            - name: Install Python dependencies
              shell: bash
              run: |
                  UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev
            - name: Set up Node.js for canvas builder
              if: ${{ needs.changes.outputs.backend == 'true' && matrix.segment == 'Core' && hashFiles('products/canvas/packages/canvas_builder/package.json') != '' }}
              uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version-file: .nvmrc
            - name: Install canvas builder dependencies
              if: ${{ needs.changes.outputs.backend == 'true' && matrix.segment == 'Core' }}
              shell: bash
              run: |
                  if [[ -f products/canvas/packages/canvas_builder/package.json ]]; then
                      npm ci --ignore-scripts --omit=dev --prefix products/canvas/packages/canvas_builder
                  fi
            - name: Install the working version of hogql-parser
              if: ${{ needs.changes.outputs.backend == 'true' && steps.hogql-parser-diff.outputs.changed == 'true' }}
              shell: bash
              # This is not cached, because the current HEAD version of hogql-parser must be built if it has
              # changed (requirements.txt has the already-published version)
              run: |
                  # Short budget: the `||` mirror is the real fallback for a host that is down.
                  fetch=(curl --fail --location --retry 3 --retry-all-errors --retry-max-time 30 --connect-timeout 10)
                  "${fetch[@]}" https://www.antlr.org/download/antlr4-cpp-runtime-4.13.1-source.zip --output antlr4-source.zip \
                      || "${fetch[@]}" https://raw.githubusercontent.com/antlr/website-antlr4/gh-pages/download/antlr4-cpp-runtime-4.13.1-source.zip --output antlr4-source.zip
                  # Check that the downloaded archive is the expected runtime - a security measure
                  anltr_known_md5sum="c875c148991aacd043f733827644a76f"
                  antlr_found_ms5sum="$(md5sum antlr4-source.zip | cut -d' ' -f1)"
                  if [[ "$anltr_known_md5sum" != "$antlr_found_ms5sum" ]]; then
                      echo "Unexpected MD5 sum of antlr4-source.zip!"
                      echo "Known: $anltr_known_md5sum"
                      echo "Found: $antlr_found_ms5sum"
                      exit 64
                  fi
                  unzip antlr4-source.zip -d antlr4-source && cd antlr4-source
                  cmake .
                  DESTDIR=out make install
                  sudo cp -r out/usr/local/include/antlr4-runtime /usr/include/
                  sudo cp out/usr/local/lib/libantlr4-runtime.so* /usr/lib/
                  sudo ldconfig
                  cd ..
                  pip install ./common/hogql_parser
            - name: Set up needed files
              shell: bash
              run: |
                  mkdir -p frontend/dist
                  touch frontend/dist/index.html
                  touch frontend/dist/layout.html
                  touch frontend/dist/exporter.html
                  ./bin/download-mmdb
            - name: Wait for Docker services
              shell: bash
              # Read-only health poll for core services only. Can't use --wait here
              # because it blocks on ALL project containers including temporal, which
              # boots slowly (auto-setup runs DB migrations). Temporal was started in
              # background above and will be ready by the time temporal tests run.
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
                  COMPOSE_PROFILES: temporal,azure
                  CLICKHOUSE_SERVER_IMAGE: ${{ matrix.clickhouse-server-image || needs.get_clickhouse_versions.outputs.oldest_supported_image }}
              run: bin/ci-wait-for-docker wait
            - name: Restore schema cache from master
              if: ${{ github.event_name == 'pull_request' && needs.turbo-discover.outputs.schema_cache_key != '' }}
              uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: schema.sql.gz
                  # Prefer the shared content key; fall back to the exact merge-base SHA key,
                  # then to the newest dump of any migration set. Right after a migration
                  # lands on master both exact keys miss until ci-backend re-dumps, and a
                  # from-scratch migrate costs ~17 minutes per shard; pytest's keepdb
                  # migrate tops a slightly stale dump up in seconds instead.
                  key: ${{ needs.turbo-discover.outputs.schema_migrations_key || needs.turbo-discover.outputs.schema_cache_key }}
                  restore-keys: |
                      ${{ needs.turbo-discover.outputs.schema_cache_key }}
                      ${{ needs.turbo-discover.outputs.schema_prefix_key }}
            - name: Prime test_posthog from cached schema
              # Treat cache problems as misses; the migrate step below rebuilds the DB
              # whenever this one reports restored=false.
              id: prime-schema
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  echo "restored=false" >> "$GITHUB_OUTPUT"
                  if [ ! -f schema.sql.gz ]; then
                      echo "::notice::Schema cache miss; the migrate step will build test_posthog"
                      exit 0
                  fi
                  mkdir -p .postgres-backups
                  mv schema.sql.gz .postgres-backups/schema-latest.sql.gz
                  if ./bin/hogli db:restore-test-db; then
                      echo "restored=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "::warning::Schema restore failed (stale/incompatible cached dump?); the migrate step will build test_posthog"
                  fi
            - name: Migrate test_posthog from scratch
              # Any run without a restored schema cache (master, dispatches, PR cache
              # misses) replays the full migration chain here, in a process that exits
              # before tests: the executor's memory high-water stays resident in
              # whichever process runs it, and pytest must not carry it through the
              # test phase. pytest --reuse-db adopts the DB like the PR prime above;
              # any failure falls back to the in-pytest migrate.
              if: ${{ github.event_name != 'pull_request' || steps.prime-schema.outputs.restored != 'true' }}
              env:
                  DATABASE_URL: postgres://posthog:posthog@localhost:5432/test_posthog
              run: |
                  admin_psql() { docker compose -f docker-compose.dev.yml exec -T db psql -U posthog postgres "$@"; }
                  if ! admin_psql -c "DROP DATABASE IF EXISTS test_posthog;" -c "CREATE DATABASE test_posthog;"; then
                      echo "::warning::Could not recreate test_posthog; pytest --reuse-db will run the full migrate itself"
                      exit 0
                  fi
                  if ! python manage.py migrate; then
                      echo "::warning::Out-of-process migrate failed; pytest --reuse-db will run the full migrate itself"
                      admin_psql -c "DROP DATABASE IF EXISTS test_posthog;" || true
                  fi
            - name: Restore test durations from cache
              uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: .test_durations
                  key: posthog-test-durations-${{ github.run_id }}
                  restore-keys: |
                      posthog-test-durations-
            - name: Fall back to the last published durations
              # .test_durations is not in the repo. The timing workflow refreshes the
              # cache several times a day and publishes the same files as an artifact
              # of its own runs. On a cache miss (retention lapsed, timing workflow
              # down for two weeks) take the newest artifact; if that is gone too,
              # pytest-split splits by count and turbo-discover sizes from file counts
              # until the next timing run.
              if: ${{ hashFiles('.test_durations') == '' }}
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-backend-update-test-timing.yml \
                      --branch master --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
                  if [ -z "$run_id" ]; then
                      echo "::warning::No successful timing run to fall back to, sharding without durations"
                      exit 0
                  fi
                  gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name test-durations --dir . \
                      || echo "::warning::Timing artifact of run $run_id unavailable, sharding without durations"
            - name: Restore per-segment test durations from cache
              uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: |
                      .test_durations.core
                      .test_durations.temporal
                  key: posthog-segment-durations-${{ github.run_id }}
                  restore-keys: |
                      posthog-segment-durations-
            - name: Compute hypothesis constants cache key
              # hypothesis builds its constants pool of property-test inputs by
              # AST-parsing every local module in sys.modules. It caches the result
              # in .hypothesis/constants under a hash of each source file, so the
              # pool is content-addressed: restoring a stale copy is safe, because a
              # changed file reads as a miss and rebuilds. CI otherwise pays the full
              # parse on every shard's pytest collection (about 10 s per shard).
              id: hyp-constants-key
              shell: bash
              run: |
                  # The key includes the installed hypothesis version because the
                  # entry format is an implementation detail, and rotates weekly so
                  # entries for deleted or rewritten files expire. The restore prefix
                  # covers the gap until the first master run of a new week saves.
                  hyp_version=$(python -c "import hypothesis; print(hypothesis.__version__)")
                  prefix="posthog-hypothesis-constants-${hyp_version}-${HYPOTHESIS_CONSTANTS_EPOCH}-"
                  {
                      echo "key=${prefix}$(date -u +%G-%V)"
                      echo "restore_prefix=${prefix}"
                  } >> "$GITHUB_OUTPUT"
            - name: Restore hypothesis constants cache
              id: hyp-constants
              uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  # Constants only. Do NOT add .hypothesis/examples: the example
                  # database decides which inputs property tests replay, so reusing
                  # one across runs changes what the tests check.
                  path: .hypothesis/constants
                  key: ${{ steps.hyp-constants-key.outputs.key }}
                  restore-keys: |
                      ${{ steps.hyp-constants-key.outputs.restore_prefix }}
            # Tests
            - name: Set snapshot update flags
              if: ${{ needs.changes.outputs.backend == 'true' && (needs.detect-snapshot-mode.outputs.mode == 'update' || matrix.person-on-events) }}
              shell: bash
              run: echo "PYTEST_ARGS=--snapshot-update --snapshot-warn-unused" >> "$GITHUB_ENV"
            - name: Set compat snapshot flags
              if: ${{ needs.changes.outputs.backend == 'true' && matrix.compat }}
              shell: bash
              run: echo "PYTEST_ARGS=--snapshot-update --snapshot-warn-unused" >> "$GITHUB_ENV"
            - name: Set check-mode snapshot flags
              if: ${{ needs.changes.outputs.backend == 'true' && needs.detect-snapshot-mode.outputs.mode != 'update' && !matrix.person-on-events && !matrix.compat }}
              shell: bash
              run: echo "PYTEST_ARGS=--snapshot-warn-unused" >> "$GITHUB_ENV"
            - name: Log test environment diagnostics
              if: ${{ needs.changes.outputs.backend == 'true' && matrix.segment == 'Core' }}
              shell: bash
              env:
                  SHARD_GROUP: ${{ matrix.group }}
                  SHARD_CONCURRENCY: ${{ matrix.concurrency }}
                  CLICKHOUSE_IMAGE: ${{ matrix.clickhouse-server-image }}
                  CLICKHOUSE_HOGQL_USE_NEW_EVENTS_SCHEMA: ${{ matrix.new-events-schema && 'true' || 'false' }}
                  COMMIT_SHA: ${{ github.sha }}
                  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
              run: |
                  echo "=== Test Environment Diagnostics ==="
                  echo "Shard: $SHARD_GROUP/$SHARD_CONCURRENCY"
                  echo "Python version: $(python --version)"
                  echo "ClickHouse version: $CLICKHOUSE_IMAGE"
                  echo "Events schema: $CLICKHOUSE_HOGQL_USE_NEW_EVENTS_SCHEMA"
                  echo "Commit: $COMMIT_SHA"
                  echo "Branch: $BRANCH_NAME"
                  echo "Runner: $(uname -a)"
                  echo "Memory: $(free -h | head -2)"
                  echo "Disk: $(df -h / | tail -1)"
                  echo "Docker containers:"
                  docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || true
                  echo "==================================="
            - name: Run Core tests
              id: run-core-tests
              if: ${{ needs.changes.outputs.backend == 'true' && matrix.segment == 'Core' }}
              env:
                  # Person-on-events v2 reads are the production default for every
                  # project created since 2024-06-14, so the full Core rows run with the
                  # mode on. matrix.person-on-events marks the safeguard allowlist leg
                  # that keeps the legacy joined mode covered, not the mode itself: every
                  # other condition keyed on it (targets, snapshot ownership, timing
                  # artifacts) selects the leg. Compat rows run the legacy mode as well,
                  # as the old-server safeguard.
                  # marker: person-on-events-default. The run block below greps the
                  # checked-out workflow for this token to tell a head that carries the
                  # flip from one that predates it.
                  PERSON_ON_EVENTS_V2_ENABLED: ${{ !matrix.person-on-events && !matrix.compat && 'true' || 'false' }}
                  CLICKHOUSE_HOGQL_USE_NEW_EVENTS_SCHEMA: ${{ matrix.new-events-schema && 'true' || 'false' }}
                  MODE: ${{ needs.turbo-discover.outputs.mode }}
                  CORE_FILES: ${{ fromJSON(needs.turbo-discover.outputs.selection || '{}').core_files }}
                  POE_FILES: ${{ fromJSON(needs.turbo-discover.outputs.selection || '{}').poe_files }}
                  COMPAT_FILES: ${{ fromJSON(needs.turbo-discover.outputs.selection || '{}').compat_files }}
                  # devex: measure core (posthog/ee) coverage on PRs to size the gap vs products. sysmon = low overhead.
                  COVERAGE_CORE: sysmon
                  # Mirrors canonical: the coverage report skips narrowed runs, so
                  # instrumenting one is pure overhead.
                  COV_ARGS: ${{ github.event_name == 'pull_request' && needs.turbo-discover.outputs.mode != 'selected' && '--cov=posthog --cov=ee --cov-config=.github/coverage-core.cfg --cov-report=xml:coverage-core.xml' || '' }}
              shell: 'signal-fanout bash --noprofile --norc -eo pipefail {0}'
              run: |
                  unset GITHUB_TOKEN # reserved var injected by Depot CI; can't override via env: (see workflow env note)
                  set +e
                  # Unrebased branches predate .github/coverage-core.cfg; an explicit --cov-config
                  # pointing at a missing file is a hard error, so drop coverage rather than fail.
                  if [[ -n "$COV_ARGS" && ! -f .github/coverage-core.cfg ]]; then
                      COV_ARGS=""
                  fi
                  # The job checks out the PR head while this workflow runs merged with
                  # master. A head that predates the person-on-events default lacks the
                  # test pins that came with it, so keep it on the legacy mode until it
                  # rebases. The marker sits on this step's env line in the checked-out copy.
                  if [[ "$PERSON_ON_EVENTS_V2_ENABLED" == "true" ]] && ! grep -qF "marker: person-on-events-default" .github/workflows/ci-backend.yml; then
                      echo "::notice::Checked-out revision predates the person-on-events default, running Core in legacy mode"
                      export PERSON_ON_EVENTS_V2_ENABLED=false
                  fi
                  # Pick the split algorithm and granularity at runtime: optimal_chunks + file
                  # granularity only when the installed pytest-split offers them, else
                  # duration_based_chunks / item. A workflow edit runs merged with master, so an
                  # unrebased PR on older pytest-split must not hit an unknown flag.
                  SPLITTING_ALGORITHM=duration_based_chunks
                  SPLIT_GRANULARITY=()
                  if python -c "from pytest_split.algorithms import Algorithms; from pytest_split.plugin import PytestSplitFilePlugin; raise SystemExit(0 if 'optimal_chunks' in Algorithms.names() else 1)" 2>/dev/null; then
                      SPLITTING_ALGORITHM=optimal_chunks
                      SPLIT_GRANULARITY=(--split-granularity=file)
                      # Scope the file-mode plan to Core's clean per-segment durations when the
                      # pinned pytest-split supports it; only persons-on-events-off, non-compat Core
                      # matches the .core run-set, and a missing file falls back to the union.
                      if [ -f .test_durations.core ] && [[ "${{ matrix.person-on-events }}" != "true" ]] && [[ "${{ matrix.compat }}" != "true" ]] && python -c "from pytest_split.plugin import SUPPORTS_SPLIT_PLAN_PATH" 2>/dev/null; then
                          SPLIT_GRANULARITY+=(--split-plan-path .test_durations.core)
                      fi
                  fi
                  if [[ "$MODE" == "selected" ]]; then
                      # Selected mode: run only the test files chosen by the snob shadow selector.
                      # Sharded only when build_django_matrix sized the segment above one
                      # shard, and no --reruns anywhere, mirroring
                      # canonical: retries mask the raw flake signal Trunk needs (the shadow
                      # strips the quarantine gate itself).
                      if [[ "${{ matrix.compat }}" == "true" ]]; then
                          targets="$COMPAT_FILES"
                      elif [[ "${{ matrix.person-on-events }}" == "true" ]]; then
                          targets="$POE_FILES"
                      else
                          targets="$CORE_FILES"
                      fi
                      # A selection wide enough to need more than one shard is split like a
                      # full run. Item granularity on purpose: the target list is already
                      # narrow, so pre-import file skipping saves nothing, and the per-segment
                      # plan file describes a different run-set than the selected subset.
                      SELECTED_SPLIT=()
                      if [[ "${{ matrix.concurrency }}" -gt 1 ]]; then
                          SELECTED_SPLIT=(--splits "${{ matrix.concurrency }}" --group "${{ matrix.group }}"
                                          --splitting-algorithm="$SPLITTING_ALGORITHM")
                      fi
                      # shellcheck disable=SC2086
                      pytest -v --tb=short --reuse-db -o junit_duration_report=call $targets -m "not async_migrations" \
                          "${SELECTED_SPLIT[@]}" \
                          -r fEsxX \
                          --junitxml=junit-core.xml \
                          $COV_ARGS \
                          $PYTEST_ARGS
                  else
                    full_targets="posthog ee/"
                    full_ignores=()
                    if [[ "${{ matrix.compat }}" == "true" ]]; then
                        full_targets="$CLICKHOUSE_COMPAT_PYTEST_TARGETS"
                    elif [[ "${{ matrix.person-on-events }}" == "true" ]]; then
                        full_targets="./posthog/clickhouse/ ./posthog/queries/ ./posthog/api/test/dashboards/test_dashboard.py ee/clickhouse/"
                        full_ignores+=(--ignore=posthog/hogql_queries --ignore=posthog/hogql)
                    fi
                    # shellcheck disable=SC2086
                    pytest -v --tb=short --reuse-db -o junit_duration_report=call $full_targets -m "not async_migrations" \
                        --ignore=posthog/temporal \
                        --ignore=posthog/dags \
                        --ignore=common/hogvm/python/test \
                        --ignore=posthog/test/repo_invariants \
                        "${full_ignores[@]}" \
                        --splits ${{ matrix.concurrency }} --group ${{ matrix.group }} \
                        --durations=1000 --durations-min=1.0 \
                        --pytest-durations=100 \
                        --splitting-algorithm="$SPLITTING_ALGORITHM" \
                        "${SPLIT_GRANULARITY[@]}" \
                        -r fEsxX \
                        --junitxml=junit-core.xml \
                        $COV_ARGS \
                        $PYTEST_ARGS
                  fi
                  exit_code=$?
                  set -e
                  if [ $exit_code -eq 5 ]; then
                      echo "No tests collected for this shard, this is expected when splitting tests"
                      exit 0
                  else
                      exit $exit_code
                  fi
            - name: Log test environment diagnostics
              if: ${{ needs.changes.outputs.backend == 'true' && matrix.segment == 'Temporal' }}
              shell: bash
              env:
                  SHARD_GROUP: ${{ matrix.group }}
                  SHARD_CONCURRENCY: ${{ matrix.concurrency }}
                  CLICKHOUSE_HOGQL_USE_NEW_EVENTS_SCHEMA: ${{ matrix.new-events-schema && 'true' || 'false' }}
                  COMMIT_SHA: ${{ github.sha }}
                  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
              run: |
                  echo "=== Test Environment Diagnostics ==="
                  echo "Shard: $SHARD_GROUP/$SHARD_CONCURRENCY"
                  echo "Python version: $(python --version)"
                  echo "Events schema: $CLICKHOUSE_HOGQL_USE_NEW_EVENTS_SCHEMA"
                  echo "Commit: $COMMIT_SHA"
                  echo "Branch: $BRANCH_NAME"
                  echo "Runner: $(uname -a)"
                  echo "Memory: $(free -h | head -2)"
                  echo "Disk: $(df -h / | tail -1)"
                  echo "Docker containers:"
                  docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || true
                  echo "==================================="
            - name: Run Temporal tests
              id: run-temporal-tests
              if: ${{ needs.changes.outputs.backend == 'true' && matrix.segment == 'Temporal' }}
              shell: 'signal-fanout bash --noprofile --norc -eo pipefail {0}'
              env:
                  AWS_S3_ALLOW_UNSAFE_RENAME: 'true'
                  MODAL_TOKEN_ID: ${{ needs.changes.outputs.tasks_temporal == 'true' && secrets.MODAL_TOKEN_ID || '' }}
                  MODAL_TOKEN_SECRET: ${{ needs.changes.outputs.tasks_temporal == 'true' && secrets.MODAL_TOKEN_SECRET || '' }}
                  CLICKHOUSE_HOGQL_USE_NEW_EVENTS_SCHEMA: ${{ matrix.new-events-schema && 'true' || 'false' }}
                  MODE: ${{ needs.turbo-discover.outputs.mode }}
                  TEMPORAL_FILES: ${{ fromJSON(needs.turbo-discover.outputs.selection || '{}').temporal_files }}
              run: |
                  unset GITHUB_TOKEN # reserved var injected by Depot CI; can't override via env: (see workflow env note)
                  set +e
                  # Pick the split algorithm and granularity at runtime (see Run Core tests).
                  SPLITTING_ALGORITHM=duration_based_chunks
                  SPLIT_GRANULARITY=()
                  if python -c "from pytest_split.algorithms import Algorithms; from pytest_split.plugin import PytestSplitFilePlugin; raise SystemExit(0 if 'optimal_chunks' in Algorithms.names() else 1)" 2>/dev/null; then
                      SPLITTING_ALGORITHM=optimal_chunks
                      SPLIT_GRANULARITY=(--split-granularity=file)
                      # Plan path disabled while the cached plan predates the temporal
                      # routing move, see the .github workflow for the full note.
                      :
                  fi
                  # Depot-only quarantine: the data-modeling materialize path (get_s3_client) 403s on
                  # MinIO on Depot-native CI only — MinIO itself is reachable with the standard test creds
                  # (verified via boto3 LIST/CREATE/HEAD), so root cause is env-specific and not yet
                  # isolated (tracked for follow-up). All three tests below run that materialize path; the
                  # two timeout tests fail downstream (hogql_table never reached). Canonical GHA still runs them.
                  # The --deselect guards stay on both branches so a selected run can't re-enable them.
                  if [[ "$MODE" == "selected" ]]; then
                      # Selected mode: no --reruns — see the core selected branch;
                      # the full run also skips --reruns, mirroring canonical.
                      # A selection wide enough to need more than one shard is split like a
                      # full run. Item granularity on purpose: the target list is already
                      # narrow, so pre-import file skipping saves nothing, and the per-segment
                      # plan file describes a different run-set than the selected subset.
                      SELECTED_SPLIT=()
                      if [[ "${{ matrix.concurrency }}" -gt 1 ]]; then
                          SELECTED_SPLIT=(--splits "${{ matrix.concurrency }}" --group "${{ matrix.group }}"
                                          --splitting-algorithm="$SPLITTING_ALGORITHM")
                      fi
                      # shellcheck disable=SC2086
                      pytest -v --tb=short --reuse-db -o junit_duration_report=call $TEMPORAL_FILES -m "not async_migrations" \
                          "${SELECTED_SPLIT[@]}" \
                          --deselect "posthog/temporal/tests/data_modeling/test_run_workflow.py::test_run_workflow_with_minio_bucket" \
                          --deselect "posthog/temporal/tests/data_modeling/test_run_workflow.py::test_run_workflow_timeout_does_not_pause_schedule_without_consecutive_failures" \
                          --deselect "posthog/temporal/tests/data_modeling/test_run_workflow.py::test_run_workflow_timeout_pauses_schedule_after_5_consecutive_failures" \
                          -r fEsxX \
                          --junitxml=junit-temporal.xml \
                          $PYTEST_ARGS
                  else
                      # No per-test pytest --timeout; rely on the job-level timeout-minutes as the single
                      # safety net. The per-test timeout also terminates the whole process, so it adds
                      # no protection beyond the job timeout.
                      pytest -v --tb=short --reuse-db -o junit_duration_report=call posthog/temporal products/signals/backend/emission -m "not async_migrations" \
                          --deselect "posthog/temporal/tests/data_modeling/test_run_workflow.py::test_run_workflow_with_minio_bucket" \
                          --deselect "posthog/temporal/tests/data_modeling/test_run_workflow.py::test_run_workflow_timeout_does_not_pause_schedule_without_consecutive_failures" \
                          --deselect "posthog/temporal/tests/data_modeling/test_run_workflow.py::test_run_workflow_timeout_pauses_schedule_after_5_consecutive_failures" \
                          --splits ${{ matrix.concurrency }} --group ${{ matrix.group }} \
                          --durations=100 --durations-min=1.0 \
                          --pytest-durations=100 \
                          --splitting-algorithm="$SPLITTING_ALGORITHM" \
                          "${SPLIT_GRANULARITY[@]}" \
                          -r fEsxX \
                          --junitxml=junit-temporal.xml \
                          $PYTEST_ARGS
                  fi
                  exit_code=$?
                  set -e
                  if [ $exit_code -eq 5 ]; then
                      echo "No tests collected for this shard, this is expected when splitting tests"
                      exit 0
                  else
                      exit $exit_code
                  fi
            - name: Save hypothesis constants cache
              # One Core shard per master run writes the weekly entry: a save from
              # every shard would race on the same key and churn the shared cache
              # budget. cache-hit != 'true' skips the save once this week's entry
              # exists, which keeps later master runs cheap.
              # continue-on-error: overlapping master runs at week rollover fail its
              # reservation check when an earlier run has saved the same key, and a
              # cache miss must never red a green run.
              continue-on-error: true
              if: |
                  github.ref == 'refs/heads/master' &&
                  matrix.segment == 'Core' &&
                  matrix.group == 1 &&
                  !matrix.person-on-events &&
                  !matrix.new-events-schema &&
                  !matrix.compat &&
                  steps.hyp-constants.outputs.cache-hit != 'true'
              uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: .hypothesis/constants
                  key: ${{ steps.hyp-constants-key.outputs.key }}
            # Post tests
            - name: Show docker compose logs on failure
              if: failure() && (needs.changes.outputs.backend == 'true' && steps.run-core-tests.outcome != 'failure' && steps.run-temporal-tests.outcome != 'failure')
              shell: bash
              run: docker compose -f docker-compose.dev.yml logs
    # Read ClickHouse versions for the compat test matrix.
    get_clickhouse_versions:
        name: Get ClickHouse versions
        needs: [changes]
        if: needs.changes.outputs.backend == 'true' && github.event_name != 'push'
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 5
        outputs:
            # Oldest supported version as plain string (for comparisons)
            oldest_supported_image: ${{ steps.read-versions.outputs.oldest_supported_image }}
            # Local dev / hobby image, mirrored from clickhouse-versions.json `local`
            local_image: ${{ steps.read-versions.outputs.local_image }}
            # Fully expanded compat matrix (version x shard group)
            compat_matrix: ${{ steps.read-versions.outputs.compat_matrix }}
        steps:
            # Merge ref, for turbo-tests: it checks out the merge ref and mounts that config.xml.
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: .github/clickhouse-versions.json
                  sparse-checkout-cone-mode: false
            # Head ref, for django: it checks out the PR head and mounts that config.xml. Reading
            # its version from the merge ref instead would split an atomic version+config bump.
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.ref }}
                  sparse-checkout: .github/clickhouse-versions.json
                  sparse-checkout-cone-mode: false
                  path: head-tree
            - name: Read ClickHouse versions from JSON
              id: read-versions
              env:
                  DJANGO_VERSIONS: head-tree/.github/clickhouse-versions.json
              run: |
                  compat_shards="2"
                  echo "Using $compat_shards shard(s) per compat version"

                  # Oldest supported version for main Django tests (for max compatibility)
                  oldest_supported=$(jq -r '.oldest_supported' "$DJANGO_VERSIONS")
                  if [ -z "$oldest_supported" ] || [ "$oldest_supported" = "null" ]; then
                    echo "::error::No oldest_supported version found in $DJANGO_VERSIONS"
                    exit 1
                  fi
                  echo "oldest_supported_image=$oldest_supported" >> $GITHUB_OUTPUT
                  echo "Oldest supported version for Django tests: $oldest_supported"

                  # Local dev / hobby image — the version product (turbo) tests run against.
                  local_image=$(jq -r '.local' .github/clickhouse-versions.json)
                  if [ -z "$local_image" ] || [ "$local_image" = "null" ]; then
                    echo "::error::No local version found in .github/clickhouse-versions.json"
                    exit 1
                  fi
                  echo "local_image=$local_image" >> $GITHUB_OUTPUT
                  echo "Local dev/hobby image for product tests: $local_image"

                  # Read all unique versions so we can derive compat coverage.
                  all=$(jq -c '[.[]] | unique' "$DJANGO_VERSIONS")
                  if [ "$all" = "[]" ] || [ -z "$all" ]; then
                    echo "::error::No versions found in $DJANGO_VERSIONS"
                    exit 1
                  fi
                  echo "All CH versions found: $all"

                  # Compat coverage is only needed for non-oldest versions.
                  compat_versions=$(jq -c --arg oldest "$oldest_supported" '[.[]] | unique | map(select(. != $oldest))' "$DJANGO_VERSIONS")
                  echo "Compat versions (excluding oldest): $compat_versions"

                  compat_count=$(jq -r 'length' <<< "$compat_versions")
                  echo "compat_count=$compat_count" >> $GITHUB_OUTPUT

                  if [ "$compat_count" -eq 0 ]; then
                    echo "compat_matrix=[]" >> $GITHUB_OUTPUT
                    echo "No non-oldest CH versions found — compat tests provide no additional coverage, skipping"
                  else
                    compat_matrix=$(jq -cn --argjson versions "$compat_versions" --argjson shards "$compat_shards" '
                      [
                        $versions[] as $version
                        | range(1; $shards + 1) as $group
                        | {
                            "clickhouse-server-image": $version,
                            "concurrency": $shards,
                            "group": $group
                          }
                      ]
                    ')
                    echo "compat_matrix=$compat_matrix" >> $GITHUB_OUTPUT
                    echo "Compat matrix: $compat_matrix"
                  fi
    # Job just to collate the status of the matrix jobs for requiring passing status
    django_tests:
        needs:
            [
                sample,
                changes,
                get_clickhouse_versions,
                build_django_matrix,
                django,
                check-migrations,
                check-openapi-types,
                turbo-discover,
                build-product-test-matrix,
                turbo-tests,
                repo-checks,
            ]
        name: '[optional, does not block merge] Django Tests Pass'
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 5
        # always() collates skipped/failed matrix jobs; gated on the sampling result so it
        # doesn't spin up a lone runner when this run was sampled out (or the shadow is off).
        if: always() && needs.sample.outputs.sampled == 'true'
        steps:
            - name: Summarize dependency results
              run: |
                  {
                    echo "### Backend CI dependency results"
                    echo "| Dependency | Result |"
                    echo "| --- | --- |"
                    echo "| changes | ${{ needs.changes.result }} |"
                    echo "| get_clickhouse_versions | ${{ needs.get_clickhouse_versions.result }} |"
                    echo "| build_django_matrix | ${{ needs.build_django_matrix.result }} |"
                    echo "| django | ${{ needs.django.result }} |"
                    echo "| check-migrations | ${{ needs.check-migrations.result }} |"
                    echo "| check-openapi-types | ${{ needs.check-openapi-types.result }} |"
                    echo "| repo-checks | ${{ needs.repo-checks.result }} |"
                    echo "| turbo-discover | ${{ needs.turbo-discover.result }} |"
                    echo "| build-product-test-matrix | ${{ needs.build-product-test-matrix.result }} |"
                    echo "| turbo-tests | ${{ needs.turbo-tests.result }} |"
                  } | tee -a "$GITHUB_STEP_SUMMARY"

            - name: Check dependency results
              run: |
                  check_required_result() {
                    local label="$1"
                    local result="$2"

                    if [[ "$result" != "success" && "$result" != "skipped" ]]; then
                      echo "::error::$label did not succeed (result: '$result')."
                      exit 1
                    fi
                  }

                  # Upstream jobs whose failure would otherwise only cascade into django
                  # being *skipped*, which this gate reads as success — a green gate with
                  # zero backend tests run. Naming them makes the failure hit the gate
                  # directly; legitimate skips (frontend-only PRs) and plain successes still pass.
                  check_required_result "Change detection" "${{ needs.changes.result }}"
                  check_required_result "ClickHouse versions" "${{ needs.get_clickhouse_versions.result }}"
                  check_required_result "Django matrix build" "${{ needs.build_django_matrix.result }}"
                  check_required_result "Django test matrix" "${{ needs.django.result }}"
                  check_required_result "Migration checks" "${{ needs.check-migrations.result }}"
                  check_required_result "OpenAPI type checks" "${{ needs.check-openapi-types.result }}"
                  check_required_result "Repo checks" "${{ needs.repo-checks.result }}"
                  check_required_result "Turbo discover" "${{ needs.turbo-discover.result }}"
                  check_required_result "Product test matrix build" "${{ needs.build-product-test-matrix.result }}"
                  check_required_result "Product/Turbo tests" "${{ needs.turbo-tests.result }}"

                  echo "All backend and product checks passed."
    # Depot shadow: calculate-running-time is omitted so shadow runs are not recorded as canonical CI data.
