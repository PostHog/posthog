# Git and the API must still be up: the checkout clones from GitHub, and Depot
# resolves the dispatch through the API. Depot finds this workflow only if the
# file is on master, but it runs the dispatched ref's copy of it.
# Runbook: https://wiki.posthog.com/operations/deployments/deploy-during-github-outage
#
# Pushes to posthog-cloud-prs because the posthog-cloud publish role is trusted
# through the GitHub OIDC issuer, which Depot CI cannot present: Depot mints its
# own tokens from identity.depot.dev, so that role is out of reach at every ref.
# The Depot role trusts any ref on purpose, which is why it can only reach the
# -prs repositories. Widening it is not the fix.

name: Actions outage image build

on:
    workflow_dispatch:

jobs:
    build:
        name: Build and push to ECR
        runs-on: depot-ubuntu-24.04
        timeout-minutes: 45
        permissions:
            id-token: write
            contents: read

        steps:
            - name: Check out
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Set up Depot CLI
              uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
              with:
                  role-to-assume: ${{ vars.DEPOT_POSTHOG_PRS_PUBLISH_IAM_ROLE }}
                  aws-region: us-east-1

            - name: Login to Amazon ECR
              id: aws-ecr
              uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78 # v2.1.2

            # The Dockerfile pulls node, python and debian from Docker Hub. Depot forwards the
            # credentials from this sandbox to the remote builder, so logging in here keeps those
            # base image pulls off the anonymous per-IP rate limit. The images are public, so a
            # missing secret or a failed login falls back to anonymous pulls and does not stop
            # the outage build.
            - name: Login to Docker Hub
              if: ${{ vars.DOCKERHUB_USER != '' && secrets.DOCKERHUB_TOKEN != '' }}
              continue-on-error: true
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  username: ${{ vars.DOCKERHUB_USER }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            # The same steps as in container-images-cd.yml, so an image built during an outage links
            # backend exceptions to its release and uploads its sourcemaps like a normal build does.
            # Depot CI isn't trusted for OIDC in PostHog, so hog uses the upload key. The key stays
            # in this job and never enters the image build. None of these steps blocks the build:
            # each continues on error, and an image built without the processed frontend keeps its
            # .map files. An empty release id is fine: the SDK treats a blank value as unset.
            - name: Install hog
              id: hog
              continue-on-error: true
              timeout-minutes: 5
              run: |
                  path=$(.github/scripts/install-hog.sh)
                  echo "path=$path" >> "$GITHUB_OUTPUT"

            - name: Resolve error tracking release
              id: release
              if: steps.hog.outputs.path != ''
              continue-on-error: true
              timeout-minutes: 5
              env:
                  HOG: ${{ steps.hog.outputs.path }}
                  HOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_UPLOAD_SOURCEMAPS_CLI_API_KEY }}
                  HOG_HOST: https://us.posthog.com
                  HOG_PROJECT_ID: '2'
                  HOG_NO_UPDATE_CHECK: '1'
              run: |
                  id=$("$HOG" error-tracking release --release-name posthog --release-version "$GITHUB_SHA" -o text)
                  echo "release-id=$id" >> "$GITHUB_OUTPUT"

            - name: Export the frontend build
              id: frontend
              if: steps.hog.outputs.path != ''
              continue-on-error: true
              timeout-minutes: 20
              uses: depot/build-push-action@5f3b3c2e5a00f0093de47f657aeaefcedff27d18 # v1.17.0
              with:
                  context: .
                  target: frontend-dist
                  platforms: linux/amd64
                  outputs: type=local,dest=${{ runner.temp }}/sourcemap-upload

            - name: Upload frontend sourcemaps
              id: sourcemaps
              if: steps.frontend.outcome == 'success'
              continue-on-error: true
              timeout-minutes: 15
              env:
                  HOG: ${{ steps.hog.outputs.path }}
                  HOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_UPLOAD_SOURCEMAPS_CLI_API_KEY }}
              run: .github/scripts/upload-frontend-sourcemaps.sh "$HOG" "$RUNNER_TEMP/sourcemap-upload" "$GITHUB_SHA"

            - name: Build and push
              id: build
              uses: depot/build-push-action@5f3b3c2e5a00f0093de47f657aeaefcedff27d18 # v1.17.0
              with:
                  context: .
                  tags: ${{ steps.aws-ecr.outputs.registry }}/posthog-cloud-prs:${{ github.sha }}
                  platforms: linux/amd64,linux/arm64
                  build-args: |
                      COMMIT_HASH=${{ github.sha }}
                      POSTHOG_RELEASE_ID=${{ steps.release.outputs.release-id }}
                  push: true
                  # Replaces the Dockerfile's sourcemap-upload stage with the processed frontend, once
                  # the upload above worked. Without it the image keeps the .map files.
                  build-contexts: ${{ steps.sourcemaps.outcome == 'success' && format('sourcemap-upload={0}/sourcemap-upload', runner.temp) || '' }}

            # This branch never ran CI, so a fatal import must fail here rather than
            # crash-loop in production. Web alone is not enough: temporal and celery
            # import product code that django.setup() skips.
            - name: Verify image boots and report
              env:
                  IMAGE: ${{ steps.aws-ecr.outputs.registry }}/posthog-cloud-prs@${{ steps.build.outputs.digest }}
                  TAG: ${{ github.sha }}
              run: |
                  docker run --rm \
                      -e SKIP_SERVICE_VERSION_REQUIREMENTS=1 \
                      -e STATIC_COLLECTION=1 \
                      -e DATABASE_URL=postgres:/// \
                      -e REDIS_URL=redis:/// \
                      -e INTERNAL_API_SECRET=ci-boot-test-dummy-secret \
                      "$IMAGE" sh -ec '
                          python -c "import posthog.asgi; import posthog.management.commands.start_temporal_worker; from posthog.celery import app; app.loader.import_default_modules()"
                          python manage.py check
                      '
                  {
                      echo "## Image ready"
                      echo
                      echo "Tag for the ArgoCD image override input: \`$TAG\`"
                      echo
                      echo "Digest for a live manifest edit: \`$IMAGE\`"
                      echo
                      echo "Runbook: https://wiki.posthog.com/operations/deployments/deploy-during-github-outage"
                  } | tee -a "$GITHUB_STEP_SUMMARY"
