name: Pull Docker Hub images through mirror.gcr.io
description: |
    Points the Docker daemon at Google's Docker Hub mirror before any image pull.

    `docker compose up` pulls every image before it creates a container, so one
    Docker Hub token request that times out leaves the whole stack missing.
    Token requests to auth.docker.io time out intermittently from Depot CI
    sandboxes. The mirror needs no token, and the daemon falls back to Docker Hub
    for an image the mirror does not hold.

runs:
    using: composite
    steps:
        - name: Configure the registry mirror
          shell: bash
          run: |
              set -uo pipefail
              config=$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')
              # Depot CI sandboxes have no systemd; dockerd reloads registry-mirrors on SIGHUP.
              if ! echo "$config" | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json >/dev/null \
                  || ! pid=$(pidof dockerd) || ! sudo kill -HUP "$pid"; then
                  echo "::warning::Could not configure the registry mirror; images come from Docker Hub"
                  exit 0
              fi
              for _ in $(seq 1 10); do
                  if docker info --format '{{json .RegistryConfig.Mirrors}}' | grep -q mirror.gcr.io; then
                      exit 0
                  fi
                  sleep 1
              done
              echo "::warning::Docker did not load the registry mirror; images come from Docker Hub"
