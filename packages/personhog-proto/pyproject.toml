[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personhog-proto"
version = "0.1.0"
description = "Python stubs generated from proto/personhog"
requires-python = ">=3.13"
dependencies = ["grpcio", "protobuf"]

[tool.hatch.build.targets.wheel]
packages = ["personhog"]

[tool.uv]
exclude-newer = "7 days"
# uv keys the built wheel on pyproject.toml alone by default, so a regeneration that changes only
# the stubs leaves the stale wheel in the cache and uv installs it again. List the stubs to key on
# them too.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "personhog/**/*.py" },
    { file = "personhog/**/*.pyi" },
]
