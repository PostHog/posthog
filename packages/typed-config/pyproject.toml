[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "posthog-typed-config"
version = "0.1.0"
description = "Typed config dataclasses parsed from flat or nested mappings, with secret redaction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["typed_config"]

[tool.uv]
exclude-newer = "7 days"
# uv keys the built wheel on pyproject.toml alone by default, so a source-only change leaves
# the stale wheel in the cache and uv installs it again. List the sources to key on them too.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "typed_config/**/*.py" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:warnings -p no:django"
