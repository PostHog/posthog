# Cross-SDK typed-block content array (`{role, content: [{type: <allowlisted>}, ...]}`).
# Lowest priority (5) so it claims these before the envelope rules can shadow it.

id: compat_array

rules:
    - on:
          role: { is: string }
          content:
              every:
                  shape:
                      type:
                          in:
                              - text
                              - output_text
                              - input_text
                              - function
                              - image
                              - input_image
                              - image_url
                              - file
                              - audio
                              - document
      emit:
          # `if_empty: ''` matches legacy's "all-function blocks → empty content".
          content:
              reject:
                  from: $.content
                  where: { type: function }
                  if_empty: ''
          toolCalls:
              select:
                  from: $.content
                  where: { type: function }
                  pluck:
                      id: $.id
                      name: $.function.name
                      args: $.function.arguments

    # A bare `{type: function}` block — reached when a sibling block outside the
    # allowlist above (e.g. a `thinking` block from a Gemini thought summary)
    # knocks the whole message off the envelope rule and per-block delegation
    # dispatches each block on its own. Without this no rule claims the block and
    # salvage stringifies the tool call into raw JSON.
    - on:
          type: function
          function:
              name: { exists: true }
      emit:
          content: ''
          toolCall:
              id: $.id
              name: $.function.name
              args: $.function.arguments
