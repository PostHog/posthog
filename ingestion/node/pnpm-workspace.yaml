packages:
    - packages/*

blockExoticSubdeps: true
trustPolicy: no-downgrade
# Maintenance releases published without the provenance of an earlier release.
trustPolicyExclude:
    - semver@5.7.2 || 6.3.1
    - undici-types@6.21.0
# `pnpm run` must not start an install, because Docker builds install a filtered subset.
verifyDepsBeforeRun: false
# Installs without a terminal abort when pnpm asks before it rebuilds node_modules, so rebuild without asking.
confirmModulesPurge: false
fetchRetries: 3

overrides:
    form-data: '>=4.0.4'
    typescript: 6.0.3
    ultimate-express>uWebSockets.js: '-'
    fast-xml-parser@^4: '>=4.5.4'
    fast-xml-parser@^5: '>=5.3.5'
    '@smithy/node-http-handler': 4.4.9
    '@smithy/core': 3.24.6

allowBuilds:
    '@datadog/pprof': false
    '@parcel/watcher': true
    '@swc/core': true
    esbuild: true
    lz4: true
    node-gyp: true
    node-rdkafka: true
    protobufjs: true
    re2: true
    snappy: true
    unrs-resolver: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
    - posthog-node
    - '@posthog/*'
