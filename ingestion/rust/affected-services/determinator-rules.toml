# Rules for the determinator crate.
#
# Custom rules are processed before default rules. Default rules already handle:
#   - .cargo/config, .cargo/config.toml → mark-changed = "all"
#   - Cargo.toml (workspace root) → mark-changed = "all"
#   - Cargo.lock → mark-changed = [] (ignored; the graph diff covers it)
#   - README, LICENSE, .gitignore, etc. → mark-changed = []
#
# Paths are workspace-relative: `ingestion/rust/` is stripped, the rest of the
# ingestion tree is `../`, and the rest of the repo is `../../`.

use-default-rules = true

# Cargo.lock intentionally has no rule: the default (mark-changed = []) is
# correct, because the determinator's graph diff already re-simulates each
# member's feature sets and marks every dependent of a changed dependency.
# Do not re-add mark-changed = "all" — it fires on every lockfile touch, so one
# added dev-dependency rebuilds the whole workspace and blows the build timeout.
# When the old graph is missing there is nothing to diff, and compute_affected()
# forces rebuild-all in code instead.

# Dockerfiles and CI image config — cross-cutting build changes.
[[path-rule]]
globs = ["Dockerfile", "Dockerfile.persons-migrate", "../ci/images.yml"]
mark-changed = "all"

# sqlx offline query metadata — affects all sqlx-using crates.
[[path-rule]]
globs = [".sqlx/**"]
mark-changed = "all"

# Proto files trigger every build-script crate that reads them. The
# proto_build_scripts_are_in_determinator_rules test fails if a crate compiles
# protos and is missing here, so keep this list complete rather than counted.
[[path-rule]]
globs = ["../proto/**"]
mark-changed = ["personhog-proto", "kafka-assigner-proto", "ingestion-worker-proto"]

# CI harness inputs that the ingestion test/build jobs depend on — a change
# here should run all of ingestion's Rust CI to catch regressions.
[[path-rule]]
globs = [
    "../ci/**",
    "../../.github/workflows/ingestion-rust.yml",
    "../../.github/workflows/ingestion-images.yml",
    "../../.github/workflows/_ingestion-build-images.yml",
]
mark-changed = "all"

# Catch-all for files outside the workspace — these are not crate source and
# should not trigger rebuilds. Must come AFTER all specific rules for files
# outside the workspace.
[[path-rule]]
globs = ["../**"]
mark-changed = []

# An unmatched workspace-root file marks every crate, and the default rules
# do not match AGENTS.md.
[[path-rule]]
globs = ["AGENTS.md"]
mark-changed = []

# Migration directories are not cargo crates. Tell the determinator to
# ignore them (don't try ancestor-walk package matching). The persons-migrate
# image trigger is handled in custom code outside the determinator.
[[path-rule]]
globs = ["persons_migrations/**", "persons_migrations_hobby/**", "bin/migrate-entry"]
mark-changed = []

# The e2e test harness exercises the personhog services as spawned
# binaries — a runtime dependency the cargo graph cannot see (compile-time
# deps like personhog-proto flow through the graph already). Mark the
# harness affected whenever a service it spawns changes so the CI gate
# runs against those changes.
[[package-rule]]
on-affected = [
    "personhog-replica",
    "personhog-router",
    "personhog-leader",
    "personhog-writer",
    "personhog-identity",
]
mark-changed = ["personhog-test-harness"]
