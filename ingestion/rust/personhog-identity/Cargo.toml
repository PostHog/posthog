[package]
name = "personhog-identity"
workspace = "../../../rust"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
personhog-common = { path = "../personhog-common" }
personhog-coordination = { path = "../personhog-coordination" }
personhog-proto = { path = "../personhog-proto" }
assignment-coordination = { path = "../assignment-coordination" }
common-database = { path = "../../../rust/common/database" }
common-ingestion-warnings = { path = "../ingestion_warnings" }
common-alloc = { path = "../../../rust/common/alloc" }
common-kafka = { path = "../../../rust/common/kafka" }
common-metrics = { path = "../../../rust/common/metrics" }
common-sqlx-macros = { path = "../../../rust/common/sqlx-macros" }
lifecycle = { path = "../../../rust/common/lifecycle" }

async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
envconfig = { workspace = true }
futures = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
rand = { workspace = true }
rdkafka = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
rstest = "0.28"
tokio = { workspace = true, features = ["test-util"] }

# Drains the publish outbox identity writes; a second binary of this crate
# because everything it needs (config, table set, publish module) is the
# identity lib, and it deploys and scales separately from identity.
[[bin]]
name = "personhog-publisher"
path = "src/bin/publisher.rs"

[lints]
workspace = true
