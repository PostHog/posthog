    - name: a path without a team channel registry gets a derived channel
      files:
          owners.yaml: |
              version: 1
              owners: team-a
      expect:
          x.py:
              owners: [team-a]
              unowned_by_design: false
              status: active
              source: owners.yaml
              slack: '#team-a'

    - name: a person handle as primary owner gives no channel
      files:
          owners.yaml: |
              version: 1
              owners: []
              teams:
                team-a:
                  slack: '#a-people'
          indiv/owners.yaml: |
              version: 1
              owners: ['@alice', team-a]
          team-first/owners.yaml: |
              version: 1
              owners: [team-a, '@alice']
      expect:
          indiv/x.py:
              owners: ['@alice', team-a]
              unowned_by_design: false
              status: active
              source: indiv/owners.yaml
              slack: null
          team-first/x.py:
              owners: [team-a, '@alice']
              unowned_by_design: false
              status: active
              source: team-first/owners.yaml
              slack: '#a-people'

    - name: a teams registry outside the root file has no effect
      files:
          owners.yaml: |
              version: 1
              owners: []
          sub/owners.yaml: |
              version: 1
              owners: team-a
              teams:
                team-a:
                  slack: '#a-people'
      expect:
          sub/x.py:
              owners: [team-a]
              unowned_by_design: false
              status: active
              source: sub/owners.yaml
              slack: '#team-a'

    - name: a notifications mapping that names an undeclared producer silences notifications
      files:
          owners.yaml: |
              version: 1
              owners: team-a
              producers: [review-bot]
              teams:
                team-a:
                  slack: '#a-people'
                  notifications:
                    review-bott: '#a-reviews'
      purpose: notifications
      producer: review-bot
      expect:
          x.py:
              owners: [team-a]
              unowned_by_design: false
              status: active
              source: owners.yaml
              slack: null
