cases:
    - name: the slack purpose reads only the slack field of the registry
      files:
          owners.yaml: |
              version: 1
              owners: []
              teams:
                team-split:
                  slack: '#split-people'
                  notifications: '#split-bots'
                team-people:
                  slack: '#people-only'
                team-bots-only:
                  notifications: '#bots-only'
                team-quiet-bots:
                  slack: '#quiet-people'
                  notifications: false
                team-silent:
                  slack: false
                team-empty: {}
                team-mapped:
                  slack: '#mapped-people'
                  notifications:
                    review-bot: '#mapped-reviews'
                    deploy-bot: false
                team-mapped-no-slack:
                  notifications:
                    review-bot: '#mapped-no-slack-reviews'
          team-split/owners.yaml: |
              version: 1
              owners: team-split
          team-people/owners.yaml: |
              version: 1
              owners: team-people
          team-bots-only/owners.yaml: |
              version: 1
              owners: team-bots-only
          team-quiet-bots/owners.yaml: |
              version: 1
              owners: team-quiet-bots
          team-silent/owners.yaml: |
              version: 1
              owners: team-silent
          team-empty/owners.yaml: |
              version: 1
              owners: team-empty
          team-mapped/owners.yaml: |
              version: 1
              owners: team-mapped
          team-unregistered/owners.yaml: |
              version: 1
              owners: team-unregistered
      expect:
          team-split/x.py:
              owners: [team-split]
              unowned_by_design: false
              status: active
              source: team-split/owners.yaml
              slack: '#split-people'
          team-people/x.py:
              owners: [team-people]
              unowned_by_design: false
              status: active
              source: team-people/owners.yaml
              slack: '#people-only'
          team-bots-only/x.py:
              owners: [team-bots-only]
              unowned_by_design: false
              status: active
              source: team-bots-only/owners.yaml
              slack: '#team-bots-only'
          team-quiet-bots/x.py:
              owners: [team-quiet-bots]
              unowned_by_design: false
              status: active
              source: team-quiet-bots/owners.yaml
              slack: '#quiet-people'
          team-silent/x.py:
              owners: [team-silent]
              unowned_by_design: false
              status: active
              source: team-silent/owners.yaml
              slack: null
          team-empty/x.py:
              owners: [team-empty]
              unowned_by_design: false
              status: active
              source: team-empty/owners.yaml
              slack: '#team-empty'
          team-mapped/x.py:
              owners: [team-mapped]
              unowned_by_design: false
              status: active
              source: team-mapped/owners.yaml
              slack: '#mapped-people'
          team-unregistered/x.py:
              owners: [team-unregistered]
              unowned_by_design: false
              status: active
              source: team-unregistered/owners.yaml
              slack: '#team-unregistered'

