[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "posthog-owners"
version = "0.2.0"
description = "Code ownership in owners.yaml files next to the code: resolver, linter, and CODEOWNERS export"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "PostHog", email = "engineering@posthog.com" }
]
keywords = ["ownership", "codeowners", "owners.yaml", "monorepo", "code-review", "devex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
owners = "posthog_owners.cli:main"
# Lets `uvx posthog-owners` work without `--from`.
posthog-owners = "posthog_owners.cli:main"

[project.urls]
Homepage = "https://github.com/PostHog/posthog"
Documentation = "https://github.com/PostHog/posthog/tree/master/tools/owners#readme"
Specification = "https://github.com/PostHog/posthog/blob/master/tools/owners/SPEC.md"
Changelog = "https://github.com/PostHog/posthog/blob/master/tools/owners/CHANGELOG.md"
Repository = "https://github.com/PostHog/posthog/tree/master/tools/owners"
Issues = "https://github.com/PostHog/posthog/issues"

[tool.hatch.build.targets.wheel]
packages = ["posthog_owners"]

[tool.uv]
exclude-newer = "7 days"
# uv keys the built wheel on pyproject.toml alone by default, so a source-only change leaves
# the stale wheel in the cache and uv installs it again. List the sources to key on them too.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "posthog_owners/**/*.py" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:warnings -p no:django"
