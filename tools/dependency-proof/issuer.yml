# The default-branch paths the dependency proof runs from. The prover pins each one in its
# stamphog marker, and stamphog reads this file from the default branch and ignores a proof that
# does not pin every path here. A path that ends in `/` is a directory, pinned by its git tree id.
# See dependency_proof/core/issuer.py for the rules this file must meet.
paths:
    - tools/dependency-proof/
    - .github/actions/setup-uv/
    - .github/workflows/dependency-proof.yml
    - .github/workflows/dependency-proof-trigger.yml
    - .nvmrc
