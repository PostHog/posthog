version: 1
owners: []
rules:
    - match: '/ai-observability/'
      owners: team-ai-observability
    - match:
          - '/cdp/'
          - '/messaging/'
      owners: team-workflows
    - match:
          - '/common/api/'
          - '/common/config/'
          - '/common/groups/'
          - '/common/kafka/'
          - '/common/outputs/'
          - '/common/personhog/'
          - '/common/persons/'
          - '/common/tracing/'
          - '/common/utils/event-ingestion-restrictions/'
          - '/ingestion/'
      owners: team-ingestion
    - match: '/ingestion/pipelines/sessionreplay/'
      owners: [team-replay, team-ingestion]
    - match:
          - '/ingestion/pipelines/sessionreplay/ml-mirror/'
          - '/ingestion/pipelines/sessionreplay/ml-mirror-*/'
      owners: ai-research
    - match:
          - '/session-replay/recording-api/'
          - '/session-replay/recording-rasterizer/'
      owners: team-replay
    - match:
          - '/logs/metrics-rules/'
          - '/logs/pipeline/'
          - '/logs/retention/'
          - '/logs/sampling/'
          - '/logs/services/'
          - '/logs/transformations/'
      owners: team-apm
    - match: '/common/usage-ingestion/'
      owners: team-billing
