version: 1
owners: []
rules:
    - match: '/ai-observability/'
      owners: team-ai-observability
    - match: '/metrics/'
      owners: team-apm
    - match: '/cdp/'
      owners: team-workflows
    - match: '/session-replay/recording-rasterizer/'
      owners: team-replay
    - match:
          - '/logs/*.test.*'
          - '/logs/framework/*.test.*'
          - '/logs/metrics-rules/*.test.*'
          - '/logs/parity/*.test.*'
          - '/logs/pipeline/*.test.*'
          - '/logs/retention/*.test.*'
          - '/logs/sampling/*.test.*'
          - '/logs/services/*.test.*'
          - '/logs/transformations/*.test.*'
          - '/logs/transformations/benchmarks/*.test.*'
      owners: team-apm
    - match:
          - '/common/config/*.test.*'
          - '/common/outputs/*.test.*'
          - '/common/utils/db/*.test.*'
      owners: team-ingestion
    - match:
          - '/session-replay/recording-api/*.test.*'
      owners: team-replay
    - match:
          - '/messaging/push-subscriptions/*.test.*'
      owners: team-workflows
