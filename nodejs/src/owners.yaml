version: 1
owners: []
rules:
    - match: '/ai-observability/'
      owners: team-ai-observability
    - match: '/cdp/'
      owners: team-workflows
    - match: '/ingestion/'
      owners: team-ingestion
    - match: '/ingestion/pipelines/sessionreplay/'
      owners: [team-replay, team-ingestion]
    - match:
          - '/ingestion/pipelines/sessionreplay/ml-mirror/'
          - '/ingestion/pipelines/sessionreplay/ml-mirror-*/'
      owners: ai-research
    - match: '/session-replay/recording-rasterizer/'
      owners: team-replay
    - match:
          - '/logs/*.test.*'
          - '/logs/framework/*.test.*'
          - '/logs/metrics-rules/*.test.*'
          - '/logs/parity/*.test.*'
          - '/logs/pipeline/*.test.*'
          - '/logs/retention/*.test.*'
          - '/logs/sampling/*.test.*'
          - '/logs/services/*.test.*'
          - '/logs/transformations/*.test.*'
          - '/logs/transformations/benchmarks/*.test.*'
      owners: team-apm
    - match:
          - '/common/usage-ingestion/*.test.*'
      owners: team-billing
    - match:
          - '/common/api/*.test.*'
          - '/common/api/middleware/*.test.*'
          - '/common/config/*.test.*'
          - '/common/groups/*.test.*'
          - '/common/groups/repositories/*.test.*'
          - '/common/kafka/*.test.*'
          - '/common/kafka/consumer/*.test.*'
          - '/common/outputs/*.test.*'
          - '/common/personhog/*.test.*'
          - '/common/persons/*.test.*'
          - '/common/persons/repositories/*.test.*'
          - '/common/tracing/*.test.*'
          - '/common/utils/db/*.test.*'
          - '/common/utils/event-ingestion-restrictions/*.test.*'
      owners: team-ingestion
    - match:
          - '/schema-check/*.test.*'
      owners: team-devex
    - match:
          - '/session-replay/recording-api/*.test.*'
      owners: team-replay
    - match:
          - '/common/utils/seal-intrinsics.test.*'
          - '/messaging/push-subscriptions/*.test.*'
      owners: team-workflows
