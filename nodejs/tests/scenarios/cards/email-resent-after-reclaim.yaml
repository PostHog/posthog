id: email-resent-after-reclaim
version: 1
clock: real
profile: reclaim
seed: 3
setup:
    teams: 1
drive:
    for: 60s
    traffic:
        - name: event_email
valves: []
convergeWithin: 3m
invariants:
    - name: no_loss
