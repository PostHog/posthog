id: smoke
version: 2
clock: real
profile: synthetic
seed: 1
setup:
    teams: 1
drive:
    for: 30s
    traffic:
        - name: event_email
        - name: event_webhook
        - name: transactional_email
convergeWithin: 2m
invariants:
    - name: at_least_once
    - name: duplicate_sends
    - name: refused_at_intake
gates:
    duplicate_sends: 0
    refused_at_intake: 0
measure:
    - name: role_cpu_seconds
    - name: role_rss_max_bytes
    - name: delivery_latency_ms
