# hoglint for PostHog: the Django pack, the PostHog pack, the PostHog preset and the owners provider.
# Run from the repo root: `hoglint check`. `hoglint help hook` says what the pre-commit hook checks.
schema = 1
extends = ["hoglint:django", "hoglint:posthog", "tools/hoglint/presets/posthog.toml"]

[discovery]
source_roots = ["."]
first_party  = ["posthog", "ee", "common", "products", "tools", "services", "packages"]
# Eval trees orchestrate many products by design. tools/infra-scripts is a separate deployable
# that imports the `posthog` SDK, not this repo's `posthog` package.
exclude      = [
  "docs/**",
  "products/*/evals/**",
  "products/posthog_ai/eval_harness/**",
  "products/signals/eval/**",
  "tools/infra-scripts/**",
]
# Third-party packages hoglint reads: they ship installed apps, models and migrations, or
# Temporal's decorators.
external     = ["django", "rest_framework", "oauth2_provider", "social_django", "axes", "django_otp", "two_factor", "temporalio"]

[django]
settings             = ["posthog.settings", "posthog.settings.*", "ee.settings"]
db_routing           = "products/db_routing.yaml"
db_alias_template    = "{database}_db_writer"
settings_proxies     = { oauth2_settings = "OAUTH2_PROVIDER_" }
setting_name_helpers = { setting_name = "SOCIAL_AUTH_" }
receiver_decorators  = ["django.dispatch.dispatcher.receiver", "posthog.models.signals.mutable_receiver"]
oracles              = ["registry", "migration-loader"]
# Functions that install a callback into another package: a call or decorator naming one is an
# `installs` edge. Exact names; add a new hook here.
hooks = [
  "ee.hogai.artifacts.handlers.base.register_handler",
  "posthog.admin.console.registry.console.register_moved_action",
  "posthog.admin.console.registry.console.register_moved_page",
  "posthog.admin.inline_registry.register_admin_inline",
