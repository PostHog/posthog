# File-level guard: it matches the first character of a file, so it reports every file it is
# given. CI hands it only the paths `git diff` reports as added under `ee/`, so a file here
# means the branch adds one, and an edit to an existing file is never scanned.
# Gap: a zero-byte file (an empty `__init__.py`) has nothing to match and is not caught.
rules:
    - id: no-new-files-in-ee
      message: >-
          Do not add a file under `ee/`. The folder is deprecated: new code belongs in
          `posthog/` or `products/<product>/`. A file that must live here needs human
          approval. Get the approval first, then add the path to the exempt list in
          `.semgrep/rules/devex/no-new-files-in-ee.yaml` and say why in the PR
          description. See `ee/AGENTS.md`.
      severity: INFO
      languages: [generic]
      paths:
          include:
              - '/ee/**'
          # Approved new files, one exact path each, added by hand after a human agreed
          # in the PR. Write the path with its leading slash (`/ee/api/foo.py`): an
          # unanchored path would also match an `ee/` folder nested elsewhere. Never add a
          # glob, because it exempts files nobody reviewed.
          exclude: []
      pattern-regex: '(?s)\A.'
