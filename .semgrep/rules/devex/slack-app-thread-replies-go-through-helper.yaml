rules:
    - id: slack-app-thread-replies-go-through-helper
      message: |
          Post `@PostHog` thread replies with `post_slack_thread_reply(client, channel=…,
          thread_ts=…, …)` from `products.slack_app.backend.services.slack_messages`,
          not `chat_postMessage(thread_ts=…)` directly.

          Why: the helper checks the message being replied to still exists and posts
          nothing when it doesn't. A user who deletes their `@PostHog` prompt was
          otherwise answered at channel level for the rest of the run — the anchor no
          longer resolves, and the reply lands in front of the whole channel.

          How to migrate: replace
              slack.client.chat_postMessage(channel=channel, thread_ts=thread_ts, …)
          with
              post_slack_thread_reply(slack.client, channel=channel, thread_ts=thread_ts, …)
          The helper returns `None` when it skipped the post, so callers that need the
          response (`ts`) should handle that; a falsy `thread_ts` still posts at channel
          root unchecked, which is the deliberate top-level case.

          If a call site genuinely must post regardless — replying in a thread the bot
          owns rather than one anchored on a user's message — exempt it with
          `# nosemgrep: slack-app-thread-replies-go-through-helper` and say why.
      languages: [python]
      severity: ERROR
      paths:
          include:
              - 'products/slack_app/backend/'
              - 'posthog/temporal/ai/slack_app/'
              - 'products/tasks/backend/logic/services/living_artifacts.py'
              - 'products/tasks/backend/temporal/slack_relay/'
          exclude:
              # defines the helper
              - 'products/slack_app/backend/services/slack_messages.py'
              - '**/tests/**'
              - '**/test_*.py'
      patterns:
          - pattern-either:
                - pattern: $CLIENT.chat_postMessage(..., thread_ts=$TS, ...)
                - pattern: $OBJ.$CLIENT.chat_postMessage(..., thread_ts=$TS, ...)
          # A literal empty/None anchor is a deliberate channel-root post, not a reply.
          - pattern-not: $CLIENT.chat_postMessage(..., thread_ts=None, ...)
          - pattern-not: $OBJ.$CLIENT.chat_postMessage(..., thread_ts=None, ...)
          - pattern-not: $CLIENT.chat_postMessage(..., thread_ts="", ...)
          - pattern-not: $OBJ.$CLIENT.chat_postMessage(..., thread_ts="", ...)
      metadata:
          category: best-practice
          subcategory:
              - audit
