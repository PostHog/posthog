rules:
    - id: schedule-must-avoid-minute-zero
      message: |
          This schedule fires at minute zero of the hour.

          Every fleet schedule that fires at minute zero lands on the same ClickHouse cluster
          at the same moment, so each query in the pile-up runs several times slower. A job that
          reads the last interval needs only the boundary plus ingestion lag, so it can start a
          few minutes after the boundary and spread its work across a window.

          - Celery beat and Dagster: write a fixed minute that no other job in that hour holds,
            for example `crontab(minute="23")` or `cron_schedule="23 * * * *"`.
          - Temporal fleet schedule: start two minutes after the boundary and add jitter,
            for example `ScheduleIntervalSpec(every=timedelta(hours=1), offset=timedelta(minutes=2))`
            with `ScheduleSpec(..., jitter=timedelta(minutes=10))`.
          - Sub-hourly or per-entity Temporal schedule: pass
            `offset=deterministic_offset(<stable id>, <interval>)` from `posthog/scheduling/jitter.py`.

          If a customer was promised that exact instant (a batch export interval, a report at the
          time a customer chose), keep it and add
          `# nosemgrep: schedule-must-avoid-minute-zero -- <reason>`.
      languages: [python]
      severity: ERROR
      pattern-either:
          # Celery beat at minute 0 of every hour, or of every N hours. crontab's hour defaults to "*".
          - patterns:
                - pattern-either:
                      - pattern: crontab(..., minute="0", ...)
                      - pattern: crontab(..., minute="00", ...)
                      - pattern: crontab(..., minute=0, ...)
                - pattern-either:
                      - patterns:
                            - pattern: crontab(...)
                            - pattern-not: crontab(..., hour=$HOUR, ...)
                      - patterns:
                            - pattern: crontab(..., hour="$HOUR", ...)
                            - metavariable-regex:
                                  metavariable: $HOUR
                                  regex: ^\*(/\d+)?$
          # Dagster and Temporal cron strings with minute 0 and an hour field of "*" or "*/N".
          - patterns:
                - pattern-either:
                      - pattern: $SCHEDULE(..., cron_schedule="$CRON", ...)
                      - pattern: ScheduleSpec(..., cron_expressions=[..., "$CRON", ...], ...)
                - metavariable-regex:
                      metavariable: $CRON
                      regex: ^\s*0+\s+\*(/\d+)?\s
          # A Temporal interval with no offset starts on the epoch grid, so a sub-daily interval that
          # fits evenly into the day fires at minute zero. An interval the rule cannot read counts as short.
          - patterns:
                - pattern: ScheduleIntervalSpec(...)
                - pattern-not: ScheduleIntervalSpec(..., offset=$OFFSET, ...)
                - pattern-either:
                      - patterns:
                            - pattern: ScheduleIntervalSpec(..., every=$INTERVAL, ...)
                            - metavariable-regex:
                                  metavariable: $INTERVAL
                                  regex: ^[A-Za-z_][\w.]*$
                      - patterns:
                            - pattern: ScheduleIntervalSpec(..., every=datetime.timedelta(hours=$HOURS), ...)
                            - metavariable-regex:
                                  metavariable: $HOURS
                                  regex: ^([1-9]|1\d|2[0-3]|[A-Za-z_][\w.]*)$
                      - patterns:
                            - pattern: ScheduleIntervalSpec(..., every=datetime.timedelta(minutes=$MINUTES), ...)
                            - metavariable-regex:
                                  metavariable: $MINUTES
                                  regex: ^([1-9]\d{0,2}|1[0-3]\d\d|14[0-3]\d|[A-Za-z_][\w.]*)$
                      - patterns:
                            - pattern: ScheduleIntervalSpec(..., every=datetime.timedelta(seconds=$SECONDS), ...)
                            - metavariable-regex:
                                  metavariable: $SECONDS
                                  regex: ^([1-9]\d{0,3}|[1-7]\d{4}|8[0-5]\d{3}|86[0-3]\d\d|[A-Za-z_][\w.]*)$
      paths:
          include:
              - dags/**/*.py
              - ee/**/*.py
              - posthog/**/*.py
              - products/**/*.py
          exclude:
              - '**/test/**'
              - '**/tests/**'
              - '**/test_*.py'
              - '**/*_test.py'
              - '**/conftest*.py'
      metadata:
          category: performance
          subcategory: audit
          confidence: HIGH
