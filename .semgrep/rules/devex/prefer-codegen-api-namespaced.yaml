# Product-scoped guards against calling a product's own endpoints through the
# `api` singleton in frontend/src/lib/api.ts instead of the product's generated
# client.
#
# DO NOT EDIT THE GENERATED BLOCK BY HAND. It is the mechanical output of
# `hogli lint:api-ratchet --write-semgrep`, which derives each product's
# namespaces from api.ts and the generated clients. `hogli lint:api-ratchet`
# fails when the block here disagrees with that output.
#
# One rule per product, rather than one rule listing every namespace: a call on
# another product's namespace, such as conversations calling api.comments, is
# legitimate, and a global list would block it. Each rule also covers core code
# under frontend/src, which owns no product namespace. A scene that moves into its
# product keeps the same rule id, so the baseline diff does not report it as new.
# A namespace several products share gets one shared rule over those products and
# core instead, so a call on it is reported once, not once per owner.
#
# WARNING severity, so the backlog prints without failing and the devex job's
# --baseline-commit pass blocks only the calls a pull request adds. See
# .semgrep/rules/devex/README.md.
rules:
    # --- generated by `hogli lint:api-ratchet --write-semgrep` ---
    - id: prefer-codegen-api-namespaced-actions
      message: >-
          Manual `api.<namespace>.<method>(...)` call on a actions namespace. The namespace
          builds its URL in `frontend/src/lib/api.ts`, and this product's generated client
          already covers that URL. Use `products/actions/frontend/generated/api.ts`.

          Informational while the backlog is worked down, but a call this pull request adds
          fails the job. `hogli product:maturity --codegen actions` lists the call sites.

          Agents: invoke the `adopting-generated-api-types` skill
          (`.agents/skills/adopting-generated-api-types/SKILL.md`) for the migration
          workflow.

          If no generated equivalent is available yet (endpoint missing OpenAPI tags,
          dynamic URL, etc.), add `// nosemgrep: prefer-codegen-api-namespaced-actions`
          above this line - the maturity tooling continues to track tagged sites.
      severity: WARNING
      languages: [typescript, javascript]
      pattern-either:
          - pattern: api.actions.$METHOD(...)
          - pattern: api.actions.$MEMBER.$METHOD(...)
      paths:
          include:
              - '/products/actions/frontend/'
              - '/frontend/src/'
          exclude:
              - '/frontend/src/lib/api.ts'
              - '**/generated/**'
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - '**/*.stories.tsx'
              - '**/__mocks__/**'
              - '**/mocks/**'

