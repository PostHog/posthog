rules:
    - id: prefer-codegen-api-namespaced
      message: >-
          Manual `api.<namespace>.<method>(...)` call in product frontend code. The
          namespace builds its URL in `frontend/src/lib/api.ts`, and a generated client
          already covers that URL. Prefer the generated client in
          `products/<product>/frontend/generated/api.ts`.

          Informational while the backlog is worked down: this rule does not block, but
          a call this pull request adds does. `hogli lint:api-ratchet --namespaces`
          prints each namespace with the product whose client covers it.

          Agents: invoke the `adopting-generated-api-types` skill
          (`.agents/skills/adopting-generated-api-types/SKILL.md`) for the migration
          workflow. Humans: run `hogli product:maturity --codegen <product>` to see the
          call sites.

          If no generated equivalent is available yet (endpoint missing OpenAPI tags,
          dynamic URL, etc.), add `// nosemgrep: prefer-codegen-api-namespaced` above
          this line — the maturity tooling continues to track tagged sites.
      severity: WARNING
      languages: [typescript, javascript]
      pattern-either:
          # Every namespace below has at least one ApiRequest path method whose URL a
          # generated client already emits. Nothing here is hand-picked: the list comes
          # from `frontend/src/lib/api.ts` and the generated clients.
          # --- generated by `hogli lint:api-ratchet --write-semgrep` ---
          - pattern: api.actions.$METHOD(...)
          - pattern: api.activity.$METHOD(...)
          - pattern: api.aiObservability.$METHOD(...)
          - pattern: api.alerts.$METHOD(...)
          - pattern: api.annotations.$METHOD(...)
          - pattern: api.batchExports.$METHOD(...)
          - pattern: api.cohorts.$METHOD(...)
          - pattern: api.columnConfigurations.$METHOD(...)
          - pattern: api.comments.$METHOD(...)
          - pattern: api.conversations.$METHOD(...)
          - pattern: api.conversationsTickets.$METHOD(...)
          - pattern: api.customerJourneys.$METHOD(...)
          - pattern: api.customerProfileConfigs.$METHOD(...)
          - pattern: api.dashboardTemplates.$METHOD(...)
          - pattern: api.dashboards.$METHOD(...)
          - pattern: api.dataColorThemes.$METHOD(...)
          - pattern: api.dataModelingEdges.$METHOD(...)
          - pattern: api.dataModelingJobs.$METHOD(...)
          - pattern: api.dataModelingNodes.$METHOD(...)
          - pattern: api.dataWarehouseManagedViewsets.$METHOD(...)
          - pattern: api.dataWarehouseSavedQueries.$METHOD(...)
          - pattern: api.dataWarehouseSavedQueryDrafts.$METHOD(...)
          - pattern: api.dataWarehouseSavedQueryFolders.$METHOD(...)
          - pattern: api.dataWarehouseTables.$METHOD(...)
          - pattern: api.dataWarehouseViewLinks.$METHOD(...)
          - pattern: api.earlyAccessFeatures.$METHOD(...)
          - pattern: api.endpoint.$METHOD(...)
          - pattern: api.errorTracking.$METHOD(...)
          - pattern: api.evaluationRuns.$METHOD(...)
          - pattern: api.eventDefinitions.$METHOD(...)
          - pattern: api.experiments.$METHOD(...)
          - pattern: api.exports.$METHOD(...)
          - pattern: api.externalDataSchemas.$METHOD(...)
          - pattern: api.externalDataSources.$METHOD(...)
          - pattern: api.featureFlags.$METHOD(...)
          - pattern: api.fileSystem.$METHOD(...)
          - pattern: api.fixHogQLErrors.$METHOD(...)
          - pattern: api.groups.$METHOD(...)
          - pattern: api.hogFlowTemplates.$METHOD(...)
          - pattern: api.hogFlows.$METHOD(...)
          - pattern: api.hogFunctions.$METHOD(...)
          - pattern: api.insightVariables.$METHOD(...)
          - pattern: api.insights.$METHOD(...)
          - pattern: api.integrations.$METHOD(...)
          - pattern: api.logs.$METHOD(...)
          - pattern: api.mcpServerInstallations.$METHOD(...)
          - pattern: api.mcpServers.$METHOD(...)
          - pattern: api.messaging.$METHOD(...)
          - pattern: api.notebooks.$METHOD(...)
          - pattern: api.organizationFeatureFlags.$METHOD(...)
          - pattern: api.persons.$METHOD(...)
          - pattern: api.productTours.$METHOD(...)
          - pattern: api.queryTabState.$METHOD(...)
          - pattern: api.recordings.$METHOD(...)
          - pattern: api.revenueAnalyticsJoins.$METHOD(...)
          - pattern: api.savedHeatmaps.$METHOD(...)
          - pattern: api.signalReports.$METHOD(...)
          - pattern: api.signalScout.$METHOD(...)
          - pattern: api.signalSourceConfigs.$METHOD(...)
          - pattern: api.signalUserAutonomy.$METHOD(...)
          - pattern: api.subscriptions.$METHOD(...)
          - pattern: api.surveys.$METHOD(...)
          - pattern: api.tasks.$METHOD(...)
          - pattern: api.userInterviews.$METHOD(...)
          - pattern: api.webAnalyticsFilterPresets.$METHOD(...)
          # --- end generated ---
      paths:
          include:
              - '/products/*/frontend/'
          exclude:
              - '**/generated/**'
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - '**/*.stories.tsx'
              - '**/__mocks__/**'
              - '**/mocks/**'
