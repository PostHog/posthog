rules:
    - id: created-by-uses-created-meta-mixin
      message: >-
          Do not declare `created_by` on a model by hand. Inherit it from a mixin in
          `posthog/models/utils.py`, which also adds `created_at`.
          Use `IsolatedProductCreatedMetaFields` for a model in a product database,
          because a foreign key cannot cross databases, and for a new table in the
          main database, because creating the constraint locks the hot `posthog_user`
          table. Use `CreatedMetaFields` for an existing table that already has the
          constraint. Both mixins set `related_name="+"`, so `User` gets no reverse
          accessor. If the model needs a different `on_delete`, `null` or index, keep
          the field and add `# nosemgrep: created-by-uses-created-meta-mixin` with the
          reason.
      severity: ERROR
      languages: [python]
      paths:
          include:
              - '**/models.py'
              - '**/models/**'
              - '**/model.py'
          exclude:
              # The mixins themselves declare the field.
              - 'posthog/models/utils.py'
              - '**/migrations/**'
              - '**/test/**'
              - '**/tests/**'
              - '**/*_test.py'
              - '**/test_*.py'
              - '**/conftest*.py'
      patterns:
          - pattern-inside: |
                class $MODEL(...):
                    ...
          - pattern-either:
                - pattern: created_by = $M.ForeignKey(...)
                - pattern: created_by = ForeignKey(...)
                - pattern: 'created_by: $T = $M.ForeignKey(...)'
                - pattern: 'created_by: $T = ForeignKey(...)'
