# git config url.<authed-url>.insteadOf in a build step embeds the credential both
# in the image history metadata and in the layer gitconfig file — deleting the
# token file afterwards does not clean the history copy.
rules:
    - id: dockerfile-git-config-credential
      languages:
          - generic
      # `dockerfile` as a language only matches files named exactly `Dockerfile`,
      # so suffixed variants (Dockerfile.node, Dockerfile.sandbox, ...) need
      # generic-mode matching with an explicit path filter.
      paths:
          include:
              - '**/Dockerfile*'
              - 'Dockerfile*'
              - '**/*.dockerfile'
              - '*.dockerfile'
      message: 'git config here rewrites URLs to carry a credential, which lands in the layer
          gitconfig file and in the image build history metadata. Mount the token with
          `RUN --mount=type=secret,id=<name>`, read it with `$(cat /run/secrets/<name>)`,
          and unset the config in the same RUN step — or use `--mount=type=ssh` for SSH keys.'
      severity: ERROR
      metadata:
          category: security
          cwe:
              - 'CWE-798: Use of Hard-coded Credentials'
          owasp:
              - A07:2021 - Identification and Authentication Failures
          references:
              - https://docs.docker.com/build/building/secrets/
              - https://docs.docker.com/build/building/ssh/
          technology:
              - dockerfile
          subcategory:
              - vuln
          likelihood: HIGH
          impact: HIGH
          confidence: HIGH
      pattern-regex: '(?i)git\s+config[^\n]*(?:https?://[^"''\s]*@|x-access-token:)[^\n]*insteadOf'
