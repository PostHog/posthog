rules:
    - id: dockerfile-git-config-credential
      languages:
          - generic
      # The `dockerfile` language skips suffixed names such as Dockerfile.node, so this
      # rule uses generic mode with a path filter.
      paths:
          include:
              - 'Dockerfile*'
              - '*.Dockerfile'
              - '*.dockerfile'
      message: 'git config here rewrites URLs to carry a credential, which lands in the layer
          gitconfig file and in the image build history metadata. Deleting the token file in a
          later step does not remove it from either place. Mount the token with
          `RUN --mount=type=secret,id=<name>` and feed git through a credential helper or
          GIT_ASKPASS that reads `/run/secrets/<name>`, so no credential appears in a URL —
          or use `--mount=type=ssh` for SSH keys.'
      severity: ERROR
      metadata:
          category: security
          cwe:
              - 'CWE-798: Use of Hard-coded Credentials'
          owasp:
              - A07:2021 - Identification and Authentication Failures
          references:
              - https://docs.docker.com/build/building/secrets/
              - https://docs.docker.com/build/building/ssh/
          technology:
              - dockerfile
          subcategory:
              - vuln
          likelihood: HIGH
          impact: HIGH
          confidence: HIGH
      # The spans tolerate backslash line continuations, so a RUN wrapped across lines
      # still matches, and the credential must appear before `insteadOf`.
      pattern-regex: '(?i)git[ \t]+config(?:[^\n]|\\\n)*?(?:https?://[^"''\s]*@|x-access-token:)(?:[^\n]|\\\n)*?insteadOf'
