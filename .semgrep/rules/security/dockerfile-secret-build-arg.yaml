# Docker records every build step, including expanded ARG values, in the image
# history metadata (`history[].created_by`), so anyone who can pull the image can
# read a secret passed as a build argument — years after the build ran.
# The segment-anchored regex requires the keyword to be a whole, underscore-delimited
# name segment, so names like PATCH_VERSION or SCCACHE_WEBDAV_KEY_PREFIX stay clean.
rules:
    - id: dockerfile-secret-build-arg
      languages:
          - generic
      # `dockerfile` as a language only matches files named exactly `Dockerfile`,
      # so suffixed variants (Dockerfile.node, Dockerfile.sandbox, ...) need
      # generic-mode matching with an explicit path filter.
      paths:
          include:
              - '**/Dockerfile*'
              - 'Dockerfile*'
              - '**/*.dockerfile'
              - '*.dockerfile'
      message: 'A secret-looking ARG. Docker records expanded ARG values in the image build
          history metadata, so anyone who can pull the image can read the secret. Use the
          BuildKit pattern instead: `RUN --mount=type=secret,id=<name>` with `$(cat
          /run/secrets/<name>)`.'
      severity: ERROR
      metadata:
          category: security
          cwe:
              - 'CWE-798: Use of Hard-coded Credentials'
          owasp:
              - A07:2021 - Identification and Authentication Failures
          references:
              - https://docs.docker.com/build/building/secrets/
              - https://docs.docker.com/build/building/variables/#build-args
          technology:
              - dockerfile
          subcategory:
              - vuln
          likelihood: HIGH
          impact: HIGH
          confidence: HIGH
      pattern-regex: '(?i)(^\s*ARG\s+(?:[A-Z0-9]+_)*(?:TOKEN|SECRET|PASSWORD|PASS|CREDENTIALS?|PAT)(?:_[A-Z0-9]+)*\s*(?:=|#|$)|^\s*ARG\s+[A-Z0-9]+_KEY\s*(?:=|#|$))'
