rules:
    - id: dockerfile-secret-build-arg
      languages:
          - generic
      # The `dockerfile` language skips suffixed names such as Dockerfile.node, so this
      # rule uses generic mode with a path filter. The registry rule
      # dockerfile.security.secret-in-build-arg has the same gap, and it also flags
      # names such as SCCACHE_WEBDAV_KEY_PREFIX.
      paths:
          include:
              - 'Dockerfile*'
              - '*.Dockerfile'
              - '*.dockerfile'
      message: 'A secret-looking ARG. Docker records expanded ARG values in the image build
          history metadata, so anyone who can pull the image can read the secret. Use the
          BuildKit pattern instead: `RUN --mount=type=secret,id=<name>` with `$(cat
          /run/secrets/<name>)`.'
      severity: ERROR
      metadata:
          category: security
          cwe:
              - 'CWE-798: Use of Hard-coded Credentials'
          owasp:
              - A07:2021 - Identification and Authentication Failures
          references:
              - https://docs.docker.com/build/building/secrets/
              - https://docs.docker.com/build/building/variables/#build-args
          technology:
              - dockerfile
          subcategory:
              - vuln
          likelihood: HIGH
          impact: HIGH
          confidence: HIGH
      # Keywords must be whole underscore-delimited name segments, and _KEY only at the
      # name end, so PATCH_VERSION and SCCACHE_WEBDAV_KEY_PREFIX do not match. `[ \t]`
      # instead of `\s` stops a match starting on a blank line above the ARG, which
      # would move the reported line away from a `nosemgrep` comment.
      pattern-regex: '(?i)^[ \t]*ARG[ \t]+(?:(?:[A-Z0-9]+_)*(?:TOKEN|SECRET|PASS(?:WORD)?|CREDENTIALS?|PAT)(?:_[A-Z0-9]+)*|(?:[A-Z0-9]+_)*KEY)[ \t]*(?:[=#]|$)'
