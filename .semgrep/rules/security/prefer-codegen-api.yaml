rules:
    - id: prefer-codegen-api
      message: >-
          Manual `api.<verb>(...)` call in product frontend code. Prefer the generated
          client in `products/<product>/frontend/generated/api.ts`.

          Agents: invoke the `adopting-generated-api-types` skill
          (`.agents/skills/adopting-generated-api-types/SKILL.md`) for the migration
          workflow. Humans: run `hogli product:maturity --codegen <product>` to see
          the suggested generated function per call site.

          If no generated equivalent is available yet (endpoint missing OpenAPI tags,
          dynamic URL, etc.), add `// nosemgrep: prefer-codegen-api` above this line —
          the maturity tooling continues to track tagged sites.
      severity: ERROR
      languages: [typescript, javascript]
      pattern-either:
          # Match calls rooted at the canonical default import. The case-sensitive
          # word boundary avoids identifiers such as `ApiConfig` and `savedQueryApi`.
          # Bounding generic arguments by `(` supports nested generic types.
          - pattern-regex: >-
                \bapi(?:\.[A-Za-z_$][A-Za-z0-9_$]*)+\s*(?:<[^\n(]*>)?\s*\(
          # Keep the canonical import name enforceable so renaming the client cannot
          # bypass the call-site regex.
          - patterns:
                - pattern: import $API from 'lib/api'
                - metavariable-regex:
                      metavariable: $API
                      regex: '^(?!api$).+'
          # These are alternate ways to rebuild the generated transport layer.
          - pattern: new ApiRequest(...)
          - pattern: apiMutator(...)
          - pattern-regex: >-
                \bfetch\s*\(\s*[`'"]\/?api\/
      paths:
          include:
              - '/products/*/frontend/'
              - '/frontend/src/'
          exclude:
              - '**/generated/**'
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - '**/*.stories.tsx'
              - '**/__mocks__/**'
