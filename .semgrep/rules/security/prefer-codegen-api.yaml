rules:
    - id: prefer-codegen-api
      message: >-
          Manual `api.<verb>(...)` call in product frontend code. Prefer the generated
          client in `products/<product>/frontend/generated/api.ts`.

          Agents: invoke the `adopting-generated-api-types` skill
          (`.agents/skills/adopting-generated-api-types/SKILL.md`) for the migration
          workflow. Humans: run `hogli product:maturity --codegen <product>` to see
          the suggested generated function per call site.

          If no generated equivalent is available yet (endpoint missing OpenAPI tags,
          dynamic URL, etc.), add `// nosemgrep: prefer-codegen-api` above this line —
          the maturity tooling continues to track tagged sites.
      severity: ERROR
      languages: [typescript, javascript]
      pattern-either:
          # Match calls rooted at the canonical default import. The case-sensitive
          # word boundary avoids identifiers such as `ApiConfig` and `savedQueryApi`.
          # Bounding generic arguments by `(` supports nested generic types.
          - pattern-regex: >-
                \bapi(?:\.[A-Za-z_$][A-Za-z0-9_$]*)+\s*(?:<[^\n(]*>)?\s*\(
          # Keep the canonical import name enforceable so renaming the client cannot
          # bypass the call-site regex.
          - patterns:
                - pattern: import $API from 'lib/api'
                - metavariable-regex:
                      metavariable: $API
                      regex: '^(?!api$).+'
          # These are alternate ways to rebuild the generated transport layer.
          - pattern: new ApiRequest(...)
          - pattern: apiMutator(...)
          - pattern-regex: >-
                \bfetch\s*\(\s*[`'"]\/?api\/
      paths:
          include:
              - '/products/*/frontend/'
              - '/frontend/src/'
          exclude:
              - '**/generated/**'
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - '**/*.stories.tsx'
              - '**/__mocks__/**'
              - '/products/actions/frontend/'
              - '/products/ai_observability/frontend/'
              - '/products/alerts/frontend/'
              - '/products/conversations/frontend/'
              - '/products/customer_analytics/frontend/'
              - '/products/dashboards/frontend/'
              - '/products/early_access_features/frontend/'
              - '/products/endpoints/frontend/'
              - '/products/error_tracking/frontend/'
              - '/products/links/frontend/'
              - '/products/logs/frontend/'
              - '/products/mcp_analytics/frontend/'
              - '/products/mcp_store/frontend/'
              - '/products/messaging/frontend/'
              - '/products/posthog_ai/frontend/'
              - '/products/review_hog/frontend/'
              - '/products/signals/frontend/'
              - '/products/subscriptions/frontend/'
              - '/products/tracing/frontend/'
              - '/products/workflows/frontend/'
              - '/frontend/src/lib/components/Errors/Frame/'
              - '/frontend/src/lib/components/TerraformExporter/'
              - '/frontend/src/models/'
              - '/frontend/src/scenes/feature-flags/'
              - '/frontend/src/scenes/hog-functions/email-templater/'
              - '/frontend/src/scenes/max/'
              - '/frontend/src/scenes/onboarding/legacy/error-tracking/'
              - '/frontend/src/scenes/session-recordings/player/inspector/'
              - '/frontend/src/scenes/settings/environment/'
              - '/frontend/src/scenes/web-analytics/tabs/marketing-analytics/'
