rules:
    - id: prefer-codegen-api
      message: >-
          Manual `api.<verb>(...)` call in product frontend code. Prefer the generated
          client in `products/<product>/frontend/generated/api.ts`.

          Agents: invoke the `adopting-generated-api-types` skill
          (`.agents/skills/adopting-generated-api-types/SKILL.md`) for the migration
          workflow. Humans: run `hogli product:maturity --codegen <product>` to see
          the suggested generated function per call site.

          If no generated equivalent is available yet (endpoint missing OpenAPI tags,
          dynamic URL, etc.), add `// nosemgrep: prefer-codegen-api` above this line —
          the maturity tooling continues to track tagged sites.
      severity: ERROR
      languages: [typescript, javascript]
      pattern-either:
          - pattern: api.get(...)
          - pattern: api.post(...)
          - pattern: api.put(...)
          - pattern: api.patch(...)
          - pattern: api.delete(...)
          - pattern: api.create(...)
          - pattern: api.update(...)
          # Semgrep's TypeScript parser treats generic-typed calls (api.create<T>())
          # as a different AST shape that AST-level patterns above don't match,
          # so fall back to a regex. Bounds the type args by `(` rather than `>` so
          # nested generics like api.get<PaginatedResponse<Foo>>(...) still match.
          - pattern-regex: '\bapi\.(get|post|put|patch|delete|create|update)<[^(]*>\s*\('
          - pattern-regex: >-
                \bapi\.(signalReports|signalTeamConfig|signalScout|signalUserAutonomy|signalSourceConfigs|hogFlows|hogFlowTemplates|messaging|errorTracking|externalDataSources|externalDataSchemas|dataWarehouseTables|dataWarehouseViewLinks|dataWarehouseSavedQueries|dataWarehouseSavedQueryFolders|dataWarehouseSavedQueryDrafts|dataModelingDags|dataModelingNodes|dataModelingEdges|dataModelingJobs|queryTabState|customerJourneys|customerProfileConfigs|columnConfigurations|tasks|coreMemory|maxHandsFree|conversations|tracing|alerts|conversationsTickets|mcpServers|mcpServerInstallations|endpoint|logs|subscriptions|actions|earlyAccessFeatures|links|dataWarehouseManagedViewsets|revenueAnalyticsJoins|evaluationRuns)\.[A-Za-z_$][A-Za-z0-9_$]*\s*\(
      paths:
          include:
              - '/products/*/frontend/'
              - '/frontend/src/'
          exclude:
              - '**/generated/**'
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - '**/*.stories.tsx'
              - '**/__mocks__/**'
              - '/products/actions/frontend/'
              - '/products/ai_observability/frontend/'
              - '/products/alerts/frontend/'
              - '/products/conversations/frontend/'
              - '/products/customer_analytics/frontend/'
              - '/products/dashboards/frontend/'
              - '/products/data_catalog/frontend/'
              - '/products/data_modeling/frontend/'
              - '/products/data_warehouse/frontend/'
              - '/products/early_access_features/frontend/'
              - '/products/endpoints/frontend/'
              - '/products/error_tracking/frontend/'
              - '/products/links/frontend/'
              - '/products/logs/frontend/'
              - '/products/mcp_analytics/frontend/'
              - '/products/mcp_store/frontend/'
              - '/products/messaging/frontend/'
              - '/products/posthog_ai/frontend/'
              - '/products/revenue_analytics/frontend/'
              - '/products/review_hog/frontend/'
              - '/products/signals/frontend/'
              - '/products/subscriptions/frontend/'
              - '/products/tracing/frontend/'
              - '/products/warehouse_sources/frontend/'
              - '/products/workflows/frontend/'
              - '/frontend/src/lib/components/Errors/Frame/'
              - '/frontend/src/lib/components/TerraformExporter/'
              - '/frontend/src/models/'
              - '/frontend/src/queries/nodes/DataTable/'
              - '/frontend/src/scenes/data-management/managed-viewsets/'
              - '/frontend/src/scenes/data-warehouse/'
              - '/frontend/src/scenes/feature-flags/'
