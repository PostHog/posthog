# Stamphog merge-gate policy for this repository. The engine merges this file onto its shipped
# default (products/stamphog/packages/pr-approval-agent/defaults/policy.yml), so it declares only
# what differs: mappings merge key by key, a declared list replaces the default's list, and an
# extend_<list> key appends to it. See .stamphog/README.md for what each difference is for. Keep
# pattern scalars single-quoted so regex backslashes survive YAML parsing.
deny:
    infra_cicd:
        rationale: 'routing and bare deploy are excluded on purpose: every historical match was app-level (DRF routers, message-routing tests, deploy-timing docs), never infrastructure. Narrow deploy literals (bin/deploy, deploy.sh, .github/pr-deploy) cover real deployment artifacts without the false positives.'
        match:
            paths:
                - 'k8s'
                - 'dockerfile'
                # The local-only compose files go to dev_stack instead. Every other compose file stays
                # here, a new one included: hobby deploys extend docker-compose.base.yml, and image
                # builds pull and start docker-compose.dev.yml and docker-compose.profiles.yml.
                - 'docker-compose(?!\.(dev-full|playwright|sandbox)\.yml$)'
                - '\.(github|depot)/workflows/(ci-security|codeql|auto-assign-reviewers)'
                - '\.github/pr-deploy'
                - 'iam'
                - 'cloudflare'
                - 'cdn'
                - 'waf'
                - '(?:^|/)bin/deploy'
                - 'deploy\.sh'
    ci_workflows:
        description: 'GitHub Actions and Depot CI workflows.'
        rationale: 'Owner-only: stamphog approves team-devex changes here and refuses everyone else. team-devex owns the workflows in .github/owners.yaml and edits them daily, so a hard deny sent every routine CI fix to a second devex engineer. infra_cicd also matches the workflows that CODEOWNERS assigns to team-security, and it exempts nobody, so those stay denied for every author.'
        match:
            paths:
                - '\.github/workflows'
                - '\.depot/workflows'
        exempt_author_teams:
            - 'team-devex'
    dev_stack:
        description: 'The compose files that only local runs start.'
        rationale: 'Owner-only: stamphog approves team-devex changes here and refuses everyone else. owners.yaml gives every docker-compose file to team-devex, and no deploy or image build reads these ones. The compose files that a deploy or an image build reads stay in infra_cicd for every author.'
        match:
            paths:
                - 'docker-compose\.(dev-full|playwright|sandbox)\.yml$'
        exempt_author_teams:
            - 'team-devex'
    stamphog_policy:
        match:
            extend_paths:
                # These paths hold the dependency proof publisher and the setup-uv action it runs.
                # A PR that edits either one changes what the proof checks.
                - '^\.github/workflows/dependency-proof'
                - '^\.github/scripts/dependency_proof/'
                - '^\.github/scripts/dependency_scan\.py'
                - '^\.github/actions/setup-uv/'
                - 'packages/owners-yaml/'
                # Transitional: branches that predate the move still carry the resolver here.
                - 'tools/owners/'
    ownership_files:
        description: 'The owners.yaml and product.yaml files that name owning teams and route reviews.'
        rationale: 'Owner-only: stamphog approves team-devex changes here and refuses everyone else. One line changes who reviews later PRs, and the files are .yaml, so without this category they ride the allow-list to a T0 auto-approve. They are not in stamphog_policy, because that category exempts nobody and the root owners.yaml routes every owners.yaml to team-devex. The exemption reads GitHub team membership, which these files do not set, and a PR that changes one reads ownership at the merge base, so it cannot vouch for itself. The resolver code in packages/owners-yaml/ stays in stamphog_policy.'
        match:
            paths:
                - '(?:^|/)product\.yaml$'
            # A change that only adds lines to an owners.yaml, such as a new rule, does not match.
            # Changing or removing a line still does.
            edit_paths:
                - '(?:^|/)owners\.yaml$'
        exempt_author_teams:
            - 'team-devex'
    request_boundaries:
        description: 'The shared inbound webhook verification and outbound request transport.'
        rationale: 'This code verifies webhook signatures and sends every outbound request, so a mistake weakens a security boundary for every product. It matches no auth or crypto_secrets pattern, so without this category it gets an LLM review only. No team is exempt, because devex_guardrails exempts team-devex and this code is runtime code, not a guard.'
        match:
            paths:
                - '^posthog/egress/(limiter|observability|transport)/'
                - '^posthog/ingress/(dispatch|observability|verify)/'
                - '^posthog/ingress/views\.py$'
    devex_guardrails:
        description: 'The guards that keep the house patterns for API codegen, egress, ingress, product isolation, migrations, URLs and startup imports.'
        rationale: 'Owner-only: stamphog approves team-devex changes here and refuses everyone else. These files define what CI blocks, so a small edit from another team can turn a guard off. Most are .yaml, .md, .txt or test files, and without this category they ride the allow-list or the test-only rule to a T0 auto-approve. Busy files stay out on purpose, because most edits to them are routine: tach.toml, pyproject.toml, lib/api.ts, model_crossing_uses_baseline.txt and the setup receivers baseline. owners.yaml routes those to team-devex instead.'
        match:
            paths:
                - '^\.github/scripts/migration-deletion-allowlist\.txt$'
                - '^\.semgrep/rules/devex/'
                - '^\.semgrep/rules/security/prefer-codegen-api\.'
                - '^frontend/src/lib/api-ratchet-baseline\.txt$'
                - '^posthog/(egress|ingress)/agents\.md$'
                - '^posthog/management/migration_analysis/'
                - '^posthog/migration_helpers/'
                - '^posthog/product_urls\.py$'
                - '^posthog/settings/nextgensquash\.py$'
                - '^posthog/test/repo_invariants/(dataclass_secret_field_exemptions\.txt|setup_import_baseline\.txt)$'
                - '^posthog/test/repo_invariants/test_(admin_url_conf|dataclass_secret_fields|generated_files_are_registered|migration_dependencies_share_a_database|migration_run_before|model_crossing_uses|model_enum_defaults|squash_partial_fallback|startup_import_budget)\.py$'
                - '^products/(architecture\.md|isolation_baseline\.txt|readme\.md)$'
                - '^docs/internal/django-startup-time\.md$'
                - '^docs/published/handbook/engineering/type-system\.md$'
                - '^tools/hogli-commands/hogli_commands/(api_ratchet|projections|tach_lint)\.py$'
                - '^tools/hogli-commands/hogli_commands/product_structure\.yaml$'
                - '^tools/hogli-commands/hogli_commands/product/'
        exempt_author_teams:
            - 'team-devex'
    agent_steering:
        description: 'The root agent instructions, the PR authoring guidance, and the agent config that runs in every session.'
        rationale: 'Owner-only: stamphog approves team-devex changes here and refuses everyone else. One edit changes how every agent-written PR reads, and the files are .md, so without this category they ride the allow-list to a T0 auto-approve. A change from outside team-devex now needs a human approval, which is where the owner discussion happens. .claude/settings.json and .mcp.json are .json and ride the same allow-list, but their hooks and MCP servers run commands in every agent session, so they belong here too. Other skills under .agents/skills stay out on purpose, because product teams own several and edit their own. Paths are anchored, so a nested AGENTS.md stays with its folder owner.'
        match:
            paths:
                - '^agents\.md$'
                - '^claude\.md$'
                - '^\.agents/(agent-automation|architecture|ci|code-style|feature-usage-tracking)\.md$'
                - '^\.github/pull_request_template\.md$'
                - '^\.agents/skills/writing-pr-descriptions/'
                - '^\.claude/settings\.json$'
                - '^\.claude/hooks/'
                - '^\.mcp\.json$'
        exempt_author_teams:
            - 'team-devex'
    workflows_delivery:
        description: 'CDP, Workflows and Messaging code that decides which customer configurations exist and what gets delivered.'
        rationale: "Owner-only: stamphog approves team-workflows' own changes here and refuses everyone else's. Another team's change here breaks a customer silently: the API and models decide which of a tenant's rows get listed and updated, and the plugin-server worker decides what gets delivered. Teams usually edit these paths to carve out an exception for their own rows, their tests still pass, and existing customer configurations stop appearing or stop being delivered. Product frontends stay out, because a mistake there is visible. As in CODEOWNERS, only the API test directories and `*.test.ts` files stay out. Nothing else under the worker does: the template, legacy-plugin, legacy-webhook and segment directories hold live delivery code and mutable registries."
        match:
            paths:
                - '^products/cdp/backend/(api|models)/'
                - '^products/workflows/backend/(facade|presentation|models)/'
                - '^products/messaging/backend/(api|models)/'
                - '^nodejs/src/cdp/[\s\S]*(?<!\.test\.ts)\Z'
        exempt_author_teams:
            - 'team-workflows'
deny_exceptions:
    # Connector code does OAuth and talks to the Stripe API without touching PostHog's auth system
    # or its billing.
    auth:
        - path_prefixes:
              - 'products/warehouse_sources/backend/temporal/data_imports/sources/'
              - 'products/warehouse_sources/sources/'
        # The authorization product's package.json, tsconfig.json and turbo.json hold no auth
        # logic. They match only because the folder name contains 'auth'. The deps_toolchain
        # category still catches a manifest script change.
        - path_prefixes:
              - 'products/authorization/'
          extensions:
              - '.json'
    billing:
        - path_prefixes:
              - 'products/warehouse_sources/backend/temporal/data_imports/sources/'
              - 'products/warehouse_sources/sources/'
    workflows_delivery:
        - path_prefixes:
              - 'products/cdp/backend/api/test/'
              - 'products/messaging/backend/api/test/'
    # A Rust source file named after Kubernetes is not infra code
    infra_cicd:
        - keyword: 'k8s'
          path_prefixes:
              - 'rust/'
          extensions:
              - '.rs'
    # The unanchored 'migrations/' pattern matches skill folders such as django-migrations/. Their
    # Markdown documents the migration workflow and runs nothing.
    migrations:
        - path_prefixes:
              - '.agents/skills/'
          extensions:
              - '.md'
    # A deletion certificate is a document that a customer downloads, not key material.
    crypto_secrets:
        - keyword: 'certificate'
          path_prefixes:
              - 'posthog/templates/'
          extensions:
              - '.html'
allow:
    extend_path_patterns:
        - '.github/CODEOWNERS'
# CI checks that may lift a deny category for the files they vouch for. A check run counts only
# when the App named here published it.
attestations:
    - name: migration_risk
      # Posted by ci-backend's check-migrations job with a tests-posthog token, after
      # analyze_migration_risk classified every Django migration in the PR as Safe.
      check: 'Migration risk'
      app_id: 2492437
      lifts: [migrations]
      paths:
          - '(?:^|/)migrations/(?!__init__\.py$)[^/]+\.py$'
      sibling_files: [max_migration.txt]
    - name: dependency_proof
      # The Dependency proof workflow posts this check with a posthog-dependency-proof token. It
      # first replays the pnpm update from the merge base, and confirms that the replay writes the
      # same lockfile as the PR head.
      check: 'Dependency proof'
      app_id: 5697920
      lifts: [deps_toolchain]
      paths:
          - '(?:^|/)package\.json$'
          - '(?:^|/)pnpm-lock\.yaml$'
          - '(?:^|/)pnpm-workspace\.yaml$'
      # This list is a copy of PROVER_FILES in .github/scripts/dependency_proof/prove.py, so update
      # both together. The engine ignores a proof whose marker does not pin every file listed here.
      publisher_files:
          - .github/actions/setup-uv/action.yml
          - .github/scripts/dependency_proof/__init__.py
          - .github/scripts/dependency_proof/__main__.py
          - .github/scripts/dependency_proof/policy.py
          - .github/scripts/dependency_proof/prove.py
          - .github/scripts/dependency_scan.py
          - .github/scripts/dependency_scan.py.lock
          - .github/workflows/dependency-proof-trigger.yml
          - .github/workflows/dependency-proof.yml
          - .nvmrc
# Stamphog reviews PRs from these bots. It approves one only when an attestation that declares
# `publisher_files` proved every file the PR changes.
bot_authors:
    - name: renovate
      login: 'renovate[bot]'
      id: 29139614
