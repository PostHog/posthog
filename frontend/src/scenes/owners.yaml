version: 1
owners: []
rules:
    - match: '/FeatureFlagPermissions.tsx'
      owners: team-feature-flags
    - match: '/actions/'
      owners: team-product-analytics
    - match: '/activity/'
      owners: team-platform-features
    - match: '/agentic/'
      owners: team-growth
    - match: '/alerts/'
      owners: team-product-analytics
    - match: '/annotations/'
      owners: team-product-analytics
    - match: ['/approvals/', '/audit-logs/', '/authentication/']
      owners: team-platform-features
    - match: '/billing/'
      owners: team-billing
    - match: '/cohorts/'
      owners: team-feature-flags
    - match: '/comments/'
      owners: conversations
    - match: '/coupons/'
      owners: team-billing
    - match: '/dashboard/'
      owners: team-product-analytics
    - match: '/data-management/'
      owners: team-warehouse-sources
    - match: '/data-management/schema/'
      owners: team-product-analytics
    - match: '/data-pipelines/'
      owners: team-workflows
    # Narrower than the rule above, which would otherwise route the batch exports
    # scene to workflows. Backend counterpart: products/batch_exports/product.yaml.
    - match: '/data-pipelines/batch-exports/'
      owners: batch-exports
    - match: '/data-warehouse/'
      owners: team-data-stack
    - match: '/experiments/'
      owners: team-experiments
    - match: '/exports/'
      owners: team-product-analytics
    - match: '/feature-flags/'
      owners: team-feature-flags
    - match: ['/funnels/', '/groups/']
      owners: team-product-analytics
    - match: '/health-alerts/'
      owners: team-product-analytics
    - match: '/health/'
      owners: team-growth
    - match: '/hog-functions/'
      owners: team-workflows
    - match: '/insights/'
      owners: team-product-analytics
    - match: '/instance/'
      owners: team-growth
    - match: '/marketing-analytics/'
      owners: team-web-analytics
    - match: '/max/'
      owners: team-self-driving
    - match: '/models/'
      owners: team-data-modeling
    - match: '/notebooks/'
      owners: team-data-tools
    - match: ['/oauth/', '/onboarding/']
      owners: team-growth
    - match: '/onboarding/legacy/sdks/ai-observability/'
      owners: team-ai-observability
    - match: '/onboarding/legacy/sdks/surveys/'
      owners: conversations
    - match: ['/paths-v2/', '/paths/', '/persons-management/', '/persons/']
      owners: team-product-analytics
    - match: '/resource-transfer/'
      owners: team-platform-features
    - match: ['/retention/', '/saved-insights/']
      owners: team-product-analytics
    - match: '/session-recordings/'
      owners: team-replay
    - match: '/sessions/'
      owners: team-analytics-platform
    # Org SSO settings: verified domains, and the SAML/SCIM/OIDC config behind them.
    - match:
          - '/settings/organization/IdentityProviderConfig/'
          - '/settings/organization/VerifiedDomains/'
      owners: team-platform-features
    - match: '/startups/'
      owners: team-growth
    - match: '/surveys/'
      owners: conversations
    - match: ['/themes/', '/trends/']
      owners: team-product-analytics
    - match: '/web-analytics/'
      owners: team-web-analytics
    - match: '/welcome/'
      owners: team-growth
