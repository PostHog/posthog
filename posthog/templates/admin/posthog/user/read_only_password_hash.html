{% load i18n %}
<div{% include 'django/forms/widgets/attrs.html' %}>
    {% if not has_password %}
        <p><strong>{% translate "No password set." %}</strong></p>
    {% elif algorithm %}
        <p><strong>{% translate "algorithm" %}</strong>: <bdi>{{ algorithm }}</bdi></p>
    {% else %}
        <p><strong>{% translate "Invalid password format or unknown hashing algorithm." %}</strong></p>
    {% endif %}
    <p><a role="button"
   class="button"
   href="{{ password_url|default:"../password/" }}">{{ button_label }}</a></p>
</div>
