{# A Notice block with a tone. `tone` is a Tone value, so it matches a quill Item tone. #}
<div role="status"
     data-tone="{{ tone }}"
     class="quill-item quill-item--variant-outline quill-item--size-sm flex items-center gap-3 {% if tone == 'success' %}quill-item--tone-success{% elif tone == 'destructive' %}quill-item--tone-destructive{% elif tone == 'warning' %}quill-item--tone-warning{% else %}quill-item--tone-info{% endif %}">
    <div class="quill-item__content">
        <div class="quill-item__title font-normal">{{ text }}</div>
    </div>
</div>
