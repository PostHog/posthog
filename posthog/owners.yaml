version: 1
owners: []
rules:
    - match:
          - '/admin/console/member_email_migration.py'
          - '/admin/console/organization_sign_in_panels.py'
          - '/admin/test_organization_sign_in_panels.py'
      owners: team-platform-features
    - match: ['/user_analytics_deletion.py', '/test/test_user_analytics_deletion.py']
      owners: team-platform-features
    - match: '/caching/'
      owners: team-analytics-platform
    - match: '/clickhouse/hcl/'
      owners: clickhouse
    - match:
          - '/csp_middleware.py'
          - '/test/test_csp_middleware.py'
      owners: team-security
    - match: '/data_freshness.py'
      owners: team-platform-features
    - match: '/egress/'
      owners: team-devex
    - match: '/email.py'
      owners: team-workflows
    - match:
          - '/entitlements/'
          - '/temporal/entitlement_reactions/'
          - '/models/organization_entitlement_applied_state.py'
      owners: team-billing
    - match: '/heatmaps/'
      owners: team-web-analytics
    - match: '/hogql/'
      owners: team-data-tools
    - match:
          - '/inbox_providers.py'
          - '/test/test_inbox_providers.py'
      owners: team-growth
    - match: '/integrations/'
      owners: team-warehouse-sources
    - match:
          - '/llm/forecast_client.py'
          - '/llm/test_forecast_client.py'
      owners: team-apm
    - match: '/management/migration_analysis/'
      owners: team-devex
    # Each line acknowledges a risky migration, so one added line lets that migration skip the check.
    - match: '/management/migration_analysis/*_acknowledged_migrations.txt'
      sensitive: true
    - match:
          - '/management/commands/backfill_code_review_scopes.py'
          - '/management/commands/test/test_backfill_code_review_scopes.py'
      owners: team-devex
    - match: '/queries/'
      owners: team-analytics-platform
    - match: '/rbac/'
      owners: team-platform-features
    - match:
          - '/request_log_signal_handlers.py'
          - '/test/test_request_log_signal_handlers.py'
      owners: team-apm
    - match: '/slack/'
      owners: team-devex
    - match: '/taxonomy/'
      owners: team-product-analytics
    - match: '/templates/surveys/'
      owners: conversations
    - match: '/warehouse/'
      owners: team-data-stack
    - match: '*llm_gateway*'
      owners: team-agent-infrastructure
      sensitive: true
    - match: '*llm_prompt*.py'
      owners: team-experiments
    - match:
          - '/clickhouse/*_test.py'
          - '/user_scripts/*_test.py'
          - '/user_scripts/v10/*_test.py'
          - '/user_scripts/v11/*_test.py'
          - '/user_scripts/v12/*_test.py'
          - '/user_scripts/v13/*_test.py'
          - '/user_scripts/v5/*_test.py'
          - '/user_scripts/v6/*_test.py'
          - '/user_scripts/v7/*_test.py'
          - '/user_scripts/v8/*_test.py'
          - '/user_scripts/v9/*_test.py'
      owners: clickhouse
    - match:
          - '/taxonomic_search_intent/test_*.py'
      owners: platform-ux
    - match:
          - '/usage_ingestion/test_*.py'
      owners: team-billing
    - match:
          - '/async_migrations/examples/test_*.py'
          - '/async_migrations/test/test_*.py'
          - '/local_bootstrap/test_*.py'
          - '/management/migration_profiling/test/test_*.py'
          - '/ownership/test/test_*.py'
          - '/scheduling/test/test_*.py'
          - '/slo/test/test_*.py'
          - '/test/repo_invariants/test_*.py'
          - '/test/test_cascade_delete.py'
      owners: team-devex
    - match: '/test/repo_invariants/test_legacy_alert_configuration_reads.py'
      owners: team-apm
    - match: '/test/repo_invariants/test_temporal_workflow_catalog.py'
      owners: team-cloud-foundations
    - match: '/test/repo_invariants/test_warehouse_source_generated_config_inputs.py'
      owners: team-warehouse-sources
    - match:
          - '/test/repo_invariants/test_email_http_templates.py'
          - '/test/repo_invariants/test_message_preference_styles.py'
      owners: team-workflows
    - match: '/test/repo_invariants/test_ai_observability_sample_traces.py'
      owners: team-ai-observability
    - match: '/test/repo_invariants/test_aeo_mcp_tools.py'
      owners: team-web-analytics
    - match: '/test/repo_invariants/test_person_metadata_fields.py'
      owners: team-data-tools
    - match: '/test/repo_invariants/test_billing_usage_keys.py'
      owners: team-billing
    - match:
          - '/security/test/test_*.py'
      owners: team-security
    - match:
          - '/credentials_service/test/test_*.py'
      owners: team-warehouse-sources
    - match:
          - '/kafka_client/test/test_*.py'
          - '/personhog_client/test_*.py'
      owners: team-ingestion
    - match:
          - '/session/test/test_*.py'
          - '/test/test_breached_password_validator.py'
      owners: team-platform-features
    - match:
          - '/resource_limits/test/test_*.py'
          - '/schema_migrations/test/test_*.py'
      owners: team-product-analytics
    - match:
          - '/query_cache/test/test_*.py'
          - '/query_scan/test/test_*.py'
      owners: team-query-performance
    - match:
          - '/object_tags/test/test_*.py'
      owners: team-surfaces
    - match:
          - '/plugins/test/test_*.py'
      owners: team-workflows
