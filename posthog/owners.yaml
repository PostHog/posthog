version: 1
owners: []
rules:
    - match: '/caching/'
      owners: team-analytics-platform
    - match: '/clickhouse/hcl/'
      owners: clickhouse
    - match:
          - '/csp_middleware.py'
          - '/test/test_csp_middleware.py'
      owners: team-security
    - match: '/data_freshness.py'
      owners: team-platform-features
    - match: '/egress/'
      owners: team-devex
    - match: '/email.py'
      owners: team-platform-features
    - match: '/heatmaps/'
      owners: team-web-analytics
    - match: '/hogql/'
      owners: team-data-tools
    - match: '/integrations/'
      owners: team-warehouse-sources
    - match: '/management/migration_analysis/'
      owners: team-devex
    # Each line acknowledges a risky migration, so one added line lets that migration skip the check.
    - match: '/management/migration_analysis/*_acknowledged_migrations.txt'
      sensitive: true
    - match: '/queries/'
      owners: team-analytics-platform
    - match: '/rbac/'
      owners: team-platform-features
    - match: '/slack/'
      owners: team-devex
    - match: '/taxonomy/'
      owners: team-product-analytics
    - match: '/templates/surveys/'
      owners: conversations
    - match: '/warehouse/'
      owners: team-data-stack
    - match: '*llm_gateway*'
      owners: team-agent-infrastructure
      sensitive: true
    - match: '*llm_prompt*.py'
      owners: team-experiments
    - match:
          - '/clickhouse/*_test.py'
          - '/user_scripts/*_test.py'
          - '/user_scripts/v10/*_test.py'
          - '/user_scripts/v11/*_test.py'
          - '/user_scripts/v12/*_test.py'
          - '/user_scripts/v13/*_test.py'
          - '/user_scripts/v5/*_test.py'
          - '/user_scripts/v6/*_test.py'
          - '/user_scripts/v7/*_test.py'
          - '/user_scripts/v8/*_test.py'
          - '/user_scripts/v9/*_test.py'
      owners: clickhouse
    - match:
          - '/taxonomic_search_intent/test_*.py'
      owners: platform-ux
    - match:
          - '/usage_ingestion/test_*.py'
      owners: team-billing
    - match:
          - '/async_migrations/examples/test_*.py'
          - '/async_migrations/test/test_*.py'
          - '/local_bootstrap/test_*.py'
          - '/management/migration_profiling/test/test_*.py'
          - '/ownership/test/test_*.py'
          - '/scheduling/test/test_*.py'
          - '/slo/test/test_*.py'
      owners: team-devex
    - match:
          - '/kafka_client/test/test_*.py'
          - '/personhog_client/test_*.py'
      owners: team-ingestion
    - match:
          - '/session/test/test_*.py'
      owners: team-platform-features
    - match:
          - '/resource_limits/test/test_*.py'
          - '/schema_migrations/test/test_*.py'
      owners: team-product-analytics
    - match:
          - '/query_cache/test/test_*.py'
          - '/query_scan/test/test_*.py'
      owners: team-query-performance
    - match:
          - '/object_tags/test/test_*.py'
      owners: team-surfaces
    - match:
          - '/plugins/test/test_*.py'
      owners: team-workflows
