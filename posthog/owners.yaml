version: 1
owners: []
rules:
    - match: '/caching/'
      owners: team-analytics-platform
    - match:
          - '/clickhouse/*'
          - '/clickhouse/hcl/'
          - '/user_scripts/'
      owners: clickhouse
    - match:
          - '/csp_middleware.py'
          - '/test/test_csp_middleware.py'
      owners: team-security
    - match:
          - '/data_freshness.py'
          - '/session/'
      owners: team-platform-features
    - match:
          - '/async_migrations/'
          - '/egress/'
          - '/local_bootstrap/'
          - '/management/migration_profiling/'
          - '/ownership/'
          - '/scheduling/'
          - '/slo/'
      owners: team-devex
    - match: '/email.py'
      owners: team-platform-features
    - match: '/heatmaps/'
      owners: team-web-analytics
    - match: '/hogql/'
      owners: team-data-tools
    - match: '/integrations/'
      owners: team-warehouse-sources
    - match: '/management/migration_analysis/'
      owners: team-devex
    # Each line acknowledges a risky migration, so one added line lets that migration skip the check.
    - match: '/management/migration_analysis/*_acknowledged_migrations.txt'
      sensitive: true
    - match: '/queries/'
      owners: team-analytics-platform
    - match: '/rbac/'
      owners: team-platform-features
    - match: '/slack/'
      owners: team-devex
    - match:
          - '/resource_limits/'
          - '/schema_migrations/'
          - '/taxonomy/'
      owners: team-product-analytics
    - match: '/templates/surveys/'
      owners: conversations
    - match: '/warehouse/'
      owners: team-data-stack
    - match: '*llm_gateway*'
      owners: team-agent-infrastructure
      sensitive: true
    - match: '*llm_prompt*.py'
      owners: team-experiments
    - match: '/taxonomic_search_intent/'
      owners: platform-ux
    - match: '/usage_ingestion/'
      owners: team-billing
    - match:
          - '/kafka_client/'
          - '/personhog_client/'
      owners: team-ingestion
    - match:
          - '/query_cache/'
          - '/query_scan/'
      owners: team-query-performance
    - match: '/object_tags/'
      owners: team-surfaces
    - match: '/plugins/'
      owners: team-workflows
