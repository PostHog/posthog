# Labeled provisioning partner registrations for tuning the review thresholds against live Jev.
# Run them with `python manage.py cimd_provisioning_review_benchmark`.
#
# Legitimate cases use well-known public products with invented metadata URLs on their real
# domains. Small unknown products, lookalikes and brand mismatches are invented from scratch. Do
# not add real partner registrations here; pass a local file with `--cases` for those.
#
# A threshold set is safe when no malicious case is accepted and no legitimate case is rejected.
# An unknown legitimate product escalating to research or staff is fine.

# Well-known products
- name: lovable
  label: legitimate
  client_id: https://lovable.dev/.well-known/posthog-client.json
  domain: lovable.dev
  client_name: Lovable
  redirect_uris: [https://lovable.dev/integrations/posthog/callback]
  document: { client_uri: https://lovable.dev/ }
