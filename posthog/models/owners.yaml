version: 1
owners: []
rules:
    - match: '/action/'
      owners: team-product-analytics
    - match: '/activity_logging/'
      owners: team-platform-features
    # Registering an activity-log tuning module is mechanical, and the activity log's owners
    # reviewing every product's registration would put them back in the path of every tuning
    # change. The repo invariant test beside this file is what keeps the list honest.
    - match: '/activity_logging/activity_log_config_registry.py'
      owners: null
    - match: '/ai/'
      owners: team-self-driving
    - match: '/ai_events/'
      owners: team-ai-observability
    - match: '/channel_type/'
      owners: team-web-analytics
    - match: '/cohortmembership/'
      owners: team-feature-flags
    - match: '/comment/'
      owners: conversations
    - match: '/messaging.py'
      owners: team-workflows
    - match: ['/oauth.py', '/oauth_provisioning_review.py', '/oauth_activity_log_config.py']
      owners: team-growth
    - match: '/person/'
      owners: team-ingestion
    - match: '/proxy_record.py'
      owners: team-platform-features
    - match: '/raw_sessions/'
      owners: team-analytics-platform
    - match: '/resource_transfer/'
      owners: team-platform-features
    - match: '/sessions/'
      owners: team-analytics-platform
    - match: '/web_preaggregated/'
      owners: team-web-analytics
    - match:
          - '/file_system/test/test_*.py'
      owners: platform-ux
    - match:
          - '/usage_report_events_preagg/test/test_*.py'
      owners: team-billing
    - match:
          - '/scoping/test_*.py'
      owners: team-devex
    - match:
          - '/distinct_id_usage/test/test_*.py'
          - '/tophog/test/test_*.py'
      owners: team-ingestion
    - match:
          - '/exchange_rate/test/test_*.py'
          - '/person_group_membership/test/test_*.py'
      owners: team-web-analytics
